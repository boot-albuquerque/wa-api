# golangci-lint v2 configuration for wa-api.
# Lints the whole module: ./... including cmd/ (package main).
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 10

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 2m
  tests: true
