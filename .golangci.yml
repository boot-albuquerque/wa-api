# golangci-lint v2 configuration for wa-api.
# Lints the whole module: ./... including cmd/ (package main).
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - forbidigo
  settings:
    gocyclo:
      min-complexity: 10
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: escreva pelo logger estruturado; stdout direto escapa da redação de segredo
        - pattern: ^os\.Stdout$
          msg: escreva pelo logger estruturado; stdout direto escapa da redação de segredo
  exclusions:
    rules:
      # Fronteiras onde stdout é o contrato, não um vazamento: os binários,
      # o transporte JSON-RPC e a construção do próprio sink do logger.
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^pkg/infra/stdio/
        linters: [forbidigo]
      - path: ^pkg/bootstrap/(main|router_setup)\.go$
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 2m
  tests: true

issues:
  # Both default to a low cap (max-same-issues: 3) that silently truncates
  # the reported count for any linter with many hits of the same message —
  # exactly what the lint/check Makefile targets parse to compare against
  # .golangci-baseline. Uncapped here so the baseline reflects the real
  # issue count, not a truncated sample.
  max-issues-per-linter: 0
  max-same-issues: 0
