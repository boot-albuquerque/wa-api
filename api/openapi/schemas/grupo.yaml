# Grupo: Grupos.
#
# SEMÂNTICA DE PRESENÇA — a regra que vale para TODO campo de pedido desta
# família, medida em 2026-08-26 e não teórica:
#
#   Nenhuma struct de pedido de grupo — nem as do domínio, nem as onze
#   anónimas de `handler_group_mgmt.go` — usa PONTEIRO em campo nenhum. Logo o
#   `encoding/json` do Go trata `null` como *nada a fazer*, e o campo fica com
#   o valor zero. Consequência, para todos eles:
#
#     ausente  ≡  `null`  ≡  `""` (texto)  ≡  `false` (booleano)  ≡  `[]`/`null` (lista)
#
#   Os quatro estados são INDISTINGUÍVEIS para o servidor. Nenhum campo desta
#   família é `nullable: true` no pedido, e nenhum consegue exprimir "não
#   decidi". Só o TIPO ERRADO é distinguido: `{"group_jid":123}` devolve
#   `400 could_not_decode_payload` (medido).
#
#   Não há `trim` em lado nenhum (`ARMADILHAS.md`, secção 3.2 do contrato
#   arquitetural): `"   "` PASSA a guarda `== ""` e segue para o parser de
#   JID, que o recusa com `invalid_jid`. É um erro DIFERENTE do de campo em
#   falta, e por vezes num envelope diferente.
#
#   Campo desconhecido é ignorado, e REGISTADO no log — medido:
#   `POST /group/info {"group_jid":"…","campo_inexistente":"lixo"}` devolve
#   `200`. Um erro de escrita no nome de um campo não dá erro: dá o valor zero.
#
# `InfoGrupo` e `ParticipanteGrupo` (sem sufixo) existiram aqui como registo do
# formato ANTERIOR — a struct de protocolo do wa-noise servida directamente,
# sem DTO, PascalCase no fio — e foram REMOVIDOS nesta sessão (F335): eram
# schemas ÓRFÃOS, sem `$ref` algum no documento (confirmado por grep antes da
# remoção), e a sua presença só servia para o gate de nomenclatura (F330)
# falhar contra um formato que a API já não serve há várias sessões. A forma
# viva é `InfoGrupoCanonico`/`ParticipanteGrupoCanonico`, produzida por
# `PresentGroupInfo` (`pkg/presentation/http/dto/group/presenter.go`).

SolicitacaoEntrada:
  type: object
  description: |
    Um pedido de entrada pendente, devolvido por
    `GET /group/requestparticipants`. O corpo é
    `dtogroup.GroupJoinRequestResponse`
    (`pkg/presentation/http/dto/group/group.go`), produzido por
    `PresentGroupJoinRequest` — não mais a struct de protocolo serializada
    directamente.

    **A forma não foi observada com dados**: os dois grupos disponíveis não
    tinham pedidos pendentes, e todas as chamadas medidas devolveram `[]`. As
    descrições de campo abaixo ainda reflectem o que era conhecido do tipo de
    protocolo antes da migração, não uma nova medição.
  required: [jid, requested_at, added_by_jid, method]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        Quem pediu para entrar. **Sempre presente** quando houver uma entrada,
        nunca `null` nem omitido — o DTO não usa `omitempty`. **Não observado
        com dados.**
      example: 554192421234@s.whatsapp.net
    requested_at:
      type: string
      format: date-time
      nullable: true
      description: |
        Quando o pedido foi feito. `null`, e nunca
        `"0001-01-01T00:00:00Z"`, quando o motor não relata o momento — ver
        `presentTime` em `docs/HTTP-DTO-CONVENTIONS.md` §5. **Não observado
        com dados.**
      example: '2026-08-26T08:42:47-04:00'
    added_by_jid:
      type: string
      nullable: false
      description: |
        Quem adicionou o solicitante. `""` quando ninguém o fez — um pedido
        feito ao seguir um link de convite não tem quem o adicionou. **Não
        observado com dados.**
      example: ''
    method:
      type: string
      nullable: false
      description: |
        Como o pedido chegou (`InviteLink` para um convite). `""` quando o
        motor não o relata. **Não observado com dados.**
      example: InviteLink

AlvoGrupo:
  type: object
  description: |
    O grupo sobre o qual a operação age. Usado por `POST /group/info`,
    `POST /group/invitelink` e `POST /group/leave`. O nome específico da rota
    tem precedência sobre `chat` quando os dois vierem
    (`pkg/domain/chat_target.go:14-17`) — medido: `{"group_jid":"<grupo>",
    "chat":"nonsense"}` devolve `200`, porque `chat` nem é olhado.

    **Nenhum dos dois campos é ponteiro**, logo ausente, `null` e `""` são o
    mesmo pedido. O que muda entre eles é apenas o NOME.

    **O nome do campo é `group_jid` em toda a família**, uniformemente: a
    migração para DTO (`docs/HTTP-DTO-CONVENTIONS.md`) fechou a variação de
    grafia (`groupJID` vs `groupjid`) que esta secção documentava antes —
    cada rota lê agora o mesmo DTO de pedido tipado, com a mesma etiqueta
    `json:"group_jid"`.

    Campos desconhecidos são IGNORADOS em silêncio.
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo, na forma `<número>@g.us`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não — salvo se `chat` vier | `/group/info` e `/group/invitelink`: `400 missing_group_jid` (recusa tipada, do use case); `/group/leave`: `400 invalid_request` (objecto canónico, do manipulador — `rejectMissingField`) |
        | `null` | não | idêntico a ausente — **indistinguível** |
        | `""` | não | idêntico a ausente — **indistinguível** |
        | `"   "` | **passa a guarda** | `400 invalid_group_jid` — erro DIFERENTE, porque não há `trim` |
        | `120363411669320145` (número nu) | não | `400 invalid_group_jid` — medido; o sufixo `@g.us` é obrigatório |
        | `554192421234@s.whatsapp.net` | não | **medido em `/group/info`: `500` ao fim de ~75 s**, e não `400`. Um JID de contacto não é recusado por validação; vai ao WhatsApp e a chamada fica pendurada |
        | `120363411669320145@g.us` | sim | — |
        | tipo errado (`123`) | não | `400 could_not_decode_payload` |
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino, aceite em toda a API. **Só é lido quando
        `group_jid` estiver vazio** (`ResolveChatField`); os dois juntos e
        diferentes fazem ganhar `group_jid` — medido.

        Ausente, `null` e `""` são indistinguíveis, e valem "não usar o
        alias". As mesmas regras de forma de `group_jid` valem para o valor.
      example: 120363411669320145@g.us

PedidoCriarGrupo:
  type: object
  description: |
    Criação de grupo, de comunidade ou de sub-grupo dentro de comunidade — as
    três saem desta mesma rota, e o que as distingue são `is_parent` e
    `linked_parent_jid`.

    **Todas as recusas desta rota saem no objecto canónico**
    `{"code":"invalid_request","message":"Requisição inválida."}`
    (`docs/HTTP-DTO-CONVENTIONS.md` §7) — o manipulador não usa códigos de erro
    próprios aqui. As SEIS causas distintas — `name` em falta, `participants`
    em falta, `participants` vazio, entrada vazia em `participants`,
    `is_parent` com `linked_parent_jid` — produzem corpos IDÊNTICOS. O cliente
    não consegue saber qual campo falhou; a causa fica só no log do servidor.

    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  required: [name]
  properties:
    name:
      type: string
      nullable: false
      minLength: 1
      description: |
        Nome do grupo.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` |
        | `null` | não | idêntico a ausente — **indistinguível** |
        | `""` | não | idêntico a ausente — **indistinguível** |
        | `"   "` | **sim** | aceite tal e qual; **não há `trim`**, e o grupo fica com um nome de três espaços |
        | preenchido | sim | — |

        Não há limite de comprimento imposto por esta API; o do WhatsApp não
        foi determinado com segurança pela implementação atual.
      example: Equipa de entregas
    participants:
      type: array
      nullable: false
      minItems: 1
      description: |
        Participantes iniciais, além da própria conta. Aceita o número nu
        (`554192421234`) tanto quanto o JID completo — a resolução é feita por
        `ResolveJID`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | **depende** | com `is_parent: true`, sim; senão `400 invalid_request` |
        | `null` | igual a ausente | **indistinguível** — medido |
        | `[]` | igual a ausente | **indistinguível** — a guarda é `len(...) < 1` |
        | `[""]` | não | `400 invalid_request`; o log diz o ÍNDICE, a resposta não |
        | `["554192421234", ""]` | não | recusa a lista INTEIRA — não há descarte silencioso de item |
        | `["   "]` | passa a guarda | `400 invalid_jid` — `"   "` não é `""` |
        | `["nao-e-jid"]` | não | `400 invalid_jid`, com o valor citado na mensagem |
        | preenchido | sim | — |

        **Item inválido nunca é descartado em silêncio**: ou a lista toda
        passa, ou o pedido é recusado. Duplicados não são detectados por esta
        API. A ordem não é significativa.

        Participante que o WhatsApp recuse INDIVIDUALMENTE é o único caso
        parcial: o pedido devolve `200` e a entrada volta em `Participants`
        com `Error` diferente de zero.
      items:
        type: string
        nullable: false
        description: |
          Número nu ou JID completo do participante. Nunca `null` — um `null`
          dentro da lista vira `""` e é recusado como entrada vazia.
        example: 554192421234@s.whatsapp.net
      example: [554192421234@s.whatsapp.net]
    is_parent:
      type: boolean
      nullable: false
      default: false
      description: |
        Cria uma COMUNIDADE em vez de um grupo. O WhatsApp cria sozinho o
        sub-grupo de avisos, que aparece depois em `POST /group/list` com
        `IsDefaultSubGroup: true`.

        | estado | efeito |
        |---|---|
        | ausente | `false` — grupo normal, e `participants` passa a ser obrigatório |
        | `null` | `false` — **indistinguível de ausente**; um `null` num booleano Go não-ponteiro é `false` em silêncio |
        | `false` | idêntico a ausente |
        | `true` | comunidade; `participants` deixa de ser exigido |
        | `"sim"` (texto) | `400 could_not_decode_payload` — medido |

        Mutuamente exclusivo com `linked_parent_jid`: `is_parent: true` com
        `linked_parent_jid` NÃO VAZIO devolve `400` sem chegar ao WhatsApp.
        Repare na assimetria — a guarda é `req.IsParent && req.LinkedParentJID
        != ""` (`handler_group_mgmt.go:120`), logo `is_parent: true` com
        `linked_parent_jid: ""` PASSA, porque `""` é indistinguível de
        ausente.
      example: false
    linked_parent_jid:
      type: string
      nullable: false
      description: |
        Cria o grupo já dentro desta comunidade.

        | estado | efeito |
        |---|---|
        | ausente | grupo solto |
        | `null` | idêntico a ausente — **indistinguível** |
        | `""` | idêntico a ausente — **indistinguível**, e é o que faz a exclusão mútua com `is_parent` não disparar |
        | preenchido, com `is_parent: true` | `400 invalid_request` |
        | preenchido, sem `is_parent` | sub-grupo da comunidade indicada |

        Um valor mal formado não é validado por esta API: segue para
        `ResolveJID` e a recusa chega como `400 invalid_jid`.
      example: 120363430034334401@g.us

PedidoEntrarGrupo:
  type: object
  description: |
    **A struct de domínio mente aqui.** `GroupJoinRequest`
    (`pkg/domain/group.go:52-54`) declara `inviteLink`, e não é o que a rota
    lê: o corpo é `dtogroup.JoinGroupRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `code`. Um cliente
    escrito a partir do domínio recebe `400`, porque `inviteLink` é um campo
    DESCONHECIDO nesta rota, é ignorado (e registado no log como
    `unknown field "inviteLink"`), e `code` fica `""`.

    Este é o custo concreto de campo desconhecido não dar erro: o nome errado
    não se queixa de si próprio — queixa-se do campo certo estar em falta.
  required: [code]
  properties:
    code:
      type: string
      nullable: false
      minLength: 1
      description: |
        O código NU do convite, sem o `https://chat.whatsapp.com/` à frente —
        é a forma que a bateria de campo mediu.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` — objecto canónico `error.code`/`error.message` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `"   "` | **passa a guarda** | não há `trim`; segue para o WhatsApp. Por analogia com `/group/inviteinfo`, onde foi MEDIDO, o desfecho é `500`, não `400` |
        | `inviteLink` em vez de `code` | não | `400 invalid_request` — campo desconhecido; ignorado, mas o log nomeia-o |
        | código válido | sim | — |

        O URL completo também passa, porque a biblioteca corta o prefixo
        (`internal/wa-noise/capabilities/group/invite.go:105`), mas isso não
        foi medido nesta rota e o nome do campo continua a ser `code`.

        Repare que `POST /group/invitelink` devolve o **link inteiro**, e não
        o código: alimentar essa resposta directamente aqui depende do corte
        de prefixo, não do contrato.
      example: IVccRoDVSbpHKNkgNxyZx4

PedidoInfoConvite:
  type: object
  description: |
    Inspecção de um convite. O corpo é `dtogroup.GetGroupInviteInfoRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `json:"code"`
    minúsculo — não mais a struct de domínio com `Code` maiúsculo que este
    ficheiro descrevia antes da migração para DTO
    (`docs/HTTP-DTO-CONVENTIONS.md`). `inviteLink` continua a ser campo
    desconhecido e é ignorado.
  required: [code]
  properties:
    code:
      type: string
      nullable: false
      minLength: 1
      description: |
        Código do convite.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_code` — envelope NOVO, com `error.code` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `"   "` | **passa a guarda** | **medido: `500 internal server error`**, não `400`. Não há `trim`, e o valor segue para o WhatsApp |
        | código inexistente | não | **medido: `500`** — o use case embrulha o erro com `fmt.Errorf` e a recusa perde a taxonomia (`get_group_invite_info.go:44`) |
        | `IVccRoDVSbpHKNkgNxyZx4` | sim | — |
        | `https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4` | **sim** | medido `200`; a biblioteca corta o prefixo (`internal/wa-noise/capabilities/group/invite.go:83`) |
      example: IVccRoDVSbpHKNkgNxyZx4

PedidoNomeGrupo:
  type: object
  description: |
    Novo nome de um grupo. O corpo é `dtogroup.SetGroupNameRequest`
    (`pkg/presentation/http/dto/group/request.go`).

    **Só `name` é validado no manipulador.** Um pedido sem grupo passa a
    validação e falha mais à frente, na resolução do JID: `name` em falta dá
    `error.code = invalid_request` (objecto canónico, sem taxonomia própria),
    grupo em falta ou inválido dá `error.code = invalid_jid`.
  required: [name]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não — salvo se `chat` vier | **medido**: `400 invalid_jid`, `could not parse JID ""` — envelope NOVO, e NÃO `missing_group_jid` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `"   "` | não | `400 invalid_jid` com o valor citado |
        | número nu | não | `400 invalid_jid` |
        | `120363411669320145@g.us` | sim | — |
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só é lido quando `group_jid` estiver vazio.
        Ausente, `null` e `""` são indistinguíveis e valem "não usar o alias".
      example: 120363411669320145@g.us
    name:
      type: string
      nullable: false
      minLength: 1
      description: |
        O novo nome — e o ÚNICO campo que este manipulador valida.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente**. Não há forma de LIMPAR o nome por esta rota |
        | `"   "` | **sim** | aceite tal e qual; **não há `trim`** |
        | preenchido | sim | — |
      example: Equipa de entregas — turno da manhã

PedidoTopicoGrupo:
  type: object
  description: |
    Nova descrição de um grupo. O corpo é `dtogroup.SetGroupTopicRequest`
    (`pkg/presentation/http/dto/group/request.go`). Tal como em
    `/group/name`, só o campo de conteúdo é validado.
  required: [topic]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Ausente, `null` e `""` são indistinguíveis e levam a
        `400 invalid_jid` (`could not parse JID ""`) — envelope NOVO — e não a
        um erro de campo obrigatório. `chat` cobre a ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    topic:
      type: string
      nullable: false
      minLength: 1
      description: |
        A nova descrição.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** — **não há forma de APAGAR a descrição por esta rota**: o vazio é recusado, não interpretado como limpeza |
        | `"   "` | **sim** | aceite tal e qual; **não há `trim`**. É o mais perto de "apagar" que a rota permite |
        | preenchido | sim | — |
      example: Combinações de rota do turno da manhã

PedidoFotoGrupo:
  type: object
  description: |
    Foto de grupo. **Duas armadilhas medidas, e as duas com uma variável de
    cada vez.** O corpo é `dtogroup.SetGroupPhotoRequest`
    (`pkg/presentation/http/dto/group/request.go`); só `photo` é validado.
  required: [photo]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Não é validado pelo manipulador: ausente, `null` e `""`
        são indistinguíveis e chegam ao parser de JID, que devolve
        `400 invalid_jid` — envelope NOVO. `chat` cobre a ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    photo:
      type: string
      format: byte
      nullable: false
      minLength: 1
      description: |
        A imagem em base64 **CRU**, sem o prefixo `data:image/jpeg;base64,`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente**. Para REMOVER a foto a rota é `POST /group/photo/remove`, não o envio de vazio |
        | `"   "` | não | passa a guarda `== ""` e morre no descodificador base64: `400` — **mas com o MESMO corpo `invalid_request`** |
        | `data:image/jpeg;base64,…` | **não** | `400` — medido; o descodificador recusa os `:` e `;` do URI de dados |
        | base64 inválido | não | `400`, **corpo idêntico ao de campo em falta** |
        | JPEG em base64 cru | sim | — |
        | PNG em base64 cru | não | bem descodificado aqui e recusado pelo WhatsApp: `422 upstream_rejected` |

        **As quatro causas de `400` desta rota produzem o mesmo corpo**
        — `{"code":400,"error":{"code":"invalid_request","message":"Requisição inválida."},"success":false}` — porque a
        falha de base64 também sai por `RespondJSON` com erro não-tipado
        (`handler_group_mgmt.go:249`). Nem sequer se distingue "não mandei
        foto" de "mandei com prefixo `data:`".

        **Isto diverge de `/chat/send/image`**, que ACEITA o URI de dados. As
        duas rotas recebem imagem e só uma aceita o prefixo.
      example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA==

PedidoAnuncioGrupo:
  type: object
  description: |
    Alterna o modo em que só administradores enviam mensagens. O corpo é
    `dtogroup.SetGroupAnnounceRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
    `announce`.

    **O manipulador não valida campo nenhum.**
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
        parser: **medido `400 invalid_jid`, `could not parse JID ""`** —
        envelope NOVO. `chat` cobre a ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    announce:
      type: boolean
      nullable: false
      default: false
      description: |
        `true` fecha o grupo à escrita de não-administradores.

        | estado | efeito |
        |---|---|
        | ausente | **ABRE o grupo** — o valor zero de um `bool` Go é `false`, e `false` aqui é uma ACÇÃO |
        | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
        | `false` | abre o grupo |
        | `true` | fecha o grupo |

        **Não é consulta.** Um pedido só com o grupo, escrito por quem
        esperava "não decidi", DESLIGA o modo anúncio. É o mecanismo da F268
        num booleano: o campo devia ser `*bool` para que ausente e `false` se
        distinguissem. Para LER o estado, use `IsAnnounce` de
        `POST /group/info`.
      example: true

PedidoTrancarGrupo:
  type: object
  description: |
    Alterna o modo em que só administradores editam os metadados. O corpo é
    `dtogroup.SetGroupLockedRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
    `locked`.

    **O manipulador não valida campo nenhum.**
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
        parser: **medido `400 invalid_jid`** — envelope NOVO. `chat` cobre a
        ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    locked:
      type: boolean
      nullable: false
      default: false
      description: |
        `true` impede não-administradores de mudar nome, descrição e foto.

        | estado | efeito |
        |---|---|
        | ausente | **DESTRANCA** o grupo |
        | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
        | `false` | destranca |
        | `true` | tranca |

        **Não é consulta**, pela mesma razão de `announce`. Para LER, use
        `IsLocked` de `POST /group/info`.
      example: true

PedidoTemporizadorGrupo:
  type: object
  description: |
    Mensagens temporárias do grupo. O corpo é
    `dtogroup.SetDisappearingTimerRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
    `duration`.

    **O manipulador não valida campo nenhum.**
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
        parser: **medido `400 invalid_jid`, `could not parse JID ""`**. `chat`
        cobre a ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    duration:
      type: string
      nullable: false
      description: |
        Duração das mensagens temporárias. Só TRÊS valores são reconhecidos:
        `24h`, `7d` e `90d` (`group_management.go:229-241`).

        | estado | efeito |
        |---|---|
        | ausente | **DESLIGA** o temporizador, com `200` |
        | `null` | idêntico a ausente — **indistinguível** |
        | `""` | idêntico a ausente — **indistinguível** |
        | `24h` / `7d` / `90d` | liga com a duração pedida |
        | `off` | desliga — mas por cair no ramo por omissão, não por ser reconhecido |
        | `24H`, `1d`, `"   "`, qualquer outro | **DESLIGA em silêncio**, com `200` |

        **Não é `enum` por isto**: um valor fora da lista não é recusado, é
        ACEITE e muda o estado. Declarar `enum` prometeria uma validação que
        não existe. O código chama-lhe regra preservada do upstream e regista
        um aviso no log; **do lado do cliente não há nada que distinga
        "desliguei" de "escrevi mal"** — as duas respostas são
        `200 {Details: Disappearing timer set}`.

        Para desligar de propósito, `off` serve tão bem como qualquer outro
        valor não reconhecido. Para LER o estado, use `DisappearingTimer` de
        `POST /group/info`, que vem em SEGUNDOS.
      example: 24h

PedidoAtualizarParticipantes:
  type: object
  description: |
    Adiciona ou remove membros. O corpo é
    `dtogroup.UpdateGroupParticipantsRequest`
    (`pkg/presentation/http/dto/group/request.go`), com `group_jid`, `phone` e
    `action`.

    **A ORDEM da validação importa e é surpreendente**
    (`handler_group_mgmt.go:289-304`): `phone` → entrada vazia de `phone` →
    `action` → `group_jid`. Um pedido a que falte TUDO queixa-se primeiro dos
    telefones, e o grupo é o ÚLTIMO a ser exigido.

    **As quatro recusas do manipulador saem no mesmo corpo**
    `{"code":400,"error":{"code":"invalid_request","message":"Requisição inválida."},"success":false}`
    — nenhuma delas tem código próprio. Só as recusas que atravessam o use
    case — `invalid_jid`, `invalid_action` — trazem um `error.code`
    específico.

    Veja a limitação de `Action`: promover e despromover NÃO estão nesta rota.
  required: [group_jid, phone, action]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Obrigatório, mas validado **DEPOIS** de `Phone` e de
        `Action`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não — salvo se `chat` vier | `400 invalid_request`, e só depois de `phone` e `action` passarem |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `"   "` | passa a guarda | `400 invalid_jid` (envelope NOVO) — medido |
        | `120363411669320145@g.us` | sim | — |
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio —
        medido a funcionar nesta rota. Ausente, `null` e `""` são
        indistinguíveis.
      example: 120363411669320145@g.us
    phone:
      type: array
      nullable: false
      minItems: 1
      description: |
        Quem entra ou sai. **É o PRIMEIRO campo validado.**

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request` |
        | `null` | não | **indistinguível de ausente** — medido |
        | `[]` | não | **indistinguível de ausente** — a guarda é `len(...) < 1` |
        | `[""]` | não | `400 invalid_request`; o log diz o ÍNDICE, a resposta não |
        | `["554192421234", ""]` | não | recusa a lista INTEIRA — **não há descarte silencioso de item** |
        | `["   "]` | passa a guarda | `400 invalid_jid`, `could not parse JID "   "` — medido |
        | `["554192421234"]` | **sim** | número nu é aceite — medido a passar da resolução |
        | `["554192421234@s.whatsapp.net"]` | sim | — |

        **Aceita o número nu**, o que é uma diferença face a
        `POST /group/updaterequestparticipants`, que exige o JID completo.

        Duplicados não são detectados por esta API. A ordem não é
        significativa.
      items:
        type: string
        nullable: false
        description: |
          Número nu ou JID completo do participante. Nunca `null` — um `null`
          dentro da lista vira `""` e é recusado como entrada vazia, com o
          índice no log.
        example: 554192421234@s.whatsapp.net
      example: [554192421234@s.whatsapp.net]
    action:
      type: string
      enum: [add, remove, promote, demote]
      nullable: false
      description: |
        O que fazer com os participantes indicados.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 invalid_request`, e só depois de `phone` passar |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `add` / `remove` / `promote` / `demote` | sim | — |
        | `ADD` | **não** | `400 invalid_action` — medido; **é sensível a maiúsculas** |
        | qualquer outro valor | não | `400 invalid_action`, com o valor citado: `unknown participant action "..." (must be "add", "remove", "promote" or "demote")` |

        **Valor fora da lista é sempre RECUSADO**, nunca ignorado nem tratado
        como padrão. Não há valor por omissão.

        `promote` e `demote` foram corrigidos em F263: a biblioteca por baixo
        já sabia promover e despromover há anos
        (`internal/wa-noise/capabilities/group/participants.go:18-19`); só a
        rota não os expunha. `pkg/domain/group.go` ganhou
        `ParticipantPromote`/`ParticipantDemote`, o use case
        (`pkg/application/usecase/group/group_management.go`) passou a aceitar
        os dois valores, e o adaptador
        (`pkg/infra/wa-noise/adapters/group/participants.go`) trocou o
        mapeamento binário add/remove por um `switch` exaustivo sobre as
        quatro ações.
      example: add

PedidoModoAprovacao:
  type: object
  description: |
    Exigir, ou deixar de exigir, aprovação para entrar. Usa a struct de
    DOMÍNIO (`pkg/domain/group_request.go:38-42`) — não há struct anónima
    aqui. O campo do grupo é `group_jid`, todo em minúsculas.

    As recusas saem no envelope NOVO, com `error.code`.
  required: [group_jid]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não — salvo se `chat` vier | `400 missing_group_jid` (envelope NOVO) — medido |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** — medido, mesmo corpo |
        | `"   "` | passa a guarda | `400 invalid_group_jid` |
        | `nao-e-jid` | não | `400 invalid_group_jid` — medido |
        | `120363411669320145@g.us` | sim | — |
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
    mode:
      type: boolean
      nullable: false
      default: false
      description: |
        `true` passa a exigir aprovação para entrar.

        | estado | efeito |
        |---|---|
        | ausente | **DESLIGA** a exigência — um pedido só com `group_jid` ABRE o grupo |
        | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
        | `false` | desliga a exigência |
        | `true` | passa a exigir |

        **Não é consulta.** É o mesmo mecanismo de `announce` e de `locked`:
        `false` aqui é uma ACÇÃO, e o campo devia ser `*bool` para que
        ausente e `false` se distinguissem. Para LER o estado, use
        `IsJoinApprovalRequired` de `POST /group/info`.
      example: true

PedidoSolicitacoesEntrada:
  type: object
  description: |
    Corpo de `GET /group/requestparticipants`. Um `GET` com corpo é servido
    pelo `curl` mas quebra clientes que assumem que `GET` não o tem — use os
    parâmetros de query `?group_jid=` ou `?chat=`, que foram medidos a
    funcionar igualmente.

    **Este é o único pedido da família em que a AUSÊNCIA DE CORPO se
    distingue de um corpo vazio**, e a distinção é enganadora:

    | pedido | resposta medida |
    |---|---|
    | sem corpo e sem query | `400 could_not_decode_payload` — a causa REAL é o grupo em falta, não o corpo |
    | `{"group_jid":null}` | `400 missing_group_jid` — a mensagem certa |
    | `{}` sem query | `400 missing_group_jid` |
    | `?group_jid=<grupo>` sem corpo | `200` |
    | corpo que NÃO é JSON, com `?group_jid=` | `200` — o erro de descodificação é PERDOADO quando a query traz o grupo (`handler_group.go:47-63`) |
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo, no CORPO. Ausente, `null` e `""` são indistinguíveis e
        fazem o manipulador cair para `?group_jid=` e depois para `?chat=`.
        Se nenhuma das três vias trouxer o grupo, a resposta é
        `400 missing_group_jid` — ou `400 could_not_decode_payload` quando o
        corpo também não for JSON válido, incluindo o corpo VAZIO.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino, no corpo. Só lido quando `group_jid`
        estiver vazio; ausente, `null` e `""` são indistinguíveis. Medido a
        funcionar sozinho: `{"chat":"<grupo>"}` devolve `200`.
      example: 120363411669320145@g.us

PedidoDecidirSolicitacoes:
  type: object
  description: |
    Aprova ou rejeita pedidos de entrada pendentes. Usa a struct de DOMÍNIO
    (`pkg/domain/group_request.go:23-27`).

    **Todas as recusas saem no envelope NOVO**, com `error.code` — esta rota
    não passa por `rejectMissingField`. A ordem medida é `group_jid` → `Phone`
    → `Action` → resolução do grupo → resolução dos telefones → validação de
    `Action` contra a lista; ou seja, o inverso da ordem de
    `POST /group/updateparticipants`.
  required: [group_jid, phone, action]
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. **É o PRIMEIRO campo validado.**

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não — salvo se `chat` vier | `400 missing_group_jid` — medido |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `"   "` | passa a guarda | `400 invalid_group_jid` |
        | `120363411669320145@g.us` | sim | — |
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio —
        medido a funcionar nesta rota. Ausente, `null` e `""` são
        indistinguíveis.
      example: 120363411669320145@g.us
    phone:
      type: array
      nullable: false
      minItems: 1
      description: |
        Os solicitantes a decidir.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_phone` — medido |
        | `null` | não | **indistinguível de ausente** |
        | `[]` | não | **indistinguível de ausente** — medido, mesmo corpo |
        | `[""]` | não | `400 invalid_phone` — passa a guarda de comprimento e morre na resolução; **não há verificação de entrada vazia nesta rota**, ao contrário de `/group/updateparticipants` |
        | `["554192421234"]` (número nu) | **não** | `400 invalid_phone` — medido |
        | `["554192421234@s.whatsapp.net"]` | sim | — |

        **Exige o JID COMPLETO**, porque este use case resolve com
        `ResolveQualifiedJID` e não com `ResolveJID`
        (`group_request.go:100`). É uma divergência face a
        `POST /group/updateparticipants`, que aceita o número nu.

        Item inválido recusa o pedido INTEIRO — não há descarte silencioso.
        Duplicados não são detectados. A ordem não é significativa.
      items:
        type: string
        nullable: false
        description: |
          JID completo do solicitante. Nunca `null`; um `null` dentro da lista
          vira `""` e é recusado com `invalid_phone`.
        example: 554192421234@s.whatsapp.net
      example: [554192421234@s.whatsapp.net]
    action:
      type: string
      enum: [approve, reject]
      nullable: false
      description: |
        O veredito.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_action` — medido |
        | `null` | não | **indistinguível de ausente** |
        | `""` | não | **indistinguível de ausente** |
        | `approve` / `reject` | sim | — |
        | qualquer outro valor | não | `400 invalid_action`, `invalid Action in payload (must be approve or reject)` — medido com `xyz` |

        **Valor fora da lista é sempre RECUSADO**, nunca ignorado. É sensível
        a maiúsculas: a comparação é literal (`group_request.go:107-114`).
        Não há valor por omissão.
      example: approve

ResultadoListaGrupos:
  type: object
  description: Resposta de `POST /group/list`.
  properties:
    groups:
      type: array
      nullable: false
      description: |
        Todos os grupos de que a sessão participa, incluindo comunidades
        (`is_parent: true`) e os sub-grupos de avisos que elas criam sozinhas
        (`is_default_sub_group: true`). Não há filtro nem paginação: **a rota
        ignora o corpo por completo** — medido `200` com `{"group_jid":"lixo"}`
        e mesmo com um corpo que não é JSON.

        **Sempre `[]`, nunca `null`**: `PresentListGroups`
        (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
        antes do laço, mesmo vazia — o gap de `interface{}` que este ficheiro
        documentava antes da migração para DTO fechou com o apresentador.

        A ordem não é significativa e não é estável entre chamadas.
      items:
        $ref: '#/components/schemas/InfoGrupoCanonico'

ParticipanteGrupoCanonico:
  type: object
  description: |
    Um membro do grupo, na forma CANÓNICA — chaves em `snake_case` minúsculo,
    produzidas por um apresentador escrito à mão
    (`pkg/presentation/http/dto/group/presenter.go`) e não pela serialização
    directa da struct de protocolo.

    É a forma que `POST /group/info` devolve. As outras rotas desta família
    ainda devolvem `ParticipanteGrupo`, com os nomes do Go — a migração é
    família a família, e esta é a primeira.

    **Todas as propriedades aparecem SEMPRE**: o DTO não usa `omitempty` em
    campo nenhum, de propósito. Ler este objecto nunca exige verificar
    ausência — exige verificar VAZIO.
  required: [jid, phone_number, lid, display_name, is_admin, is_super_admin, error]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        Identificador a usar para falar com este participante. É sempre igual
        a `lid` ou a `phone_number` — nunca uma terceira forma. `""` quando o
        WhatsApp não o deu.
      example: 90937376170214@lid
    phone_number:
      type: string
      nullable: false
      description: O número, em forma PN. `""` num participante que só tenha LID.
      example: 554192421234@s.whatsapp.net
    lid:
      type: string
      nullable: false
      description: |
        O identificador opaco do participante. `""` num grupo cujo modo de
        endereçamento não seja `lid`.
      example: 90937376170214@lid
    display_name:
      type: string
      nullable: false
      description: |
        Só vem preenchido para participantes anónimos de grupos em modo
        anúncio; `""` é a forma normal de "não se aplica".
      example: ''
    is_admin:
      type: boolean
      nullable: false
      description: |
        Administrador do grupo. `false` significa "não é administrador", e não
        "não se sabe".
      example: false
    is_super_admin:
      type: boolean
      nullable: false
      description: Criador do grupo. Um super-administrador é também administrador.
      example: false
    error:
      type: integer
      nullable: false
      description: |
        F280 (2026-08-28): o código de erro que o protocolo devolve para
        ESTE participante, dentro de um lote com sucesso parcial — uma
        adição ou um pedido de entrada em que alguns passaram e outros não.
        `0` é o normal: participante sem erro reportado, incluindo toda
        leitura de roster (`GET /groups/{group_jid}`, `POST /group/info`),
        onde este campo é sempre `0`.

        Antes desta correção o valor existia no protocolo e era descartado —
        um sucesso parcial ficava indistinguível de sucesso total (F280,
        `HOUSEKEEP.md`).
      example: 0

InfoGrupoCanonico:
  type: object
  description: |
    Metadados de um grupo, na forma CANÓNICA — `snake_case` minúsculo,
    produzida pelo apresentador `PresentGroupInfo`
    (`pkg/presentation/http/dto/group/presenter.go`) a partir de
    `domain.GroupInfo`.

    **O que mudou face a `InfoGrupo`**, e porquê: `InfoGrupo` descrevia a
    struct de protocolo do wa-noise serializada DIRECTAMENTE, sem etiquetas
    `json` — daí `JID`, `OwnerJID`, `IsAdmin`. Pior: o motor `wa-headless`
    servia OUTRA struct na mesma chave, então a forma do corpo dependia de que
    motor tinha a sessão. Hoje os dois motores normalizam para
    `domain.GroupInfo`, e esta é a única forma servida.

    **Campos que desapareceram** e a razão: `OwnerPN`, `TopicID`,
    `TopicDeleted`, `AddressingMode`, `CreatorCountryCode`,
    `AnnounceVersionID`, `ParticipantVersionID` e `Error`/`AddRequest` dos
    participantes eram detalhe do protocolo, não do recurso. `Suspended` passou
    a `is_suspended`.

    **Presença**: nenhuma propriedade tem `omitempty`. Todas aparecem sempre.
    As três datas são `null` quando o motor não as conhece — e não
    `"0001-01-01T00:00:00Z"`, que seria uma data real no fio.

    **O que o motor headless não vê**: uma sessão servida por `wa-headless` só
    consegue `jid`, `name` e `is_announce`; o resto vem no zero, e
    `participants` vem `[]`. Isso é visível, e é de propósito — preencher com
    palpite tornaria "não vejo" indistinguível de "o grupo é assim".
  required:
    [jid, owner_jid, name, name_set_at, name_set_by, topic, topic_set_at,
     topic_set_by, is_locked, is_announce, is_ephemeral, disappearing_timer,
     is_incognito, is_suspended, is_parent, linked_parent_jid,
     is_default_sub_group, is_join_approval_required, member_add_mode,
     created_at, participant_count, participants]
  properties:
    jid:
      type: string
      nullable: false
      description: JID do grupo, sempre terminado em `@g.us`.
      example: 120363411669320145@g.us
    owner_jid:
      type: string
      nullable: false
      description: Quem criou o grupo. `""` quando o WhatsApp não o deu.
      example: 90937376170214@lid
    name:
      type: string
      nullable: false
      description: O nome (assunto) do grupo.
      example: Equipa de entregas
    name_set_at:
      type: string
      format: date-time
      nullable: true
      description: |
        Quando o nome foi definido, em RFC 3339 UTC. `null` quando desconhecido.
      example: '2026-08-26T12:42:49Z'
    name_set_by:
      type: string
      nullable: false
      description: Quem definiu o nome. `""` quando desconhecido.
      example: 90937376170214@lid
    topic:
      type: string
      nullable: false
      description: A descrição do grupo. `""` num grupo sem descrição.
      example: Combinações de rota do turno da manhã
    topic_set_at:
      type: string
      format: date-time
      nullable: true
      description: Quando a descrição foi definida. `null` quando desconhecido.
      example: '2026-08-26T12:42:51Z'
    topic_set_by:
      type: string
      nullable: false
      description: Quem definiu a descrição. `""` quando desconhecido.
      example: 90937376170214@lid
    is_locked:
      type: boolean
      nullable: false
      description: Só administradores podem editar os dados do grupo.
      example: false
    is_announce:
      type: boolean
      nullable: false
      description: Só administradores podem enviar mensagens.
      example: false
    is_ephemeral:
      type: boolean
      nullable: false
      description: Mensagens temporárias ligadas.
      example: true
    disappearing_timer:
      type: integer
      nullable: false
      minimum: 0
      description: |
        Duração das mensagens temporárias, em SEGUNDOS. `0` quando desligadas.
      example: 86400
    is_incognito:
      type: boolean
      nullable: false
      description: Grupo em modo incógnito.
      example: false
    is_suspended:
      type: boolean
      nullable: false
      description: Grupo suspenso pelo WhatsApp.
      example: false
    is_parent:
      type: boolean
      nullable: false
      description: O "grupo" é na verdade uma COMUNIDADE.
      example: false
    linked_parent_jid:
      type: string
      nullable: false
      description: |
        A comunidade a que este grupo pertence. `""` num grupo solto.
      example: ''
    is_default_sub_group:
      type: boolean
      nullable: false
      description: É o grupo de avisos criado com a comunidade.
      example: false
    is_join_approval_required:
      type: boolean
      nullable: false
      description: Entrar exige aprovação de um administrador.
      example: false
    member_add_mode:
      type: string
      nullable: false
      description: |
        Quem pode adicionar membros. Valores do WhatsApp: `admin_add`,
        `all_member_add`. `""` quando o servidor não o disse.
      example: admin_add
    created_at:
      type: string
      format: date-time
      nullable: true
      description: Quando o grupo foi criado. `null` quando desconhecido.
      example: '2026-08-26T12:42:47Z'
    participant_count:
      type: integer
      nullable: false
      minimum: 0
      description: |
        O que o servidor reportou, que NÃO é sempre o tamanho de
        `participants`: um não-administrador a ler um grupo em modo anúncio
        recebe a contagem sem a lista.
      example: 2
    participants:
      type: array
      nullable: false
      description: |
        Os membros. **Sempre um array, nunca `null`** — só um dos dois se
        percorre sem verificação. Vem `[]` quando a sessão é servida pelo motor
        headless, que não vê a lista.
      items:
        $ref: '#/components/schemas/ParticipanteGrupoCanonico'

ResultadoInfoGrupo:
  type: object
  description: |
    Resposta de `POST /group/info`. `group_info` está **sempre presente** e
    nunca vem `null`: o apresentador emite a chave sempre, e o manipulador só
    chega a responder `200` depois de o WhatsApp ter devolvido os metadados.

    Foi a PRIMEIRA rota migrada para a forma canónica em `snake_case` — ver
    `InfoGrupoCanonico` e `docs/HTTP-DTO-CONVENTIONS.md`. Toda a família de
    grupo e comunidade migrou desde então; `InfoGrupo` (sem sufixo) fica
    documentado só como registo do formato ANTERIOR.
  required: [group_info]
  properties:
    group_info:
      $ref: '#/components/schemas/InfoGrupoCanonico'

ResultadoCriarGrupo:
  type: object
  description: |
    Resposta de `POST /group/create`, produzida por `PresentCreatedGroup`
    (`pkg/presentation/http/dto/group/presenter_group.go`) a partir de
    `dtogroup.CreateGroupResponse`.
  required: [group_info, created]
  properties:
    group_info:
      $ref: '#/components/schemas/InfoGrupoCanonico'
    created:
      type: boolean
      nullable: false
      description: |
        `false` quando o grupo já existia e foi ENCONTRADO em vez de CRIADO —
        só o motor headless consegue responder `false`, porque a sua
        capacidade é "garantir que este grupo existe". Um cliente que não
        distinga os dois não sabe se acabou de alterar a conta de alguém.
      example: true

ResultadoInfoConvite:
  type: object
  description: |
    Resposta de `POST /group/inviteinfo`. `invite_info` está **sempre
    presente** e nunca vem `null` (`pkg/domain/group.go:47`); um convite
    inválido não chega aqui — devolve `500`.

    **Medido, antes da migração para DTO**: os metadados vinham com
    `member_add_mode` a `""`, ao contrário de `POST /group/info` sobre o mesmo
    grupo no mesmo minuto. `participant_count` vinha CORRECTO aqui — é
    `POST /group/list` que o traz a zero. O corpo é hoje a mesma forma
    canónica de `POST /group/info`, via `GetGroupInviteInfoResponse`
    (`pkg/presentation/http/dto/group/group.go`); a divergência de campos
    observada acima não foi re-verificada contra o novo apresentador.
  properties:
    invite_info:
      $ref: '#/components/schemas/InfoGrupoCanonico'

ResultadoLinkConvite:
  type: object
  description: Resposta de `POST /group/invitelink`.
  properties:
    invite_link:
      type: string
      nullable: false
      description: |
        O link INTEIRO, com o prefixo `https://chat.whatsapp.com/` — medido.

        **Sempre presente** e nunca `null`: o campo não tem `omitempty`
        (`pkg/domain/group.go:38`). Viria `""` se o WhatsApp devolvesse um
        link vazio sem erro, o que não foi observado.

        `POST /group/join` documenta o código NU, logo os dois não encaixam
        por contrato, só por o corte de prefixo existir na biblioteca.
      example: https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4

ResultadoAtualizarParticipantes:
  type: object
  description: |
    Resposta de `POST /group/updateparticipants`. É a única rota de escrita
    desta família que devolve mais do que `details`.

    O corpo é `dtogroup.UpdateGroupParticipantsResponse`
    (`pkg/presentation/http/dto/group/group.go`), produzido por
    `PresentParticipantsUpdate` — não mais um mapa montado à mão no
    manipulador. As quatro chaves aparecem SEMPRE, sem `omitempty`.
  required: [details, participants, confirmed, reason]
  properties:
    details:
      type: string
      nullable: false
      description: |
        Confirmação textual, constante: `Participants updated`. **Sempre
        presente**, nunca `null`. Não distingue adição de remoção nem diz
        quantos passaram — para isso é `participants`.
      example: Participants updated
    participants:
      type: array
      nullable: false
      description: |
        A lista de participantes que o WhatsApp devolveu na MESMA resposta, na
        forma canónica. `error` diferente de zero numa entrada diz que
        aquele participante falhou enquanto os outros passaram (F280,
        2026-08-28) — antes disso o `Error` numérico do protocolo era
        descartado, e só `is_admin`/`is_super_admin` inesperados davam uma
        pista indirecta.

        **Sempre um array, nunca `null`**: `make([]GroupParticipantResponse,
        0, ...)` antes do laço (`presenter_group.go`).
      items:
        $ref: '#/components/schemas/ParticipanteGrupoCanonico'
    confirmed:
      type: boolean
      nullable: false
      description: |
        A sessão que agiu LEU a mudança de volta.

        **Sempre presente**, nunca `null`. Neste transporte é sempre `true`,
        porque o protocolo devolve a lista resultante na própria resposta
        (`pkg/infra/wa-noise/adapters/group/participants.go:37`). O campo
        existe porque nem todo transporte consegue confirmar, e um sucesso que
        ninguém verificou não pode ser calado (`pkg/domain/group.go:236`).

        **`false` NÃO significa falha**: significa que a mudança foi enviada e
        não foi observada. O motivo fica no log, não na resposta.
      example: true

PedidoRemoverFotoGrupo:
  type: object
  description: |
    Remoção da foto. O corpo é `dtogroup.GroupTargetRequest`
    (`pkg/presentation/http/dto/group/request.go`) — o mesmo tipo partilhado
    por `/group/invitelink`, `/group/leave` e `/group/requestparticipants`.

    **O manipulador não valida campo nenhum**, e o corpo INTEIRO é opcional no
    sentido em que `{}` é aceite pelo descodificador — a falha vem depois, na
    resolução do JID.
  properties:
    group_jid:
      type: string
      nullable: false
      description: |
        JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
        parser: **medido `400 invalid_jid`, `could not parse JID ""`** —
        envelope NOVO, e não um erro de campo obrigatório. `chat` cobre a
        ausência.
      example: 120363411669320145@g.us
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino. Só lido quando `group_jid` estiver vazio;
        ausente, `null` e `""` são indistinguíveis.
      example: 120363411669320145@g.us
