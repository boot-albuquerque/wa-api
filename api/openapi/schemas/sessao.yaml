# Grupo: Sessões.
#
# Esquemas próprios das rotas de ciclo de vida da sessão, perfil e das
# configurações por sessão (histórico, proxy, S3, HMAC).
#
# Onde a forma foi MEDIDA contra o servidor vivo em 2026-08-26, o comentário
# diz. Onde ela vem do código, o comentário diz o ficheiro — porque a struct
# de domínio não é o contrato da rota, e em duas rotas deste grupo a resposta
# real diverge do que a struct sugere.
#
# NULABILIDADE, a regra que vale para TODO campo deste ficheiro:
#
#   Nenhum DTO deste grupo usa ponteiro. Em Go, `encoding/json` trata `null`
#   num campo não-ponteiro como *nada a fazer* — o campo fica com o valor zero,
#   exactamente como se não tivesse vindo. Logo, em todo PEDIDO daqui:
#
#       ausente  ≡  null  ≡  ""  (ou 0, ou false)
#
#   e os três são INDISTINGUÍVEIS para o servidor. Só o tipo errado se
#   distingue: dá `400 could_not_decode_payload`. Por isso `nullable: false`
#   em toda parte — `null` não é recusado, é ignorado, e ignorar não é aceitar.
#
#   Nas RESPOSTAS, o mesmo: nenhum campo é ponteiro nem mapa que possa vir
#   `nil`, então nenhum sai `null`. O que existe é campo com `omitempty`, que
#   NÃO aparece — e isso está dito campo a campo.

EstadoConexao:
  type: object
  description: |
    Resposta de `GET /session/connect`. O corpo NÃO é o `ConnectResult` do
    domínio: o manipulador responde um mapa literal
    (`handler_session.go:131`), e `status` é o único campo que sai.
  required: [status]
  properties:
    status:
      type: string
      nullable: false
      enum: [connecting]
      description: |
        Constante `connecting`. A ligação ao WhatsApp arranca numa goroutine
        DEPOIS da resposta — este `200` significa "aceitei o pedido e a posse
        da sessão é minha", não "estou ligado". Quem confirma é
        `GET /session/status`.

        **Sempre presente e nunca `null`**: é escrito à mão no mapa literal do
        manipulador, não vem de struct. Valor fora desta lista de um só
        elemento não existe — não há caminho no código que escreva outra
        coisa; um valor desconhecido aqui seria defeito, não variação.
      example: connecting

ResultadoDesconexao:
  type: object
  description: |
    Resposta de `GET /session/disconnect` e de `POST /session/logout`.
    `details` vem SEMPRE, e SEMPRE vazio: os dois casos de uso devolvem o
    resultado zerado (`session/disconnect.go:42`, `session/logout.go:79`) e o
    campo não tem `omitempty`.
  required: [details]
  properties:
    details:
      type: string
      nullable: false
      description: |
        Sempre a string vazia. Campo herdado; nada o preenche hoje.

        **Sempre presente, nunca ausente e nunca `null`** — sem `omitempty` na
        struct, e o valor zero de `string` é `""`. Não interprete o vazio como
        falha: a falha viria como `4xx`/`5xx`, não como `200` com `details`
        vazio.
      example: ''

CodigoQR:
  type: object
  description: |
    Resposta de `GET /session/qr`. Medida no servidor vivo em 2026-08-26,
    numa sessão já autenticada: `{"qr_code": ""}`.
  required: [qr_code]
  properties:
    qr_code:
      type: string
      nullable: false
      description: |
        Imagem do QR code em data URI (`data:image/png;base64,…`), lida da
        coluna `users.qrcode`.

        **Sempre presente, nunca ausente e nunca `null`.** Sem `omitempty` na
        struct (`domain/session.go:29`), e o valor zero de `string` é `""`.

        **Vazio é informação, não defeito.** A coluna só tem valor durante a
        janela de emparelhamento: o orquestrador grava a imagem a cada evento
        `QR` (`orchestrator.go:537`) e limpa-a no timeout
        (`orchestrator.go:552`).

        | estado | significa |
        |---|---|
        | `""` | a sessão já está emparelhada, ou nunca chamou `GET /session/connect`, ou o código expirou |
        | `data:image/png;base64,…` | há um código válido agora; desenhe-o |

        Medido em 2026-08-26 nas duas sessões autenticadas: `{"qr_code": ""}`
        com `200` nas duas.
      example: ''

PedidoPareamentoTelefone:
  type: object
  description: |
    Corpo de `POST /session/pairphone`. Campos desconhecidos são registados
    e, com `WA_API_STRICT_UNKNOWN_FIELDS=true`, recusados com
    `400 unknown_field`.

    **`engine` é obrigatório desde 2026-08-28.** O engine é ESCOLHIDO pelo
    pedido de emparelhamento e determina qual transporte executa a ligação;
    não é inferido da sessão do chamador. Ver a descrição da rota.
  required: [engine, phone]
  properties:
    engine:
      type: string
      nullable: false
      enum: [wa_noise, wa_headless]
      description: |
        Transporte que executa este emparelhamento. Obrigatório, não-nulo e
        não-vazio.

        Tem de ser IGUAL ao engine com que a sessão alvo foi criada
        (`POST /admin/users`): divergir dá `409 engine_mismatch`, e o engine
        é imutável depois da criação, portanto o que muda é o pedido. A
        redundância é deliberada — é a confirmação explícita no ponto em que
        uma operação sensível começa.

        `legacy_unknown` é RECUSADO com `400 invalid_engine`: descreve
        história de migração, nunca uma intenção. Qualquer outro valor fora
        desta lista — incluindo os nomes de configuração antigos `wanoise` e
        `headless`, e variações de caixa ou com espaços — é igualmente
        inválido e dá `400 invalid_engine`. O valor não é aparado nem
        normalizado antes de ser comparado.
    phone:
      type: string
      nullable: false
      minLength: 1
      description: |
        Número em formato internacional, só dígitos, com código de país e
        SEM `+`, espaços ou `@s.whatsapp.net`.

        Medido em 2026-08-26:

        | estado | aceite? | efeito |
        |---|---|---|
        | corpo ausente | não | `400 could_not_decode_payload` — o decodificador não tolera `EOF` nesta rota |
        | `{}` (campo omitido) | não | `400 missing_phone`, mensagem `missing Phone in payload` (a mensagem cita o nome de domínio, não a chave do fio) |
        | `null` | não | `400 missing_phone` — **indistinguível de ausente** |
        | `""` | não | `400 missing_phone` — **indistinguível de ausente** |
        | `5541` (número JSON) | não | `400 could_not_decode_payload` — o tipo tem de ser texto |
        | `"   "` | passa a validação do wa-api | não é vazio, logo segue para o SDK; **a recusa do SDK não foi medida** (exigiria um pedido de pareamento real) |
        | preenchido | sim | devolve `linking_code` |

        Não há `trim`, `pattern` nem verificação de comprimento no wa-api: a
        única regra local é *não ser vazio*. A validação de forma do número
        acontece no wa-noise, e a recusa chega ao cliente como
        `400 pair_phone_failed` com a mensagem do SDK
        (`adapters/pairing/adapter.go:65-85`).
      example: '554192421234'

ResultadoPareamentoTelefone:
  type: object
  description: Resposta de `POST /session/pairphone`.
  required: [linking_code]
  properties:
    linking_code:
      type: string
      nullable: false
      description: |
        Código de oito caracteres que a pessoa digita no telemóvel, em
        *Aparelhos conectados → Conectar com número de telefone*. Tem
        validade curta; se expirar, peça outro.

        **Sempre presente quando a resposta é `200`, e nunca `null`** — sem
        `omitempty` na struct. Não vem vazio num `200`: o caminho que o
        preenche é o mesmo que produz o `200`, e qualquer falha antes disso
        sai como `400`.
      example: ABCD-EFGH

EstadoSessao:
  type: object
  description: |
    Retrato da sessão devolvido por `GET /session/status`. MEDIDO no servidor
    vivo em 2026-08-26 nas duas sessões reais — a forma abaixo é a resposta
    real, não a struct.

    Junta o estado AO VIVO (`connected`, `logged_in`, lidos do registo de
    clientes) com o registo PERSISTIDO da sessão (o resto).

    **Nenhum campo tem `omitempty`** (`domain/session.go:53-67`): os treze
    aparecem SEMPRE, em toda resposta `200`, e nenhum vem `null`. O que varia
    é o valor, nunca a presença.

    `token` (`domain.GetStatusResult.Token`) NÃO aparece: o apresentador
    (`dto/session/presenter.go: PresentGetStatus`) omite-o de propósito — a
    intenção é não ecoar o token de sessão numa sondagem de estado, e o campo
    nem chega a existir em `GetStatusResponse`. Ver F298.
  properties:
    id:
      type: string
      nullable: false
      description: |
        Identificador da sessão no wa-api, hexadecimal de 32 caracteres.
        Sempre presente e nunca `null` numa resposta `200`; vem da linha da
        tabela `users`, e sem essa linha a rota responde `400 no_session` em
        vez de devolver o campo vazio.
      example: 918e37366f27e1125ee0482a793267e1
    name:
      type: string
      nullable: false
      description: |
        Nome dado à sessão em `POST /admin/users`. Sempre presente e nunca
        `null`; pode vir `""` se a sessão foi criada sem nome.
      example: filarapida
    connected:
      type: boolean
      nullable: false
      description: |
        Há transporte vivo para o WhatsApp. Distinto de `logged_in`: uma
        sessão pode estar autenticada com o transporte caído
        (`GET /session/disconnect` produz exactamente isso).

        Sempre presente e nunca `null`. `false` significa mesmo
        "desconectada" — não é ausência de informação: o leitor devolve
        `(false, false)` quando não há cliente
        (`runtime/session/guard.go:74`), e esta rota NÃO tem guarda de sessão
        de propósito (F196), justamente para conseguir responder o estado de
        uma sessão caída.
      example: true
    logged_in:
      type: boolean
      nullable: false
      description: |
        A sessão está emparelhada e autenticada — é a que consegue operar.
        Sempre presente e nunca `null`; `false` é resposta legítima, não
        ausência.
      example: true
    jid:
      type: string
      nullable: false
      description: |
        JID da conta ligada, na forma PN e COM o sufixo de dispositivo
        (`:25`). Sempre presente e nunca `null`; vem `""` enquanto a sessão
        não estiver autenticada.
      example: '5516981818244:25@s.whatsapp.net'
    webhook:
      type: string
      nullable: false
      description: |
        URL do webhook desta sessão. Sempre presente e nunca `null`; `""`
        quando não há webhook configurado — medido `""` nas duas sessões em
        2026-08-26.
      example: ''
    events:
      type: string
      nullable: false
      description: |
        Lista de tipos de evento subscritos, separados por vírgula. É esta
        lista que decide o que sai pelo webhook E pelo `GET /session/ws`.

        Sempre presente e nunca `null`. Dois valores medidos em 2026-08-26, e
        os dois extremos importam:

        | valor | efeito |
        |---|---|
        | `""` | **nenhum** evento é entregue — nem por webhook nem por WebSocket |
        | `All` | valor especial: TODOS os tipos passam (`lifecycle.go:36-46`) |
        | `Message,Connected` | só os tipos listados |

        Os nomes válidos são os de `pkg/domain/constants.go`; um nome fora
        dessa lista é descartado ao montar a subscrição
        (`lifecycle_webhook.go:92`) e some sem erro. `""` é o padrão, e é o
        que faz `GET /session/ws` ligar e nunca receber nada.
      example: Message,Connected,Disconnected
    proxy_url:
      type: string
      nullable: false
      description: |
        Proxy de saída desta sessão. Sempre presente e nunca `null`; `""`
        quando não há proxy.
      example: ''
    qr_code:
      type: string
      nullable: false
      description: |
        O mesmo valor que `GET /session/qr` devolve. Sempre presente e nunca
        `null`; `""` fora da janela de emparelhamento — ver `CodigoQR`.
      example: ''
    history:
      type: string
      nullable: false
      description: |
        Limite de mensagens gravadas em `message_history`, **como texto** — o
        caso de uso converte o inteiro com `strconv.Itoa`
        (`session/get_status.go:88`).

        Sempre presente e nunca `null`. `"0"` significa gravação DESLIGADA, e
        é o valor de origem — não é "sem limite" nem "não configurado".
        Medido em 2026-08-26: `"100"` numa sessão e `"0"` na outra.

        Repare no tipo: aqui é texto; em `POST /session/history` o mesmo
        número entra e volta como INTEIRO.
      example: '100'
    proxy_config:
      type: object
      nullable: false
      description: |
        Estado do proxy, repetido em forma estruturada. É um mapa literal
        montado pelo caso de uso (`session/get_status.go:89-92`), logo tem
        sempre exactamente estas duas chaves, sempre presentes e nunca
        `null`. Redundante com `proxy_url`, e mantido por compatibilidade.
      properties:
        enabled:
          type: boolean
          nullable: false
          description: |
            Há proxy configurado nesta sessão. Sempre presente e nunca `null`.
            É `entry.HasProxyURL`, ou seja, deriva de `proxy_url` não ser
            vazio — não é um interruptor independente.
          example: false
        proxy_url:
          type: string
          nullable: false
          description: |
            O mesmo valor de `proxy_url` do nível de cima, repetido dentro do
            resumo estruturado. Sempre presente e nunca `null`; `""` quando
            não há proxy.
          example: ''
    s3_config:
      type: object
      nullable: false
      description: |
        Resumo da configuração S3 desta sessão. Mapa literal
        (`session/get_status.go:93-102`): as oito chaves aparecem SEMPRE e
        nenhuma vem `null`.

        É um subconjunto do que `GET /session/s3/config` devolve — **não traz
        `access_key` nem sequer mascarada**, e essa é a diferença de propósito
        entre as duas leituras.
      properties:
        enabled:
          type: boolean
          nullable: false
          description: A entrega de mídia para o bucket está ligada. Sempre presente, nunca `null`.
          example: false
        endpoint:
          type: string
          nullable: false
          description: Endpoint gravado. Sempre presente, nunca `null`; `""` significa o endpoint padrão da AWS.
          example: ''
        region:
          type: string
          nullable: false
          description: Região gravada. Sempre presente, nunca `null`; `""` quando nada foi configurado.
          example: ''
        bucket:
          type: string
          nullable: false
          description: Bucket gravado. Sempre presente, nunca `null`; `""` quando nada foi configurado.
          example: ''
        path_style:
          type: boolean
          nullable: false
          description: |
            Endereçamento por caminho. Sempre presente e nunca `null`.

            **`false` é o valor de origem da coluna**, não o `true` que
            `GET /session/s3/config` devolve numa sessão sem linha. Medido em
            2026-08-26: `true` numa sessão e `false` na outra, ambas sem S3
            configurado.
          example: true
        public_url:
          type: string
          nullable: false
          description: Prefixo público gravado. Sempre presente, nunca `null`; `""` quando não há.
          example: ''
        media_delivery:
          type: string
          nullable: false
          description: |
            Modo de entrega de mídia GRAVADO. Sempre presente e nunca `null`.

            **Não tem `enum` de propósito.** O que sai aqui é o conteúdo cru da
            coluna, e uma sessão que nunca chamou `POST /session/s3/config`
            tem `""` — que não é nenhum dos três valores que a escrita aceita.
            Medido em 2026-08-26: `"base64"` numa sessão e `""` na outra.

            `""` deve ser lido como "nunca configurado"; o comportamento
            efectivo nesse estado é o padrão, `base64`
            (`domain/storage.go:57-58`).
          example: base64
        retention_days:
          type: integer
          nullable: false
          description: |
            Dias de retenção gravados. Sempre presente e nunca `null`. `0` é o
            valor de origem e significa "nunca configurado", não "reter zero
            dias". Medido em 2026-08-26: `30` numa sessão e `0` na outra.
          example: 30
    hmac_configured:
      type: boolean
      nullable: false
      description: |
        **Sempre presente e sempre `false`.** O caso de uso não o preenche
        (`session/get_status.go:78-97`) e ele sai com o valor zero mesmo
        quando existe chave HMAC gravada. Medido `false` nas duas sessões em
        2026-08-26.

        Nunca vem `null` nem é omitido — o que o torna pior que ausente: um
        `false` que parece resposta. Para saber se há chave, use
        `GET /session/hmac/config`, que reporta a presença de forma honesta.
      example: false

PerfilSessao:
  type: object
  description: |
    Perfil da própria conta ligada, devolvido por `GET /session/profile`.
    MEDIDO no servidor vivo em 2026-08-26 nas duas sessões reais.

    Lê só o store LOCAL — não fala com o servidor do WhatsApp, e por isso
    responde em microssegundos e não está sujeito a rate limit. É a diferença
    para `/session/profile/full`.

    Os campos de identidade e os de aparelho vivem no mesmo nível: o
    resultado embute `SessionDeviceInfo` de forma anónima justamente para o
    objecto continuar plano (`profile/get_profile.go:40`).

    **Nenhum campo tem `omitempty`** (`profile/get_profile.go:29-40`,
    `domain/user.go:189-208`): os treze aparecem SEMPRE e nenhum vem `null`.
    Vazio ou zero é o que substitui a ausência.
  properties:
    pushname:
      type: string
      nullable: false
      description: |
        Nome que a conta anuncia nas mensagens que envia. Sempre presente e
        nunca `null`; `""` numa sessão ainda não autenticada.
      example: FilaRápida
    avatar_url:
      type: string
      nullable: false
      description: |
        URL da foto de perfil. Sempre presente e nunca `null`.

        **Vazio tem duas causas, e a resposta não as separa** — não haver
        foto, ou a consulta ter falhado. A falha fica no log
        (`profile/get_profile.go:99`), não no corpo. Um cliente que precise
        distinguir as duas não consegue por esta rota.

        O URL é assinado e EXPIRA: trate-o como temporário, não o guarde.
      example: 'https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg'
    avatar_id:
      type: string
      nullable: false
      description: |
        Identificador da foto actual, útil para detectar troca de avatar sem
        rebaixar a imagem. Sempre presente e nunca `null`; `""` pelas mesmas
        duas causas de `avatar_url`, e sempre em conjunto com ele — os dois
        são preenchidos pela mesma chamada.
      example: '214830039'
    jid:
      type: string
      nullable: false
      description: |
        JID próprio na forma PN, SEM sufixo de dispositivo. Sempre presente e
        nunca `null`.

        `""` numa sessão ligada e ainda não autenticada — e nesse estado os
        campos de aparelho continuam preenchidos, o que é deliberado
        (`profile/get_profile.go:88-91`): o painel mostra estado de ligação
        mesmo sem identidade.
      example: '5516981818244@s.whatsapp.net'
    full_name:
      type: string
      nullable: false
      description: |
        Nome completo do roster local. Sempre presente e nunca `null`; costuma
        vir `""` para a própria conta — medido `""` nas duas sessões em
        2026-08-26. Vazio aqui é o caso normal, não defeito.
      example: ''
    business_name:
      type: string
      nullable: false
      description: |
        Nome comercial. Sempre presente e nunca `null`.

        Preenchido em contas Business, `""` em contas pessoais — é um dos dois
        sinais de que o tipo de conta se deduz (ver `platform`). Medido em
        2026-08-26: `FilaRápida` na conta com `platform: smbi`, `""` na conta
        com `platform: iphone`.
      example: FilaRápida
    lid:
      type: string
      nullable: false
      description: |
        Identidade da conta no espaço `@lid`, COM sufixo de dispositivo.
        Sempre presente e nunca `null`; `""` antes da autenticação.

        Não é intermutável com `jid`: PN e LID são espaços diferentes, e a
        conversão que a API faz é direccional (F228/F233c).
      example: '29343770251463:25@lid'
    platform:
      type: string
      nullable: false
      description: |
        Plataforma que o WhatsApp reporta do aparelho emparelhado. Sempre
        presente e nunca `null`; `""` antes do emparelhamento.

        **É por aqui que se deduz o tipo de conta, e a dedução é INFERÊNCIA,
        não declaração do protocolo** (achado F260 do `HOUSEKEEP.md`): não
        existe campo nenhum nesta API que diga se a conta é Business ou
        pessoal.

        Medido nas duas sessões vivas em 2026-08-26:

        | `platform` | `business_name` | conta observada |
        |---|---|---|
        | `smbi` | `FilaRápida` | WhatsApp Business |
        | `iphone` | `""` | pessoal |

        **Não há `enum` de propósito**: o valor vem do par, a lista de
        plataformas possíveis não é nossa, e fixá-la aqui recusaria valores
        legítimos que ainda não vimos. Que `smbi` signifique "SMB iOS" é
        leitura do valor, não mapeamento medido no protocolo — trate-o como
        pista, e confirme com `business_name` se a decisão for importante.
      example: smbi
    registration_id:
      type: integer
      format: int64
      nullable: false
      minimum: 0
      maximum: 4294967295
      description: |
        Identificador desta instalação no protocolo Signal. Sempre presente e
        nunca `null`.

        É `uint32` na origem (`domain/user.go:195`) — daí o intervalo `0` a
        `4294967295`, que NÃO cabe num inteiro de 32 bits com sinal. `0`
        significa "não há instalação registada", não um identificador válido.
      example: 4190140233
    lid_migration_timestamp:
      type: integer
      format: int64
      nullable: false
      description: |
        Quando a conta migrou para o espaço `@lid`, em segundos desde a época
        Unix. Sempre presente e nunca `null`.

        **`0` significa que não houve migração registada**, não a época Unix.
        É o valor zero do `int64` e não se distingue de "campo não preenchido"
        — o tipo não é ponteiro.
      example: 1766149842
    initialized:
      type: boolean
      nullable: false
      description: |
        O store completou o handshake inicial. Sempre presente e nunca `null`;
        `false` é resposta legítima, não ausência.
      example: true
    connected:
      type: boolean
      nullable: false
      description: |
        Há transporte vivo. Mesmo significado do campo homónimo de
        `GET /session/status`. Sempre presente e nunca `null`.
      example: true
    logged_in:
      type: boolean
      nullable: false
      description: |
        A sessão está autenticada. Sempre presente e nunca `null`. Mesmo nome
        do campo homónimo de `GET /session/status` — as duas rotas usam
        `logged_in`.
      example: true

PerfilSessaoCompleto:
  description: "Resposta de `GET /session/profile/full`. Perfil da conta ligada, incluindo `platform` — o único sinal de que a conta é Business (`smbi`) ou pessoal."
  allOf:
    - $ref: '#/components/schemas/PerfilSessao'
    - type: object
      description: |
        O que `/session/profile/full` acrescenta ao perfil local: dois blocos
        que só a REDE sabe. MEDIDO no servidor vivo em 2026-08-26 nas duas
        sessões reais.

        A base local nunca falha por causa da rede — se as duas consultas
        remotas caírem, a resposta ainda traz tudo o que `/session/profile`
        traria, e `unavailable` diz o que faltou e porquê.

        **Os três campos abaixo têm `omitempty`**
        (`profile/get_profile_full.go:44-58`): ao contrário de todo o resto
        deste grupo, eles PODEM não aparecer. Nenhum deles vem `null`.
      properties:
        user_info:
          type: array
          nullable: false
          description: |
            Os metadados da conta do PRÓPRIO JID — mesma forma de
            `POST /user/info` e de `GET /user/profile`
            (`InfoUtilizador`/`pkg/presentation/http/dto/user.UserInfoResponse`).

            > **Corrigido em HOUSEKEEP F302 (2026-08-27).** Até aqui este
            > campo era servido a partir de `domain.UserInfo` diretamente, sem
            > etiqueta `json` — o codificador emitia os nomes de campo Go
            > (`JID`, `PictureID`, `GroupAdd`…) em vez do contrato. O
            > manipulador passou a chamar `dtouser.PresentUserInfo`, a mesma
            > função que já servia `POST /user/info`.

            **Ausente** (o campo tem `omitempty`) quando a sessão não tem JID
            próprio ou quando a consulta à rede falhou — e então
            `unavailable.user_info` diz qual dos dois. Presente e vazio (`[]`)
            quando a consulta teve sucesso mas o servidor não respondeu nada.
            Nunca `null`.
          items:
            $ref: '#/components/schemas/InfoUtilizador'
          example:
            - jid: 5516981818244@s.whatsapp.net
              lid: 29343770251463@lid
              status: conta de testes
              picture_id: '214830039'
              verified_name: ''
              devices:
                - 5516981818244@s.whatsapp.net
                - '5516981818244:25@s.whatsapp.net'
              push_name: ''
              business_name: ''
        privacy:
          allOf:
            - $ref: '#/components/schemas/DefinicoesPrivacidade'
          nullable: false
          description: |
            Definições de privacidade da conta — mesma forma de
            `GET /user/privacy` (`DefinicoesPrivacidade`).

            > **Corrigido em HOUSEKEEP F302 (2026-08-27).** Mesmo defeito e
            > mesma correção do `user_info` acima: o manipulador passou a
            > chamar `dtouser.PresentPrivacySettings`.

            **Ausente** (o campo tem `omitempty`) quando a consulta à rede
            falhou — e então `unavailable.privacy` traz o motivo. Nunca
            `null`.
          example:
            group_add: all
            last_seen: contacts
            status: contacts
            profile: all
            read_receipts: all
            call_add: all
            online: all
            messages: all
            defense: 'off'
            stickers: contacts
        unavailable:
          type: object
          nullable: false
          additionalProperties:
            type: string
            description: Motivo, em texto, de o bloco correspondente não ter vindo.
          description: |
            Presente APENAS quando algum bloco remoto não pôde ser obtido, com
            o motivo por chave. As chaves possíveis são `user_info` e
            `privacy`.

            **Ausente é a resposta normal** — o caso de uso põe o mapa a `nil`
            quando fica vazio (`profile/get_profile_full.go:82-84`), e o
            `omitempty` remove-o. Nunca vem `null` nem `{}`.

            Degradar em silêncio seria pior do que falhar: sem isto, um
            `user_info` ausente por falha de rede ficaria indistinguível de um
            ausente por não haver dado.
          example:
            user_info: 'sessao sem JID proprio; nada a consultar'

# PedidoLimiteHistorico vive em schemas/infra.yaml: POST /session/history e POST /webhook/history são o
# MESMO manipulador, e dois esquemas para uma operação divergiriam.

ResultadoLimiteHistorico:
  type: object
  description: |
    Resposta de `POST /session/history` (e de `POST /webhook/history`, mesmo
    manipulador). As chaves são `details` e `history`, minúsculas — DTO
    `dtowebhook.HistoryResponse`.
  required: [history]
  properties:
    details:
      type: string
      nullable: false
      description: |
        Confirmação em texto. Tem `omitempty` na struct
        (`dto/webhook/webhook.go: HistoryResponse`), logo **poderia** ser
        omitido — mas o caso de uso preenche-o sempre com a constante
        `History configured successfully` (`storage/set_history.go:83`), então
        na prática aparece em toda resposta `200`. Nunca vem `null`.
      example: History configured successfully
    history:
      type: integer
      nullable: false
      minimum: 0
      description: |
        Limite gravado, ecoado. **Sempre presente e nunca `null`**: `history`
        NÃO tem `omitempty` de propósito — `0` é resposta legítima e omitir o
        campo esconderia "gravação desligada" (F165).

        `0` significa gravação DESLIGADA, não "sem limite". Negativo é
        recusado antes de gravar, com `400 invalid_history`
        (`storage/set_history.go:75-78`) — medido em 2026-08-26.

        Repare no tipo: aqui é INTEIRO; o mesmo número volta como TEXTO no
        campo `history` de `GET /session/status`.
      example: 100

# PedidoProxy vive em schemas/infra.yaml: POST /proxy/set e POST /session/proxy são o
# MESMO manipulador, e dois esquemas para uma operação divergiriam.

# ResultadoProxy vive em schemas/infra.yaml: POST /proxy/set e POST /session/proxy são o
# MESMO manipulador, e dois esquemas para uma operação divergiriam.

PedidoConfigS3:
  type: object
  description: |
    Corpo de `POST /session/s3/config`. Substitui a configuração inteira —
    não é uma actualização parcial, e não há `PATCH` nesta API.

    **Nenhum campo é obrigatório.** `{}` é aceite e GRAVA: todos os campos
    ficam com o valor zero, `media_delivery` assume `base64`, e o cliente S3
    é removido do registo porque `enabled` fica `false`
    (`storage/configure_s3.go:75-135`). Um pedido parcial não funde com o que
    estava — apaga o que não veio.

    Campos desconhecidos são IGNORADOS em silêncio. Um erro de digitação num
    nome de campo não dá erro: dá o valor zero, e aqui isso apaga a
    configuração daquele campo.

    Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
  properties:
    enabled:
      type: boolean
      nullable: false
      default: false
      description: |
        Liga ou desliga o envio de mídia para o bucket.

        | estado | efeito |
        |---|---|
        | ausente | `false` — **indistinguível de `false` explícito** |
        | `null` | `false` — idem |
        | `false` | **revoga**: o cliente S3 construído com a credencial anterior é removido do registo, senão continuaria a carregar mídia |
        | `true` | constrói o cliente com a credencial deste pedido |

        Este é o caso do §4.2 do contrato arquitectural: um `bool`
        não-ponteiro cujo `false` é uma ACÇÃO, não um padrão inerte. Omitir o
        campo revoga o cliente, em silêncio.
      example: true
    endpoint:
      type: string
      nullable: false
      description: |
        Endpoint do serviço.

        | estado | efeito |
        |---|---|
        | ausente / `null` / `""` | endpoint padrão da AWS — os três são indistinguíveis |
        | endereço reservado ou de loopback | `400 invalid_s3_endpoint` (medido com `http://127.0.0.1:9000`) |
        | preenchido e público | aceite |

        A validação só corre quando o valor não é vazio
        (`storage/configure_s3.go:83-90`).
      example: 'https://s3.eu-west-1.amazonaws.com'
    region:
      type: string
      nullable: false
      description: |
        Região do bucket. Ausente, `null` e `""` são indistinguíveis e todos
        gravam `""`. **Não há validação nenhuma**: uma região inexistente é
        gravada tal e qual, e só falha depois, no `POST /session/s3/test` ou
        no primeiro envio de mídia.
      example: eu-west-1
    bucket:
      type: string
      nullable: false
      description: |
        Nome do bucket. Ausente, `null` e `""` são indistinguíveis e todos
        gravam `""`. **Não há validação nenhuma**, nem sequer quando
        `enabled: true` — uma configuração activa com bucket vazio é gravada e
        responde `200`.
      example: wa-api-media
    access_key:
      type: string
      nullable: false
      writeOnly: true
      description: |
        Identificador da credencial. Ausente, `null` e `""` são
        indistinguíveis e todos gravam `""`. Não há validação.

        **Só entra.** `GET /session/s3/config` devolve a constante `***` no
        lugar deste campo, incondicionalmente — o valor real nunca volta.
      example: AKIAIOSFODNN7EXAMPLE
    secret_key:
      type: string
      nullable: false
      writeOnly: true
      description: |
        Segredo da credencial. Ausente, `null` e `""` são indistinguíveis e
        todos gravam um segredo vazio cifrado — não há validação de presença.

        É cifrado antes de ser gravado (ADR-0009) e **nunca volta** em leitura
        nenhuma: `GET /session/s3/config` não seleciona sequer a coluna. Nunca
        aparece em log — o que se regista é se houve segredo, não qual
        (`storage/configure_s3.go:137-138`).
      example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    path_style:
      type: boolean
      nullable: false
      default: false
      description: |
        Endereçamento por caminho em vez de por subdomínio. Necessário na
        maioria dos serviços compatíveis com S3 que não são a AWS.

        Ausente, `null` e `false` são **indistinguíveis** — o padrão efectivo
        de um pedido que omita o campo é `false`, e não o `true` que
        `GET /session/s3/config` mostra numa sessão sem linha gravada.
      example: true
    public_url:
      type: string
      nullable: false
      description: |
        Prefixo público usado para montar os URLs entregues ao cliente.
        Ausente, `null` e `""` são indistinguíveis. Sem validação de forma.
      example: 'https://media.exemplo.com'
    media_delivery:
      type: string
      nullable: false
      enum: ['', base64, s3, both]
      default: base64
      description: |
        Como a mídia recebida é entregue. `base64` embute no corpo, `s3`
        devolve só o URL, `both` faz as duas coisas.

        Medido em 2026-08-26:

        | estado | efeito |
        |---|---|
        | ausente / `null` / `""` | assume `base64` — os três são indistinguíveis e nenhum é recusado |
        | `base64`, `s3`, `both` | aceite |
        | `BASE64` | **`400 invalid_media_delivery`** — a comparação é sensível a maiúsculas |
        | qualquer outro valor desconhecido (ex.: `ftp`) | `400 invalid_media_delivery`, mensagem `media_delivery must be 'base64', 's3', or 'both'` |

        O `""` está na lista porque é ACEITE, não porque seja um modo: a
        validação só corre para valor não-vazio
        (`storage/configure_s3.go:79-82`).
      example: s3
    retention_days:
      type: integer
      nullable: false
      description: |
        Dias de retenção aplicados aos objectos gravados. Ausente, `null` e
        `0` são **indistinguíveis**, e `0` é o que fica gravado.

        **Não há validação de mínimo**: um valor negativo é aceite e gravado
        — ao contrário de `POST /session/history`, que recusa negativo com
        `400 invalid_history`. Duas rotas vizinhas, duas regras.
      example: 30

ResultadoConfigS3:
  type: object
  description: |
    Resposta de `POST /session/s3/config` e de `DELETE /session/s3/config`.

    **Ambos os campos têm `omitempty`** (`domain/storage.go`), e isso muda a
    forma da resposta conforme o resultado: a do DELETE — e a de um POST com
    `enabled: false` — sai só com `details`, porque `enabled` fica `false` e
    `false` é o valor zero de um booleano.
  properties:
    details:
      type: string
      nullable: false
      description: |
        Confirmação em texto: `S3 configuration saved successfully` no POST,
        `S3 configuration deleted successfully` no DELETE. Tem `omitempty`,
        mas os dois casos de uso preenchem-no sempre, logo aparece em toda
        resposta `200`. Nunca `null`.
      example: S3 configuration saved successfully
    enabled:
      type: boolean
      nullable: false
      description: |
        Estado DEPOIS da operação, não eco do pedido.

        **Ausente significa `false`.** Com `omitempty`, o valor `false` faz o
        campo desaparecer do corpo — logo `{"details":"…"}` sem `enabled` é a
        resposta de uma revogação bem sucedida, não uma resposta incompleta.
        Nunca vem `null`.
      example: true

VistaConfigS3:
  type: object
  description: |
    Resposta de `GET /session/s3/config`. MEDIDA no servidor vivo em
    2026-08-26 nas duas sessões reais.

    **O segredo não tem por onde sair**: a leitura nem seleciona a coluna
    `s3_secret_key`. A access key vem mascarada INCONDICIONALMENTE, mesmo
    quando não há nenhuma configurada — mascarar só por presença revelaria a
    presença.

    Uma sessão sem configuração responde `200` com a configuração como está na
    linha, e não um erro: assim o chamador distingue "nada configurado" de "a
    leitura falhou".

    **Nenhum campo tem `omitempty`** (`domain/storage.go`, `S3ConfigView`): os
    nove aparecem SEMPRE e nenhum vem `null`.
  properties:
    enabled:
      type: boolean
      nullable: false
      description: A entrega de mídia para o bucket está ligada. Sempre presente, nunca `null`.
      example: false
    endpoint:
      type: string
      nullable: false
      description: Endpoint gravado. Sempre presente, nunca `null`; `""` significa o endpoint padrão da AWS.
      example: ''
    region:
      type: string
      nullable: false
      description: Região gravada. Sempre presente, nunca `null`; `""` quando nada foi configurado.
      example: ''
    bucket:
      type: string
      nullable: false
      description: Bucket gravado. Sempre presente, nunca `null`; `""` quando nada foi configurado.
      example: ''
    access_key:
      type: string
      nullable: false
      description: |
        **Sempre a constante `***`, e sempre presente.** Nunca o valor, nunca
        `""`, nunca `null` — a máscara é aplicada incondicionalmente
        (`storage/get_s3_config.go:60`), inclusive quando não há credencial
        nenhuma gravada. Medido `"***"` nas duas sessões, ambas sem S3
        configurado.

        Consequência: **este campo não serve para saber se há credencial**.
        Use `enabled` ou `bucket` para isso.
      example: '***'
    path_style:
      type: boolean
      nullable: false
      description: |
        Endereçamento por caminho. Sempre presente e nunca `null`.

        Medido `true` numa sessão e `false` na outra em 2026-08-26, ambas sem
        S3 configurado: o valor é o da coluna, e o `true` do padrão só
        aparece quando NÃO existe linha de utilizador — situação impossível
        numa sessão autenticada, porque é a linha que autentica.
      example: true
    public_url:
      type: string
      nullable: false
      description: Prefixo público gravado. Sempre presente, nunca `null`; `""` quando não há.
      example: ''
    media_delivery:
      type: string
      nullable: false
      description: |
        Modo de entrega gravado. Sempre presente e nunca `null`.

        **Não tem `enum` de propósito, e a razão foi medida.** A escrita só
        aceita `base64`, `s3` ou `both`, mas a LEITURA devolve o conteúdo cru
        da coluna: uma sessão que nunca chamou `POST /session/s3/config` tem
        `""`. Medido em 2026-08-26: `"base64"` numa sessão e `""` na outra.
        Declarar aqui o enum da escrita tornaria o documento falso.

        `""` deve ser lido como "nunca configurado"; o comportamento efectivo
        nesse estado é o padrão, `base64`.
      example: base64
    retention_days:
      type: integer
      nullable: false
      description: |
        Dias de retenção gravados. Sempre presente e nunca `null`. `0` é o
        valor de origem e significa "nunca configurado". Medido `30` numa
        sessão e `0` na outra em 2026-08-26.
      example: 30

# ResultadoTesteS3 vive em schemas/infra.yaml: POST /s3/test e POST /session/s3/test são o
# MESMO manipulador, e dois esquemas para uma operação divergiriam.

PedidoConfigHmac:
  type: object
  description: |
    Corpo de `POST /session/hmac/config`. `hmac_key` é o único campo do
    contrato — os campos `enabled`/`key`/`secret` que já apareceram em
    versões antigas nunca existiram no fio, e hoje seriam ignorados em
    silêncio como qualquer campo desconhecido.

    Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
  required: [hmac_key]
  properties:
    hmac_key:
      type: string
      nullable: false
      minLength: 32
      writeOnly: true
      description: |
        Chave com que os webhooks desta sessão são assinados.

        Medido em 2026-08-26:

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente (`{}`) | não | `400 hmac_key_too_short` |
        | `null` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
        | `""` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
        | `"curta"` | não | `400 hmac_key_too_short`, mensagem `HMAC key must be at least 32 characters long` |
        | 32 ou mais | sim | grava e devolve `Enabled: true` |

        Repare que **não há código próprio para "em falta"**: a chave ausente
        e a chave curta dão o MESMO erro, porque a única regra é o
        comprimento (`storage/configure_hmac.go:71-74`).

        A mensagem diz "characters", mas a verificação é `len(req.HmacKey)`,
        que em Go conta **bytes**: uma chave de 32 caracteres com acentos
        passa; uma de 31 caracteres com um acento também passa, por ter 32
        bytes. Use ASCII se o comprimento importar para si.

        **Só entra.** É cifrada antes de ser gravada e nunca volta em leitura
        nenhuma — `GET /session/hmac/config` devolve apenas a PRESENÇA.
      example: uma-chave-com-pelo-menos-32-caracteres

ResultadoConfigHmac:
  type: object
  description: |
    Resposta de `POST /session/hmac/config` e de `DELETE /session/hmac/config`.

    Como em S3, os dois campos têm `omitempty` — a resposta do DELETE sai só
    com `details`, porque `enabled` fica `false` e `false` é o valor zero.
  properties:
    details:
      type: string
      nullable: false
      description: |
        Confirmação em texto: `HMAC configuration saved successfully` no POST,
        `HMAC configuration deleted successfully` no DELETE. Tem `omitempty`,
        mas os dois casos de uso preenchem-no sempre, logo aparece em toda
        resposta `200`. Nunca `null`.
      example: HMAC configuration saved successfully
    enabled:
      type: boolean
      nullable: false
      description: |
        Estado DEPOIS da operação — `true` quando a chave ficou gravada.

        **Ausente significa `false`**, por causa do `omitempty`: a resposta do
        DELETE não traz o campo, e isso é a revogação bem sucedida, não uma
        resposta incompleta. Nunca vem `null`.
      example: true

VistaConfigHmac:
  type: object
  description: |
    Resposta de `GET /session/hmac/config`. MEDIDA no servidor vivo em
    2026-08-26 nas duas sessões reais: `{"hmac_key": ""}` nas duas.

    O que sai é a PRESENÇA da chave, nunca a chave: devolvê-la, mesmo cifrada,
    entregaria o material que a assinatura existe para proteger.
  required: [hmac_key]
  properties:
    hmac_key:
      type: string
      nullable: false
      enum: ['', '***']
      description: |
        `""` quando não há chave gravada; `***` quando há.

        **Sempre presente e nunca `null`** — sem `omitempty` na struct
        (`domain/storage.go`, `HmacConfigView`).

        Um terceiro valor, desconhecido, não pode sair: o caso de uso escolhe
        entre a constante e o vazio conforme o comprimento do que veio do
        banco (`storage/get_hmac_config.go:47-50`). Se aparecer outra coisa,
        é defeito, não variação de contrato.

        Ao contrário de `hmac_configured` em `GET /session/status` — que é
        sempre `false` mesmo havendo chave —, este campo reporta a presença de
        forma honesta. É por aqui que se pergunta.
      example: ''

PedidoRecado:
  type: object
  description: |
    Corpo de `POST /user/status`. Define o **recado** do perfil (o "Sobre"),
    não uma story.

    Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  required: [body]
  properties:
    body:
      type: string
      nullable: false
      minLength: 1
      description: |
        Texto do recado.

        Medido em 2026-08-26:

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente (`{}`) | não | `400 missing_body`, mensagem `missing Body in payload` |
        | `null` | não | `400 missing_body` — **indistinguível de ausente** |
        | `""` | não | `400 missing_body` — **indistinguível de ausente** |
        | `123` (número) | não | `400 could_not_decode_payload` |
        | `"   "` | passa a validação | a única regra é `req.Body == ""` (`session/set_status_message.go:28`); **não há `trim`**, logo três espaços seguem para o WhatsApp. O efeito no par não foi medido, por ser escrita real |
        | preenchido | sim | — |
      example: Atendimento das 9h às 18h
    chat:
      type: string
      nullable: false
      description: |
        **Não faz nada, e não faz parte da struct.**

        `SetStatusMessageRequest` tem um único campo, `Body`
        (`domain/session.go:70-72`). `chat` é aceite pelo decodificador apenas
        porque campos desconhecidos são ignorados em TODA a API (desde 2026-08-26
        com registo no log, e recusáveis com `WA_API_STRICT_UNKNOWN_FIELDS`) —
        não porque esta rota o leia. Está aqui documentado, e não removido,
        porque `chat` é o destino universal do §2 do contrato arquitectural e
        um integrador pode mandá-lo por hábito: mandar não dá erro, e também
        não tem efeito nenhum.

        Ausente, `null`, `""` e preenchido são todos equivalentes: esta
        operação é sobre a própria conta e não tem destinatário.
      example: ''

ResultadoRecado:
  type: object
  description: |
    Resposta de `POST /user/status`. `details` vem sempre, e sempre vazio — o
    caso de uso devolve o resultado zerado (`session/set_status_message.go:47`).
  required: [details]
  properties:
    details:
      type: string
      nullable: false
      description: |
        Sempre a string vazia. **Sempre presente, nunca ausente e nunca
        `null`** — sem `omitempty` na struct. O vazio não indica falha: o
        recado foi gravado, e a confirmação é o `200`.
      example: ''

PedidoSincronizacaoContactos:
  type: object
  description: |
    Corpo de `POST /user/contacts/sync`.

    Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  required: [mode]
  properties:
    mode:
      type: string
      nullable: false
      enum: [if_unsynced, incremental, full]
      description: |
        Escolhe o custo do pull do patch de app-state que carrega a agenda:

        - `if_unsynced` — não faz nada se a agenda já estiver sincronizada;
        - `incremental` — busca barata, não apaga a versão local;
        - `full` — re-snapshot completo, caro.

        **Corrigido em 2026-08-26**: até essa data, ausência e valor errado
        davam o MESMO código, e quem esquecia o campo era informado de que o
        seu valor era inválido — sem ter mandado valor nenhum. Agora
        distinguem-se, e a mensagem do ramo inválido ecoa o valor recebido.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente (`{}`) | não | `400 **missing_sync_mode**` |
        | `null` | não | `400 **missing_sync_mode**` — **indistinguível de ausente** |
        | `""` | não | `400 **missing_sync_mode**` — **indistinguível de ausente** |
        | `"   "` | não | `400 invalid_sync_mode`; **não há `trim`**, logo três espaços contam como valor DADO e errado |
        | `"FULL"` | não | `400 invalid_sync_mode` — a comparação é **sensível a maiúsculas** |
        | `"delta"` | não | `400 invalid_sync_mode`; `delta` **não** existe — foi a suposição que a bateria de campo desmentiu |
        | `123` (número) | não | `400 could_not_decode_payload` |
        | um dos três válidos | sim | dispara o pull |

        A mensagem de qualquer valor desconhecido é sempre a mesma e lista os
        válidos: `mode must be one of: if_unsynced, incremental, full`.
      example: if_unsynced

ResultadoSincronizacaoContactos:
  type: object
  description: Resposta de `POST /user/contacts/sync`.
  required: [details, mode]
  properties:
    details:
      type: string
      nullable: false
      enum: [contact roster sync requested]
      description: |
        Constante. Diz que o pedido foi FEITO, não que a agenda já chegou —
        os contactos entram depois, por eventos de app-state.

        **Sempre presente e nunca `null`**; sem `omitempty` na struct. Valor
        desconhecido não sai: é literal no caso de uso
        (`session/sync_contact_roster.go:55`).
      example: contact roster sync requested
    mode:
      type: string
      nullable: false
      description: |
        Eco do modo pedido. **Sempre presente e nunca `null`**, e nunca vazio:
        só chega aqui um pedido cujo `mode` já passou pela validação, logo é
        sempre um dos três válidos.
      example: if_unsynced

PedidoSincronizacaoHistorico:
  type: object
  description: |
    Corpo de `POST /user/history/sync`. O pedido é sempre por mensagens
    ANTERIORES a uma âncora conhecida — daí os cinco campos descreverem uma
    mensagem que o chamador já tem.

    **Corpo ausente é tolerado** nesta rota, ao contrário de todas as outras
    deste grupo: o manipulador ignora o `io.EOF` do decodificador
    (`handler_session.go:305`) e segue com o pedido vazio, que então falha em
    `400 missing_chat_jid`. Medido em 2026-08-26.

    **Corpo mal formado sai no envelope ANTIGO**, com `error` em texto simples
    (`{"code":400,"error":"bad request","success":false}`) — este manipulador
    passa o erro cru a `RespondJSON` em vez do `errDecodePayload` tipado que
    as outras rotas usam. Medido com `{"count":"50"}`.

    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  required: [chat_jid, oldest_msg_id]
  properties:
    count:
      type: integer
      nullable: false
      default: 50
      description: |
        Quantas mensagens pedir.

        | estado | efeito |
        |---|---|
        | ausente / `null` / `0` | assume **50** — os três são indistinguíveis |
        | negativo | assume **50** também; não é recusado |
        | positivo | usado tal e qual, sem tecto |

        O `50` é o lote recomendado pela própria biblioteca
        (`session/request_history_sync.go:15`). Não há máximo validado.
      example: 50
    chat_jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        Conversa cujo histórico se pede.

        Medido em 2026-08-26:

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente / corpo vazio | não | `400 missing_chat_jid` |
        | `null` | não | `400 missing_chat_jid` — **indistinguível de ausente** |
        | `""` | não | `400 missing_chat_jid` — **indistinguível de ausente** |
        | preenchido | sim | segue para a validação de `oldest_msg_id` |

        É validado ANTES de `oldest_msg_id`: um pedido sem os dois revela só
        este. A API não tem `error.details[]`, logo os campos em falta saem um
        de cada vez.

        Não há validação de FORMA do JID no wa-api — um texto que não seja JID
        é aceite aqui e falha mais à frente.
      example: '554192421234@s.whatsapp.net'
    oldest_msg_id:
      type: string
      nullable: false
      minLength: 1
      description: |
        `message_id` da mensagem mais antiga que o chamador já tem: é a
        âncora a partir da qual se pede para trás.

        Medido em 2026-08-26:

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_oldest_msg_id` |
        | `null` | não | `400 missing_oldest_msg_id` — **indistinguível de ausente** |
        | `""` | não | `400 missing_oldest_msg_id` — **indistinguível de ausente** |
        | preenchido | sim | — |
      example: 3EB0A4B2AFD45E625C0917
    oldest_msg_from_me:
      type: boolean
      nullable: false
      default: false
      description: |
        Se a mensagem-âncora foi enviada por esta conta.

        **`false` e ausente são INDISTINGUÍVEIS**, e aqui isso importa: o
        campo é `bool` não-ponteiro (`domain/session.go:129`), e o valor segue
        directo para a âncora do protocolo
        (`session/request_history_sync.go:68`). Omitir o campo não é "deixa o
        servidor decidir" — é afirmar que a mensagem NÃO é sua.

        Se a âncora for uma mensagem enviada por si, mande `true`
        explicitamente. Um `false` errado descreve outra mensagem, e o que
        volta é outro trecho de histórico — sem erro nenhum a assinalar.
      example: true
    oldest_msg_timestamp:
      type: integer
      format: int64
      nullable: false
      default: 0
      description: |
        Instante da mensagem-âncora, em segundos desde a época Unix.

        Ausente, `null` e `0` são **indistinguíveis**, e `0` é enviado ao
        protocolo como a época Unix, não como "não sei". Não há validação nem
        recusa: um pedido sem este campo é aceite com `0`.
      example: 1787747900

ResultadoSincronizacaoHistorico:
  type: object
  description: |
    Resposta de `POST /user/history/sync`. Ecoa a âncora pedida e devolve o
    id do PEDIDO.

    **`count` é o que foi PEDIDO, nunca o que chegou.** As mensagens vêm
    depois, como um evento `HistorySync` do tipo ON_DEMAND — que sai pelo
    webhook e pelo `GET /session/ws`, se a sessão subscrever `HistorySync`
    (ou `All`).

    **Nenhum campo tem `omitempty`** (`domain/session.go:136-144`): os sete
    aparecem SEMPRE numa resposta `200` e nenhum vem `null`.
  properties:
    details:
      type: string
      nullable: false
      description: |
        Identificador da mensagem de par que carregou o pedido. Serve para
        casar o evento que chegar depois. Sempre presente e nunca `null`.

        Repare no nome: `details` aqui é um identificador, e não a
        confirmação em texto que o mesmo nome carrega em `ResultadoRecado` e
        `ResultadoDesconexao`.
      example: 3EB0A4B2AFD45E625C0917
    timestamp:
      type: integer
      format: int64
      nullable: false
      description: |
        **Sempre `0`, e sempre presente.** O caso de uso não preenche este
        campo (`session/request_history_sync.go:78-85`), e como não tem
        `omitempty` ele sai com o valor zero em toda resposta. Nunca `null`.

        Não é o instante do pedido nem o da âncora — é campo morto. Para o
        instante da âncora, leia `oldest_msg_timestamp`.
      example: 0
    count:
      type: integer
      nullable: false
      description: |
        Quantas mensagens foram PEDIDAS — já com o padrão `50` aplicado quando
        o pedido omitiu `count` ou mandou zero/negativo. Sempre presente e
        nunca `null`. Não diz nada sobre quantas vão chegar.
      example: 50
    chat_jid:
      type: string
      nullable: false
      description: |
        Eco do `chat_jid` pedido. Sempre presente e nunca `null`, e nunca
        vazio: um pedido com este campo vazio não chega a produzir `200`.
      example: '554192421234@s.whatsapp.net'
    oldest_msg_id:
      type: string
      nullable: false
      description: |
        Eco do `oldest_msg_id` pedido. Sempre presente e nunca `null`, e nunca
        vazio, pela mesma razão de `chat_jid`.
      example: 3EB0A4B2AFD45E625C0917
    oldest_msg_from_me:
      type: boolean
      nullable: false
      description: |
        Eco do `oldest_msg_from_me` pedido. Sempre presente e nunca `null`.

        `false` aqui não distingue "mandou `false`" de "não mandou o campo" —
        o eco carrega a mesma ambiguidade do pedido.
      example: true
    oldest_msg_timestamp:
      type: integer
      format: int64
      nullable: false
      description: |
        Eco do `oldest_msg_timestamp` pedido. Sempre presente e nunca `null`;
        `0` quando o pedido o omitiu, sem distinção de um `0` explícito.
      example: 1787747900

EventoWebSocket:
  type: object
  description: |
    Forma de cada quadro de texto que `GET /session/ws` empurra. NÃO usa o
    envelope `{code,data,success}` das rotas REST: é o MESMO objecto que sai
    para o webhook da sessão, serializado uma vez e difundido a todas as
    ligações vivas daquele token (`lifecycle_webhook.go:150-165`).

    O objecto é PLANO: `type` diz o evento, e os restantes campos são os do
    próprio evento, na raiz. **Não há esquema fechado**: cada tipo de evento
    traz o seu conjunto de campos, e os documentados abaixo são os do
    emparelhamento, que é o fluxo que esta rota existe para servir. Um cliente
    tem de tolerar campos que não conhece.

    **A subscrição decide o que chega.** O mesmo filtro do webhook corre antes
    do envio para o WebSocket: se `events` da sessão (ver `EstadoSessao`) não
    incluir o tipo — nem o valor especial `All` —, o evento **não é
    entregue**, e a ligação fica aberta sem receber nada. Uma sessão com
    `events: ""` recebe zero quadros. Medido em 2026-08-26: uma das duas
    sessões vivas está exactamente nesse estado.
  required: [type]
  properties:
    type:
      type: string
      nullable: false
      description: |
        Tipo do evento. **Sempre presente e nunca `null`**: o despachante
        recusa e regista erro se `postmap["type"]` não for texto
        (`lifecycle_webhook.go:118-122`), logo nenhum quadro sai sem ele.

        Vem da mesma lista que `users.events` filtra
        (`pkg/domain/constants.go`) — entre outros: `QR`, `QRTimeout`,
        `PairSuccess`, `Connected`, `Disconnected`, `ConnectFailure`,
        `LoggedOut`, `Message`, `Receipt`, `ReadReceipt`, `Presence`,
        `HistorySync`, `AppStateSyncComplete`, `GroupInfo`, `Picture`,
        `PushName`, `BusinessName`, `Blocklist`, `CallOffer`.

        **Sem `enum` de propósito**: a lista tem cerca de cinquenta entradas e
        cresce com a biblioteca; fixá-la aqui faria o documento envelhecer em
        silêncio. `All` NÃO aparece como `type` — é só um valor de
        subscrição.
      example: QR
    event:
      type: string
      nullable: false
      description: |
        Subtipo, presente APENAS nos eventos de emparelhamento: `code` no
        `QR`, `timeout` no `QRTimeout`, `pair_success` no `PairSuccess`.

        **Ausente em todos os outros tipos**, e nunca `null` — o payload é um
        mapa, e uma chave que não é escrita simplesmente não existe no JSON.
        É redundante com `type` e existe por compatibilidade
        (`orchestrator.go:742`).
      example: code
    code:
      type: string
      nullable: false
      description: |
        No evento `QR`, o texto cru do código — qualquer cliente consegue
        desenhá-lo sozinho.

        **Sempre presente nos eventos `QR`, ausente em todos os outros**, e
        nunca `null` (`orchestrator.go:753-756`). É o único campo do `QR`
        garantido: `qrCodeBase64` e `expiresAt` podem faltar.
      example: '2@abc123...,def456...,ghi789...'
    qrCodeBase64:
      type: string
      nullable: false
      description: |
        No evento `QR`, a imagem já codificada em data URI.

        **Pode faltar mesmo num evento `QR`**: se a codificação da imagem
        falhar, o evento sai à mesma, só com `code`, e a falha vai para o log
        (`orchestrator.go:758-766`). Ausente em todos os outros tipos. Nunca
        `null` e nunca `""` — ou vem completo, ou não vem.

        Trate a ausência como "desenhe o QR a partir de `code`", não como
        erro.
      example: 'data:image/png;base64,iVBORw0KGgo...'
    expiresAt:
      type: string
      format: date-time
      nullable: false
      description: |
        No evento `QR`, a validade real daquele código, em RFC 3339.

        **Pode faltar**: só é escrito quando a validade conhecida é maior que
        zero (`orchestrator.go:786-788`). Ausente em todos os outros tipos, e
        nunca `null`.

        Use este valor em vez de assumir uma janela fixa: a constante já mudou
        no passado e o campo é a única fonte que acompanha
        (`orchestrator.go:770-785`).
      example: '2026-08-26T13:18:34Z'
    jid:
      type: string
      nullable: false
      description: |
        No `PairSuccess`, o JID da conta que acabou de emparelhar, na forma PN
        e com sufixo de dispositivo. Ausente nos tipos que não o escrevem, e
        nunca `null`.
      example: '5516981818244:25@s.whatsapp.net'
