# Grupo: Sessões.
#
# Esquemas próprios das rotas de ciclo de vida da sessão, perfil e das
# configurações por sessão (histórico, proxy, S3, HMAC).
#
# Onde a forma foi MEDIDA contra o servidor vivo em 2026-08-26, o comentário
# diz. Onde ela vem do código, o comentário diz o ficheiro — porque a struct
# de domínio não é o contrato da rota, e em duas rotas deste grupo a resposta
# real diverge do que a struct sugere.

EstadoConexao:
  type: object
  description: |
    Resposta de `GET /session/connect`. O corpo NÃO é o `ConnectResult` do
    domínio: o manipulador responde um mapa literal
    (`handler_session.go:131`), e `status` é o único campo que sai.
  required: [status]
  properties:
    status:
      type: string
      enum: [connecting]
      description: |
        Constante `connecting`. A ligação ao WhatsApp arranca numa goroutine
        DEPOIS da resposta — este `200` significa "aceitei o pedido e a posse
        da sessão é minha", não "estou ligado". Quem confirma é
        `GET /session/status`.
      example: connecting

ResultadoDesconexao:
  type: object
  description: |
    Resposta de `GET /session/disconnect` e de `POST /session/logout`.
    `details` vem SEMPRE, e SEMPRE vazio: os dois casos de uso devolvem o
    resultado zerado (`session/disconnect.go:42`, `session/logout.go:79`) e o
    campo não tem `omitempty`.
  required: [details]
  properties:
    details:
      type: string
      description: Sempre a string vazia. Campo herdado; nada o preenche hoje.
      example: ''

CodigoQR:
  type: object
  description: |
    Resposta de `GET /session/qr`. Medida no servidor vivo em 2026-08-26,
    numa sessão já autenticada.
  required: [QRCode]
  properties:
    QRCode:
      type: string
      description: |
        Imagem do QR code em data URI (`data:image/png;base64,…`), lida da
        coluna `users.qrcode`.

        **Vazio é o caso normal, não um defeito.** A coluna só tem valor
        durante a janela de emparelhamento: o orquestrador grava a imagem a
        cada evento `QR` (`orchestrator.go:537`) e limpa-a no timeout
        (`orchestrator.go:552`). Numa sessão já autenticada — ou numa que
        nunca chamou `/session/connect` — a resposta é `{"QRCode": ""}` com
        `200`.
      example: ''

PedidoPareamentoTelefone:
  type: object
  description: Corpo de `POST /session/pairphone`.
  required: [Phone]
  properties:
    Phone:
      type: string
      description: |
        Número em formato internacional, só dígitos, com código de país e
        SEM `+`, espaços ou `@s.whatsapp.net`. Um número nacional ou curto
        demais é recusado pela validação do próprio wa-noise e chega ao
        cliente como `400 pair_phone_failed` com a mensagem do SDK.
      example: '554192421234'

ResultadoPareamentoTelefone:
  type: object
  description: Resposta de `POST /session/pairphone`.
  required: [LinkingCode]
  properties:
    LinkingCode:
      type: string
      description: |
        Código de oito caracteres que a pessoa digita no telemóvel, em
        *Aparelhos conectados → Conectar com número de telefone*. Tem
        validade curta; se expirar, peça outro.
      example: ABCD-EFGH

EstadoSessao:
  type: object
  description: |
    Retrato da sessão devolvido por `GET /session/status`. MEDIDO no servidor
    vivo em 2026-08-26 — a forma abaixo é a resposta real, não a struct.

    Junta o estado AO VIVO (`connected`, `loggedIn`, lidos do registo de
    clientes) com o registo PERSISTIDO da sessão (o resto).
  properties:
    id:
      type: string
      description: Identificador da sessão no wa-api, hexadecimal de 32 caracteres.
      example: 918e37366f27e1125ee0482a793267e1
    name:
      type: string
      description: Nome dado à sessão em `POST /admin/users`.
      example: filarapida
    connected:
      type: boolean
      description: |
        Há transporte vivo para o WhatsApp. Distinto de `loggedIn`: uma
        sessão pode estar autenticada com o transporte caído
        (`GET /session/disconnect` produz exactamente isso).
      example: true
    loggedIn:
      type: boolean
      description: A sessão está emparelhada e autenticada — é a que consegue operar.
      example: true
    token:
      type: string
      description: |
        **Sempre vazio.** O caso de uso constrói o resultado sem preencher
        este campo (`session/get_status.go:78-97`), logo ele sai com o valor
        zero em toda resposta. Não use isto para recuperar o token da sessão
        — ele não é recuperável depois de criado.
      example: ''
    jid:
      type: string
      description: |
        JID da conta ligada, na forma PN e COM o sufixo de dispositivo
        (`:25`). Vazio enquanto a sessão não estiver autenticada.
      example: '5516981818244:25@s.whatsapp.net'
    webhook:
      type: string
      description: URL do webhook desta sessão, ou vazio se não houver.
      example: ''
    events:
      type: string
      description: |
        Lista de tipos de evento subscritos, separados por vírgula. É esta
        lista que decide o que sai pelo webhook E pelo `GET /session/ws`.
      example: Message,Connected,Disconnected
    proxy_url:
      type: string
      description: Proxy de saída desta sessão, ou vazio.
      example: ''
    qrcode:
      type: string
      description: O mesmo valor que `GET /session/qr` devolve — vazio fora da janela de emparelhamento.
      example: ''
    history:
      type: string
      description: |
        Limite de mensagens gravadas em `message_history`, **como texto** —
        o caso de uso converte o inteiro com `strconv.Itoa`
        (`session/get_status.go:88`). `"0"` significa gravação desligada, que
        é o valor de origem.
      example: '100'
    proxy_config:
      type: object
      description: Estado do proxy, repetido em forma estruturada.
      properties:
        enabled:
          type: boolean
          example: false
        proxyUrl:
          type: string
          example: ''
    s3_config:
      type: object
      description: |
        Resumo da configuração S3 desta sessão. É um subconjunto do que
        `GET /session/s3/config` devolve, e não traz nem a access key
        mascarada.
      properties:
        enabled:
          type: boolean
          example: false
        endpoint:
          type: string
          example: ''
        region:
          type: string
          example: ''
        bucket:
          type: string
          example: ''
        path_style:
          type: boolean
          example: true
        public_url:
          type: string
          example: ''
        media_delivery:
          type: string
          example: base64
        retention_days:
          type: integer
          example: 30
    hmac_configured:
      type: boolean
      description: |
        **Sempre `false`.** Como `token`, este campo não é preenchido pelo
        caso de uso (`session/get_status.go:78-97`) e sai com o valor zero
        mesmo quando existe chave HMAC gravada. Para saber se há chave, use
        `GET /session/hmac/config`, que reporta a presença de forma honesta.
      example: false

PerfilSessao:
  type: object
  description: |
    Perfil da própria conta ligada, devolvido por `GET /session/profile`.
    MEDIDO no servidor vivo em 2026-08-26.

    Lê só o store LOCAL — não fala com o servidor do WhatsApp, e por isso
    responde em microssegundos e não está sujeito a rate limit. É a diferença
    para `/session/profile/full`.

    Os campos de identidade e os de aparelho vivem no mesmo nível: o
    resultado embute `SessionDeviceInfo` de forma anónima justamente para o
    objecto continuar plano (`profile/get_profile.go:40`).
  properties:
    pushname:
      type: string
      description: Nome que a conta anuncia nas mensagens que envia.
      example: FilaRápida
    avatar_url:
      type: string
      description: |
        URL da foto de perfil. **Vazio tem duas causas** — não haver foto, ou
        a consulta ter falhado. As duas são indistinguíveis na resposta; a
        falha fica no log (`profile/get_profile.go:99`).
      example: 'https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg'
    avatar_id:
      type: string
      description: Identificador da foto actual, útil para detectar troca de avatar sem rebaixar a imagem.
      example: '214830039'
    jid:
      type: string
      description: |
        JID próprio na forma PN, SEM sufixo de dispositivo. Vazio numa sessão
        ligada e ainda não autenticada — e nesse estado os campos de aparelho
        continuam preenchidos, o que é deliberado.
      example: '5516981818244@s.whatsapp.net'
    full_name:
      type: string
      description: Nome completo do roster local. Costuma vir vazio para a própria conta.
      example: ''
    business_name:
      type: string
      description: |
        Nome comercial. Preenchido em contas Business, vazio em contas
        pessoais — é um dos dois sinais de que o tipo de conta se deduz (ver
        `platform`).
      example: FilaRápida
    lid:
      type: string
      description: Identidade da conta no espaço `@lid`, com sufixo de dispositivo.
      example: '29343770251463:25@lid'
    platform:
      type: string
      description: |
        Plataforma que o WhatsApp reporta do aparelho emparelhado.

        **É por aqui que se deduz o tipo de conta, e a dedução é INFERÊNCIA,
        não declaração do protocolo** (achado F260 do `HOUSEKEEP.md`): não
        existe campo nenhum na API que diga se a conta é Business ou pessoal.
        Medido nas duas sessões vivas em 2026-08-26, `smbi` corresponde a uma
        conta WhatsApp Business e `iphone` a uma conta pessoal. Que `smbi`
        signifique "SMB iOS" é leitura do valor, não mapeamento medido no
        protocolo — trate-o como pista, e confirme com `business_name` se a
        decisão for importante.
      example: smbi
    registration_id:
      type: integer
      format: int64
      description: Identificador desta instalação no protocolo Signal.
      example: 4190140233
    lid_migration_timestamp:
      type: integer
      format: int64
      description: Quando a conta migrou para o espaço `@lid`. Zero significa que não houve migração registada.
      example: 1766149842
    initialized:
      type: boolean
      description: O store completou o handshake inicial.
      example: true
    connected:
      type: boolean
      description: Há transporte vivo. Mesmo significado do campo homónimo de `GET /session/status`.
      example: true
    logged_in:
      type: boolean
      description: |
        A sessão está autenticada. Repare no nome — aqui é `logged_in`, e em
        `GET /session/status` é `loggedIn`. As duas rotas divergem na grafia
        e ambas estão em uso.
      example: true

PerfilSessaoCompleto:
  allOf:
    - $ref: '#/components/schemas/PerfilSessao'
    - type: object
      description: |
        O que `/session/profile/full` acrescenta ao perfil local: dois blocos
        que só a REDE sabe. MEDIDO no servidor vivo em 2026-08-26.

        A base local nunca falha por causa da rede — se as duas consultas
        remotas caírem, a resposta ainda traz tudo o que `/session/profile`
        traria, e `unavailable` diz o que faltou e porquê.
      properties:
        user_info:
          type: object
          description: |
            Bloco CRU do SDK para o próprio JID, indexado pelo JID. Carrega o
            recado (`Status`), a lista de dispositivos que o servidor conhece
            e o LID. As chaves são as do SDK, em maiúsculas iniciais — não
            passam por normalização nenhuma. Ausente quando a sessão não tem
            JID próprio ou quando a consulta falhou (ver `unavailable`).
          additionalProperties: true
          example:
            '5516981818244@s.whatsapp.net':
              VerifiedName: null
              Status: conta de testes
              PictureID: '214830039'
              Devices:
                - '5516981818244@s.whatsapp.net'
                - '5516981818244:25@s.whatsapp.net'
              LID: '29343770251463@lid'
        privacy:
          type: object
          description: |
            Definições de privacidade da conta, como o servidor as reporta.
            Chaves e valores vêm do SDK sem tradução.
          additionalProperties: true
          example:
            GroupAdd: all
            LastSeen: contacts
            Status: contacts
            Profile: all
            ReadReceipts: all
            CallAdd: all
            Online: all
            Messages: all
            Defense: 'off'
            Stickers: contacts
        unavailable:
          type: object
          description: |
            Presente APENAS quando algum bloco remoto não pôde ser obtido, com
            o motivo por chave. Degradar em silêncio seria pior do que falhar:
            sem isto, um `user_info` ausente por falha de rede ficaria
            indistinguível de um ausente por não haver dado.
          additionalProperties:
            type: string
          example:
            user_info: 'sessao sem JID proprio; nada a consultar'

PedidoLimiteHistorico:
  type: object
  description: Corpo de `POST /session/history`.
  required: [history]
  properties:
    history:
      type: integer
      minimum: 0
      description: |
        Quantas mensagens gravar por conversa em `message_history`. `0`
        desliga a gravação, e é o valor de origem de uma instalação nova.
        Negativo é recusado com `400 invalid_history`.
      example: 100

ResultadoLimiteHistorico:
  type: object
  description: |
    Resposta de `POST /session/history`. As chaves são `Details` e `History`,
    com maiúscula inicial — é o corpo histórico da rota, e `History` NÃO tem
    `omitempty` de propósito: `0` é resposta legítima e omitir o campo
    esconderia "gravação desligada" (F165).
  required: [History]
  properties:
    Details:
      type: string
      example: History configured successfully
    History:
      type: integer
      example: 100

PedidoProxy:
  type: object
  description: Corpo de `POST /session/proxy`.
  required: [enable]
  properties:
    enable:
      type: boolean
      description: |
        `true` grava o proxy; `false` remove-o. No ramo de remoção o
        `proxy_url` é IGNORADO de propósito — recusar a remoção porque a URL
        que vai ser deitada fora está malformada tornaria uma configuração
        estragada impossível de apagar.
      example: true
    proxy_url:
      type: string
      description: |
        URL do proxy. Só `http` e `socks5` são aceites — `https` é recusado
        com `400 unsupported_proxy_scheme`, porque exige um transporte que
        este processo não monta. Credenciais vão no userinfo
        (`socks5://utilizador:segredo@servidor:1080`) e nunca aparecem em log
        nem em mensagem de erro.
      example: 'socks5://proxy.interno:1080'
    webhook_use_proxy:
      type: boolean
      description: |
        Se a entrega de WEBHOOK também sai por este proxy. Omitido, herda o
        valor gravado e, na falta dele, o padrão da instalação.

        **Muda a validação**: com este modo ligado, um endereço reservado ou
        de loopback é recusado com `400 reserved_proxy_address` — de outra
        forma, o proxy indicado pelo inquilino seria um caminho à volta do
        validador de saída. Com ele desligado, o proxy só carrega o tráfego
        do próprio WhatsApp e um endereço interno é permitido.
      example: false

ResultadoProxy:
  type: object
  description: |
    Resposta de `POST /session/proxy`. O ramo de REMOÇÃO responde só
    `Details`; o de gravação ecoa também o que ficou gravado, e é isso que
    distingue "gravei o que pediu" de "respondi 200".
  properties:
    Details:
      type: string
      example: Proxy configured successfully
    Set:
      type: boolean
      description: Presente apenas no ramo de gravação.
      example: true
    ProxyURL:
      type: string
      description: Eco da URL gravada. Presente apenas no ramo de gravação.
      example: 'socks5://proxy.interno:1080'
    webhook_use_proxy:
      type: boolean
      description: Eco do modo resolvido e gravado. Presente apenas no ramo de gravação.
      example: false

PedidoConfigS3:
  type: object
  description: |
    Corpo de `POST /session/s3/config`. Substitui a configuração inteira —
    não é uma actualização parcial.
  properties:
    enabled:
      type: boolean
      description: |
        Liga ou desliga o envio de mídia para o bucket. Desligar **revoga**:
        o cliente S3 construído com a credencial anterior é removido do
        registo, senão continuaria a carregar mídia.
      example: true
    endpoint:
      type: string
      description: |
        Endpoint do serviço. Vazio significa o endpoint padrão da AWS. Quando
        preenchido, passa pelo validador de saída — um endereço reservado ou
        de loopback é recusado com `400 invalid_s3_endpoint`.
      example: 'https://s3.eu-west-1.amazonaws.com'
    region:
      type: string
      example: eu-west-1
    bucket:
      type: string
      example: wa-api-media
    access_key:
      type: string
      example: AKIAIOSFODNN7EXAMPLE
    secret_key:
      type: string
      description: |
        Segredo da credencial. É cifrado antes de ser gravado (ADR-0009) e
        **nunca volta** em nenhuma leitura — `GET /session/s3/config` não o
        seleciona sequer.
      example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    path_style:
      type: boolean
      description: Endereçamento por caminho em vez de por subdomínio. Necessário na maioria dos serviços compatíveis com S3 que não são a AWS.
      example: true
    public_url:
      type: string
      description: Prefixo público usado para montar os URLs entregues ao cliente.
      example: 'https://media.exemplo.com'
    media_delivery:
      type: string
      enum: [base64, s3, both]
      description: |
        Como a mídia recebida é entregue. `base64` embute no corpo, `s3`
        devolve só o URL, `both` faz as duas coisas. Vazio assume `base64`;
        qualquer outro valor é recusado com `400 invalid_media_delivery`.
      example: s3
    retention_days:
      type: integer
      description: Dias de retenção aplicados aos objectos gravados.
      example: 30

ResultadoConfigS3:
  type: object
  description: |
    Resposta de `POST /session/s3/config` e de `DELETE /session/s3/config`.
    Ambos os campos são `omitempty`, logo a resposta do DELETE — e a de um
    POST com `enabled: false` — sai só com `Details`.
  properties:
    Details:
      type: string
      example: S3 configuration saved successfully
    Enabled:
      type: boolean
      description: Estado DEPOIS da operação, não eco do pedido.
      example: true

VistaConfigS3:
  type: object
  description: |
    Resposta de `GET /session/s3/config`. MEDIDA no servidor vivo em
    2026-08-26.

    **O segredo não tem por onde sair**: a leitura nem seleciona a coluna
    `s3_secret_key`. A access key vem mascarada INCONDICIONALMENTE, mesmo
    quando não há nenhuma configurada — mascarar só por presença revelaria a
    presença.

    Uma sessão sem configuração nenhuma responde `200` com a configuração
    limpa (`enabled: false`, `path_style: true`, `media_delivery: base64`), e
    não um erro: assim o chamador distingue "nada configurado" de "a leitura
    falhou".
  properties:
    enabled:
      type: boolean
      example: false
    endpoint:
      type: string
      example: ''
    region:
      type: string
      example: ''
    bucket:
      type: string
      example: ''
    access_key:
      type: string
      description: Sempre a constante `***`. Nunca o valor.
      example: '***'
    path_style:
      type: boolean
      example: true
    public_url:
      type: string
      example: ''
    media_delivery:
      type: string
      enum: [base64, s3, both]
      example: base64
    retention_days:
      type: integer
      example: 30

ResultadoTesteS3:
  type: object
  description: |
    Resposta de `POST /session/s3/test`. `Bucket` e `Region` ecoam a
    configuração que foi TESTADA — é o que distingue "testei o que gravou" de
    "respondi 200".
  required: [connected]
  properties:
    connected:
      type: boolean
      description: |
        Só aparece `true`: qualquer falha do teste sai como erro, não como
        `connected: false`.
      example: true
    Details:
      type: string
      example: S3 connection test successful
    Bucket:
      type: string
      example: wa-api-media
    Region:
      type: string
      example: eu-west-1

PedidoConfigHmac:
  type: object
  description: |
    Corpo de `POST /session/hmac/config`. `hmac_key` é o único campo do
    contrato — os campos `enabled`/`key`/`secret` que já apareceram em
    versões antigas nunca existiram no fio.
  required: [hmac_key]
  properties:
    hmac_key:
      type: string
      minLength: 32
      description: |
        Chave com que os webhooks desta sessão são assinados. Mínimo de **32
        caracteres**; abaixo disso é `400 hmac_key_too_short`. É cifrada antes
        de ser gravada e nunca volta em nenhuma leitura.
      example: uma-chave-com-pelo-menos-32-caracteres

ResultadoConfigHmac:
  type: object
  description: |
    Resposta de `POST /session/hmac/config` e de `DELETE /session/hmac/config`.
    Como em S3, os dois campos são `omitempty` — a resposta do DELETE sai só
    com `Details`, porque `Enabled` fica `false`.
  properties:
    Details:
      type: string
      example: HMAC configuration saved successfully
    Enabled:
      type: boolean
      description: Estado DEPOIS da operação — `true` quando a chave ficou gravada.
      example: true

VistaConfigHmac:
  type: object
  description: |
    Resposta de `GET /session/hmac/config`. MEDIDA no servidor vivo em
    2026-08-26.

    O que sai é a PRESENÇA da chave, nunca a chave: devolvê-la, mesmo cifrada,
    entregaria o material que a assinatura existe para proteger.
  required: [hmac_key]
  properties:
    hmac_key:
      type: string
      enum: ['', '***']
      description: '`""` quando não há chave gravada; `***` quando há.'
      example: ''

PedidoRecado:
  type: object
  description: |
    Corpo de `POST /user/status`. Define o **recado** do perfil (o "Sobre"),
    não uma story.
  required: [Body]
  properties:
    Body:
      type: string
      description: Texto do recado. Vazio é recusado com `400 missing_body`.
      example: Atendimento das 9h às 18h
    chat:
      type: string
      description: |
        Aceite pelo decodificador como em toda rota, mas **ignorado**: esta
        operação é sobre a própria conta e não tem destinatário.
      example: ''

ResultadoRecado:
  type: object
  description: |
    Resposta de `POST /user/status`. `details` vem sempre, e sempre vazio — o
    caso de uso devolve o resultado zerado (`session/set_status_message.go:47`).
  required: [details]
  properties:
    details:
      type: string
      example: ''

PedidoSincronizacaoContactos:
  type: object
  description: Corpo de `POST /user/contacts/sync`.
  required: [mode]
  properties:
    mode:
      type: string
      enum: [if_unsynced, incremental, full]
      description: |
        Escolhe o custo do pull do patch de app-state que carrega a agenda:

        - `if_unsynced` — não faz nada se a agenda já estiver sincronizada;
        - `incremental` — busca barata, não apaga a versão local;
        - `full` — re-snapshot completo, caro.

        Qualquer outro valor é `400 invalid_sync_mode`. Em particular,
        `delta` **não** existe — foi a suposição que a bateria de campo
        desmentiu.
      example: if_unsynced

ResultadoSincronizacaoContactos:
  type: object
  description: Resposta de `POST /user/contacts/sync`.
  required: [details, mode]
  properties:
    details:
      type: string
      enum: [contact roster sync requested]
      description: |
        Constante. Diz que o pedido foi FEITO, não que a agenda já chegou —
        os contactos entram depois, por eventos de app-state.
      example: contact roster sync requested
    mode:
      type: string
      description: Eco do modo pedido.
      example: if_unsynced

PedidoSincronizacaoHistorico:
  type: object
  description: |
    Corpo de `POST /user/history/sync`. O pedido é sempre por mensagens
    ANTERIORES a uma âncora conhecida — daí os cinco campos descreverem uma
    mensagem que o chamador já tem.
  required: [chat_jid, oldest_msg_id]
  properties:
    count:
      type: integer
      description: |
        Quantas mensagens pedir. Ausente, zero ou negativo assume **50**, o
        lote recomendado pela própria biblioteca
        (`session/request_history_sync.go:15`).
      example: 50
    chat_jid:
      type: string
      description: Conversa cujo histórico se pede. Obrigatório — sem ele, `400 missing_chat_jid`.
      example: '554192421234@s.whatsapp.net'
    oldest_msg_id:
      type: string
      description: |
        `message_id` da mensagem mais antiga que o chamador já tem: é a
        âncora a partir da qual se pede para trás. Obrigatório — sem ele,
        `400 missing_oldest_msg_id`.
      example: 3EB0A4B2AFD45E625C0917
    oldest_msg_from_me:
      type: boolean
      description: Se a mensagem-âncora foi enviada por esta conta.
      example: true
    oldest_msg_timestamp:
      type: integer
      format: int64
      description: Instante da mensagem-âncora, em segundos desde a época Unix.
      example: 1787747900

ResultadoSincronizacaoHistorico:
  type: object
  description: |
    Resposta de `POST /user/history/sync`. Ecoa a âncora pedida e devolve o
    id do PEDIDO.

    **`count` é o que foi PEDIDO, nunca o que chegou.** As mensagens vêm
    depois, como um evento `HistorySync` do tipo ON_DEMAND — que sai pelo
    webhook e pelo `GET /session/ws`, se a sessão subscrever `HistorySync`.
  properties:
    details:
      type: string
      description: Identificador da mensagem de par que carregou o pedido. Serve para casar o evento que chegar depois.
      example: 3EB0A4B2AFD45E625C0917
    timestamp:
      type: integer
      format: int64
      description: Sempre `0`. O caso de uso não preenche este campo (`session/request_history_sync.go:78-85`).
      example: 0
    count:
      type: integer
      example: 50
    chat_jid:
      type: string
      example: '554192421234@s.whatsapp.net'
    oldest_msg_id:
      type: string
      example: 3EB0A4B2AFD45E625C0917
    oldest_msg_from_me:
      type: boolean
      example: true
    oldest_msg_timestamp:
      type: integer
      format: int64
      example: 1787747900

EventoWebSocket:
  type: object
  description: |
    Forma de cada quadro de texto que `GET /session/ws` empurra. NÃO usa o
    envelope `{code,data,success}` das rotas REST: é o MESMO objecto que sai
    para o webhook da sessão, serializado uma vez e difundido a todas as
    ligações vivas daquele token.

    O objecto é PLANO: `type` diz o evento, e os restantes campos são os do
    próprio evento, na raiz.
  required: [type]
  properties:
    type:
      type: string
      description: |
        Tipo do evento. Vem da mesma lista que `users.events` filtra
        (`pkg/domain/constants.go`) — entre outros: `QR`, `QRTimeout`,
        `PairSuccess`, `Connected`, `Disconnected`, `ConnectFailure`,
        `LoggedOut`, `Message`, `Receipt`, `ReadReceipt`, `Presence`,
        `HistorySync`, `AppStateSyncComplete`, `GroupInfo`, `Picture`,
        `PushName`, `BusinessName`, `Blocklist`, `CallOffer`.
      example: QR
    event:
      type: string
      description: |
        Subtipo, presente nos eventos de emparelhamento: `code` no `QR`,
        `timeout` no `QRTimeout`, `pair_success` no `PairSuccess`. É
        redundante com `type` e existe por compatibilidade.
      example: code
    code:
      type: string
      description: No evento `QR`, o texto cru do código — qualquer cliente consegue desenhá-lo sozinho.
      example: '2@abc123...,def456...,ghi789...'
    qrCodeBase64:
      type: string
      description: |
        No evento `QR`, a imagem já codificada em data URI. Pode faltar: se a
        codificação da imagem falhar, o evento sai à mesma, só com `code`.
      example: 'data:image/png;base64,iVBORw0KGgo...'
    expiresAt:
      type: string
      format: date-time
      description: No evento `QR`, a validade real daquele código, em RFC3339. Pode faltar quando não há validade conhecida.
      example: '2026-08-26T13:18:34Z'
    jid:
      type: string
      description: No `PairSuccess`, o JID da conta que acabou de emparelhar.
      example: '5516981818244:25@s.whatsapp.net'
