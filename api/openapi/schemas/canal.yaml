# Grupo: Canais (newsletters) e Comunidades.
#
# Os pedidos das DEZOITO rotas de canal saem TODOS da mesma struct de fio,
# `newsletterBody` (`pkg/presentation/http/handlers/handler_newsletter.go:44`).
# Cada rota lê só os campos de que precisa, e quem decide o que é obrigatório é
# a tabela `newsletterRequirements`
# (`pkg/application/usecase/notification/newsletter_ops.go:206`). Por isso os
# esquemas abaixo são recortes dessa struct, um por operação: enviar um campo
# que a operação não usa não é erro, é apenas ignorado.
#
# TRÊS REGRAS QUE VALEM PARA TODOS OS PEDIDOS DESTE FICHEIRO, e que por isso
# não se repetem campo a campo salvo onde surpreendem. Todas medidas a
# 2026-08-26 contra o servidor local, com sessão ligada:
#
# 1. **Ausente ≡ `null` ≡ valor zero.** Nenhum campo de `newsletterBody` é
#    ponteiro. O `encoding/json` do Go trata `null` num tipo não-ponteiro como
#    *nada a fazer*, logo `{}`, `{"jid":null}` e `{"jid":""}` são o MESMO
#    pedido para o servidor. Medido nos três estados em `/newsletter/info`,
#    `/newsletter/create`, `/newsletter/info-invite`, `/newsletter/mark-viewed`
#    e `/newsletter/react`: sempre a mesma resposta, byte a byte.
#
# 2. **Campo desconhecido é IGNORADO em silêncio.** `domain.DecodeRequest` não
#    usa `DisallowUnknownFields`. Medido:
#    `{"jid":"…","campo_inexistente":"lixo"}` devolve `200`. Um erro de
#    digitação num nome de campo não dá erro — dá o valor zero desse campo.
#
# 3. **Tipo errado é a ÚNICA coisa que a descodificação recusa**, com
#    `400 could_not_decode_payload`. Medido com `{"jid":123}`,
#    `{"name":123}`, `{"server_id":"1"}`, `{"server_ids":["a"]}` e
#    `{"picture":"nao-e-base64!!"}`.
#
# QUATRO NÃO-REGRAS, igualmente medidas, e que surpreendem:
#
# - **O alias universal `chat` NÃO funciona em canal.** `newsletterBody` não
#   embute `ChatTarget`. Medido: `{"chat":"…@newsletter"}` em
#   `/newsletter/info` devolve `400 missing_jid`. Nas comunidades funciona,
#   mas só em duas das quatro rotas — ver `PedidoComunidade`.
# - **JID malformado NÃO dá `400` nas rotas de canal, dá `500`.** A falha de
#   `wajid.ToJID` não é um `apperr`, logo o use case embrulha-a em
#   `newsletter_failed` (categoria interna). Medido com `"   "`, `"nao-e-jid"`
#   e `"554192421234@s.whatsapp.net"`. As rotas de COMUNIDADE fazem o
#   contrário e devolvem `400 invalid_community_jid` para o mesmo defeito.
# - **Não há `trim` em campo nenhum.** A validação é sempre `== ""`, logo
#   `"   "` passa a validação — e depois falha (ou não) mais à frente.
# - **Não há `error.details[]`.** Um pedido com dois campos em falta revela um
#   de cada vez, na ordem da tabela `newsletterRequirements` (o `jid` primeiro).
#
# As formas de resposta foram MEDIDAS a 2026-08-26 contra o servidor local,
# nas rotas de leitura, com duas sessões e quatro canais (um deles apagado).

# --- Canais: pedidos --------------------------------------------------------

PedidoCanal:
  type: object
  description: |
    Pedido mínimo de canal: só o identificador. É a forma de `info`, `follow`,
    `unfollow`, `mute` (sem o `mute`), `subscribe` e `admin-invite/accept`.

    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  required: [jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      pattern: '^[0-9]+@newsletter$'
      description: |
        JID do canal, sempre no servidor `@newsletter`. **Obrigatório em
        catorze das dezoito operações** — todas menos `create` (que não tem
        canal ainda) e `info-invite` (que usa o código do convite).

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_jid` |
        | `null` | não | `400 missing_jid` — **indistinguível de ausente** |
        | `""` | não | `400 missing_jid` — **indistinguível de ausente** |
        | `"   "` | não | `400 invalid_newsletter_jid` — corrigido em 2026-08-26 (F271); até essa data dava `500` |
        | `"nao-e-jid"` | não | `400 invalid_newsletter_jid` |
        | `"…@s.whatsapp.net"` | não | `400 invalid_newsletter_jid` — o servidor tem de ser `@newsletter` |
        | tipo não-texto | não | `400 could_not_decode_payload` |
        | `@newsletter` bem formado mas inexistente | **sim** | `200`, com `state: non_existing` e `jid: ""` — **não é erro** |
        | `@newsletter` real | sim | — |

        **A penúltima linha é a armadilha desta rota**: pedir metadados de um
        canal que nunca existiu devolve `200`, não `404`. Quem consome tem de
        olhar `state`, não o código HTTP.

        **O alias `chat` não é aceite aqui.** `{"chat":"…"}` devolve
        `400 missing_jid`, medido.
      example: 120363411025775186@newsletter

PedidoCriarCanal:
  type: object
  description: |
    Pedido de criação de canal. É a única operação de canal que não recebe
    `jid` — o identificador é justamente o que ela devolve. Também é a única
    sem nenhum campo obrigatório além de `name`.
  required: [name]
  properties:
    name:
      type: string
      nullable: false
      minLength: 1
      description: |
        Nome público do canal.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_name` |
        | `null` | não | `400 missing_name` — indistinguível de ausente |
        | `""` | não | `400 missing_name` — indistinguível de ausente |
        | `"   "` | **sim, pela validação** | cria um canal com nome de três espaços; **não há `trim`** (`newsletter_ops.go:210`). Não medido em campo de propósito: seria uma escrita real |
        | tipo não-texto | não | `400 could_not_decode_payload` |
        | preenchido | sim | — |

        **Comprimento máximo não determinado com segurança pela implementação
        atual**: não há limite nosso, e o do WhatsApp não foi medido.
      example: Avisos da Fila Rápida
    description:
      type: string
      nullable: false
      description: |
        Descrição do canal, mostrada a quem abre a página dele. **Opcional** —
        ausente, `null` e `""` são os três a mesma coisa (canal sem descrição),
        e nenhum é recusado. Medido: `{"name":"…","description":null}` cria o
        canal.
      example: Novidades e horários de funcionamento.
    picture:
      type: string
      format: byte
      nullable: false
      description: |
        Imagem de perfil do canal, em **base64 cru** — o campo é `[]byte` em
        Go, logo o JSON leva base64 sem o prefixo `data:`. Isto diverge de
        `/chat/send/image`, que aceita o URI de dados.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | sim | canal sem imagem |
        | `null` | **sim** | idem — indistinguível de ausente |
        | `""` | **sim** | idem |
        | base64 inválido | não | `400 could_not_decode_payload` |
        | número | não | `400 could_not_decode_payload` |

        **As duas linhas do meio são a armadilha deste campo, e custaram um
        canal criado por acidente.** É natural supor que um valor errado num
        `[]byte` morre na descodificação — e `"nao-e-base64!!"` e `123`
        morrem. `null` e `""` **não morrem**: descodificam para `nil` e vazio,
        e o pedido segue para o efeito real.

        Medido a 2026-08-26 com a técnica de sonda segura — omitindo `name`,
        que é o campo obrigatório, para que o pedido morra na validação em
        qualquer ramo e o código de erro revele onde `picture` parou:

        ```
        {"picture":"nao-e-base64!!"}  -> 400 could_not_decode_payload
        {"picture":123}               -> 400 could_not_decode_payload
        {"picture":null}              -> 400 missing_name    <- PASSOU a descodificação
        {"picture":""}                -> 400 missing_name    <- PASSOU
        {}                            -> 400 missing_name
        ```

        Cinco entradas, três resultados, e nenhum canal criado.
        `could_not_decode_payload` significa "o valor morreu na
        descodificação"; qualquer outro código significa "o valor passou".

        Não há validação de formato de imagem, de dimensão nem de tamanho do
        nosso lado; quem recusa é o WhatsApp.

PedidoCanalPorConvite:
  type: object
  description: |
    Pedido de metadados a partir do CÓDIGO de convite, não do JID. O código é a
    parte final do link público (`https://whatsapp.com/channel/<código>`), e é
    enviado nu.
  required: [invite]
  properties:
    invite:
      type: string
      nullable: false
      minLength: 1
      description: |
        Código do convite, 24 caracteres alfanuméricos nos casos observados.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_invite` |
        | `null` | não | `400 missing_invite` — indistinguível de ausente |
        | `""` | não | `400 missing_invite` — indistinguível de ausente |
        | `"   "` | passa a validação | mas o WhatsApp não responde e sai `500 newsletter_failed`. Medido |
        | código inexistente | passa a validação | `500 newsletter_failed` — **não é `404`**. Medido com `"codigo-que-nao-existe"` |
        | código real | sim | — |

        Não passa pela conversão de JID de propósito (`adapter.go:269`):
        tratá-lo como JID falharia com uma mensagem sobre JID inválido, que
        manda quem investiga para o lado errado.
      example: 0029Vb85MPpKLaHoEUxRt01E

PedidoSilenciarCanal:
  type: object
  description: |
    Pedido de silenciamento, que liga ou desliga conforme `mute`. Note que
    `mute` **não** é obrigatório, e que a sua ausência não significa "não
    decidi" — significa `false`.
  required: [jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` ou `""` dão
        `400 missing_jid`, os três indistinguíveis entre si. Ver `PedidoCanal`
        para a tabela completa, incluindo o `500` do JID malformado.
      example: 120363411025775186@newsletter
    mute:
      type: boolean
      nullable: false
      default: false
      description: |
        `true` silencia, `false` volta a notificar.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | sim | **dessilencia** — o valor zero de um `bool` é `false` |
        | `null` | sim | **dessilencia** — indistinguível de ausente |
        | `false` | sim | dessilencia |
        | `true` | sim | silencia |
        | tipo não-booleano | não | `400 could_not_decode_payload` |

        **Isto é a armadilha da família F268, neste campo**: o campo é `bool` e
        não `*bool`, logo "não mandei nada" e "mandei `false`" são o mesmo
        pedido, e ambos EXECUTAM uma acção (dessilenciar) em vez de nenhuma.
        Um corpo só com `jid` **altera** o estado do canal. Para silenciar é
        obrigatório mandar `true` explicitamente.

        O efeito é visível em `viewer.mute_state` de `POST /newsletter/info`.
      example: true

PedidoMensagensCanal:
  type: object
  description: |
    Pedido de histórico do canal, paginado para trás.

    **`count` é obrigatório na prática, embora não esteja na tabela de
    validação** — ver o campo.
  required: [jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid` e são indistinguíveis. Ver `PedidoCanal`.
      example: 120363411025775186@newsletter
    count:
      type: integer
      nullable: false
      minimum: 1
      description: |
        Quantas mensagens trazer, da mais recente para trás.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | **não** | `500 newsletter_failed` ao fim do tempo limite |
        | `null` | **não** | `500` — indistinguível de ausente |
        | `0` | **não** | `500` — indistinguível de ausente |
        | negativo | **não** | `500`. Medido com `-1` e `-5` |
        | `>= 1` | sim | `200`. Medido com `1`, `2`, `8`, `60` e `100` |

        **Esta tabela contradiz o que esta documentação afirmava até
        2026-08-26.** Estava escrito que zero ou ausente deixava o servidor
        aplicar o padrão dele, porque o adaptador omite o atributo nesse caso
        (`adapter.go:326-343`). **Medido, não é o que acontece**: o WhatsApp
        não responde ao pedido sem `count`, e o resultado é `500` com
        `error.code: newsletter_failed` — o mesmo sintoma da F265. Confirmado
        em dois canais distintos, um vazio e um com sessenta publicações, e o
        mesmo canal responde `200` no segundo seguinte quando `count` vai a 1.

        Ou seja: **`count` é obrigatório de facto e opcional de direito**. A
        tabela `newsletterRequirements` não o exige, logo a recusa não é um
        `400` legível, é um `500` ao fim da espera.

        Máximo não determinado com segurança: `100` foi aceite, e não foi
        procurado o tecto.
      example: 5
    before:
      type: string
      nullable: false
      description: |
        `server_id` da mensagem a partir da qual paginar para trás, **como
        texto**.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | sim | sem cursor — começa da mais recente |
        | `null` | sim | idem — indistinguível de ausente |
        | `""` | sim | idem |
        | `"104"` | sim | pagina a partir do `server_id` 104 |
        | `" 104 "` | sim | igual a `"104"` — há `TrimSpace` **neste campo**, ao contrário do resto da API (`adapter.go:546`) |
        | `"nao-numero"` | **sim, em silêncio** | `strconv.Atoi` falha e o valor vira `0`, que é o mesmo que "sem cursor". **Não há erro**: medido `200` com `{"before":"nao-numero"}` |
        | tipo não-texto | não | `400 could_not_decode_payload` |

        **A penúltima linha é um descarte silencioso**: um cursor mal formado
        não é recusado, é convertido em "começar do princípio". Quem paginar
        com um cursor corrompido recebe a primeira página outra vez, sem
        sinal nenhum de que o cursor foi ignorado.
      example: '104'

PedidoAtualizacoesCanal:
  type: object
  description: |
    Pedido de ATUALIZAÇÕES de mensagens já conhecidas — edições, contagens de
    reação, remoções. **Rota inoperante**: devolve `500` ao fim de 30 s em
    todos os casos medidos (F265). Ver a descrição da rota.
  required: [jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid` e são indistinguíveis. Ver `PedidoCanal`.
      example: 120363411025775186@newsletter
    count:
      type: integer
      nullable: false
      description: |
        Quantas atualizações trazer. Ausente, `null` e `0` são indistinguíveis
        entre si e fazem o adaptador omitir o atributo do pedido.

        **O efeito de `count` nesta rota não foi determinado com segurança**:
        a rota devolve `500` com qualquer valor, incluindo `2`, logo não há
        como distinguir a falha do campo da falha da rota. Em
        `/newsletter/messages`, que partilha o mesmo mecanismo, `count`
        ausente ou zero é o que causa o `500` — a hipótese razoável é que aqui
        seja igual, mas **é hipótese, não medição**.
      example: 5
    since:
      type: string
      format: date-time
      nullable: false
      description: |
        Instante mínimo, em RFC 3339.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | sim | instante zero — sem limite inferior |
        | `null` | sim | idem — indistinguível de ausente |
        | `""` | sim | idem: só se tenta interpretar quando o valor é não-vazio (`dto/newsletter/request.go`) |
        | mal formatado | **não** | `400 invalid_since` |
        | tipo não-texto | não | `400 could_not_decode_payload` |

        **É o único campo das dezoito rotas validado no DTO DE PEDIDO, antes do
        use case.** Tudo o resto que estas rotas exigem depende de QUAL
        operação a rota carrega, e essa tabela vive no use case
        (`newsletterRequirements`); duplicar uma linha dela aqui daria dois
        sítios a decidir o mesmo código de erro. `since` é diferente porque é um
        FORMATO que o cliente pode errar, independente da operação.

        ```json
        {"code": 400, "error": {"code": "invalid_since", "message": "since must be an RFC 3339 instant"}, "success": false}
        ```

        **O código era `invalid_request`** — o genérico do estado, que só diz
        "algo estava mal" — até esta validação passar pela taxonomia `apperr`
        na migração para DTO de 2026-08-27. (E antes disso a recusa saía com
        `error` em TEXTO em vez de objecto: era a F266, e já não existe.)
      example: '2026-08-26T00:00:00Z'
    after:
      type: string
      nullable: false
      description: |
        `server_id` a partir do qual avançar, como texto. Tem exactamente a
        mesma semântica de `before` em `PedidoMensagensCanal`, incluindo o
        `TrimSpace` e o **descarte silencioso** de texto não numérico, que vira
        `0`. Ausente, `null` e `""` são indistinguíveis.
      example: '104'

PedidoMarcarVistoCanal:
  type: object
  description: Pedido de marcação de mensagens do canal como vistas.
  required: [jid, server_ids]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid`. **É verificado antes de `server_ids`**: um pedido sem
        nenhum dos dois revela primeiro o `jid`. Ver `PedidoCanal`.
      example: 120363411025775186@newsletter
    server_ids:
      type: array
      nullable: false
      minItems: 1
      description: |
        Os `server_id` a marcar como vistos.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_server_ids` |
        | `null` | não | `400 missing_server_ids` — indistinguível de ausente |
        | `[]` | não | `400 missing_server_ids` — **indistinguível de ausente** |
        | `["a"]` | não | `400 could_not_decode_payload` — o pedido INTEIRO é recusado |
        | `[1,2,3]` | sim | — |

        **Item inválido NÃO é descartado em silêncio**, ao contrário do que
        acontece nos botões de `/chat/send/buttons`: como o tipo é `[]int`, um
        item não inteiro rebenta a descodificação e nada é marcado. Medido.

        Duplicados e ordem não são validados por nós; `0` é um item aceite pela
        descodificação, e o que o WhatsApp faz com ele não foi medido.
      items:
        type: integer
        nullable: false
        description: Um `server_id` de mensagem do canal, tal como vem em `MensagemCanal.server_id`.
      example: [1, 2, 3]

PedidoReagirCanal:
  type: object
  description: |
    Pedido de reação a uma mensagem do canal. Enviar `reaction` vazio REMOVE a
    reação — é por isso que o campo não é obrigatório.
  required: [jid, server_id]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid`, e é verificado antes de `server_id`. Ver
        `PedidoCanal`.
      example: 120363411025775186@newsletter
    server_id:
      type: integer
      nullable: false
      minimum: 1
      description: |
        `server_id` da mensagem alvo.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_server_id` |
        | `null` | não | `400 missing_server_id` — indistinguível de ausente |
        | `0` | não | `400 missing_server_id` — **indistinguível de ausente** |
        | `"1"` (texto) | não | `400 could_not_decode_payload` |
        | `>= 1` | sim | — |

        **Consequência de `0` ser lido como ausência**: não há maneira de
        reagir à mensagem de `server_id` 0, se ela existir. A validação é
        `r.ServerID == 0` (`newsletter_ops.go:230`), e o campo é `int` e não
        `*int`, logo o valor zero não se distingue de não ter vindo.
      example: 1
    reaction:
      type: string
      nullable: false
      description: |
        O emoji da reação.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | sim | **REMOVE** a reação existente |
        | `null` | sim | remove — indistinguível de ausente |
        | `""` | sim | remove — indistinguível de ausente |
        | emoji | sim | põe a reação |

        **Vazio remove**, e é por isso que a validação não o exige
        (`newsletter_ops.go:234`): exigi-lo tornaria impossível desfazer uma
        reação. A consequência é que um cliente com um bug que perca o campo
        `reaction` **apaga** a reação em vez de dar erro.

        O canal declara em `settings.reaction_codes.value` que reações aceita
        (`ALL` nos casos medidos). Não validamos o emoji contra isso.
      example: 👍
    message_id:
      type: string
      nullable: false
      description: |
        Identificador da mensagem, quando o cliente o tem. **Opcional** —
        ausente, `null` e `""` são indistinguíveis e resultam num
        `types.MessageID` vazio, que segue assim para o WhatsApp. Não há
        validação de formato do nosso lado. Os valores reais têm 22 ou 32
        caracteres hexadecimais (ver `MensagemCanal.message_id`).
      example: 3EB0A4B2AFD45E625C0917

PedidoAdminCanal:
  type: object
  description: |
    Pedido das operações que apontam para OUTRO utilizador: convidar para
    administrador (`/newsletter/admin-invite`), revogar esse convite
    (`/newsletter/admin-invite/revoke`), despromover (`/newsletter/demote`) e
    transferir a posse (`/newsletter/change-owner`).

    São as únicas quatro das dezoito que exigem `user_jid`.
  required: [jid, user_jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid`, e é verificado **antes** de `user_jid`. Ver
        `PedidoCanal`.
      example: 120363411025775186@newsletter
    user_jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do utilizador alvo. Aceita **PN ou LID**.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_user_jid` |
        | `null` | não | `400 missing_user_jid` — indistinguível de ausente |
        | `""` | não | `400 missing_user_jid` — indistinguível de ausente |
        | PN (`…@s.whatsapp.net`) | sim | convertido para LID antes do envio |
        | LID (`…@lid`) | sim | usado tal e qual |
        | texto não interpretável | passa a validação | `500 newsletter_failed` — a falha de `wajid.ToJID` não vira `400` |

        **A mensagem do `400` muda com a rota, embora o código não mude.**
        Todas as quatro devolvem `missing_user_jid`, com quatro textos
        diferentes — medidos:

        | rota | `message` |
        |---|---|
        | `/newsletter/admin-invite` | `invitee jid is required` |
        | `/newsletter/admin-invite/revoke` | `invitee jid is required for revoke` |
        | `/newsletter/demote` | `user jid is required for demote` |
        | `/newsletter/change-owner` | `new owner jid is required` |

        Quem discrimina pela mensagem em vez do código parte quando o texto
        mudar; o código é o contrato.

        **A conversão PN→LID é direccional** (`adapter.go:489`, F233c): um LID
        nunca é convertido de volta para PN. Se o armazenamento da sessão não
        conhecer o número, o JID segue como está, é registado um aviso no log,
        e é o WhatsApp que recusa — **não há erro nosso nesse caso**.
      example: 90937376170214@lid

PedidoApagarCanal:
  type: object
  description: |
    Pedido de eliminação de canal, em `DELETE /newsletter/delete` — **é a única
    rota deste grupo que não é `POST`**. Exige confirmação explícita:
    `confirm_jid` tem de ser idêntico a `jid`.
  required: [jid, confirm_jid]
  properties:
    jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do canal a apagar. Obrigatório; ausente, `null` e `""` dão
        `400 missing_jid`, e é verificado **antes** de `confirm_jid` — medido:
        `{"confirm_jid":"x"}` revela `missing_jid`, não `missing_confirm_jid`.
        Ver `PedidoCanal`.
      example: 120363411025775186@newsletter
    confirm_jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        Repetição literal de `jid`. A validação tem **dois ramos**, e ambos
        devolvem o mesmo código (`newsletter_ops.go:266`):

        ```go
        r.ConfirmJID == "" || r.ConfirmJID != r.JID
        ```

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_confirm_jid` — ramo `== ""` |
        | `null` | não | `400 missing_confirm_jid` — indistinguível de ausente |
        | `""` | não | `400 missing_confirm_jid` — indistinguível de ausente |
        | diferente de `jid` | não | `400 missing_confirm_jid` — ramo `!= r.JID`, **e o código diz `missing` para um campo que foi enviado** |
        | igual a `jid` | sim | o canal é apagado, **irreversivelmente** |

        Os três primeiros ramos foram medidos, e o quarto também
        (`confirm_jid` de outro canal existente). Repare que a comparação é
        **literal**: dois JID que apontem para o mesmo canal com grafia
        diferente não passam, porque não há normalização antes da comparação.

        **Enquanto a confirmação falhar, o WhatsApp NEM É CONTACTADO.** A
        validação corre no use case, antes do despacho — logo um `400` daqui
        garante que nada foi apagado.
      example: 120363411025775186@newsletter

# --- Canais: respostas ------------------------------------------------------

MetadadosCanal:
  type: object
  description: |
    Metadados de um canal, dentro da chave `newsletter` de
    `POST /newsletter/create`, `POST /newsletter/info` e
    `POST /newsletter/info-invite`, e dentro de `newsletters[]` de
    `GET /newsletter/list`.

    **Esta forma foi REESCRITA na migração para DTO (2026-08-27).** Antes dela a
    resposta era a struct do vendor serializada directamente, o que tinha duas
    consequências: os números vinham como texto entre aspas (`"1787746245"`,
    `"0"`), e a forma dependia do MOTOR da sessão — o motor headless servia
    `{"JID":…,"Subscribers":…,"Membership":…}` na mesma rota. As duas
    desapareceram; ver `docs/HTTP-DTO-CONVENTIONS.md`.

    O que mudou, campo a campo:

    | antes | agora |
    |---|---|
    | `id` | `jid` |
    | `state: {type: "active"}` | `state: "active"` |
    | `thread_metadata.creation_time: "1787746245"` | `created_at: "2026-…Z"` ou `null` |
    | `thread_metadata.invite` | `invite_code` |
    | `thread_metadata.name.update_time: "0"` | `name.updated_at: null` |
    | `thread_metadata.subscribers_count: "0"` | `subscriber_count: 0` |
    | `thread_metadata.verification` | `verification_state` |
    | `thread_metadata.settings.reaction_codes.value` | `reactions_mode` |
    | `viewer_metadata: {mute, role}` | `viewer: {mute_state, role}` |
    | `thread_metadata.picture` / `preview` | `picture` / `preview`, no topo |

    **Todos os campos aparecem SEMPRE** — não há `omitempty` em campo nenhum
    desta resposta. Os que podem vir `null` são `created_at`, os dois
    `updated_at`, `picture`, `preview` e `viewer`, e cada um diz abaixo o que o
    `null` significa.
  required:
    [jid, state, created_at, invite_code, name, description, subscriber_count,
     verification_state, reactions_mode, picture, preview, viewer]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        JID do canal, no servidor `@newsletter`. **Vem `""` — não `null`, não
        ausente — quando o canal pedido não existe**, e nesse caso `state` é
        `non_existing` e o estado HTTP continua a ser `200`. Medido a
        2026-08-26 com o JID de um canal apagado.

        Um cliente que ecoe `jid` sem verificar `state` mostra uma cadeia vazia
        ao utilizador.
      example: 120363411025775186@newsletter
    state:
      type: string
      nullable: false
      description: |
        Estado do canal do ponto de vista do servidor, **como texto** — era um
        objecto de uma chave (`state.type`), e o nível intermédio não carregava
        informação nenhuma.

        | valor | quando aparece |
        |---|---|
        | `active` | canal em funcionamento |
        | `deleted` | apagado, **mas ainda listado** em `GET /newsletter/list`, com os textos zerados e `viewer: null` |
        | `non_existing` | o que `POST /newsletter/info` devolve para um canal apagado ou que nunca existiu |
        | `""` | o motor **headless** não reporta estado nenhum, e um estado inventado seria pior que a ausência |

        Os três primeiros foram medidos a 2026-08-26. **A lista não está
        fechada por enumeração no código**: é um campo de resposta copiado do
        WhatsApp, sem validação nossa. Um valor desconhecido é devolvido tal e
        qual.

        **Ao filtrar "os meus canais", filtre por `active`**, e não por
        "diferente de `deleted`": um valor novo passaria pelo segundo teste.
      example: active
    created_at:
      type: string
      format: date-time
      nullable: true
      description: |
        Instante de criação, em **RFC 3339 e em UTC**. Era `creation_time`, um
        inteiro Unix embrulhado em aspas.

        **`null` quando o canal não reporta instante nenhum** — canal apagado
        ou inexistente, e todo canal visto pelo motor headless. Era `"0"` nesses
        casos, que é uma data válida em Unix: quem convertesse sem verificar
        `state` mostrava "1 de Janeiro de 1970". `null` não tem essa leitura.
      example: '2026-08-26T12:40:54Z'
    invite_code:
      type: string
      nullable: false
      description: |
        Código do convite público, o mesmo que `POST /newsletter/info-invite`
        aceita. **Vem `""`** em canal apagado, inexistente, ou visto pelo motor
        headless; nunca `null`, nunca ausente.
      example: 0029Vb85MPpKLaHoEUxRt01E
    name:
      $ref: '#/components/schemas/TextoDeCanal'
    description:
      $ref: '#/components/schemas/TextoDeCanal'
    subscriber_count:
      type: integer
      nullable: false
      description: |
        Número de seguidores, **como inteiro**. Era `subscribers_count`, texto.
        Nunca `null`, nunca ausente.

        **Ressalva medida, e ela não mudou com a migração**: veio `0` em todos
        os canais observados pelo motor wa-noise, incluindo um canal público de
        terceiro com milhares de seguidores. O que este campo significa quando
        não é zero **não foi determinado com segurança** nesse motor. O motor
        headless reporta a contagem que a página mostra.
      example: 0
    verification_state:
      type: string
      nullable: false
      description: |
        Estado de verificação do canal. Valores observados: `unverified` (canal
        comum), `verified` (verificado pelo WhatsApp) e `""` (canal apagado ou
        inexistente, no motor wa-noise).

        **O motor headless nunca responde `""` aqui**, e a diferença é uma
        decisão registada: a página responde um BOOLEANO, que não tem terceiro
        estado, e o falso dela é traduzido para `unverified`. Nesse motor,
        portanto, "não verificado" e "desconhecido" são a mesma resposta.

        Não está declarado como enumeração: é um campo de resposta copiado do
        WhatsApp, sem validação nossa, e `""` já mostra que o conjunto não é
        fechado.
      example: unverified
    reactions_mode:
      type: string
      nullable: false
      description: |
        Que reações o canal aceita. Era
        `thread_metadata.settings.reaction_codes.value`, três níveis de objecto
        para uma folha.

        `ALL` em todos os canais activos medidos, `""` em canal apagado e no
        motor headless. **Não é enumeração validada** — é copiado do WhatsApp,
        em MAIÚSCULAS como o protocolo o escreve, e um valor novo é devolvido
        tal e qual. Nós não verificamos o emoji de `POST /newsletter/react`
        contra este campo.
      example: ALL
    picture:
      allOf:
        - $ref: '#/components/schemas/ImagemDeCanal'
      nullable: true
      description: |
        Descritor da imagem de perfil, **ou `null`**.

        | rota | o que foi medido |
        |---|---|
        | `GET /newsletter/list` | `null` em TODOS os canais, incluindo os que têm imagem |
        | `POST /newsletter/info` | objecto preenchido para o MESMO canal |
        | canal apagado | `null` nas duas |
        | motor headless | `null` sempre — a página não reporta imagem nesta capacidade |

        **`null` aqui não significa "canal sem imagem"** — significa "esta rota
        não a trouxe".
    preview:
      allOf:
        - $ref: '#/components/schemas/ImagemDeCanal'
      nullable: true
      description: |
        Descritor da pré-visualização, com a **mesma forma** de `picture`.

        Ao contrário de `picture`, veio como objecto (nunca `null`) em todas as
        medições do motor wa-noise, incluindo `GET /newsletter/list` e canal
        apagado — e a assimetria é PRESERVADA de propósito em vez de suavizada:
        colapsar as duas para "null quando vazio" afirmaria que o canal não tem
        pré-visualização, coisa que o protocolo nunca disse. `null` no motor
        headless.
    viewer:
      allOf:
        - $ref: '#/components/schemas/RelacaoComCanal'
      nullable: true
      description: |
        O que este canal é **para quem chamou**. Era `viewer_metadata`.

        **Vem `null`** quando o chamador não tem relação com o canal. Medido
        `null` em três situações distintas: `POST /newsletter/info-invite` sobre
        um canal próprio, entrada com `state: deleted` dentro de
        `GET /newsletter/list`, e `POST /newsletter/info` sobre canal apagado.

TextoDeCanal:
  type: object
  description: |
    O nome ou a descrição de um canal, com o instante da última alteração.
    **Sempre presente e nunca `null`**; num canal apagado vem
    `{text: "", id: "", updated_at: null}`.
  required: [text, id, updated_at]
  properties:
    text:
      type: string
      nullable: false
      description: O texto. `""` em canal apagado, inexistente, ou sem descrição; nunca `null`.
      example: Avisos da Fila Rápida
    id:
      type: string
      nullable: false
      description: |
        Identificador **desta versão do texto**, e não do canal, como cadeia de
        dígitos. `""` em canal apagado e em todo canal visto pelo motor
        headless, que não reporta versões.
      example: '1787745654587070'
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: |
        Instante da última alteração, em **RFC 3339 e em UTC**. Era
        `update_time`, um inteiro de dezasseis dígitos entre aspas — repare que
        a granularidade era MICROSSEGUNDOS, contra segundos em `creation_time`,
        e que a diferença não estava assinalada em lado nenhum.

        **`null` quando não há instante**, o que era `"0"` — a mesma armadilha
        de 1970 de `created_at`.
      example: '2026-08-26T12:40:54Z'

ImagemDeCanal:
  type: object
  description: |
    Descritor de uma imagem de canal. **Não carrega bytes**: descarregar é
    outra chamada.
  required: [url, id, type, direct_path]
  properties:
    url:
      type: string
      nullable: false
      description: |
        URL de descarga. **Veio `""` em todos os canais próprios medidos**;
        nunca `null`. Vazio significa que é preciso outra chamada para obter a
        imagem.
      example: ''
    id:
      type: string
      nullable: false
      description: |
        Identificador da imagem, como texto. `""` em canal apagado; nunca
        `null`. **Muda entre chamadas** para o mesmo canal — medido
        `1787750687544878` e `1787756516362051` com minutos de intervalo —,
        logo não serve como chave de cache.
      example: '1787750687544878'
    type:
      type: string
      nullable: false
      description: |
        Tipo do descritor. `IMAGE` em `picture`, `PREVIEW` em `preview`, `""`
        em canal apagado. Não é enumeração validada: é copiado do WhatsApp e um
        valor novo passa tal e qual.
      example: IMAGE
    direct_path:
      type: string
      nullable: false
      description: |
        Caminho directo no CDN do WhatsApp. `""` nos canais próprios medidos e
        preenchido num canal de terceiro — nunca `null`, nunca ausente.
      example: ''

RelacaoComCanal:
  type: object
  description: |
    A relação de quem chamou com o canal. Quando o objecto não é `null`, traz
    sempre as duas propriedades.
  required: [mute_state, role]
  properties:
    mute_state:
      type: string
      nullable: false
      description: |
        Silenciamento **como texto, não como booleano**: `on` quando
        silenciado, `off` quando não. Era `viewer_metadata.mute`.

        **Só `on` foi medido.** `off` é o valor esperado do outro lado (é o que
        `POST /newsletter/mute` com `mute:false` deveria produzir), mas não foi
        observado porque exigiria uma escrita. `""` no motor headless, que não
        reporta silenciamento.
      example: 'on'
    role:
      type: string
      nullable: false
      description: |
        Papel do chamador no canal. Os três valores do motor wa-noise foram
        medidos ponta a ponta na cadeia de administração de 2026-08-26 (F233):

        | valor | significa |
        |---|---|
        | `owner` | dono; pode apagar, transferir posse e convidar administradores |
        | `admin` | administrador; **não pode deixar de seguir o canal** (`403 newsletter_admin_cannot_unfollow`) |
        | `subscriber` | seguidor comum |

        **O motor headless escreve aqui a palavra da PÁGINA**, verbatim e sem
        tradução — `guest` foi o valor medido, e não pertence à lista acima.
        Traduzi-lo reivindicaria um mapeamento que ninguém mediu.

        **É um campo de RESPOSTA**: não passa por validação nossa, e um valor
        desconhecido é devolvido tal e qual. Um cliente que faça `switch` sobre
        ele tem de ter ramo de omissão — e o ramo seguro é tratar desconhecido
        como `subscriber`, porque é o menos permissivo.
      example: owner

CanalUnico:
  type: object
  description: |
    Resposta de `POST /newsletter/create`, `POST /newsletter/info` e
    `POST /newsletter/info-invite`.

    **O canal passou a vir EMBRULHADO** na chave `newsletter`; antes ocupava
    `data` directamente. O embrulho é o que dá a estas três rotas a mesma forma
    das outras da família — cada uma responde um objecto com a carga nomeada —
    e é onde um `meta` de paginação caberia sem mexer em campo nenhum.
  required: [newsletter]
  properties:
    newsletter:
      allOf:
        - $ref: '#/components/schemas/MetadadosCanal'
      nullable: true
      description: |
        O canal. **`null` só quando o motor não devolveu nada**, o que não foi
        observado num `200`: um canal inexistente vem como objecto com `jid`
        vazio e `state: non_existing`, e não como `null`.

ListaCanais:
  type: object
  description: |
    Resposta de `GET /newsletter/list`. Repare no envelope duplo: a carga útil é
    um objecto com a chave `newsletters`, e só dentro dela está a lista.

    **A chave era `newsletter`, no singular**, e mudou no corte a seco da
    migração para DTO: uma lista de canais nomeada no singular lê-se como um
    canal.
  required: [newsletters]
  properties:
    newsletters:
      type: array
      nullable: false
      description: |
        Os canais que a sessão segue.

        **Nunca é `null` nem ausente**: os dois adaptadores constroem a fatia
        com `make`, e o apresentador também, logo uma sessão sem canais devolve
        `[]`. Isto distingue-a de outras rotas desta API, onde uma lista vazia
        vem como `data: null` (F270).

        **Inclui canais com `state: deleted`** — medido a 2026-08-26 —, com os
        textos zerados e `viewer: null`. Um cliente que mostre "os meus canais"
        tem de filtrar por `state == "active"`, ou mostra entradas sem nome.

        Não há paginação, cursor nem tecto: a lista vem inteira.
      items:
        $ref: '#/components/schemas/MetadadosCanal'

MensagensCanal:
  type: object
  description: |
    Resposta de `POST /newsletter/messages` e de `POST /newsletter/updates`.

    **As publicações passaram a vir EMBRULHADAS** na chave `messages`; antes a
    lista ocupava `data` directamente, o que fazia desta a única rota da família
    sem chave nomeada.

    Ordenada da mais antiga para a mais recente dentro da janela pedida
    (`server_id` crescente), e a janela é as últimas `count` publicações.
  required: [messages]
  properties:
    messages:
      type: array
      nullable: false
      description: |
        As publicações. Um canal sem publicações devolve `[]`, nunca `null`.
      items:
        $ref: '#/components/schemas/MensagemCanal'

MensagemCanal:
  type: object
  description: |
    Uma publicação de canal. **Forma medida a 2026-08-26** sobre sessenta
    publicações reais de um canal público seguido, e depois REESCRITA na
    migração para DTO.

    O que mudou, e porquê:

    | antes | agora |
    |---|---|
    | `MessageServerID` | `server_id` |
    | `MessageID` | `message_id` |
    | `Type` | `type` |
    | `Timestamp`, no fuso do servidor | `timestamp`, RFC 3339 em UTC, ou `null` |
    | `ViewsCount` | `view_count` |
    | `ReactionCounts`, objecto de chaves emoji | `reactions`, **array** de `{emoji, count}` |
    | `Message`, a árvore protobuf | `text`, e mais nada |

    As duas últimas linhas são mudanças de FORMA e não renomeações, e as duas
    têm a mesma causa: a regra de nomes públicos
    (`^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$`) aplica-se a toda chave de objecto,
    recursivamente. Um emoji nunca poderá ser uma chave conforme, e as chaves de
    dentro da árvore protobuf são o camelCase do vendor (`extendedTextMessage`,
    `fileLength`, `directPath`), que não é nosso para renomear.

    **A ÁRVORE DA MENSAGEM DESAPARECEU do fio, e essa é a perda deliberada
    desta migração.** O que um cliente renderiza está em `text`; o que ele não
    podia usar era a árvore, cuja forma interna a própria medição encontrou a
    variar com o cliente que publicou.
  required: [server_id, message_id, type, timestamp, view_count, reactions, text]
  properties:
    server_id:
      type: integer
      nullable: false
      description: |
        Identificador da publicação **dentro do canal**, atribuído pelo
        servidor. Sempre presente, nunca `null`. É o valor que
        `POST /newsletter/mark-viewed` (`server_ids`),
        `POST /newsletter/react` (`server_id`) e a paginação (`before`) pedem.

        Crescente e aparentemente contíguo dentro de um canal — medido de 4321
        a 4380 sem saltos.
      example: 4379
    message_id:
      type: string
      nullable: false
      description: |
        Identificador global da mensagem, hexadecimal maiúsculo.

        **Duas formas coexistem no mesmo canal**, medidas: 22 caracteres com
        prefixo `3EB0` (`3EB0DC0F29B6DA6AB033EE`) e 32 caracteres sem prefixo
        fixo (`ACDC1643FEA86B9C252011C9C8673FF0`). Um cliente que valide
        comprimento ou prefixo rejeita metade das publicações reais.

        Sempre presente, nunca `null`.
      example: 3EB0A4B2AFD45E625C0917
    type:
      type: string
      nullable: false
      description: |
        Tipo declarado da publicação. Valores medidos: `media` (56 de 60) e
        `text` (4 de 60).

        **Não é de confiança, e a medição é explícita quanto a isso**: catorze
        publicações que só tinham texto vieram marcadas `media`. **Para saber se
        há conteúdo legível, olhe `text`, não este campo.**

        Não está declarado como enumeração porque é copiado do WhatsApp sem
        validação nossa.
      example: media
    timestamp:
      type: string
      format: date-time
      nullable: true
      description: |
        Instante da publicação, em **RFC 3339 e em UTC**. Vinha com o
        deslocamento de fuso do SERVIDOR (`2026-08-25T19:22:23-04:00`), que
        fazia desta a terceira forma de data desta API; agora é a mesma de
        `created_at`.

        `null` quando o protocolo não reporta instante.
      example: '2026-08-25T23:22:23Z'
    view_count:
      type: integer
      nullable: false
      description: |
        Contagem de visualizações. **Veio `0` nas sessenta publicações
        medidas**, incluindo as que tinham dezenas de reações — logo é `0` que
        se deve esperar, e o que um valor não-zero significaria **não foi
        determinado com segurança**. Sempre presente, nunca `null`.
      example: 0
    reactions:
      type: array
      nullable: false
      description: |
        As reações à publicação, uma entrada por emoji. **Nunca `null`**; `[]`
        para uma publicação sem reações.

        **Ordenada por contagem decrescente e, em empate, pelo emoji**, e a
        ordenação não é estética: a ordem de iteração de mapa em Go é aleatória
        por desenho, então uma fatia não ordenada faria a mesma publicação
        serializar diferente a cada pedido.

        **Os emojis NÃO são normalizados**: o mesmo emoji aparece como entradas
        SEPARADAS conforme o selector de variação Unicode. Medido na mesma
        publicação: `"❤"` com 1 e `"❤️"` com 6, e `"🏳‍🌈"` com 1 ao lado de
        `"🏳️‍🌈"` com 1. Quem somar reações tem de normalizar antes, ou conta a
        mesma reação duas vezes.
      items:
        $ref: '#/components/schemas/ReacaoDeCanal'
    text:
      type: string
      nullable: false
      description: |
        O conteúdo legível da publicação, extraído da mensagem do protocolo.
        Nunca `null`; `""` quando não há nenhum.

        **A extracção é rasa de propósito**, e cobre as cinco formas que
        carregam texto: `conversation`, `extendedTextMessage.text` e a legenda
        de imagem, vídeo e documento. Uma publicação de outro tipo — uma
        enquete, uma localização — dá `""`, o que é honesto: a rota diz que a
        publicação existe, quando, e quantos reagiram, e não diz nada sobre
        conteúdo que não leu.

        **É o que resta da árvore protobuf**, que era servida inteira em
        `Message` e saiu do contrato. Ver a descrição do esquema.
      example: Bom dia

ReacaoDeCanal:
  type: object
  description: Um emoji e quantas pessoas reagiram com ele.
  required: [emoji, count]
  properties:
    emoji:
      type: string
      nullable: false
      description: |
        O emoji, **exactamente como o protocolo o escreveu**, sem normalização
        Unicode. Nunca `null`.
      example: 👍
    count:
      type: integer
      nullable: false
      description: Quantas pessoas reagiram com esse emoji exacto. Nunca `null`.
      example: 3

SubscricaoCanal:
  type: object
  description: |
    Resposta de `POST /newsletter/subscribe`.

    **Esta rota respondia `data: null`.** O use case calculava a duração do
    arrendamento e o manipulador servia só a carga da operação, que a subscrição
    deixa vazia — logo o único facto que esta rota existe para dizer nunca
    chegava ao cliente. Corrigido na migração para DTO.
  required: [status, duration_seconds]
  properties:
    status:
      type: string
      nullable: false
      description: '`sent` quando a operação chegou ao WhatsApp. Nunca `null`.'
      example: sent
    duration_seconds:
      type: integer
      nullable: false
      description: |
        Por quantos **segundos** as actualizações ao vivo valem. É o
        arrendamento do SERVIDOR, não escolha nossa, e é o que diz ao chamador
        quando repetir a chamada.

        Truncado para segundos inteiros: o protocolo mede em segundos e um resto
        de sub-segundo seria ruído sobre o qual ninguém age. `0` quando o
        servidor não reportou arrendamento.
      example: 90

ReconhecimentoCanal:
  type: object
  description: |
    Resposta das rotas de canal que mudam alguma coisa e não devolvem carga:
    `follow`, `unfollow`, `mute`, `mark-viewed`, `react`, `demote`,
    `change-owner`, `delete` e as três de `admin-invite`.

    **Estas rotas respondiam `data: null`**, pela mesma causa da subscrição.
    `null` não se distingue de uma rota que falhou a encher a carga, e um
    chamador que procurasse em `data` um sinal de sucesso não encontrava nenhum.
  required: [status]
  properties:
    status:
      type: string
      nullable: false
      description: '`sent` quando a operação chegou ao WhatsApp. Nunca `null`.'
      example: sent

# --- Comunidades ------------------------------------------------------------

PedidoComunidade:
  type: object
  description: |
    Pedido de leitura sobre uma comunidade: `POST /community/subgroups` e
    `POST /community/participants`.

    **É o único par de rotas deste ficheiro que aceita o alias universal
    `chat`** — as quatro rotas de canal e as duas de ligação não o aceitam.
    Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
    regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
    recusa-os com `400 unknown_field`.
  properties:
    community_jid:
      type: string
      nullable: false
      description: |
        JID da comunidade — que é um JID de **GRUPO** (`@g.us`), porque uma
        comunidade é um grupo-pai. Não existe servidor `@community`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | ver `chat` | `400 missing_community_jid` **se `chat` também faltar** |
        | `null` | ver `chat` | idem — indistinguível de ausente |
        | `""` | ver `chat` | idem — **e é este estado que faz o alias `chat` entrar** |
        | `"   "` | não | `400 invalid_community_jid`, `could not parse community JID "   "` |
        | `"lixo"` | não | `400 invalid_community_jid` |
        | `@g.us` real | sim | — |

        **Repare na diferença para as rotas de canal**: aqui um JID malformado
        dá `400` com código próprio, porque o use case embrulha a falha num
        `apperr` de validação (`community.go:37`). Nas rotas de canal o mesmo
        defeito dá `500 newsletter_failed`. As duas famílias tratam o mesmo
        erro de forma diferente.

        **Não há rota `/community/create`**: uma comunidade cria-se em
        `POST /group/create` com `is_parent: true`.
      example: 120363430034334401@g.us
    chat:
      type: string
      nullable: false
      description: |
        Alias universal de destino (`ChatTarget`, `pkg/domain/chat_target.go`).

        **Só é usado quando `community_jid` estiver vazio** — ausente, `null`
        ou `""`, que são indistinguíveis entre si. Quando ambos vêm
        preenchidos, **`community_jid` ganha e `chat` é ignorado em
        silêncio**: medido a 2026-08-26 mandando `community_jid` real e
        `chat: "outro@g.us"`, e a resposta foi a da comunidade de
        `community_jid`. Não há erro de conflito.

        Ausente, `null` e `""` são indistinguíveis; se `community_jid` também
        faltar, a resposta é `400 missing_community_jid`.

        **Este alias NÃO existe em `/community/link` nem em
        `/community/unlink`** — medido: `{"chat":"…","group_jid":"…"}` devolve
        `400 missing_community_jid`.
      example: 120363430034334401@g.us

PedidoLigacaoComunidade:
  type: object
  description: |
    Pedido de ligação ou desligação de um grupo a uma comunidade
    (`POST /community/link` e `POST /community/unlink`).

    **Não aceita o alias `chat`**: a struct não embute `ChatTarget`
    (`pkg/domain/community.go:31-40`). Mandá-lo não dá erro — é ignorado como
    qualquer campo desconhecido, e o pedido falha com
    `400 missing_community_jid`. Medido.
  required: [community_jid, group_jid]
  properties:
    community_jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID da comunidade (grupo-pai), no servidor `@g.us`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_community_jid` |
        | `null` | não | idem — indistinguível de ausente |
        | `""` | não | idem — indistinguível de ausente |
        | não interpretável | não | `400 invalid_jid`, `could not parse community JID "…"` |
        | `@g.us` real | sim | — |

        **É verificado antes de `group_jid`**: um pedido sem os dois revela
        primeiro este. Medido.

        **O código do JID malformado é `invalid_jid` aqui**, e não
        `invalid_community_jid` como nas duas rotas de leitura — são funções
        de parse diferentes (`community.go:106` contra `community.go:37`).
      example: 120363430034334401@g.us
    group_jid:
      type: string
      nullable: false
      minLength: 1
      description: |
        JID do grupo a ligar ou desligar, no servidor `@g.us`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_group_jid` |
        | `null` | não | idem — indistinguível de ausente |
        | `""` | não | idem — indistinguível de ausente |
        | não interpretável | não | `400 invalid_jid`, `could not parse group JID "…"` |
        | `@g.us` real | sim | — |

        **O grupo de avisos da comunidade não pode ser desligado**: nasce com
        ela e vem marcado `is_default_sub_group: true` (F237).
      example: 120363411669320145@g.us

SubGruposComunidade:
  type: object
  description: |
    Resposta de `POST /community/subgroups`. A lista está dentro da chave
    `sub_groups`, um nível abaixo de `data`.
  required: [sub_groups]
  properties:
    sub_groups:
      type: array
      nullable: false
      description: |
        Os grupos ligados à comunidade.

        **Nunca vem vazia numa comunidade real**: o grupo de avisos é criado
        com a comunidade e aparece sempre, marcado com `is_default_sub_group:
        true` (F237, medido com a transição 1 → 2 → 1 provocada por
        `POST /community/link` e `POST /community/unlink`).

        **Sempre `[]`, nunca `null`**: `PresentGetCommunitySubGroups`
        (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
        antes do laço, mesmo vazia — fecha a incerteza sobre `null` que este
        ficheiro registava antes da migração para DTO, quando o campo ainda
        era `any` na struct de resultado.

        Sem paginação e sem tecto.
      items:
        $ref: '#/components/schemas/SubGrupoComunidade'

SubGrupoComunidade:
  type: object
  description: |
    Um grupo ligado à comunidade. O corpo é
    `dtogroup.CommunitySubGroupResponse`
    (`pkg/presentation/http/dto/group/group.go`), produzido por
    `PresentCommunitySubGroup` — três campos, `snake_case`, e não mais os seis
    da struct de protocolo serializada directamente que este ficheiro
    documentava antes da migração para DTO. `name_set_at`/`name_set_by`/
    `name_set_by_pn` desapareceram: eram detalhe do protocolo, não do recurso
    — a mesma decisão de `InfoGrupoCanonico` (`docs/HTTP-DTO-CONVENTIONS.md`).
  required: [jid, name, is_default_sub_group]
  properties:
    jid:
      type: string
      nullable: false
      description: JID do sub-grupo, no servidor `@g.us`. Sempre presente; nunca `null`, nunca ausente.
      example: 120363411669320145@g.us
    name:
      type: string
      nullable: false
      description: |
        Nome do sub-grupo. Sempre presente; nunca `null`. **`""` é possível**
        — um grupo pode não ter nome definido —, e nesse caso é
        indistinguível de "o servidor não informou".
      example: Avisos
    is_default_sub_group:
      type: boolean
      nullable: false
      description: |
        `true` no **grupo de avisos**, que a comunidade cria sozinha e que não
        pode ser desligado. `false` nos grupos ligados por
        `POST /community/link`.

        Sempre presente; nunca `null`. É o campo que distingue "o grupo que
        sobra sempre" de "os grupos que eu liguei" — medido na transição
        1 → 2 → 1 da F237, em que foi este que ficou.
      example: true

ParticipantesComunidade:
  type: object
  description: |
    Resposta de `POST /community/participants`. A lista está dentro da chave
    `participants`, um nível abaixo de `data`.
  required: [participants]
  properties:
    participants:
      type: array
      nullable: false
      description: |
        Os participantes de **todos** os grupos ligados, reunidos numa lista
        só, em **LID** — medido a 2026-08-26. Quem precisar do número tem de
        resolver o LID por outra rota; **esta não devolve PN**.

        **Não foi determinado com segurança** se a lista traz duplicados
        quando a mesma pessoa está em dois sub-grupos: a comunidade medida
        tinha um só sub-grupo. Trate a lista como podendo repetir.

        **Sempre `[]`, nunca `null`**: `PresentGetCommunityParticipants`
        (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
        antes do laço, mesmo vazia — fecha a incerteza sobre `null` que este
        ficheiro registava antes da migração para DTO, quando o campo ainda
        era `any` na struct de resultado.

        Sem paginação e sem tecto.
      items:
        type: string
        nullable: false
        description: |
          LID de um participante (`<opaco>@lid`). Nunca `null` dentro da lista
          nos casos medidos; nunca em PN.
      example: ['90937376170214@lid', '29343770251463@lid']
