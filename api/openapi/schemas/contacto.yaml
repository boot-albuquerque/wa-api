# Grupo: Contactos e utilizadores + Status.
#
# Os esquemas abaixo foram MEDIDOS contra o servidor vivo em 2026-08-26, com
# as sessões `filarapida` (conta WhatsApp Business, 461 contactos) e `lucas`
# (conta pessoal, 3456 contactos), salvo os das rotas de escrita, que não
# podem ser chamadas e vêm assinaladas como derivadas do código.
#
# A REGRA DE OURO desta API, e a razão de quase toda tabela de estados abaixo:
# o `encoding/json` do Go trata `null` num campo NÃO-PONTEIRO como *nada a
# fazer* — o campo fica com o valor zero. Logo, para um campo declarado
# `string`, `bool` ou `int` sem `*`, **ausente ≡ `null` ≡ valor zero**, e os
# três são indistinguíveis para o servidor. Só o TIPO ERRADO se distingue, com
# `400 could_not_decode_payload`.
#
# Campo desconhecido é IGNORADO em silêncio em toda a API — medido:
# `POST /user/check {"phone":["554192421234"],"lixo":1}` devolve `200` e o
# resultado normal. Não há `DisallowUnknownFields`, e por isso
# `additionalProperties: false` NÃO é declarado em esquema nenhum: seria falso.

# ---------------------------------------------------------------- verificação

PedidoVerificacaoNumero:
  type: object
  description: |
    Números a verificar contra a base do WhatsApp. O campo é um ARRAY mesmo
    para um único número — a rota foi feita para verificação em lote.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [phone]
  properties:
    phone:
      type: array
      nullable: true
      description: |
        Números a verificar. Aceita o número NU (`554192421234`), que é a forma
        medida em campo, e também o JID completo — nesse caso `query` volta com
        o JID, tal e qual foi pedido.

        O nome declarado na struct (`pkg/domain/user.go`, `CheckUserRequest`) é
        `phone`; como o `encoding/json` do Go casa nomes ignorando maiúsculas,
        `Phone` também é aceite (medido).

        **Está declarado `required`, e mesmo assim as quatro formas de "não
        pedi nada" passam com `200`.** Não há `minItems` na implementação:

        | estado | aceite? | efeito medido |
        |---|---|---|
        | ausente (`{}`) | **sim** | `200 {"data":null}` |
        | `null` | **sim** | `200 {"data":null}` — indistinguível de ausente |
        | `[]` | **sim** | `200 {"data":null}` |
        | `[""]` | **sim** | `200 {"data":null}` |
        | `["   "]` | **sim** | `200 {"data":null}` |
        | `["nao-e-numero"]` | **sim** | `200 {"data":null}` |
        | `"554192421234"` (não-array) | não | `400 could_not_decode_payload` |
        | `[null]` | **sim** | vira `[""]`; `200 {"data":null}` |
        | preenchido | sim | uma entrada por número que o servidor reconheceu |

        Repare em `data: null`, que **não é** `data: []`: quem iterar sobre a
        resposta sem verificar nulidade parte. A causa está no caso de uso, que
        acumula em `var results []CheckUserResult` e devolve a fatia nil
        (`check_user.go:44-54`).

        **Item inválido é DESCARTADO EM SILÊNCIO, e duplicados são
        colapsados.** Medido: `["554192421234",""]` devolve UMA entrada, e
        `["554192421234","554192421234"]` também devolve UMA. A resposta
        **não** é posicional em relação ao pedido — case sempre pelo campo
        `query`, nunca pelo índice.
      items:
        type: string
        nullable: false
        description: |
          Um número, nu (`554192421234`) ou como JID completo. `""` e cadeias
          que não são número são aceites na descodificação e desaparecem da
          resposta sem erro. `null` num item vira `""` (o item é `string`, não
          `*string`).
        example: '554192421234'
      example: ['554192421234']

ResultadoVerificacaoNumero:
  type: object
  description: |
    Uma entrada por número que o servidor do WhatsApp reconheceu.
    `is_in_whatsapp: false` NÃO é erro — é a resposta à pergunta.

    **Nenhum dos quatro campos tem `omitempty`**, logo os quatro aparecem
    SEMPRE que a entrada exista. O que varia é o conteúdo, não a presença.

    Os nomes não mudaram na migração de DTO de 2026-08-27 — já eram
    canónicos. O que mudou foi o embrulho: `data` deixou de ser o array e
    passou a ser `{"users": [...]}`.

    Números que não produziram entrada não aparecem de forma nenhuma — ver
    o descarte silencioso descrito em `PedidoVerificacaoNumero.phone`.
  required: [query, is_in_whatsapp, jid, verified_name]
  properties:
    query:
      type: string
      nullable: false
      description: |
        O que foi pedido, ecoado tal e qual — é a ÚNICA forma fiável de casar a
        resposta com a entrada, porque a lista devolvida não é posicional.
        Sempre presente; nunca `null`.
      example: '554192421234'
    is_in_whatsapp:
      type: boolean
      nullable: false
      description: |
        Se o número tem conta de WhatsApp. Sempre presente; nunca `null`.
        `false` é resposta, não erro.
      example: true
    jid:
      type: string
      nullable: false
      description: |
        JID resolvido do número, em forma canónica. Sempre presente; vem `""`
        (cadeia vazia, nunca `null`) quando `is_in_whatsapp` é `false`.
      example: 554192421234@s.whatsapp.net
    verified_name:
      type: string
      nullable: false
      description: |
        Nome verificado, quando a conta é uma conta comercial verificada.
        Sempre presente; vem `""` para contas pessoais — medido nas duas contas
        de teste. Nunca `null`.
      example: ''

# ------------------------------------------------------------- info de contas

PedidoInfoUtilizadores:
  type: object
  description: |
    JIDs a consultar. A struct é a MESMA da rota de verificação
    (`domain.CheckUserRequest`, campo `phone`), mas o manipulador acrescenta
    `@s.whatsapp.net` a todo valor sem `@` antes de chamar o caso de uso
    (`handler_user.go:normalizePhones`, F242/F225).

    **A diferença face a `POST /user/check` é real e confunde**: em
    `/user/check` o valor viaja como NÚMERO NU e é o WhatsApp que resolve; aqui
    o valor é convertido num JID COMPLETO antes de qualquer consulta. Por isso
    uma cadeia que `/user/check` descarta em silêncio, aqui vira
    `lixo@s.whatsapp.net` e faz a chamada inteira falhar — ver `phone`.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [phone]
  properties:
    phone:
      type: array
      nullable: true
      description: |
        JIDs (ou números nus, que o manipulador qualifica) a consultar.

        | estado | aceite? | efeito medido |
        |---|---|---|
        | ausente (`{}`) | **sim** | `200 {"data":{"users":{}}}` |
        | `null` | **sim** | `200 {"data":{"users":{}}}` — indistinguível de ausente |
        | `[]` | **sim** | `200 {"data":{"users":{}}}` |
        | `[""]` | **sim** | `200 {"data":{"users":{}}}` |
        | `["554192421234"]` | sim | qualificado para `…@s.whatsapp.net` |
        | `["554192421234@s.whatsapp.net"]` | sim | usado tal e qual |
        | `["90937376170214@lid"]` | sim | usado tal e qual; ver a ressalva de `LID` |
        | `["nao-e-numero"]` | **sim, e é o caso perigoso** | ver abaixo |
        | `"554192421234"` (não-array) | não | `400 could_not_decode_payload` |

        **Repare na assimetria de vazio face a `/user/check`**: a mesma
        condição — "não pediste nada" — devolve `data: null` numa rota e
        `data: {"users":{}}` na outra. Um cliente que trate as duas com o mesmo
        código tem de cobrir as duas formas.

        **O caso perigoso, MEDIDO em 2026-08-26, contradiz o que a
        documentação anterior desta rota dizia.** Um valor que não é número
        NÃO é "saltado em silêncio": depois de `normalizePhones` ele contém
        `@`, logo passa o parser, e a consulta ao WhatsApp não resolve. O que
        se observou:

        - `{"phone":["nao-e-numero"]}` → `500 internal server error` na
          primeira chamada e, nas repetições seguintes, **nenhuma resposta em
          45 s** (o cliente desiste, não o servidor).
        - `{"phone":["   "]}` → **nenhuma resposta em 25 s**.
        - `{"phone":["554192421234","nao-e-numero"]}` → **nenhuma resposta em
          25 s**: uma entrada má leva consigo as boas do mesmo lote.

        Sanitize os valores ANTES de chamar, e prefira lotes pequenos: não há
        forma de saber, pela resposta, qual entrada envenenou o pedido.
      items:
        type: string
        nullable: false
        description: |
          Um JID completo, ou um número nu que o manipulador qualifica com
          `@s.whatsapp.net`. `null` num item vira `""` (o item é `string`, não
          `*string`) e é ignorado; qualquer outra cadeia sem `@` que não seja um
          número faz o pedido inteiro falhar ou pendurar — ver a descrição do
          array.
        example: 554192421234@s.whatsapp.net
      example: ['554192421234@s.whatsapp.net']

InfoUtilizadores:
  type: object
  description: |
    Bloco `users` de `POST /user/info`.

    > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
    > CÓDIGO, não medida contra o servidor vivo: a rota passou a servir um DTO
    > (`pkg/presentation/http/dto/user`) e o corpo mudou de nomes — e nalguns
    > casos de FORMA — em relação ao que foi medido a 2026-08-26. As contagens
    > de população que aparecem abaixo continuam válidas (descrevem o DADO,
    > não as chaves); os nomes das chaves e a estrutura vêm do DTO.

    **Era um OBJECTO indexado pelo JID consultado; passou a ser um ARRAY.** A
    chave daquele objecto era um JID — que é DADO, não nome de campo — e a
    regra de nomes do contrato (`docs/HTTP-DTO-CONVENTIONS.md` §8) vale para
    toda chave de objecto JSON. Não havia renomear; o dado teve de sair da
    chave e passar a valor, no campo `jid` de cada entrada.

    A ordem do array é a ORDEM DO PEDIDO, não a de um mapa: o adaptador
    percorre os JIDs pedidos, e não o mapa que o servidor devolveu
    (`pkg/infra/wa-noise/adapters/user/adapter.go`). JIDs para os quais o
    servidor não respondeu ficam simplesmente FORA do array.
  required: [users]
  properties:
    users:
      type: array
      nullable: false
      description: |
        Uma entrada por JID que o servidor conseguiu responder. **Sempre
        presente**, e `[]` (array vazio, nunca `null`) quando nada foi pedido
        ou nada foi resolvido — o apresentador aloca antes do laço.
      items:
        $ref: '#/components/schemas/InfoUtilizador'
      example:
        - jid: 554192421234@s.whatsapp.net
          lid: 90937376170214@lid
          status: ''
          picture_id: ''
          verified_name: ''
          devices: [554192421234@s.whatsapp.net]
          push_name: ''
          business_name: ''

InfoUtilizador:
  type: object
  description: |
    O que se sabe sobre uma conta, do ponto de vista da sessão que pergunta.

    Era o tipo `types.UserInfo` do módulo de protocolo serializado SEM
    tratamento — daí os nomes em `PascalCase` e o bloco `VerifiedName` com o
    certificado protobuf cru lá dentro. Hoje é `domain.UserInfo`, normalizado
    no adaptador de cada motor, apresentado por
    `pkg/presentation/http/dto/user`.

    **Nenhum campo tem `omitempty`**: os oito aparecem sempre que a entrada
    existir. O que varia é o conteúdo, não a presença.

    **Os dois motores preenchem metades complementares**, e isso é propriedade
    do motor, não falta de dado. O `wa-noise` pergunta ao servidor e responde
    `status`, `picture_id`, `devices` e `verified_name`; o `wa-headless` lê a
    colecção de contactos da página e responde `push_name` e `business_name`.
    O que o motor não sabe vem no valor zero.
  required: [jid, lid, status, picture_id, verified_name, devices, push_name, business_name]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        O identificador consultado, ecoado tal como foi enviado — é o que
        permite casar a resposta com a pergunta sem depender da posição.
      example: 554192421234@s.whatsapp.net
    lid:
      type: string
      nullable: false
      description: |
        Identificador de privacidade da conta, quando o servidor o reporta.
        Sempre presente; vem `""` (nunca `null`) quando não há mapeamento.

        Substitui o campo `LID` do tipo de protocolo, com a mesma ressalva:
        ele resolve o LID DE um número, e não ecoa o que se perguntou.
      example: 90937376170214@lid
    status:
      type: string
      nullable: false
      description: |
        O "recado" do perfil. Sempre presente; vem `""` (nunca `null`) quando a
        privacidade o esconde, quando não há nenhum, quando o servidor não o
        devolveu, ou quando o motor é o `wa-headless` — os quatro casos são
        indistinguíveis.
      example: ''
    picture_id:
      type: string
      nullable: false
      description: |
        Identificador da foto de perfil actual, para detectar troca sem baixar
        a imagem. Sempre presente; vem `""` (nunca `null`) quando não há foto
        ou a privacidade a esconde.
      example: ''
    verified_name:
      type: string
      nullable: false
      description: |
        Nome verificado da conta comercial, JÁ EXTRAÍDO do certificado.

        **Isto é uma mudança de forma, não só de nome.** O campo antigo
        (`VerifiedName`) era um OBJECTO com o certificado protobuf cru —
        `Certificate` e `Details` — cuja estrutura interna nunca foi observada
        em campo porque vinha `null` nas duas contas de teste. O adaptador
        passou a chamar `Details.GetVerifiedName()` e a servir só a cadeia,
        que é o único pedaço daquele bloco que alguém conseguia usar.

        Sempre presente; `""` (nunca `null`) para contas pessoais.
      example: ''
    devices:
      type: array
      nullable: false
      description: |
        Aparelhos ligados àquela conta, cada um com o seu sufixo de
        dispositivo. O primeiro, sem sufixo, é o aparelho principal.

        **Sempre presente e sempre um array** — `[]` e nunca `null`, ao
        contrário do campo antigo: o apresentador aloca antes do laço, e a
        ressalva "trate as duas formas" que estava aqui deixou de se aplicar.
      items:
        type: string
        nullable: false
        description: JID de um aparelho, com sufixo `:N` a partir do segundo.
        example: 554192421234:41@s.whatsapp.net
      example:
        - 554192421234@s.whatsapp.net
        - 554192421234:41@s.whatsapp.net
    push_name:
      type: string
      nullable: false
      description: |
        Nome que a própria pessoa publica, quando o motor o conhece. Sempre
        presente; `""` (nunca `null`). Só o motor `wa-headless` o preenche
        nesta rota — o `wa-noise` pergunta ao servidor, que não o devolve aqui.
      example: ''
    business_name:
      type: string
      nullable: false
      description: |
        Nome comercial do roster local. Sempre presente; `""` (nunca `null`).
        Como `push_name`, só o motor `wa-headless` o preenche nesta rota.
      example: ''

Roster:
  type: object
  description: |
    A agenda da sessão, em `GET /user/contacts`.

    > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
    > CÓDIGO, não medida contra o servidor vivo: a rota passou a servir um DTO
    > (`pkg/presentation/http/dto/user`) e o corpo mudou de nomes — e nalguns
    > casos de FORMA — em relação ao que foi medido a 2026-08-26. As contagens
    > de população que aparecem abaixo continuam válidas (descrevem o DADO,
    > não as chaves); os nomes das chaves e a estrutura vêm do DTO.

    **Era um OBJECTO indexado por JID; passou a ser `{contacts, count}`.** A
    chave daquele objecto era um JID — dado, não nome de campo —, e por isso
    não podia satisfazer a regra de nomes do contrato. O JID passou a viver no
    campo `jid` de cada entrada, e o `count` que o log já calculava passou a
    ser servido em vez de o cliente ter de contar o mapa.

    **A ORDEM é determinística.** O motor `wa-noise` lê de um mapa e ORDENA por
    JID antes de devolver; o `wa-headless` preserva a ordem que a colecção da
    página já tem. Sem isso, a mesma agenda saía numa ordem diferente a cada
    chamada e nenhum cliente conseguia diffar duas respostas.

    **Os JIDs misturam espaços de identidade, e a proporção varia por conta.**
    Medido a 2026-08-26, e continua a descrever o dado:

    | conta | total | `@lid` | `@s.whatsapp.net` | `@bot` |
    |---|---:|---:|---:|---:|
    | Business (`filarapida`) | 461 | 232 | 229 | 0 |
    | pessoal (`lucas`) | 3456 | 2524 | 931 | 1 |

    Ou seja: **não se pode assumir nem um espaço nem o outro**. O DTO ajuda
    aqui — cada entrada traz `phone_number` e `lid` além de `jid`, e o campo
    vazio diz que aquele motor não conhece aquela identidade.

    O `@bot` é um terceiro espaço, com uma entrada medida
    (`867051314767696@bot`, nome "Meta AI"). Não é contacto humano.

    **Não há paginação.** A resposta medida foi de 61 459 bytes para 461
    contactos e 498 688 bytes para 3456 — cresce com a agenda, sem tecto.
  required: [contacts, count]
  properties:
    contacts:
      type: array
      nullable: false
      description: |
        As entradas da agenda. Sempre presente; `[]` (nunca `null`) quando a
        agenda está vazia.
      items:
        $ref: '#/components/schemas/ContactoDoRoster'
    count:
      type: integer
      nullable: false
      description: |
        Quantas entradas vêm em `contacts`. É a mesma contagem que o servidor
        já registava no log e que o cliente tinha de derivar contando o mapa.

        **Para o motor `wa-headless` é a contagem de PESSOAS, não de linhas**:
        a colecção da página traz uma linha por identidade, e a mesma pessoa
        aparece duas vezes — 944 linhas dobradas em 390 pessoas no perfil
        medido. Devolver o número de linhas reportaria o dobro dos contactos
        que alguém tem.
      example: 461
  example:
    count: 1
    contacts:
      - jid: 90937376170214@lid
        phone_number: ''
        lid: 90937376170214@lid
        found: true
        first_name: ''
        full_name: ''
        push_name: Janio Gonzalez
        business_name: ''
        is_business: false

ContactoDoRoster:
  type: object
  description: |
    Uma entrada da agenda. Era o tipo `types.ContactInfo` do módulo de
    protocolo serializado sem tratamento; hoje é `domain.Contact`, normalizado
    no adaptador de cada motor.

    **Todos os campos aparecem SEMPRE**: nenhum tem `omitempty`. Nenhum vem
    `null` — os de texto vêm `""` quando não há valor, e os booleanos `false`.

    Os nomes vêm de FONTES DIFERENTES, e é aí que está a armadilha:
    `full_name` e `first_name` vêm da sincronização da agenda de quem consulta,
    `push_name` do nome que a própria pessoa publica, e `business_name` do
    registo comercial. Medido a 2026-08-26 (as contagens descrevem o DADO e
    continuam válidas; só os nomes das chaves mudaram):

    | campo | Business (461) | pessoal (3456) |
    |---|---:|---:|
    | `found` verdadeiro | 461 | 3456 |
    | `push_name` preenchido | 460 | 1152 |
    | `full_name` preenchido | **1** | 164 |
    | `first_name` preenchido | 1 | 89 |
    | `business_name` preenchido | 2 | 43 |
    | **sem nome nenhum dos quatro** | 1 | **2175** |

    Um cliente que leia apenas `full_name` vê uma agenda praticamente sem
    nomes. A ordem de preferência que o próprio projecto usa está em
    `domain.ContactName.Melhor`: `full_name`, `push_name`, `business_name`,
    `first_name`, e cadeia vazia quando nenhum existe.

    A escassez de `full_name` tem consequência directa para a publicação de
    status — ver `POST /status/set/image` e a F256.

    **O campo `RedactedPhone` SAIU.** Era o número parcialmente ocultado
    (`+55∙∙∙∙∙∙∙∙45`), preenchido só para membros em espaço LID encontrados em
    grupos — 0 de 461 na conta Business, 2199 de 3456 na conta com muitos
    grupos. Não serve para enviar mensagem, e o `phone_number` que o substitui
    responde à mesma necessidade sem ocultar dígitos quando o mapeamento é
    conhecido. Quem dependia dele fica sem ele: é o corte a seco.
  required: [jid, phone_number, lid, found, first_name, full_name, push_name, business_name, is_business]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        A identidade por onde endereçar este contacto. É o `lid` quando o motor
        conhece um — o caminho de envio mediu que é essa a que funciona neste
        build —, e a identidade de telefone caso contrário.
      example: 90937376170214@lid
    phone_number:
      type: string
      nullable: false
      description: |
        A identidade de TELEFONE do contacto. Sempre presente; `""` quando o
        motor só conhece um `@lid`.

        Existe ao lado de `lid` porque uma pessoa é UMA entrada com DUAS
        identidades, e qual delas quem chama já tem depende de onde a leu: o
        histórico de mensagens fala telefone, a colecção de mensagens fala lid.
      example: ''
    lid:
      type: string
      nullable: false
      description: |
        A identidade de privacidade do contacto. Sempre presente; `""` quando o
        motor só conhece um telefone.
      example: 90937376170214@lid
    found:
      type: boolean
      nullable: false
      description: |
        Se o motor tem mesmo um registo deste contacto, em vez de ter
        sintetizado a entrada a partir de uma identidade nua. Sempre presente;
        nunca `null`. Medido `true` em 461 de 461 e em 3456 de 3456 no motor
        `wa-noise` — só é devolvido o que foi encontrado.
      example: true
    first_name:
      type: string
      nullable: false
      description: |
        Primeiro nome, quando veio da sincronização da agenda. Sempre presente;
        `""` (nunca `null`) quando não veio — o caso da esmagadora maioria.
        Vazio SEMPRE no motor `wa-headless`, que não lê a agenda.
      example: ''
    full_name:
      type: string
      nullable: false
      description: |
        Nome completo, quando veio da sincronização da agenda. Sempre presente;
        `""` (nunca `null`) quando não veio.

        **É o campo que a lista de destinatários de status usa**, e o que faz a
        F256 doer: numa conta WhatsApp Business apenas 1 dos 461 contactos o
        tinha preenchido.
      example: ''
    push_name:
      type: string
      nullable: false
      description: |
        Nome que a própria pessoa publica. É o que costuma estar preenchido
        (460 de 461 na conta Business). Sempre presente; `""` quando a pessoa
        não publica nome. Nunca `null`.
      example: Janio Gonzalez
    business_name:
      type: string
      nullable: false
      description: |
        Nome comercial, quando a conta é comercial. Sempre presente; `""`
        (nunca `null`) para contas pessoais — que é o caso quase sempre.
      example: ''
    is_business:
      type: boolean
      nullable: false
      description: |
        Se a página classifica a conta como comercial. **Só o motor
        `wa-headless` o responde**; no `wa-noise` vem sempre `false`, porque o
        armazenamento de contactos não carrega a bandeira. Sempre presente.
      example: false

UltimaAtividadePorConversa:
  type: object
  description: |
    Instante da mensagem mais recente de cada conversa, em
    `GET /user/contacts/last-activity`. Derivado do histórico LOCAL (o
    `HistorySync` que chega depois do pareamento, mais as mensagens correntes),
    **não** de uma consulta ao WhatsApp.

    > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
    > CÓDIGO. **Era um OBJECTO indexado por JID; passou a ser `{chats: […]}`.**
    > Aquelas chaves eram JIDs, e um JID nunca casa com a regra de nomes do
    > contrato (`^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$`) — `@` e `.` não estão no
    > alfabeto. Não havia renomear: o dado teve de sair da chave.

    **A ordem é por JID**, imposta pelo apresentador. O mapa de origem tem
    ordem de iteração aleatória por desenho do Go, e sem ordenar duas respostas
    para o mesmo estado não se conseguiam diffar.

    Os JIDs são normalizados para o espaço LID quando o mapeamento é conhecido,
    para casarem com os de `GET /user/contacts`. Um número sem LID conhecido
    mantém o `@s.whatsapp.net`, e grupos aparecem em `@g.us`. Quando a sessão
    está em espera, a normalização é saltada e o dado sai cru — degrada, não
    falha.

    **A lista não traz só contactos.** Medido, 384 entradas numa conta: 379
    `@lid`, 3 `@g.us`, 1 `@s.whatsapp.net` e 1 `status@broadcast` — mais
    `0@s.whatsapp.net`, que é a conta oficial do WhatsApp. A filtragem é de
    quem chama; a consulta inclui grupos e difusões de propósito.

    **Descarte silencioso, do lado da resposta**: uma linha cujo carimbo de
    tempo não parseia é SALTADA, com aviso no log e sem sinal nenhum na
    resposta. Uma conversa pode faltar aqui sem que isso signifique ausência
    de mensagens.
  required: [chats]
  properties:
    chats:
      type: array
      nullable: false
      description: |
        Uma entrada por conversa, ordenada por `jid`. Sempre presente; `[]`
        (nunca `null`) quando não há histórico.
      items:
        type: object
        required: [jid, last_activity]
        properties:
          jid:
            type: string
            nullable: false
            description: Identidade da conversa, como ela vive no histórico local.
            example: 100429404864623@lid
          last_activity:
            type: string
            format: date-time
            nullable: true
            description: |
              Instante da mensagem mais recente daquela conversa, em RFC 3339
              **UTC**.

              **Duas mudanças em relação ao que foi medido a 2026-08-26.** O
              valor vinha no fuso LOCAL do servidor com resolução de
              microssegundos (`2026-08-24T18:56:53.836029-04:00`); o
              apresentador passou a normalizar para UTC com resolução de
              segundos (`2026-08-24T22:56:53Z`), que é a mesma regra do resto
              do contrato.

              E é **`null`, e não `"0001-01-01T00:00:00Z"`, para tempo
              desconhecido**: essa cadeia é uma data real no fio, e um cliente
              que a parseasse recebia uma conversa activa antes do calendário
              gregoriano em vez de um campo sem valor. A chave existe sempre.
            example: '2026-08-24T22:56:53Z'
      example:
        - jid: 100429404864623@lid
          last_activity: '2026-08-24T22:56:53Z'
        - jid: status@broadcast
          last_activity: '2026-08-24T22:56:53Z'

PedidoAvatar:
  type: object
  description: |
    De quem se quer a foto. **Esta rota LÊ** — não altera a foto da conta,
    apesar de ser `POST`. O `POST` existe só porque o alvo vai no corpo.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [phone]
  properties:
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino (F225), aceite em toda rota com destinatário.
        É copiado para `phone` **apenas quando `phone` está vazio**
        (`domain.ResolveChatField`, chamado pelo DTO de pedido em
        `pkg/presentation/http/dto/user/request.go`), logo `phone` ganha
        quando os dois vierem.

        Ausente, `null` e `""` são indistinguíveis: os três deixam `phone` sem
        substituto, e o pedido morre em `400 missing_phone`.
      example: 554192421234@s.whatsapp.net
    phone:
      type: string
      nullable: false
      minLength: 1
      description: |
        Contacto de quem se quer a foto. Aceita número nu, JID de telefone ou
        LID — a resolução é leniente (`ResolveJID`) e aplica o servidor por
        omissão quando falta o `@`.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_phone` |
        | `null` | não | `400 missing_phone` — indistinguível de ausente |
        | `""` | não | `400 missing_phone` — indistinguível de ausente |
        | `"   "` | **não, mas com outro código** | `400 invalid_phone`: a guarda é `phone == ""`, e três espaços não são a cadeia vazia — **não há `trim` aqui** |
        | `"lixo"` | não | `400 invalid_phone` |
        | `123` (número) | não | `400 could_not_decode_payload` |
        | preenchido | sim | — |

        A diferença entre `missing_phone` e `invalid_phone` para `""` e `"   "`
        é observável e não é decorativa: diz se o campo chegou vazio ou se
        chegou com lixo.
      example: 554192421234@s.whatsapp.net
    preview:
      type: boolean
      nullable: false
      default: false
      description: |
        `true` devolve a miniatura; `false` devolve a imagem em tamanho cheio.

        **Ausente, `null` e `false` são o mesmo pedido** — o campo é `bool` sem
        `*`, e isso é DELIBERADO: "não pedi" e "pedi false" significam a mesma
        coisa aqui, que é "dá-me a imagem inteira". As rotas em que a diferença
        importa usam ponteiro.
        Aqui isso é inofensivo, porque `false` é o padrão inerte e não uma
        acção; noutras rotas desta API o mesmo mecanismo é perigoso (ver a
        secção 4.2 do contrato arquitectural).

        Tipo errado (`"true"` em vez de `true`) dá `400
        could_not_decode_payload`.
      example: true

Avatar:
  type: object
  description: |
    Ponteiro para a foto de perfil. A imagem NÃO vem no corpo — vem o URL, e é
    dele que se baixa. O URL é temporário e assinado pelo WhatsApp.

    **As duas chaves aparecem sempre.** Quando não há foto, não há corpo
    nenhum — a resposta é `404`, não um `Avatar` com campos vazios.

    O tipo do módulo de protocolo tem mais campos (`Type`, `DirectPath`,
    `Hash`), e esta rota **não** os expõe.
  required: [id, url]
  properties:
    id:
      type: string
      nullable: false
      description: |
        Identificador da foto. Muda quando a pessoa troca a imagem, e é o mesmo
        valor que `InfoUtilizador.picture_id` — serve para detectar troca sem
        baixar. Sempre presente; nunca `null`.
      example: '1735689600'
    url:
      type: string
      format: uri
      nullable: false
      description: |
        URL da imagem, para ser baixado por quem chamou. Sempre presente; nunca
        `null`. É temporário: não o guarde como se fosse permanente.
      example: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg

# -------------------------------------------------------------------- perfil

PerfilUtilizador:
  type: object
  description: |
    Tudo o que se sabe sobre um contacto, reunido num pedido só, a partir de
    QUALQUER uma das suas identidades. Cada peça é obtida separadamente e
    **degrada em vez de falhar**: o que não se conseguiu obter aparece em
    `unavailable`, com o motivo, em vez de sair como campo vazio mudo.

    > **Nota da migração de DTO (2026-08-27).** `user_info` e `unavailable`
    > mudaram de forma; os outros sete campos ficaram iguais. As medições de
    > 2026-08-26 citadas abaixo continuam a descrever o comportamento.

    **TODOS os campos aparecem sempre.** `user_info` e `unavailable` tinham
    `omitempty` e podiam desaparecer; deixaram de ter. Emitir sempre é mais
    barato do que documentar a ausência, e um cliente já não precisa de
    distinguir "esta chave não vem nesta versão" de "não há nada a reportar".
  required: [jid, lid, query, on_whatsapp, verified_name, avatar_url, avatar_id, user_info, unavailable]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        Identidade de telefone. Sempre presente; `""` (nunca `null`) quando só
        se conhece o LID e não há mapeamento — nesse caso o motivo está em
        `unavailable.jid`.
      example: 554192421234@s.whatsapp.net
    lid:
      type: string
      nullable: false
      description: |
        Identidade de privacidade. Sempre presente; `""` (nunca `null`) quando
        não há mapeamento conhecido — nesse caso `unavailable.lid` traz
        `sem mapeamento conhecido para este telefone`. Medido.
      example: 90937376170214@lid
    query:
      type: string
      nullable: false
      description: |
        O que foi pedido no caminho, ecoado tal e qual — diz por qual
        identidade se entrou. Sempre presente; nunca `null`. Medido a devolver
        `554192421234`, `554192421234@s.whatsapp.net` e `90937376170214@lid`
        conforme o que se pediu, sem normalizar.
      example: 554192421234@s.whatsapp.net
    on_whatsapp:
      type: boolean
      nullable: true
      description: |
        Se o número tem conta. **Sempre presente** — é `*bool` sem `omitempty`
        (`get_user_profile.go:53`), logo não desaparece; o que muda é o valor.

        | valor | significa |
        |---|---|
        | `true` | o número tem conta |
        | `false` | o número **não** tem conta — é resposta, e a rota devolve `200` na mesma |
        | `null` | a pergunta **não pôde ser feita**; o motivo está em `unavailable.on_whatsapp` |

        **`null` e `false` significam coisas diferentes**, e esta é uma das
        poucas rotas da API onde a distinção existe de facto: o campo é
        ponteiro precisamente para a criar. Um cliente que trate `null` como
        `false` diz "este número não existe" quando a verdade é "não consegui
        perguntar".
      example: true
    verified_name:
      type: string
      nullable: false
      description: |
        Nome verificado, quando a conta é comercial verificada. Sempre
        presente; `""` (nunca `null`) quando não há ou quando a consulta de
        presença na rede falhou.

        **Vem de fonte diferente de `user_info[].verified_name`**, e as duas
        podem discordar: este é copiado do resultado de `IsOnWhatsApp`,
        enquanto o outro vem da consulta de informação de conta. Medido um caso
        com este preenchido e o outro vazio no mesmo corpo.
      example: ''
    avatar_url:
      type: string
      nullable: false
      description: |
        URL da foto de perfil em tamanho cheio (`preview=false`, fixo). Sempre
        presente; `""` (nunca `null`) quando indisponível — e nesse caso
        `unavailable.avatar` diz porquê. Medidos dois motivos distintos:
        `avatar hidden by privacy settings` e `no avatar found`.
      example: ''
    avatar_id:
      type: string
      nullable: false
      description: |
        Identificador da foto. Sempre presente; `""` (nunca `null`) quando
        indisponível, pelo mesmo motivo que `avatar_url`.
      example: ''
    user_info:
      type: array
      nullable: false
      description: |
        Os metadados da conta, com a mesma forma de `POST /user/info`.

        **Era um objecto indexado pelo JID consultado; é um ARRAY**, pela mesma
        razão que ali: a chave era dado, e chave que é dado não pode satisfazer
        a regra de nomes do contrato.

        **Sempre presente.** `[]` quando a consulta de informação de conta
        falhou — e nesse caso o motivo está em `unavailable.user_info`. Nunca
        `null`.
      items:
        $ref: '#/components/schemas/InfoUtilizador'
    unavailable:
      type: object
      nullable: false
      description: |
        O que NÃO pôde ser obtido, com o motivo, por chave.

        **Sempre presente, e `{}` quando tudo correu bem.** O caso de uso põe o
        mapa a `nil` quando está vazio, mas o apresentador aloca-o: um cliente
        que percorra os motivos não deve ter de verificar `null` num mapa cuja
        ausência de entradas já diz "nada falhou".

        As cinco chaves possíveis são `jid`, `lid`, `on_whatsapp`, `user_info`
        e `avatar`. Os valores são texto livre destinado a leitura humana —
        **não são códigos estáveis** e não devem ser comparados por igualdade.
        Medidos: `avatar hidden by privacy settings`, `no avatar found`,
        `sem mapeamento conhecido para este telefone`,
        `sem mapeamento conhecido para este LID`,
        `consulta exige telefone; so' ha LID`,
        `servidor nao respondeu sobre este numero`.
      additionalProperties:
        type: string
        nullable: false
        description: Motivo, em texto livre, de a peça não ter sido obtida.
      example:
        avatar: avatar hidden by privacy settings
      default: {}

ResolucaoLID:
  type: object
  description: |
    O par de identidades de um número, quando o mapeamento é conhecido. As duas
    chaves aparecem sempre; quando não há mapeamento a rota devolve
    `404 lid_not_found` em vez de um par com campo vazio.
  required: [jid, lid]
  properties:
    jid:
      type: string
      nullable: false
      description: |
        O número consultado, em forma canónica. Sempre presente; nunca `null`.

        **Esta rota exige o JID completo no caminho**, ao contrário de
        `GET /user/profile/{jid}`: medido, `GET /user/lid/554192421234` (número
        nu) devolve `400 invalid_jid`, e só
        `GET /user/lid/554192421234@s.whatsapp.net` funciona.
      example: 554192421234@s.whatsapp.net
    lid:
      type: string
      nullable: false
      description: |
        O identificador de privacidade correspondente. Sempre presente e
        preenchido; nunca `null` e nunca `""` — a ausência de mapeamento é
        `404`, não um campo vazio.
      example: 90937376170214@lid

# ---------------------------------------------------------------- bloqueio

ListaBloqueados:
  type: object
  description: |
    A lista de bloqueados da sessão, em `GET /user/blocklist`.

    > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
    > CÓDIGO. **Esta rota deixou de ser a excepção do envelope.** Escrevia o
    > JSON directamente para preservar o formato antigo, e por isso não trazia
    > `code`, `data` nem `success` — era a ÚNICA das 141 rotas assim, e um
    > cliente não a conseguia ler como lê as outras. Hoje passa por
    > `RespondJSON` como todas: o corpo abaixo é o conteúdo de `data`.
    > As duas chaves mudaram de nome junto (`Blocklist` → `blocklist`,
    > `DHash` → `dhash`).

    As duas chaves aparecem sempre.
  required: [blocklist, dhash]
  properties:
    blocklist:
      type: array
      nullable: false
      description: |
        JIDs bloqueados, em forma canónica. **Sempre presente e nunca `null`**:
        o apresentador aloca a fatia antes de a preencher, pelo que uma conta
        sem bloqueios devolve `[]` — medido. A ordem é a que o WhatsApp
        devolveu; não há garantia de ser estável entre chamadas.
      items:
        type: string
        nullable: false
        description: JID de um contacto bloqueado, já normalizado pelo adaptador.
        example: 554192421234@s.whatsapp.net
      example: []
    dhash:
      type: string
      nullable: false
      description: |
        Hash com que o WhatsApp versiona a lista. Serve para detectar que a
        lista mudou sem a comparar entrada a entrada.

        Sempre presente; nunca `null`. Vem `""` quando o WhatsApp devolveu uma
        lista nula, e também no motor `wa-headless`, que não versiona a lista —
        não confunda `""` com "a lista não mudou".
      example: '1787412261963655'

PedidoBloqueio:
  type: object
  description: |
    Quem bloquear ou desbloquear. Basta UM dos dois campos: `jid` tem
    precedência, e `phone` é usado quando `jid` vem vazio.

    > **Nota da migração de DTO (2026-08-27).** Os campos chamavam-se `Phone` e
    > `JID`. A chave canónica é a minúscula, e é a única documentada. A
    > maiúscula continua a funcionar por uma propriedade do `encoding/json` do
    > Go — que casa nomes de campo sem distinguir a caixa —, não por decisão
    > nossa; está medido em
    > `pkg/presentation/http/dto/user/request_test.go`. Não conte com ela.

    **Ao contrário do resto da API, aqui HÁ `trim`**: os dois campos passam por
    `strings.TrimSpace` no caso de uso antes da verificação de vazio, logo
    `"   "` conta como ausente para a RESOLUÇÃO. Repare que a validação de
    fronteira, essa, não faz `trim` — `{"phone":"   "}` passa por ela e é o
    caso de uso que o recusa, com o mesmo código.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  properties:
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino (F225). É copiado para `phone` **apenas
        quando `phone` está vazio** (`domain.ResolveChatField`, chamado pelo
        DTO de pedido), e nunca ganha de `jid`. Ausente, `null` e `""` são
        indistinguíveis — medido: `{"chat":""}` dá `400 missing_phone_or_jid`.
      example: 554192421234@s.whatsapp.net
    phone:
      type: string
      nullable: false
      description: |
        Contacto. A resolução é LENIENTE por decisão registada na F203: um
        número nu (`554192421234`) é aceite, porque um campo chamado `phone`
        que exigisse `@s.whatsapp.net` seria contrato surpreendente.

        Usado só quando `jid` vem vazio.
      example: 554192421234@s.whatsapp.net
    jid:
      type: string
      nullable: false
      description: |
        Contacto em forma de JID. **Tem precedência sobre `phone`**: quando os
        dois vierem preenchidos, `phone` é ignorado sem aviso.

        Tabela dos estados, medida com pedidos que a validação recusa (nenhum
        chegou a bloquear ninguém):

        | corpo | efeito |
        |---|---|
        | `{}` | `400 missing_phone_or_jid` |
        | `{"phone":null,"jid":null}` | `400 missing_phone_or_jid` — indistinguível de ausente |
        | `{"phone":"","jid":""}` | `400 missing_phone_or_jid` — idem |
        | `{"phone":"   "}` | `400 missing_phone_or_jid` — **há `trim` no caso de uso** |
        | `{"jid":"   "}` | `400 missing_phone_or_jid` — idem |
        | `{"phone":"lixo"}` | `400 invalid_phone_or_jid` |
        | `{"phone":123}` | `400 could_not_decode_payload` |

        Repare que a recusa é a MESMA para os dois campos: o código de erro não
        diz qual dos dois estava mal.
      example: 90937376170214@lid

ResultadoBloqueio:
  type: object
  description: |
    Resultado de bloquear ou desbloquear. **Nunca foi observado em campo**: as
    duas rotas que o produzem falham hoje com `422 upstream_rejected` (ver
    F264), logo a forma abaixo vem do código, não de medição — incluindo as
    afirmações de presença de cada campo.

    > **Nota da migração de DTO (2026-08-27).** As cinco chaves mudaram de
    > nome, e `requested_jid` mudou de SEMÂNTICA — ver o campo.
  required: [details, jid, requested_jid, blocklist, dhash]
  properties:
    details:
      type: string
      nullable: false
      description: |
        Confirmação textual, constante por rota — `User blocked` em
        `POST /user/block`, `User unblocked` em `POST /user/unblock`. Sempre
        presente.

        O enum é o conjunto que o código escreve hoje, literal e sem variação
        (`block_user.go`, `unblock_user.go`). **Como é campo de RESPOSTA, a
        pergunta "e um valor desconhecido?" não se aplica à entrada**: um valor
        fora desta lista não é recusado por validador nenhum — apenas
        significaria que o texto mudou no nosso código. É texto para leitura
        humana: não o compare por igualdade.
      enum: [User blocked, User unblocked]
      example: User blocked
    jid:
      type: string
      nullable: false
      description: |
        O JID que a lista de bloqueio de facto usou, depois da normalização
        (descarte de agente/dispositivo e troca do servidor legado pelo
        padrão). Sempre presente.
      example: 554192421234@s.whatsapp.net
    requested_jid:
      type: string
      nullable: false
      description: |
        O JID pedido, já normalizado.

        **Mudou de semântica na migração.** O campo antigo (`RequestedJID`)
        tinha `omitempty` e só era preenchido quando DIFERIA do usado — a sua
        ausência significava "pedido e usado são o mesmo". Hoje está sempre
        presente e, quando não houve tradução, ecoa o mesmo valor de `jid`.

        A troca é deliberada: o campo passa a responder sempre à mesma
        pergunta — *que identidade pedi?* — em vez de significar duas coisas
        conforme estivesse vazio. Quem quer saber se houve tradução compara os
        dois valores, que é a comparação que a pergunta pede.
      example: 90937376170214@lid
    blocklist:
      type: array
      nullable: false
      description: |
        A lista de bloqueados resultante da operação. Sempre presente e nunca
        `null`, pelo mesmo motivo de `ListaBloqueados.blocklist`: o
        apresentador aloca antes de preencher. Vem `[]` quando a lista fica
        vazia.
      items:
        type: string
        nullable: false
        description: JID de um contacto bloqueado.
        example: 554192421234@s.whatsapp.net
      example: [554192421234@s.whatsapp.net]
    dhash:
      type: string
      nullable: false
      description: |
        Hash da lista resultante. Sempre presente; `""` quando o WhatsApp
        devolveu lista nula. Nunca `null`.
      example: '1787412261963655'

PedidoPresenca:
  type: object
  description: |
    Estado de presença global da sessão — é a conta inteira, não uma conversa.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [type]
  properties:
    type:
      type: string
      nullable: false
      enum: [available, unavailable]
      description: |
        `available` marca a conta como online; `unavailable`, offline.

        **Valor fora da lista é RECUSADO** antes de qualquer chamada ao
        WhatsApp (`send_presence.go`). Não é ignorado nem tratado como padrão.
        A comparação é sensível a maiúsculas: `Available` é recusado.

        | estado | aceite? | efeito medido |
        |---|---|---|
        | ausente (`{}`) | não | `400 missing_presence_type` |
        | `null` | não | `400 missing_presence_type` — indistinguível de ausente |
        | `""` | não | `400 missing_presence_type` — idem |
        | `"XPTO"` | não | `400 invalid_presence_type`, com o valor recebido na mensagem |
        | `123` | não | `400 could_not_decode_payload` |
        | `available` / `unavailable` | sim | — |

        **Campo em falta e valor errado têm códigos DIFERENTES** desde
        2026-08-26. Até essa data os cinco primeiros estados caíam todos em
        `invalid_presence_type`, e quem esquecia o campo era informado de que o
        seu valor era inválido — sem ter mandado valor nenhum.
      example: available

PedidoSubscricaoPresenca:
  type: object
  description: |
    De quem se quer receber notificações de presença.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [phone]
  properties:
    chat:
      type: string
      nullable: false
      description: |
        Nome universal do destino (F225). Copiado para `phone` apenas quando
        `phone` está vazio, logo `phone` ganha quando os dois vierem. Ausente,
        `null` e `""` são indistinguíveis — medido: `{"chat":""}` dá
        `400 missing_phone`.
      example: 554192421234@s.whatsapp.net
    phone:
      type: string
      nullable: false
      minLength: 1
      description: |
        Contacto a subscrever. Aceita número nu, JID de telefone ou LID — a
        resolução é leniente e aplica o servidor por omissão quando falta o
        `@`.

        | estado | aceite? | efeito medido |
        |---|---|---|
        | ausente | não | `400 missing_phone` |
        | `null` | não | `400 missing_phone` — indistinguível de ausente |
        | `""` | não | `400 missing_phone` — indistinguível de ausente |
        | `"   "` | **não, e com OUTRO código** | `400 invalid_phone`: a guarda é `len(phone) < 1` e três espaços têm comprimento 3 — **não há `trim`** (`subscribe_presence.go:31-33`) |
        | `"lixo"` | não | `400 invalid_phone` |
        | `123` | não | `400 could_not_decode_payload` |
        | preenchido | sim | — |
      example: 554192421234@s.whatsapp.net

# ----------------------------------------------------------------- privacidade

DefinicoesPrivacidade:
  type: object
  description: |
    As definições de privacidade da conta. É a mesma forma na LEITURA
    (`GET /user/privacy`) e na resposta da ESCRITA (`POST /user/privacy`) — a
    escrita devolve o estado RESULTANTE de todas, não só o da que mudou.

    > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
    > CÓDIGO. Este objecto era repassado do módulo de protocolo SEM tratamento,
    > pelo que as chaves vinham em `PascalCase` (`GroupAdd`, `LastSeen`…) e
    > uma chave nova do WhatsApp apareceria na resposta pública sozinha, no
    > próximo rebase do vendor. Hoje o adaptador mapeia campo a campo para
    > `domain.PrivacySettings`: as chaves são as de baixo, **a lista é fechada**
    > e acrescentar uma passou a ser uma decisão nossa. Os valores medidos a
    > 2026-08-26 continuam válidos.

    **A assimetria de nomes entre leitura e escrita MANTÉM-SE**, e é do
    WhatsApp, não nossa: lê-se `read_receipts` e escreve-se `readreceipts`,
    lê-se `last_seen` e escreve-se `last`. A tabela de validação da escrita
    (`pkg/domain/privacy.go`) conhece só SETE das DEZ definições devolvidas
    aqui — cada campo abaixo diz qual é o seu nome de escrita, ou que não tem.

    **As dez chaves aparecem SEMPRE**, e nenhuma vem `null`: a que o motor não
    reportou vem `""`. Era o contrário — nenhuma chave era garantida.

    Os valores são cadeias e **não têm `enum` declarado nesta resposta de
    propósito**: só os sete campos escrevíveis têm conjunto conhecido, e mesmo
    esse é o conjunto que a NOSSA validação aceita na escrita, não uma garantia
    sobre o que a leitura pode devolver.
  required: [group_add, last_seen, status, profile, read_receipts, call_add, online, messages, defense, stickers]
  properties:
    group_add:
      type: string
      nullable: false
      description: |
        Quem pode adicionar a conta a grupos. Escreve-se como `groupadd`, e os valores que a escrita aceita
        são `all`, `contacts`, `contact_blacklist` e `none`. Medido `all` (chave antiga `GroupAdd`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: all
    last_seen:
      type: string
      nullable: false
      description: |
        Quem vê a hora do último acesso. Escreve-se como `last`, e os valores que a escrita aceita
        são `all`, `contacts`, `contact_blacklist` e `none`. Medido `contacts` (chave antiga `LastSeen`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: contacts
    status:
      type: string
      nullable: false
      description: |
        Quem vê os status publicados — é esta definição que decide o alcance de `POST /status/set/*`. Escreve-se como `status`, e os valores que a escrita aceita
        são `all`, `contacts`, `contact_blacklist` e `none`. Medido `contacts` (chave antiga `Status`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: contacts
    profile:
      type: string
      nullable: false
      description: |
        Quem vê a foto de perfil. Escreve-se como `profile`, e os valores que a escrita aceita
        são `all`, `contacts`, `contact_blacklist` e `none`. Medido `all` (chave antiga `Profile`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: all
    read_receipts:
      type: string
      nullable: false
      description: |
        Se os confirmativos de leitura são enviados. É o caso em que a escrita aceita MENOS valores que as outras: `contacts` é recusado com `400 invalid_privacy_value`. Escreve-se como `readreceipts`, e os valores que a escrita aceita
        são só `all` e `none`. Medido `all` (chave antiga `ReadReceipts`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: all
    call_add:
      type: string
      nullable: false
      description: |
        Quem pode ligar para a conta. Escreve-se como `calladd`, e os valores que a escrita aceita
        são só `all` e `known`. Medido `all` (chave antiga `CallAdd`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: all
    online:
      type: string
      nullable: false
      description: |
        Quem vê a conta como online. Escreve-se como `online`, e os valores que a escrita aceita
        são só `all` e `match_last_seen`. Medido `all` (chave antiga `Online`).

        Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
        definição. `""` é distinguível de todo valor aceite, o que `all` não
        seria.
      example: all
    messages:
      type: string
      nullable: false
      description: |
        Devolvido pela leitura e **sem contraparte na escrita** — não consta da tabela de validação (`pkg/domain/privacy.go`), logo não é definível por esta API: `{"privacy_setting":"messages"}` é recusado com `400 invalid_privacy_setting`. Medido `all` (chave antiga `Messages`).

        Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
      example: all
    defense:
      type: string
      nullable: false
      description: |
        Devolvido pela leitura e **sem contraparte na escrita**. O significado exacto não foi determinado com segurança pela implementação actual — o campo é repassado do WhatsApp e não é interpretado em lado nenhum do nosso código. Medido `off` (chave antiga `Defense`).

        Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
      example: 'off'
    stickers:
      type: string
      nullable: false
      description: |
        Devolvido pela leitura e **sem contraparte na escrita** — não consta da tabela de validação. Medido `contacts` (chave antiga `Stickers`).

        Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
      example: contacts

PedidoDefinicaoPrivacidade:
  type: object
  description: |
    Uma definição de privacidade de cada vez. Nome e valor são validados contra
    a tabela do domínio (`pkg/domain/privacy.go:54-62`) ANTES de qualquer
    chamada ao WhatsApp, e cada definição tem o seu próprio conjunto de valores
    válidos — `contacts` vale para `status` e é recusado em `readreceipts`.

    Os dois campos são `string` sem `*`, logo ausente, `null` e `""` são o
    mesmo pedido: caem no `400` de nome inválido ou de valor inválido, nunca
    num código próprio de "campo em falta".

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [privacy_setting, value]
  properties:
    privacy_setting:
      type: string
      nullable: false
      minLength: 1
      enum: [groupadd, last, status, profile, readreceipts, online, calladd]
      description: |
        Qual definição alterar, em MINÚSCULAS. **Não são as mesmas chaves que a
        leitura devolve** — ver `DefinicoesPrivacidade`.

        **Nome desconhecido, isto é, fora do conjunto acima, é RECUSADO** com
        `400 invalid_privacy_setting` e a mensagem
        `invalid privacy setting name "…"`, antes de qualquer chamada
        ao WhatsApp. Não é ignorado. A comparação é por igualdade exacta e
        sensível a maiúsculas: `GroupAdd` — a grafia que a LEITURA devolve — é
        recusada aqui.

        Ausente, `null` e `""` caem todos no mesmo `400
        invalid_privacy_setting`: o campo vazio não tem código próprio.

        As três chaves que a leitura devolve e não constam desta lista
        (`Messages`, `Defense`, `Stickers`) **não são definíveis** por esta API.
      example: status
    value:
      type: string
      nullable: false
      minLength: 1
      description: |
        O valor. O conjunto válido **DEPENDE da definição**, e por isso não há
        um `enum` único aqui — declarar a união dos conjuntos seria mentir
        sobre pares que a validação recusa:

        | `privacy_setting` | valores aceites |
        |---|---|
        | `groupadd`, `last`, `status`, `profile` | `all`, `contacts`, `contact_blacklist`, `none` |
        | `readreceipts` | `all`, `none` |
        | `online` | `all`, `match_last_seen` |
        | `calladd` | `all`, `known` |

        **Valor fora do conjunto daquela definição é RECUSADO** com
        `400 invalid_privacy_value` e a mensagem
        `invalid value "…" for privacy setting "…"`. A comparação é sensível a
        maiúsculas: `ALL` é recusado.

        Nome desconhecido e valor fora do conjunto produzem erros DIFERENTES de
        propósito (`invalid_privacy_setting` e `invalid_privacy_value`): quem
        chama precisa de saber qual dos dois errou. Só um erro sai por pedido —
        esta API não tem `error.details[]`.

        Ausente, `null` e `""` caem em `400 invalid_privacy_value`.
      example: contacts

# --------------------------------------------------------------------- status

PedidoStatusImagem:
  type: object
  description: |
    Imagem a publicar como status. A origem é uma união de duas formas: URI de
    dados ou URL http(s). Qualquer outra coisa é recusada antes de sair da
    máquina.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [image]
  properties:
    image:
      type: string
      nullable: false
      minLength: 1
      description: |
        A imagem, como URI de dados começado por `data:image` **ou** como URL
        `http(s)://`. O limite é de 16 MiB depois de descodificada, e é
        verificado ANTES da descodificação quando o URI declara `;base64`
        (`publish_image.go:96-105`).

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_image` |
        | `null` | não | `400 missing_image` — indistinguível de ausente |
        | `""` | não | `400 missing_image` — indistinguível de ausente |
        | `"   "` | não | `400 unsupported_image_source` — não é `data:image` nem URL |
        | `123` | não | `400 could_not_decode_payload` |
        | `data:image…` mal formado | não | `400 invalid_data_uri` |
        | acima de 16 MiB | não | `400 image_too_large` |
        | corpo descodificado vazio | não | `400 empty_image_body` |
        | URL http(s) que não baixa | não | `400 image_fetch_failed` |
        | preenchido e válido | sim | — |

        Repare no prefixo: é `data:image` **literal**, não `data:` genérico
        (`publish_image.go:88-90`). Um `data:application/octet-stream;base64,…`
        cai em `unsupported_image_source`, e não em erro de tipo.
      example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
    caption:
      type: string
      nullable: false
      description: |
        Legenda a mostrar sob a imagem.

        Opcional: ausente, `null` e `""` são indistinguíveis (é `string` sem
        `*`, com `omitempty` só na SERIALIZAÇÃO) e os três significam "sem
        legenda". **Não há `trim` nem limite de comprimento** na
        implementação — `"   "` é aceite e publicado tal e qual.
      example: Estamos abertos até às 20h.
    id:
      type: string
      nullable: false
      description: |
        Identificador a atribuir à mensagem. Ausente, `null` e `""` são
        indistinguíveis e significam "gera tu" — o servidor gera um, e é esse
        que volta em `message_id` na resposta.

        **Não é chave de idempotência.** Publicar duas vezes com o mesmo `id`
        publica duas vezes; não foi medido que o servidor o use para
        deduplicar (ver secção 18 do contrato arquitectural). O formato não é
        validado por nós.
      example: 3EB0A4B2AFD45E625C0917
    mime_type:
      type: string
      nullable: false
      description: |
        Tipo da imagem.

        Ausente, `null` e `""` são indistinguíveis e significam "detecta tu":
        o tipo é então inferido dos bytes com `http.DetectContentType`
        (`media_helpers.go:9-14`).

        **Quando é dado, é usado TAL E QUAL, sem confronto com os bytes** — a
        detecção é saltada por completo. A única verificação é que o tipo
        resolvido comece por `image/`, senão o pedido é recusado com
        `400 invalid_image_mime_type`. Ou seja: declarar `image/png` para um
        JPEG passa, e declarar `text/plain` para um PNG legítimo é recusado.
      example: image/png
    jpeg_thumbnail:
      type: string
      format: byte
      nullable: true
      description: |
        Miniatura JPEG, em base64, para o cliente desenhar antes de baixar a
        imagem.

        O campo é `[]byte` em Go (`pkg/domain/session.go:88`), pelo que o JSON
        tem de trazer uma CADEIA base64 — `null` dá `nil`, `""` dá uma fatia
        vazia, e as duas significam "sem miniatura". Um número ou um objecto
        dão `400 could_not_decode_payload`, e uma cadeia que não é base64
        válido também.

        O conteúdo não é validado como sendo de facto um JPEG.
  example:
    image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
    caption: Estamos abertos até às 20h.

PedidoStatusVideo:
  type: object
  description: |
    Vídeo a publicar como status. Mesma união de origens da imagem, com um
    limite maior e uma verificação de tipo mais frouxa.

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [video]
  properties:
    video:
      type: string
      nullable: false
      minLength: 1
      description: |
        O vídeo, como URI de dados **ou** como URL `http(s)://`. O limite é de
        100 MiB depois de descodificado.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_video` |
        | `null` | não | `400 missing_video` — indistinguível de ausente |
        | `""` | não | `400 missing_video` — indistinguível de ausente |
        | `"   "` | não | `400 unsupported_video_source` |
        | `123` | não | `400 could_not_decode_payload` |
        | URI de dados mal formado | não | `400 invalid_data_uri` |
        | acima de 100 MiB | não | `400 video_too_large` |
        | corpo descodificado vazio | não | `400 empty_video_body` |
        | URL http(s) que não baixa | não | `400 video_fetch_failed` |
        | preenchido e válido | sim | — |

        **Duas diferenças reais face à rota de imagem**, ambas lidas no código
        (`publish_video.go:17, 83-85`):

        1. O prefixo aceite é `"data"` — quatro letras, **sem os dois pontos**
           e sem o tipo. Uma cadeia começada por `datax` entra por este ramo e
           morre depois em `invalid_data_uri`. Não é `data:video`.
        2. O tipo resolvido **não é verificado** contra `video/`. Um URI de
           dados de outro tipo, ou um URL que sirva outra coisa, passa por
           aqui sem recusa.
      example: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
    caption:
      type: string
      nullable: false
      description: |
        Legenda a mostrar sob o vídeo. Opcional: ausente, `null` e `""` são
        indistinguíveis e significam "sem legenda". Não há `trim` nem limite de
        comprimento.
      example: Bastidores de hoje.
    id:
      type: string
      nullable: false
      description: |
        Identificador a atribuir à mensagem. Ausente, `null` e `""` são
        indistinguíveis e significam "gera tu". **Não é chave de
        idempotência** — publicar duas vezes publica duas vezes.
      example: 3EB0A4B2AFD45E625C0917
    mime_type:
      type: string
      nullable: false
      description: |
        Tipo do vídeo. Ausente, `null` e `""` são indistinguíveis e significam
        "detecta tu" (`http.DetectContentType` sobre os bytes).

        Quando é dado, é usado tal e qual, sem confronto com os bytes — e, ao
        contrário da rota de imagem, **o resultado não é verificado contra
        `video/`**: qualquer valor passa.
      example: video/mp4
    jpeg_thumbnail:
      type: string
      format: byte
      nullable: true
      description: |
        Miniatura JPEG, em base64, para o cliente desenhar antes de baixar o
        vídeo. É `[]byte` em Go: `null` dá `nil`, `""` dá fatia vazia, e as
        duas significam "sem miniatura". Cadeia que não é base64 válido dá
        `400 could_not_decode_payload`. O conteúdo não é validado como JPEG.
  example:
    video: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
    caption: Bastidores de hoje.

PedidoStatusAudio:
  type: object
  description: |
    Áudio a publicar como status. **Não aceita legenda nem miniatura** — a
    struct não tem `caption` nem `jpeg_thumbnail`
    (`pkg/presentation/http/dto/session/request.go`), e enviá-los é ignorado,
    como qualquer campo desconhecido (o servidor regista
    `unknown field "<nome>"`; ver "Campos que a API não conhece").

    Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
    desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
    modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
    `400 unknown_field`. Ver a secção "Campos que a API não conhece".
  required: [audio]
  properties:
    audio:
      type: string
      nullable: false
      minLength: 1
      description: |
        O áudio, como URI de dados começado por `data:audio/` **ou** como URL
        `http(s)://`. O limite é de 16 MiB depois de descodificado.

        | estado | aceite? | efeito |
        |---|---|---|
        | ausente | não | `400 missing_audio` |
        | `null` | não | `400 missing_audio` — indistinguível de ausente |
        | `""` | não | `400 missing_audio` — indistinguível de ausente |
        | `"   "` | não | `400 unsupported_audio_source` |
        | `123` | não | `400 could_not_decode_payload` |
        | URI de dados mal formado | não | `400 invalid_data_uri` |
        | acima de 16 MiB | não | `400 audio_too_large` |
        | corpo descodificado vazio | não | `400 empty_audio_body` |
        | URL http(s) que não baixa | não | `400 audio_fetch_failed` |
        | preenchido e válido | sim | — |

        O prefixo é `data:audio/` **completo** — mais estrito que o da imagem
        (`data:image`) e muito mais que o do vídeo (`data`). As três rotas
        vizinhas usam três regras diferentes para a mesma ideia
        (`publish_audio.go:19`, `publish_image.go:17`, `publish_video.go:17`).
      example: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
    id:
      type: string
      nullable: false
      description: |
        Identificador a atribuir à mensagem. Ausente, `null` e `""` são
        indistinguíveis e significam "gera tu". **Não é chave de
        idempotência.**
      example: 3EB0A4B2AFD45E625C0917
    mime_type:
      type: string
      nullable: false
      description: |
        Tipo do áudio. **Antes da migração de DTO esta rota chamava o campo
        `mimetype`, minúsculo**, enquanto imagem e vídeo usavam `MimeType`
        (`pkg/domain/session.go:120`) — três rotas, duas grafias, para a
        mesma ideia. `pkg/presentation/http/dto/session/request.go` unificou
        as três em `mime_type`.

        Ausente, `null` e `""` são indistinguíveis e significam "detecta tu".
        A cascata de detecção tem quatro degraus, nesta ordem
        (`publish_audio.go:89-99`):

        1. o que veio neste campo, se não estiver vazio — usado tal e qual, sem
           confronto com os bytes;
        2. o tipo declarado no próprio URI de dados, ou o `Content-Type` da
           resposta HTTP **quando começa por `audio/`**;
        3. `http.DetectContentType` sobre os bytes, se não devolver
           `application/octet-stream`;
        4. `audio/mpeg`, como último recurso.

        **O degrau 4 é um palpite silencioso**: um ficheiro que não se
        consegue identificar é publicado como MP3 sem qualquer aviso. E, tal
        como no vídeo, o resultado **não é verificado** contra `audio/`.
      example: audio/mp4
  example:
    audio: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
