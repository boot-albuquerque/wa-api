# Grupo: Grupos — 18 rotas.
#
# É a família com mais armadilhas MEDIDAS do inventário, e elas estão escritas
# como regra visível em cada rota, não em nota de rodapé.
#
# H-DTO-GROUP (feat(http): migra a familia grupo/comunidade para DTO na
# fronteira HTTP): toda rota lê hoje um `dtogroup.*Request` tipado, com
# etiquetas `json` em snake_case (docs/HTTP-DTO-CONVENTIONS.md). O formato
# ANTIGO de erro (F266, `error` em texto simples) foi removido do projecto
# inteiro; a recusa não tipada de um manipulador sai hoje no objecto canónico
# `{"code":"invalid_request","message":"Requisição inválida."}`. As notas
# "envelope ANTIGO (F266)" que ainda aparecem nesta especificação descrevem o
# comportamento ANTES da migração e foram corrigidas onde encontradas — ver
# `HOUSEKEEP.md` para a entrada de fecho.
#
#   - `/group/join` lê `code`, e a struct de domínio declara `inviteLink`
#     (F267) — o DTO de pedido cobre essa divergência;
#   - `/group/photo` recusa o prefixo `data:` que `/chat/send/image` aceita;
#   - `/group/updateparticipants` não sabe promover nem despromover (F263);
#   - `GET /group/requestparticipants` lê o corpo — e também a query string.

/groups/{group_jid}/announce-only:
  put:
    tags: [Grupos]
    summary: Fechar ou abrir o grupo à escrita de não-administradores
    description: |
      Liga ou desliga o modo anúncio: com ele ligado, só administradores
      enviam mensagens no grupo. O estado resultante aparece em
      `GET /groups/{group_jid}` como `IsAnnounce`.

      **Quando usar**: em grupos de difusão — avisos de turno, comunicados —
      onde a conversa de volta é ruído.

      **Regras**: `announce` ausente vale `false`, logo um pedido só com o
      grupo ABRE o grupo em vez de o consultar. O manipulador não valida
      campo nenhum: um pedido sem grupo chega à resolução do JID e falha lá,
      com `invalid_jid`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoAnuncioGrupo'
          example:
            group_jid: 120363411669320145@g.us
            announce: true
    responses:
      '200':
        description: O WhatsApp aceitou a mudança.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group announce set successfully}
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/create:
  post:
    tags: [Grupos]
    summary: Criar um grupo, uma comunidade ou um sub-grupo
    description: |
      Cria um grupo com os participantes indicados. A MESMA rota cria as três
      coisas, e o que as distingue são dois campos opcionais:

      - sem nenhum deles: grupo normal, e `participants` é obrigatório;
      - `is_parent: true`: **comunidade**. O WhatsApp cria sozinho o
        sub-grupo de avisos, que passa a aparecer em `POST /group/list` com
        `IsDefaultSubGroup: true`. Aqui `participants` deixa de ser exigido;
      - `linked_parent_jid`: grupo criado já DENTRO da comunidade indicada.

      **Quando usar**: no arranque de uma operação, para montar a estrutura
      de uma vez. Para ligar um grupo que já existe a uma comunidade, a rota
      é `POST /community/link`, não esta.

      **Regras**: `name` é obrigatório. `is_parent` e `linked_parent_jid` são
      mutuamente exclusivos — os dois juntos devolvem `400` sem contactar o
      WhatsApp. Uma entrada vazia em `participants` é recusada com o índice
      dela. Participante que o WhatsApp recuse individualmente não faz o
      pedido falhar: volta na lista com `Error` diferente de zero.

      **Formato do erro `400`**: esta rota usa `rejectMissingField`
      (`handler_group_mgmt.go:114`) e responde no objecto canónico,
      `{"code":400,"error":{"code":"invalid_request","message":"Requisição
      inválida."},"success":false}` — um cliente que leia `error.code` já
      consegue ramificar.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoCriarGrupo'
          example:
            name: Equipa de entregas
            participants: [554192421234@s.whatsapp.net]
    responses:
      '200':
        description: |
          Grupo criado. O corpo traz os metadados completos do grupo novo,
          na mesma forma que `GET /groups/{group_jid}` devolve; `created`
          diz se foi mesmo criado ou apenas encontrado.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoCriarGrupo'
            example:
              code: 200
              data:
                group_info:
                  jid: 120363411669320145@g.us
                  owner_jid: 90937376170214@lid
                  name: Equipa de entregas
                  name_set_at: null
                  name_set_by: ''
                  topic: ''
                  topic_set_at: null
                  topic_set_by: ''
                  is_locked: false
                  is_announce: false
                  is_ephemeral: false
                  disappearing_timer: 0
                  is_incognito: false
                  is_suspended: false
                  is_parent: false
                  linked_parent_jid: ''
                  is_default_sub_group: false
                  is_join_approval_required: false
                  member_add_mode: ''
                  created_at: '2026-08-26T08:42:47-04:00'
                  participant_count: 1
                  participants:
                    - jid: 90937376170214@lid
                      phone_number: 554192421234@s.whatsapp.net
                      lid: 90937376170214@lid
                      display_name: ''
                      is_admin: true
                      is_super_admin: true
                created: true
              success: true
      '400':
        description: |
          `name` ausente, `participants` ausente ou vazio num grupo normal,
          ou `is_parent` e `linked_parent_jid` no mesmo pedido.

          **Objecto canónico**: `error.code = invalid_request` em todas as
          seis causas — o manipulador não distingue qual campo falhou.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/{group_jid}/ephemeral:
  put:
    tags: [Grupos]
    summary: Definir o tempo das mensagens temporárias do grupo
    description: |
      Liga as mensagens temporárias com uma das três durações reconhecidas,
      ou desliga-as.

      **Quando usar**: em grupos operacionais cujo histórico não deve
      persistir.

      **Regra que morde**: só `24h`, `7d` e `90d` são reconhecidos
      (`group_management.go:229-241`). **Qualquer outro valor DESLIGA o
      temporizador**, responde `200`, e regista um aviso no log — incluindo
      um erro de escrita como `"24H"` ou `"1d"`. Do lado do cliente não há
      nada que distinga "desligou de propósito" de "escreveu mal".

      **O campo do grupo é `group_jid`**, todo em minúsculas
      (`pkg/domain/group.go:186`).

      **Leitura de volta**: `GET /groups/{group_jid}` devolve
      `DisappearingTimer` em SEGUNDOS — `86400` para as 24 horas que aqui se
      pedem como texto.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupjid` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoTemporizadorGrupo'
          example:
            group_jid: 120363411669320145@g.us
            duration: 24h
    responses:
      '200':
        description: |
          Temporizador definido. Repare que este `200` também cobre o caso em
          que a duração não foi reconhecida e o temporizador foi DESLIGADO.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Disappearing timer set}
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/{group_jid}:
  get:
    tags: [Grupos]
    summary: Consultar os metadados de um grupo
    description: |
      Devolve o retrato completo de um grupo: nome, descrição, definições,
      comunidade a que pertence e a lista de participantes com quem é
      administrador.

      **Quando usar**: sempre que precisar da contagem de membros ou de saber
      quem é administrador. `POST /groups/list` traz a mesma forma mas
      **devolve `ParticipantCount` a zero** — medido no mesmo minuto, para o
      mesmo grupo, contra o `2` correcto desta rota.

      **Regras**: `group_jid` é obrigatório; a recusa é `400 missing_group_jid`.
      Um JID MAL FORMADO — número nu, só espaços — devolve
      `400 invalid_group_jid`.

      **Medido, e desmente o que aqui estava escrito**: um JID BEM formado mas
      de CONTACTO (`554192421234@s.whatsapp.net`) **não** é recusado por
      validação. Passa `ResolveJID`, segue para o WhatsApp, e a chamada fica
      pendurada **~75 segundos** antes de devolver `500 internal server error`
      — muito acima dos 30 s de `waclient.RequestTimeout`. Quem chamar esta
      rota tem de impor prazo próprio.

      **Erros**: `missing_group_jid`, `invalid_group_jid`, `no_session`
      quando a sessão existe mas não está emparelhada.

      **FORMA DA RESPOSTA — esta rota foi a primeira migrada.** As chaves de
      `group_info` são `snake_case` minúsculo (`jid`, `owner_jid`, `is_admin`),
      produzidas por um apresentador escrito à mão, e já não são os nomes de
      campo do Go que a serialização directa da struct de protocolo emitia
      (`JID`, `OwnerJID`, `IsAdmin`). Toda a família de grupo e comunidade
      migrou desde então para a mesma forma — ver `InfoGrupoCanonico` e
      `docs/HTTP-DTO-CONVENTIONS.md`.

      Campos de protocolo que a forma canónica NÃO traz: `OwnerPN`, `TopicID`,
      `AddressingMode`, `CreatorCountryCode`, `AnnounceVersionID`,
      `ParticipantVersionID`, e `Error`/`AddRequest` dos participantes.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlvoGrupo'
          example:
            group_jid: 120363411669320145@g.us
    responses:
      '200':
        description: Metadados do grupo no instante do pedido.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoInfoGrupo'
            example:
              code: 200
              data:
                group_info:
                  jid: 120363411669320145@g.us
                  owner_jid: 90937376170214@lid
                  name: Equipa de entregas
                  name_set_at: '2026-08-26T12:42:49Z'
                  name_set_by: 90937376170214@lid
                  topic: Combinações de rota do turno da manhã
                  topic_set_at: '2026-08-26T12:42:51Z'
                  topic_set_by: 90937376170214@lid
                  is_locked: false
                  is_announce: false
                  is_ephemeral: true
                  disappearing_timer: 86400
                  is_incognito: false
                  is_suspended: false
                  is_parent: false
                  linked_parent_jid: ''
                  is_default_sub_group: false
                  is_join_approval_required: false
                  member_add_mode: admin_add
                  created_at: '2026-08-26T12:42:47Z'
                  participant_count: 2
                  participants:
                    - jid: 90937376170214@lid
                      phone_number: 554192421234@s.whatsapp.net
                      lid: 90937376170214@lid
                      display_name: ''
                      is_admin: false
                      is_super_admin: false
              success: true
      '400':
        description: |
          `group_jid` ausente (`missing_group_jid`), impossível de resolver
          (`invalid_group_jid`), corpo que não é JSON
          (`could_not_decode_payload`), ou sessão por emparelhar
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_group_jid
                message: missing group_jid parameter
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/invite-links/{invite_code}:
  get:
    tags: [Grupos]
    summary: Inspecionar um convite sem entrar no grupo
    description: |
      Lê os metadados do grupo que está por trás de um convite, **sem
      aderir** e sem gerar pedido de entrada. É a rota a chamar antes de
      `POST /group/join`.

      **Quando usar**: para saber quantos membros tem, quem é o dono, e
      sobretudo se `IsJoinApprovalRequired` é verdadeiro — nesse caso
      `POST /group/join` produz uma SOLICITAÇÃO em vez de uma entrada.

      **Regras**: o código não pertence a um grupo já conhecido pela sessão —
      é por isso que esta rota não vive sob `/groups/{group_jid}`: o
      identificador que o chamador tem É o código, não o JID (que só se
      descobre lendo esta resposta). Ausente devolve `400 missing_code`. O
      valor é o código nu. **Medido**: o URL completo também devolve `200`,
      porque a biblioteca corta o prefixo
      (`internal/wa-noise/capabilities/group/invite.go:83`).

      **Ressalva medida**: a resposta traz `AnnounceVersionID`,
      `ParticipantVersionID` e `MemberAddMode` VAZIOS, ao contrário de
      `GET /groups/{group_jid}` sobre o mesmo grupo.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: invite_code
        in: path
        required: true
        description: |
          Código do convite (sem o prefixo do link). Substitui o campo
          `Code` do corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: IVccRoDVSbpHKNkgNxyZx4}
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoInfoConvite'
          example:
            code: IVccRoDVSbpHKNkgNxyZx4
    responses:
      '200':
        description: Metadados do grupo por trás do convite.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoInfoConvite'
            example:
              code: 200
              data:
                invite_info:
                  jid: 120363411669320145@g.us
                  owner_jid: 90937376170214@lid
                  name: Equipa de entregas
                  name_set_at: null
                  name_set_by: ''
                  topic: Combinações de rota do turno da manhã
                  topic_set_at: null
                  topic_set_by: ''
                  is_locked: false
                  is_announce: false
                  is_ephemeral: false
                  disappearing_timer: 0
                  is_incognito: false
                  is_suspended: false
                  is_parent: false
                  linked_parent_jid: ''
                  is_default_sub_group: false
                  is_join_approval_required: false
                  member_add_mode: ''
                  created_at: null
                  participant_count: 2
                  participants:
                    - jid: 90937376170214@lid
                      phone_number: 554192421234@s.whatsapp.net
                      lid: 90937376170214@lid
                      display_name: ''
                      is_admin: false
                      is_super_admin: false
              success: true
      '400':
        description: |
          `code` ausente (`missing_code`), corpo inválido
          (`could_not_decode_payload`), ou sessão por emparelhar
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_code
                message: missing Code in payload
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        description: |
          O convite foi revogado, é inválido, ou o WhatsApp não respondeu.
          Ao contrário de `GET /groups/{group_jid}`, esta rota NÃO traduz a recusa do
          WhatsApp para `422`: o use case embrulha o erro com `fmt.Errorf`
          (`get_group_invite_info.go:44`), logo a recusa de convite chega
          como `500` de texto genérico.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 500
              error:
                code: internal_error
                message: Ocorreu um erro interno.
              success: false

/groups/{group_jid}/invite-link:
  get:
    tags: [Grupos]
    summary: Obter o link de convite de um grupo
    description: |
      Devolve o link de convite actual do grupo. **Não o revoga**: o
      adaptador chama o SDK com o sinalizador de reposição a falso
      (`pkg/infra/wa-noise/adapters/group/read.go:44`), logo chamadas
      repetidas devolvem o mesmo link. Não há rota nesta API para revogar um
      link.

      **Quando usar**: para distribuir acesso a um grupo sem adicionar
      pessoa a pessoa.

      **Cuidado ao encadear com `POST /group/join`**: esta rota devolve o
      **link inteiro** (`https://chat.whatsapp.com/…`) e o `join` documenta o
      **código nu**. Alimentar um no outro só funciona porque a biblioteca
      corta o prefixo, e não porque o contrato o promete.

      **Regras**: `group_jid` é obrigatório (`missing_group_jid`); só um
      administrador obtém o link — o WhatsApp recusa aos outros, e a recusa
      chega traduzida como `422`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlvoGrupo'
          example:
            group_jid: 120363411669320145@g.us
    responses:
      '200':
        description: O link actual do grupo.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoLinkConvite'
            example:
              code: 200
              data: {invite_link: 'https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4'}
              success: true
      '400':
        description: |
          `group_jid` ausente (`missing_group_jid`), impossível de resolver
          (`invalid_group_jid`), corpo inválido
          (`could_not_decode_payload`), ou sessão por emparelhar
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_group_jid
                message: missing group_jid parameter
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/join:
  post:
    tags: [Grupos]
    summary: Entrar num grupo por código de convite
    description: |
      Faz a conta entrar no grupo por trás de um convite.

      **A struct de domínio MENTE aqui, e é a armadilha mais cara desta
      família.** `GroupJoinRequest` (`pkg/domain/group.go:52-54`) declara
      `inviteLink`, e **não é o que a rota lê**: o corpo é
      `dtogroup.JoinGroupRequest` (`pkg/presentation/http/dto/group/request.go`),
      com o campo `code`. Um cliente escrito a partir do domínio recebe
      `400`. É o achado F267.

      O valor é o **código nu** — `IVccRoDVSbpHKNkgNxyZx4` — e não o URL,
      que é o que `GET /groups/{group_jid}/invite-link` devolve.

      **Quando usar**: depois de `GET /groups/invite-links/{invite_code}`, que diz o que há
      do outro lado sem aderir.

      **Ressalva NÃO medida**: num grupo com `IsJoinApprovalRequired`, o
      protocolo transforma a entrada numa SOLICITAÇÃO pendente em vez de uma
      adesão. O manipulador devolve sempre a mesma frase de sucesso e não
      distingue os dois casos — se a conta entrou mesmo, confirme com
      `POST /group/list`. O comportamento exacto do código de estado nesse
      caso não foi determinado com segurança pela implementação actual.

      **Formato do erro `400`**: objecto canónico, `error.code = invalid_request`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoEntrarGrupo'
          example:
            code: IVccRoDVSbpHKNkgNxyZx4
    responses:
      '200':
        description: |
          O pedido de entrada foi aceite pelo WhatsApp. **Não confirma que a
          conta está no grupo**: num grupo que exija aprovação, isto pode ser
          uma solicitação pendente.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group joined successfully}
              success: true
      '400':
        description: |
          `code` ausente ou vazio. `error.code = invalid_request` — não diz
          qual campo faltou; a causa fica só no log.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/joinapprovalmode:
  post:
    tags: [Grupos]
    summary: Exigir aprovação de administrador para entrar no grupo
    description: |
      Liga ou desliga a exigência de aprovação. Com ela ligada, quem segue o
      link de convite fica em espera, e passa a aparecer em
      `GET /group/requestparticipants` até um administrador decidir.

      **Quando usar**: em grupos cujo link circula, para filtrar quem entra
      sem revogar o link.

      **Regras**: o campo do grupo é `group_jid`, todo em minúsculas
      (`pkg/domain/group_request.go:40`). `mode` ausente vale `false`, logo
      um pedido só com o grupo **DESLIGA** a exigência — não a consulta.
      Para ler o estado actual use `IsJoinApprovalRequired` de
      `GET /groups/{group_jid}`.

      **Erros**: `missing_group_jid`, `invalid_group_jid`, `no_session`, no
      envelope novo — esta rota não passa por `rejectMissingField`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoModoAprovacao'
          example:
            group_jid: 120363411669320145@g.us
            mode: true
    responses:
      '200':
        description: Modo de aprovação alterado.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group join approval mode updated successfully}
              success: true
      '400':
        description: |
          `group_jid` ausente (`missing_group_jid`), impossível de resolver
          (`invalid_group_jid`), corpo inválido
          (`could_not_decode_payload`), ou sessão por emparelhar
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_group_jid
                message: missing group_jid parameter
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/leave:
  post:
    tags: [Grupos]
    summary: Sair de um grupo
    description: |
      Faz a conta sair do grupo. **É irreversível pela própria conta**: não
      há rota que a reponha, e voltar exige um convite novo ou que um
      administrador a adicione.

      **Quando usar**: no encerramento de uma operação. Para deixar de ver o
      grupo sem sair dele, arquive a conversa em vez disto.

      **Regras**: `group_jid` é obrigatório — a recusa vem do manipulador
      (`handler_group_mgmt.go:163`), via `rejectMissingField`. `chat` é
      aceite como alternativa; o nome específico ganha quando os dois vierem.

      **Formato do erro `400`**: objecto canónico, `error.code = invalid_request`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlvoGrupo'
          example:
            group_jid: 120363411669320145@g.us
    responses:
      '200':
        description: A saída foi aceite pelo WhatsApp.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group left successfully}
              success: true
      '400':
        description: |
          `group_jid` e `chat` ambos ausentes. `error.code = invalid_request`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/list:
  post:
    tags: [Grupos]
    summary: Listar os grupos da sessão
    description: |
      Devolve todos os grupos de que a conta participa, cada um com os mesmos
      metadados que `GET /groups/{group_jid}` traz.

      **Quando usar**: para descobrir os JIDs dos grupos. É a rota de partida
      de quase tudo o resto desta família.

      **Ressalva MEDIDA, e que muda o que se pode fazer com a resposta**:
      `ParticipantCount` vem **zero** para todos os grupos aqui, enquanto
      `GET /groups/{group_jid}` sobre o mesmo grupo, no mesmo minuto, devolveu `2`.
      Para contar membros a partir desta listagem, conte `Participants`, que
      vem correcta.

      **O que a lista inclui**: comunidades (`is_parent: true`) e os
      sub-grupos de avisos que elas criam sozinhas
      (`is_default_sub_group: true`) aparecem como entradas normais, ao lado
      dos grupos comuns.

      **Regras**: o corpo é ignorado — a rota não tem filtro nem paginação
      (`handler_group.go`, `ListGroupsUseCase`). Envie `{}`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            description: Sem campos. O corpo é lido e descartado.
          example: {}
    responses:
      '200':
        description: Todos os grupos da sessão.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoListaGrupos'
            example:
              code: 200
              data:
                groups:
                  - jid: 120363411669320145@g.us
                    owner_jid: 90937376170214@lid
                    name: Equipa de entregas
                    name_set_at: null
                    name_set_by: ''
                    topic: Combinações de rota do turno da manhã
                    topic_set_at: null
                    topic_set_by: ''
                    is_locked: false
                    is_announce: false
                    is_ephemeral: true
                    disappearing_timer: 86400
                    is_incognito: false
                    is_suspended: false
                    is_parent: false
                    linked_parent_jid: ''
                    is_default_sub_group: false
                    is_join_approval_required: false
                    member_add_mode: admin_add
                    created_at: null
                    participant_count: 0
                    participants:
                      - jid: 90937376170214@lid
                        phone_number: 554192421234@s.whatsapp.net
                        lid: 90937376170214@lid
                        display_name: ''
                        is_admin: false
                        is_super_admin: false
              success: true
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/{group_jid}/locked:
  put:
    tags: [Grupos]
    summary: Trancar ou destrancar a edição dos metadados do grupo
    description: |
      Liga ou desliga a tranca: com ela ligada, só administradores mudam
      nome, descrição e foto do grupo. O estado resultante aparece em
      `GET /groups/{group_jid}` como `IsLocked`.

      **Quando usar**: em grupos grandes, para que a identidade do grupo não
      dependa da boa-fé de todos os membros.

      **Não confundir com `PUT /groups/{group_jid}/announce-only`**: a
      tranca governa quem edita os METADADOS; o anúncio governa quem envia
      MENSAGENS. São independentes e podem estar ligados ao mesmo tempo.

      **Regras**: `locked` ausente vale `false`, logo um pedido só com o
      grupo DESTRANCA. O manipulador não valida campo nenhum: um pedido sem
      grupo falha adiante, com `invalid_jid`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoTrancarGrupo'
          example:
            group_jid: 120363411669320145@g.us
            locked: true
    responses:
      '200':
        description: O WhatsApp aceitou a mudança.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group lock updated}
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/{group_jid}/name:
  put:
    tags: [Grupos]
    summary: Mudar o nome de um grupo
    description: |
      Renomeia o grupo. O nome novo aparece de imediato em
      `GET /groups/{group_jid}`, junto com `NameSetAt` e `NameSetBy`.

      **Quando usar**: para manter o nome alinhado com a operação — o nome é
      o que aparece na lista de conversas de cada membro.

      **Regras**: `name` é obrigatório e vazio é recusado. **É o único campo
      validado pelo manipulador** (`handler_group_mgmt.go:198`): um pedido
      sem `group_jid` passa esta validação e só falha adiante, na resolução do
      JID, com `invalid_jid` no envelope NOVO. As duas recusas desta rota
      têm portanto formatos diferentes.

      Num grupo com `IsLocked` verdadeiro, só administradores conseguem — a
      recusa vem do WhatsApp, como `422`.

      **Formato do erro `400` de campo em falta**: objecto canónico,
      `error.code = invalid_request`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoNomeGrupo'
          example:
            group_jid: 120363411669320145@g.us
            name: Equipa de entregas — turno da manhã
    responses:
      '200':
        description: Nome alterado.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group name set successfully}
              success: true
      '400':
        description: |
          `name` ausente ou vazio. `error.code = invalid_request`.

          Um `group_jid` ausente ou inválido produz `400` também, mas com
          `error.code = invalid_jid`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/photo:
  post:
    tags: [Grupos]
    summary: Definir a foto de um grupo
    description: |
      Substitui a foto do grupo pela imagem enviada.

      **Duas armadilhas medidas, isoladas com uma variável de cada vez:**

      1. **A imagem vai em base64 CRU, sem o prefixo
         `data:image/jpeg;base64,`.** Os mesmos nomes de campo e a mesma
         imagem, com o prefixo, devolvem `400`; sem o prefixo, `200`. O
         descodificador do manipulador (`handler_group_mgmt.go:245`) rejeita
         os `:` e `;` do URI de dados antes de qualquer coisa sair da
         máquina. **Isto DIVERGE de `POST /chat/send/image`**, que aceita o
         URI de dados — as duas rotas recebem imagem e só uma o tolera.
      2. **A imagem tem de ser JPEG.** PNG é bem descodificado aqui e depois
         recusado pelo WhatsApp, com `422 upstream_rejected`.

      **Quando usar**: no arranque de um grupo, ou quando a identidade visual
      muda. Para tirar a foto sem pôr outra, use `POST /group/photo/remove`.

      **Regras**: `photo` é obrigatório; é o único campo validado
      (`handler_group_mgmt.go:242`). Num grupo com `IsLocked` verdadeiro, só
      administradores conseguem.

      **Formato do erro `400`**: objecto canónico, `error.code = invalid_request`
      tanto para `photo` em falta como para base64 inválido — o cliente não
      distingue as duas causas pelo corpo, só pelo log do servidor.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoFotoGrupo'
          example:
            group_jid: 120363411669320145@g.us
            photo: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA==
    responses:
      '200':
        description: Foto definida.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group photo set successfully}
              success: true
      '400':
        description: |
          `photo` ausente, ou não é base64 válido — é aqui que cai o prefixo
          `data:image/jpeg;base64,`. `error.code = invalid_request` nas duas
          causas; o cliente não as distingue pelo corpo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        description: |
          O WhatsApp recusou a imagem. **A causa medida foi o formato**: PNG
          chega aqui, JPEG passa.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 422
              error:
                code: upstream_rejected
                message: WhatsApp refused this request; repeating it unchanged will not help
              success: false
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/photo/remove:
  post:
    tags: [Grupos]
    summary: Remover a foto de um grupo
    description: |
      Tira a foto do grupo, deixando-o sem imagem. É a mesma operação de
      `POST /group/photo` com conteúdo nulo
      (`group_management.go:174`), exposta como rota própria.

      **Quando usar**: para limpar a identidade visual sem escolher outra
      imagem.

      **Regra que morde**: o campo do grupo é `group_jid`, **todo em
      minúsculas** (`handler_group_mgmt.go:262`), ao contrário do
      `group_jid` das rotas vizinhas. Na prática o descodificador do Go casa
      nomes ignorando maiúsculas e as duas grafias funcionam; o exemplo traz
      a que foi medida.

      **O manipulador não valida campo nenhum**: um pedido sem grupo chega à
      resolução do JID e falha lá, com `invalid_jid` no envelope novo.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoRemoverFotoGrupo'
          example:
            group_jid: 120363411669320145@g.us
    responses:
      '200':
        description: Foto removida.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group photo removed successfully}
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/requestparticipants:
  get:
    tags: [Grupos]
    summary: Listar os pedidos de entrada pendentes de um grupo
    description: |
      Devolve quem pediu para entrar no grupo e ainda espera decisão. Só tem
      conteúdo em grupos com `IsJoinApprovalRequired` verdadeiro — nos outros
      devolve lista vazia, porque quem segue o link entra directamente.

      **É um `GET` que lê o CORPO JSON.** Serve-se bem com `curl -X GET -d`,
      mas quebra clientes e intermediários que assumem que um `GET` não tem
      corpo — muitos descartam-no em silêncio.

      **Medido, e é a saída para esse problema**: os parâmetros de query
      `?group_jid=` e `?chat=` funcionam igualmente
      (`handler_group.go:52-62`), e devolveram `200` nas três formas.
      **Prefira a query string**; o corpo existe por compatibilidade.

      **Regras**: sem grupo por nenhuma das três vias, a recusa é `400`, mas o
      CÓDIGO depende de haver corpo — e o que aparece mais é o enganador:

      | pedido | resposta medida |
      |---|---|
      | sem corpo e sem query | `400 could_not_decode_payload` — a causa real é o grupo em falta, não o corpo |
      | corpo `{}` | `400 missing_group_jid` — a mensagem certa |
      | corpo `{"group_jid":null}` | `400 missing_group_jid` |
      | corpo que não é JSON, com `?group_jid=` | `200` — o erro de descodificação é PERDOADO quando a query traz o grupo (`handler_group.go:47-63`) |

      Ou seja: o `curl` sem `-d` — que é o `GET` normal de qualquer cliente —
      é exactamente o caso que devolve a mensagem que não descreve a causa.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: query
        required: false
        description: |
          JID do grupo. É a forma recomendada. Usada só quando o corpo não
          trouxe `group_jid`.
        schema:
          type: string
          example: 120363411669320145@g.us
      - name: chat
        in: query
        required: false
        description: |
          Nome universal do destino. Usado só quando nem o corpo nem
          `group_jid` trouxeram o grupo.
        schema:
          type: string
          example: 120363411669320145@g.us
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoSolicitacoesEntrada'
          example:
            group_jid: 120363411669320145@g.us
    responses:
      '200':
        description: |
          Os pedidos pendentes. **Medido em três chamadas, e as três
          devolveram `[]`** — os grupos disponíveis não exigiam aprovação,
          logo a forma de uma entrada preenchida não foi observada com dados
          e vem do tipo do protocolo.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/SolicitacaoEntrada'
            example:
              code: 200
              data: []
              success: true
      '400':
        description: |
          Grupo ausente nas três vias. Com corpo JSON presente a mensagem é
          `missing_group_jid`; **sem corpo nenhum é `could_not_decode_payload`**,
          que não descreve a causa real — medido.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: could_not_decode_payload
                message: could not decode payload
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/groups/{group_jid}/topic:
  put:
    tags: [Grupos]
    summary: Mudar a descrição de um grupo
    description: |
      Define a descrição (tópico) do grupo. Aparece em
      `GET /groups/{group_jid}` como `Topic`, com `TopicSetAt` e `TopicSetBy`.

      **Detalhe do protocolo que a resposta revela**: a descrição VIAJA como
      mensagem — por isso `TopicID` tem a forma de um `message_id`, e por
      isso a mudança aparece no grupo como evento de sistema.

      **Quando usar**: para deixar escrito no grupo o que ele é, sem depender
      de alguém repetir a regra.

      **Regras**: `topic` é obrigatório e vazio é recusado — **não há forma
      de APAGAR a descrição por esta rota**. É o único campo validado
      (`handler_group_mgmt.go:220`): sem `group_jid` a falha vem adiante, como
      `invalid_jid`. Num grupo com `IsLocked` verdadeiro, só administradores
      conseguem.

      **Formato do erro `400` de campo em falta**: objecto canónico,
      `error.code = invalid_request`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - name: group_jid
        in: path
        required: true
        description: |
          JID do grupo, no servidor `@g.us`. Substitui o campo `groupJID` do
          corpo — se ambos vierem, o **corpo ganha**.
        schema: {type: string, example: 120363411669320145@g.us}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoTopicoGrupo'
          example:
            group_jid: 120363411669320145@g.us
            topic: Combinações de rota do turno da manhã
    responses:
      '200':
        description: Descrição alterada.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group topic set successfully}
              success: true
      '400':
        description: |
          `topic` ausente ou vazio. `error.code = invalid_request`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_request
                message: Requisição inválida.
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/updateparticipants:
  post:
    tags: [Grupos]
    summary: Adicionar ou remover participantes de um grupo
    description: |
      Adiciona ou remove membros, vários de uma vez.

      **Limitação medida, e documentada aqui em vez de escondida (F263)**:
      `Action` aceita **só `add` e `remove`**
      (`group_management.go:272-281`). `promote` e `demote` devolvem
      `400 invalid_action` — `unknown participant action "promote" (must be
      "add" or "remove")`.

      A biblioteca por baixo sabe promover e despromover há anos
      (`internal/wa-noise/capabilities/group/participants.go:18-19`); é a
      rota que não o expõe. **A consequência é concreta: por esta API não há
      forma de dar nem de tirar administrador a ninguém.** Não há rota
      alternativa.

      **Quando usar**: para gerir o quadro de membros. Para decidir pedidos
      de entrada pendentes, a rota é
      `POST /group/updaterequestparticipants`, e o vocabulário lá é outro
      (`approve`/`reject`).

      **Regras e a ORDEM em que são aplicadas**, que muda a mensagem de erro:
      primeiro `phone` não vazio, depois cada entrada de `phone` não vazia,
      depois `action`, e **só então** `group_jid`
      (`handler_group_mgmt.go:289-304`). Um pedido a que falte tudo queixa-se
      dos telefones.

      `phone` aceita o **número nu** (`554192421234`) — medido a passar da
      validação. É uma diferença face a
      `POST /group/updaterequestparticipants`, que exige o JID completo.

      **Dois formatos de erro na mesma rota, e os dois são o objecto
      canónico**: as recusas de campo em falta usam `rejectMissingField` e
      saem com `error.code = invalid_request` (nenhuma delas tem código
      próprio); `invalid_action` e `invalid_jid`, que atravessam o use case,
      saem com o seu próprio `error.code`.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoAtualizarParticipantes'
          example:
            group_jid: 120363411669320145@g.us
            phone: [554192421234@s.whatsapp.net]
            action: add
    responses:
      '200':
        description: |
          A mudança foi enviada e o WhatsApp devolveu a lista resultante.
          Participante que tenha falhado individualmente volta em
          `participants` — ver `ParticipanteGrupoCanonico` sobre o que
          representa uma falha parcial na forma canónica — e o `200` cobre o
          sucesso parcial.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoAtualizarParticipantes'
            example:
              code: 200
              data:
                details: Participants updated
                confirmed: true
                reason: ''
                participants:
                  - jid: 90937376170214@lid
                    phone_number: 554192421234@s.whatsapp.net
                    lid: 90937376170214@lid
                    display_name: ''
                    is_admin: false
                    is_super_admin: false
              success: true
      '400':
        description: |
          **Dois formatos possíveis, os dois com o objecto canónico.**

          `phone` vazio, entrada vazia na lista, `action` ausente ou
          `group_jid` ausente saem de `rejectMissingField`, sem código
          próprio: `error.code = invalid_request`.

          `action` desconhecido — incluindo `promote` e `demote` — e JID
          irresolúvel atravessam o use case e saem com o `error.code`
          específico, como o exemplo abaixo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            examples:
              acaoDesconhecida:
                summary: action inválido, com código próprio
                description: |
                  `promote` e `demote` caem aqui: a biblioteca sabe fazê-los,
                  a rota não os expõe (F263). Recusa do use case, com
                  `error.code` específico.
                value:
                  code: 400
                  error:
                    code: invalid_action
                    message: unknown participant action "promote" (must be "add" or "remove")
                  success: false
              campoObrigatorioEmFalta:
                summary: campo obrigatório ausente, sem código próprio
                description: |
                  `phone` vazio, `action` ausente ou `group_jid` ausente
                  passam por `rejectMissingField`, que não usa a taxonomia de
                  erro — `error.code` fica no genérico `invalid_request`.
                value:
                  code: 400
                  error:
                    code: invalid_request
                    message: Requisição inválida.
                  success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        $ref: '#/components/responses/RecusadoPeloWhatsApp'
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/group/updaterequestparticipants:
  post:
    tags: [Grupos]
    summary: Aprovar ou rejeitar pedidos de entrada num grupo
    description: |
      Decide os pedidos pendentes listados por
      `GET /group/requestparticipants`. É a contrapartida de
      `POST /group/joinapprovalmode`: sem a exigência de aprovação ligada,
      não há o que decidir.

      **Quando usar**: depois de ler os pendentes, para deixar entrar (ou
      não) quem seguiu o link.

      **Regra que morde, medida**: `Phone` exige o **JID COMPLETO**. O número
      nu `554192421234` devolve `400 invalid_phone`, porque este use case
      resolve com `ResolveQualifiedJID` e não com `ResolveJID`
      (`group_request.go:100`). **É uma divergência face a
      `POST /group/updateparticipants`**, que aceita o número nu — as duas
      rotas recebem uma lista chamada `phone` e só uma tolera a forma curta.

      **Vocabulário próprio**: `action` é `approve` ou `reject` — e não
      `add`/`remove`, que é o da outra rota. Qualquer outro valor devolve
      `400 invalid_action` (medido).

      **Erros**: `missing_group_jid`, `missing_phone`, `missing_action`,
      `invalid_group_jid`, `invalid_phone`, `invalid_action`, `no_session` —
      todos no envelope NOVO. Esta rota não passa por `rejectMissingField`.

      **Desfecho parcial**: o adaptador faz uma chamada por solicitante. Se
      algum falhar, a rota devolve erro — não há corpo que relate quais
      passaram. **E não é por o WhatsApp não dizer**: ele devolve
      `[]types.GroupParticipant` com um `Error` por solicitante, e o adaptador
      descarta esse valor (`adapters/group/participants.go:81`). A rota irmã
      `POST /groups/{group_jid}/participants` expõe a mesma lista. É a F280.

      **Como se observa o efeito**: por `GET /groups/{group_jid}/join-requests`, lido
      **antes e depois** — a decisão retira o solicitante da fila —, e por
      `POST /groups/info`, onde um aprovado passa a constar de `Participants`.
      Um `200` contra fila VAZIA não prova nada, e foi essa a medição de
      2026-08-26. A fila enche-se só por API: entrar por link num grupo com
      aprovação exigida cria um pendente
      (`capabilities/group/invite.go:117`). Procedimento em `HUMAN-LAST.md` C.1.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoDecidirSolicitacoes'
          example:
            group_jid: 120363411669320145@g.us
            phone: [554192421234@s.whatsapp.net]
            action: approve
    responses:
      '200':
        description: Os pedidos foram decididos.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data: {details: Group request participants updated successfully}
              success: true
      '400':
        description: |
          Campo em falta, JID de grupo irresolúvel, telefone em forma curta
          (`invalid_phone`), ou `Action` fora de `approve`/`reject`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_phone
                message: could not parse Phone
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'
