# Grupo: Contactos e utilizadores (14 rotas /user/*) + Status (3 rotas
# /status/set/*).
#
# As respostas de leitura foram MEDIDAS contra o servidor vivo em 2026-08-26
# pela sessão `filarapida`. As rotas de escrita não foram chamadas, e as suas
# respostas vêm do código — cada uma diz isso na descrição.

# =============================================================== contactos

/user/check:
  post:
    tags: [Contactos e utilizadores]
    summary: Verificar se números têm WhatsApp
    description: |
      Pergunta ao WhatsApp, em lote, quais dos números dados têm conta, e
      devolve o JID resolvido de cada um.

      **Quando usar**: antes de enviar para um número que veio de um
      formulário ou de uma importação de agenda. É a forma barata de
      descobrir que um número não existe, em vez de o descobrir num envio
      falhado.

      **Regras**: `phone` é sempre um ARRAY, mesmo para um número só. O valor
      pode ir NU (`554192421234`) — foi assim que foi medido — ou como JID
      completo, e nesse caso `query` volta com o JID. Um número sem conta
      devolve `is_in_whatsapp: false` dentro de um `200`: **não é erro**, é a
      resposta.

      **A rota responde `200` a um pedido que não pede nada.** `phone` está
      declarado obrigatório, mas não há `minItems` e as quatro formas de vazio
      passam — medido em 2026-08-26:

      | corpo | resposta |
      |---|---|
      | `{}` | `200 {"data":null}` |
      | `{"phone":null}` | `200 {"data":null}` |
      | `{"phone":[]}` | `200 {"data":null}` |
      | `{"phone":[""]}` | `200 {"data":null}` |
      | `{"phone":["   "]}` | `200 {"data":null}` |
      | `{"phone":["nao-e-numero"]}` | `200 {"data":null}` |
      | `{"phone":"554192421234"}` | `400 could_not_decode_payload` |

      E repare que **`data: null` não é `data: []`**: quem iterar sobre a
      resposta sem verificar nulidade parte. A causa está no caso de uso, que
      acumula em `var results []CheckUserResult` e devolve a fatia nil
      (`check_user.go:44-54`).

      **A resposta NÃO é posicional.** Item inválido é descartado em silêncio e
      duplicados são colapsados: medido, `["554192421234",""]` devolve UMA
      entrada e `["554192421234","554192421234"]` também. Case sempre pelo
      campo `query`, nunca pelo índice do array que enviou.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoVerificacaoNumero'
          example:
            phone: ['554192421234']
    responses:
      '200':
        description: Uma entrada por número consultado, em `data.users`.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required: [users]
                      properties:
                        users:
                          type: array
                          description: |
                            Uma entrada por número que o servidor reconheceu.
                            Sempre presente; `[]` (nunca `null`) quando nenhum
                            produziu entrada.

                            **`data` passou a ser um OBJECTO com `users`
                            dentro, na migração de DTO de 2026-08-27** — era o
                            array directamente. O embrulho é onde um `meta` de
                            paginação caberia sem mexer nos campos existentes,
                            e alinha esta rota com `POST /user/info`.
                          items:
                            $ref: '#/components/schemas/ResultadoVerificacaoNumero'
            example:
              code: 200
              data:
                users:
                  - query: '554192421234'
                    is_in_whatsapp: true
                    jid: 554192421234@s.whatsapp.net
                    verified_name: ''
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/info:
  post:
    tags: [Contactos e utilizadores]
    summary: Consultar aparelhos, recado e identidade de contas
    description: |
      Devolve, por JID consultado, os aparelhos ligados àquela conta, o recado
      do perfil, o identificador da foto e o LID correspondente.

      **Quando usar**: quando é preciso saber em quantos aparelhos uma conta
      está, ou obter o LID de um número sem depender do mapeamento local que
      `GET /user/lid/{jid}` consulta.

      **Regras**: `phone` é um ARRAY. O manipulador acrescenta
      `@s.whatsapp.net` a todo valor sem `@` antes de resolver
      (`handler_user.go:normalizePhones`), pelo que número nu e JID completo
      funcionam os dois.

      **Não confunda com `POST /user/check`**: lá o valor viaja como NÚMERO NU
      e é o WhatsApp que resolve; aqui ele é convertido num JID COMPLETO antes
      de qualquer consulta. A mesma entrada tem destinos diferentes nas duas
      rotas, e é isso que produz a ressalva seguinte.

      **RESSALVA MEDIDA em 2026-08-26, que corrige o que aqui se dizia antes**:
      um valor que não é número **não** é "saltado em silêncio". Depois de
      `normalizePhones` ele contém `@`, logo passa o parser, e a consulta ao
      WhatsApp não resolve. Observado:

      - `{"phone":["nao-e-numero"]}` → `500` na primeira chamada e, nas
        repetições, **nenhuma resposta em 45 s**;
      - `{"phone":["   "]}` → **nenhuma resposta em 25 s**;
      - `{"phone":["554192421234","nao-e-numero"]}` → **nenhuma resposta em
        25 s**: uma entrada má leva consigo as boas do mesmo lote.

      O servidor continua saudável durante isto — é o pedido que não termina.
      Sanitize as entradas antes de chamar e prefira lotes pequenos: a resposta
      não diz qual entrada envenenou o pedido, porque não há resposta.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoInfoUtilizadores'
          example:
            phone: ['554192421234@s.whatsapp.net']
    responses:
      '200':
        description: Bloco `users`, um elemento por JID consultado.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/InfoUtilizadores'
            example:
              code: 200
              data:
                users:
                  - jid: 554192421234@s.whatsapp.net
                    lid: 90937376170214@lid
                    status: ''
                    picture_id: ''
                    verified_name: ''
                    devices:
                      - 554192421234@s.whatsapp.net
                      - 554192421234:41@s.whatsapp.net
                      - 554192421234:76@s.whatsapp.net
                    push_name: ''
                    business_name: ''
              success: true
      '400':
        $ref: '#/components/responses/CorpoInvalido'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/contacts:
  get:
    tags: [Contactos e utilizadores]
    summary: Listar o roster inteiro da conta
    description: |
      Devolve todos os contactos que a sessão conhece, num objecto indexado
      por JID.

      **Quando usar**: para construir uma agenda local, ou para dar nome a
      JIDs que chegam em eventos. Não há paginação — vem tudo de uma vez.

      **Regra que muda o que se faz com isto**: as chaves MISTURAM espaços de
      identidade, e a proporção varia por conta. Medido em 2026-08-26 — e isto
      **corrige** a medição anterior, que afirmava que a totalidade das chaves
      vinha em `@lid`:

      | conta | total | `@lid` | `@s.whatsapp.net` | `@bot` |
      |---|---:|---:|---:|---:|
      | Business (`filarapida`) | 461 | 232 | 229 | 0 |
      | pessoal (`lucas`) | 3456 | 2524 | 931 | 1 |

      Não se pode assumir nem um espaço nem o outro. Quem quiser casar isto com
      uma agenda por telefone tem de resolver cada `@lid` —
      `GET /user/profile/{jid}` faz a tradução nos dois sentidos. O `@bot` é um
      terceiro espaço (medido: `867051314767696@bot`, `push_name: "Meta AI"`) e
      não é contacto humano.

      **Segunda ressalva medida**: `full_name` costuma vir VAZIO e o nome real
      está em `push_name`. Numa conta WhatsApp Business, apenas **1** dos 461
      contactos tinha `full_name`, contra 460 com `push_name`. Um cliente que
      leia apenas `full_name` vê uma agenda sem nomes.

      **Terceira ressalva medida**: numa conta com muitos grupos, **2175 dos
      3456 contactos não têm nome nenhum** — nem `full_name`, nem `push_name`,
      nem `business_name`, nem `first_name`. Para 2199 deles havia
      `RedactedPhone`, que a migração de DTO removeu (ver `ContactoDoRoster`)
      (`+55∙∙∙∙∙∙∙∙45`), que é apresentável mas não serve para enviar mensagem.

      **Tamanho**: 61 459 bytes para 461 contactos, 498 688 para 3456. Não há
      paginação e não há tecto.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    responses:
      '200':
        description: O roster inteiro, indexado por JID.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Roster'
            example:
              code: 200
              data:
                90937376170214@lid:
                  contacts:
                    - jid: 90937376170214@lid
                      phone_number: ''
                      lid: 90937376170214@lid
                      found: true
                      first_name: ''
                      full_name: ''
                      push_name: Janio Gonzalez
                      business_name: ''
                      is_business: false
                  count: 1
              success: true
      '400':
        $ref: '#/components/responses/SemSessao'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/contacts/last-activity:
  get:
    tags: [Contactos e utilizadores]
    summary: Consultar o instante da última mensagem de cada conversa
    description: |
      Devolve, por JID, o instante da mensagem mais recente daquela conversa.

      **De onde vem o dado**: do histórico LOCAL — o `HistorySync` que chega
      depois do pareamento, mais as mensagens correntes. **Não** é uma
      consulta ao WhatsApp, e por isso responde depressa e não depende de a
      sessão estar ligada.

      **Quando usar**: para ordenar uma lista de conversas por actividade sem
      pedir o histórico de cada uma.

      **Regras**: as chaves são normalizadas para o espaço LID quando o
      mapeamento é conhecido, de propósito, para casarem com as de
      `GET /user/contacts` — sem isso os dois lados vivem em espaços de
      identidade diferentes e quase nada casa (medido: 0 de 1141 contactos
      casavam por telefone). Um número sem LID conhecido mantém a chave em
      `@s.whatsapp.net`, e grupos aparecem em `@g.us`. Quando a sessão está
      em espera, a normalização é saltada e o dado sai cru — **degrada, não
      falha**.

      **O mapa não traz só contactos.** Medido, 384 chaves numa conta: 379
      `@lid`, 3 `@g.us`, 1 `@s.whatsapp.net`, 1 `status@broadcast` — mais a
      chave `0@s.whatsapp.net`, que é a conta oficial do WhatsApp. Grupos e
      difusões entram de propósito; filtrar é de quem chama.

      **Fuso**: os carimbos vêm em RFC 3339 no fuso LOCAL do servidor, não em
      UTC — medido `2026-08-24T18:56:53.836029-04:00`.

      **Descarte silencioso**: uma linha cujo carimbo não parseia é SALTADA,
      com aviso no log e sem sinal na resposta
      (`pkg/infra/db/message_history.go:143-148`). Uma conversa em falta aqui
      não significa necessariamente ausência de mensagens.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    responses:
      '200':
        description: Instante da última mensagem, por JID de conversa.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UltimaAtividadePorConversa'
            example:
              code: 200
              data:
                90937376170214@lid: '2026-08-24T18:56:53.836029-04:00'
                554192421234@s.whatsapp.net: '2026-08-24T18:56:53.796034-04:00'
              success: true
      '400':
        $ref: '#/components/responses/SemSessao'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/avatar:
  post:
    tags: [Contactos e utilizadores]
    summary: Obter a foto de perfil de um contacto
    description: |
      **Esta rota LÊ.** Apesar do método `POST` e do nome, ela não altera a
      foto de conta nenhuma: devolve o URL da foto de perfil do contacto
      indicado (`GetAvatarUseCase`, `pkg/application/usecase/user/get_avatar.go`).
      O `POST` existe só porque o alvo vai no corpo.

      **Quando usar**: para mostrar a foto de um contacto. A imagem NÃO vem no
      corpo — vem o URL, temporário e assinado pelo WhatsApp, e é dele que se
      baixa.

      **Regras**: `phone` é obrigatório e aceita número nu, JID de telefone ou
      LID. `preview: true` devolve a miniatura; o padrão é a imagem em tamanho
      cheio.

      **As duas recusas que não são falhas**, e que são distintas de propósito:
      `404` quando o contacto **não tem** foto pública, e `403` quando **tem**
      mas a escondeu por privacidade. A diferença importa: a primeira não muda
      se se voltar a tentar, a segunda muda se a pessoa mudar a definição.

      **Ressalva de formato**: nessas duas respostas o campo `error` é uma
      STRING (`"not found"`, `"forbidden"`) e não o objecto `{code,message}` —
      os sentinelas de avatar não passam pela taxonomia `apperr`. É o mesmo
      desvio catalogado como F266. Medido.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoAvatar'
          example:
            phone: 554192421234@s.whatsapp.net
            preview: true
    responses:
      '200':
        description: Ponteiro para a foto. A imagem baixa-se do `url`.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Avatar'
            example:
              code: 200
              data:
                id: '1735689600'
                url: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg
              success: true
      '400':
        description: |
          `phone` ausente (`missing_phone`), corpo ilegível
          (`could_not_decode_payload`), identificador que não parseia
          (`invalid_phone`) ou sessão inexistente (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_phone
                message: missing Phone in Payload
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '403':
        description: |
          O contacto TEM foto, mas escondeu-a por privacidade. Medido — e
          repare no `error` em string, não no objecto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 403
              error:
                code: forbidden
                message: Operação não permitida.
              success: false
      '404':
        description: |
          O contacto não tem foto de perfil pública. É o caso comum, não uma
          falha do servidor. `error` em string, como no `403`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 404
              error:
                code: not_found
                message: Recurso não encontrado.
              success: false
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/profile/{jid}:
  get:
    tags: [Contactos e utilizadores]
    summary: Reunir num pedido só tudo o que se sabe de um contacto
    description: |
      Junta identidades (número e LID), presença na rede, aparelhos, recado e
      foto de perfil, a partir de QUALQUER uma das identidades do contacto.

      **Quando usar**: quando se recebe um `@lid` de um evento e se quer o
      perfil sem saber de antemão qual endpoint chamar. É a rota que dispensa
      o cliente de encadear `/user/lid`, `/user/info` e `/user/avatar`.

      **Regras**: o identificador vai no CAMINHO e aceita número nu, JID de
      telefone ou LID — a resolução é leniente e aplica o servidor por omissão
      quando falta o `@`. Uma cadeia que não é nem número (7 a 20 dígitos) nem
      contém `@` é recusada com `invalid_jid` antes de chegar ao WhatsApp
      (F238, onde uma cadeia de lixo provocava um `500`).

      **A regra que muda o cliente**: cada peça do perfil é obtida
      separadamente e **degrada em vez de falhar**. O que não se conseguiu
      obter aparece em `unavailable`, com o motivo, e o pedido devolve `200`
      na mesma. Por isso `on_whatsapp` é `null` quando a pergunta não pôde ser
      feita — `null` e `false` significam coisas diferentes aqui.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - $ref: '#/components/parameters/JidNoCaminho'
    responses:
      '200':
        description: |
          O perfil consolidado. Medido: o exemplo abaixo é uma resposta real,
          com a foto indisponível por privacidade e o resto obtido.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PerfilUtilizador'
            example:
              code: 200
              data:
                jid: 554192421234@s.whatsapp.net
                lid: 90937376170214@lid
                query: 554192421234@s.whatsapp.net
                on_whatsapp: true
                verified_name: ''
                avatar_url: ''
                avatar_id: ''
                user_info:
                  - jid: 554192421234@s.whatsapp.net
                    lid: 90937376170214@lid
                    status: ''
                    picture_id: ''
                    verified_name: ''
                    devices:
                      - 554192421234@s.whatsapp.net
                      - 554192421234:41@s.whatsapp.net
                    push_name: ''
                    business_name: ''
                unavailable:
                  avatar: avatar hidden by privacy settings
              success: true
      '400':
        description: |
          Identificador ausente no caminho (`missing_jid`), identificador que
          não é nem número nem JID (`invalid_jid`), ou sessão inexistente
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_jid
                message: jid must be a phone number or a qualified JID (user@server)
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/lid/{jid}:
  get:
    tags: [Contactos e utilizadores]
    summary: Resolver o LID de um número
    description: |
      Devolve o identificador de privacidade (`@lid`) correspondente a um
      número, consultando o mapeamento que a sessão mantém localmente.

      **Quando usar**: quando se tem um número e se precisa do LID para casar
      com dados que vêm em espaço LID — o roster de `GET /user/contacts`, por
      exemplo.

      **Regras**: a rota resolve o LID **DE** um número, logo o caminho tem de
      trazer um JID `@s.whatsapp.net` COMPLETO. Passar um `@lid` é recusado com
      `jid_not_pn` e `400` — não é falha nossa, é o pedido invertido (F182;
      antes disto o mesmo caso dava `500`).

      **Assimetria medida face a `GET /user/profile/{jid}`**: aquela rota
      aceita número nu, esta **não**. Medido:
      `GET /user/lid/554192421234` devolve `400 invalid_jid`, e só
      `GET /user/lid/554192421234@s.whatsapp.net` funciona. Um cliente que use
      o mesmo valor nas duas rotas parte numa delas.

      **A distinção entre `404` e `500`**: quando o mapeamento simplesmente
      não existe, a resposta é `404 lid_not_found`. Quando o armazenamento
      falha, é `500` — de propósito, porque nesse caso o cliente NÃO sabe se
      aquele número tem LID, e dizer-lhe "não encontrado" fá-lo-ia parar de
      tentar diante de uma falha passageira.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    parameters:
      - $ref: '#/components/parameters/JidNoCaminho'
    responses:
      '200':
        description: O par número/LID. Medido.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResolucaoLID'
            example:
              code: 200
              data:
                jid: 554192421234@s.whatsapp.net
                lid: 90937376170214@lid
              success: true
      '400':
        description: |
          Identificador ausente (`missing_jid`), mal formado (`invalid_jid`),
          em LID quando devia ser número (`jid_not_pn`), ou sessão inexistente
          (`no_session`). O exemplo abaixo é a resposta medida ao passar um
          `@lid`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: jid_not_pn
                message: 'this route resolves the LID OF a phone number: pass a @s.whatsapp.net jid, not @lid'
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '404':
        description: Não há LID conhecido para este número.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 404
              error:
                code: lid_not_found
                message: LID not found for this number
              success: false
      '500':
        $ref: '#/components/responses/ErroInterno'

# ================================================================= bloqueio

/user/blocklist:
  get:
    tags: [Contactos e utilizadores]
    summary: Listar os contactos bloqueados
    description: |
      Devolve os JIDs bloqueados pela conta, com o hash com que o WhatsApp
      versiona a lista.

      **Quando usar**: para saber, antes de enviar, se um destino está
      bloqueado; e para detectar mudanças na lista comparando o `dhash` em
      vez de percorrer as entradas.

      **Ressalva de formato, resolvida**: esta ERA a única rota do grupo que
      não usava o envelope comum. O manipulador serializava o resultado e
      escrevia-o directamente, portanto a resposta medida a 2026-08-26 era
      `{"Blocklist":[…],"DHash":"…"}` — sem `code`, sem `data`, sem `success`,
      e um cliente que lesse `data` encontrava `undefined`.

      **A excepção acabou na migração de DTO de 2026-08-27**: a rota passa por
      `RespondJSON` como todas as outras, e o corpo abaixo é o de `data`. As
      duas chaves mudaram de nome junto — `blocklist` e `dhash`.

      **Contraste com a escrita**: até 2026-08-27/28 esta LEITURA era a única
      que funcionava — as duas rotas que alteram a lista (`POST /user/block`
      e `POST /user/unblock`) estavam recusadas pelo servidor. As duas foram
      corrigidas (F264, F278) — ver a descrição delas.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    responses:
      '200':
        description: |
          A lista de bloqueados. Medido: numa conta sem bloqueios, `blocklist`
          vem como array vazio.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ListaBloqueados'
            example:
              code: 200
              data:
                blocklist: []
                dhash: '1787412261963655'
              success: true
      '400':
        $ref: '#/components/responses/SemSessao'
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/block:
  post:
    tags: [Contactos e utilizadores]
    summary: Bloquear um contacto
    description: |
      Acrescenta um contacto à lista de bloqueados da conta.

      **CORRIGIDO em 2026-08-28 (F264/LIB-02).** Medida em 2026-08-26 em
      quatro combinações — conta WhatsApp Business e conta pessoal, número
      real e número inexistente, identificador em número e em LID — e as
      quatro devolviam `422 upstream_rejected`, com
      `info query returned status 400: bad-request` no log. Causa
      determinada: o WhatsApp migrou a escrita da blocklist para
      endereçamento por **LID**, e um `block` exige, além do `jid` em LID,
      um segundo atributo `pn_jid` com o número de telefone — que a
      biblioteca vendorizada não emitia (portado de whatsmeow `8d023aa973`
      e Baileys `8ca9316a10`). Medido ao vivo depois da correção: `200`,
      com o contacto a aparecer em `GET /user/blocklist` logo a seguir.

      **Regras**: basta um de `jid` ou `phone`, com `jid` a ganhar quando os
      dois vierem. A resolução é LENIENTE por decisão registada (F203): um
      número nu é aceite.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoBloqueio'
          example:
            phone: 554192421234@s.whatsapp.net
    responses:
      '200':
        description: |
          Bloqueio aceite. **Nunca observado em campo** — a forma abaixo vem
          do código (`block_user.go:71-81`), não de medição.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoBloqueio'
            example:
              code: 200
              data:
                details: User blocked
                jid: 554192421234@s.whatsapp.net
                requested_jid: 554192421234@s.whatsapp.net
                blocklist: [554192421234@s.whatsapp.net]
                dhash: '1787412261963655'
              success: true
      '400':
        description: |
          Nem `phone` nem `jid` no corpo (`missing_phone_or_jid`),
          identificador que não parseia (`invalid_phone_or_jid`), corpo
          ilegível (`could_not_decode_payload`) ou sessão inexistente
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_phone_or_jid
                message: missing phone or jid in payload
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        description: |
          O pedido chegou ao WhatsApp e foi recusado; repeti-lo sem mudança
          não ajuda. Até 2026-08-28 (F264) era o que esta rota devolvia
          SEMPRE — causa determinada (protocolo migrado para LID) e
          corrigida nessa data, ver a descrição da rota acima.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 422
              error:
                code: upstream_rejected
                message: WhatsApp refused this request; repeating it unchanged will not help
              success: false
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/unblock:
  post:
    tags: [Contactos e utilizadores]
    summary: Desbloquear um contacto
    description: |
      Retira um contacto da lista de bloqueados da conta.

      **CORRIGIDO em 2026-08-27 (F278/LIB-02)** — antes de `POST
      /user/block`, e por um caminho mais simples: a forma nova de
      `unblock` não leva `pn_jid`, só `jid` em LID, e o adaptador já
      resolvia LID→PN em vez de PN→LID, invertido. Bastou corrigir o
      sentido da resolução, sem tocar na biblioteca vendorizada. As mesmas
      quatro combinações medidas em 2026-08-26 devolviam `422
      upstream_rejected`; medido ao vivo depois da correção: `200`, com o
      contacto a sair de `GET /user/blocklist` logo a seguir.

      **Regras**: basta um de `jid` ou `phone`, com `jid` a ganhar quando os
      dois vierem, e a resolução aceita número nu (F203).

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoBloqueio'
          example:
            phone: 554192421234@s.whatsapp.net
    responses:
      '200':
        description: |
          Desbloqueio aceite. **Nunca observado em campo** — forma derivada do
          código (`unblock_user.go:70-80`).
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResultadoBloqueio'
            example:
              code: 200
              data:
                details: User unblocked
                jid: 554192421234@s.whatsapp.net
                requested_jid: 554192421234@s.whatsapp.net
                blocklist: []
                dhash: '1787412261963655'
              success: true
      '400':
        description: |
          Nem `phone` nem `jid` no corpo (`missing_phone_or_jid`),
          identificador que não parseia (`invalid_phone_or_jid`), corpo
          ilegível (`could_not_decode_payload`) ou sessão inexistente
          (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_phone_or_jid
                message: missing phone or jid in payload
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '422':
        description: |
          O pedido chegou ao WhatsApp e foi recusado. Até 2026-08-27
          (F278) era o que esta rota devolvia SEMPRE — causa determinada
          (o adaptador resolvia LID→PN em vez de PN→LID) e corrigida
          nessa data, ver a descrição da rota acima.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 422
              error:
                code: upstream_rejected
                message: WhatsApp refused this request; repeating it unchanged will not help
              success: false
      '429':
        $ref: '#/components/responses/LimiteDeRitmo'
      '500':
        $ref: '#/components/responses/ErroInterno'

# ================================================================= presença

/user/presence:
  post:
    tags: [Contactos e utilizadores]
    summary: Definir a presença da própria conta
    description: |
      Marca a conta como online ou offline perante o WhatsApp.

      **Quando usar**: ao arrancar um serviço que vai atender conversas
      (`available`), e ao encerrá-lo (`unavailable`). É a conta INTEIRA, não
      uma conversa — para "a escrever…" numa conversa específica existe
      `POST /chat/presence`.

      **Regras**: `type` só aceita `available` e `unavailable`. Qualquer outro
      valor é recusado antes de qualquer chamada — `missing_presence_type` se
      o campo vier ausente, `null` ou `""`; `invalid_presence_type`, com o
      valor recebido na mensagem, se vier fora do conjunto (corrigido em
      2026-08-26: até essa data os dois casos davam o mesmo código)
      ao WhatsApp.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoPresenca'
          example:
            type: available
    responses:
      '200':
        description: Presença enviada ao WhatsApp.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data:
                details: Presence sent
              success: true
      '400':
        description: |
          `type` fora do conjunto (`invalid_presence_type`), corpo ilegível
          (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: invalid_presence_type
                message: "invalid presence type. Allowed values: 'available', 'unavailable'"
              success: false
      '401':
        $ref: '#/components/responses/NaoAutorizado'
      '500':
        $ref: '#/components/responses/ErroInterno'

/user/presence/subscribe:
  post:
    tags: [Contactos e utilizadores]
    summary: Subscrever a presença de um contacto
    description: |
      Pede ao WhatsApp para passar a enviar notificações quando aquele
      contacto fica online ou offline.

      **Quando usar**: quando se quer saber que um contacto ficou disponível
      sem estar a perguntar em ciclo. As notificações chegam depois pelos
      canais de eventos (WebSocket, webhook), **não** nesta resposta.

      **Regras**: `phone` é obrigatório e aceita número nu, JID de telefone ou
      LID. O `200` diz que a subscrição foi pedida — não garante que alguma
      notificação venha a chegar, que depende também da privacidade do
      contacto.

      **Autenticação**: token de sessão.
    security:
      - TokenSessao: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoSubscricaoPresenca'
          example:
            phone: 554192421234@s.whatsapp.net
    responses:
      '200':
        description: Subscrição pedida ao WhatsApp.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Detalhes'
            example:
              code: 200
              data:
                details: Presence subscription updated
              success: true
      '400':
        description: |
          `phone` ausente (`missing_phone`), identificador que não parseia
          (`invalid_phone`), corpo ilegível (`could_not_decode_payload`) ou
          sessão inexistente (`no_session`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Erro'
            example:
              code: 400
              error:
                code: missing_phone
                message: missing Phone in Payload
              success: false
      '401':
