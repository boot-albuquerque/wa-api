# Base da especificação OpenAPI do wa-api.
#
# Este ficheiro traz TUDO o que não é caminho: info, servidores, etiquetas,
# esquemas de segurança e os componentes partilhados. Os caminhos vivem em
# api/openapi/paths/<grupo>.yaml, um ficheiro por família, para que dois
# autores nunca escrevam no mesmo sítio.
#
# O documento servido (api/openapi/openapi.yaml) é GERADO por
# `go run ./cmd/openapidoc`. Não o edite à mão — há teste que o compara.
openapi: 3.0.3

info:
  title: wa-api — API HTTP para WhatsApp
  version: 1.0.6
  description: |
    API HTTP que expõe uma conta de WhatsApp como serviço: enviar e receber
    mensagens, gerir grupos, comunidades e canais, consultar contactos e
    administrar sessões.

    ## Como se autentica

    Quase todas as rotas usam um **token de sessão**, enviado no cabeçalho
    `token`. Cada token identifica uma sessão de WhatsApp já emparelhada — é
    ele que diz *de que conta* a operação parte.

    As rotas sob `/admin` usam outro segredo: o **token de administração**, no
    cabeçalho `Authorization`. Ele governa as sessões (criar, listar, apagar) e
    não pertence a nenhuma conta de WhatsApp. É regerado a cada arranque e fica
    em `<datadir>/admin_token`.

    Três rotas de sonda não pedem credencial nenhuma: `/livez`,
    `/health/live` e `/health/ready`.

    Use o botão **Authorize** aqui em cima para preencher os dois.

    ## O envelope das respostas

    Sucesso e erro têm forma fixa:

    ```json
    { "code": 200, "data": { }, "success": true }
    ```

    ```json
    { "code": 400, "error": { "code": "missing_chat", "message": "missing chat in payload" }, "success": false }
    ```

    `error.code` é estável e legível por máquina; `error.message` é para
    mostrar a uma pessoa.

    **Ressalva medida**: catorze pontos do código ainda respondem com
    `"error"` em texto simples em vez do objecto — as recusas de campo
    obrigatório das rotas de grupo, sobretudo. Está registado como F266 no
    `HOUSEKEEP.md`, e a documentação de cada rota afectada diz.

    ## Campos que a API não conhece

    Um campo que o servidor não reconhece é **ignorado**, e o pedido segue sem
    ele. Isto é herança do decodificador de JSON do Go e vale para toda a API.

    **É mais perigoso do que parece**, e foi medido: um nome mal escrito não
    produz erro — produz o valor zero. Quando o valor zero significa alguma
    coisa, o erro de digitação vira uma escolha silenciosa. O caso real:
    `{"mute": true, "duration": "8h"}` em `/chat/mute` devolve `200` e cala a
    conversa **para sempre**, porque o campo é `mute_duration` e a ausência
    dele significa "para sempre".

    Desde 2026-08-26 o servidor **regista** cada campo desconhecido:

    ```
    WRN unknown field "duration" route=/chat/mute unknown_fields=["duration"] req_id=…
    ```

    E há um modo **estrito**, desligado por omissão, que os recusa:

    ```
    WA_API_STRICT_UNKNOWN_FIELDS=true
    POST /chat/mute {"jid":"…","mute":true,"duration":"8h"}
      -> 400 {"error":{"code":"unknown_field","message":"unknown field \"duration\""}}
    ```

    Está desligado porque ligá-lo recusaria pedidos que hoje funcionam. Se
    integra com esta API, **ligue-o em desenvolvimento**: é a forma mais barata
    de apanhar um nome errado antes de ele chegar a produção.

    ## O campo `chat`

    Toda rota que recebe um destinatário aceita `"chat"` como nome universal do
    campo. O nome antigo e específico da rota (`Phone`, `groupJID`, `jid`…)
    continua a funcionar e **ganha** quando os dois vierem no mesmo pedido.

    ## Identificadores

    - **PN** — o número, em `554192421234@s.whatsapp.net`
    - **LID** — o identificador opaco, em `90937376170214@lid`
    - **grupo** — `120363411669320145@g.us`
    - **canal** — `120363411025775186@newsletter`

    Onde a distinção importa, a descrição da rota diz qual das formas é exigida.

    ## O marcador no título de cada endpoint

    Cada título começa com um símbolo que diz **quanta prova existe de que
    aquela rota funciona** — não o quão bem está documentada. As 137 estão
    documentadas; o que varia é o que foi medido.

    | | significa |
    |---|---|
    | ✅ | chamada real **e** efeito confirmado por observador independente — segunda leitura, transição de estado medida, ou a mensagem vista no cliente |
    | 🟡 | chamada real com resposta de sucesso, **sem** forma de confirmar o efeito |
    | ❌ | chamada real que **falhou**; o erro medido está na descrição da rota |
    | ⬜ | **não executada**, e a descrição diz porquê |

    Medição de 2026-08-28, com as sessões reais `envia`/`recebe`: **129 ✅,
    4 🟡, 4 ❌, 0 ⬜**. As 0 por testar fecham a campanha — todas as 137
    rotas foram executadas pelo menos uma vez. Os 4 🟡 e os 4 ❌ que
    restam têm causa determinada (não são "nunca medidos"): o detalhe
    rota a rota está em `docs/OPENAPI-EVIDENCIAS.md`.

    **Um 🟡 não é um ✅ mais fraco por descuido** — é a recusa deliberada de
    chamar confirmado aquilo que só devolveu `2xx`.

    ## O que `200` significa, e o que não significa

    Um `200` diz que o WhatsApp aceitou o pedido. **Não** diz que a mensagem
    foi desenhada no ecrã do destinatário, nem que a operação teve efeito
    visível. As rotas em que essa diferença já foi medida trazem a ressalva na
    descrição.

servers:
  - url: http://localhost:8080
    description: Instância local de desenvolvimento

tags:
  - name: Sessões
    description: |
      Ciclo de vida da ligação ao WhatsApp — emparelhar, ligar, desligar, ler o
      QR code e consultar o estado e o perfil da conta ligada.
  - name: Envio de mensagens
    description: |
      Todas as formas de enviar mensagem: texto, mídia, localização, contacto,
      enquete, botões, lista, carrossel, modelo e encaminhamento.
  - name: Conversas
    description: |
      O que se faz *depois* de a mensagem existir — reagir, editar, apagar,
      favoritar, marcar como lida — e a gestão da conversa: arquivar, fixar,
      silenciar, temporizar e listar histórico.
  - name: Descarga de mídia
    description: |
      Recupera o conteúdo binário de uma mensagem de mídia recebida, a partir do
      descritor que veio na própria mensagem.
  - name: Grupos
    description: |
      Criar e administrar grupos: participantes, nome, tópico, foto, links de
      convite, aprovação de entrada e definições de quem pode escrever.
  - name: Comunidades
    description: |
      Comunidades são grupos-pai que agregam sub-grupos. Aqui ligam-se e
      desligam-se grupos, e listam-se sub-grupos e participantes.
  - name: Canais
    description: |
      Canais de difusão (newsletters): criar, seguir, publicar, reagir e gerir
      administradores, incluindo a transferência de posse.
  - name: Status
    description: |
      Publicação de status (as "novidades" de 24 horas), com imagem, vídeo ou
      áudio.
  - name: Contactos e utilizadores
    description: |
      Consulta e gestão de terceiros: verificar se um número tem WhatsApp, ler
      perfis, resolver PN para LID, bloquear, e gerir presença e privacidade.
  - name: Administração
    description: |
      Gestão das sessões do próprio wa-api — criar, listar, actualizar e apagar
      utilizadores. Usa o token de administração, não o token de sessão.
  - name: Integrações e configuração
    description: |
      Webhooks, armazenamento S3, assinatura HMAC, proxy de saída, etiquetas e
      recusa de chamadas.
  - name: Saúde
    description: |
      Sondas de vivacidade e prontidão, para orquestradores e balanceadores.

security:
  - TokenSessao: []

components:
  securitySchemes:
    TokenSessao:
      type: apiKey
      in: header
      name: token
      description: |
        Token da sessão de WhatsApp. Identifica de que conta parte a operação.
        É criado em `POST /admin/users` e não é recuperável depois — se se
        perder, cria-se outra sessão.

        Por compatibilidade, também é aceite como `?token=` na query string,
        mas cada uso emite aviso no log e essa forma será removida.
    TokenAdmin:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token de administração do wa-api, para as rotas `/admin`. É **regerado
        a cada arranque do processo** e fica em `<datadir>/admin_token`.
        Enviado tal e qual, sem o prefixo `Bearer`.

  parameters:
    JidNoCaminho:
      name: jid
      in: path
      required: true
      description: JID do utilizador, em forma PN ou LID.
      schema:
        type: string
        pattern: '^[0-9]+(:[0-9]+)?@(s\.whatsapp\.net|lid)$'
        example: 554192421234@s.whatsapp.net
    IdNoCaminho:
      name: id
      in: path
      required: true
      description: Identificador do recurso, em hexadecimal de 32 caracteres.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
        example: 918e37366f27e1125ee0482a793267e1

  schemas:
    Envelope:
      type: object
      description: Forma comum a toda resposta de sucesso.
      required: [code, success]
      properties:
        code:
          nullable: false
          type: integer
          description: Estado HTTP, repetido no corpo.
          example: 200
        success:
          nullable: false
          type: boolean
          description: Sempre `true` em sucesso. Campo legado, será removido.
          example: true
        data:
          description: A carga útil, com forma própria de cada rota.
          nullable: true

    Erro:
      type: object
      description: |
        Forma comum a toda resposta de erro que passa pela taxonomia `apperr`.
      required: [code, error, success]
      properties:
        code:
          nullable: false
          type: integer
          description: Estado HTTP, repetido no corpo.
          example: 400
        success:
          nullable: false
          type: boolean
          enum: [false]
          description: |
            **Sempre presente e sempre `false`** num corpo de erro. Campo
            legado — a forma correcta de detectar erro é o estado HTTP.

            Valor fora do enum não ocorre: é escrito pelo servidor, não lido
            do pedido.
          example: false
        error:
          type: object
          nullable: false
          description: |
            **Sempre presente, e sempre um objecto** — em TODO corpo de erro,
            em TODO estado HTTP, tenha o erro passado ou não pela taxonomia
            `apperr`. Nunca `null`, nunca `{}`, nunca uma string.

            Houve uma segunda forma, com `error` em texto simples, para os
            erros que não passavam pela taxonomia (F266). Ela FOI REMOVIDA: o
            que não tem código próprio recebe agora o código genérico do
            estado (`invalid_request`, `unauthorized`, `not_found`,
            `internal_error`, ...). Ramificar sobre `error.code` é seguro em
            qualquer resposta.
          required: [code, message]
          properties:
            code:
              nullable: false
              type: string
              description: |
                Código estável em `snake_case`. É por aqui que um cliente deve
                decidir o que fazer — a mensagem pode mudar, o código não.
              example: missing_chat
            message:
              nullable: false
              type: string
              description: |
                Descrição legível em pt-BR, segura para mostrar ao utilizador.
                Nunca traz detalhe interno — caminho de ficheiro, consulta SQL
                ou valor de `panic` são descartados por `RespondJSON` e ficam
                só no log. Travado por
                `TestRespondJSONNaoVazaDetalheDeErroInterno`.
              example: missing chat in payload

    ResultadoEnvio:
      type: object
      description: |
        Resposta comum a todas as rotas de envio. `status: "sent"` significa
        que o WhatsApp aceitou a mensagem — não que ela já foi desenhada no
        cliente do destinatário.
      required: [message_id, status]
      properties:
        message_id:
          nullable: false
          type: string
          description: Identificador da mensagem no servidor, para reagir, editar, apagar ou encaminhar depois.
          example: 3EB0A4B2AFD45E625C0917
        timestamp:
          nullable: false
          type: integer
          format: int64
          description: Instante do envio, em segundos desde a época Unix.
          example: 1787747900
        status:
          nullable: false
          type: string
          description: Estado do envio devolvido pelo servidor.
          example: sent

    Detalhes:
      type: object
      description: Confirmação textual de uma operação sem carga útil própria.
      properties:
        details:
          nullable: true
          type: string
          description: |
            Confirmação textual, em **inglês**, gerada pelo servidor.

            **Não é estável**: o texto muda entre operações e não deve ser
            comparado por um cliente. Quem precise de decidir a partir da
            resposta deve usar o estado HTTP.

            Pode vir ausente quando a operação não produz confirmação própria.
          example: Group name set successfully

    SucessoMensagem:
      type: object
      description: Confirmação de uma operação de estado de conversa.
      properties:
        success:
          nullable: false
          type: boolean
          description: |
            **Sempre presente.** `true` quando a operação foi aceite.

            Não confundir com o `success` do envelope: este vive dentro de
            `data` e é do resultado da operação; aquele é do envelope HTTP.
            Nas rotas que usam este esquema os dois aparecem, e valem `true`.
          example: true
        message:
          nullable: false
          type: string
          description: |
            Confirmação textual, em **inglês** (`Chat pinned`, `Chat unmuted`,
            `Message starred`…).

            **Sempre presente, e não é estável**: o texto varia com a operação
            e com o ramo tomado — silenciar e reactivar devolvem palavras
            diferentes. Não o compare num cliente; use o estado HTTP.
          example: Chat pinned

    AlvoConversa:
      type: object
      description: |
        Nome universal do destino. Toda rota que recebe um destinatário o
        aceita; o nome antigo e específico da rota tem precedência quando
        ambos vierem.
      properties:
        chat:
          nullable: false
          type: string
          description: JID de destino — contacto, grupo ou canal.
          example: 554192421234@s.whatsapp.net

    ContextoResposta:
      type: object
      description: Citação — faz a mensagem enviada aparecer como resposta a outra.
      required: [stanza_id, participant]
      properties:
        stanza_id:
          nullable: false
          type: string
          description: "`message_id` da mensagem citada."
          example: 3EB0A4B2AFD45E625C0917
        participant:
          nullable: false
          type: string
          description: JID de quem escreveu a mensagem citada.
          example: 554192421234@s.whatsapp.net
        quoted_text:
          nullable: false
          type: string
          description: Texto da mensagem citada, para o cliente desenhar a pré-visualização.
          example: Bom dia, tudo certo com o pedido?

  responses:
    NaoAutorizado:
      description: |
        Token ausente, inválido ou revogado. Nas rotas `/admin`, significa que
        o cabeçalho `Authorization` não corresponde ao token de administração.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 401
            error:
              code: unauthorized
              message: unauthorized
            success: false

    SemSessao:
      description: |
        O token foi aceite mas não há sessão associada. Acontece quando a
        sessão foi criada e ainda não emparelhada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 400
            error:
              code: missing_session_id
              message: missing session id
            success: false

    CorpoInvalido:
      description: |
        O corpo não é JSON válido, ou um campo veio com o tipo errado — por
        exemplo `{"Body": 123}` onde se espera texto.

        Note que um campo com o NOME errado não cai aqui: é ignorado (e
        registado). Ver "Campos que a API não conhece".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 400
            error:
              code: could_not_decode_payload
              message: could not decode payload
            success: false

    RecusadoPeloWhatsApp:
      description: |
        O pedido foi bem formado e chegou ao WhatsApp, que o recusou. Repetir
        o mesmo pedido não ajuda — algo no estado da conta, nas permissões ou
        no conteúdo tem de mudar primeiro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 422
            error:
              code: upstream_rejected
              message: WhatsApp refused this request; repeating it unchanged will not help
            success: false

    LimiteDeRitmo:
      description: |
        O WhatsApp está a limitar o ritmo desta sessão e recusou o pedido com
        `429` (ou `419`, que o servidor também usa para o mesmo efeito). Não é
        protecção própria deste servidor — é o relais do estrangulamento feito
        pelo WhatsApp.

        **É a única categoria de erro que o cliente deve repetir, sem alterar
        o pedido**, depois de esperar. Todas as outras (`400`, `401`, `403`,
        `404`, `409`, `422`) dizem "o pedido não vai funcionar assim"; esta diz
        "tenta outra vez mais tarde".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 429
            error:
              code: upstream_rate_limited
              message: WhatsApp is rate limiting this session; retry later
            success: false

    ErroInterno:
      description: |
        Falha não classificada, ou tempo esgotado à espera do WhatsApp (o
        limite por pedido é de 30 segundos).

        **`error` vem em TEXTO, não em objecto.** Não há `error.code` num `500`
        genérico: um erro que não passou pela taxonomia `apperr` nunca tem o
        seu texto próprio serializado — `RespondJSON` devolve só o texto do
        estado HTTP. É isso que impede a fuga de caminho de ficheiro, consulta
        SQL ou valor de `panic`, e está travado por
        `TestRespondJSONNaoVazaDetalheDeErroInterno`.

        Um cliente que leia `error.code` aqui recebe `undefined`. Ramifique
        pelo estado HTTP.

        Algumas rotas DEVOLVEM um `500` classificado, com objecto — é o caso de
        `newsletter_failed`. Essas documentam-no na própria resposta, em vez de
        referenciarem esta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: 500
            error:
              code: internal_error
              message: Ocorreu um erro interno.
            success: false
