<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wa-api — sessões</title>
<link rel="stylesheet" href="devui.css">
</head>
<body>
<header>
  <h1>wa-api <small>sessões</small></h1>
  <nav>
    <a href="sessions.html" aria-current="page">Sessões</a>
    <a href="eventos.html">Eventos</a>
    <button id="btn-nova" class="primary">+ Nova sessão</button>
  </nav>
</header>

<main>
  <div id="aviso-admin" class="aviso" hidden></div>
  <div class="grid" id="grid"></div>
</main>

<!-- Criar sessão -->
<dialog id="dlg-nova">
  <form method="dialog" class="corpo">
    <h2>Nova sessão</h2>
    <p class="ajuda">Cria o utilizador na API já inscrito em todos os eventos. O token é
      devolvido pela criação e guardado neste navegador — é a única altura em que a API o expõe.</p>
    <label class="campo"><span>nome</span><input id="nova-nome" autocomplete="off" required></label>
    <label class="campo"><span>token da sessão</span><input id="nova-token" autocomplete="off" spellcheck="false" required></label>
    <label class="campo"><span>token de admin</span><input id="nova-admin" autocomplete="off" spellcheck="false" required></label>
    <div class="rodape">
      <button value="cancel">Cancelar</button>
      <button type="button" class="primary" id="nova-criar">Criar</button>
    </div>
    <div class="resposta" id="nova-resposta" hidden></div>
  </form>
</dialog>

<!-- Operações da sessão: envio e chat -->
<dialog id="dlg-op">
  <form method="dialog" class="corpo">
    <h2 id="op-titulo">Operação</h2>
    <p class="ajuda" id="op-ajuda"></p>
    <div id="op-campos"></div>
    <div class="resposta" id="op-resposta" hidden></div>
    <div class="rodape">
      <button value="cancel">Fechar</button>
      <button type="button" class="primary" id="op-enviar">Executar</button>
    </div>
  </form>
</dialog>

<!-- Menu de operações -->
<dialog id="dlg-menu">
  <form method="dialog" class="corpo">
    <h2 id="menu-titulo">Operações</h2>
    <p class="ajuda" id="menu-ajuda"></p>
    <div class="ops" id="menu-ops"></div>
    <div class="rodape"><button value="cancel">Fechar</button></div>
  </form>
</dialog>

<script type="module" src="sessions.js"></script>
</body>
</html>
