  /chats/send/sticker:
    post:
      description: |
        > **Substitui `POST /chat/send/sticker`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Envia um autocolante.

        **CORRECÇÃO medida a 2026-08-26**: esta descrição afirmava que a imagem
        é "sempre convertida para WebP" pelo servidor. **Não é.** A conversão
        corre em dois ramos apenas — `image/jpeg`, `image/png`, `image/jpg` num,
        `image/gif` e `video/*` no outro; qualquer outro tipo, **incluindo
        `image/webp`**, cai no `default` de `ConvertToWebPSticker`
        (`pkg/infra/media/sticker/exif.go:62`) e sobe **tal e qual**, recebendo
        só o EXIF de pacote. O tipo é decidido por `http.DetectContentType`, que
        reconhece a assinatura WebP.

        **Consequência prática**: um WebP que já vem do chamador **não é
        redimensionado para 512×512**. Se ele não tiver as dimensões que o
        WhatsApp desenha, a rota devolve `200`, a mensagem chega, e o cliente
        mostra uma bolha vazia — foi exactamente isso que a bateria de campo
        mediu. **Para que a conversão corra, envie PNG ou JPEG.** É a F279.

        **Quando usar**: figurinhas. Uma imagem comum enviada por aqui vira
        autocolante — o que muda o tamanho com que é desenhada e retira legenda e
        descarga.

        **Regras**:
        - Transportes: URI de dados (prefixo `data`) ou URL http(s). Teto de
          **16 MB**.
        - Uma entrada que não seja nenhum dos dois transportes segue tal e qual
          para a conversão e é recusada lá, com `400 sticker_processing_failed`.
        - Os campos de pacote (`pack_id`, `pack_name`, `pack_publisher`) e `emojis`
          são metadata e não alteram a imagem.

        **Ressalva medida (2026-08-26)**: a rota devolveu `200` e a mensagem
        chegou, mas com um WebP sintético o cliente desenha uma bolha vazia — pela
        razão acima: aquele WebP nunca foi convertido. A rota está exercitada; o
        autocolante em si **não** está provado.

        **Como se prova, sem olhar para o ecrã**: o autocolante enviado é gravado
        em `message_history` (`adapters/chat/messenger.go:570`), logo
        `GET /chats/history` devolve o descritor em `data_json`, e
        `POST /chats/download/sticker` traz os bytes de volta — que se verificam
        como `RIFF`…`WEBP` de 512×512. Procedimento em `HUMAN-LAST.md` B.1.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone: 554192421234@s.whatsapp.net
              sticker: data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==
            schema:
              $ref: '#/components/schemas/PedidoEnvioAutocolante'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Autocolante convertido, subido e aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                missing_phone:
                  summary: Destino ausente em `phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_sticker:
                  summary: Campo `sticker` vazio
                  value:
                    code: 400
                    error:
                      code: missing_sticker
                      message: missing Sticker in payload
                    success: false
