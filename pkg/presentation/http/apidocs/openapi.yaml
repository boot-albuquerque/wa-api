  /chat/send/list:
    post:
      description: |
        Envia uma mensagem com um botão que abre uma lista de opções agrupadas em
        secções.

        **Quando usar**: mais opções do que caberiam em botões — um cardápio, uma
        lista de serviços, um menu de atendimento.

        **Regras**:
        - Duas formas de entrada: `Sections` (preferida, multi-secção) e `List`
          (legada, lista plana embrulhada numa secção única cujo título vem de
          `TopText`, ou de `Menu` quando `TopText` vem vazio). Quando `Sections`
          vem preenchida, `List` é ignorada.
        - O corpo aceita quatro nomes, nesta ordem: `Desc`, `Body`, `body`,
          `text`. Nenhum preenchido é `400 missing_desc`.
        - `ButtonText` vazio vira `Select`.
        - **Descarte silencioso em duas camadas**: linha sem `title` é descartada;
          secção que fica sem linhas é descartada. Só quando nenhuma secção
          sobrevive é que a rota recusa, com `400 no_valid_sections`. Mandar três
          linhas e receber `200` não garante que chegaram três.
        - O identificador de cada linha é `RowId`, com `RowID`, `rowId` e `rowID`
          como sinónimos; vazios os quatro, o próprio título vira identificador.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              ButtonText: Ver cardápio
              Desc: Escolha um item do cardápio.
              FooterText: Entregas até às 22h
              Phone: 554192421234@s.whatsapp.net
              Sections:
                - rows:
                    - RowId: margherita
                      desc: Molho de tomate, mozzarella e manjericão
                      title: Pizza margherita
                    - RowId: calabresa
                      desc: Calabresa e cebola
                      title: Pizza calabresa
                  title: Pizzas
              TopText: Cardápio de hoje
            schema:
              $ref: '#/components/schemas/PedidoEnvioLista'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            Lista aceite pelo WhatsApp. **Não garante que todas as linhas enviadas
            chegaram** — as sem título foram descartadas em silêncio.
        "400":
          content:
            application/json:
              examples:
                missing_desc:
                  summary: Corpo vazio nos quatro nomes aceites
                  value:
                    code: 400
                    error:
                      code: missing_desc
                      message: missing Desc/Body in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_sections:
                  summary: Nem `Sections` nem `List`
                  value:
                    code: 400
                    error:
                      code: missing_sections
                      message: missing Sections (or List) in payload
                    success: false
                no_valid_sections:
                  summary: Todas as linhas e secções descartadas na normalização
                  value:
                    code: 400
                    error:
                      code: no_valid_sections
                      message: no valid sections/rows found in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma lista de seleção
      tags:
        - Envio de mensagens
  /chat/send/location:
    post:
      description: |
        Envia um ponto no mapa, com rótulo opcional. Não há upload nem busca
        externa — só metadata de protocolo.

        **Quando usar**: partilhar o endereço de uma entrega ou o ponto de
        encontro. É localização ESTÁTICA; partilha em tempo real não é exposta
        por esta API.

        **Regras**:
        - `Latitude` e `Longitude` são obrigatórios, e **zero é valor VÁLIDO**
          (HOUSEKEEP F121). Os campos distinguem "não informado" de "zero": omitir
          é `400 missing_latitude` / `400 missing_longitude`, mandar `0` é aceite —
          é o ponto onde o equador cruza o meridiano de Greenwich.
        - `Name` é opcional e serve só de rótulo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Latitude: -25.4284
              Longitude: -49.2733
              Name: Curitiba
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoEnvioLocalizacao'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Localização aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                invalid_phone:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_phone
                      message: could not parse Phone
                    success: false
                missing_latitude:
                  summary: Campo `Latitude` ausente — note que `0` NÃO cai aqui
                  value:
                    code: 400
                    error:
                      code: missing_latitude
                      message: missing Latitude in payload
                    success: false
                missing_longitude:
                  summary: Campo `Longitude` ausente
                  value:
                    code: 400
                    error:
                      code: missing_longitude
                      message: missing Longitude in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma localização
      tags:
        - Envio de mensagens
  /chat/send/poll:
    post:
      description: |
        Cria uma enquete de escolha ÚNICA na conversa. Para votar numa enquete que
        já existe, use `/chat/send/pollvote`.

        **Quando usar**: recolher uma decisão de um grupo ou de um contacto sem
        pedir resposta em texto livre.

        **Regras**:
        - **O campo de destino chama-se `Group`, e não `Phone`** — mesmo para uma
          enquete enviada a um contacto individual. Medido em 2026-08-26: com
          `Phone` a rota responde `400 missing_group`. O nome universal `chat`
          também funciona.
        - `Header` é a pergunta, e é obrigatório.
        - São precisas **pelo menos duas** opções; menos é
          `400 insufficient_options`.
        - O número de opções selecionáveis é sempre 1 e **não é configurável** por
          esta API.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Group: 120363411669320145@g.us
              Header: Qual o melhor horário para a entrega?
              Options:
                - Manhã
                - Tarde
                - Noite
            schema:
              $ref: '#/components/schemas/PedidoEnvioEnquete'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Enquete aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                insufficient_options:
                  summary: Menos de duas opções
                  value:
                    code: 400
                    error:
                      code: insufficient_options
                      message: at least 2 options are required
                    success: false
                invalid_group:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_group
                      message: could not parse Group
                    success: false
                missing_group:
                  summary: Destino ausente — é o que sai quando se manda `Phone` em vez de `Group`
                  value:
                    code: 400
                    error:
                      code: missing_group
                      message: missing Group in payload
                    success: false
                missing_header:
                  summary: Pergunta vazia
                  value:
                    code: 400
                    error:
                      code: missing_header
                      message: missing Header in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Criar uma enquete
      tags:
        - Envio de mensagens
  /chat/send/pollvote:
    post:
      description: |
        Emite um voto numa enquete já criada. O voto é cifrado com um segredo
        derivado da mensagem de enquete original — por isso a rota pede os quatro
        campos que a identificam, em vez de a procurar no histórico: depender do
        histórico faria a rota falhar em silêncio depois de uma poda.

        **Quando usar**: votar em nome da conta ligada. Para criar a enquete, use
        `/chat/send/poll`.

        **Regras**:
        - `Phone` é a CONVERSA onde a enquete está; `Sender` é quem a CRIOU. São
          campos diferentes e ambos obrigatórios.
        - `Sender` pode vir em PN ou LID: o servidor resolve a forma correcta
          antes de cifrar, preferindo o que o histórico registou e recorrendo ao
          mapeamento PN→LID quando não a tem (HOUSEKEEP F228).
        - `PollMessageTimestamp` a zero conta como ausente.
        - `Options` traz o texto EXACTO das opções votadas.

        **O que `200` significa aqui**: o voto foi DESPACHADO ao servidor do
        WhatsApp. **Não** é confirmação de que foi contabilizado, e a resposta não
        permite distinguir as duas coisas — confirme na interface do WhatsApp.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Options:
                - Manhã
              Phone: 120363411669320145@g.us
              PollMessageId: 3EB0A4B2AFD45E625C0917
              PollMessageTimestamp: 1787748016
              Sender: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoVotoEnquete'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            Voto despachado. Ver a ressalva na descrição: despacho não é
            contabilização.
        "400":
          content:
            application/json:
              examples:
                invalid_sender:
                  summary: '`Sender` não parseia como JID'
                  value:
                    code: 400
                    error:
                      code: invalid_sender
                      message: could not parse Sender
                    success: false
                missing_options:
                  summary: Nenhuma opção votada
                  value:
                    code: 400
                    error:
                      code: missing_options
                      message: at least 1 option is required
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_poll_message_id:
                  summary: Campo `PollMessageId` vazio
                  value:
                    code: 400
                    error:
                      code: missing_poll_message_id
                      message: missing PollMessageId in payload
                    success: false
                missing_poll_message_timestamp:
                  summary: Campo `PollMessageTimestamp` ausente ou zero
                  value:
                    code: 400
                    error:
                      code: missing_poll_message_timestamp
                      message: missing PollMessageTimestamp in payload
                    success: false
                missing_sender:
                  summary: Campo `Sender` vazio
                  value:
                    code: 400
                    error:
                      code: missing_sender
                      message: missing Sender in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Votar numa enquete
      tags:
        - Envio de mensagens
  /chat/send/sticker:
    post:
      description: |
        Envia um autocolante. A imagem recebida é **sempre convertida para WebP**
        pelo servidor; o que sobe ao WhatsApp é o resultado da conversão, nunca
        os bytes de entrada.

        **Quando usar**: figurinhas. Uma imagem comum enviada por aqui vira
        autocolante — o que muda o tamanho com que é desenhada e retira legenda e
        descarga.

        **Regras**:
        - Transportes: URI de dados (prefixo `data`) ou URL http(s). Teto de
          **16 MB**.
        - Uma entrada que não seja nenhum dos dois transportes segue tal e qual
          para a conversão e é recusada lá, com `400 sticker_processing_failed`.
        - Os campos de pacote (`PackId`, `PackName`, `PackPublisher`) e `Emojis`
          são metadata e não alteram a imagem.

        **Ressalva medida (2026-08-26)**: a rota devolveu `200` e a mensagem
        chegou, mas com um WebP sintético o cliente desenha uma bolha vazia. A
        rota está exercitada; o autocolante em si **não** está provado.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
              Sticker: data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==
            schema:
              $ref: '#/components/schemas/PedidoEnvioAutocolante'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Autocolante convertido, subido e aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_sticker:
                  summary: Campo `Sticker` vazio
                  value:
                    code: 400
                    error:
                      code: missing_sticker
                      message: missing Sticker in payload
                    success: false
                sticker_fetch_failed:
                  summary: A URL não pôde ser buscada
                  value:
                    code: 400
                    error:
                      code: sticker_fetch_failed
                      message: failed to fetch sticker from url
                    success: false
                sticker_processing_failed:
                  summary: A entrada não é uma URI de dados que a conversão reconheça
                  value:
                    code: 400
                    error:
                      code: sticker_processing_failed
                      message: failed to process sticker payload
                    success: false
                sticker_too_large:
                  summary: Acima de 16 MB
                  value:
                    code: 400
                    error:
                      code: sticker_too_large
                      message: sticker payload exceeds size limit
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: sticker_conversion_failed
                  message: failed to convert sticker to webp
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falha não classificada, ou falha da conversão para WebP
            (`sticker_conversion_failed`) — que é do nosso lado, e não do payload.
      security:
        - TokenSessao: []
      summary: Enviar um autocolante
      tags:
        - Envio de mensagens
  /chat/send/template:
    post:
      description: |
        Envia um modelo hidratado: corpo, rodapé e até quatro botões de modelo.
        É o formato ANTIGO de mensagem com botões, e tem vocabulário próprio.

        **Quando usar**: quando o cliente do destinatário não desenha o fluxo
        nativo de `/chat/send/buttons`. Para envios novos, prefira aquela rota.

        **Regras — atenção ao vocabulário, que é diferente do de
        `/chat/send/buttons`**:
        - O rótulo do botão é **`DisplayText`**, e não `title`.
        - Os tipos são **`quickreply`, `url` e `call`**, e não `reply`/`cta_url`/
          `cta_call`/`copy`. Um `Type` desconhecido **não** é recusado nem
          descartado: cai em `quickreply`.
        - **Não há validação do conteúdo por tipo**: um botão `url` sem `Url` é
          aceite e produz um botão com destino vazio.
        - `Footer` é **obrigatório** aqui — é a única rota de envio em que o
          rodapé não é opcional. Vazio é `400 missing_footer`.
        - `Buttons` vazio é `400 missing_buttons`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Buttons:
                - DisplayText: Abrir pedido
                  Type: url
                  Url: https://exemplo.com/pedido/1234
                - DisplayText: Ligar para a loja
                  PhoneNumber: "+554192421234"
                  Type: call
                - DisplayText: Já retirei
                  Id: "1"
                  Type: quickreply
              Content: O seu pedido 1234 está pronto para retirada.
              Footer: DisparaZap
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoEnvioModelo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Modelo aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                missing_buttons:
                  summary: Lista de botões vazia
                  value:
                    code: 400
                    error:
                      code: missing_buttons
                      message: missing Buttons in payload
                    success: false
                missing_content:
                  summary: Campo `Content` vazio
                  value:
                    code: 400
                    error:
                      code: missing_content
                      message: missing Content in payload
                    success: false
                missing_footer:
                  summary: Campo `Footer` vazio — obrigatório só nesta rota
                  value:
                    code: 400
                    error:
                      code: missing_footer
                      message: missing Footer in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma mensagem de modelo
      tags:
        - Envio de mensagens
  /chat/send/text:
    post:
      description: |
        Envia texto simples para um contacto, grupo ou canal, opcionalmente com
        pré-visualização de link, citação e menções.

        **Quando usar**: é a rota base de envio. Qualquer mensagem sem mídia nem
        elemento interativo passa por aqui.

        **Regras**:
        - `Body` é obrigatório; vazio é `400 missing_body`.
        - O destino vem em `Phone` ou no nome universal `chat`; `Phone` ganha
          quando os dois vierem. Nenhum dos dois é `400 missing_phone`.
        - Com `LinkPreview: true`, o serviço busca a metadata Open Graph da
          primeira URL do corpo. Falha na busca **não** é erro: a mensagem segue
          sem pré-visualização.

        **O que `200` significa**: o WhatsApp aceitou a mensagem. Não diz que ela
        já foi desenhada no ecrã de quem recebe.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Body: Bom dia! O seu pedido saiu para entrega.
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoEnvioTexto'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Mensagem aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                could_not_decode_payload:
                  summary: O corpo não é JSON válido
                  value:
                    code: 400
                    error:
                      code: could_not_decode_payload
                      message: could not decode payload
                    success: false
                invalid_phone:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_phone
                      message: could not parse Phone
                    success: false
                missing_body:
                  summary: Corpo vazio
                  value:
                    code: 400
                    error:
                      code: missing_body
                      message: missing Body in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                no_session:
                  summary: Token válido, mas a sessão não está ligada ao WhatsApp
                  value:
                    code: 400
                    error:
                      code: no_session
                      message: no session
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Payload recusado antes de qualquer envio. `error.code` diz qual regra
            falhou.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma mensagem de texto
      tags:
        - Envio de mensagens
  /chat/send/video:
    post:
      description: |
        Envia um vídeo, com legenda opcional. Mesmos dois transportes da imagem:
        URI de dados ou URL http(s) buscada pelo servidor.

        **Quando usar**: conteúdo que deve tocar dentro da conversa. Um vídeo
        enviado por `/chat/send/document` chega como ficheiro para descarregar.

        **Regras**:
        - A discriminação da URI de dados é a mais FROUXA das rotas de mídia:
          bastam os quatro primeiros caracteres serem `data`, sem os dois-pontos.
          Qualquer MIME declarado passa.
        - Teto de **100 MB**.
        - **Piso de 256 bytes** (`send_video.go:36`): abaixo disso é
          `400 video_too_small`, verificado ANTES de qualquer envio. Medido em
          2026-08-26 com uma URI de dados de 6 bytes.
        - O MIME final vem de `MimeType` quando dado; senão é farejado dos bytes.
          Se não for de vídeo, é `400 invalid_video_mime_type`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Caption: O vídeo da montagem.
              Phone: 554192421234@s.whatsapp.net
              Video: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
            schema:
              $ref: '#/components/schemas/PedidoEnvioVideo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Vídeo subido e mensagem aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                invalid_video_mime_type:
                  summary: O tipo resolvido não é de vídeo
                  value:
                    code: 400
                    error:
                      code: invalid_video_mime_type
                      message: resolved MIME type is not a video type
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_video:
                  summary: Campo `Video` vazio
                  value:
                    code: 400
                    error:
                      code: missing_video
                      message: missing Video in payload
                    success: false
                unsupported_video_source:
                  summary: Nem prefixo `data`, nem URL http(s)
                  value:
                    code: 400
                    error:
                      code: unsupported_video_source
                      message: Video data should start with "data:video/mp4;base64," or be an http(s) URL
                    success: false
                video_fetch_failed:
                  summary: A URL não pôde ser buscada
                  value:
                    code: 400
                    error:
                      code: video_fetch_failed
                      message: failed to fetch video from url
                    success: false
                video_too_large:
                  summary: Acima de 100 MB
                  value:
                    code: 400
                    error:
                      code: video_too_large
                      message: video payload exceeds size limit
                    success: false
                video_too_small:
                  summary: Menos de 256 bytes — medido em 2026-08-26
                  value:
                    code: 400
                    error:
                      code: video_too_small
                      message: video payload too small to be valid
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar um vídeo
      tags:
        - Envio de mensagens
  /community/link:
    post:
      description: |
        Torna um grupo existente sub-grupo de uma comunidade. Medido a
        2026-08-26: o sub-grupo passa a aparecer em
        `POST /community/subgroups`, e o cliente do WhatsApp mostra a mensagem de
        sistema *"O grupo X foi adicionado"* (F237).

        **Regras**: `communityJID` e `groupJID` são ambos obrigatórios — a
        ausência de cada um tem o seu próprio código
        (`missing_community_jid`, `missing_group_jid`). Esta rota **não** aceita
        o alias universal `chat`: a struct do pedido não o inclui.

        **Resposta**: `data` traz apenas a confirmação textual
        `{"Details": "Group linked to community successfully"}`, escrita pelo
        manipulador — não vem do WhatsApp. Confirme o efeito por
        `POST /community/subgroups`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoLigacaoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group linked to community successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Grupo ligado à comunidade.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_group_jid
                  message: missing groupJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID` ou o `groupJID`, ou um deles não é
            interpretável como JID (`invalid_jid`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Ligar um grupo a uma comunidade
      tags:
        - Comunidades
  /community/participants:
    post:
      description: |
        Devolve os participantes de **todos** os grupos ligados à comunidade,
        reunidos numa lista só.

        **Os identificadores vêm em LID**, não em número — medido a 2026-08-26.
        Quem precisar do telefone tem de resolver o LID por outra rota; esta não
        devolve PN.

        **Regras**: `communityJID` é obrigatório, é um JID `@g.us`, e o alias
        universal `chat` também é aceite.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
            schema:
              $ref: '#/components/schemas/PedidoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  participants:
                    - 90937376170214@lid
                    - 29343770251463@lid
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ParticipantesComunidade'
                    type: object
          description: Os participantes, em LID, dentro da chave `participants`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_community_jid
                  message: could not parse community JID "xxx"
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID`, ou ele não é um JID que se consiga
            interpretar — neste caso o código é `invalid_community_jid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os participantes dos grupos de uma comunidade
      tags:
        - Comunidades
  /community/subgroups:
    post:
      description: |
        Lista os grupos ligados a uma comunidade.

        **Onde nasce uma comunidade**: não há rota `/community/create`. Uma
        comunidade cria-se em `POST /group/create` com `is_parent: true` — é um
        grupo-pai, e é por isso que o identificador dela é `@g.us` e não um
        servidor próprio. Essa rota pertence à etiqueta **Grupos**.

        **A lista nunca vem vazia numa comunidade real**: o grupo de avisos é
        criado automaticamente com a comunidade e aparece sempre, marcado com
        `IsDefaultSubGroup: true`. Medido a 2026-08-26, com a transição
        1 → 2 → 1 provocada por `POST /community/link` e
        `POST /community/unlink` (F237).

        **Regras**: `communityJID` é obrigatório e é um JID de GRUPO (`@g.us`),
        porque a comunidade é um grupo-pai. O alias universal `chat` também é
        aceite, e só é usado quando `communityJID` vem vazio.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
            schema:
              $ref: '#/components/schemas/PedidoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  sub_groups:
                    - IsDefaultSubGroup: true
                      JID: 120363411669320145@g.us
                      Name: Avisos
                      NameSetAt: "2026-08-26T08:08:21-04:00"
                      NameSetBy: ""
                      NameSetByPN: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SubGruposComunidade'
                    type: object
          description: Os grupos ligados à comunidade, dentro da chave `sub_groups`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_community_jid
                  message: missing communityJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID`, ou ele não é um JID que se consiga
            interpretar.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os sub-grupos de uma comunidade
      tags:
        - Comunidades
  /community/unlink:
    post:
      description: |
        Retira um grupo da comunidade. O grupo continua a existir — deixa apenas
        de ser sub-grupo. Medido a 2026-08-26, com a contagem de sub-grupos a
        voltar de 2 para 1 e a mensagem de sistema *"O grupo X foi removido"* no
        cliente (F237).

        **Regra que a medição confirmou**: o grupo de avisos
        (`IsDefaultSubGroup: true`) nasce com a comunidade e permanece — foi ele
        que sobrou quando a contagem voltou a 1.

        **Regras**: `communityJID` e `groupJID` são obrigatórios; o alias `chat`
        não é aceite aqui.

        **Resposta**: `data` traz a confirmação textual
        `{"Details": "Group unlinked from community successfully"}`, escrita pelo
        manipulador. Confirme por `POST /community/subgroups`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoLigacaoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group unlinked from community successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Grupo desligado da comunidade.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_community_jid
                  message: missing communityJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `communityJID` ou o `groupJID`, ou um deles não é um JID válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Desligar um grupo de uma comunidade
      tags:
        - Comunidades
  /health:
    get:
      description: |
        Devolve um retrato do processo: há quanto tempo está de pé, quantas
        sessões existem, quantas estão ligadas e autenticadas, e quantas
        goroutines correm.

        **Quando usar**: em painéis de operação e em diagnóstico, quando se quer
        saber *como* o serviço está, e não apenas se responde.

        **Autenticação**: exige token de sessão. É a diferença face às outras
        três sondas — esta expõe contagens da instalação, logo não fica aberta.
        Para sondas de orquestrador use `/livez` ou `/health/ready`, que não
        pedem credencial.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  active_connections: 2
                  connected_users: 2
                  goroutines: 285
                  logged_in_users: 2
                  memory_stats:
                    alloc_mb: 7
                    num_gc: 5
                    sys_mb: 26
                    total_alloc_mb: 11
                  status: ok
                  timestamp: "2026-08-26T13:17:14Z"
                  total_users: 2
                  uptime: 2m19.584700417s
                  version: 1.0.6
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SaudeDetalhada'
                    type: object
          description: Retrato do processo no instante do pedido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
      security:
        - TokenSessao: []
      summary: Consultar a saúde detalhada do serviço
      tags:
        - Saúde
  /health/live:
    get:
      description: |
        O mesmo manipulador de `/livez`, servido noutro caminho.

        **Por que existem os dois**: `/livez` é o que os manifestos implantados
        apontam hoje, e renomear uma sonda por baixo de uma implantação a correr
        torna todos os contentores insalubres ao mesmo tempo. `/health/live` é a
        forma nova; `/livez` fica como sinónimo.

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: '#/components/schemas/EstadoSonda'
          description: O processo está vivo.
      security: []
      summary: Verificar se o processo está vivo (caminho alternativo)
      tags:
        - Saúde
  /health/ready:
    get:
      description: |
        Sonda de prontidão. Ao contrário da vivacidade, **verifica dependências**
        — hoje, o banco de dados — e diz o resultado de cada uma em `checks`.

        **Quando usar**: como `readinessProbe`, e como porta do balanceador. Um
        processo vivo mas sem banco responde aqui de forma diferente, e é isso
        que evita mandar-lhe tráfego.

        **Também devolve `capabilities`**, com a configuração em vigor — por
        exemplo o modo de aglomerado (`cluster`), que em `single` significa que
        um segundo processo sobre o mesmo diretório de dados é recusado (ADR-0005).

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                capabilities:
                  cluster: single
                checks:
                  database: ok
                status: ready
              schema:
                $ref: '#/components/schemas/EstadoProntidao'
          description: |
            O serviço está pronto. Note que o estado vem no CORPO, em `status`, e
            não apenas no código HTTP — um `200` com `status` diferente de
            `ready` significa que alguma verificação não passou.
      security: []
      summary: Verificar se o serviço pode receber tráfego
      tags:
        - Saúde
  /livez:
    get:
      description: |
        Sonda de vivacidade. Responde assim que o processo consegue atender —
        não consulta banco, não fala com o WhatsApp e não depende de sessão
        nenhuma.

        **Quando usar**: como `livenessProbe` de contentor. É o que o
        `HEALTHCHECK` do Dockerfile aponta.

        **Regra importante**: responder aqui significa apenas que o processo
        está de pé. Para saber se ele já pode receber tráfego, use
        `/health/ready`.

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: '#/components/schemas/EstadoSonda'
          description: O processo está vivo.
      security: []
      summary: Verificar se o processo está vivo
      tags:
        - Saúde
  /message/star:
    post:
      description: |
        Marca uma mensagem como favorita, ou retira a marca.

        **Quando usar**: para guardar uma mensagem na lista de favoritas da
        conta, visível em todos os dispositivos ligados.

        **Regras**: são necessários TRÊS identificadores, e não dois —
        `chat`, `message_id` **e `sender`**. Faltar `sender` é
        `400 missing_sender`, medido; é o erro em que se cai ao derivar o
        exemplo da conversa em vez de o medir. Em conversa individual com uma
        mensagem própria, `sender` é o JID da própria conta e `from_me` é
        `true`.

        **Histórico**: até à correcção da F223/CAP-54 esta rota devolvia
        `409 app_state_conflict`; hoje devolve `200`. O `409` continua
        possível, porque continua a ser uma escrita de app-state.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              chat: 554192421234@s.whatsapp.net
              from_me: true
              message_id: 3EB0A4B2AFD45E625C0917
              sender: 554192421234@s.whatsapp.net
              star: true
            schema:
              $ref: '#/components/schemas/PedidoFavoritarMensagem'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message: Message starred
                  success: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SucessoMensagem'
                    type: object
          description: O patch de app-state foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_sender
                  message: missing sender in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `chat`
            (`missing_chat`), `message_id` (`missing_message_id`) ou `sender`
            (`missing_sender`) ausentes, JID mal formado (`invalid_chat_jid`,
            `invalid_sender_jid`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: app_state_conflict
                  message: 'app state conflict: the local state is out of sync with the server'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Conflito de app-state — o estado local está dessincronizado do servidor.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Favoritar ou desfavoritar uma mensagem
      tags:
        - Conversas
  /newsletter/admin-invite:
    post:
      description: |
        Cria um convite para que outro utilizador se torne **administrador** do
        canal.

        **É o passo que faltava para todo o resto.** A cadeia de administração,
        medida ponta a ponta a 2026-08-26 (F233), é:

        ```
        create -> admin-invite -> admin-invite/accept -> change-owner -> demote -> delete
         owner     (convite)         role=admin           role=owner    subscriber  non_existing
        ```

        Sem um segundo administrador, `change-owner` e `demote` não têm a quem
        apontar — e era por isso que pareciam não funcionar.

        **Não é enviada mensagem nenhuma.** É uma mutação pura do protocolo: o
        convidado só fica a saber pelo cliente dele. Procurar o convite no chat
        de quem convida é procurar no sítio errado (F261).

        **Ressalva medida**: a resposta traz `data: null` **mesmo em sucesso**. O
        servidor devolve um `invite_expiration_time` (sete dias) que a API deita
        fora (F261). Um `200` aqui significa "convite criado" — a validade **não
        é devolvida**, e não há como consultá-la por esta API.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` pode ir em PN
        ou LID; a resolução PN→LID acontece antes do envio (F233c).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Convite criado. `data` é `null` e o prazo de validade não é
            devolvido — ver a ressalva acima.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: invitee jid is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Convidar um utilizador para administrador do canal
      tags:
        - Canais
  /newsletter/admin-invite/accept:
    post:
      description: |
        Aceita, **na sessão convidada**, um convite criado por
        `POST /newsletter/admin-invite`. É esta chamada que transforma o
        convidado em administrador.

        **Quem chama**: a sessão CONVIDADA, não a que convidou. O canal já é
        identificado pelo `jid`, e por isso não há `userJID` aqui.

        **Como confirmar**: `POST /newsletter/info` na sessão convidada passa a
        devolver `viewer_metadata.role: admin`. Foi assim que a cadeia foi
        medida — a prova está do lado do convidado (F233).

        **Regras**: `jid` é obrigatório. `data` vem `null` em sucesso.

        **Autenticação**: token de sessão (a do convidado).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: 'Convite aceite; quem chamou passa a `role: admin`. `data` é `null`.'
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Aceitar um convite para administrador de canal
      tags:
        - Canais
  /newsletter/admin-invite/revoke:
    post:
      description: |
        Cancela um convite de administrador que ainda não foi aceite.

        **Quem chama**: a sessão que convidou. `userJID` identifica o convidado
        cujo convite se quer revogar.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID, com resolução PN→LID antes do envio. `data` vem `null` em sucesso, e
        não há rota que liste convites pendentes — logo o efeito não é
        confirmável por esta API.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Convite revogado. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: invitee jid is required for revoke
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Revogar um convite de administrador de canal
      tags:
        - Canais
  /newsletter/change-owner:
    post:
      description: |
        Transfere a posse do canal para outro utilizador. Medido a 2026-08-26: o
        alvo passa a `role: owner` e **quem chamava, o dono anterior, cai a
        `admin`** (F233).

        **O alvo tem de já ser administrador.** Se não for, o WhatsApp recusa com
        `401` e nós devolvemos `403 newsletter_new_owner_not_admin`. É por isso
        que esta rota vem depois de `admin-invite` e `admin-invite/accept` na
        cadeia — sem esses dois passos não existe segundo administrador a quem
        passar a posse.

        **Irreversível sem a cooperação do novo dono**: depois da transferência,
        só ele pode devolvê-la.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID (resolução PN→LID antes do envio, F233c). `data` vem `null`; para
        confirmar, chame `POST /newsletter/info` e olhe
        `viewer_metadata.role`.

        **Autenticação**: token de sessão (a do dono actual).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Posse transferida. `data` é `null`; a mudança confirma-se em
            `POST /newsletter/info`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: new owner jid is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID` do novo dono.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error:
                  code: newsletter_new_owner_not_admin
                  message: the new owner must already be a channel admin
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: O utilizador indicado ainda não é administrador do canal.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Transferir a posse de um canal
      tags:
        - Canais
  /newsletter/create:
    post:
      description: |
        Cria um canal de difusão novo, do qual a sessão que chama fica **dono**
        (`viewer_metadata.role: owner`).

        **Quando usar**: é o primeiro passo de tudo o resto. É também o primeiro
        passo da cadeia de administração — sem um canal criado por si, nenhuma
        das rotas de administrador tem sobre o que operar.

        **Regras**: `name` é obrigatório; sem ele a resposta é
        `400 missing_name`. É a única das dezoito operações que não recebe `jid`
        — o identificador é o que ela devolve.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              description: Novidades e horários de funcionamento.
              name: Avisos da Fila Rápida
            schema:
              $ref: '#/components/schemas/PedidoCriarCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 120363411025775186@newsletter
                  state:
                    type: active
                  thread_metadata:
                    creation_time: "1787745654"
                    description:
                      id: "1787745654587070"
                      text: Novidades e horários de funcionamento.
                      update_time: "1787745654587070"
                    invite: 0029Vb85MPpKLaHoEUxRt01E
                    name:
                      id: "1787745654587070"
                      text: Avisos da Fila Rápida
                      update_time: "1787745654587070"
                    subscribers_count: "0"
                    verification: unverified
                  viewer_metadata:
                    mute: "on"
                    role: owner
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MetadadosCanal'
                    type: object
          description: Canal criado. `data` traz os metadados do canal novo.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_name
                  message: nome do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o nome, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Criar um canal
      tags:
        - Canais
  /newsletter/delete:
    delete:
      description: |
        **Destrói o canal e todo o seu conteúdo. Não há como desfazer.**

        É o último passo da cadeia de administração de canal (F233), e só o dono
        o pode dar.

        **Método `DELETE`, não `POST`** — e com corpo, que é invulgar mas é o que
        esta rota exige.

        **Confirmação obrigatória**: `confirmJID` tem de ser **idêntico** a
        `jid`. Sem ele, ou com valor diferente, a resposta é
        `400 missing_confirm_jid` e **o WhatsApp nem chega a ser contactado** —
        a guarda está do nosso lado, antes do envio.

        **Como se confirma o efeito** (as três vias usadas na verificação de
        campo): `GET /newsletter/list` deixa de o listar;
        `POST /newsletter/info` passa a devolver `state.type: non_existing` com
        `viewer_metadata: null`; e o link público de convite deixa de resolver.

        **Autenticação**: token de sessão (a do dono).
      requestBody:
        content:
          application/json:
            example:
              confirmJID: 120363411025775186@newsletter
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoApagarCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Canal apagado. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_confirm_jid
                  message: confirm_jid must match the channel jid
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, ou `confirmJID` está ausente ou é diferente de `jid`.
            Neste último caso nada foi enviado ao WhatsApp.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Apagar um canal (IRREVERSÍVEL)
      tags:
        - Canais
  /newsletter/demote:
    post:
      description: |
        Tira o papel de administrador a um utilizador, que passa a
        `role: subscriber` — medido a 2026-08-26 (F233).

        **O dono não pode ser despromovido.** O WhatsApp recusa com `405` e nós
        devolvemos `403 newsletter_cannot_demote_owner`: para tirar poder ao
        dono, é preciso primeiro `POST /newsletter/change-owner`.

        **Precisa de um segundo administrador para ter sentido**, e ele só
        existe depois de `admin-invite` + `admin-invite/accept`. Era essa a razão
        de esta rota parecer não funcionar antes de a cadeia estar fechada.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID. `data` vem `null`; confirme por `POST /newsletter/info`.

        **Autenticação**: token de sessão (a do dono).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Administrador despromovido a assinante. `data` é `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: user jid is required for demote
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID` do alvo.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error:
                  code: newsletter_cannot_demote_owner
                  message: the channel owner cannot be demoted; transfer ownership first
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: O alvo é o dono do canal, e o dono não pode ser despromovido.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Despromover um administrador do canal a assinante
      tags:
        - Canais
  /newsletter/follow:
    post:
      description: |
        Passa a seguir o canal indicado, que a partir daí aparece em
        `GET /newsletter/list`.

        **Quando usar**: depois de descobrir um canal por
        `POST /newsletter/info-invite`, para o acompanhar.

        **Regras**: `jid` é obrigatório. A resposta de sucesso traz
        `data: null` — a operação não devolve carga útil, e o `200` é a
        confirmação. Para verificar o efeito, chame `GET /newsletter/list`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: O canal passou a ser seguido. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Seguir um canal
      tags:
        - Canais
  /newsletter/info:
    post:
      description: |
        Devolve o retrato de um canal: nome, descrição, código de convite,
        contagem de seguidores, estado e — o mais útil — **o papel de quem
        chama**, em `viewer_metadata.role`.

        **Quando usar**: para descobrir se a sessão é `owner`, `admin` ou
        `subscriber` antes de tentar uma operação de administração. Também é a
        forma de confirmar que um `delete` teve efeito: o canal apagado passa a
        `state.type: non_existing` com `viewer_metadata: null`.

        **Regras**: `jid` é obrigatório e tem de ser um JID `@newsletter`.
        `viewer_metadata` vem `null` quando não há relação com o canal.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 120363411025775186@newsletter
                  state:
                    type: active
                  thread_metadata:
                    creation_time: "1787745654"
                    description:
                      id: "1787745654587070"
                      text: Novidades e horários de funcionamento.
                      update_time: "1787745654587070"
                    invite: 0029Vb85MPpKLaHoEUxRt01E
                    name:
                      id: "1787745654587070"
                      text: Avisos da Fila Rápida
                      update_time: "1787745654587070"
                    picture:
                      direct_path: ""
                      hash: null
                      id: "1787750687544878"
                      type: IMAGE
                      url: ""
                    preview:
                      direct_path: ""
                      hash: null
                      id: "1787750687544880"
                      type: PREVIEW
                      url: ""
                    settings:
                      reaction_codes:
                        value: ALL
                    subscribers_count: "0"
                    verification: unverified
                  viewer_metadata:
                    mute: "on"
                    role: owner
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MetadadosCanal'
                    type: object
          description: Metadados do canal, do ponto de vista da sessão que chamou.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, ou o corpo não é JSON válido. Note a mensagem em
            português: é o que o código devolve hoje (F262).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar os metadados de um canal
      tags:
        - Canais
  /newsletter/info-invite:
    post:
      description: |
        O mesmo retrato de `POST /newsletter/info`, mas a partir do **código do
        link público** em vez do JID.

        **Quando usar**: quando se tem apenas o link partilhado de um canal e se
        quer saber o que ele é antes de seguir. O código é a parte final do link
        (`https://whatsapp.com/channel/<código>`) e vai nu no campo `invite`.

        **Regras**: `invite` é obrigatório; sem ele a resposta é
        `400 missing_invite`. Como quem chama pode não ter relação nenhuma com o
        canal, `viewer_metadata` costuma vir `null` — foi o valor medido mesmo
        contra um canal próprio.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              invite: 0029Vb85MPpKLaHoEUxRt01E
            schema:
              $ref: '#/components/schemas/PedidoCanalPorConvite'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 120363411025775186@newsletter
                  state:
                    type: active
                  thread_metadata:
                    creation_time: "1787745654"
                    invite: 0029Vb85MPpKLaHoEUxRt01E
                    name:
                      id: "1787745654587070"
                      text: Avisos da Fila Rápida
                      update_time: "1787745654587070"
                    subscribers_count: "0"
                    verification: unverified
                  viewer_metadata: null
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MetadadosCanal'
                    type: object
          description: Metadados do canal a que o convite aponta.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_invite
                  message: código de convite é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o código de convite, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar um canal pelo código de convite
      tags:
        - Canais
  /newsletter/list:
    get:
      description: |
        Lista todos os canais seguidos pela sessão, cada um com os mesmos
        metadados de `POST /newsletter/info`.

        **Quando usar**: para descobrir os JIDs com que as outras dezassete
        rotas trabalham. É a única rota de canal em `GET`, e não recebe corpo
        nenhum.

        **Ressalva medida**: a lista inclui canais em `state.type: deleted`, com
        `thread_metadata` inteiramente vazio e `viewer_metadata: null`. Um
        cliente que mostre "os meus canais" tem de filtrar por estado, ou mostra
        entradas sem nome.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  newsletter:
                    - id: 120363411025775186@newsletter
                      state:
                        type: active
                      thread_metadata:
                        creation_time: "1787745654"
                        invite: 0029Vb85MPpKLaHoEUxRt01E
                        name:
                          id: "1787745654587070"
                          text: Avisos da Fila Rápida
                          update_time: "1787745654587070"
                        picture: null
                        subscribers_count: "0"
                        verification: unverified
                      viewer_metadata:
                        mute: "on"
                        role: owner
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListaCanais'
                    type: object
          description: |
            Os canais seguidos, dentro da chave `newsletter` — repare no nível
            extra entre `data` e a lista.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os canais que a sessão segue
      tags:
        - Canais
  /newsletter/mark-viewed:
    post:
      description: |
        Informa o WhatsApp de que as mensagens indicadas foram vistas, o que
        alimenta as contagens de visualização do canal.

        **Quando usar**: depois de mostrar publicações ao utilizador, com os
        `server_id` obtidos em `POST /newsletter/messages`.

        **Regras**: `jid` e `serverIDs` são obrigatórios; lista vazia é recusada
        com `400 missing_server_ids`. `data` vem `null` em sucesso, e **não há
        forma de confirmar o efeito por esta API** — foi por isso que a bateria
        de campo a classificou como `200` sem observador independente.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              serverIDs:
                - 1
                - 2
                - 3
            schema:
              $ref: '#/components/schemas/PedidoMarcarVistoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: O WhatsApp aceitou a marcação. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_server_ids
                  message: pelo menos um server_id é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou a lista de `serverIDs` está vazia.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Marcar mensagens de um canal como vistas
      tags:
        - Canais
  /newsletter/messages:
    post:
      description: |
        Devolve as publicações do canal, da mais recente para trás.

        **Quando usar**: para construir a linha do tempo de um canal seguido, ou
        para obter os `server_id` de que `POST /newsletter/mark-viewed` e
        `POST /newsletter/react` precisam.

        **Regras**: `jid` é obrigatório. `count` a zero (ou ausente) **não** é um
        limite nosso — o atributo é omitido do pedido e o servidor aplica o
        padrão dele. `before` recebe um `server_id` para paginar para trás.

        **Forma da resposta**: `data` é a lista directamente, sem chave
        intermédia — ao contrário de `GET /newsletter/list`. Um canal sem
        publicações devolve `[]`, medido a 2026-08-26. A forma de cada elemento
        não foi determinada com segurança: não havia canal com mensagens para
        medir.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              count: 5
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoMensagensCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: []
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MensagensCanal'
                    type: object
          description: Mensagens do canal, ou `[]` quando ele não tem nenhuma.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Ler as mensagens de um canal
      tags:
        - Canais
  /newsletter/mute:
    post:
      description: |
        Liga ou desliga o silenciamento do canal para esta sessão, conforme o
        campo `mute`.

        **Quando usar**: quando se segue um canal ruidoso e não se quer perder o
        acesso ao conteúdo, apenas as notificações.

        **Regras**: `jid` é obrigatório; `mute` é booleano e, ausente, vale
        `false` — ou seja, um corpo só com `jid` **dessilencia**. O efeito é
        visível em `viewer_metadata.mute` de `POST /newsletter/info`, que vem
        como texto `on`/`off`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              mute: true
            schema:
              $ref: '#/components/schemas/PedidoSilenciarCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Silenciamento alterado. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Silenciar ou dessilenciar um canal
      tags:
        - Canais
  /newsletter/react:
    post:
      description: |
        Põe — ou tira — uma reação numa publicação do canal.

        **Como se REMOVE a reação**: enviando `reaction` vazio. É por isso que
        esse campo não é obrigatório: exigi-lo tornaria impossível desfazer
        (`newsletter_ops.go:234`).

        **Regras**: `jid` e `serverID` são obrigatórios. `serverID` a zero é
        recusado com `400 missing_server_id`. `data` vem `null` em sucesso, e o
        efeito não é confirmável por esta API — classificada como `200` sem
        observador independente na bateria de campo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              reaction: "\U0001F44D"
              serverID: 1
            schema:
              $ref: '#/components/schemas/PedidoReagirCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: O WhatsApp aceitou a reação. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_server_id
                  message: server_id é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou `serverID` é zero.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Reagir a uma mensagem de um canal
      tags:
        - Canais
  /newsletter/subscribe:
    post:
      description: |
        Liga as atualizações ao vivo do canal, para que as publicações novas
        cheguem por eventos em vez de sondagem.

        **Regras**: `jid` é obrigatório.

        **Ressalva medida no código**: o WhatsApp devolve **por quanto tempo** a
        subscrição vale, e o use case chega a guardar esse valor
        (`NewsletterResult.DurationSeconds`), mas o manipulador responde apenas
        com `rsp.Data` (`handler_newsletter.go:120`) — que nesta operação é
        `nil`. Ou seja, a resposta é `data: null` e **a duração não é devolvida**.
        É a mesma família do achado F261.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Subscrição feita. `data` é sempre `null`, e a validade que o servidor
            informou é descartada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Subscrever as atualizações ao vivo de um canal
      tags:
        - Canais
  /newsletter/unfollow:
    post:
      description: |
        Deixa de seguir o canal. Ele sai de `GET /newsletter/list`.

        **Regra que surpreende**: **um administrador ou dono NÃO pode deixar de
        seguir o próprio canal**. O WhatsApp recusa com `405`, e nós traduzimos
        isso em `403 newsletter_admin_cannot_unfollow`
        (`pkg/infra/wa-noise/errmap/newsletter.go:74`). Para sair, é preciso
        primeiro deixar de ser administrador — o que, no caso do dono, significa
        transferir a posse por `POST /newsletter/change-owner`.

        **Regras**: `jid` é obrigatório. `data` vem `null` em sucesso.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Deixou de seguir. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error:
                  code: newsletter_admin_cannot_unfollow
                  message: channel admins cannot unfollow their own channel; dismiss yourself as admin first
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Quem chama é administrador ou dono do canal, e por isso não pode
            deixar de o seguir.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Deixar de seguir um canal
      tags:
        - Canais
  /newsletter/updates:
    post:
      description: |
        Deveria devolver as ALTERAÇÕES a mensagens já conhecidas — edições,
        contagens de reação, remoções —, ao contrário de
        `POST /newsletter/messages`, que devolve as mensagens em si.

        **Esta rota está inoperante.** Medida a 2026-08-26 e de novo nesta
        sessão: responde **`500` ao fim de 30,0 segundos**, com
        `error.code: newsletter_failed` e, no log,
        `context deadline exceeded`. Os 30 s são exactamente o tempo limite por
        pedido — o servidor do WhatsApp **não responde**, não é ele a recusar.
        `POST /newsletter/messages` sobre o mesmo canal e no mesmo segundo
        devolve `200`, logo a sessão, o canal e o transporte estão bons. Está
        registado como F265 no `HOUSEKEEP.md`; a hipótese em aberto é um query
        ID desactualizado, e um ID inexistente produz silêncio, não erro.

        **Não use esta rota em produção.** Para acompanhar um canal, use
        `POST /newsletter/messages` ou `POST /newsletter/subscribe`.

        **Regras**: `jid` é obrigatório. `since` vai em RFC 3339 e é o único
        campo destas dezoito rotas validado no manipulador, antes do use case.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              count: 5
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoAtualizacoesCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: []
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Nunca observado. Documentado por ser o que o código devolveria se o
            servidor respondesse; a forma dos elementos não foi medida.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, o corpo não é JSON válido, ou `since` não está em
            RFC 3339.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: newsletter_failed
                  message: newsletter operation failed
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **O que esta rota devolve hoje, sempre**, ao fim de 30 segundos de
            espera pelo WhatsApp.
      security:
        - TokenSessao: []
      summary: Buscar atualizações de mensagens de um canal (INOPERANTE)
      tags:
        - Canais
  /status/set/audio:
    post:
      description: |
        Publica um áudio como status. Não aceita legenda — o áudio de status não
        a tem.

        **Regras**: `Audio` aceita URI de dados começado por `data:audio/`
        **ou** URL `http(s)://`. O limite é de 16 MiB depois de descodificado.
        O campo de tipo chama-se `mimetype`, em minúsculas, e não `MimeType`
        como nas rotas de imagem e vídeo — é divergência real da implementação
        (`pkg/domain/session.go:120`), embora o casamento de nomes do Go, que
        ignora maiúsculas, aceite as duas grafias.

        **A mesma ressalva do `200`, medida**: os destinatários saem do campo
        `FullName` dos contactos, e numa conta WhatsApp Business isso deu
        **dois** destinatários para 461 contactos, contra 165 para 1266 numa
        conta pessoal. Ver F256 no `HOUSEKEEP.md`.

        **Não existe `/status/set/text`** — o recado textual é `POST /user/status`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Audio: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
            schema:
              $ref: '#/components/schemas/PedidoStatusAudio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB01671E10F412B3DF41C
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            O WhatsApp aceitou a publicação. Não significa que algum contacto a
            ouça — leia a ressalva da descrição.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: unsupported_audio_source
                  message: audio must be base64 (data:audio/) or valid HTTP URL
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Audio` ausente (`missing_audio`), origem que não é URI de dados
            `data:audio/` nem URL (`unsupported_audio_source`), URI de dados
            ilegível (`invalid_data_uri`), áudio acima do limite
            (`audio_too_large`), corpo descodificado vazio (`empty_audio_body`),
            falha ao baixar o URL (`audio_fetch_failed`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Publicar um status com áudio
      tags:
        - Status
  /status/set/image:
    post:
      description: |
        Publica uma imagem como status — as "novidades" que expiram em 24 horas.

        **Quando usar**: para difundir um aviso visual aos contactos, sem
        escolher destinatários um a um. Quem vê é decidido pela privacidade de
        status da conta, legível em `GET /user/privacy`.

        **Regras**: `Image` aceita URI de dados começado por `data:image` **ou**
        URL `http(s)://`; qualquer outra coisa é recusada com
        `unsupported_image_source`. O limite é de 16 MiB depois de
        descodificada, verificado ANTES da descodificação quando o URI declara
        `;base64`. O tipo resolvido tem de começar por `image/`, senão o pedido
        é recusado com `invalid_image_mime_type`.

        **A ressalva que o `200` esconde, e que foi medida**: um `200` com
        `message_id` **não garante que o status chegue a alguém**. A lista de
        destinatários é construída a partir do campo `FullName` de cada contacto
        (`internal/wa-noise/core/broadcast.go`), e uma conta WhatsApp Business
        recebe os contactos por `PushName`, não por sincronização de agenda. O
        número medido: numa conta Business com 461 contactos, apenas 1 tinha
        `FullName`, e a publicação foi para **dois** destinatários (esse mais a
        própria conta); numa conta pessoal com 1266 contactos, foi para 165.
        Registado como F256 no `HOUSEKEEP.md`. Antes de contar com esta rota,
        confirme visualmente numa conta como a sua.

        **Não existe `/status/set/text`.** O recado textual do perfil é outra
        coisa, e faz-se em `POST /user/status`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Caption: Estamos abertos até às 20h.
              Image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
            schema:
              $ref: '#/components/schemas/PedidoStatusImagem'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0890CAD5493C9B10E75
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            O WhatsApp aceitou a publicação. Leia a ressalva da descrição: isto
            **não** significa que algum contacto a veja.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: unsupported_image_source
                  message: Image data should start with "data:image/png;base64," or be an http(s) URL
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Image` ausente (`missing_image`), origem que não é URI de dados nem
            URL (`unsupported_image_source`), URI de dados ilegível
            (`invalid_data_uri`), imagem acima do limite (`image_too_large`),
            corpo descodificado vazio (`empty_image_body`), tipo resolvido que
            não é imagem (`invalid_image_mime_type`), falha ao baixar o URL
            (`image_fetch_failed`), corpo ilegível (`could_not_decode_payload`)
            ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Publicar um status com imagem
      tags:
        - Status
  /status/set/video:
    post:
      description: |
        Publica um vídeo como status, com as mesmas regras de difusão da rota de
        imagem.

        **Regras**: `Video` aceita URI de dados **ou** URL `http(s)://`. Repare
        em duas diferenças reais face à rota de imagem: o prefixo aceite é
        `data:` (e não `data:video`), e o tipo resolvido **não** é verificado
        contra `video/` — um URI de dados de outro tipo passa por aqui. O limite
        é de 100 MiB depois de descodificado.

        **A mesma ressalva do `200`, medida**: a lista de destinatários vem do
        campo `FullName` dos contactos, e numa conta WhatsApp Business quase
        nenhum contacto o tem — 461 contactos produziram **dois** destinatários,
        contra 165 numa conta pessoal com 1266. O `200` diz que o WhatsApp
        aceitou, não que alguém veja. Ver F256 no `HOUSEKEEP.md`.

        **Não existe `/status/set/text`** — o recado textual é `POST /user/status`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Caption: Bastidores de hoje.
              Video: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
            schema:
              $ref: '#/components/schemas/PedidoStatusVideo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0C8877B176B85F162E2
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            O WhatsApp aceitou a publicação. Não significa que algum contacto a
            veja — leia a ressalva da descrição.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_video
                  message: missing Video in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Video` ausente (`missing_video`), origem que não é URI de dados nem
            URL (`unsupported_video_source`), URI de dados ilegível
            (`invalid_data_uri`), vídeo acima do limite (`video_too_large`),
            corpo descodificado vazio (`empty_video_body`), falha ao baixar o
            URL (`video_fetch_failed`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Publicar um status com vídeo
      tags:
        - Status
  /user/avatar:
    post:
      description: |
        **Esta rota LÊ.** Apesar do método `POST` e do nome, ela não altera a
        foto de conta nenhuma: devolve o URL da foto de perfil do contacto
        indicado (`GetAvatarUseCase`, `pkg/application/usecase/user/get_avatar.go`).
        O `POST` existe só porque o alvo vai no corpo.

        **Quando usar**: para mostrar a foto de um contacto. A imagem NÃO vem no
        corpo — vem o URL, temporário e assinado pelo WhatsApp, e é dele que se
        baixa.

        **Regras**: `Phone` é obrigatório e aceita número nu, JID de telefone ou
        LID. `Preview: true` devolve a miniatura; o padrão é a imagem em tamanho
        cheio.

        **As duas recusas que não são falhas**, e que são distintas de propósito:
        `404` quando o contacto **não tem** foto pública, e `403` quando **tem**
        mas a escondeu por privacidade. A diferença importa: a primeira não muda
        se se voltar a tentar, a segunda muda se a pessoa mudar a definição.

        **Ressalva de formato**: nessas duas respostas o campo `error` é uma
        STRING (`"not found"`, `"forbidden"`) e não o objecto `{code,message}` —
        os sentinelas de avatar não passam pela taxonomia `apperr`. É o mesmo
        desvio catalogado como F266. Medido.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
              Preview: true
            schema:
              $ref: '#/components/schemas/PedidoAvatar'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: "1735689600"
                  url: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Avatar'
                    type: object
          description: Ponteiro para a foto. A imagem baixa-se do `url`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone
                  message: missing Phone in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Phone` ausente (`missing_phone`), corpo ilegível
            (`could_not_decode_payload`), identificador que não parseia
            (`invalid_phone`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error: forbidden
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O contacto TEM foto, mas escondeu-a por privacidade. Medido — e
            repare no `error` em string, não no objecto.
        "404":
          content:
            application/json:
              example:
                code: 404
                error: not found
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O contacto não tem foto de perfil pública. É o caso comum, não uma
            falha do servidor. `error` em string, como no `403`.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Obter a foto de perfil de um contacto
      tags:
        - Contactos e utilizadores
  /user/block:
    post:
      description: |
        Acrescenta um contacto à lista de bloqueados da conta.

        **ESTA ROTA ESTÁ INOPERANTE HOJE.** Medida em 2026-08-26 em quatro
        combinações — conta WhatsApp Business e conta pessoal, número real e
        número inexistente, identificador em número e em LID — e as quatro
        devolveram `422 upstream_rejected`. O log mostra o WhatsApp a responder
        `info query returned status 400: bad-request`. Não é o número, não é a
        forma do identificador e não é o tipo de conta: as quatro variáveis
        foram isoladas. **A causa está por apurar** e está registada como F264
        no `HOUSEKEEP.md`; a hipótese em aberto é a forma da consulta que
        enviamos. `GET /user/blocklist` continua a funcionar — é só a escrita
        que é recusada.

        **Regras**, para quando voltar a funcionar: basta um de `JID` ou
        `Phone`, com `JID` a ganhar quando os dois vierem. A resolução é
        LENIENTE por decisão registada (F203): um número nu é aceite.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoBloqueio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Blocklist:
                    - 554192421234@s.whatsapp.net
                  DHash: "1787412261963655"
                  Details: User blocked
                  JID: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoBloqueio'
                    type: object
          description: |
            Bloqueio aceite. **Nunca observado em campo** — a forma abaixo vem
            do código (`block_user.go:71-81`), não de medição.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone_or_jid
                  message: missing Phone or JID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nem `Phone` nem `JID` no corpo (`missing_phone_or_jid`),
            identificador que não parseia (`invalid_phone_or_jid`), corpo
            ilegível (`could_not_decode_payload`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          content:
            application/json:
              example:
                code: 422
                error:
                  code: upstream_rejected
                  message: WhatsApp refused this request; repeating it unchanged will not help
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **É o que esta rota devolve hoje, em todas as combinações medidas.**
            O pedido chegou ao WhatsApp e foi recusado; repeti-lo sem mudança
            não ajuda. Ver F264.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Bloquear um contacto
      tags:
        - Contactos e utilizadores
  /user/blocklist:
    get:
      description: |
        Devolve os JIDs bloqueados pela conta, com o hash com que o WhatsApp
        versiona a lista.

        **Quando usar**: para saber, antes de enviar, se um destino está
        bloqueado; e para detectar mudanças na lista comparando o `DHash` em
        vez de percorrer as entradas.

        **Ressalva de formato, medida**: esta é a única rota do grupo que **NÃO
        usa o envelope comum**. O manipulador serializa o resultado e escreve-o
        directamente (`handler_blocklist.go:66-73`), portanto a resposta é
        `{"Blocklist":[…],"DHash":"…"}` — sem `code`, sem `data`, sem `success`.
        Um cliente que leia `data` encontra `undefined` aqui.

        **Contraste com a escrita**: esta LEITURA funciona. As duas rotas que
        alteram a lista (`POST /user/block` e `POST /user/unblock`) estão hoje
        inoperantes — ver a descrição delas.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                Blocklist: []
                DHash: "1787412261963655"
              schema:
                $ref: '#/components/schemas/ListaBloqueados'
          description: |
            A lista de bloqueados, **sem envelope**. Medido: numa conta sem
            bloqueios, `Blocklist` vem como array vazio.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os contactos bloqueados
      tags:
        - Contactos e utilizadores
  /user/check:
    post:
      description: |
        Pergunta ao WhatsApp, em lote, quais dos números dados têm conta, e
        devolve o JID resolvido de cada um.

        **Quando usar**: antes de enviar para um número que veio de um
        formulário ou de uma importação de agenda. É a forma barata de
        descobrir que um número não existe, em vez de o descobrir num envio
        falhado.

        **Regras**: `phone` é sempre um ARRAY, mesmo para um número só. O valor
        pode ir NU (`554192421234`) — foi assim que foi medido. Um número sem
        conta devolve `is_in_whatsapp: false` dentro de um `200`: **não é
        erro**, é a resposta.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone:
                - "554192421234"
            schema:
              $ref: '#/components/schemas/PedidoVerificacaoNumero'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - is_in_whatsapp: true
                    jid: 554192421234@s.whatsapp.net
                    query: "554192421234"
                    verified_name: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/ResultadoVerificacaoNumero'
                        type: array
                    type: object
          description: Uma entrada por número consultado.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Verificar se números têm WhatsApp
      tags:
        - Contactos e utilizadores
  /user/contacts:
    get:
      description: |
        Devolve todos os contactos que a sessão conhece, num objecto indexado
        por JID.

        **Quando usar**: para construir uma agenda local, ou para dar nome a
        JIDs que chegam em eventos. Não há paginação — vem tudo de uma vez.

        **Regra que muda o que se faz com isto**: **nas contas com endereçamento
        LID as chaves vêm em `@lid`**, não em número. Medido: numa conta com 461
        contactos, a totalidade das chaves era `@lid`. Quem quiser casar isto
        com uma agenda por telefone precisa de resolver cada LID —
        `GET /user/profile/{jid}` faz a tradução nos dois sentidos.

        **Segunda ressalva medida**: `FullName` costuma vir VAZIO e o nome real
        está em `PushName`. Numa conta WhatsApp Business, 460 dos 461 contactos
        tinham só `PushName`. Um cliente que leia apenas `FullName` vê uma
        agenda sem nomes.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  90937376170214@lid:
                    BusinessName: ""
                    FirstName: ""
                    Found: true
                    FullName: ""
                    PushName: Janio Gonzalez
                    RedactedPhone: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Roster'
                    type: object
          description: O roster inteiro, indexado por JID.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar o roster inteiro da conta
      tags:
        - Contactos e utilizadores
  /user/contacts/last-activity:
    get:
      description: |
        Devolve, por JID, o instante da mensagem mais recente daquela conversa.

        **De onde vem o dado**: do histórico LOCAL — o `HistorySync` que chega
        depois do pareamento, mais as mensagens correntes. **Não** é uma
        consulta ao WhatsApp, e por isso responde depressa e não depende de a
        sessão estar ligada.

        **Quando usar**: para ordenar uma lista de conversas por actividade sem
        pedir o histórico de cada uma.

        **Regras**: as chaves são normalizadas para o espaço LID quando o
        mapeamento é conhecido, de propósito, para casarem com as de
        `GET /user/contacts` — sem isso os dois lados vivem em espaços de
        identidade diferentes e quase nada casa (medido: 0 de 1141 contactos
        casavam por telefone). Um número sem LID conhecido mantém a chave em
        `@s.whatsapp.net`, e grupos aparecem em `@g.us`. Quando a sessão está
        em espera, a normalização é saltada e o dado sai cru — **degrada, não
        falha**.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  554192421234@s.whatsapp.net: "2026-08-24T18:56:53.796034-04:00"
                  90937376170214@lid: "2026-08-24T18:56:53.836029-04:00"
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UltimaAtividadePorConversa'
                    type: object
          description: Instante da última mensagem, por JID de conversa.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar o instante da última mensagem de cada conversa
      tags:
        - Contactos e utilizadores
  /user/info:
    post:
      description: |
        Devolve, por JID consultado, os aparelhos ligados àquela conta, o recado
        do perfil, o identificador da foto e o LID correspondente.

        **Quando usar**: quando é preciso saber em quantos aparelhos uma conta
        está, ou obter o LID de um número sem depender do mapeamento local que
        `GET /user/lid/{jid}` consulta.

        **Regras**: `phone` é um ARRAY. O manipulador acrescenta
        `@s.whatsapp.net` a todo valor sem `@` antes de resolver
        (`handler_user.go:normalizePhones`), pelo que número nu e JID completo
        funcionam os dois. Um valor que não parseia é **saltado em silêncio**,
        não recusado — a resposta simplesmente não o traz, e não há sinal
        distinguindo isso de "o servidor não sabe".

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone:
                - 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoInfoUtilizadores'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  users:
                    554192421234@s.whatsapp.net:
                      Devices:
                        - 554192421234@s.whatsapp.net
                        - 554192421234:41@s.whatsapp.net
                        - 554192421234:76@s.whatsapp.net
                      LID: 90937376170214@lid
                      PictureID: ""
                      Status: ""
                      VerifiedName: null
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/InfoUtilizadores'
                    type: object
          description: Bloco `users`, indexado pelo JID consultado.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar aparelhos, recado e identidade de contas
      tags:
        - Contactos e utilizadores
  /user/lid/{jid}:
    get:
      description: |
        Devolve o identificador de privacidade (`@lid`) correspondente a um
        número, consultando o mapeamento que a sessão mantém localmente.

        **Quando usar**: quando se tem um número e se precisa do LID para casar
        com dados que vêm em espaço LID — o roster de `GET /user/contacts`, por
        exemplo.

        **Regras**: a rota resolve o LID **DE** um número, logo o caminho tem de
        trazer um JID `@s.whatsapp.net`. Passar um `@lid` é recusado com
        `jid_not_pn` e `400` — não é falha nossa, é o pedido invertido (F182;
        antes disto o mesmo caso dava `500`).

        **A distinção entre `404` e `500`**: quando o mapeamento simplesmente
        não existe, a resposta é `404 lid_not_found`. Quando o armazenamento
        falha, é `500` — de propósito, porque nesse caso o cliente NÃO sabe se
        aquele número tem LID, e dizer-lhe "não encontrado" fá-lo-ia parar de
        tentar diante de uma falha passageira.

        **Autenticação**: token de sessão.
      parameters:
        - $ref: '#/components/parameters/JidNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  jid: 554192421234@s.whatsapp.net
                  lid: 90937376170214@lid
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResolucaoLID'
                    type: object
          description: O par número/LID. Medido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: jid_not_pn
                  message: 'this route resolves the LID OF a phone number: pass a @s.whatsapp.net jid, not @lid'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Identificador ausente (`missing_jid`), mal formado (`invalid_jid`),
            em LID quando devia ser número (`jid_not_pn`), ou sessão inexistente
            (`no_session`). O exemplo abaixo é a resposta medida ao passar um
            `@lid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: lid_not_found
                  message: LID not found for this number
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não há LID conhecido para este número.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Resolver o LID de um número
      tags:
        - Contactos e utilizadores
  /user/presence:
    post:
      description: |
        Marca a conta como online ou offline perante o WhatsApp.

        **Quando usar**: ao arrancar um serviço que vai atender conversas
        (`available`), e ao encerrá-lo (`unavailable`). É a conta INTEIRA, não
        uma conversa — para "a escrever…" numa conversa específica existe
        `POST /chat/presence`.

        **Regras**: `type` só aceita `available` e `unavailable`. Qualquer outro
        valor é recusado com `invalid_presence_type` antes de qualquer chamada
        ao WhatsApp.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              type: available
            schema:
              $ref: '#/components/schemas/PedidoPresenca'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Presence sent
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Presença enviada ao WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_presence_type
                  message: 'invalid presence type. Allowed values: ''available'', ''unavailable'''
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `type` fora do conjunto (`invalid_presence_type`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir a presença da própria conta
      tags:
        - Contactos e utilizadores
  /user/presence/subscribe:
    post:
      description: |
        Pede ao WhatsApp para passar a enviar notificações quando aquele
        contacto fica online ou offline.

        **Quando usar**: quando se quer saber que um contacto ficou disponível
        sem estar a perguntar em ciclo. As notificações chegam depois pelos
        canais de eventos (WebSocket, webhook), **não** nesta resposta.

        **Regras**: `Phone` é obrigatório e aceita número nu, JID de telefone ou
        LID. O `200` diz que a subscrição foi pedida — não garante que alguma
        notificação venha a chegar, que depende também da privacidade do
        contacto.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoSubscricaoPresenca'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Presence subscription updated
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Subscrição pedida ao WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone
                  message: missing Phone in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Phone` ausente (`missing_phone`), identificador que não parseia
            (`invalid_phone`), corpo ilegível (`could_not_decode_payload`) ou
            sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Subscrever a presença de um contacto
      tags:
        - Contactos e utilizadores
  /user/privacy:
    get:
      description: |
        Devolve as definições de privacidade em vigor na conta ligada.

        **Quando usar**: para saber quem vê o último acesso, a foto e os status
        antes de contar com uma dessas coisas. A privacidade de status, em
        particular, é o que decide para quem uma publicação em
        `POST /status/set/*` pode ir.

        **A ressalva que apanha quem escreve um cliente**: leitura e escrita
        usam **vocabulários diferentes**. Aqui as chaves vêm em `PascalCase`
        (`GroupAdd`, `LastSeen`, `ReadReceipts`…); o `POST` neste mesmo caminho
        recebe o nome em minúsculas (`groupadd`, `last`, `readreceipts`…). E a
        leitura devolve TRÊS chaves que a escrita não conhece — `Messages`,
        `Defense` e `Stickers` não constam da tabela de validação
        (`pkg/domain/privacy.go:54-62`), logo não são definíveis por esta API.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  CallAdd: all
                  Defense: "off"
                  GroupAdd: all
                  LastSeen: contacts
                  Messages: all
                  Online: all
                  Profile: all
                  ReadReceipts: all
                  Status: contacts
                  Stickers: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: As definições em vigor. O exemplo é uma resposta medida.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Ler as definições de privacidade da conta
      tags:
        - Contactos e utilizadores
    post:
      description: |
        Altera UMA definição de privacidade da conta ligada. O caminho é o mesmo
        da leitura, e o manipulador despacha por método
        (`pkg/bootstrap/wiring_routes.go:209-215`).

        **Quando usar**: com cuidado — isto muda a conta real, e o efeito é
        visível para terceiros.

        **Regras**: `privacy_setting` vai em MINÚSCULAS e é uma das sete que a
        tabela do domínio conhece: `groupadd`, `last`, `status`, `profile`,
        `readreceipts`, `online`, `calladd`. Não são as chaves que o `GET`
        devolve.

        O conjunto de valores válidos **depende da definição**, e é por isso que
        um valor correto noutro sítio pode ser recusado aqui: `contacts` vale
        para `status` e é recusado em `readreceipts`, que só aceita `all` e
        `none`. A comparação é sensível a maiúsculas — `ALL` é recusado.

        Nome desconhecido e valor fora do conjunto produzem erros DIFERENTES de
        propósito (`invalid_privacy_setting` e `invalid_privacy_value`): quem
        chama precisa de saber qual dos dois errou. A validação corre antes de
        qualquer chamada ao WhatsApp.

        **Resposta**: devolve as definições resultantes, com a mesma forma do
        `GET`. **Não medido** — a rota altera a conta e não foi chamada.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              privacy_setting: status
              value: contacts
            schema:
              $ref: '#/components/schemas/PedidoDefinicaoPrivacidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  CallAdd: all
                  GroupAdd: all
                  LastSeen: contacts
                  Online: all
                  Profile: all
                  ReadReceipts: all
                  Status: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: |
            Definição alterada; devolve as definições resultantes. A forma vem
            do caso de uso, que propaga o que o WhatsApp devolve — **não foi
            observada em campo**, porque a rota altera a conta.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_privacy_value
                  message: invalid value "contacts" for privacy setting "readreceipts"
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nome desconhecido (`invalid_privacy_setting`), valor fora do
            conjunto daquele nome (`invalid_privacy_value`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Alterar uma definição de privacidade
      tags:
        - Contactos e utilizadores
  /user/profile/{jid}:
    get:
      description: |
        Junta identidades (número e LID), presença na rede, aparelhos, recado e
        foto de perfil, a partir de QUALQUER uma das identidades do contacto.

        **Quando usar**: quando se recebe um `@lid` de um evento e se quer o
        perfil sem saber de antemão qual endpoint chamar. É a rota que dispensa
        o cliente de encadear `/user/lid`, `/user/info` e `/user/avatar`.

        **Regras**: o identificador vai no CAMINHO e aceita número nu, JID de
        telefone ou LID — a resolução é leniente e aplica o servidor por omissão
        quando falta o `@`. Uma cadeia que não é nem número (7 a 20 dígitos) nem
        contém `@` é recusada com `invalid_jid` antes de chegar ao WhatsApp
        (F238, onde uma cadeia de lixo provocava um `500`).

        **A regra que muda o cliente**: cada peça do perfil é obtida
        separadamente e **degrada em vez de falhar**. O que não se conseguiu
        obter aparece em `unavailable`, com o motivo, e o pedido devolve `200`
        na mesma. Por isso `on_whatsapp` é `null` quando a pergunta não pôde ser
        feita — `null` e `false` significam coisas diferentes aqui.

        **Autenticação**: token de sessão.
      parameters:
        - $ref: '#/components/parameters/JidNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  avatar_id: ""
                  avatar_url: ""
                  jid: 554192421234@s.whatsapp.net
                  lid: 90937376170214@lid
                  on_whatsapp: true
                  query: 554192421234@s.whatsapp.net
                  unavailable:
                    avatar: avatar hidden by privacy settings
                  user_info:
                    554192421234@s.whatsapp.net:
                      Devices:
                        - 554192421234@s.whatsapp.net
                        - 554192421234:41@s.whatsapp.net
                      LID: 90937376170214@lid
                      PictureID: ""
                      Status: ""
                      VerifiedName: null
                  verified_name: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PerfilUtilizador'
                    type: object
          description: |
            O perfil consolidado. Medido: o exemplo abaixo é uma resposta real,
            com a foto indisponível por privacidade e o resto obtido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_jid
                  message: jid must be a phone number or a qualified JID (user@server)
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Identificador ausente no caminho (`missing_jid`), identificador que
            não é nem número nem JID (`invalid_jid`), ou sessão inexistente
