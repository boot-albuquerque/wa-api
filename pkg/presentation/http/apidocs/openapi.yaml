        nada que distinga "desligou de propósito" de "escreveu mal".

        **O campo do grupo é `group_jid`**, todo em minúsculas
        (`pkg/domain/group.go:186`).

        **Leitura de volta**: `GET /groups/{group_jid}` devolve
        `DisappearingTimer` em SEGUNDOS — `86400` para as 24 horas que aqui se
        pedem como texto.

        **Autenticação**: token de sessão.
