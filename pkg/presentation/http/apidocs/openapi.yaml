  /user/unblock:
    post:
      description: |
        Retira um contacto da lista de bloqueados da conta.

        **ESTA ROTA ESTÁ INOPERANTE HOJE**, exactamente como `POST /user/block`:
        as mesmas quatro combinações medidas em 2026-08-26 devolveram `422
        upstream_rejected`, com o mesmo `info query returned status 400:
        bad-request` no log. As duas partilham o mesmo caminho de escrita da
        lista, e por isso falham juntas. Causa por apurar — F264 no
        `HOUSEKEEP.md`.

        **Regras**, para quando voltar a funcionar: basta um de `JID` ou
        `Phone`, com `JID` a ganhar quando os dois vierem, e a resolução aceita
        número nu (F203).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoBloqueio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Blocklist: []
                  DHash: "1787412261963655"
                  Details: User unblocked
                  JID: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoBloqueio'
                    type: object
          description: |
            Desbloqueio aceite. **Nunca observado em campo** — forma derivada do
            código (`unblock_user.go:70-80`).
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone_or_jid
                  message: missing Phone or JID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nem `Phone` nem `JID` no corpo (`missing_phone_or_jid`),
            identificador que não parseia (`invalid_phone_or_jid`), corpo
            ilegível (`could_not_decode_payload`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          content:
            application/json:
              example:
                code: 422
                error:
                  code: upstream_rejected
                  message: WhatsApp refused this request; repeating it unchanged will not help
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **É o que esta rota devolve hoje, em todas as combinações medidas.**
            Ver F264.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Desbloquear um contacto
      tags:
        - Contactos e utilizadores
security:
  - TokenSessao: []
servers:
  - description: Instância local de desenvolvimento
    url: http://localhost:8080
tags:
  - description: |
      Ciclo de vida da ligação ao WhatsApp — emparelhar, ligar, desligar, ler o
      QR code e consultar o estado e o perfil da conta ligada.
    name: Sessões
  - description: |
      Todas as formas de enviar mensagem: texto, mídia, localização, contacto,
      enquete, botões, lista, carrossel, modelo e encaminhamento.
    name: Envio de mensagens
  - description: |
      O que se faz *depois* de a mensagem existir — reagir, editar, apagar,
      favoritar, marcar como lida — e a gestão da conversa: arquivar, fixar,
      silenciar, temporizar e listar histórico.
    name: Conversas
  - description: |
      Recupera o conteúdo binário de uma mensagem de mídia recebida, a partir do
      descritor que veio na própria mensagem.
    name: Descarga de mídia
  - description: |
      Criar e administrar grupos: participantes, nome, tópico, foto, links de
      convite, aprovação de entrada e definições de quem pode escrever.
    name: Grupos
  - description: |
      Comunidades são grupos-pai que agregam sub-grupos. Aqui ligam-se e
      desligam-se grupos, e listam-se sub-grupos e participantes.
    name: Comunidades
  - description: |
      Canais de difusão (newsletters): criar, seguir, publicar, reagir e gerir
      administradores, incluindo a transferência de posse.
    name: Canais
  - description: |
      Publicação de status (as "novidades" de 24 horas), com imagem, vídeo ou
      áudio.
    name: Status
  - description: |
      Consulta e gestão de terceiros: verificar se um número tem WhatsApp, ler
      perfis, resolver PN para LID, bloquear, e gerir presença e privacidade.
    name: Contactos e utilizadores
  - description: |
      Gestão das sessões do próprio wa-api — criar, listar, actualizar e apagar
      utilizadores. Usa o token de administração, não o token de sessão.
    name: Administração
  - description: |
      Webhooks, armazenamento S3, assinatura HMAC, proxy de saída, etiquetas e
      recusa de chamadas.
    name: Integrações e configuração
  - description: |
      Sondas de vivacidade e prontidão, para orquestradores e balanceadores.
    name: Saúde
