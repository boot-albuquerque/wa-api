            (`missing_chat`), `duration` ausente (`missing_duration`),
            `duration` fora do conjunto (`invalid_duration`), JID mal formado
            (`invalid_jid`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir o temporizador de mensagens temporárias da conversa
      tags:
        - Conversas
  /chat/ephemeral/default:
    post:
      description: |
        Define o prazo de desaparecimento que passa a valer para as conversas
        NOVAS desta conta.

        **Quando usar**: para que toda conversa iniciada a partir de agora
        nasça com mensagens temporárias, sem ter de as ligar uma a uma.

        **Regras**:

        - **Não altera conversa nenhuma que já exista.** Para essas, use
          `POST /chat/ephemeral`, conversa a conversa.
        - `duration` é texto e usa o mesmo conjunto: `"0"` ou `"off"`,
          `"24h"`, `"7d"`, `"90d"`. Fora dele é `400 invalid_duration`.
        - `duration` ausente é `400 missing_duration`, medido — não é o mesmo
          que enviar `"0"`.

        **Autenticação**: token de sessão.
      requestBody:
