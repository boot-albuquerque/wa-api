        directamente do banco.

        **Armadilha medida a 2026-08-26**: quando não há eventos subscritos,
        `subscribe` vem como `[""]` — uma lista com **uma string vazia**, e não
        uma lista vazia. É o resultado de partir por vírgula uma coluna vazia. Um
        cliente que conte `subscribe.length` vê `1` onde devia ver `0`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  subscribe:
                    - ""
                  webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ConfiguracaoWebhook'
                    type: object
          description: Configuração de webhook em vigor para esta sessão.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar o webhook da sessão
      tags:
        - Integrações e configuração
    post:
      description: |
        Grava o URL para onde os eventos desta sessão passam a ser entregues, e
        opcionalmente a lista de eventos.

        **Em que difere de `PUT /webhook`**, lido nos dois manipuladores:

        | | `POST` | `PUT` |
        |---|---|---|
        | campo `active` | **ignorado** | respeitado: `false` **limpa** URL e eventos |
        | `events` ausente ou vazio | não toca na coluna de eventos | idem |
        | corpo da resposta | só `{webhook}` | `{webhook, events, active}` |

        Ou seja: `POST` só define; **desligar um webhook faz-se com
        `PUT {"active": false}` ou com `DELETE /webhook`**.

        **Duas ressalvas ao "só define", lidas em `handler_webhook.go`:**

        1. O URL resolvido é gravado **sempre**, mesmo vazio. Um
           `POST /webhook {"events": ["Message"]}` sem nenhum dos dois nomes de
           URL **apaga o webhook gravado** e responde `200 {"webhook": ""}`.
           Reenvie sempre o URL.
        2. Uma lista `events` **só com nomes desconhecidos** também é
           "preenchida" para efeito da condição `len(events) > 0`: o `UPDATE`
           corre com a lista de válidos vazia e **apaga a subscrição gravada**,
           com `200`. Um único erro de digitação — `["Mesage"]` — cancela todas
           as subscrições sem aviso nenhum na resposta.

        **Dois nomes para o URL**: `webhookurl` e `webhook` são ambos aceites, em
        qualquer dos dois verbos — é herança de clientes antigos. Quando os dois
        vierem no mesmo corpo, **`webhookurl` vence**.

        **Eventos desconhecidos são DESCARTADOS em silêncio**, com um aviso no
        log, e a chamada devolve `200`. Não há `400` aqui — ao contrário de
        `POST /admin/users`, que recusa. Confira em `GET /webhook` o que ficou
        efectivamente subscrito.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              events:
                - Message
                - Receipt
                - ReadReceipt
              webhookurl: https://exemplo.com.br/wa-api/eventos
            schema:
              $ref: '#/components/schemas/PedidoWebhook'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  webhook: https://exemplo.com.br/wa-api/eventos
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          webhook:
                            description: |
                              O URL efectivamente gravado — o resultado da
                              resolução entre `webhookurl` e `webhook`. **Sempre
                              presente**, nunca `null`; vem `""` quando o corpo
                              não trouxe nenhum dos dois, caso em que o webhook
                              gravado foi apagado.
                            example: https://exemplo.com.br/wa-api/eventos
                            nullable: false
                            type: string
                        type: object
                    type: object
          description: URL gravado. O corpo ecoa o URL que ficou em vigor.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_request
                  message: Requisição inválida.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível. **Envelope ANTIGO**: `error` é a string
            `"bad request"`, e não o objecto `{code, message}` — esta recusa usa
            `fmt.Errorf` e não passa pela taxonomia (F266).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Definir o webhook da sessão
      tags:
        - Integrações e configuração
    put:
      description: |
        A variante que sabe **desligar**: ao contrário de `POST /webhook`, este
        verbo lê o campo `active`, e `active: false` grava URL e eventos
        **vazios**, seja qual for o resto do corpo.

        **`active` é obrigatório na prática, e a omissão é destrutiva.** O campo
        é `bool` e não `*bool` em Go, logo **ausente, `null` e `false` são
        indistinguíveis** — e os três limpam. Um
        `PUT /webhook {"webhook": "https://…"}` sem `active` **apaga** o webhook
        em vez de o definir. Envie sempre `active: true` quando quiser gravar.

        Com `active: true` o comportamento é o do `POST`, com uma resposta mais
        completa: devolve também a lista de eventos aceites e o próprio `active`,
        o que permite ver de imediato quais dos eventos pedidos sobreviveram à
        validação.

        **Eventos desconhecidos são descartados em silêncio** e não aparecem em
        `events` na resposta — é aí que se confirma o que ficou.

        **Os dois nomes de URL** valem aqui também: `webhookurl` e `webhook`, com
        `webhookurl` a vencer quando ambos vierem.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              active: true
              events:
                - Message
                - Receipt
              webhook: https://exemplo.com.br/wa-api/eventos
            schema:
              $ref: '#/components/schemas/PedidoWebhook'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  active: true
                  events:
                    - Message
                    - Receipt
                  webhook: https://exemplo.com.br/wa-api/eventos
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RespostaWebhookAtualizado'
                    type: object
          description: |
            Configuração gravada. `events` traz **apenas os eventos válidos**.

            **As três chaves aparecem sempre.** O manipulador devolve um mapa,
            e não a struct de domínio, logo não há `omitempty`: `active` vem
            mesmo quando `false`, e `events` vem **`null`** — não ausente, não
            `[]` — quando nenhum evento sobreviveu à validação. Quem iterar sem
            verificar parte.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_request
                  message: Requisição inválida.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível. **Envelope ANTIGO**, com `error` em texto simples
            (F266).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Actualizar ou desligar o webhook da sessão
      tags:
        - Integrações e configuração
  /webhook/history:
    get:
      description: |
        **O nome engana, e isto é um achado registado (HOUSEKEEP F252.)** Esta
        rota **não** tem nada que ver com um registo de entregas de webhook: ela
        lê a coluna `users.history`, que é **quantas mensagens são gravadas** por
        conversa no banco local.

        `0` significa gravação **desactivada**, e é resposta legítima — o campo
        `history` vem sempre presente, sem `omitempty`, exactamente para que o
        zero seja distinguível de "campo ausente".

        **Para LER o histórico de mensagens de uma conversa** use
        `GET /chat/history`, que é outro manipulador e outra coisa.

        Lê o **banco**, e não a cache de sessão: um valor recém-escrito noutro
        processo aparece aqui.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  history: 100
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LimiteHistorico'
                    type: object
          description: Limite em vigor. Medido a 2026-08-26 na sessão `filarapida`.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar o limite de gravação de mensagens
      tags:
        - Integrações e configuração
    post:
      description: |
        **Leia isto antes de chamar**: apesar do caminho, esta rota **configura o
        histórico de MENSAGENS**, não um registo de entregas de webhook. Ela
        escreve a coluna `users.history`, a mesma que governa a gravação em
        `message_history`. O achado está registado como **F252** no `HOUSEKEEP.md`.

        **É o mesmo manipulador de `POST /session/history`** — os dois caminhos
        são a mesma operação. O caminho antigo mantém-se para não partir clientes
        existentes.

        **Regras** (lidas em `set_history.go`):

        - `history` **não pode ser negativo**: dá `400 invalid_history`.
        - `0` é válido e significa **desactivar** a gravação.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              history: 100
            schema:
              $ref: '#/components/schemas/PedidoLimiteHistorico'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: History configured successfully
                  history: 100
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LimiteHistorico'
                    type: object
          description: Limite gravado. O corpo ecoa o valor que ficou em vigor.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_history
                  message: history cannot be negative
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), sessão sem identificador
            (`missing_session_id`), ou valor negativo (`invalid_history`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Definir o limite de gravação de mensagens
      tags:
        - Integrações e configuração
security:
  - TokenSessao: []
servers:
  - description: Instância local de desenvolvimento
    url: http://localhost:8080
tags:
  - description: |
      Ciclo de vida da ligação ao WhatsApp — emparelhar, ligar, desligar, ler o
      QR code e consultar o estado e o perfil da conta ligada.
    name: Sessões
  - description: |
      Todas as formas de enviar mensagem: texto, mídia, localização, contacto,
      enquete, botões, lista, carrossel, modelo e encaminhamento.
    name: Envio de mensagens
  - description: |
      O que se faz *depois* de a mensagem existir — reagir, editar, apagar,
      favoritar, marcar como lida — e a gestão da conversa: arquivar, fixar,
      silenciar, temporizar e listar histórico.
    name: Conversas
  - description: |
      Recupera o conteúdo binário de uma mensagem de mídia recebida, a partir do
      descritor que veio na própria mensagem.
    name: Descarga de mídia
  - description: |
      Criar e administrar grupos: participantes, nome, tópico, foto, links de
      convite, aprovação de entrada e definições de quem pode escrever.
    name: Grupos
  - description: |
      Comunidades são grupos-pai que agregam sub-grupos. Aqui ligam-se e
      desligam-se grupos, e listam-se sub-grupos e participantes.
    name: Comunidades
  - description: |
      Canais de difusão (newsletters): criar, seguir, publicar, reagir e gerir
      administradores, incluindo a transferência de posse.
    name: Canais
  - description: |
      Publicação de status (as "novidades" de 24 horas), com imagem, vídeo ou
      áudio.
    name: Status
  - description: |
      Consulta e gestão de terceiros: verificar se um número tem WhatsApp, ler
      perfis, resolver PN para LID, bloquear, e gerir presença e privacidade.
    name: Contactos e utilizadores
  - description: |
      Gestão das sessões do próprio wa-api — criar, listar, actualizar e apagar
      utilizadores. Usa o token de administração, não o token de sessão.
    name: Administração
  - description: |
      Webhooks, armazenamento S3, assinatura HMAC, proxy de saída, etiquetas e
      recusa de chamadas.
    name: Integrações e configuração
  - description: |
      Sondas de vivacidade e prontidão, para orquestradores e balanceadores.
    name: Saúde
