                    success: false
                missing_carousel_fields:
                  summary: Falta `Phone`, o corpo, ou a lista de cartões — recusa única para os três
                  value:
                    code: 400
                    error:
                      code: missing_carousel_fields
                      message: missing Phone, Body or Cards
                    success: false
                no_valid_cards:
                  summary: Todos os cartões descartados — medido em 2026-08-26 com um cartão sem `Buttons`
                  value:
                    code: 400
                    error:
                      code: no_valid_cards
                      message: 'no valid cards after normalisation, accepted button types: reply, cta_url, cta_call, copy'
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
