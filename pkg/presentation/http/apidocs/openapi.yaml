  /chat/send/edit:
    post:
      description: |
        Substitui o texto de uma mensagem que a própria conta enviou. O cliente do
        destinatário desenha a marca de "editada".

        **Quando usar**: corrigir um erro numa mensagem recente sem a apagar e
        reenviar. Para revogar, use `/chat/delete/message`.

        **Regras**:
        - `Id` é o `message_id` da mensagem a editar, e `Body` é o novo texto.
        - **A ordem de validação é observável**: `Phone` e `Body` são verificados
          primeiro, e o `Id` só DEPOIS de `Phone` ter sido parseado. Um pedido com
          `Phone` inválido E `Id` ausente responde `invalid_phone`, e não
          `missing_id`.
        - `StanzaId` e `Participant` preservam a citação da mensagem original, e
          são opcionais.
        - **`message_id` na resposta é o da mensagem EDITADA** (o `Id` que foi
          enviado), e não o de uma mensagem nova — a edição não cria mensagem.

        **Não determinado com segurança pela implementação atual**: a janela de
        tempo em que o WhatsApp aceita uma edição. O serviço não a verifica; uma
        mensagem antiga demais é recusada a montante e chega aqui como
        `422 upstream_rejected`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Body: Bom dia! O seu pedido sai para entrega às 15h.
              Id: 3EB0A4B2AFD45E625C0917
              Phone: 554192421234@s.whatsapp.net
