  /user/avatar:
    post:
      description: |
        **Esta rota LÊ.** Apesar do método `POST` e do nome, ela não altera a
        foto de conta nenhuma: devolve o URL da foto de perfil do contacto
        indicado (`GetAvatarUseCase`, `pkg/application/usecase/user/get_avatar.go`).
        O `POST` existe só porque o alvo vai no corpo.

        **Quando usar**: para mostrar a foto de um contacto. A imagem NÃO vem no
        corpo — vem o URL, temporário e assinado pelo WhatsApp, e é dele que se
        baixa.

        **Regras**: `Phone` é obrigatório e aceita número nu, JID de telefone ou
        LID. `Preview: true` devolve a miniatura; o padrão é a imagem em tamanho
        cheio.

        **As duas recusas que não são falhas**, e que são distintas de propósito:
        `404` quando o contacto **não tem** foto pública, e `403` quando **tem**
        mas a escondeu por privacidade. A diferença importa: a primeira não muda
        se se voltar a tentar, a segunda muda se a pessoa mudar a definição.

        **Ressalva de formato**: nessas duas respostas o campo `error` é uma
        STRING (`"not found"`, `"forbidden"`) e não o objecto `{code,message}` —
        os sentinelas de avatar não passam pela taxonomia `apperr`. É o mesmo
        desvio catalogado como F266. Medido.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
              Preview: true
            schema:
              $ref: '#/components/schemas/PedidoAvatar'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: "1735689600"
                  url: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Avatar'
                    type: object
          description: Ponteiro para a foto. A imagem baixa-se do `url`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone
                  message: missing Phone in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Phone` ausente (`missing_phone`), corpo ilegível
            (`could_not_decode_payload`), identificador que não parseia
            (`invalid_phone`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error: forbidden
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O contacto TEM foto, mas escondeu-a por privacidade. Medido — e
            repare no `error` em string, não no objecto.
        "404":
          content:
            application/json:
              example:
                code: 404
                error: not found
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O contacto não tem foto de perfil pública. É o caso comum, não uma
            falha do servidor. `error` em string, como no `403`.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Obter a foto de perfil de um contacto
      tags:
        - Contactos e utilizadores
  /user/block:
    post:
      description: |
        Acrescenta um contacto à lista de bloqueados da conta.

        **ESTA ROTA ESTÁ INOPERANTE HOJE.** Medida em 2026-08-26 em quatro
        combinações — conta WhatsApp Business e conta pessoal, número real e
        número inexistente, identificador em número e em LID — e as quatro
        devolveram `422 upstream_rejected`. O log mostra o WhatsApp a responder
        `info query returned status 400: bad-request`. Não é o número, não é a
        forma do identificador e não é o tipo de conta: as quatro variáveis
        foram isoladas. **A causa está por apurar** e está registada como F264
        no `HOUSEKEEP.md`; a hipótese em aberto é a forma da consulta que
        enviamos. `GET /user/blocklist` continua a funcionar — é só a escrita
        que é recusada.

        **Regras**, para quando voltar a funcionar: basta um de `JID` ou
        `Phone`, com `JID` a ganhar quando os dois vierem. A resolução é
        LENIENTE por decisão registada (F203): um número nu é aceite.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoBloqueio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Blocklist:
                    - 554192421234@s.whatsapp.net
                  DHash: "1787412261963655"
                  Details: User blocked
                  JID: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoBloqueio'
                    type: object
          description: |
            Bloqueio aceite. **Nunca observado em campo** — a forma abaixo vem
            do código (`block_user.go:71-81`), não de medição.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone_or_jid
                  message: missing Phone or JID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nem `Phone` nem `JID` no corpo (`missing_phone_or_jid`),
            identificador que não parseia (`invalid_phone_or_jid`), corpo
            ilegível (`could_not_decode_payload`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          content:
            application/json:
              example:
                code: 422
                error:
                  code: upstream_rejected
                  message: WhatsApp refused this request; repeating it unchanged will not help
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **É o que esta rota devolve hoje, em todas as combinações medidas.**
            O pedido chegou ao WhatsApp e foi recusado; repeti-lo sem mudança
            não ajuda. Ver F264.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Bloquear um contacto
      tags:
        - Contactos e utilizadores
  /user/blocklist:
    get:
      description: |
        Devolve os JIDs bloqueados pela conta, com o hash com que o WhatsApp
        versiona a lista.

        **Quando usar**: para saber, antes de enviar, se um destino está
        bloqueado; e para detectar mudanças na lista comparando o `DHash` em
        vez de percorrer as entradas.

        **Ressalva de formato, medida**: esta é a única rota do grupo que **NÃO
        usa o envelope comum**. O manipulador serializa o resultado e escreve-o
        directamente (`handler_blocklist.go:66-73`), portanto a resposta é
        `{"Blocklist":[…],"DHash":"…"}` — sem `code`, sem `data`, sem `success`.
        Um cliente que leia `data` encontra `undefined` aqui.

        **Contraste com a escrita**: esta LEITURA funciona. As duas rotas que
        alteram a lista (`POST /user/block` e `POST /user/unblock`) estão hoje
        inoperantes — ver a descrição delas.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                Blocklist: []
                DHash: "1787412261963655"
              schema:
                $ref: '#/components/schemas/ListaBloqueados'
          description: |
            A lista de bloqueados, **sem envelope**. Medido: numa conta sem
            bloqueios, `Blocklist` vem como array vazio.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os contactos bloqueados
      tags:
        - Contactos e utilizadores
  /user/check:
    post:
      description: |
        Pergunta ao WhatsApp, em lote, quais dos números dados têm conta, e
        devolve o JID resolvido de cada um.

        **Quando usar**: antes de enviar para um número que veio de um
        formulário ou de uma importação de agenda. É a forma barata de
        descobrir que um número não existe, em vez de o descobrir num envio
        falhado.

        **Regras**: `phone` é sempre um ARRAY, mesmo para um número só. O valor
        pode ir NU (`554192421234`) — foi assim que foi medido. Um número sem
        conta devolve `is_in_whatsapp: false` dentro de um `200`: **não é
        erro**, é a resposta.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone:
                - "554192421234"
            schema:
              $ref: '#/components/schemas/PedidoVerificacaoNumero'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - is_in_whatsapp: true
                    jid: 554192421234@s.whatsapp.net
                    query: "554192421234"
                    verified_name: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/ResultadoVerificacaoNumero'
                        type: array
                    type: object
          description: Uma entrada por número consultado.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Verificar se números têm WhatsApp
      tags:
        - Contactos e utilizadores
  /user/contacts:
    get:
      description: |
        Devolve todos os contactos que a sessão conhece, num objecto indexado
        por JID.

        **Quando usar**: para construir uma agenda local, ou para dar nome a
        JIDs que chegam em eventos. Não há paginação — vem tudo de uma vez.

        **Regra que muda o que se faz com isto**: **nas contas com endereçamento
        LID as chaves vêm em `@lid`**, não em número. Medido: numa conta com 461
        contactos, a totalidade das chaves era `@lid`. Quem quiser casar isto
        com uma agenda por telefone precisa de resolver cada LID —
        `GET /user/profile/{jid}` faz a tradução nos dois sentidos.

        **Segunda ressalva medida**: `FullName` costuma vir VAZIO e o nome real
        está em `PushName`. Numa conta WhatsApp Business, 460 dos 461 contactos
        tinham só `PushName`. Um cliente que leia apenas `FullName` vê uma
        agenda sem nomes.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  90937376170214@lid:
                    BusinessName: ""
                    FirstName: ""
                    Found: true
                    FullName: ""
                    PushName: Janio Gonzalez
                    RedactedPhone: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Roster'
                    type: object
          description: O roster inteiro, indexado por JID.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar o roster inteiro da conta
      tags:
        - Contactos e utilizadores
  /user/contacts/last-activity:
    get:
      description: |
        Devolve, por JID, o instante da mensagem mais recente daquela conversa.

        **De onde vem o dado**: do histórico LOCAL — o `HistorySync` que chega
        depois do pareamento, mais as mensagens correntes. **Não** é uma
        consulta ao WhatsApp, e por isso responde depressa e não depende de a
        sessão estar ligada.

        **Quando usar**: para ordenar uma lista de conversas por actividade sem
        pedir o histórico de cada uma.

        **Regras**: as chaves são normalizadas para o espaço LID quando o
        mapeamento é conhecido, de propósito, para casarem com as de
        `GET /user/contacts` — sem isso os dois lados vivem em espaços de
        identidade diferentes e quase nada casa (medido: 0 de 1141 contactos
        casavam por telefone). Um número sem LID conhecido mantém a chave em
        `@s.whatsapp.net`, e grupos aparecem em `@g.us`. Quando a sessão está
        em espera, a normalização é saltada e o dado sai cru — **degrada, não
        falha**.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  554192421234@s.whatsapp.net: "2026-08-24T18:56:53.796034-04:00"
                  90937376170214@lid: "2026-08-24T18:56:53.836029-04:00"
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UltimaAtividadePorConversa'
                    type: object
          description: Instante da última mensagem, por JID de conversa.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar o instante da última mensagem de cada conversa
      tags:
        - Contactos e utilizadores
  /user/contacts/sync:
    post:
      description: |
        Força a busca do patch de app-state que carrega a agenda de contactos.
        É o que se chama quando `GET /user/contacts` devolve menos contactos do
        que o telemóvel mostra, ou nomes desactualizados.

        **É capacidade distinta de `POST /user/history/sync`**, não uma variante
        dela: aquela pede mensagens ao dispositivo principal, esta puxa a
        agenda. Nenhuma faz o trabalho da outra.

        **O `200` significa que o pedido foi FEITO**, não que a agenda já
        chegou: os contactos entram depois, por eventos de app-state
        (`AppState`, `AppStateSyncComplete`). Confirme relendo
        `GET /user/contacts`.

        **Regras**: `mode` é obrigatório e aceita **exactamente** três valores —
        `if_unsynced`, `incremental` e `full`. Qualquer outro é
        `400 invalid_sync_mode`. Em particular `delta` **não existe**, apesar de
        parecer plausível. Exige um cliente vivo.

        **Custo de cada modo**: `if_unsynced` não faz nada se a agenda já
        estiver sincronizada; `incremental` é uma busca barata que preserva a
        versão local; `full` refaz o instantâneo completo e é caro — não o use
        em laço.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              mode: if_unsynced
            schema:
              $ref: '#/components/schemas/PedidoSincronizacaoContactos'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: contact roster sync requested
                  mode: if_unsynced
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoSincronizacaoContactos'
                    type: object
          description: Pedido de sincronização despachado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_sync_mode
                  message: 'mode must be one of: if_unsynced, incremental, full'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `invalid_sync_mode` (valor fora dos três aceites, incluindo o campo
            em falta), `no_session`, `missing_session_id` ou
            `decode_payload_failed`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Forçar a sincronização da agenda de contactos
      tags:
        - Sessões
  /user/history/sync:
    post:
      description: |
        Pede ao dispositivo principal as mensagens **anteriores** a uma que o
        chamador já tem. É assim que se recupera histórico antigo de uma
        conversa, que o WhatsApp não entrega por iniciativa própria depois do
        emparelhamento.

        **O pedido é sempre relativo a uma âncora**, e é por isso que cinco dos
        campos descrevem uma mensagem já conhecida. Sem âncora o protocolo não
        tem "antes de quê" responder.

        **Regras**:

        - `chat_jid` é obrigatório — sem ele, `400 missing_chat_jid`;
        - `oldest_msg_id` é obrigatório — sem ele, `400 missing_oldest_msg_id`.
          É a âncora, e aceitar o pedido sem ela seria responder `200` sem nada
          acontecer;
        - `count` ausente, zero ou negativo assume **50**, o lote recomendado
          pela biblioteca;
        - exige um cliente vivo (`400 no_session`);
        - o corpo pode ser omitido sem erro de decodificação, mas aí cai nas
          duas recusas acima.

        **O `200` é o despacho, não a entrega.** A resposta traz o id do PEDIDO
        em `details`; as mensagens chegam depois, como um evento `HistorySync`
        do tipo ON_DEMAND — pelo webhook e por `GET /session/ws`, se a sessão
        subscrever `HistorySync`. `count` na resposta é o que foi PEDIDO, nunca
        o que chegou. `timestamp` sai sempre `0`: nada o preenche.

        **Só grava se o histórico estiver ligado.** Com `history = 0` — o valor
        de origem — as mensagens que chegarem não entram em `message_history`.
        Chame `POST /session/history` antes.

        **Uma ressalva de formato de erro**: um corpo que não seja JSON válido
        é recusado aqui com o envelope ANTIGO, `error` em texto simples
        (`{"code":400,"error":"bad request","success":false}`), e não com o
        objecto `{code,message}` — o manipulador passa o erro cru de
        decodificação em vez do erro tipado (F266). As restantes recusas desta
        rota usam o envelope normal.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              chat_jid: 554192421234@s.whatsapp.net
              count: 50
              oldest_msg_from_me: true
              oldest_msg_id: 3EB0A4B2AFD45E625C0917
              oldest_msg_timestamp: 1787747900
            schema:
              $ref: '#/components/schemas/PedidoSincronizacaoHistorico'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  chat_jid: 554192421234@s.whatsapp.net
                  count: 50
                  details: 3EB0A4B2AFD45E625C0917
                  oldest_msg_from_me: true
                  oldest_msg_id: 3EB0A4B2AFD45E625C0917
                  oldest_msg_timestamp: 1787747900
                  timestamp: 0
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoSincronizacaoHistorico'
                    type: object
          description: Pedido despachado ao dispositivo principal. As mensagens chegam depois, por evento.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_oldest_msg_id
                  message: 'oldest_msg_id é obrigatório: é a âncora a partir da qual se pede para trás'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `missing_chat_jid`, `missing_oldest_msg_id`, `no_session` ou
            `missing_session_id` — todos no envelope normal. Corpo mal formado
            sai no envelope ANTIGO, com `error` em texto simples (ver a
            descrição).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Pedir ao telemóvel as mensagens anteriores a uma âncora
      tags:
        - Sessões
  /user/info:
    post:
      description: |
        Devolve, por JID consultado, os aparelhos ligados àquela conta, o recado
        do perfil, o identificador da foto e o LID correspondente.

        **Quando usar**: quando é preciso saber em quantos aparelhos uma conta
        está, ou obter o LID de um número sem depender do mapeamento local que
        `GET /user/lid/{jid}` consulta.

        **Regras**: `phone` é um ARRAY. O manipulador acrescenta
        `@s.whatsapp.net` a todo valor sem `@` antes de resolver
        (`handler_user.go:normalizePhones`), pelo que número nu e JID completo
        funcionam os dois. Um valor que não parseia é **saltado em silêncio**,
        não recusado — a resposta simplesmente não o traz, e não há sinal
        distinguindo isso de "o servidor não sabe".

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone:
                - 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoInfoUtilizadores'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  users:
                    554192421234@s.whatsapp.net:
                      Devices:
                        - 554192421234@s.whatsapp.net
                        - 554192421234:41@s.whatsapp.net
                        - 554192421234:76@s.whatsapp.net
                      LID: 90937376170214@lid
                      PictureID: ""
                      Status: ""
                      VerifiedName: null
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/InfoUtilizadores'
                    type: object
          description: Bloco `users`, indexado pelo JID consultado.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar aparelhos, recado e identidade de contas
      tags:
        - Contactos e utilizadores
  /user/lid/{jid}:
    get:
      description: |
        Devolve o identificador de privacidade (`@lid`) correspondente a um
        número, consultando o mapeamento que a sessão mantém localmente.

        **Quando usar**: quando se tem um número e se precisa do LID para casar
        com dados que vêm em espaço LID — o roster de `GET /user/contacts`, por
        exemplo.

        **Regras**: a rota resolve o LID **DE** um número, logo o caminho tem de
        trazer um JID `@s.whatsapp.net`. Passar um `@lid` é recusado com
        `jid_not_pn` e `400` — não é falha nossa, é o pedido invertido (F182;
        antes disto o mesmo caso dava `500`).

        **A distinção entre `404` e `500`**: quando o mapeamento simplesmente
        não existe, a resposta é `404 lid_not_found`. Quando o armazenamento
        falha, é `500` — de propósito, porque nesse caso o cliente NÃO sabe se
        aquele número tem LID, e dizer-lhe "não encontrado" fá-lo-ia parar de
        tentar diante de uma falha passageira.

        **Autenticação**: token de sessão.
      parameters:
        - $ref: '#/components/parameters/JidNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  jid: 554192421234@s.whatsapp.net
                  lid: 90937376170214@lid
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResolucaoLID'
                    type: object
          description: O par número/LID. Medido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: jid_not_pn
                  message: 'this route resolves the LID OF a phone number: pass a @s.whatsapp.net jid, not @lid'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Identificador ausente (`missing_jid`), mal formado (`invalid_jid`),
            em LID quando devia ser número (`jid_not_pn`), ou sessão inexistente
            (`no_session`). O exemplo abaixo é a resposta medida ao passar um
            `@lid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: lid_not_found
                  message: LID not found for this number
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não há LID conhecido para este número.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Resolver o LID de um número
      tags:
        - Contactos e utilizadores
  /user/presence:
    post:
      description: |
        Marca a conta como online ou offline perante o WhatsApp.

        **Quando usar**: ao arrancar um serviço que vai atender conversas
        (`available`), e ao encerrá-lo (`unavailable`). É a conta INTEIRA, não
        uma conversa — para "a escrever…" numa conversa específica existe
        `POST /chat/presence`.

        **Regras**: `type` só aceita `available` e `unavailable`. Qualquer outro
        valor é recusado com `invalid_presence_type` antes de qualquer chamada
        ao WhatsApp.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              type: available
            schema:
              $ref: '#/components/schemas/PedidoPresenca'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Presence sent
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Presença enviada ao WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_presence_type
                  message: 'invalid presence type. Allowed values: ''available'', ''unavailable'''
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `type` fora do conjunto (`invalid_presence_type`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir a presença da própria conta
      tags:
        - Contactos e utilizadores
  /user/presence/subscribe:
    post:
      description: |
        Pede ao WhatsApp para passar a enviar notificações quando aquele
        contacto fica online ou offline.

        **Quando usar**: quando se quer saber que um contacto ficou disponível
        sem estar a perguntar em ciclo. As notificações chegam depois pelos
        canais de eventos (WebSocket, webhook), **não** nesta resposta.

        **Regras**: `Phone` é obrigatório e aceita número nu, JID de telefone ou
        LID. O `200` diz que a subscrição foi pedida — não garante que alguma
        notificação venha a chegar, que depende também da privacidade do
        contacto.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoSubscricaoPresenca'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Presence subscription updated
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Subscrição pedida ao WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone
                  message: missing Phone in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Phone` ausente (`missing_phone`), identificador que não parseia
            (`invalid_phone`), corpo ilegível (`could_not_decode_payload`) ou
            sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Subscrever a presença de um contacto
      tags:
        - Contactos e utilizadores
  /user/privacy:
    get:
      description: |
        Devolve as definições de privacidade em vigor na conta ligada.

        **Quando usar**: para saber quem vê o último acesso, a foto e os status
        antes de contar com uma dessas coisas. A privacidade de status, em
        particular, é o que decide para quem uma publicação em
        `POST /status/set/*` pode ir.

        **A ressalva que apanha quem escreve um cliente**: leitura e escrita
        usam **vocabulários diferentes**. Aqui as chaves vêm em `PascalCase`
        (`GroupAdd`, `LastSeen`, `ReadReceipts`…); o `POST` neste mesmo caminho
        recebe o nome em minúsculas (`groupadd`, `last`, `readreceipts`…). E a
        leitura devolve TRÊS chaves que a escrita não conhece — `Messages`,
        `Defense` e `Stickers` não constam da tabela de validação
        (`pkg/domain/privacy.go:54-62`), logo não são definíveis por esta API.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  CallAdd: all
                  Defense: "off"
                  GroupAdd: all
                  LastSeen: contacts
                  Messages: all
                  Online: all
                  Profile: all
                  ReadReceipts: all
                  Status: contacts
                  Stickers: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: As definições em vigor. O exemplo é uma resposta medida.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Ler as definições de privacidade da conta
      tags:
        - Contactos e utilizadores
    post:
      description: |
        Altera UMA definição de privacidade da conta ligada. O caminho é o mesmo
        da leitura, e o manipulador despacha por método
        (`pkg/bootstrap/wiring_routes.go:209-215`).

        **Quando usar**: com cuidado — isto muda a conta real, e o efeito é
        visível para terceiros.

        **Regras**: `privacy_setting` vai em MINÚSCULAS e é uma das sete que a
        tabela do domínio conhece: `groupadd`, `last`, `status`, `profile`,
        `readreceipts`, `online`, `calladd`. Não são as chaves que o `GET`
        devolve.

        O conjunto de valores válidos **depende da definição**, e é por isso que
        um valor correto noutro sítio pode ser recusado aqui: `contacts` vale
        para `status` e é recusado em `readreceipts`, que só aceita `all` e
        `none`. A comparação é sensível a maiúsculas — `ALL` é recusado.

        Nome desconhecido e valor fora do conjunto produzem erros DIFERENTES de
        propósito (`invalid_privacy_setting` e `invalid_privacy_value`): quem
        chama precisa de saber qual dos dois errou. A validação corre antes de
        qualquer chamada ao WhatsApp.

        **Resposta**: devolve as definições resultantes, com a mesma forma do
        `GET`. **Não medido** — a rota altera a conta e não foi chamada.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              privacy_setting: status
              value: contacts
            schema:
              $ref: '#/components/schemas/PedidoDefinicaoPrivacidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  CallAdd: all
                  GroupAdd: all
                  LastSeen: contacts
                  Online: all
                  Profile: all
                  ReadReceipts: all
                  Status: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: |
            Definição alterada; devolve as definições resultantes. A forma vem
            do caso de uso, que propaga o que o WhatsApp devolve — **não foi
            observada em campo**, porque a rota altera a conta.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_privacy_value
                  message: invalid value "contacts" for privacy setting "readreceipts"
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nome desconhecido (`invalid_privacy_setting`), valor fora do
            conjunto daquele nome (`invalid_privacy_value`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Alterar uma definição de privacidade
      tags:
        - Contactos e utilizadores
  /user/profile/{jid}:
    get:
      description: |
        Junta identidades (número e LID), presença na rede, aparelhos, recado e
        foto de perfil, a partir de QUALQUER uma das identidades do contacto.

        **Quando usar**: quando se recebe um `@lid` de um evento e se quer o
        perfil sem saber de antemão qual endpoint chamar. É a rota que dispensa
        o cliente de encadear `/user/lid`, `/user/info` e `/user/avatar`.

        **Regras**: o identificador vai no CAMINHO e aceita número nu, JID de
        telefone ou LID — a resolução é leniente e aplica o servidor por omissão
        quando falta o `@`. Uma cadeia que não é nem número (7 a 20 dígitos) nem
        contém `@` é recusada com `invalid_jid` antes de chegar ao WhatsApp
        (F238, onde uma cadeia de lixo provocava um `500`).

        **A regra que muda o cliente**: cada peça do perfil é obtida
        separadamente e **degrada em vez de falhar**. O que não se conseguiu
        obter aparece em `unavailable`, com o motivo, e o pedido devolve `200`
        na mesma. Por isso `on_whatsapp` é `null` quando a pergunta não pôde ser
        feita — `null` e `false` significam coisas diferentes aqui.

        **Autenticação**: token de sessão.
      parameters:
        - $ref: '#/components/parameters/JidNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  avatar_id: ""
                  avatar_url: ""
                  jid: 554192421234@s.whatsapp.net
                  lid: 90937376170214@lid
                  on_whatsapp: true
                  query: 554192421234@s.whatsapp.net
                  unavailable:
                    avatar: avatar hidden by privacy settings
                  user_info:
                    554192421234@s.whatsapp.net:
                      Devices:
                        - 554192421234@s.whatsapp.net
                        - 554192421234:41@s.whatsapp.net
                      LID: 90937376170214@lid
                      PictureID: ""
                      Status: ""
                      VerifiedName: null
                  verified_name: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PerfilUtilizador'
                    type: object
          description: |
            O perfil consolidado. Medido: o exemplo abaixo é uma resposta real,
            com a foto indisponível por privacidade e o resto obtido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_jid
                  message: jid must be a phone number or a qualified JID (user@server)
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Identificador ausente no caminho (`missing_jid`), identificador que
            não é nem número nem JID (`invalid_jid`), ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Reunir num pedido só tudo o que se sabe de um contacto
      tags:
        - Contactos e utilizadores
  /user/status:
    post:
      description: |
        Altera o **recado** do perfil — o texto que aparece como "Sobre" no
        WhatsApp. Muda a conta, e é visível para quem a puder ver segundo as
        definições de privacidade.

        **Isto NÃO publica uma story.** A rota `POST /status/set/text` já
        existiu, apontava para este mesmo manipulador e não publicava status
        nenhum — quem a chamava julgava publicar e estava a mudar o perfil. Foi
        removida (F229). Para publicar status efémero há
        `POST /status/set/image`, `/video` e `/audio`; status de TEXTO não é uma
        capacidade que exista.

        **Regras**: `Body` é obrigatório — vazio é `400 missing_body`. Exige um
        cliente vivo.

        **Onde confirmar**: o recado aparece em `GET /session/profile/full`, no
        campo `Status` dentro de `user_info`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Body: Atendimento das 9h às 18h
            schema:
              $ref: '#/components/schemas/PedidoRecado'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoRecado'
                    type: object
          description: Recado alterado. `details` vem vazio.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_body
                  message: missing Body in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: '`missing_body`, `no_session`, `missing_session_id` ou `decode_payload_failed`.'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir o recado do perfil da conta
      tags:
        - Sessões
  /user/unblock:
    post:
      description: |
        Retira um contacto da lista de bloqueados da conta.

        **ESTA ROTA ESTÁ INOPERANTE HOJE**, exactamente como `POST /user/block`:
        as mesmas quatro combinações medidas em 2026-08-26 devolveram `422
        upstream_rejected`, com o mesmo `info query returned status 400:
        bad-request` no log. As duas partilham o mesmo caminho de escrita da
        lista, e por isso falham juntas. Causa por apurar — F264 no
        `HOUSEKEEP.md`.

        **Regras**, para quando voltar a funcionar: basta um de `JID` ou
        `Phone`, com `JID` a ganhar quando os dois vierem, e a resolução aceita
        número nu (F203).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoBloqueio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Blocklist: []
                  DHash: "1787412261963655"
                  Details: User unblocked
                  JID: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoBloqueio'
                    type: object
          description: |
            Desbloqueio aceite. **Nunca observado em campo** — forma derivada do
            código (`unblock_user.go:70-80`).
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_phone_or_jid
                  message: missing Phone or JID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nem `Phone` nem `JID` no corpo (`missing_phone_or_jid`),
            identificador que não parseia (`invalid_phone_or_jid`), corpo
            ilegível (`could_not_decode_payload`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          content:
            application/json:
              example:
                code: 422
                error:
                  code: upstream_rejected
                  message: WhatsApp refused this request; repeating it unchanged will not help
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **É o que esta rota devolve hoje, em todas as combinações medidas.**
            Ver F264.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Desbloquear um contacto
      tags:
        - Contactos e utilizadores
  /webhook:
    delete:
      description: |
        Limpa o URL **e** a lista de eventos desta sessão numa só operação. É o
        caminho directo para o mesmo efeito de `PUT /webhook {"active": false}`,
        sem precisar de corpo.

        Não recebe corpo nenhum, e o que for enviado é ignorado.

        Depois desta chamada, `GET /webhook` devolve `webhook: ""` e
        `subscribe: [""]` — a lista com uma string vazia descrita naquela rota.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Webhook and events deleted successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Webhook e eventos removidos.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Remover o webhook da sessão
      tags:
        - Integrações e configuração
    get:
      description: |
        Devolve o URL configurado e a lista de eventos subscritos, lidos
        directamente do banco.

        **Armadilha medida a 2026-08-26**: quando não há eventos subscritos,
        `subscribe` vem como `[""]` — uma lista com **uma string vazia**, e não
        uma lista vazia. É o resultado de partir por vírgula uma coluna vazia. Um
        cliente que conte `subscribe.length` vê `1` onde devia ver `0`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  subscribe:
                    - ""
                  webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ConfiguracaoWebhook'
                    type: object
          description: Configuração de webhook em vigor para esta sessão.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar o webhook da sessão
      tags:
        - Integrações e configuração
    post:
      description: |
        Grava o URL para onde os eventos desta sessão passam a ser entregues, e
        opcionalmente a lista de eventos.

        **Em que difere de `PUT /webhook`**, lido nos dois manipuladores:

        | | `POST` | `PUT` |
        |---|---|---|
        | campo `active` | **ignorado** | respeitado: `false` **limpa** URL e eventos |
        | `events` ausente ou vazio | não toca na coluna de eventos | idem |
        | corpo da resposta | só `{webhook}` | `{webhook, events, active}` |

        Ou seja: `POST` só define; **desligar um webhook faz-se com
        `PUT {"active": false}` ou com `DELETE /webhook`**.

        **Dois nomes para o URL**: `webhookurl` e `webhook` são ambos aceites, em
        qualquer dos dois verbos — é herança de clientes antigos. Quando os dois
        vierem no mesmo corpo, **`webhookurl` vence**.

        **Eventos desconhecidos são DESCARTADOS em silêncio**, com um aviso no
        log, e a chamada devolve `200`. Não há `400` aqui — ao contrário de
        `POST /admin/users`, que recusa. Confira em `GET /webhook` o que ficou
        efectivamente subscrito.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              events:
                - Message
                - Receipt
                - ReadReceipt
              webhookurl: https://exemplo.com.br/wa-api/eventos
            schema:
              $ref: '#/components/schemas/PedidoWebhook'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  webhook: https://exemplo.com.br/wa-api/eventos
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          webhook:
                            description: O URL efectivamente gravado.
                            example: https://exemplo.com.br/wa-api/eventos
                            type: string
                        type: object
                    type: object
          description: URL gravado. O corpo ecoa o URL que ficou em vigor.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            Corpo ilegível. **Envelope ANTIGO**: `error` é a string
            `"bad request"`, e não o objecto `{code, message}` — esta recusa usa
            `fmt.Errorf` e não passa pela taxonomia (F266).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir o webhook da sessão
      tags:
        - Integrações e configuração
    put:
      description: |
        A variante que sabe **desligar**: ao contrário de `POST /webhook`, este
        verbo lê o campo `active`, e `active: false` grava URL e eventos
        **vazios**, seja qual for o resto do corpo.

        Com `active: true` o comportamento é o do `POST`, com uma resposta mais
        completa: devolve também a lista de eventos aceites e o próprio `active`,
        o que permite ver de imediato quais dos eventos pedidos sobreviveram à
        validação.

        **Eventos desconhecidos são descartados em silêncio** e não aparecem em
        `events` na resposta — é aí que se confirma o que ficou.

        **Os dois nomes de URL** valem aqui também: `webhookurl` e `webhook`, com
        `webhookurl` a vencer quando ambos vierem.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              active: true
              events:
                - Message
                - Receipt
              webhook: https://exemplo.com.br/wa-api/eventos
            schema:
              $ref: '#/components/schemas/PedidoWebhook'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  active: true
                  events:
                    - Message
                    - Receipt
                  webhook: https://exemplo.com.br/wa-api/eventos
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RespostaWebhookAtualizado'
                    type: object
          description: |
            Configuração gravada. `events` traz **apenas os eventos válidos**;
            vem ausente quando nenhum sobreviveu à validação.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            Corpo ilegível. **Envelope ANTIGO**, com `error` em texto simples
            (F266).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Actualizar ou desligar o webhook da sessão
      tags:
        - Integrações e configuração
  /webhook/history:
    get:
      description: |
        **O nome engana, e isto é um achado registado (HOUSEKEEP F252.)** Esta
        rota **não** tem nada que ver com um registo de entregas de webhook: ela
        lê a coluna `users.history`, que é **quantas mensagens são gravadas** por
        conversa no banco local.

        `0` significa gravação **desactivada**, e é resposta legítima — o campo
        `History` vem sempre presente, sem `omitempty`, exactamente para que o
        zero seja distinguível de "campo ausente".

        **Para LER o histórico de mensagens de uma conversa** use
        `GET /chat/history`, que é outro manipulador e outra coisa.

        Lê o **banco**, e não a cache de sessão: um valor recém-escrito noutro
        processo aparece aqui.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  History: 100
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LimiteHistorico'
                    type: object
          description: Limite em vigor. Medido a 2026-08-26 na sessão `filarapida`.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar o limite de gravação de mensagens
      tags:
        - Integrações e configuração
    post:
      description: |
        **Leia isto antes de chamar**: apesar do caminho, esta rota **configura o
        histórico de MENSAGENS**, não um registo de entregas de webhook. Ela
        escreve a coluna `users.history`, a mesma que governa a gravação em
        `message_history`. O achado está registado como **F252** no `HOUSEKEEP.md`.

        **É o mesmo manipulador de `POST /session/history`** — os dois caminhos
        são a mesma operação. O caminho antigo mantém-se para não partir clientes
        existentes.

        **Regras** (lidas em `set_history.go`):

        - `history` **não pode ser negativo**: dá `400 invalid_history`.
        - `0` é válido e significa **desactivar** a gravação.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              history: 100
            schema:
              $ref: '#/components/schemas/PedidoLimiteHistorico'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: History configured successfully
                  History: 100
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LimiteHistorico'
                    type: object
          description: Limite gravado. O corpo ecoa o valor que ficou em vigor.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_history
                  message: history cannot be negative
                success: false
              schema:
