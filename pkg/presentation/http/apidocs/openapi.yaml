                    code: 400
                    error:
                      code: could_not_decode_payload
                      message: could not decode payload
                    success: false
                invalid_phone:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_phone
                      message: could not parse Phone
                    success: false
                missing_body:
                  summary: Corpo vazio
                  value:
                    code: 400
                    error:
                      code: missing_body
                      message: missing Body in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                no_session:
                  summary: Token válido, mas a sessão não está ligada ao WhatsApp
                  value:
                    code: 400
                    error:
                      code: no_session
                      message: no session
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Payload recusado antes de qualquer envio. `error.code` diz qual regra
            falhou.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma mensagem de texto
      tags:
        - Envio de mensagens
  /chat/send/video:
    post:
      description: |
        Envia um vídeo, com legenda opcional. Mesmos dois transportes da imagem:
        URI de dados ou URL http(s) buscada pelo servidor.

        **Quando usar**: conteúdo que deve tocar dentro da conversa. Um vídeo
        enviado por `/chat/send/document` chega como ficheiro para descarregar.

        **Regras**:
        - A discriminação da URI de dados é a mais FROUXA das rotas de mídia:
          bastam os quatro primeiros caracteres serem `data`, sem os dois-pontos.
          Qualquer MIME declarado passa.
        - Teto de **100 MB**.
        - **Piso de 256 bytes** (`send_video.go:36`): abaixo disso é
          `400 video_too_small`, verificado ANTES de qualquer envio. Medido em
          2026-08-26 com uma URI de dados de 6 bytes.
        - O MIME final vem de `MimeType` quando dado; senão é farejado dos bytes.
          Se não for de vídeo, é `400 invalid_video_mime_type`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Caption: O vídeo da montagem.
              Phone: 554192421234@s.whatsapp.net
              Video: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
            schema:
              $ref: '#/components/schemas/PedidoEnvioVideo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Vídeo subido e mensagem aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                invalid_video_mime_type:
                  summary: O tipo resolvido não é de vídeo
                  value:
                    code: 400
                    error:
                      code: invalid_video_mime_type
                      message: resolved MIME type is not a video type
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_video:
                  summary: Campo `Video` vazio
                  value:
                    code: 400
                    error:
                      code: missing_video
                      message: missing Video in payload
                    success: false
                unsupported_video_source:
                  summary: Nem prefixo `data`, nem URL http(s)
                  value:
                    code: 400
                    error:
                      code: unsupported_video_source
                      message: Video data should start with "data:video/mp4;base64," or be an http(s) URL
                    success: false
                video_fetch_failed:
                  summary: A URL não pôde ser buscada
                  value:
                    code: 400
                    error:
                      code: video_fetch_failed
                      message: failed to fetch video from url
                    success: false
                video_too_large:
                  summary: Acima de 100 MB
                  value:
                    code: 400
                    error:
                      code: video_too_large
                      message: video payload exceeds size limit
                    success: false
                video_too_small:
                  summary: Menos de 256 bytes — medido em 2026-08-26
                  value:
                    code: 400
                    error:
                      code: video_too_small
                      message: video payload too small to be valid
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar um vídeo
      tags:
        - Envio de mensagens
  /community/link:
    post:
      description: |
        Torna um grupo existente sub-grupo de uma comunidade. Medido a
        2026-08-26: o sub-grupo passa a aparecer em
        `POST /community/subgroups`, e o cliente do WhatsApp mostra a mensagem de
        sistema *"O grupo X foi adicionado"* (F237).

        **Regras**: `communityJID` e `groupJID` são ambos obrigatórios — a
        ausência de cada um tem o seu próprio código
        (`missing_community_jid`, `missing_group_jid`). Esta rota **não** aceita
        o alias universal `chat`: a struct do pedido não o inclui.

        **Resposta**: `data` traz apenas a confirmação textual
        `{"Details": "Group linked to community successfully"}`, escrita pelo
        manipulador — não vem do WhatsApp. Confirme o efeito por
        `POST /community/subgroups`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoLigacaoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group linked to community successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Grupo ligado à comunidade.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_group_jid
                  message: missing groupJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID` ou o `groupJID`, ou um deles não é
            interpretável como JID (`invalid_jid`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Ligar um grupo a uma comunidade
      tags:
        - Comunidades
  /community/participants:
    post:
      description: |
        Devolve os participantes de **todos** os grupos ligados à comunidade,
        reunidos numa lista só.

        **Os identificadores vêm em LID**, não em número — medido a 2026-08-26.
        Quem precisar do telefone tem de resolver o LID por outra rota; esta não
        devolve PN.

        **Regras**: `communityJID` é obrigatório, é um JID `@g.us`, e o alias
        universal `chat` também é aceite.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
            schema:
              $ref: '#/components/schemas/PedidoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  participants:
                    - 90937376170214@lid
                    - 29343770251463@lid
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ParticipantesComunidade'
                    type: object
          description: Os participantes, em LID, dentro da chave `participants`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_community_jid
                  message: could not parse community JID "xxx"
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID`, ou ele não é um JID que se consiga
            interpretar — neste caso o código é `invalid_community_jid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os participantes dos grupos de uma comunidade
      tags:
        - Comunidades
  /community/subgroups:
    post:
      description: |
        Lista os grupos ligados a uma comunidade.

        **Onde nasce uma comunidade**: não há rota `/community/create`. Uma
        comunidade cria-se em `POST /group/create` com `is_parent: true` — é um
        grupo-pai, e é por isso que o identificador dela é `@g.us` e não um
        servidor próprio. Essa rota pertence à etiqueta **Grupos**.

        **A lista nunca vem vazia numa comunidade real**: o grupo de avisos é
        criado automaticamente com a comunidade e aparece sempre, marcado com
        `IsDefaultSubGroup: true`. Medido a 2026-08-26, com a transição
        1 → 2 → 1 provocada por `POST /community/link` e
        `POST /community/unlink` (F237).

        **Regras**: `communityJID` é obrigatório e é um JID de GRUPO (`@g.us`),
        porque a comunidade é um grupo-pai. O alias universal `chat` também é
        aceite, e só é usado quando `communityJID` vem vazio.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
            schema:
              $ref: '#/components/schemas/PedidoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  sub_groups:
                    - IsDefaultSubGroup: true
                      JID: 120363411669320145@g.us
                      Name: Avisos
                      NameSetAt: "2026-08-26T08:08:21-04:00"
                      NameSetBy: ""
                      NameSetByPN: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SubGruposComunidade'
                    type: object
          description: Os grupos ligados à comunidade, dentro da chave `sub_groups`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_community_jid
                  message: missing communityJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `communityJID`, ou ele não é um JID que se consiga
            interpretar.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os sub-grupos de uma comunidade
      tags:
        - Comunidades
  /community/unlink:
    post:
      description: |
        Retira um grupo da comunidade. O grupo continua a existir — deixa apenas
        de ser sub-grupo. Medido a 2026-08-26, com a contagem de sub-grupos a
        voltar de 2 para 1 e a mensagem de sistema *"O grupo X foi removido"* no
        cliente (F237).

        **Regra que a medição confirmou**: o grupo de avisos
        (`IsDefaultSubGroup: true`) nasce com a comunidade e permanece — foi ele
        que sobrou quando a contagem voltou a 1.

        **Regras**: `communityJID` e `groupJID` são obrigatórios; o alias `chat`
        não é aceite aqui.

        **Resposta**: `data` traz a confirmação textual
        `{"Details": "Group unlinked from community successfully"}`, escrita pelo
        manipulador. Confirme por `POST /community/subgroups`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              communityJID: 120363430034334401@g.us
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoLigacaoComunidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group unlinked from community successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Grupo desligado da comunidade.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_community_jid
                  message: missing communityJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `communityJID` ou o `groupJID`, ou um deles não é um JID válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Desligar um grupo de uma comunidade
      tags:
        - Comunidades
  /group/announce:
    post:
      description: |
        Liga ou desliga o modo anúncio: com ele ligado, só administradores
        enviam mensagens no grupo. O estado resultante aparece em
        `POST /group/info` como `IsAnnounce`.

        **Quando usar**: em grupos de difusão — avisos de turno, comunicados —
        onde a conversa de volta é ruído.

        **Regras**: `announce` ausente vale `false`, logo um pedido só com o
        grupo ABRE o grupo em vez de o consultar. O manipulador não valida
        campo nenhum: um pedido sem grupo chega à resolução do JID e falha lá,
        com `invalid_jid`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              announce: true
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoAnuncioGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group announce set successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: O WhatsApp aceitou a mudança.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Fechar ou abrir o grupo à escrita de não-administradores
      tags:
        - Grupos
  /group/create:
    post:
      description: |
        Cria um grupo com os participantes indicados. A MESMA rota cria as três
        coisas, e o que as distingue são dois campos opcionais:

        - sem nenhum deles: grupo normal, e `participants` é obrigatório;
        - `is_parent: true`: **comunidade**. O WhatsApp cria sozinho o
          sub-grupo de avisos, que passa a aparecer em `POST /group/list` com
          `IsDefaultSubGroup: true`. Aqui `participants` deixa de ser exigido;
        - `linked_parent_jid`: grupo criado já DENTRO da comunidade indicada.

        **Quando usar**: no arranque de uma operação, para montar a estrutura
        de uma vez. Para ligar um grupo que já existe a uma comunidade, a rota
        é `POST /community/link`, não esta.

        **Regras**: `name` é obrigatório. `is_parent` e `linked_parent_jid` são
        mutuamente exclusivos — os dois juntos devolvem `400` sem contactar o
        WhatsApp. Uma entrada vazia em `participants` é recusada com o índice
        dela. Participante que o WhatsApp recuse individualmente não faz o
        pedido falhar: volta na lista com `Error` diferente de zero.

        **Formato do erro `400`**: esta rota usa `rejectMissingField`
        (`handler_group_mgmt.go:99`) e responde no envelope ANTIGO,
        `{"code":400,"error":"bad request","success":false}`, com `error` em
        STRING. Um cliente que leia `error.code` parte aqui. É o achado F266.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              name: Equipa de entregas
              participants:
                - 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoCriarGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  AddressingMode: lid
                  IsParent: false
                  JID: 120363411669320145@g.us
                  LinkedParentJID: ""
                  Name: Equipa de entregas
                  OwnerJID: 90937376170214@lid
                  OwnerPN: 554192421234@s.whatsapp.net
                  Participants:
                    - AddRequest: null
                      Error: 0
                      IsAdmin: true
                      IsSuperAdmin: true
                      JID: 90937376170214@lid
                      LID: 90937376170214@lid
                      PhoneNumber: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/InfoGrupo'
                    type: object
          description: |
            Grupo criado. O corpo traz os metadados completos do grupo novo,
            na mesma forma que `POST /group/info` devolve.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `name` ausente, `participants` ausente ou vazio num grupo normal,
            ou `is_parent` e `linked_parent_jid` no mesmo pedido.

            **Formato antigo (F266)**: `error` vem em texto simples.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Criar um grupo, uma comunidade ou um sub-grupo
      tags:
        - Grupos
  /group/ephemeral:
    post:
      description: |
        Liga as mensagens temporárias com uma das três durações reconhecidas,
        ou desliga-as.

        **Quando usar**: em grupos operacionais cujo histórico não deve
        persistir.

        **Regra que morde**: só `24h`, `7d` e `90d` são reconhecidos
        (`group_management.go:229-241`). **Qualquer outro valor DESLIGA o
        temporizador**, responde `200`, e regista um aviso no log — incluindo
        um erro de escrita como `"24H"` ou `"1d"`. Do lado do cliente não há
        nada que distinga "desligou de propósito" de "escreveu mal".

        **O campo do grupo é `groupjid`**, todo em minúsculas
        (`pkg/domain/group.go:186`).

        **Leitura de volta**: `POST /group/info` devolve `DisappearingTimer` em
        SEGUNDOS — `86400` para as 24 horas que aqui se pedem como texto.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              duration: 24h
              groupjid: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoTemporizadorGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Disappearing timer set
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: |
            Temporizador definido. Repare que este `200` também cobre o caso em
            que a duração não foi reconhecida e o temporizador foi DESLIGADO.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir o tempo das mensagens temporárias do grupo
      tags:
        - Grupos
  /group/info:
    post:
      description: |
        Devolve o retrato completo de um grupo: nome, descrição, definições,
        comunidade a que pertence e a lista de participantes com quem é
        administrador.

        **Quando usar**: sempre que precisar da contagem de membros ou de saber
        quem é administrador. `POST /group/list` traz a mesma forma mas
        **devolve `ParticipantCount` a zero** — medido no mesmo minuto, para o
        mesmo grupo, contra o `2` correcto desta rota.

        **Regras**: `groupJID` é obrigatório; a recusa é `400 missing_group_jid`.
        Um JID que não seja de grupo devolve `400 invalid_group_jid`.

        **Erros**: `missing_group_jid`, `invalid_group_jid`, `no_session`
        quando a sessão existe mas não está emparelhada. Estes vêm no envelope
        NOVO, com `error` em objecto — ao contrário das rotas de escrita desta
        família.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/AlvoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  group_info:
                    AddressingMode: lid
                    CreatorCountryCode: BR
                    DisappearingTimer: 86400
                    GroupCreated: "2026-08-26T08:42:47-04:00"
                    IsAnnounce: false
                    IsEphemeral: true
                    IsJoinApprovalRequired: false
                    IsLocked: false
                    IsParent: false
                    JID: 120363411669320145@g.us
                    LinkedParentJID: ""
                    MemberAddMode: admin_add
                    Name: Equipa de entregas
                    NameSetAt: "2026-08-26T08:42:49-04:00"
                    OwnerJID: 90937376170214@lid
                    OwnerPN: 554192421234@s.whatsapp.net
                    ParticipantCount: 2
                    Participants:
                      - AddRequest: null
                        Error: 0
                        IsAdmin: false
                        IsSuperAdmin: false
                        JID: 90937376170214@lid
                        LID: 90937376170214@lid
                        PhoneNumber: 554192421234@s.whatsapp.net
                    Suspended: false
                    Topic: Combinações de rota do turno da manhã
                    TopicID: 3EB0A4B2AFD45E625C0917
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoInfoGrupo'
                    type: object
          description: Metadados do grupo no instante do pedido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_group_jid
                  message: missing groupJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `groupJID` ausente (`missing_group_jid`), impossível de resolver
            (`invalid_group_jid`), corpo que não é JSON
            (`could_not_decode_payload`), ou sessão por emparelhar
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar os metadados de um grupo
      tags:
        - Grupos
  /group/inviteinfo:
    post:
      description: |
        Lê os metadados do grupo que está por trás de um convite, **sem
        aderir** e sem gerar pedido de entrada. É a rota a chamar antes de
        `POST /group/join`.

        **Quando usar**: para saber quantos membros tem, quem é o dono, e
        sobretudo se `IsJoinApprovalRequired` é verdadeiro — nesse caso
        `POST /group/join` produz uma SOLICITAÇÃO em vez de uma entrada.

        **Regras**: o campo chama-se `Code`, com maiúscula
        (`pkg/domain/group.go:42-44`); `inviteLink` devolve
        `400 missing_code`. O valor é o código nu. **Medido**: o URL completo
        também devolve `200`, porque a biblioteca corta o prefixo
        (`internal/wa-noise/capabilities/group/invite.go:83`).

        **Ressalva medida**: a resposta traz `AnnounceVersionID`,
        `ParticipantVersionID` e `MemberAddMode` VAZIOS, ao contrário de
        `POST /group/info` sobre o mesmo grupo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Code: IVccRoDVSbpHKNkgNxyZx4
            schema:
              $ref: '#/components/schemas/PedidoInfoConvite'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  invite_info:
                    AnnounceVersionID: ""
                    IsJoinApprovalRequired: false
                    JID: 120363411669320145@g.us
                    MemberAddMode: ""
                    Name: Equipa de entregas
                    OwnerJID: 90937376170214@lid
                    OwnerPN: 554192421234@s.whatsapp.net
                    ParticipantCount: 2
                    ParticipantVersionID: ""
                    Participants:
                      - AddRequest: null
                        Error: 0
                        IsAdmin: false
                        IsSuperAdmin: false
                        JID: 90937376170214@lid
                        LID: 90937376170214@lid
                        PhoneNumber: 554192421234@s.whatsapp.net
                    Topic: Combinações de rota do turno da manhã
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoInfoConvite'
                    type: object
          description: Metadados do grupo por trás do convite.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_code
                  message: missing Code in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `Code` ausente (`missing_code`), corpo inválido
            (`could_not_decode_payload`), ou sessão por emparelhar
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          content:
            application/json:
              example:
                code: 500
                error: internal server error
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O convite foi revogado, é inválido, ou o WhatsApp não respondeu.
            Ao contrário de `/group/info`, esta rota NÃO traduz a recusa do
            WhatsApp para `422`: o use case embrulha o erro com `fmt.Errorf`
            (`get_group_invite_info.go:44`), logo a recusa de convite chega
            como `500` de texto genérico.
      security:
        - TokenSessao: []
      summary: Inspecionar um convite sem entrar no grupo
      tags:
        - Grupos
  /group/invitelink:
    post:
      description: |
        Devolve o link de convite actual do grupo. **Não o revoga**: o
        adaptador chama o SDK com o sinalizador de reposição a falso
        (`pkg/infra/wa-noise/adapters/group/read.go:44`), logo chamadas
        repetidas devolvem o mesmo link. Não há rota nesta API para revogar um
        link.

        **Quando usar**: para distribuir acesso a um grupo sem adicionar
        pessoa a pessoa.

        **Cuidado ao encadear com `POST /group/join`**: esta rota devolve o
        **link inteiro** (`https://chat.whatsapp.com/…`) e o `join` documenta o
        **código nu**. Alimentar um no outro só funciona porque a biblioteca
        corta o prefixo, e não porque o contrato o promete.

        **Regras**: `groupJID` é obrigatório (`missing_group_jid`); só um
        administrador obtém o link — o WhatsApp recusa aos outros, e a recusa
        chega traduzida como `422`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/AlvoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  invite_link: https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoLinkConvite'
                    type: object
          description: O link actual do grupo.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_group_jid
                  message: missing groupJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `groupJID` ausente (`missing_group_jid`), impossível de resolver
            (`invalid_group_jid`), corpo inválido
            (`could_not_decode_payload`), ou sessão por emparelhar
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Obter o link de convite de um grupo
      tags:
        - Grupos
  /group/join:
    post:
      description: |
        Faz a conta entrar no grupo por trás de um convite.

        **A struct de domínio MENTE aqui, e é a armadilha mais cara desta
        família.** `GroupJoinRequest` (`pkg/domain/group.go:52-54`) declara
        `inviteLink`, e **não é o que a rota lê**: o manipulador declara a sua
        própria struct anónima, com o campo `code`
        (`handler_group_mgmt.go:148-150`). Um cliente escrito a partir do
        domínio recebe `400`. É o achado F267.

        O valor é o **código nu** — `IVccRoDVSbpHKNkgNxyZx4` — e não o URL,
        que é o que `POST /group/invitelink` devolve.

        **Quando usar**: depois de `POST /group/inviteinfo`, que diz o que há
        do outro lado sem aderir.

        **Ressalva NÃO medida**: num grupo com `IsJoinApprovalRequired`, o
        protocolo transforma a entrada numa SOLICITAÇÃO pendente em vez de uma
        adesão. O manipulador devolve sempre a mesma frase de sucesso e não
        distingue os dois casos — se a conta entrou mesmo, confirme com
        `POST /group/list`. O comportamento exacto do código de estado nesse
        caso não foi determinado com segurança pela implementação actual.

        **Formato do erro `400`**: envelope ANTIGO, `error` em texto simples
        (F266).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              code: IVccRoDVSbpHKNkgNxyZx4
            schema:
              $ref: '#/components/schemas/PedidoEntrarGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group joined successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: |
            O pedido de entrada foi aceite pelo WhatsApp. **Não confirma que a
            conta está no grupo**: num grupo que exija aprovação, isto pode ser
            uma solicitação pendente.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `code` ausente ou vazio. **Formato antigo (F266)**: `error` vem em
            texto simples, e não diz qual campo faltou — a causa fica só no
            log.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Entrar num grupo por código de convite
      tags:
        - Grupos
  /group/joinapprovalmode:
    post:
      description: |
        Liga ou desliga a exigência de aprovação. Com ela ligada, quem segue o
        link de convite fica em espera, e passa a aparecer em
        `GET /group/requestparticipants` até um administrador decidir.

        **Quando usar**: em grupos cujo link circula, para filtrar quem entra
        sem revogar o link.

        **Regras**: o campo do grupo é `groupjid`, todo em minúsculas
        (`pkg/domain/group_request.go:40`). `mode` ausente vale `false`, logo
        um pedido só com o grupo **DESLIGA** a exigência — não a consulta.
        Para ler o estado actual use `IsJoinApprovalRequired` de
        `POST /group/info`.

        **Erros**: `missing_group_jid`, `invalid_group_jid`, `no_session`, no
        envelope novo — esta rota não passa por `rejectMissingField`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupjid: 120363411669320145@g.us
              mode: true
            schema:
              $ref: '#/components/schemas/PedidoModoAprovacao'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group join approval mode updated successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Modo de aprovação alterado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_group_jid
                  message: missing groupJID parameter
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `groupjid` ausente (`missing_group_jid`), impossível de resolver
            (`invalid_group_jid`), corpo inválido
            (`could_not_decode_payload`), ou sessão por emparelhar
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Exigir aprovação de administrador para entrar no grupo
      tags:
        - Grupos
  /group/leave:
    post:
      description: |
        Faz a conta sair do grupo. **É irreversível pela própria conta**: não
        há rota que a reponha, e voltar exige um convite novo ou que um
        administrador a adicione.

        **Quando usar**: no encerramento de uma operação. Para deixar de ver o
        grupo sem sair dele, arquive a conversa em vez disto.

        **Regras**: `groupJID` é obrigatório — a recusa vem do manipulador
        (`handler_group_mgmt.go:176`), no envelope antigo. `chat` é aceite como
        alternativa; o nome específico ganha quando os dois vierem.

        **Formato do erro `400`**: envelope ANTIGO, `error` em texto simples
        (F266).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/AlvoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group left successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: A saída foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `groupJID` e `chat` ambos ausentes. **Formato antigo (F266)**:
            `error` em texto simples.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Sair de um grupo
      tags:
        - Grupos
  /group/list:
    post:
      description: |
        Devolve todos os grupos de que a conta participa, cada um com os mesmos
        metadados que `POST /group/info` traz.

        **Quando usar**: para descobrir os JIDs dos grupos. É a rota de partida
        de quase tudo o resto desta família.

        **Ressalva MEDIDA, e que muda o que se pode fazer com a resposta**:
        `ParticipantCount` vem **zero** para todos os grupos aqui, enquanto
        `POST /group/info` sobre o mesmo grupo, no mesmo minuto, devolveu `2`.
        Para contar membros a partir desta listagem, conte `Participants`, que
        vem correcta.

        **O que a lista inclui**: comunidades (`IsParent: true`) e os
        sub-grupos de avisos que elas criam sozinhas
        (`IsDefaultSubGroup: true`) aparecem como entradas normais, ao lado dos
        grupos comuns.

        **Regras**: o corpo é ignorado — a rota não tem filtro nem paginação
        (`handler_group.go`, `ListGroupsUseCase`). Envie `{}`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              description: Sem campos. O corpo é lido e descartado.
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  groups:
                    - AddressingMode: lid
                      DisappearingTimer: 86400
                      IsAnnounce: false
                      IsDefaultSubGroup: false
                      IsEphemeral: true
                      IsLocked: false
                      IsParent: false
                      JID: 120363411669320145@g.us
                      LinkedParentJID: ""
                      MemberAddMode: admin_add
                      Name: Equipa de entregas
                      OwnerJID: 90937376170214@lid
                      OwnerPN: 554192421234@s.whatsapp.net
                      ParticipantCount: 0
                      Participants:
                        - AddRequest: null
                          Error: 0
                          IsAdmin: false
                          IsSuperAdmin: false
                          JID: 90937376170214@lid
                          LID: 90937376170214@lid
                          PhoneNumber: 554192421234@s.whatsapp.net
                      Suspended: false
                      Topic: Combinações de rota do turno da manhã
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoListaGrupos'
                    type: object
          description: Todos os grupos da sessão.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os grupos da sessão
      tags:
        - Grupos
  /group/locked:
    post:
      description: |
        Liga ou desliga a tranca: com ela ligada, só administradores mudam
        nome, descrição e foto do grupo. O estado resultante aparece em
        `POST /group/info` como `IsLocked`.

        **Quando usar**: em grupos grandes, para que a identidade do grupo não
        dependa da boa-fé de todos os membros.

        **Não confundir com `POST /group/announce`**: a tranca governa quem
        edita os METADADOS; o anúncio governa quem envia MENSAGENS. São
        independentes e podem estar ligados ao mesmo tempo.

        **Regras**: `locked` ausente vale `false`, logo um pedido só com o
        grupo DESTRANCA. O manipulador não valida campo nenhum: um pedido sem
        grupo falha adiante, com `invalid_jid`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
              locked: true
            schema:
              $ref: '#/components/schemas/PedidoTrancarGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group lock updated
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: O WhatsApp aceitou a mudança.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Trancar ou destrancar a edição dos metadados do grupo
      tags:
        - Grupos
  /group/name:
    post:
      description: |
        Renomeia o grupo. O nome novo aparece de imediato em
        `POST /group/info`, junto com `NameSetAt` e `NameSetBy`.

        **Quando usar**: para manter o nome alinhado com a operação — o nome é
        o que aparece na lista de conversas de cada membro.

        **Regras**: `name` é obrigatório e vazio é recusado. **É o único campo
        validado pelo manipulador** (`handler_group_mgmt.go:198`): um pedido
        sem `groupJID` passa esta validação e só falha adiante, na resolução do
        JID, com `invalid_jid` no envelope NOVO. As duas recusas desta rota
        têm portanto formatos diferentes.

        Num grupo com `IsLocked` verdadeiro, só administradores conseguem — a
        recusa vem do WhatsApp, como `422`.

        **Formato do erro `400` de campo em falta**: envelope ANTIGO, `error`
        em texto simples (F266).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
              name: Equipa de entregas — turno da manhã
            schema:
              $ref: '#/components/schemas/PedidoNomeGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group name set successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Nome alterado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `name` ausente ou vazio. **Formato antigo (F266)**: `error` em
            texto simples.

            Um `groupJID` ausente ou inválido produz `400` também, mas no
            envelope NOVO, com `error.code: invalid_jid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Mudar o nome de um grupo
      tags:
        - Grupos
  /group/photo:
    post:
      description: |
        Substitui a foto do grupo pela imagem enviada.

        **Duas armadilhas medidas, isoladas com uma variável de cada vez:**

        1. **A imagem vai em base64 CRU, sem o prefixo
           `data:image/jpeg;base64,`.** Os mesmos nomes de campo e a mesma
           imagem, com o prefixo, devolvem `400`; sem o prefixo, `200`. O
           descodificador do manipulador (`handler_group_mgmt.go:245`) rejeita
           os `:` e `;` do URI de dados antes de qualquer coisa sair da
           máquina. **Isto DIVERGE de `POST /chat/send/image`**, que aceita o
           URI de dados — as duas rotas recebem imagem e só uma o tolera.
        2. **A imagem tem de ser JPEG.** PNG é bem descodificado aqui e depois
           recusado pelo WhatsApp, com `422 upstream_rejected`.

        **Quando usar**: no arranque de um grupo, ou quando a identidade visual
        muda. Para tirar a foto sem pôr outra, use `POST /group/photo/remove`.

        **Regras**: `photo` é obrigatório; é o único campo validado
        (`handler_group_mgmt.go:242`). Num grupo com `IsLocked` verdadeiro, só
        administradores conseguem.

        **Formato do erro `400`**: envelope ANTIGO, `error` em texto simples,
        tanto para `photo` em falta como para base64 inválido (F266).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
              photo: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA==
            schema:
              $ref: '#/components/schemas/PedidoFotoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group photo set successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Foto definida.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `photo` ausente, ou não é base64 válido — é aqui que cai o prefixo
            `data:image/jpeg;base64,`. **Formato antigo (F266)**: `error` em
            texto simples, logo o cliente não distingue as duas causas pelo
            corpo.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          content:
            application/json:
              example:
                code: 422
                error:
                  code: upstream_rejected
                  message: WhatsApp refused this request; repeating it unchanged will not help
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O WhatsApp recusou a imagem. **A causa medida foi o formato**: PNG
            chega aqui, JPEG passa.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Definir a foto de um grupo
      tags:
        - Grupos
  /group/photo/remove:
    post:
      description: |
        Tira a foto do grupo, deixando-o sem imagem. É a mesma operação de
        `POST /group/photo` com conteúdo nulo
        (`group_management.go:174`), exposta como rota própria.

        **Quando usar**: para limpar a identidade visual sem escolher outra
        imagem.

        **Regra que morde**: o campo do grupo é `groupjid`, **todo em
        minúsculas** (`handler_group_mgmt.go:262`), ao contrário do
        `groupJID` das rotas vizinhas. Na prática o descodificador do Go casa
        nomes ignorando maiúsculas e as duas grafias funcionam; o exemplo traz
        a que foi medida.

        **O manipulador não valida campo nenhum**: um pedido sem grupo chega à
        resolução do JID e falha lá, com `invalid_jid` no envelope novo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupjid: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoRemoverFotoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group photo removed successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Foto removida.
        "400":
          $ref: '#/components/responses/CorpoInvalido'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Remover a foto de um grupo
      tags:
        - Grupos
  /group/requestparticipants:
    get:
      description: |
        Devolve quem pediu para entrar no grupo e ainda espera decisão. Só tem
        conteúdo em grupos com `IsJoinApprovalRequired` verdadeiro — nos outros
        devolve lista vazia, porque quem segue o link entra directamente.

        **É um `GET` que lê o CORPO JSON.** Serve-se bem com `curl -X GET -d`,
        mas quebra clientes e intermediários que assumem que um `GET` não tem
        corpo — muitos descartam-no em silêncio.

        **Medido, e é a saída para esse problema**: os parâmetros de query
        `?group_jid=` e `?chat=` funcionam igualmente
        (`handler_group.go:52-62`), e devolveram `200` nas três formas.
        **Prefira a query string**; o corpo existe por compatibilidade.

        **Regras**: sem grupo por nenhuma das três vias, a resposta é
        `400 could_not_decode_payload` — medido, e é uma mensagem que não
        descreve a causa real, que é o grupo em falta.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            JID do grupo. É a forma recomendada. Usada só quando o corpo não
            trouxe `groupJID`.
          in: query
          name: group_jid
          required: false
          schema:
            example: 120363411669320145@g.us
            type: string
        - description: |
            Nome universal do destino. Usado só quando nem o corpo nem
            `group_jid` trouxeram o grupo.
          in: query
          name: chat
          required: false
          schema:
            example: 120363411669320145@g.us
            type: string
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoSolicitacoesEntrada'
        required: false
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: []
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/SolicitacaoEntrada'
                        type: array
                    type: object
          description: |
            Os pedidos pendentes. **Medido em três chamadas, e as três
            devolveram `[]`** — os grupos disponíveis não exigiam aprovação,
            logo a forma de uma entrada preenchida não foi observada com dados
            e vem do tipo do protocolo.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: could_not_decode_payload
                  message: could not decode payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Grupo ausente nas três vias. A mensagem medida é
            `could_not_decode_payload`, e não `missing_group_jid`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar os pedidos de entrada pendentes de um grupo
      tags:
        - Grupos
  /group/topic:
    post:
      description: |
        Define a descrição (tópico) do grupo. Aparece em `POST /group/info`
        como `Topic`, com `TopicSetAt` e `TopicSetBy`.

        **Detalhe do protocolo que a resposta revela**: a descrição VIAJA como
        mensagem — por isso `TopicID` tem a forma de um `message_id`, e por
        isso a mudança aparece no grupo como evento de sistema.

        **Quando usar**: para deixar escrito no grupo o que ele é, sem depender
        de alguém repetir a regra.

        **Regras**: `topic` é obrigatório e vazio é recusado — **não há forma
        de APAGAR a descrição por esta rota**. É o único campo validado
        (`handler_group_mgmt.go:220`): sem `groupJID` a falha vem adiante, como
        `invalid_jid`. Num grupo com `IsLocked` verdadeiro, só administradores
        conseguem.

        **Formato do erro `400` de campo em falta**: envelope ANTIGO, `error`
        em texto simples (F266).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              groupJID: 120363411669320145@g.us
              topic: Combinações de rota do turno da manhã
            schema:
              $ref: '#/components/schemas/PedidoTopicoGrupo'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group topic set successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Descrição alterada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            `topic` ausente ou vazio. **Formato antigo (F266)**: `error` em
            texto simples.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Mudar a descrição de um grupo
      tags:
        - Grupos
  /group/updateparticipants:
    post:
      description: |
        Adiciona ou remove membros, vários de uma vez.

        **Limitação medida, e documentada aqui em vez de escondida (F263)**:
        `Action` aceita **só `add` e `remove`**
        (`group_management.go:272-281`). `promote` e `demote` devolvem
        `400 invalid_action` — `unknown participant action "promote" (must be
        "add" or "remove")`.

        A biblioteca por baixo sabe promover e despromover há anos
        (`internal/wa-noise/capabilities/group/participants.go:18-19`); é a
        rota que não o expõe. **A consequência é concreta: por esta API não há
        forma de dar nem de tirar administrador a ninguém.** Não há rota
        alternativa.

        **Quando usar**: para gerir o quadro de membros. Para decidir pedidos
        de entrada pendentes, a rota é
        `POST /group/updaterequestparticipants`, e o vocabulário lá é outro
        (`approve`/`reject`).

        **Regras e a ORDEM em que são aplicadas**, que muda a mensagem de erro:
        primeiro `Phone` não vazio, depois cada entrada de `Phone` não vazia,
        depois `Action`, e **só então** `groupJID`
        (`handler_group_mgmt.go:341-356`). Um pedido a que falte tudo queixa-se
        dos telefones.

        `Phone` aceita o **número nu** (`554192421234`) — medido a passar da
        validação. É uma diferença face a
        `POST /group/updaterequestparticipants`, que exige o JID completo.

        **Dois formatos de erro na mesma rota**: as recusas de campo em falta
        usam `rejectMissingField` e saem no envelope ANTIGO, com `error` em
        texto simples (F266); `invalid_action` e `invalid_jid` saem no envelope
        NOVO, com `error` em objecto. Um cliente tem de aguentar os dois.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Action: add
              Phone:
                - 554192421234@s.whatsapp.net
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoAtualizarParticipantes'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Participants updated
                  confirmed: true
                  result:
                    - AddRequest: null
                      Error: 0
                      IsAdmin: false
                      IsSuperAdmin: false
                      JID: 90937376170214@lid
                      LID: 90937376170214@lid
                      PhoneNumber: 554192421234@s.whatsapp.net
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoAtualizarParticipantes'
                    type: object
          description: |
            A mudança foi enviada e o WhatsApp devolveu a lista resultante.
            Participante que tenha falhado individualmente volta em `result`
            com `Error` diferente de zero — o `200` cobre o sucesso parcial.
        "400":
          content:
            application/json:
              examples:
                acaoDesconhecida:
                  description: |
                    `promote` e `demote` caem aqui: a biblioteca sabe fazê-los,
                    a rota não os expõe (F263).
                  summary: Formato NOVO — Action inválido
                  value:
                    code: 400
                    error:
                      code: invalid_action
                      message: unknown participant action "promote" (must be "add" or "remove")
                    success: false
                campoObrigatorioEmFalta:
                  description: |
                    `Phone` vazio, `Action` ausente ou `groupJID` ausente passam
                    por `rejectMissingField`, que não usa a taxonomia de erro —
                    `error` vem em texto simples (F266). Medido.
                  summary: Formato ANTIGO — campo obrigatório ausente
                  value:
                    code: 400
                    error: bad request
                    success: false
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Erro'
                  - $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            **Dois formatos possíveis.**

            `Phone` vazio, entrada vazia na lista, `Action` ausente ou
            `groupJID` ausente saem no formato ANTIGO (F266):
            `{"code":400,"error":"bad request","success":false}`.

            `Action` desconhecido — incluindo `promote` e `demote` — e JID
            irresolúvel saem no formato NOVO, como o exemplo abaixo.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Adicionar ou remover participantes de um grupo
      tags:
        - Grupos
  /group/updaterequestparticipants:
    post:
      description: |
        Decide os pedidos pendentes listados por
        `GET /group/requestparticipants`. É a contrapartida de
        `POST /group/joinapprovalmode`: sem a exigência de aprovação ligada,
        não há o que decidir.

        **Quando usar**: depois de ler os pendentes, para deixar entrar (ou
        não) quem seguiu o link.

        **Regra que morde, medida**: `Phone` exige o **JID COMPLETO**. O número
        nu `554192421234` devolve `400 invalid_phone`, porque este use case
        resolve com `ResolveQualifiedJID` e não com `ResolveJID`
        (`group_request.go:100`). **É uma divergência face a
        `POST /group/updateparticipants`**, que aceita o número nu — as duas
        rotas recebem uma lista chamada `Phone` e só uma tolera a forma curta.

        **Vocabulário próprio**: `Action` é `approve` ou `reject` — e não
        `add`/`remove`, que é o da outra rota. Qualquer outro valor devolve
        `400 invalid_action` (medido).

        **Erros**: `missing_group_jid`, `missing_phone`, `missing_action`,
        `invalid_group_jid`, `invalid_phone`, `invalid_action`, `no_session` —
        todos no envelope NOVO. Esta rota não passa por `rejectMissingField`.

        **Desfecho parcial**: o adaptador faz uma chamada por solicitante. Se
        algum falhar, a rota devolve erro — não há corpo que relate quais
        passaram.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Action: approve
              Phone:
                - 554192421234@s.whatsapp.net
              groupJID: 120363411669320145@g.us
            schema:
              $ref: '#/components/schemas/PedidoDecidirSolicitacoes'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: Group request participants updated successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Os pedidos foram decididos.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_phone
                  message: could not parse Phone
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Campo em falta, JID de grupo irresolúvel, telefone em forma curta
            (`invalid_phone`), ou `Action` fora de `approve`/`reject`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Aprovar ou rejeitar pedidos de entrada num grupo
      tags:
        - Grupos
  /health:
    get:
      description: |
        Devolve um retrato do processo: há quanto tempo está de pé, quantas
        sessões existem, quantas estão ligadas e autenticadas, e quantas
        goroutines correm.

        **Quando usar**: em painéis de operação e em diagnóstico, quando se quer
        saber *como* o serviço está, e não apenas se responde.

        **Autenticação**: exige token de sessão. É a diferença face às outras
        três sondas — esta expõe contagens da instalação, logo não fica aberta.
        Para sondas de orquestrador use `/livez` ou `/health/ready`, que não
        pedem credencial.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  active_connections: 2
                  connected_users: 2
                  goroutines: 285
                  logged_in_users: 2
                  memory_stats:
                    alloc_mb: 7
                    num_gc: 5
                    sys_mb: 26
                    total_alloc_mb: 11
                  status: ok
                  timestamp: "2026-08-26T13:17:14Z"
                  total_users: 2
                  uptime: 2m19.584700417s
                  version: 1.0.6
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SaudeDetalhada'
                    type: object
          description: Retrato do processo no instante do pedido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
      security:
        - TokenSessao: []
      summary: Consultar a saúde detalhada do serviço
      tags:
        - Saúde
  /health/live:
    get:
      description: |
        O mesmo manipulador de `/livez`, servido noutro caminho.

        **Por que existem os dois**: `/livez` é o que os manifestos implantados
        apontam hoje, e renomear uma sonda por baixo de uma implantação a correr
        torna todos os contentores insalubres ao mesmo tempo. `/health/live` é a
        forma nova; `/livez` fica como sinónimo.

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: '#/components/schemas/EstadoSonda'
          description: O processo está vivo.
      security: []
      summary: Verificar se o processo está vivo (caminho alternativo)
      tags:
        - Saúde
  /health/ready:
    get:
      description: |
        Sonda de prontidão. Ao contrário da vivacidade, **verifica dependências**
        — hoje, o banco de dados — e diz o resultado de cada uma em `checks`.

        **Quando usar**: como `readinessProbe`, e como porta do balanceador. Um
        processo vivo mas sem banco responde aqui de forma diferente, e é isso
        que evita mandar-lhe tráfego.

        **Também devolve `capabilities`**, com a configuração em vigor — por
        exemplo o modo de aglomerado (`cluster`), que em `single` significa que
        um segundo processo sobre o mesmo diretório de dados é recusado (ADR-0005).

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                capabilities:
                  cluster: single
                checks:
                  database: ok
                status: ready
              schema:
                $ref: '#/components/schemas/EstadoProntidao'
          description: |
            O serviço está pronto. Note que o estado vem no CORPO, em `status`, e
            não apenas no código HTTP — um `200` com `status` diferente de
            `ready` significa que alguma verificação não passou.
      security: []
      summary: Verificar se o serviço pode receber tráfego
      tags:
        - Saúde
  /hmac/config:
    delete:
      description: |
        Apaga a chave de assinatura desta sessão. A partir daí os webhooks
        passam a sair **sem assinatura**, e um destinatário que verifique a
        assinatura vai recusá-los — desligue a verificação do lado dele antes,
        ou a entrega deixa de funcionar em silêncio.

        Depois desta chamada, `GET /hmac/config` volta a devolver
        `hmac_key: ""`.

        Não recebe corpo.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: HMAC configuration deleted successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoHmac'
                    type: object
          description: |
            Chave revogada. `Enabled` vem `false` — logo, omitido do corpo, e a
            sua ausência é a confirmação.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Revogar a chave HMAC da sessão
      tags:
        - Integrações e configuração
    get:
      description: |
        Diz apenas se **existe** chave de assinatura para os webhooks desta
        sessão. `hmac_key` vem `""` quando não há chave e `"***"` quando há.

        **A chave nunca sai daqui**, nem em claro nem cifrada: devolvê-la
        transformaria uma leitura de configuração na fuga do segredo que assina
        todos os webhooks.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  hmac_key: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ConfiguracaoHmacLida'
                    type: object
          description: |
            Presença de chave. Medido a 2026-08-26 na sessão `filarapida`, que
            não tem chave configurada.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar se há chave HMAC configurada
      tags:
        - Integrações e configuração
    post:
      description: |
        **É exactamente a mesma operação de `POST /hmac/configure`** — o mesmo
        manipulador em dois caminhos, sem qualquer diferença de comportamento.
        O caminho curto nasceu do achado **F251**, em que ler era `/config`,
        escrever era `/configure`, e `POST /hmac/config` respondia
        `404 page not found` sem corpo nem pista.

        A chave assina os webhooks entregues por esta sessão, para que o
        destinatário possa verificar que o pedido veio mesmo daqui.

        **Regras** (lidas em `configure_hmac.go`):

        - `hmac_key` é o **único** campo do corpo. Nenhum outro é lido.
        - Mínimo de **32 caracteres**: abaixo disso, `400 hmac_key_too_short`.
        - A chave é cifrada antes de tocar no banco, e **nunca é devolvida** por
          nenhuma rota — `GET /hmac/config` só reporta que existe.
        - A ordem é contrato: valida, cifra, grava. Uma falha a cifrar não
          escreve nada.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              hmac_key: chave-de-assinatura-com-32-carac
            schema:
              $ref: '#/components/schemas/PedidoConfiguracaoHmac'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: HMAC configuration saved successfully
                  Enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoHmac'
                    type: object
          description: 'Chave gravada. `Enabled: true` reporta o estado DEPOIS da operação.'
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: hmac_key_too_short
                  message: HMAC key must be at least 32 characters long
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Chave com menos de 32 caracteres (`hmac_key_too_short`), corpo
            ilegível, ou sessão sem identificador.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Gravar a chave HMAC da sessão
      tags:
        - Integrações e configuração
  /hmac/configure:
    post:
      description: |
        **O mesmo manipulador de `POST /hmac/config`**, no caminho original. As
        duas rotas são a mesma operação, com o mesmo corpo, a mesma validação de
        32 caracteres e a mesma resposta — estão documentadas em duplicado apenas
        para que ninguém suponha que existe diferença entre elas.

        Este era historicamente o único caminho de escrita, enquanto a leitura
        vivia em `/hmac/config`. O alias curto veio com o achado **F251**, e este
        caminho fica para não partir clientes existentes.

        Consulte `POST /hmac/config` para as regras completas e para o que
        acontece à chave depois de gravada.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              hmac_key: chave-de-assinatura-com-32-carac
            schema:
              $ref: '#/components/schemas/PedidoConfiguracaoHmac'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Details: HMAC configuration saved successfully
                  Enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoHmac'
                    type: object
          description: Chave gravada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: hmac_key_too_short
                  message: HMAC key must be at least 32 characters long
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Chave com menos de 32 caracteres (`hmac_key_too_short`), corpo
            ilegível, ou sessão sem identificador.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Gravar a chave HMAC da sessão (caminho original)
      tags:
        - Integrações e configuração
  /labels:
    get:
      description: |
        Devolve as etiquetas do **WhatsApp Business** desta conta, tal como o
        wa-api as recolheu dos eventos que o telemóvel e os outros aparelhos
        anunciam.

        **É LEITURA, e não existe rota de escrita de etiquetas.** Não é
        esquecimento: a biblioteca que fala com o WhatsApp não sabe criar nem
        editar etiquetas, portanto uma rota de escrita responderia `200` sem
        fazer nada — que é um defeito, não uma funcionalidade. Crie e edite
        etiquetas na aplicação do WhatsApp Business; elas aparecem aqui a seguir.

        Numa conta que não seja Business, ou que nunca tenha sincronizado, a
        lista vem **vazia** (`[]`, nunca `null`).

        Etiquetas apagadas continuam na lista, marcadas com `deleted: true`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - color: 0
                    deleted: false
                    label_id: "3"
                    name: Grupos
                    predefined_id: 0
                    updated_at: "2026-07-20T05:28:22.008-04:00"
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Etiqueta'
                        type: array
                    type: object
          description: |
            Etiquetas conhecidas. Medido a 2026-08-26 na sessão `filarapida` —
            repare que o `name` real traz um caractere invisível de marcação de
            direcção do texto antes da palavra.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar as etiquetas da conta
      tags:
        - Integrações e configuração
  /labels/{id}/chats:
    get:
      description: |
        Devolve as conversas associadas a uma etiqueta, pelo `label_id` que
        `GET /labels` traz.

        **O identificador NÃO é um UUID nem hexadecimal**: é o número curto que o
        WhatsApp Business atribui à etiqueta — na instância medida, `3`.

        **Etiqueta inexistente devolve `200` com lista vazia, e não `404`.**
        Medido a 2026-08-26 com `/labels/999/chats`. É a mesma resposta de uma
        etiqueta que existe e não tem conversas, portanto esta rota não serve
        para saber se uma etiqueta existe — para isso use `GET /labels`.

        A lista vazia sai como `[]` e nunca como `null`.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            `label_id` da etiqueta, como vem em `GET /labels` — um número curto
            atribuído pelo WhatsApp Business, e não um identificador longo.
          in: path
          name: id
          required: true
          schema:
            example: "3"
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - chat_jid: 120363411669320145@g.us
                    label_id: "3"
                    labeled: true
                    updated_at: "2026-07-20T05:28:22.008-04:00"
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/EtiquetaConversa'
                        type: array
                    type: object
          description: |
            Associações da etiqueta. Vazia quando a etiqueta não tem conversas —
            ou quando não existe.
        "400":
          content:
            application/json:
              example:
                code: 400
                error: bad request
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            Sessão sem identificador (`missing_session_id`), ou `id` ausente no
            caminho. **A recusa por `id` ausente usa o envelope ANTIGO**, com
            `error` em texto simples: vem de `rejectMissingField` (F266).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Listar as conversas de uma etiqueta
      tags:
        - Integrações e configuração
  /livez:
    get:
      description: |
        Sonda de vivacidade. Responde assim que o processo consegue atender —
        não consulta banco, não fala com o WhatsApp e não depende de sessão
        nenhuma.

        **Quando usar**: como `livenessProbe` de contentor. É o que o
        `HEALTHCHECK` do Dockerfile aponta.

        **Regra importante**: responder aqui significa apenas que o processo
        está de pé. Para saber se ele já pode receber tráfego, use
        `/health/ready`.

        **Autenticação**: nenhuma.
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: '#/components/schemas/EstadoSonda'
          description: O processo está vivo.
      security: []
      summary: Verificar se o processo está vivo
      tags:
        - Saúde
  /message/star:
    post:
      description: |
        Marca uma mensagem como favorita, ou retira a marca.

        **Quando usar**: para guardar uma mensagem na lista de favoritas da
        conta, visível em todos os dispositivos ligados.

        **Regras**: são necessários TRÊS identificadores, e não dois —
        `chat`, `message_id` **e `sender`**. Faltar `sender` é
        `400 missing_sender`, medido; é o erro em que se cai ao derivar o
        exemplo da conversa em vez de o medir. Em conversa individual com uma
        mensagem própria, `sender` é o JID da própria conta e `from_me` é
        `true`.

        **Histórico**: até à correcção da F223/CAP-54 esta rota devolvia
        `409 app_state_conflict`; hoje devolve `200`. O `409` continua
        possível, porque continua a ser uma escrita de app-state.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              chat: 554192421234@s.whatsapp.net
              from_me: true
              message_id: 3EB0A4B2AFD45E625C0917
              sender: 554192421234@s.whatsapp.net
              star: true
            schema:
              $ref: '#/components/schemas/PedidoFavoritarMensagem'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message: Message starred
                  success: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SucessoMensagem'
                    type: object
          description: O patch de app-state foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_sender
                  message: missing sender in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `chat`
            (`missing_chat`), `message_id` (`missing_message_id`) ou `sender`
            (`missing_sender`) ausentes, JID mal formado (`invalid_chat_jid`,
            `invalid_sender_jid`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: app_state_conflict
                  message: 'app state conflict: the local state is out of sync with the server'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Conflito de app-state — o estado local está dessincronizado do servidor.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Favoritar ou desfavoritar uma mensagem
      tags:
        - Conversas
  /newsletter/admin-invite:
    post:
      description: |
        Cria um convite para que outro utilizador se torne **administrador** do
        canal.

        **É o passo que faltava para todo o resto.** A cadeia de administração,
        medida ponta a ponta a 2026-08-26 (F233), é:

        ```
        create -> admin-invite -> admin-invite/accept -> change-owner -> demote -> delete
         owner     (convite)         role=admin           role=owner    subscriber  non_existing
        ```

        Sem um segundo administrador, `change-owner` e `demote` não têm a quem
        apontar — e era por isso que pareciam não funcionar.

        **Não é enviada mensagem nenhuma.** É uma mutação pura do protocolo: o
        convidado só fica a saber pelo cliente dele. Procurar o convite no chat
        de quem convida é procurar no sítio errado (F261).

        **Ressalva medida**: a resposta traz `data: null` **mesmo em sucesso**. O
        servidor devolve um `invite_expiration_time` (sete dias) que a API deita
        fora (F261). Um `200` aqui significa "convite criado" — a validade **não
        é devolvida**, e não há como consultá-la por esta API.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` pode ir em PN
        ou LID; a resolução PN→LID acontece antes do envio (F233c).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Convite criado. `data` é `null` e o prazo de validade não é
            devolvido — ver a ressalva acima.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: invitee jid is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Convidar um utilizador para administrador do canal
      tags:
        - Canais
  /newsletter/admin-invite/accept:
    post:
      description: |
        Aceita, **na sessão convidada**, um convite criado por
        `POST /newsletter/admin-invite`. É esta chamada que transforma o
        convidado em administrador.

        **Quem chama**: a sessão CONVIDADA, não a que convidou. O canal já é
        identificado pelo `jid`, e por isso não há `userJID` aqui.

        **Como confirmar**: `POST /newsletter/info` na sessão convidada passa a
        devolver `viewer_metadata.role: admin`. Foi assim que a cadeia foi
        medida — a prova está do lado do convidado (F233).

        **Regras**: `jid` é obrigatório. `data` vem `null` em sucesso.

        **Autenticação**: token de sessão (a do convidado).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: 'Convite aceite; quem chamou passa a `role: admin`. `data` é `null`.'
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Aceitar um convite para administrador de canal
      tags:
        - Canais
  /newsletter/admin-invite/revoke:
    post:
      description: |
        Cancela um convite de administrador que ainda não foi aceite.

        **Quem chama**: a sessão que convidou. `userJID` identifica o convidado
        cujo convite se quer revogar.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID, com resolução PN→LID antes do envio. `data` vem `null` em sucesso, e
        não há rota que liste convites pendentes — logo o efeito não é
        confirmável por esta API.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Convite revogado. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: invitee jid is required for revoke
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Revogar um convite de administrador de canal
      tags:
        - Canais
  /newsletter/change-owner:
    post:
      description: |
        Transfere a posse do canal para outro utilizador. Medido a 2026-08-26: o
        alvo passa a `role: owner` e **quem chamava, o dono anterior, cai a
        `admin`** (F233).

        **O alvo tem de já ser administrador.** Se não for, o WhatsApp recusa com
        `401` e nós devolvemos `403 newsletter_new_owner_not_admin`. É por isso
        que esta rota vem depois de `admin-invite` e `admin-invite/accept` na
        cadeia — sem esses dois passos não existe segundo administrador a quem
        passar a posse.

        **Irreversível sem a cooperação do novo dono**: depois da transferência,
        só ele pode devolvê-la.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID (resolução PN→LID antes do envio, F233c). `data` vem `null`; para
        confirmar, chame `POST /newsletter/info` e olhe
        `viewer_metadata.role`.

        **Autenticação**: token de sessão (a do dono actual).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: |
            Posse transferida. `data` é `null`; a mudança confirma-se em
            `POST /newsletter/info`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: new owner jid is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID` do novo dono.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error:
                  code: newsletter_new_owner_not_admin
                  message: the new owner must already be a channel admin
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: O utilizador indicado ainda não é administrador do canal.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Transferir a posse de um canal
      tags:
        - Canais
  /newsletter/create:
    post:
      description: |
        Cria um canal de difusão novo, do qual a sessão que chama fica **dono**
        (`viewer_metadata.role: owner`).

        **Quando usar**: é o primeiro passo de tudo o resto. É também o primeiro
        passo da cadeia de administração — sem um canal criado por si, nenhuma
        das rotas de administrador tem sobre o que operar.

        **Regras**: `name` é obrigatório; sem ele a resposta é
        `400 missing_name`. É a única das dezoito operações que não recebe `jid`
        — o identificador é o que ela devolve.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              description: Novidades e horários de funcionamento.
              name: Avisos da Fila Rápida
            schema:
              $ref: '#/components/schemas/PedidoCriarCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 120363411025775186@newsletter
                  state:
                    type: active
                  thread_metadata:
                    creation_time: "1787745654"
                    description:
                      id: "1787745654587070"
                      text: Novidades e horários de funcionamento.
                      update_time: "1787745654587070"
                    invite: 0029Vb85MPpKLaHoEUxRt01E
                    name:
                      id: "1787745654587070"
                      text: Avisos da Fila Rápida
                      update_time: "1787745654587070"
                    subscribers_count: "0"
                    verification: unverified
                  viewer_metadata:
                    mute: "on"
                    role: owner
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MetadadosCanal'
                    type: object
          description: Canal criado. `data` traz os metadados do canal novo.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_name
                  message: nome do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o nome, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Criar um canal
      tags:
        - Canais
  /newsletter/delete:
    delete:
      description: |
        **Destrói o canal e todo o seu conteúdo. Não há como desfazer.**

        É o último passo da cadeia de administração de canal (F233), e só o dono
        o pode dar.

        **Método `DELETE`, não `POST`** — e com corpo, que é invulgar mas é o que
        esta rota exige.

        **Confirmação obrigatória**: `confirmJID` tem de ser **idêntico** a
        `jid`. Sem ele, ou com valor diferente, a resposta é
        `400 missing_confirm_jid` e **o WhatsApp nem chega a ser contactado** —
        a guarda está do nosso lado, antes do envio.

        **Como se confirma o efeito** (as três vias usadas na verificação de
        campo): `GET /newsletter/list` deixa de o listar;
        `POST /newsletter/info` passa a devolver `state.type: non_existing` com
        `viewer_metadata: null`; e o link público de convite deixa de resolver.

        **Autenticação**: token de sessão (a do dono).
      requestBody:
        content:
          application/json:
            example:
              confirmJID: 120363411025775186@newsletter
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoApagarCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Canal apagado. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_confirm_jid
                  message: confirm_jid must match the channel jid
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, ou `confirmJID` está ausente ou é diferente de `jid`.
            Neste último caso nada foi enviado ao WhatsApp.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Apagar um canal (IRREVERSÍVEL)
      tags:
        - Canais
  /newsletter/demote:
    post:
      description: |
        Tira o papel de administrador a um utilizador, que passa a
        `role: subscriber` — medido a 2026-08-26 (F233).

        **O dono não pode ser despromovido.** O WhatsApp recusa com `405` e nós
        devolvemos `403 newsletter_cannot_demote_owner`: para tirar poder ao
        dono, é preciso primeiro `POST /newsletter/change-owner`.

        **Precisa de um segundo administrador para ter sentido**, e ele só
        existe depois de `admin-invite` + `admin-invite/accept`. Era essa a razão
        de esta rota parecer não funcionar antes de a cadeia estar fechada.

        **Regras**: `jid` e `userJID` são obrigatórios. `userJID` aceita PN ou
        LID. `data` vem `null`; confirme por `POST /newsletter/info`.

        **Autenticação**: token de sessão (a do dono).
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
              userJID: 90937376170214@lid
            schema:
              $ref: '#/components/schemas/PedidoAdminCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: Administrador despromovido a assinante. `data` é `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_jid
                  message: user jid is required for demote
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid` ou o `userJID` do alvo.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          content:
            application/json:
              example:
                code: 403
                error:
                  code: newsletter_cannot_demote_owner
                  message: the channel owner cannot be demoted; transfer ownership first
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: O alvo é o dono do canal, e o dono não pode ser despromovido.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Despromover um administrador do canal a assinante
      tags:
        - Canais
  /newsletter/follow:
    post:
      description: |
        Passa a seguir o canal indicado, que a partir daí aparece em
        `GET /newsletter/list`.

        **Quando usar**: depois de descobrir um canal por
        `POST /newsletter/info-invite`, para o acompanhar.

        **Regras**: `jid` é obrigatório. A resposta de sucesso traz
        `data: null` — a operação não devolve carga útil, e o `200` é a
        confirmação. Para verificar o efeito, chame `GET /newsletter/list`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: null
                success: true
              schema:
                $ref: '#/components/schemas/Envelope'
          description: O canal passou a ser seguido. `data` é sempre `null`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Seguir um canal
      tags:
        - Canais
  /newsletter/info:
    post:
      description: |
        Devolve o retrato de um canal: nome, descrição, código de convite,
        contagem de seguidores, estado e — o mais útil — **o papel de quem
        chama**, em `viewer_metadata.role`.

        **Quando usar**: para descobrir se a sessão é `owner`, `admin` ou
        `subscriber` antes de tentar uma operação de administração. Também é a
        forma de confirmar que um `delete` teve efeito: o canal apagado passa a
        `state.type: non_existing` com `viewer_metadata: null`.

        **Regras**: `jid` é obrigatório e tem de ser um JID `@newsletter`.
        `viewer_metadata` vem `null` quando não há relação com o canal.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 120363411025775186@newsletter
                  state:
                    type: active
                  thread_metadata:
                    creation_time: "1787745654"
                    description:
                      id: "1787745654587070"
                      text: Novidades e horários de funcionamento.
                      update_time: "1787745654587070"
                    invite: 0029Vb85MPpKLaHoEUxRt01E
                    name:
                      id: "1787745654587070"
                      text: Avisos da Fila Rápida
                      update_time: "1787745654587070"
                    picture:
                      direct_path: ""
                      hash: null
                      id: "1787750687544878"
                      type: IMAGE
                      url: ""
                    preview:
                      direct_path: ""
                      hash: null
                      id: "1787750687544880"
                      type: PREVIEW
                      url: ""
                    settings:
                      reaction_codes:
                        value: ALL
                    subscribers_count: "0"
                    verification: unverified
                  viewer_metadata:
                    mute: "on"
                    role: owner
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MetadadosCanal'
                    type: object
          description: Metadados do canal, do ponto de vista da sessão que chamou.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, ou o corpo não é JSON válido. Note a mensagem em
            português: é o que o código devolve hoje (F262).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Consultar os metadados de um canal
      tags:
        - Canais
  /newsletter/info-invite:
    post:
      description: |
        O mesmo retrato de `POST /newsletter/info`, mas a partir do **código do
        link público** em vez do JID.

        **Quando usar**: quando se tem apenas o link partilhado de um canal e se
        quer saber o que ele é antes de seguir. O código é a parte final do link
        (`https://whatsapp.com/channel/<código>`) e vai nu no campo `invite`.

        **Regras**: `invite` é obrigatório; sem ele a resposta é
        `400 missing_invite`. Como quem chama pode não ter relação nenhuma com o
        canal, `viewer_metadata` costuma vir `null` — foi o valor medido mesmo
        contra um canal próprio.

        **Autenticação**: token de sessão.
      requestBody:
