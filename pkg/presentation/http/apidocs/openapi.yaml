  /newsletters/updates:
    post:
      description: |
        > **Substitui `POST /newsletter/updates`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Deveria devolver as ALTERAÇÕES a mensagens já conhecidas — edições,
        contagens de reação, remoções —, ao contrário de
        `POST /newsletter/messages`, que devolve as mensagens em si.

        **Esta rota está inoperante.** Medida a 2026-08-26 e de novo nesta
        sessão: responde **`500` ao fim de 30,0 segundos**, com
        `error.code: newsletter_failed` e, no log,
        `context deadline exceeded`. Os 30 s são exactamente o tempo limite por
        pedido — o servidor do WhatsApp **não responde**, não é ele a recusar.
        `POST /newsletter/messages` sobre o mesmo canal e no mesmo segundo
        devolve `200`, logo a sessão, o canal e o transporte estão bons. Está
        registado como F265 no `HOUSEKEEP.md`; a hipótese em aberto é um query
        ID desactualizado, e um ID inexistente produz silêncio, não erro.

        **Não use esta rota em produção.** Para acompanhar um canal, use
        `POST /newsletter/messages` ou `POST /newsletter/subscribe`.

        **Regras**: `jid` é obrigatório. `since` vai em RFC 3339 e é o único
        campo destas dezoito rotas validado no DTO de pedido, antes do use case —
        um instante malformado devolve `400 invalid_since`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              count: 5
              jid: 120363411025775186@newsletter
            schema:
              $ref: '#/components/schemas/PedidoAtualizacoesCanal'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  messages: []
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MensagensCanal'
                    type: object
          description: |
            Nunca observado. Documentado por ser o que o código devolveria se o
            servidor respondesse; a forma dos elementos não foi medida.
        "400":
          content:
            application/json:
              examples:
                faltaJid:
                  summary: Falta o `jid` — envelope canónico
                  value:
                    code: 400
                    error:
                      code: missing_jid
                      message: jid do canal é obrigatório
                    success: false
                sinceMalFormatado:
                  summary: '`since` fora do RFC 3339 — código próprio, não o genérico'
                  value:
                    code: 400
                    error:
                      code: invalid_since
                      message: since must be an RFC 3339 instant
                    success: false
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Erro'
                  - $ref: '#/components/schemas/Erro'
          description: |
            Falta o `jid`, o corpo não é JSON válido, ou `since` não está em
            RFC 3339.

            **As duas recusas passaram a ter o MESMO código próprio.** A de
            `since` respondia `invalid_request`, o código genérico de `400`, que
            só diz "algo estava mal"; responde agora `invalid_since`, que diz
            qual campo corrigir. É a única validação destas dezoito rotas que
            corre no DTO de pedido, antes do use case, e por isso era a única
            que não passava pela taxonomia `apperr` — passa agora
            (`dto/newsletter/request.go`).

            Até 2026-08-27 esta recusa saía com `error` em TEXTO em vez de
            objecto, num envelope que só ela usava (F266). O envelope antigo já
            tinha sido removido na fundação da migração; o código genérico saiu
            agora.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: newsletter_failed
                  message: newsletter operation failed
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            **O que esta rota devolve hoje, sempre**, ao fim de 30 segundos de
            espera pelo WhatsApp.
      security:
        - TokenSessao: []
      summary: ❌ Buscar atualizações de mensagens de um canal (INOPERANTE)
      tags:
        - Canais
  /polls/{poll_message_id}/votes:
    post:
      description: |
        Emite um voto numa enquete já criada. O voto é cifrado com um segredo
        derivado da mensagem de enquete original — por isso a rota pede os quatro
        campos que a identificam, em vez de a procurar no histórico: depender do
        histórico faria a rota falhar em silêncio depois de uma poda.

        **Quando usar**: votar em nome da conta ligada. Para criar a enquete, use
        `/chat/send/poll`.

        **Regras**:
        - `phone` é a CONVERSA onde a enquete está; `sender` é quem a CRIOU. São
          campos diferentes e ambos obrigatórios.
        - `sender` pode vir em PN ou LID: o servidor resolve a forma correcta
          antes de cifrar, preferindo o que o histórico registou e recorrendo ao
          mapeamento PN→LID quando não a tem (HOUSEKEEP F228).
        - `poll_message_timestamp` a zero conta como ausente.
        - `options` traz o texto EXACTO das opções votadas.

        **O que `200` significa aqui**: o voto foi DESPACHADO ao servidor do
        WhatsApp. **Não** é confirmação de que foi contabilizado, e a resposta não
        permite distinguir as duas coisas — confirme na interface do WhatsApp.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            ID da mensagem de enquete original. Substitui o campo
            `poll_message_id` do corpo — se ambos vierem, o **corpo ganha**.
          in: path
          name: poll_message_id
          required: true
          schema:
            example: 3EB0A4B2AFD45E625C0917
            type: string
      requestBody:
        content:
          application/json:
            example:
              options:
                - Manhã
              phone: 120363411669320145@g.us
              poll_message_id: 3EB0A4B2AFD45E625C0917
              poll_message_timestamp: 1787748016
              sender: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoVotoEnquete'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            Voto despachado. Ver a ressalva na descrição: despacho não é
            contabilização.
        "400":
          content:
            application/json:
              examples:
                invalid_sender:
                  summary: '`sender` não parseia como JID'
                  value:
                    code: 400
                    error:
                      code: invalid_sender
                      message: could not parse Sender
                    success: false
                missing_options:
                  summary: Nenhuma opção votada
                  value:
                    code: 400
                    error:
                      code: missing_options
                      message: at least 1 option is required
                    success: false
                missing_phone:
                  summary: Destino ausente em `phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                missing_poll_message_id:
                  summary: Campo `poll_message_id` vazio
                  value:
                    code: 400
                    error:
                      code: missing_poll_message_id
                      message: missing PollMessageId in payload
                    success: false
                missing_poll_message_timestamp:
                  summary: Campo `poll_message_timestamp` ausente ou zero
                  value:
                    code: 400
                    error:
                      code: missing_poll_message_timestamp
                      message: missing PollMessageTimestamp in payload
                    success: false
                missing_sender:
                  summary: Campo `sender` vazio
                  value:
                    code: 400
                    error:
                      code: missing_sender
                      message: missing Sender in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Votar numa enquete
      tags:
        - Envio de mensagens
  /proxy/set:
    post:
      description: |
        Define por onde sai o tráfego desta sessão — e, conforme
        `webhook_use_proxy`, também a entrega dos webhooks.

        **Só funciona com a sessão DESLIGADA.** Com a sessão ligada, a resposta é
        `400 proxy_while_connected` e nada é gravado: o transporte é montado no
        arranque da ligação, e trocá-lo a meio não teria efeito. Faça
        `GET /session/disconnect`, configure, e volte a ligar.

        **Ligar e desligar são o mesmo pedido**, distinguidos por `enable`:

        - `enable: true` → valida `proxy_url` e grava.
        - `enable: false` → limpa o proxy gravado. O `proxy_url` do corpo **não é
          validado** neste ramo, de propósito: uma configuração partida tem de
          poder ser removida.

        **Regras do URL** (lidas em `set_proxy.go`), só no ramo de ligar:

        - `proxy_url` obrigatório (`400 missing_proxy_url`);
        - tem de ser analisável como URL (`400 invalid_proxy_url`);
        - o esquema tem de ser **`http` ou `socks5`**, e mais nenhum
          (`400 unsupported_proxy_scheme`). **`https` NÃO é aceite** — parece
          óbvio que fosse, e não é: exige um transporte que este processo não
          monta.
        - com `webhook_use_proxy` ligado, o endereço **não pode ser reservado nem
          de loopback** (`400 reserved_proxy_address`): a entrega de webhooks
          sairia por ele, e isso contornaria a validação de saída. Com a opção
          desligada, um endereço interno é permitido — é a forma normal de correr
          o tráfego do WhatsApp por um proxy da própria rede.

        `webhook_use_proxy` ausente **preserva** o valor gravado; enviá-lo
        explicitamente é que o muda.

        **O `proxy_url` costuma trazer credenciais** (`socks5://utilizador:senha@host:porta`).
        Ele nunca é escrito no log nem devolvido numa mensagem de erro; só o
        esquema aparece.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              enable: true
              proxy_url: socks5://utilizador:senha@proxy.exemplo.com.br:1080
              webhook_use_proxy: false
            schema:
              $ref: '#/components/schemas/PedidoProxy'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: Proxy configured successfully
                  proxy_url: socks5://utilizador:senha@proxy.exemplo.com.br:1080
                  set: true
                  webhook_use_proxy: false
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoProxy'
                    type: object
          description: |
            Configuração gravada. O corpo **difere entre os dois ramos**: ligar
            ecoa `set`, `proxy_url` e `webhook_use_proxy`; desligar responde só
            `details`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: proxy_while_connected
                  message: cannot set proxy while connected. Please disconnect first
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Sessão ligada (`proxy_while_connected`), `proxy_url` em falta
            (`missing_proxy_url`), URL inanalisável (`invalid_proxy_url`),
            esquema fora de `http`/`socks5` (`unsupported_proxy_scheme`),
            endereço reservado com entrega de webhook pelo proxy
            (`reserved_proxy_address`), ou corpo ilegível.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Configurar o proxy de saída da sessão
      tags:
        - Integrações e configuração
  /s3/config:
    delete:
      description: |
        Apaga a configuração de S3 desta sessão e desliga o armazenamento
        externo. Depois disto, `GET /s3/config` devolve `enabled: false` e a
        entrega de mídia volta a `base64`.

        **Não apaga os objectos já guardados no bucket** — só a configuração que
        apontava para ele. A limpeza do que lá está é sua.

        Não recebe corpo.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: S3 configuration deleted successfully
                  enabled: false
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoS3'
                    type: object
          description: Configuração removida. `enabled` vem `false`.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Remover a configuração de S3 da sessão
      tags:
        - Integrações e configuração
    get:
      description: |
        Devolve a configuração de armazenamento em S3 desta sessão.

        **Nenhum segredo sai por aqui, e isso é por desenho**: `access_key` vem
        sempre como `***` — **mesmo quando não há chave nenhuma configurada**,
        porque mascarar só quando existe já revelaria a existência. E
        `secret_key` **não aparece de todo**: a leitura nunca a consulta.

        `media_delivery` diz como a mídia recebida é entregue: `base64` no corpo
        da resposta, `s3` só por URL, ou `both`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  access_key: '***'
                  bucket: ""
                  enabled: false
                  endpoint: ""
                  media_delivery: base64
                  path_style: true
                  public_url: ""
                  region: ""
                  retention_days: 30
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ConfiguracaoS3Lida'
                    type: object
          description: Configuração em vigor. Medida a 2026-08-26, sessão sem S3 activo.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar a configuração de S3 da sessão
      tags:
        - Integrações e configuração
    post:
      description: |
        **É exactamente a mesma operação de `POST /s3/configure`** — o mesmo
        manipulador, registado em dois caminhos. Não procure diferença: não há.
        Este caminho mais curto foi acrescentado por causa do achado **F251**, em
        que ler era `/config` e escrever era `/configure`, e quem descobria a
        leitura levava `404 page not found` — sem corpo JSON e sem pista — ao
        tentar escrever no mesmo caminho.

        **A ordem das operações é o contrato**: valida, cifra, grava e só então
        regista o cliente S3. Uma configuração inválida nunca chega ao cifrador e
        nada é escrito.

        **É uma SUBSTITUIÇÃO, não uma fusão — envie sempre o corpo completo.**
        Todo campo omitido é gravado no seu valor zero. Medido a 2026-08-26: uma
        sessão com `path_style: true` e `retention_days: 30` recebeu
        `POST /s3/config {"enabled": true}` e ficou com `path_style: false` e
        `retention_days: 0`, além de perder as credenciais gravadas. A única
        excepção é `media_delivery`, que quando vazio assume `base64` em vez de
        ficar `""`.

        **Regras** (lidas em `configure_s3.go`):

        - `media_delivery`, quando presente, tem de ser `base64`, `s3` ou `both`
          (`400 invalid_media_delivery`). Vazio assume `base64`.
        - `endpoint`, quando presente, tem de ser um URL analisável
          (`400 invalid_s3_endpoint`).
        - `secret_key` é cifrada antes de tocar no banco e **nunca é devolvida**
          por nenhuma rota.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              access_key: AKIA_EXEMPLO_NAO_USE
              bucket: wa-api-midia
              enabled: true
              endpoint: https://s3.sa-east-1.amazonaws.com
              media_delivery: both
              path_style: false
              public_url: https://midia.exemplo.com.br
              region: sa-east-1
              retention_days: 30
              secret_key: EXEMPLO_NAO_USE_gere_a_sua_secret_key
            schema:
              $ref: '#/components/schemas/PedidoConfiguracaoS3'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: S3 configuration saved successfully
                  enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoS3'
                    type: object
          description: Configuração gravada. `enabled` ecoa o estado pedido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_media_delivery
                  message: media_delivery must be 'base64', 's3', or 'both'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `media_delivery` fora dos três valores, `endpoint` inválido, corpo
            ilegível, ou sessão sem identificador.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Gravar a configuração de S3 da sessão
      tags:
        - Integrações e configuração
  /s3/configure:
    post:
      description: |
        **O mesmo manipulador de `POST /s3/config`**, no caminho original. As
        duas rotas são a mesma operação, com o mesmo corpo, as mesmas validações
        e a mesma resposta — documentadas em duplicado apenas para que ninguém
        suponha que existe diferença.

        Historicamente este era o **único** caminho de escrita, enquanto a
        leitura vivia em `/s3/config`; `POST /s3/config` respondia
        `404 page not found`. O alias curto nasceu do achado **F251**, e este
        caminho fica para não partir os clientes que já o usam.

        Consulte `POST /s3/config` para as regras de `media_delivery`, de
        `endpoint` e do tratamento do segredo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              access_key: AKIA_EXEMPLO_NAO_USE
              bucket: wa-api-midia
              enabled: true
              endpoint: https://s3.sa-east-1.amazonaws.com
              media_delivery: both
              path_style: false
              public_url: https://midia.exemplo.com.br
              region: sa-east-1
              retention_days: 30
              secret_key: EXEMPLO_NAO_USE_gere_a_sua_secret_key
            schema:
              $ref: '#/components/schemas/PedidoConfiguracaoS3'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: S3 configuration saved successfully
                  enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfiguracaoS3'
                    type: object
          description: Configuração gravada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_s3_endpoint
                  message: invalid S3 endpoint
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `media_delivery` fora dos três valores, `endpoint` inválido, corpo
            ilegível, ou sessão sem identificador.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Gravar a configuração de S3 da sessão (caminho original)
      tags:
        - Integrações e configuração
  /s3/test:
    post:
      description: |
        Faz um teste **real** contra o S3: lê a configuração GRAVADA, decifra o
        segredo, monta o cliente e contacta o bucket, com **10 segundos** de
        limite.

        **Não recebe corpo** — nem sequer o desserializa. Testa o que está
        guardado, não o que você mandar. Envie o pedido sem corpo.

        **Regras e falhas reais** (lidas em `test_s3_connection.go`):

        - Sem sessão de WhatsApp para este token: `400 no_session`.
        - S3 ausente ou com `enabled: false`: `400 s3_not_enabled` — o teste nem
          chega a sair para a rede.
        - Segredo gravado que não decifra (por exemplo, uma linha antiga em texto
          claro): `500`, e **de propósito** — usar o valor como se fosse a
          credencial esconderia a linha por decifrar para sempre.
        - Bucket inacessível, credencial errada ou tempo esgotado: `500`. O corpo
          é o genérico `internal server error`; **a causa fica no log do
          servidor**, e não na resposta, porque a mensagem do S3 pode conter o
          endpoint e o bucket.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  bucket: wa-api-midia
                  connected: true
                  details: S3 connection test successful
                  region: sa-east-1
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoTesteS3'
                    type: object
          description: |
            O bucket respondeu. `bucket` e `region` ecoam a configuração
            **testada** — é o que distingue "testei o que gravaste" de "respondi
            200". Nenhuma credencial aparece.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: s3_not_enabled
                  message: S3 is not enabled for this user
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Sem sessão (`no_session`), sessão sem identificador
            (`missing_session_id`), ou S3 desligado para esta sessão
            (`s3_not_enabled`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: internal_error
                  message: Ocorreu um erro interno.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O teste saiu e falhou: bucket inacessível, credencial recusada, tempo
            esgotado aos 10 segundos, ou segredo gravado que não decifra. O corpo
            é o genérico; a causa está no log do servidor.
      security:
        - TokenSessao: []
      summary: ⬜ Testar a ligação ao bucket configurado
      tags:
        - Integrações e configuração
  /session/connect:
    get:
      description: |
        Arranca o cliente de WhatsApp desta sessão. É o passo que faz o QR code
        aparecer em `GET /session/qr` e que habilita o pedido de código em
        `POST /session/pairphone`.

        **É um GET que MUTA estado.** Não é seguro nem idempotente no sentido
        do HTTP: repetir a chamada reclama a posse da sessão outra vez e volta a
        lançar o arranque. A forma sobrevive por compatibilidade com clientes
        existentes.

        **O `200` não significa "ligado".** A ligação corre numa goroutine que
        arranca DEPOIS da resposta; o corpo diz `{"status":"connecting"}`. Quem
        confirma o estado é `GET /session/status` (`connected` e `logged_in`) ou
        o evento `Connected` em `GET /session/ws`.

        **O que o `200` garante**: que a posse da sessão é desta réplica. A
        verificação de posse é síncrona e acontece ANTES da resposta — antes
        disso o cliente recebia `200` para um arranque que nunca ia acontecer
        (F108). Em modo `single` a verificação passa sempre.

        **Fluxo completo de emparelhamento**:

        1. `POST /admin/users` cria a sessão e devolve o token — que não é
           recuperável depois;
        2. `GET /session/connect` com esse token;
        3. `GET /session/qr` para ler o QR **ou** `POST /session/pairphone` para
           receber um código de oito caracteres;
        4. ler o QR no telemóvel, ou digitar o código em *Aparelhos conectados*;
        5. `GET /session/status` confirma — `logged_in: true`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  status: connecting
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/EstadoConexao'
                    type: object
          description: Pedido aceite e posse da sessão confirmada. A ligação arranca em segundo plano.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: session_owned_by_another_replica
                  message: this session is owned by another replica; route the request to its owner
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Outra réplica é dona desta sessão. Encaminhe o pedido para o
            processo que a detém — insistir aqui não resolve.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Iniciar a ligação da sessão ao WhatsApp
      tags:
        - Sessões
  /session/disconnect:
    get:
      description: |
        Fecha a ligação ao WhatsApp **mantendo o emparelhamento**. A sessão
        continua a existir em *Aparelhos conectados* no telemóvel e volta a
        ligar-se com `GET /session/connect`, sem QR novo.

        É a diferença para `POST /session/logout`, que desvincula o aparelho e
        exige emparelhar de novo.

        **É um GET que MUTA estado**, como `/session/connect`, e pelo mesmo
        motivo histórico.

        **Regras**: exige um cliente vivo. Sem ele a resposta é
        `400 no_session` — não um `200` silencioso.

        **Efeito visível depois**: `GET /session/status` passa a responder
        `connected: false` mantendo `logged_in: true`, e sai um evento
        `Disconnected` pelo webhook e por `GET /session/ws`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoDesconexao'
                    type: object
          description: Transporte derrubado. `details` vem vazio.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Derrubar o transporte da sessão sem desemparelhar
      tags:
        - Sessões
  /session/history:
    post:
      description: |
        Define o limite de mensagens gravadas por conversa na tabela
        `message_history`, que é o que alimenta `GET /chat/history` e o
        encaminhamento por chave de mensagem.

        **`0` é o valor de origem, e desliga a gravação por inteiro.** Uma
        instalação nova não acumula histórico nenhum até esta chamada — nem em
        tempo real nem por sincronização. Se contava com `GET /chat/history`
        trazer alguma coisa, chame isto primeiro.

        **Esta rota é o MESMO manipulador de `POST /webhook/history`**, que
        pertence ao grupo de integrações. O nome `/webhook/history` engana —
        sugere um registo de entregas de webhook, e o efeito é sobre o
        histórico de MENSAGENS (achado F252 do `HOUSEKEEP.md`). Os dois caminhos
        escrevem a mesma coluna; use este.

        **Regras**: exige um cliente vivo (`400 no_session`); valor negativo é
        recusado com `400 invalid_history` e nada é gravado.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              history: 100
            schema:
              $ref: '#/components/schemas/PedidoLimiteHistorico'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: History configured successfully
                  history: 100
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoLimiteHistorico'
                    type: object
          description: Limite gravado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_history
                  message: history cannot be negative
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `invalid_history` (valor negativo), `no_session` (nenhum cliente
            vivo), `missing_session_id` ou `could_not_decode_payload`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Configurar quantas mensagens a sessão guarda
      tags:
        - Sessões
  /session/hmac/config:
    delete:
      description: |
        Apaga a chave de assinatura. Os webhooks desta sessão passam a sair sem
        assinatura — um receptor que a exija deixa de os aceitar.

        **Regras**: exige um cliente vivo (`400 no_session`). A resposta sai só
        com `details` — `enabled` fica `false` e o campo é omitido.

        **Rota irmã**: `DELETE /hmac/config` (grupo de integrações), mesmo
        manipulador.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: HMAC configuration deleted successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfigHmac'
                    type: object
          description: Chave revogada.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Revogar a chave HMAC desta sessão
      tags:
        - Sessões
    get:
      description: |
        Diz se existe chave de assinatura de webhook para esta sessão.

        **O valor nunca sai — nem em claro, nem cifrado.** A resposta é
        `{"hmac_key": ""}` quando não há chave e `{"hmac_key": "***"}` quando
        há. Devolver a chave transformaria uma leitura de configuração num
        vazamento do segredo que a assinatura existe para proteger.

        **Note que `GET /session/status` NÃO responde a esta pergunta**: o campo
        `hmac_configured` de lá sai sempre `false`, mesmo com chave gravada.
        Esta rota é a fonte fiável.

        **Rota irmã**: `GET /hmac/config` (grupo de integrações), mesmo
        manipulador.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  hmac_key: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VistaConfigHmac'
                    type: object
          description: |
            Presença da chave. O exemplo é a resposta REAL medida em 2026-08-26,
            numa sessão sem chave configurada.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Saber se esta sessão tem chave HMAC configurada
      tags:
        - Sessões
    post:
      description: |
        Grava a chave com que os webhooks desta sessão passam a ser assinados,
        para o receptor poder verificar que a entrega veio mesmo daqui.

        **Regras, na ordem em que são aplicadas**:

        1. exige um cliente vivo (`400 no_session`);
        2. a chave tem de ter **pelo menos 32 caracteres** — abaixo disso é
           `400 hmac_key_too_short` e nada chega ao cifrador;
        3. é cifrada antes de a linha ser escrita: uma falha aqui não grava;
        4. só depois é publicada no cache, que não expira. Publicar antes
           deixaria a chave a assinar webhooks sem existir no banco, e um
           reinício fá-la-ia desaparecer sem aviso.

        A chave em claro nunca entra em log nem em mensagem de erro — o único
        dado dela que aparece é o comprimento.

        **Rotas irmãs**: `POST /hmac/configure` e o seu alias
        `POST /hmac/config` (grupo de integrações) são o mesmo manipulador.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              hmac_key: uma-chave-com-pelo-menos-32-caracteres
            schema:
              $ref: '#/components/schemas/PedidoConfigHmac'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: HMAC configuration saved successfully
                  enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfigHmac'
                    type: object
          description: Chave gravada e activa.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: hmac_key_too_short
                  message: HMAC key must be at least 32 characters long
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `hmac_key_too_short` (menos de 32 caracteres), `no_session`,
            `missing_session_id` ou `could_not_decode_payload`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Gravar a chave HMAC de assinatura dos webhooks
      tags:
        - Sessões
  /session/logout:
    post:
      description: |
        **Desemparelha.** A sessão desaparece de *Aparelhos conectados* no
        telemóvel, e voltar a operar exige emparelhar do zero — com o telemóvel
        à mão. Não há como desfazer a partir daqui.

        Para apenas derrubar a ligação e voltar depois, use
        `GET /session/disconnect`.

        **Regras**:

        - exige um cliente vivo **e ligado**: o logout fala com o WhatsApp
          (manda um `remove-companion-device`), e sem transporte não há o que
          enviar. Nesse estado a resposta é `409 session_not_connected`, com a
          saída dita na mensagem — ligar primeiro;
        - nesse caso de `409`, o estado LOCAL é alinhado à força, para
          `users.connected` deixar de mentir sobre uma sessão morta (F93);
        - o sucesso solta a sessão dos registos DEPOIS de o logout passar (F80).
          Sem essa ordem, `GET /session/status` continuava a responder
          `logged_in: true` para uma sessão que já não existia.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoDesconexao'
                    type: object
          description: Aparelho desvinculado. `details` vem vazio.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: session_not_connected
                  message: session has no live connection; call /session/connect before logging out
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            A sessão existe mas não tem ligação viva, e o logout precisa de uma
            para alcançar o WhatsApp. Chame `GET /session/connect` primeiro.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ❌ Desvincular o aparelho da conta de WhatsApp
      tags:
        - Sessões
  /session/pair/phone:
    post:
      description: |
        > **Substitui `POST /session/pairphone`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Pede ao WhatsApp um **código de emparelhamento** de oito caracteres,
        que a pessoa digita no telemóvel em *Aparelhos conectados → Conectar
        com número de telefone*. É a alternativa ao QR quando não há como
        mostrar uma imagem ao utilizador.

        **Fluxo completo**:

        1. `POST /admin/users` cria a sessão e devolve o token;
        2. `GET /session/connect` com esse token;
        3. `POST /session/pairphone` com o número — esta rota — **ou**
           `GET /session/qr` para o caminho por imagem;
        4. digitar o `linking_code` no telemóvel;
        5. `GET /session/status` confirma com `logged_in: true`.

        **Regras**:

        - `phone` é obrigatório: só dígitos, com código de país, sem `+` e sem
          `@s.whatsapp.net`. Vazio dá `400 missing_phone`;
        - a sessão **não pode já estar autenticada** — a guarda corre ANTES de
          pedir o código ao servidor, e uma sessão emparelhada recebe
          `400 already_paired`;
        - exige um cliente vivo, logo `GET /session/connect` antes;
        - o número é validado do lado do WhatsApp e do wa-noise. Número curto
          demais ou em formato nacional volta como `400 pair_phone_failed`,
          com a mensagem original do SDK;
        - o código tem validade curta. Expirado, peça outro.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              phone: "554192421234"
            schema:
              $ref: '#/components/schemas/PedidoPareamentoTelefone'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  linking_code: ABCD-EFGH
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoPareamentoTelefone'
                    type: object
          description: Código emitido. Digite-o no telemóvel antes de expirar.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: already_paired
                  message: already paired
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Recusa de validação. Os códigos possíveis: `missing_phone` (sem o
            campo `phone`), `already_paired` (a sessão já está autenticada),
            `no_session` (nenhum cliente vivo — ligue primeiro),
            `pair_phone_failed` (o número foi recusado; a mensagem traz o motivo
            do SDK) e `could_not_decode_payload` (corpo não é JSON válido).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ⬜ Emparelhar por código de telefone em vez de QR
      tags:
        - Sessões
  /session/pair/qr:
    get:
      description: |
        > **Substitui `GET /session/qr`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Devolve a imagem do QR code guardada para esta sessão, em data URI.

        **Vazio é comportamento normal, não defeito.** O valor só existe
        durante a janela de emparelhamento: é gravado a cada código novo que o
        WhatsApp emite e limpo quando a janela expira. Numa sessão já
        autenticada, ou numa que ainda não chamou `GET /session/connect`, a
        resposta é `200` com `{"qr_code": ""}`.

        **Como usar**: chame `GET /session/connect` primeiro e sondar esta rota
        até o campo vir preenchido. O código gira sozinho — leia sempre o mais
        recente. Quem quiser evitar a sondagem tem os eventos `QR` e `QRTimeout`
        em `GET /session/ws`, que trazem também o texto cru do código e a
        validade.

        **Regras**: exige um cliente vivo — sem ele, `400 no_session`.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  qr_code: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CodigoQR'
                    type: object
          description: |
            Valor actual da coluna de QR. Medido em 2026-08-26 numa sessão já
            autenticada: `{"qr_code": ""}`.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Ler o QR code de emparelhamento
      tags:
        - Sessões
  /session/profile:
    get:
      description: |
        Perfil da PRÓPRIA conta: nome anunciado, avatar, JID, LID e estado do
        aparelho emparelhado.

        **Lê só o store local.** Não fala com o servidor do WhatsApp, responde
        em microssegundos e não está sujeita a limite de taxa. Para o recado e
        as definições de privacidade — que exigem rede — use
        `GET /session/profile/full`.

        **Regras**:

        - a resposta é um objecto PLANO: os campos de aparelho (`lid`,
          `platform`, `connected`, `logged_in`…) vivem na raiz, ao lado de
          `pushname`. Não há nível aninhado;
        - `avatar_url` vazio tem duas causas indistinguíveis na resposta — não
          haver foto, ou a consulta ter falhado. A falha fica no log;
        - numa sessão ligada e ainda não autenticada, `jid` vem vazio e os
          campos de aparelho continuam preenchidos. É deliberado: é justamente
          aí que `connected: true, logged_in: false` tem valor;
        - a resposta traz `Cache-Control: no-store` — o estado da sessão muda
          sozinho, e uma resposta em cache faria alguém depurar um estado que já
          não existe.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  avatar_id: "214830039"
                  avatar_url: https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg
                  business_name: FilaRápida
                  connected: true
                  full_name: ""
                  initialized: true
                  jid: 5516981818244@s.whatsapp.net
                  lid: 29343770251463:25@lid
                  lid_migration_timestamp: 1766149842
                  logged_in: true
                  platform: smbi
                  pushname: FilaRápida
                  registration_id: 4190140233
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PerfilSessao'
                    type: object
          description: |
            Perfil local. O exemplo é a resposta REAL medida em 2026-08-26, numa
            conta WhatsApp Business.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: no_session
                  message: no session
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `missing_session_id` quando o token não traz sessão, ou `no_session`
            quando não há cliente para ela.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar o perfil da conta ligada
      tags:
        - Sessões
  /session/profile/full:
    get:
      description: |
        Tudo o que `GET /session/profile` traz, mais dois blocos que exigem
        falar com o servidor do WhatsApp: `user_info` (recado, dispositivos
        conhecidos, LID) e `privacy` (definições de privacidade da conta).

        **É a rota CARA do par, e a separação é de custo.** Está sujeita a
        latência e a limite de taxa — um laço de seis consultas de perfil já
        disparou `429: rate-overlimit` em medição. Se lhe basta identidade e
        estado, use `/session/profile`.

        **Degrada em vez de falhar**: se as consultas remotas caírem, a resposta
        ainda traz toda a base local, e o campo `unavailable` diz o que faltou e
        porquê. `unavailable` só aparece quando algo falta.

        **Como deduzir o tipo de conta — e a ressalva.** Não existe campo
        nenhum, em rota nenhuma desta API, que declare se a conta é WhatsApp
        Business ou pessoal (achado F260 do `HOUSEKEEP.md`). O que existem são
        dois sinais, medidos nas duas sessões vivas em 2026-08-26:

        | sinal | conta Business | conta pessoal |
        |---|---|---|
        | `platform` | `smbi` | `iphone` |
        | `business_name` | preenchido | vazio |

        **Isto é inferência sobre um valor que o PAR reporta, não uma
        declaração do protocolo.** Que `smbi` corresponda a "SMB iOS" é leitura
        do valor, coerente com a conta ser Business, e não um mapeamento medido
        no fio; `platform` reporta o aparelho emparelhado, e outros valores
        (`android`, `web`…) existem e não foram medidos aqui. Trate os dois
        campos como pista corroborável, não como resposta autoritativa.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  avatar_id: "214830039"
                  avatar_url: https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg
                  business_name: FilaRápida
                  connected: true
                  full_name: ""
                  initialized: true
                  jid: 5516981818244@s.whatsapp.net
                  lid: 29343770251463:25@lid
                  lid_migration_timestamp: 1766149842
                  logged_in: true
                  platform: smbi
                  privacy:
                    CallAdd: all
                    Defense: "off"
                    GroupAdd: all
                    LastSeen: contacts
                    Messages: all
                    Online: all
                    Profile: all
                    ReadReceipts: all
                    Status: contacts
                    Stickers: contacts
                  pushname: FilaRápida
                  registration_id: 4190140233
                  user_info:
                    5516981818244@s.whatsapp.net:
                      Devices:
                        - 5516981818244@s.whatsapp.net
                        - 5516981818244:25@s.whatsapp.net
                      LID: 29343770251463@lid
                      PictureID: "214830039"
                      Status: conta de testes
                      VerifiedName: null
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PerfilSessaoCompleto'
                    type: object
          description: |
            Perfil completo. O exemplo é a resposta REAL medida em 2026-08-26,
            abreviada na lista de dispositivos.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: no_session
                  message: no session
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: '`missing_session_id` ou `no_session`.'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar o perfil da conta com os dados que só a rede sabe
      tags:
        - Sessões
  /session/proxy:
    post:
      description: |
        Grava ou remove o proxy por onde o tráfego desta sessão sai, e opta por
        fazer — ou não — a entrega de webhook passar pelo mesmo caminho.

        **Exige a sessão DESLIGADA.** Com transporte vivo a resposta é
        `400 proxy_while_connected`: chame `GET /session/disconnect`, configure,
        e volte a ligar com `GET /session/connect`. Trocar o proxy por baixo de
        uma ligação a correr não teria efeito na ligação existente.

        **Regras**:

        - só `http` e `socks5` são aceites. `https` parece obviamente aceitável
          e **não é** — exige um transporte que este processo não monta, e volta
          como `400 unsupported_proxy_scheme`;
        - com `webhook_use_proxy` ligado, um endereço reservado ou de loopback é
          recusado (`400 reserved_proxy_address`): a entrega de webhook sairia
          por ele, e um proxy escolhido pelo inquilino tornar-se-ia um caminho à
          volta do validador de saída. Com ele desligado, o proxy só carrega o
          tráfego do WhatsApp e um endereço interno é permitido de propósito;
        - `enable: false` remove a configuração e **ignora** `proxy_url` — de
          outra forma, uma configuração estragada seria impossível de apagar;
        - a URL nunca aparece em log nem em mensagem de erro: ela carrega
          credenciais no userinfo. Só o esquema é observável.

        **A rota irmã** `POST /proxy/set` (grupo de integrações) faz o mesmo
        para o proxy global.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              enable: true
              proxy_url: socks5://proxy.interno:1080
              webhook_use_proxy: false
            schema:
              $ref: '#/components/schemas/PedidoProxy'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: Proxy configured successfully
                  proxy_url: socks5://proxy.interno:1080
                  set: true
                  webhook_use_proxy: false
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoProxy'
                    type: object
          description: |
            Configuração gravada. O ramo de remoção (`enable: false`) responde
            só com `details: "Proxy disabled successfully"`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: proxy_while_connected
                  message: cannot set proxy while connected. Please disconnect first
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `proxy_while_connected` (desligue a sessão primeiro),
            `missing_proxy_url`, `invalid_proxy_url`,
            `unsupported_proxy_scheme`, `reserved_proxy_address`,
            `missing_session_id` ou `could_not_decode_payload`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Configurar o proxy de saída desta sessão
      tags:
        - Sessões
  /session/s3/config:
    delete:
      description: |
        Apaga a configuração de armazenamento S3 e devolve a sessão à entrega
        de mídia em `base64`.

        **Regras**: exige um cliente vivo (`400 no_session`). A resposta sai só
        com `details` — `enabled` fica `false` e o campo é omitido.

        **Rota irmã**: `DELETE /s3/config` (grupo de integrações), mesmo
        manipulador.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: S3 configuration deleted successfully
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfigS3'
                    type: object
          description: Configuração removida.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Remover a configuração S3 desta sessão
      tags:
        - Sessões
    get:
      description: |
        Devolve a configuração de armazenamento S3 gravada para esta sessão.

        **O segredo não sai, e a access key vem sempre mascarada.** A leitura
        nem seleciona a coluna do segredo, portanto não há reformatação da
        resposta que o exponha; `access_key` devolve a constante `***`
        INCONDICIONALMENTE — mascarar só quando existe revelaria a existência.

        **Uma sessão sem configuração responde `200`**, com a configuração
        limpa (`enabled: false`, `path_style: true`, `media_delivery: base64`),
        e não um erro. É o que deixa distinguir "nada configurado" de "a leitura
        falhou".

        **Rota irmã**: `GET /s3/config` (grupo de integrações) é o mesmo
        manipulador, no caminho antigo.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  access_key: '***'
                  bucket: ""
                  enabled: false
                  endpoint: ""
                  media_delivery: base64
                  path_style: true
                  public_url: ""
                  region: ""
                  retention_days: 30
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VistaConfigS3'
                    type: object
          description: |
            Configuração actual. O exemplo é a resposta REAL medida em
            2026-08-26, numa sessão sem S3 configurado.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Ler a configuração S3 desta sessão
      tags:
        - Sessões
    post:
      description: |
        Grava, por inteiro, a configuração de armazenamento S3 desta sessão.
        **Não é actualização parcial**: o que não vier no corpo é gravado com o
        valor zero.

        **Regras, e a ordem em que são aplicadas** — a ordem é o contrato, não
        um detalhe:

        1. exige um cliente vivo (`400 no_session`);
        2. `media_delivery`, se vier, tem de ser `base64`, `s3` ou `both`;
           vazio assume `base64`; outro valor é
           `400 invalid_media_delivery` e **nada é gravado**;
        3. `endpoint`, se vier, passa pelo validador de saída — endereço
           reservado ou de loopback é `400 invalid_s3_endpoint`;
        4. o segredo é cifrado ANTES de a linha ser escrita: uma falha aqui não
           grava, ou a coluna guardaria a credencial em claro (ADR-0009);
        5. só depois de gravar é que o cliente S3 é registado. Se o registo
           falhar, a resposta é `500` **com a configuração já gravada** — é
           comportamento histórico deliberado: a configuração é o que se pediu
           para guardar, e a ligação é o que `POST /session/s3/test` existe para
           verificar.

        **`enabled: false` REVOGA**: o cliente construído com a credencial
        anterior é removido, senão continuaria a carregar mídia.

        **Rotas irmãs**: `POST /s3/configure` e o seu alias `POST /s3/config`
        (grupo de integrações) são o mesmo manipulador.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              access_key: AKIAIOSFODNN7EXAMPLE
              bucket: wa-api-media
              enabled: true
              endpoint: https://s3.eu-west-1.amazonaws.com
              media_delivery: s3
              path_style: true
              public_url: https://media.exemplo.com
              region: eu-west-1
              retention_days: 30
              secret_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            schema:
              $ref: '#/components/schemas/PedidoConfigS3'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: S3 configuration saved successfully
                  enabled: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoConfigS3'
                    type: object
          description: Configuração gravada e cliente S3 registado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_media_delivery
                  message: media_delivery must be 'base64', 's3', or 'both'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `invalid_media_delivery`, `invalid_s3_endpoint`, `no_session`,
            `missing_session_id` ou `could_not_decode_payload`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Gravar a configuração S3 desta sessão
      tags:
        - Sessões
  /session/s3/test:
    post:
      description: |
        Faz uma ida e volta REAL ao bucket, com a credencial GRAVADA, e diz se
        funcionou. Não é uma validação de forma: é uma chamada de rede, com
        tecto de 10 segundos.

        **O corpo do pedido é ignorado de propósito** — a rota testa o que está
        guardado, que é a única leitura que responde à pergunta que se faz aqui:
        *"a configuração que eu gravei funciona?"*. Aceitar credenciais no corpo
        testaria uma credencial diferente da que o envio de mídia vai usar.
        Envie o corpo vazio.

        **Regras**:

        - exige um cliente vivo (`400 no_session`);
        - exige S3 **ligado**: com `enabled: false` a resposta é
          `400 s3_not_enabled`;
        - um segredo gravado fora do formato cifrado **falha** o teste, e não é
          usado como texto em claro — de outra forma, uma linha legada
          continuaria a funcionar em silêncio e nunca seria reconfigurada;
        - qualquer falha da ida ao bucket sai como `500` com a causa na
          mensagem, não como `connected: false`.

        **Rota irmã**: `POST /s3/test` (grupo de integrações), mesmo
        manipulador.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  bucket: wa-api-media
                  connected: true
                  details: S3 connection test successful
                  region: eu-west-1
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoTesteS3'
                    type: object
          description: A ligação ao bucket funcionou. `bucket` e `region` ecoam o que foi testado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: s3_not_enabled
                  message: S3 is not enabled for this user
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: '`s3_not_enabled`, `no_session` ou `missing_session_id`.'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: internal_error
                  message: Ocorreu um erro interno.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O teste falhou: credencial recusada, bucket inexistente, endpoint
            inalcançável, tempo esgotado, ou o segredo gravado não pôde ser
            decifrado. A mensagem traz a causa.
      security:
        - TokenSessao: []
      summary: ⬜ Testar a configuração S3 gravada com uma ida real ao bucket
      tags:
        - Sessões
  /session/status:
    get:
      description: |
        Junta o estado AO VIVO da ligação (`connected`, `logged_in`) com o
        registo persistido da sessão — JID, webhook, eventos subscritos, proxy,
        limite de histórico e resumo da configuração S3.

        **Responde mesmo com a sessão em baixo, e isso é deliberado.** Não há
        guarda de sessão aqui: exigir um cliente vivo devolvia `400 no session`
        justamente no único momento em que alguém pergunta o estado — quando a
        sessão NÃO está de pé (F196). Uma sessão desligada responde `200` com
        `connected: false`.

        **`connected` e `logged_in` são coisas diferentes**: pode haver
        credencial válida com o transporte caído — é o que
        `GET /session/disconnect` produz.

        **`token` não aparece nesta resposta** — o apresentador da família sessão
        omite-o de propósito, para não ecoar o token da sessão numa sondagem de
        estado — e `hmac_configured` sai sempre `false`, mesmo quando existe
        chave HMAC gravada. Para a chave, pergunte a `GET /session/hmac/config`.

        **Quando usar**: como confirmação depois de `/session/connect` e do
        emparelhamento, e como sonda periódica de saúde de uma sessão.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  connected: true
                  events: ""
                  history: "100"
                  hmac_configured: false
                  id: 918e37366f27e1125ee0482a793267e1
                  jid: 5516981818244:25@s.whatsapp.net
                  logged_in: true
                  name: filarapida
                  proxy_config:
                    enabled: false
                    proxy_url: ""
                  proxy_url: ""
                  qr_code: ""
                  s3_config:
                    bucket: ""
                    enabled: false
                    endpoint: ""
                    media_delivery: base64
                    path_style: true
                    public_url: ""
                    region: ""
                    retention_days: 30
                  webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/EstadoSessao'
                    type: object
          description: |
            Estado no instante do pedido. O exemplo é a resposta REAL medida em
            2026-08-26, com a sessão ligada e autenticada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: no_session
                  message: no session
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `missing_session_id` quando o token é aceite mas não traz sessão, ou
            `no_session` quando não há registo de sessão no banco para ele.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Consultar o estado e o registo da sessão
      tags:
        - Sessões
  /session/ws:
    get:
      description: |
        **Esta rota é um UPGRADE para WebSocket, e o botão *Try it out* desta
        página NÃO a exercita.** O Swagger UI só fala HTTP; use um cliente de
        WebSocket (`wscat`, `websocat`, a API `WebSocket` do navegador).

        É o contraponto em tempo real de `GET /session/status` e
        `GET /session/qr`: em vez de sondar, o cliente recebe os eventos
        empurrados. As rotas REST continuam intactas — este canal é aditivo, não
        substituto.

        **Autenticação — e a única excepção da API.** O token vai no cabeçalho
        `token`, como em toda a parte; mas esta é a **única** rota onde
        `?token=` na query string continua a ser aceite, porque a API
        `WebSocket` do navegador não permite cabeçalho no handshake e não há
        alternativa (F75). O token que viaja assim é redigido no log.

        **O que chega**: exactamente os mesmos objectos que sairiam pelo webhook
        da sessão — quadros de texto com um objecto JSON PLANO, com `type` a
        dizer o evento e os campos do evento na raiz. **Não há envelope
        `{code,data,success}` aqui.**

        **O filtro é o mesmo do webhook**: só chegam os tipos subscritos em
        `users.events` (o campo `events` de `GET /session/status`). Uma sessão
        sem subscrições não recebe nada, e isso não é uma falha da ligação.

        Entre os tipos que este canal entrega:

        - emparelhamento — `QR` (traz `code`, `qrCodeBase64` e `expiresAt`),
          `QRTimeout`, `PairSuccess`, `PairError`;
        - ligação — `Connected`, `Disconnected`, `ConnectFailure`, `LoggedOut`,
          `KeepAliveTimeout`, `KeepAliveRestored`, `StreamError`;
        - mensagens — `Message`, `UndecryptableMessage`, `Receipt`,
          `ReadReceipt`, `MediaRetry`;
        - sincronização — `HistorySync`, `AppState`, `AppStateSyncComplete`,
          `OfflineSyncCompleted`;
        - restantes — grupos, contactos, etiquetas, presença, chamadas e canais.

        **Regras**:

        - o canal é só de empurrar. O servidor lê e DESCARTA o que o cliente
          enviar — a leitura existe apenas para detectar a queda da ligação;
        - o limite de leitura por quadro é de 1 MB;
        - várias ligações do mesmo token são permitidas e recebem todas o mesmo
          evento;
        - a entrega é de melhor esforço: um cliente parado não bloqueia nem
          atrasa a entrega ao webhook.

        **Exemplo de ligação**:

        ```
        wscat -c 'ws://localhost:8080/session/ws' -H 'token: <TOKEN>'
        ```
      responses:
        "101":
          content:
            application/json:
              example:
                code: 2@abc123...,def456...,ghi789...
                event: code
                expiresAt: "2026-08-26T13:18:34Z"
                qrCodeBase64: data:image/png;base64,iVBORw0KGgo...
                type: QR
              schema:
                $ref: '#/components/schemas/EventoWebSocket'
          description: |
            Protocolo trocado — a ligação passa a WebSocket e os eventos começam
            a chegar como quadros de texto. O esquema abaixo descreve a forma de
            CADA quadro, não um corpo de resposta HTTP.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_session_id
                  message: missing session id
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `missing_session_id`, ou falha do próprio upgrade — cabeçalhos de
            handshake em falta ou versão de WebSocket não suportada. Neste
            segundo caso a resposta vem da biblioteca de WebSocket e **não** usa
            o envelope da API.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
      security:
        - TokenSessao: []
      summary: ✅ Receber os eventos da sessão em tempo real (WebSocket)
      tags:
        - Sessões
  /status/set/audio:
    post:
      description: |
        Publica um áudio como status. Não aceita legenda — o áudio de status não
        a tem.

        **Regras**: `audio` aceita URI de dados começado por `data:audio/`
        **ou** URL `http(s)://`. O limite é de 16 MiB depois de descodificado.
        O campo de tipo chama-se `mime_type`, igual ao das rotas de imagem e
        vídeo — a migração para DTO (`pkg/presentation/http/dto/session/request.go`)
        unificou a grafia; antes disso a rota de áudio usava `mimetype` e as
        outras duas `MimeType`.

        **A mesma ressalva do `200`, medida**: os destinatários saem do campo
        `FullName` dos contactos, e numa conta WhatsApp Business isso deu
        **dois** destinatários para 461 contactos, contra 165 para 1266 numa
        conta pessoal. Ver F256 no `HOUSEKEEP.md`.

        **Não existe `/status/set/text`** — o recado textual é `POST /user/status`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              audio: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
            schema:
              $ref: '#/components/schemas/PedidoStatusAudio'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB01671E10F412B3DF41C
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            O WhatsApp aceitou a publicação. Não significa que algum contacto a
            ouça — leia a ressalva da descrição.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: unsupported_audio_source
                  message: audio must be base64 (data:audio/) or valid HTTP URL
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `audio` ausente (`missing_audio`), origem que não é URI de dados
            `data:audio/` nem URL (`unsupported_audio_source`), URI de dados
            ilegível (`invalid_data_uri`), áudio acima do limite
            (`audio_too_large`), corpo descodificado vazio (`empty_audio_body`),
            falha ao baixar o URL (`audio_fetch_failed`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: "\U0001F7E1 Publicar um status com áudio"
      tags:
        - Status
  /status/set/image:
    post:
      description: |
        Publica uma imagem como status — as "novidades" que expiram em 24 horas.

        **Quando usar**: para difundir um aviso visual aos contactos, sem
        escolher destinatários um a um. Quem vê é decidido pela privacidade de
        status da conta, legível em `GET /user/privacy`.

        **Regras**: `image` aceita URI de dados começado por `data:image` **ou**
        URL `http(s)://`; qualquer outra coisa é recusada com
        `unsupported_image_source`. O limite é de 16 MiB depois de
        descodificada, verificado ANTES da descodificação quando o URI declara
        `;base64`. O tipo resolvido tem de começar por `image/`, senão o pedido
        é recusado com `invalid_image_mime_type`.

        **A ressalva que o `200` esconde, e que foi medida**: um `200` com
        `message_id` **não garante que o status chegue a alguém**. A lista de
        destinatários é construída a partir do campo `FullName` de cada contacto
