# GERADO por "go run ./cmd/openapidoc" — NÃO EDITE À MÃO.
#
# As fontes são api/openapi/base.yaml (info, tags, segurança, componentes
# partilhados), api/openapi/paths/<grupo>.yaml (um por família de rotas) e
# api/openapi/schemas/<grupo>.yaml (esquemas próprios de cada família).
#
# O teste TestOpenAPIGeradoEstaAtualizado recusa este ficheiro se ele
# divergir das fontes.
components:
  parameters:
    IdNoCaminho:
      description: Identificador do recurso, em hexadecimal de 32 caracteres.
      in: path
      name: id
      required: true
      schema:
        example: 918e37366f27e1125ee0482a793267e1
        pattern: ^[0-9a-f]{32}$
        type: string
    JidNoCaminho:
      description: JID do utilizador, em forma PN ou LID.
      in: path
      name: jid
      required: true
      schema:
        example: 554192421234@s.whatsapp.net
        pattern: ^[0-9]+(:[0-9]+)?@(s\.whatsapp\.net|lid)$
        type: string
  responses:
    CorpoInvalido:
      content:
        application/json:
          example:
            code: 400
            error:
              code: decode_payload_failed
              message: could not decode payload
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: O corpo não é JSON válido, ou não corresponde à forma esperada.
    ErroInterno:
      content:
        application/json:
          example:
            code: 500
            error:
              code: internal_error
              message: internal server error
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        Falha não classificada, ou tempo esgotado à espera do WhatsApp (o
        limite por pedido é de 30 segundos).
    NaoAutorizado:
      content:
        application/json:
          example:
            code: 401
            error:
              code: unauthorized
              message: unauthorized
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        Token ausente, inválido ou revogado. Nas rotas `/admin`, significa que
        o cabeçalho `Authorization` não corresponde ao token de administração.
    RecusadoPeloWhatsApp:
      content:
        application/json:
          example:
            code: 422
            error:
              code: upstream_rejected
              message: WhatsApp refused this request; repeating it unchanged will not help
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        O pedido foi bem formado e chegou ao WhatsApp, que o recusou. Repetir
        o mesmo pedido não ajuda — algo no estado da conta, nas permissões ou
        no conteúdo tem de mudar primeiro.
    SemSessao:
      content:
        application/json:
          example:
            code: 400
            error:
              code: missing_session_id
              message: missing session id
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        O token foi aceite mas não há sessão associada. Acontece quando a
        sessão foi criada e ainda não emparelhada.
  schemas:
    AlvoConversa:
      description: |
        Nome universal do destino. Toda rota que recebe um destinatário o
        aceita; o nome antigo e específico da rota tem precedência quando
        ambos vierem.
      properties:
        chat:
          description: JID de destino — contacto, grupo ou canal.
          example: 554192421234@s.whatsapp.net
          type: string
      type: object
    AlvoGrupo:
      description: |
        O grupo sobre o qual a operação age. O nome específico da rota tem
        precedência sobre `chat` quando os dois vierem
        (`pkg/domain/chat_target.go:14-17`).

        **O nome do campo varia entre rotas desta família**, e não por acidente:
        `/group/photo/remove`, `/group/ephemeral` e `/group/joinapprovalmode`
        leem `groupjid` todo em minúsculas, e as restantes leem `groupJID`. Na
        prática o descodificador do Go casa nomes ignorando maiúsculas, logo as
        duas grafias funcionam em todas — mas o exemplo de cada rota traz a que
        foi medida.
      properties:
        chat:
          description: Nome universal do destino, aceite em toda a API.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      type: object
    Avatar:
      description: |
        Ponteiro para a foto de perfil. A imagem NÃO vem no corpo — vem o URL, e
        é dele que se baixa. O URL é temporário e assinado pelo WhatsApp.
      properties:
        id:
          description: Identificador da foto. Muda quando a pessoa troca a imagem.
          example: "1735689600"
          type: string
        url:
          description: URL da imagem, para ser baixado por quem chamou.
          example: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg
          type: string
      type: object
    BotaoInterativo:
      description: |
        Um botão de fluxo nativo, usado por `/chat/send/buttons` e por cada cartão
        de `/chat/send/carousel`.

        **O título é obrigatório na prática, e o nome do campo é `title`** — com
        `text` e `buttonText` como sinónimos, nesta ordem de precedência. Um botão
        sem nenhum dos três é DESCARTADO EM SILÊNCIO, e o pedido continua com os
        restantes; se todos caírem, a rota responde `400 no_valid_buttons`. Medido
        em 2026-08-26: um botão com `displayText` (o nome que `/chat/send/template`
        usa) cai aqui.

        O título é truncado em **20 runas** (`send_buttons.go:35`), e o corte
        acontece ANTES de o título servir de identificador — logo o `id` que volta
        no clique de quem recebeu já vem truncado.
      properties:
        buttonId:
          description: Sinónimo de `id`.
          type: string
        buttonText:
          description: Segundo sinónimo de `title`, usado quando `title` e `text` vêm vazios.
          type: string
        copy_code:
          description: Texto que um botão `copy` põe na área de transferência. Ignorado nos outros tipos.
          example: PEDIDO-1234
          type: string
        id:
          description: |
            Identificador devolvido no clique. Sinónimo `buttonId`. Quando os dois
            vêm vazios, o próprio título JÁ TRUNCADO vira o identificador.
          example: confirmar
          type: string
        phone_number:
          description: Número de um botão `cta_call`. Ignorado nos outros tipos.
          example: "+554192421234"
          type: string
        text:
          description: Sinónimo de `title`, usado quando `title` vem vazio.
          type: string
        title:
          description: Rótulo do botão. Sinónimos, nesta ordem, `text` e `buttonText`.
          example: Confirmar
          type: string
        type:
          description: |
            Tipo do botão. Vazio significa `reply`. Um tipo fora dos quatro abaixo
            faz o botão ser DESCARTADO em silêncio — em particular `quickreply`,
            que é válido em `/chat/send/template` e **não** aqui.
          enum:
            - reply
            - cta_url
            - cta_call
            - copy
          example: reply
          type: string
        url:
          description: Destino de um botão `cta_url`. Ignorado nos outros tipos.
          example: https://exemplo.com/pedido/1234
          type: string
      type: object
    BotaoModelo:
      description: |
        Um botão de modelo hidratado, usado só por `/chat/send/template`. Vocabulário
        DIFERENTE do `BotaoInterativo`: aqui o rótulo é `DisplayText` e os tipos são
        outros três.

        Não há validação do conteúdo por tipo — um botão `url` sem `Url` é aceite e
        produz um botão com destino vazio (`send_template.go`, comentário de
        `Execute`). E um `Type` desconhecido **não** é recusado: cai em `quickreply`.
      properties:
        DisplayText:
          description: Rótulo do botão.
          example: Abrir pedido
          type: string
        Id:
          description: |
            Identificador de um botão `quickreply`. Vazio significa "numere
            automaticamente" — a numeração decimal é montada no adaptador.
          example: "1"
          type: string
        PhoneNumber:
          description: Número de um botão `call`.
          example: "+554192421234"
          type: string
        Type:
          description: |
            Tipo do botão. Valor fora dos três cai em `quickreply`
            (`pkg/domain/message.go:786-789`).
          enum:
            - quickreply
            - url
            - call
          example: url
          type: string
        Url:
          description: Destino de um botão `url`.
          example: https://exemplo.com/pedido/1234
          type: string
      required:
        - DisplayText
      type: object
    CartaoCarrossel:
      description: |
        Um cartão de `/chat/send/carousel`.

        **Cada cartão exige `Body` e pelo menos um botão válido** — cartão sem um
        dos dois é descartado em silêncio, e se nenhum sobreviver a rota responde
        `400 no_valid_cards` (medido em 2026-08-26).
      properties:
        Body:
          description: Corpo do cartão. Obrigatório — cartão com corpo vazio é descartado.
          example: Molho de tomate, mozzarella e manjericão. R$ 45,00.
          type: string
        Buttons:
          description: Botões do cartão, com o mesmo vocabulário de `/chat/send/buttons`.
          items:
            $ref: '#/components/schemas/BotaoInterativo'
          type: array
        Footer:
          description: Rodapé do cartão.
          example: Entrega em 40 minutos
          type: string
        Image:
          description: |
            Imagem do cartão, como URI de dados (`data:image/...;base64,...`) ou
            URL http(s). Teto de 10 MB. Vazio significa cartão sem imagem.

            Ao contrário do corpo e dos botões, uma imagem que falhe a obtenção
            **não** derruba o cartão: ele segue sem imagem, e a falha fica no log.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          type: string
        Title:
          description: |
            Título do cartão. **É decorativo**: o iOS não o desenha, só o Android
            (HOUSEKEEP F217). Informação obrigatória vai em `Body`, não aqui.
          example: Pizza margherita
          type: string
      required:
        - Body
        - Buttons
      type: object
    CodigoQR:
      description: |
        Resposta de `GET /session/qr`. Medida no servidor vivo em 2026-08-26,
        numa sessão já autenticada.
      properties:
        QRCode:
          description: |
            Imagem do QR code em data URI (`data:image/png;base64,…`), lida da
            coluna `users.qrcode`.

            **Vazio é o caso normal, não um defeito.** A coluna só tem valor
            durante a janela de emparelhamento: o orquestrador grava a imagem a
            cada evento `QR` (`orchestrator.go:537`) e limpa-a no timeout
            (`orchestrator.go:552`). Numa sessão já autenticada — ou numa que
            nunca chamou `/session/connect` — a resposta é `{"QRCode": ""}` com
            `200`.
          example: ""
          type: string
      required:
        - QRCode
      type: object
    ConfiguracaoHmacLida:
      description: |
        Resposta de `GET /hmac/config`. Reporta **presença**, não valor: a chave
        nunca sai daqui, nem em claro nem cifrada.
      properties:
        hmac_key:
          description: |
            `""` quando não há chave configurada, `"***"` quando há. Nenhum outro
            valor é possível.
          example: ""
          type: string
      required:
        - hmac_key
      type: object
    ConfiguracaoProxyUtilizador:
      description: |
        Proxy de saída, no formato de ESCRITA das rotas `/admin/users` — camelCase,
        diferente do snake_case da resposta e do corpo de `POST /proxy/set`.

        Na edição, `enabled: false` limpa o `proxy_url` gravado.
      properties:
        enabled:
          description: Quando `false` na edição, o URL gravado é apagado.
          example: false
          type: boolean
        proxyUrl:
          description: |
            URL do proxy. Costuma trazer credenciais no userinfo — nunca é
            devolvido nem registado em log.
          example: socks5://utilizador:senha@proxy.exemplo.com.br:1080
          type: string
        webhookUseProxy:
          description: Se a entrega dos webhooks também sai por este proxy. Ausente preserva o valor gravado.
          example: true
          type: boolean
      type: object
    ConfiguracaoS3Lida:
      description: |
        Resposta de `GET /s3/config`. **Não tem `secret_key`**, e a ausência é
        deliberada: a leitura nunca consulta essa coluna, portanto o segredo não
        tem por onde sair.
      properties:
        access_key:
          description: |
            **Sempre `***`**, mesmo sem chave configurada — mascarar só quando
            existe revelaria a existência.
          example: '***'
          type: string
        bucket:
          example: ""
          type: string
        enabled:
          example: false
          type: boolean
        endpoint:
          example: ""
          type: string
        media_delivery:
          enum:
            - base64
            - s3
            - both
          example: base64
          type: string
        path_style:
          example: true
          type: boolean
        public_url:
          example: ""
          type: string
        region:
          example: ""
          type: string
        retention_days:
          example: 30
          type: integer
      type: object
    ConfiguracaoS3Utilizador:
      description: |
        Armazenamento S3, no formato de ESCRITA das rotas `/admin/users` —
        camelCase, diferente do snake_case de `POST /s3/config` e da resposta de
        leitura.
      properties:
        accessKey:
          example: AKIAIOSFODNN7EXAMPLE
          type: string
        bucket:
          example: wa-api-midia
          type: string
        enabled:
          example: true
          type: boolean
        endpoint:
          example: https://s3.sa-east-1.amazonaws.com
          type: string
        mediaDelivery:
          enum:
            - base64
            - s3
            - both
          example: both
          type: string
        pathStyle:
          example: false
          type: boolean
        publicUrl:
          example: https://midia.exemplo.com.br
          type: string
        region:
          example: sa-east-1
          type: string
        retentionDays:
          example: 30
          type: integer
        secretKey:
          description: Cifrada antes de tocar no banco. Nunca é devolvida por nenhuma rota.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          type: string
      type: object
    ConfiguracaoWebhook:
      description: Resposta de `GET /webhook` — o que está gravado no banco para esta sessão.
      properties:
        subscribe:
          description: |
            Eventos subscritos. **Armadilha medida**: sem eventos subscritos, esta
            lista vem como `[""]` — uma lista com uma string vazia, e não uma lista
            vazia, porque é o resultado de partir por vírgula uma coluna vazia.
          example:
            - Message
            - Receipt
          items:
            type: string
          type: array
        webhook:
          description: URL de destino. Vazio quando não há webhook configurado.
          example: https://exemplo.com.br/wa-api/eventos
          type: string
      required:
        - webhook
        - subscribe
      type: object
    ContactoDoRoster:
      description: |
        Uma entrada do roster. Repare que os nomes vêm de fontes diferentes:
        `FullName` vem de sincronização de agenda, `PushName` vem do nome que a
        própria pessoa publica. Numa conta WhatsApp Business quase tudo chega por
        `PushName` — 460 de 461 contactos medidos —, e isso tem consequência para
        a publicação de status (ver `POST /status/set/image`).
      properties:
        BusinessName:
          description: Nome comercial, quando a conta é comercial.
          example: ""
          type: string
        FirstName:
          description: Primeiro nome, quando veio da agenda.
          example: ""
          type: string
        Found:
          description: Se a entrada foi encontrada no armazenamento local de contactos.
          example: true
          type: boolean
        FullName:
          description: Nome completo, quando veio da agenda. É o campo que a lista de destinatários de status usa.
          example: ""
          type: string
        PushName:
          description: Nome que a própria pessoa publica. É o que costuma estar preenchido.
          example: Janio Gonzalez
          type: string
        RedactedPhone:
          description: Número parcialmente ocultado, quando o WhatsApp o fornece em vez do número inteiro.
          example: ""
          type: string
      type: object
    ContextoResposta:
      description: Citação — faz a mensagem enviada aparecer como resposta a outra.
      properties:
        Participant:
          description: JID de quem escreveu a mensagem citada.
          example: 554192421234@s.whatsapp.net
          type: string
        QuotedText:
          description: Texto da mensagem citada, para o cliente desenhar a pré-visualização.
          example: Bom dia, tudo certo com o pedido?
          type: string
        StanzaId:
          description: '`message_id` da mensagem citada.'
          example: 3EB0A4B2AFD45E625C0917
          type: string
      required:
        - StanzaId
        - Participant
      type: object
    DadosUtilizadorApagado:
      description: |
        Identificação da sessão removida por `DELETE /admin/users/{id}/full`, para
        o registo de quem chamou.

        `name` e `jid` são lidos ANTES da remoção; se essa leitura falhar, a
        remoção prossegue e estes campos vêm vazios.
      properties:
        id:
          example: 918e37366f27e1125ee0482a793267e1
          type: string
        jid:
          example: 5516981818244:25@s.whatsapp.net
          type: string
        name:
          example: filarapida
          type: string
      type: object
    DefinicoesPrivacidade:
      description: |
        As definições de privacidade da conta, tal como o WhatsApp as devolve.

        **Atenção à assimetria de nomes**: a LEITURA devolve as chaves em
        `PascalCase` (`GroupAdd`, `LastSeen`…), mas a ESCRITA em
        `POST /user/privacy` recebe o nome em minúsculas (`groupadd`, `last`…).
        São vocabulários diferentes para a mesma definição, e a tabela de
        validação da escrita (`pkg/domain/privacy.go:54-62`) conhece só sete das
        dez chaves devolvidas aqui.
      properties:
        CallAdd:
          description: Quem pode ligar para a conta. Escreve-se como `calladd`.
          example: all
          type: string
        Defense:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita**. O significado
            exacto não foi determinado com segurança pela implementação actual.
          example: "off"
          type: string
        GroupAdd:
          description: Quem pode adicionar a conta a grupos. Escreve-se como `groupadd`.
          example: all
          type: string
        LastSeen:
          description: Quem vê a hora do último acesso. Escreve-se como `last`.
          example: contacts
          type: string
        Messages:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita** — não consta
            da tabela de validação, logo não é definível por esta API.
          example: all
          type: string
        Online:
          description: Quem vê a conta como online. Escreve-se como `online`.
          example: all
          type: string
        Profile:
          description: Quem vê a foto de perfil. Escreve-se como `profile`.
          example: all
          type: string
        ReadReceipts:
          description: Se os confirmativos de leitura são enviados. Escreve-se como `readreceipts`.
          example: all
          type: string
        Status:
          description: Quem vê os status publicados. Escreve-se como `status`.
          example: contacts
          type: string
        Stickers:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita** — não consta
            da tabela de validação.
          example: contacts
          type: string
      type: object
    Detalhes:
      description: Confirmação textual de uma operação sem carga útil própria.
      properties:
        Details:
          example: Group name set successfully
          type: string
      type: object
    EntradaDoIndiceDeConversas:
      description: Uma conversa do índice, e quando teve a última mensagem gravada.
      properties:
        chat_jid:
          example: 554192421234@s.whatsapp.net
          type: string
        last_updated:
          description: Instante já formatado em RFC 3339, com nanossegundos.
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          type: string
      required:
        - chat_jid
        - last_updated
      type: object
    Envelope:
      description: Forma comum a toda resposta de sucesso.
      properties:
        code:
          description: Estado HTTP, repetido no corpo.
          example: 200
          type: integer
        data:
          description: A carga útil, com forma própria de cada rota.
          nullable: true
        success:
          description: Sempre `true` em sucesso. Campo legado, será removido.
          example: true
          type: boolean
      required:
        - code
        - success
      type: object
    Erro:
      description: |
        Forma comum a toda resposta de erro que passa pela taxonomia `apperr`.
      properties:
        code:
          description: Estado HTTP, repetido no corpo.
          example: 400
          type: integer
        error:
          properties:
            code:
              description: |
                Código estável em `snake_case`. É por aqui que um cliente deve
                decidir o que fazer — a mensagem pode mudar, o código não.
              example: missing_chat
              type: string
            message:
              description: Descrição legível, segura para mostrar ao utilizador.
              example: missing chat in payload
              type: string
          required:
            - code
            - message
          type: object
        success:
          enum:
            - false
          example: false
          type: boolean
      required:
        - code
        - error
        - success
      type: object
    ErroTextoSimples:
      description: |
        Forma ANTIGA de erro, com `error` em texto simples em vez do objecto.
        Sobrevive em catorze pontos do código — sobretudo nas recusas de campo
        obrigatório das rotas de grupo (`rejectMissingField`). Registado como
        F266 no `HOUSEKEEP.md`. Um cliente que leia `error.code` parte aqui.
      properties:
        code:
          example: 400
          type: integer
        error:
          example: bad request
          type: string
        success:
          enum:
            - false
          example: false
          type: boolean
      required:
        - code
        - error
        - success
      type: object
    EstadoConexao:
      description: |
        Resposta de `GET /session/connect`. O corpo NÃO é o `ConnectResult` do
        domínio: o manipulador responde um mapa literal
        (`handler_session.go:131`), e `status` é o único campo que sai.
      properties:
        status:
          description: |
            Constante `connecting`. A ligação ao WhatsApp arranca numa goroutine
            DEPOIS da resposta — este `200` significa "aceitei o pedido e a posse
            da sessão é minha", não "estou ligado". Quem confirma é
            `GET /session/status`.
          enum:
            - connecting
          example: connecting
          type: string
      required:
        - status
      type: object
    EstadoProntidao:
      description: Resposta da sonda de prontidão, com o resultado de cada dependência.
      properties:
        capabilities:
          additionalProperties:
            type: string
          description: Configuração em vigor que altera o comportamento do serviço.
          example:
            cluster: single
          type: object
        checks:
          additionalProperties:
            type: string
          description: Uma entrada por dependência verificada, com o seu resultado.
          example:
            database: ok
          type: object
        status:
          description: |
            `ready` quando todas as verificações passam. Qualquer outro valor
            significa que o serviço não deve receber tráfego.
          enum:
            - ready
            - degraded
          example: ready
          type: string
      required:
        - status
        - checks
      type: object
    EstadoSessao:
      description: |
        Retrato da sessão devolvido por `GET /session/status`. MEDIDO no servidor
        vivo em 2026-08-26 — a forma abaixo é a resposta real, não a struct.

        Junta o estado AO VIVO (`connected`, `loggedIn`, lidos do registo de
        clientes) com o registo PERSISTIDO da sessão (o resto).
      properties:
        connected:
          description: |
            Há transporte vivo para o WhatsApp. Distinto de `loggedIn`: uma
            sessão pode estar autenticada com o transporte caído
            (`GET /session/disconnect` produz exactamente isso).
          example: true
          type: boolean
        events:
          description: |
            Lista de tipos de evento subscritos, separados por vírgula. É esta
            lista que decide o que sai pelo webhook E pelo `GET /session/ws`.
          example: Message,Connected,Disconnected
          type: string
        history:
          description: |
            Limite de mensagens gravadas em `message_history`, **como texto** —
            o caso de uso converte o inteiro com `strconv.Itoa`
            (`session/get_status.go:88`). `"0"` significa gravação desligada, que
            é o valor de origem.
          example: "100"
          type: string
        hmac_configured:
          description: |
            **Sempre `false`.** Como `token`, este campo não é preenchido pelo
            caso de uso (`session/get_status.go:78-97`) e sai com o valor zero
            mesmo quando existe chave HMAC gravada. Para saber se há chave, use
            `GET /session/hmac/config`, que reporta a presença de forma honesta.
          example: false
          type: boolean
        id:
          description: Identificador da sessão no wa-api, hexadecimal de 32 caracteres.
          example: 918e37366f27e1125ee0482a793267e1
          type: string
        jid:
          description: |
            JID da conta ligada, na forma PN e COM o sufixo de dispositivo
            (`:25`). Vazio enquanto a sessão não estiver autenticada.
          example: 5516981818244:25@s.whatsapp.net
          type: string
        loggedIn:
          description: A sessão está emparelhada e autenticada — é a que consegue operar.
          example: true
          type: boolean
        name:
          description: Nome dado à sessão em `POST /admin/users`.
          example: filarapida
          type: string
        proxy_config:
          description: Estado do proxy, repetido em forma estruturada.
          properties:
            enabled:
              example: false
              type: boolean
            proxyUrl:
              example: ""
              type: string
          type: object
        proxy_url:
          description: Proxy de saída desta sessão, ou vazio.
          example: ""
          type: string
        qrcode:
          description: O mesmo valor que `GET /session/qr` devolve — vazio fora da janela de emparelhamento.
          example: ""
          type: string
        s3_config:
          description: |
            Resumo da configuração S3 desta sessão. É um subconjunto do que
            `GET /session/s3/config` devolve, e não traz nem a access key
            mascarada.
          properties:
            bucket:
              example: ""
              type: string
            enabled:
              example: false
              type: boolean
            endpoint:
              example: ""
              type: string
            media_delivery:
              example: base64
              type: string
            path_style:
              example: true
              type: boolean
            public_url:
              example: ""
              type: string
            region:
              example: ""
              type: string
            retention_days:
              example: 30
              type: integer
          type: object
        token:
          description: |
            **Sempre vazio.** O caso de uso constrói o resultado sem preencher
            este campo (`session/get_status.go:78-97`), logo ele sai com o valor
            zero em toda resposta. Não use isto para recuperar o token da sessão
            — ele não é recuperável depois de criado.
          example: ""
          type: string
        webhook:
          description: URL do webhook desta sessão, ou vazio se não houver.
          example: ""
          type: string
      type: object
    EstadoSonda:
      description: |
        Resposta das sondas de vivacidade. Repare que NÃO usa o envelope comum —
        é resposta de infraestrutura, lida por orquestradores que esperam a forma
        mais simples possível.
      properties:
        status:
          description: Constante `ok`. O que informa é o código HTTP e a própria resposta chegar.
          enum:
            - ok
          example: ok
          type: string
      required:
        - status
      type: object
    Etiqueta:
      description: |
        Uma etiqueta do WhatsApp Business, recolhida dos eventos que os outros
        aparelhos anunciam. O wa-api **não as cria** — a biblioteca não sabe
        fazê-lo.
      properties:
        color:
          description: Índice da cor na paleta do WhatsApp Business.
          example: 0
          type: integer
        deleted:
          description: |
            Etiquetas apagadas **continuam na lista**, marcadas aqui. Filtre por
            este campo se só quiser as activas.
          example: false
          type: boolean
        label_id:
          description: |
            Identificador da etiqueta. É um número curto atribuído pelo WhatsApp
            Business, não um UUID — na instância medida, `"3"`. É este valor que
            entra em `GET /labels/{id}/chats`.
          example: "3"
          type: string
        name:
          description: |
            Nome da etiqueta. **Pode vir com caracteres invisíveis de marcação de
            direcção do texto** no início, postos pelo próprio WhatsApp — foi o
            caso na medição de 2026-08-26.
          example: Grupos
          type: string
        predefined_id:
          description: Índice da etiqueta predefinida de origem. `0` quando não vem de nenhuma.
          example: 0
          type: integer
        updated_at:
          description: Instante da última alteração anunciada, com o fuso do aparelho que a anunciou.
          example: "2026-07-20T05:28:22.008-04:00"
          format: date-time
          type: string
      type: object
    EtiquetaConversa:
      description: Associação entre uma etiqueta e uma conversa, como `GET /labels/{id}/chats` a devolve.
      properties:
        chat_jid:
          description: JID da conversa — contacto, grupo ou canal.
          example: 120363411669320145@g.us
          type: string
        label_id:
          example: "3"
          type: string
        labeled:
          description: |
            Se a etiqueta está **aplicada** neste instante. Uma associação retirada
            continua na tabela com `false`.
          example: true
          type: boolean
        updated_at:
          example: "2026-07-20T05:28:22.008-04:00"
          format: date-time
          type: string
      type: object
    EventoWebSocket:
      description: |
        Forma de cada quadro de texto que `GET /session/ws` empurra. NÃO usa o
        envelope `{code,data,success}` das rotas REST: é o MESMO objecto que sai
        para o webhook da sessão, serializado uma vez e difundido a todas as
        ligações vivas daquele token.

        O objecto é PLANO: `type` diz o evento, e os restantes campos são os do
        próprio evento, na raiz.
      properties:
        code:
          description: No evento `QR`, o texto cru do código — qualquer cliente consegue desenhá-lo sozinho.
          example: 2@abc123...,def456...,ghi789...
          type: string
        event:
          description: |
            Subtipo, presente nos eventos de emparelhamento: `code` no `QR`,
            `timeout` no `QRTimeout`, `pair_success` no `PairSuccess`. É
            redundante com `type` e existe por compatibilidade.
          example: code
          type: string
        expiresAt:
          description: No evento `QR`, a validade real daquele código, em RFC3339. Pode faltar quando não há validade conhecida.
          example: "2026-08-26T13:18:34Z"
          format: date-time
          type: string
        jid:
          description: No `PairSuccess`, o JID da conta que acabou de emparelhar.
          example: 5516981818244:25@s.whatsapp.net
          type: string
        qrCodeBase64:
          description: |
            No evento `QR`, a imagem já codificada em data URI. Pode faltar: se a
            codificação da imagem falhar, o evento sai à mesma, só com `code`.
          example: data:image/png;base64,iVBORw0KGgo...
          type: string
        type:
          description: |
            Tipo do evento. Vem da mesma lista que `users.events` filtra
            (`pkg/domain/constants.go`) — entre outros: `QR`, `QRTimeout`,
            `PairSuccess`, `Connected`, `Disconnected`, `ConnectFailure`,
            `LoggedOut`, `Message`, `Receipt`, `ReadReceipt`, `Presence`,
            `HistorySync`, `AppStateSyncComplete`, `GroupInfo`, `Picture`,
            `PushName`, `BusinessName`, `Blocklist`, `CallOffer`.
          example: QR
          type: string
      required:
        - type
      type: object
    IdCliente:
      description: |
        Identificador da mensagem escolhido pelo CLIENTE, e não pelo servidor.
        Quando vazio, o wa-noise gera um. Serve para tornar o envio idempotente do
        lado de quem chama: o mesmo `Id` reenviado produz a mesma mensagem no
        servidor do WhatsApp.

        Não confundir com o `message_id` da resposta — em todas as rotas de envio
        salvo `/chat/send/edit`, os dois coincidem quando o cliente fornece `Id`.
      example: 3EB0A4B2AFD45E625C0917
      type: string
    IndiceDeConversas:
      additionalProperties:
        items:
          $ref: '#/components/schemas/EntradaDoIndiceDeConversas'
        type: array
      description: |
        Resposta de `chat_jid=index`: as conversas do chamador com o instante da
        última mensagem gravada em cada uma. É um MAPA cuja chave é o id da
        sessão — forma histórica preservada; hoje traz no máximo a chave do
        próprio chamador.
      example:
        918e37366f27e1125ee0482a793267e1:
          - chat_jid: 554192421234@s.whatsapp.net
            last_updated: "2026-08-26T09:08:10.351982-04:00"
          - chat_jid: 120363411669320145@g.us
            last_updated: "2026-08-24T19:01:14.41138-04:00"
      type: object
    InfoGrupo:
      description: |
        Metadados de um grupo. Devolvido por `POST /group/info` (dentro de
        `group_info`), por `POST /group/list` (uma entrada por grupo) e por
        `POST /group/inviteinfo` (dentro de `invite_info`).

        **As três origens não trazem o mesmo conteúdo**, e isso foi medido:
        `POST /group/list` devolve `ParticipantCount: 0` para todos os grupos,
        enquanto `POST /group/info` sobre o MESMO grupo, no mesmo minuto,
        devolveu `2`. Para contar membros use `Participants`, que vem correcto
        nas duas, ou peça `/group/info`. A resposta de `/group/inviteinfo` traz
        `AnnounceVersionID`, `ParticipantVersionID` e `MemberAddMode` vazios.
      properties:
        AddressingMode:
          description: |
            Que forma de identificador o grupo usa no fio. Veio `lid` em todos os
            grupos medidos.
          example: lid
          type: string
        AnnounceVersionID:
          description: |
            Versão do estado de anúncio, atribuída pelo servidor. Vem vazia na
            resposta de `POST /group/inviteinfo`.
          example: "1787748173200757"
          type: string
        CreatorCountryCode:
          description: País da conta que criou o grupo, em duas letras.
          example: BR
          type: string
        DefaultMembershipApprovalMode:
          description: |
            Só vem preenchido em comunidades, com `request_required`. Vazio em
            grupos normais.
          example: ""
          type: string
        DisappearingTimer:
          description: |
            Duração das mensagens temporárias, em SEGUNDOS — `86400` para as 24
            horas que `POST /group/ephemeral` pede como `"24h"`, `0` quando
            desligado. A rota recebe texto e a leitura devolve segundos.
          example: 86400
          type: integer
        GroupCreated:
          description: Quando o grupo foi criado.
          example: "2026-08-26T08:42:47-04:00"
          format: date-time
          type: string
        IsAnnounce:
          description: |
            Só administradores enviam mensagens. É o que `POST /group/announce`
            alterna.
          example: false
          type: boolean
        IsDefaultSubGroup:
          description: |
            Este é o sub-grupo de avisos que o WhatsApp cria sozinho ao criar uma
            comunidade. Não foi criado por ninguém e não deve ser apagado.
          example: false
          type: boolean
        IsEphemeral:
          description: O grupo tem mensagens temporárias ligadas.
          example: true
          type: boolean
        IsIncognito:
          description: |
            Grupo em que os participantes não vêem os números uns dos outros. Os
            sub-grupos de aviso criados automaticamente por uma comunidade vêm
            com este campo verdadeiro.
          example: false
          type: boolean
        IsJoinApprovalRequired:
          description: |
            Entrar exige aprovação de um administrador. É o que
            `POST /group/joinapprovalmode` alterna, e é o que faz
            `GET /group/requestparticipants` ter alguma coisa para listar.
          example: false
          type: boolean
        IsLocked:
          description: |
            Só administradores editam nome, descrição e foto. É o que
            `POST /group/locked` alterna.
          example: false
          type: boolean
        IsParent:
          description: |
            Este "grupo" é na verdade uma COMUNIDADE. É o que
            `POST /group/create` com `is_parent: true` produz.
          example: false
          type: boolean
        JID:
          description: Identificador do grupo.
          example: 120363411669320145@g.us
          type: string
        LinkedParentJID:
          description: |
            A comunidade de que este grupo é sub-grupo. Vazio num grupo solto.
          example: ""
          type: string
        MemberAddMode:
          description: |
            Quem pode acrescentar membros. Os valores do protocolo são
            `admin_add` e `all_member_add`
            (`internal/wa-noise/protocol/types/group.go:9-12`). Vem vazio em
            `POST /group/inviteinfo`. Nenhuma rota desta API o altera.
          example: admin_add
          type: string
        Name:
          description: Nome do grupo, o que `POST /group/name` altera.
          example: Equipa de entregas
          type: string
        NameSetAt:
          description: Quando o nome actual foi definido.
          example: "2026-08-26T08:42:49-04:00"
          format: date-time
          type: string
        NameSetBy:
          description: Quem definiu o nome actual, em forma LID.
          example: 90937376170214@lid
          type: string
        NameSetByPN:
          description: O mesmo, em forma PN.
          example: 554192421234@s.whatsapp.net
          type: string
        OwnerJID:
          description: Quem criou o grupo, em forma LID.
          example: 90937376170214@lid
          type: string
        OwnerPN:
          description: O mesmo criador, em forma PN.
          example: 554192421234@s.whatsapp.net
          type: string
        ParticipantCount:
          description: |
            Número de membros. **Medido a zero em `POST /group/list`** para todos
            os grupos, incluindo os que `POST /group/info` conta correctamente no
            mesmo instante. Não use este campo a partir da listagem; conte
            `Participants`.
          example: 2
          type: integer
        ParticipantVersionID:
          description: |
            Versão da lista de participantes, atribuída pelo servidor. Muda a cada
            entrada ou saída. Vem vazia em `POST /group/inviteinfo`.
          example: "1787748408570878"
          type: string
        Participants:
          description: |
            Os membros. Vem correcta nas três origens — ao contrário de
            `ParticipantCount`.
          items:
            $ref: '#/components/schemas/ParticipanteGrupo'
          type: array
        Suspended:
          description: O grupo está suspenso pelo WhatsApp.
          example: false
          type: boolean
        Topic:
          description: Descrição do grupo, o que `POST /group/topic` altera.
          example: Combinações de rota do turno da manhã
          type: string
        TopicDeleted:
          description: A descrição foi apagada, e não apenas nunca definida.
          example: false
          type: boolean
        TopicID:
          description: |
            Identificador da descrição actual. Tem a forma de um `message_id`
            porque a descrição de grupo VIAJA como mensagem no protocolo.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        TopicSetAt:
          description: |
            Quando a descrição actual foi definida. Num grupo sem descrição vem
            `0001-01-01T00:00:00Z`, o zero do Go, e não nulo nem ausente.
          example: "2026-08-26T08:42:50-04:00"
          format: date-time
          type: string
        TopicSetBy:
          description: Quem definiu a descrição, em forma LID.
          example: 90937376170214@lid
          type: string
        TopicSetByPN:
          description: O mesmo, em forma PN.
          example: 554192421234@s.whatsapp.net
          type: string
      type: object
    InfoUtilizador:
      description: O que o WhatsApp sabe sobre uma conta, do ponto de vista da sessão que pergunta.
      properties:
        Devices:
          description: |
            Aparelhos ligados àquela conta, cada um com o seu sufixo de
            dispositivo. O primeiro, sem sufixo, é o aparelho principal.
          example:
            - 554192421234@s.whatsapp.net
            - 554192421234:41@s.whatsapp.net
            - 554192421234:76@s.whatsapp.net
          items:
            type: string
          type: array
        LID:
          description: Identificador de privacidade da conta, quando o mapeamento é conhecido.
          example: 90937376170214@lid
          type: string
        PictureID:
          description: Identificador da foto de perfil actual, para detectar troca sem baixar a imagem.
          example: ""
          type: string
        Status:
          description: O "recado" do perfil. Vazio quando a privacidade o esconde ou não há nenhum.
          example: ""
          type: string
        VerifiedName:
          description: |
            Bloco de verificação comercial. `null` para contas pessoais — medido
            em campo. A forma do bloco quando NÃO é nulo não foi determinada com
            segurança: nenhuma das contas de teste devolveu um.
          nullable: true
      type: object
    InfoUtilizadores:
      description: |
        Bloco `users`, indexado pelo JID consultado. É o objecto cru do módulo de
        protocolo — a camada de aplicação não o decompõe de propósito, para não
        arrastar o tipo do SDK para dentro dela.
      properties:
        users:
          additionalProperties:
            $ref: '#/components/schemas/InfoUtilizador'
          description: Uma entrada por JID consultado que o servidor conseguiu responder.
          type: object
      required:
        - users
      type: object
    LimiteHistorico:
      description: |
        Limite de gravação de MENSAGENS por conversa (coluna `users.history`) —
        apesar de as rotas se chamarem `/webhook/history`, isto não tem que ver com
        entregas de webhook (HOUSEKEEP F252).
      properties:
        Details:
          description: Confirmação textual. Só aparece na escrita.
          example: History configured successfully
          type: string
        History:
          description: |
            Quantas mensagens são gravadas por conversa. **`0` significa gravação
            desactivada**, e o campo vem sempre presente para que o zero seja
            distinguível de um campo ausente.
          example: 100
          type: integer
      required:
        - History
      type: object
    LinhaLista:
      description: |
        Uma linha de uma secção de `/chat/send/list`.

        **Linha sem `title` é descartada em silêncio.** Se todas as linhas de uma
        secção caírem, a secção cai também; se nenhuma secção sobreviver, a rota
        responde `400 no_valid_sections` (`send_list.go:171-215`).
      properties:
        RowID:
          description: Primeiro sinónimo de `RowId`.
          type: string
        RowId:
          description: |
            Identificador devolvido na escolha. Sinónimos, nesta ordem de
            precedência, `RowID`, `rowId` e `rowID`. Quando os quatro vêm vazios,
            o próprio título (já sem espaços nas pontas) vira o identificador.
          example: margherita
          type: string
        desc:
          description: Descrição secundária, mostrada abaixo do título.
          example: Molho de tomate, mozzarella e manjericão
          type: string
        rowID:
          description: Terceiro sinónimo de `RowId`.
          type: string
        rowId:
          description: Segundo sinónimo de `RowId`.
          type: string
        title:
          description: Texto da linha. Obrigatório na prática — sem ele a linha é descartada.
          example: Pizza margherita
          type: string
      type: object
    ListaBloqueados:
      description: |
        A lista de bloqueados da sessão. **Esta resposta NÃO usa o envelope
        comum** — o manipulador serializa o resultado e escreve-o directamente
        (`handler_blocklist.go:66-73`), pelo que não há `code`, `data` nem
        `success`. Medido.
      properties:
        Blocklist:
          description: JIDs bloqueados, em forma canónica. Array vazio quando não há nenhum.
          example: []
          items:
            type: string
          type: array
        DHash:
          description: |
            Hash com que o WhatsApp versiona a lista. Serve para detectar que a
            lista mudou sem a comparar entrada a entrada.
          example: "1787412261963655"
          type: string
      required:
        - Blocklist
        - DHash
      type: object
    ListaCanais:
      description: |
        Resposta de `GET /newsletter/list`. Repare no envelope duplo: a carga útil
        é um objecto com a chave `newsletter`, e só dentro dela está a lista.
      properties:
        newsletter:
          description: |
            Os canais que a sessão segue. Inclui canais em `state.type: deleted` —
            medido a 2026-08-26 — logo um cliente que liste canais utilizáveis tem
            de filtrar por estado.
          items:
            $ref: '#/components/schemas/MetadadosCanal'
          type: array
      required:
        - newsletter
      type: object
    MencoesEnvio:
      description: |
        JIDs a mencionar no corpo da mensagem. O texto da menção (`@554192421234`)
        tem de estar no corpo — este campo só diz ao WhatsApp quem notificar.

        Aceite pelas rotas com texto visível (CAP-47). As rotas sem texto próprio —
        `/chat/send/audio`, `/chat/send/sticker`, `/chat/send/location`,
        `/chat/send/contact`, `/chat/send/poll` e `/chat/send/pollvote` — não têm
        este campo no seu payload.
      example:
        - 554192421234@s.whatsapp.net
      items:
        type: string
      type: array
    MensagemDoHistorico:
      description: |
        Uma mensagem do histórico LOCAL. É leitura do nosso banco, não do
        WhatsApp — por isso responde com o telemóvel offline.
      properties:
        chat_jid:
          description: |
            Conversa sob a qual a linha está arquivada. Pode DIFERIR do
            `chat_jid` que foi pedido: um pedido em `@lid` funde as linhas
            guardadas sob o telefone da mesma pessoa.
          example: 554192421234@s.whatsapp.net
          type: string
        data_json:
          description: |
            O evento COMPLETO do WhatsApp, serializado como uma string de JSON —
            e não como objecto. Para o usar é preciso desserializar o valor uma
            segunda vez.

            É daqui que saem os sete campos do descritor de mídia que as rotas
            `/chat/download*` exigem, sob
            `Message.imageMessage` / `videoMessage` / `audioMessage` /
            `documentMessage` / `stickerMessage`.
          example: '{"Info":{"Chat":"554192421234@s.whatsapp.net","ID":"2A196F2C7F3F02A666F6"},"Message":{"imageMessage":{"URL":"https://mmg.whatsapp.net/o1/v/t24/exemplo","directPath":"/o1/v/t24/exemplo","mediaKey":"SlpkRE1hd3FWcDFa","mimetype":"image/png","fileEncSha256":"ZXhlbXBsbw==","fileSha256":"ZXhlbXBsbw==","fileLength":"74"}}}'
          type: string
        id:
          description: Chave da linha no banco local. Serve para ordenar e desduplicar, não é o id da mensagem no WhatsApp.
          example: 22780
          type: integer
        media_link:
          description: Ligação para a mídia arquivada, quando o armazenamento externo está configurado.
          example: ""
          type: string
        message_id:
          description: '`message_id` no WhatsApp — o valor a usar em reagir, apagar, favoritar e encaminhar.'
          example: 2A196F2C7F3F02A666F6
          type: string
        message_type:
          description: |
            Tipo da mensagem como foi classificado na gravação — `text`,
            `image`, `video`, `audio`, `document`, `sticker`. `unknown` aparece
            quando o tipo não foi reconhecido, e é um valor real e frequente.
          example: video
          type: string
        quoted_message_id:
          description: '`message_id` da mensagem citada, quando esta é resposta a outra.'
          example: 3EB0A4B2AFD45E625C0917
          type: string
        sender_jid:
          description: Quem escreveu, na forma em que foi gravado (pode trazer sufixo de dispositivo).
          example: 5516981818244@s.whatsapp.net
          type: string
        text_content:
          description: Texto ou legenda, quando existe.
          example: bateria video real
          type: string
        timestamp:
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          type: string
        user_id:
          description: Sessão a que a linha pertence.
          example: 918e37366f27e1125ee0482a793267e1
          type: string
      required:
        - id
        - user_id
        - chat_jid
        - sender_jid
        - message_id
        - timestamp
        - message_type
      type: object
    MensagensCanal:
      description: |
        Resposta de `POST /newsletter/messages`: uma lista de mensagens do canal,
        directamente em `data`, sem chave intermédia. Medida `[]` num canal sem
        publicações; **a forma de cada elemento não foi determinada com segurança**
        — não havia canal com mensagens disponível para medir, e o tipo do vendor
        não é o contrato desta rota.
      items:
        type: object
      type: array
    MetadadosCanal:
      description: |
        Metadados de um canal, medidos em `POST /newsletter/info` a 2026-08-26.
        Repare que **os números vêm como texto** — `creation_time`,
        `subscribers_count` e os `id` internos são strings, não inteiros. É a forma
        do protocolo, não uma conversão nossa.
      properties:
        id:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        state:
          description: Estado do canal do ponto de vista do servidor.
          properties:
            type:
              description: |
                Valores observados em campo: `active` (canal em funcionamento),
                `deleted` (apagado, ainda listado na lista do seguidor) e
                `non_existing` (o que `info` devolve depois de um `delete`). Não
                está fechado por enumeração no código — a lista acima é o que foi
                medido, não o universo garantido.
              example: active
              type: string
          type: object
        thread_metadata:
          description: |
            Os dados públicos do canal. `picture` e `preview` vêm com `url` e
            `direct_path` VAZIOS na resposta medida — para obter a imagem é preciso
            outra chamada, e essa não é destas rotas.
          properties:
            creation_time:
              description: Instante de criação, em segundos Unix, como texto.
              example: "1787745654"
              type: string
            description:
              description: Descrição do canal, com a mesma forma do nome.
              properties:
                id:
                  example: "1787745654587070"
                  type: string
                text:
                  example: Novidades e horários de funcionamento.
                  type: string
                update_time:
                  example: "1787745654587070"
                  type: string
              type: object
            invite:
              description: Código do convite público, o mesmo que `POST /newsletter/info-invite` aceita.
              example: 0029Vb85MPpKLaHoEUxRt01E
              type: string
            name:
              description: Nome do canal, com o instante da última alteração.
              properties:
                id:
                  example: "1787745654587070"
                  type: string
                text:
                  example: Avisos da Fila Rápida
                  type: string
                update_time:
                  example: "1787745654587070"
                  type: string
              type: object
            picture:
              description: |
                Descritor da imagem de perfil, ou `null` quando o canal não tem
                uma. Medido `null` em `/newsletter/list` e preenchido com `url`
                vazio em `/newsletter/info` para o MESMO canal — logo a presença
                deste objecto não garante que haja imagem.
              nullable: true
              properties:
                direct_path:
                  example: ""
                  type: string
                hash:
                  nullable: true
                  type: string
                id:
                  example: "1787750687544878"
                  type: string
                type:
                  example: IMAGE
                  type: string
                url:
                  example: ""
                  type: string
              type: object
            preview:
              description: Descritor da pré-visualização, com a mesma forma de `picture`.
              nullable: true
              properties:
                direct_path:
                  example: ""
                  type: string
                hash:
                  nullable: true
                  type: string
                id:
                  example: "1787750687544880"
                  type: string
                type:
                  example: PREVIEW
                  type: string
                url:
                  example: ""
                  type: string
              type: object
            settings:
              description: Definições do canal. A única observada governa que reações são aceites.
              properties:
                reaction_codes:
                  properties:
                    value:
                      description: Valor observado, `ALL`.
                      example: ALL
                      type: string
                  type: object
              type: object
            subscribers_count:
              description: Número de seguidores, como texto.
              example: "0"
              type: string
            verification:
              description: Estado de verificação do canal. Valor observado, `unverified`.
              example: unverified
              type: string
          type: object
        viewer_metadata:
          description: |
            O que este canal é **para quem chamou**. Vem `null` quando o chamador
            não tem relação com o canal — medido em `/newsletter/info-invite` sobre
            canal não seguido, e em canal apagado.
          nullable: true
          properties:
            mute:
              description: '`on` quando silenciado, `off` quando não. É texto, não booleano.'
              example: "on"
              type: string
            role:
              description: |
                Papel do chamador. Os três valores foram medidos ponta a ponta na
                cadeia de administração de 2026-08-26 (F233): `owner`, `admin` e
                `subscriber`.
              example: owner
              type: string
          type: object
      type: object
    PaginaDeConversas:
      description: |
        Uma página da lista de conversas, ordenada da interação mais recente para
        a mais antiga. NÃO traz mensagens — a lista existe para ordenar
        conversas.
      properties:
        chats:
          items:
            $ref: '#/components/schemas/ResumoDeConversa'
          type: array
        limit:
          description: Tamanho da página realmente aplicado, depois da correcção de faixa.
          example: 50
          type: integer
        offset:
          description: Deslocamento realmente aplicado.
          example: 0
          type: integer
        total:
          description: Total de conversas conhecidas, independente da página pedida.
          example: 384
          type: integer
      required:
        - chats
        - total
        - limit
        - offset
      type: object
    ParticipanteGrupo:
      description: |
        Um membro do grupo. Medido em `POST /group/info` — os três identificadores
        vêm sempre juntos, e `JID` é igual a `LID` nos grupos cujo
        `AddressingMode` é `lid`, que é o caso de todos os grupos medidos.
      properties:
        AddRequest:
          description: |
            Presente quando adicionar este participante gerou um convite em vez de
            uma adesão. Veio `null` em todos os grupos medidos.
          nullable: true
          properties:
            Code:
              description: Código do convite gerado para este participante.
              type: string
            Expiration:
              description: Instante em que o convite deixa de valer.
              format: date-time
              type: string
          type: object
        DisplayName:
          description: |
            Só vem preenchido para participantes anónimos de grupos em modo
            anúncio; nos grupos medidos veio sempre vazio.
          example: ""
          type: string
        Error:
          description: |
            Código de falha ao ADICIONAR este participante. Só é diferente de zero
            na resposta de `POST /group/create` e de `POST /group/updateparticipants`,
            onde parte dos participantes pode falhar sem que a operação falhe.
          example: 0
          type: integer
        IsAdmin:
          description: Administrador do grupo.
          example: false
          type: boolean
        IsSuperAdmin:
          description: Criador do grupo. Um super-administrador é também administrador.
          example: false
          type: boolean
        JID:
          description: |
            Identificador a usar para falar com este participante. É sempre igual
            a `LID` ou a `PhoneNumber` — nunca uma terceira forma.
          example: 90937376170214@lid
          type: string
        LID:
          description: O identificador opaco do participante.
          example: 90937376170214@lid
          type: string
        PhoneNumber:
          description: O número, em forma PN.
          example: 554192421234@s.whatsapp.net
          type: string
      type: object
    ParticipantesComunidade:
      description: Resposta de `POST /community/participants`.
      properties:
        participants:
          description: |
            Os participantes de todos os grupos ligados, em **LID** — medido a
            2026-08-26. Quem precisar do número tem de resolver o LID por outra
            rota; esta não devolve PN.
          example:
            - 90937376170214@lid
            - 29343770251463@lid
          items:
            type: string
          type: array
      required:
        - participants
      type: object
    PedidoAdminCanal:
      description: |
        Pedido das operações que apontam para OUTRO utilizador: convidar para
        administrador, revogar esse convite, despromover e transferir a posse.
      properties:
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        userJID:
          description: |
            JID do utilizador alvo. Aceita **PN ou LID**: a conversão PN→LID é
            feita antes do envio, contra o armazenamento da sessão
            (`adapter.go:489`, F233c). A conversão é direccional — um LID nunca é
            convertido de volta para PN. Se o armazenamento não conhecer o número,
            o JID segue como está e é o WhatsApp que recusa.
          example: 90937376170214@lid
          type: string
      required:
        - jid
        - userJID
      type: object
    PedidoAnuncioGrupo:
      description: Alterna o modo em que só administradores enviam mensagens.
      properties:
        announce:
          description: |
            `true` fecha o grupo à escrita de não-administradores. Ausente é
            `false`, e um pedido sem este campo DESLIGA o modo — não é uma
            consulta.
          example: true
          type: boolean
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      type: object
    PedidoApagarCanal:
      description: |
        Pedido de eliminação de canal. Exige confirmação explícita: `confirmJID`
        tem de ser **idêntico** a `jid`.
      properties:
        confirmJID:
          description: |
            Repetição literal de `jid`. Ausente, ou diferente de `jid`, devolve
            `400 missing_confirm_jid` e **o WhatsApp nem chega a ser contactado**
            (`newsletter_ops.go:266`).
          example: 120363411025775186@newsletter
          type: string
        jid:
          description: JID do canal a apagar.
          example: 120363411025775186@newsletter
          type: string
      required:
        - jid
        - confirmJID
      type: object
    PedidoApagarMensagem:
      description: |
        Revoga ("apagar para todos") uma mensagem própria. `Phone` é o destino da
        conversa; `chat` é aceite como alias e só vale quando `Phone` faltar.
      properties:
        Id:
          description: '`message_id` da mensagem a revogar.'
          example: 3EB0A4B2AFD45E625C0917
          type: string
        Phone:
          description: JID ou número da conversa onde a mensagem foi enviada.
          example: 554192421234@s.whatsapp.net
          type: string
        chat:
          description: Nome universal do destino; `Phone` tem precedência.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - Id
      type: object
    PedidoArquivarConversa:
      description: |
        Arquiva ou desarquiva uma conversa. O destino é `jid`; `chat` é aceite
        como nome universal e só vale quando `jid` vier ausente ou vazio.
      properties:
        archive:
          description: '`true` arquiva, `false` desarquiva.'
          example: true
          type: boolean
        chat:
          description: |
            Nome universal do destino. `jid` tem precedência quando os dois
            vierem preenchidos.
          example: 554192421234@s.whatsapp.net
          type: string
        jid:
          description: JID da conversa — contacto, grupo ou canal.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - archive
      type: object
    PedidoAtualizacoesCanal:
      description: |
        Pedido de ATUALIZAÇÕES de mensagens já conhecidas — edições, contagens de
        reação, remoções. Rota actualmente inoperante; ver a descrição dela.
      properties:
        after:
          description: '`server_id` a partir do qual avançar, lido como número.'
          example: "104"
          type: string
        count:
          description: Quantas atualizações trazer. Zero deixa o servidor decidir.
          example: 5
          type: integer
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        since:
          description: |
            Instante mínimo, em RFC 3339. É o ÚNICO campo de todas as dezoito
            rotas cuja má formatação é recusada no manipulador, antes do use case
            (`handler_newsletter.go:129`) — e a recusa sai como `400` de decodificação.
          example: "2026-08-26T00:00:00Z"
          format: date-time
          type: string
      required:
        - jid
      type: object
    PedidoAtualizarParticipantes:
      description: |
        Adiciona ou remove membros. Veja a limitação de `Action` — promover e
        despromover administrador NÃO estão nesta rota.
      properties:
        Action:
          description: |
            **Só `add` e `remove`** (`group_management.go:272-281`). Medido:
            `promote` e `demote` devolvem
            `400 invalid_action` — `unknown participant action "promote" (must be
            "add" or "remove")`.

            A biblioteca por baixo sabe promover e despromover há anos
            (`internal/wa-noise/capabilities/group/participants.go:18-19`); a
            rota é que não o expõe. Está registado como F263 no `HOUSEKEEP.md`, e
            a consequência é concreta: **por esta API não há forma de dar nem de
            tirar administrador a ninguém.**
          enum:
            - add
            - remove
          example: add
          type: string
        Phone:
          description: |
            Quem entra ou sai. Pelo menos um; uma entrada vazia é recusada com o
            índice em que está.

            **Aceita o número nu** (`554192421234`) — foi medido a passar da
            validação. É uma diferença face a
            `POST /group/updaterequestparticipants`, que exige o JID completo.
          example:
            - 554192421234@s.whatsapp.net
          items:
            type: string
          type: array
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: |
            JID do grupo. Obrigatório, mas validado DEPOIS de `Phone` e de
            `Action` — um pedido a que falte tudo queixa-se primeiro dos
            telefones.
          example: 120363411669320145@g.us
          type: string
      required:
        - Phone
        - Action
      type: object
    PedidoAvatar:
      description: |
        De quem se quer a foto. **Esta rota LÊ** — não altera a foto da conta,
        apesar de ser `POST`.
      properties:
        Phone:
          description: |
            Contacto de quem se quer a foto. Aceita número nu, JID de telefone ou
            LID — a resolução é leniente e aplica o servidor por omissão quando
            falta o `@`.
          example: 554192421234@s.whatsapp.net
          type: string
        Preview:
          default: false
          description: |
            `true` devolve a miniatura; `false` (o padrão) devolve a imagem em
            tamanho cheio.
          example: true
          type: boolean
        chat:
          description: Nome universal do destino. `Phone` ganha quando os dois vierem.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - Phone
      type: object
    PedidoBloqueio:
      description: |
        Quem bloquear ou desbloquear. Basta UM dos dois campos: `JID` tem
        precedência, e `Phone` é usado quando `JID` vem vazio.
      properties:
        JID:
          description: Contacto em forma de JID. Tem precedência sobre `Phone`.
          example: 90937376170214@lid
          type: string
        Phone:
          description: |
            Contacto. A resolução é LENIENTE por decisão registada na F203: um
            número nu (`554192421234`) é aceite, porque um campo chamado `Phone`
            que exigisse `@s.whatsapp.net` seria contrato surpreendente.
          example: 554192421234@s.whatsapp.net
          type: string
        chat:
          description: Nome universal do destino. `Phone` ganha quando os dois vierem.
          example: 554192421234@s.whatsapp.net
          type: string
      type: object
    PedidoCanal:
      description: |
        Pedido mínimo de canal: só o identificador. É a forma de `info`, `follow`,
        `unfollow`, `subscribe` e `admin-invite/accept`.
      properties:
        jid:
          description: |
            JID do canal, sempre no servidor `@newsletter`. Ausente, a resposta é
            `400 missing_jid`.
          example: 120363411025775186@newsletter
          type: string
      required:
        - jid
      type: object
    PedidoCanalPorConvite:
      description: |
        Pedido de metadados a partir do CÓDIGO de convite, não do JID. O código é a
        parte final do link público (`https://whatsapp.com/channel/<código>`), e é
        enviado nu.
      properties:
        invite:
          description: |
            Código do convite. Não passa pela conversão de JID de propósito
            (`adapter.go:269`): tratá-lo como JID falharia com uma mensagem sobre
            JID inválido, que manda quem investiga para o lado errado.
          example: 0029Vb85MPpKLaHoEUxRt01E
          type: string
      required:
        - invite
      type: object
    PedidoComunidade:
      description: |
        Pedido de leitura sobre uma comunidade. Aceita também o nome universal
        `chat`, que preenche `communityJID` quando este vier vazio
        (`pkg/domain/community.go:9`).
      properties:
        chat:
          description: Alias universal de destino. Só é usado se `communityJID` vier vazio.
          example: 120363430034334401@g.us
          type: string
        communityJID:
          description: |
            JID da comunidade — que é um JID de GRUPO (`@g.us`), porque uma
            comunidade é um grupo-pai. Ausente, a resposta é
            `400 missing_community_jid`.
          example: 120363430034334401@g.us
          type: string
      type: object
    PedidoConfigHmac:
      description: |
        Corpo de `POST /session/hmac/config`. `hmac_key` é o único campo do
        contrato — os campos `enabled`/`key`/`secret` que já apareceram em
        versões antigas nunca existiram no fio.
      properties:
        hmac_key:
          description: |
            Chave com que os webhooks desta sessão são assinados. Mínimo de **32
            caracteres**; abaixo disso é `400 hmac_key_too_short`. É cifrada antes
            de ser gravada e nunca volta em nenhuma leitura.
          example: uma-chave-com-pelo-menos-32-caracteres
          minLength: 32
          type: string
      required:
        - hmac_key
      type: object
    PedidoConfigS3:
      description: |
        Corpo de `POST /session/s3/config`. Substitui a configuração inteira —
        não é uma actualização parcial.
      properties:
        access_key:
          example: AKIAIOSFODNN7EXAMPLE
          type: string
        bucket:
          example: wa-api-media
          type: string
        enabled:
          description: |
            Liga ou desliga o envio de mídia para o bucket. Desligar **revoga**:
            o cliente S3 construído com a credencial anterior é removido do
            registo, senão continuaria a carregar mídia.
          example: true
          type: boolean
        endpoint:
          description: |
            Endpoint do serviço. Vazio significa o endpoint padrão da AWS. Quando
            preenchido, passa pelo validador de saída — um endereço reservado ou
            de loopback é recusado com `400 invalid_s3_endpoint`.
          example: https://s3.eu-west-1.amazonaws.com
          type: string
        media_delivery:
          description: |
            Como a mídia recebida é entregue. `base64` embute no corpo, `s3`
            devolve só o URL, `both` faz as duas coisas. Vazio assume `base64`;
            qualquer outro valor é recusado com `400 invalid_media_delivery`.
          enum:
            - base64
            - s3
            - both
          example: s3
          type: string
        path_style:
          description: Endereçamento por caminho em vez de por subdomínio. Necessário na maioria dos serviços compatíveis com S3 que não são a AWS.
          example: true
          type: boolean
        public_url:
          description: Prefixo público usado para montar os URLs entregues ao cliente.
          example: https://media.exemplo.com
          type: string
        region:
          example: eu-west-1
          type: string
        retention_days:
          description: Dias de retenção aplicados aos objectos gravados.
          example: 30
          type: integer
        secret_key:
          description: |
            Segredo da credencial. É cifrado antes de ser gravado (ADR-0009) e
            **nunca volta** em nenhuma leitura — `GET /session/s3/config` não o
            seleciona sequer.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          type: string
      type: object
    PedidoConfiguracaoHmac:
      description: |
        Corpo de `POST /hmac/config` e de `POST /hmac/configure` — a mesma
        operação. **`hmac_key` é o único campo lido**; qualquer outro é ignorado.
      properties:
        hmac_key:
          description: |
            Chave que assina os webhooks desta sessão. **Mínimo de 32 caracteres**
            (`400 hmac_key_too_short`). Guardada cifrada e nunca devolvida.
          example: chave-de-assinatura-com-32-carac
          minLength: 32
          type: string
      required:
        - hmac_key
      type: object
    PedidoConfiguracaoS3:
      description: |
        Corpo de `POST /s3/config` e de `POST /s3/configure` — a mesma operação em
        dois caminhos. Nomes em snake_case, ao contrário do camelCase que as rotas
        `/admin/users` usam para a mesma configuração.
      properties:
        access_key:
          example: AKIAIOSFODNN7EXAMPLE
          type: string
        bucket:
          example: wa-api-midia
          type: string
        enabled:
          description: Liga o armazenamento em S3 para esta sessão.
          example: true
          type: boolean
        endpoint:
          description: |
            Endereço do serviço. Quando presente, tem de ser um URL analisável —
            caso contrário `400 invalid_s3_endpoint`.
          example: https://s3.sa-east-1.amazonaws.com
          type: string
        media_delivery:
          description: |
            Como a mídia recebida é entregue. Valor fora destes três dá
            `400 invalid_media_delivery`; **vazio assume `base64`**.
          enum:
            - base64
            - s3
            - both
          example: both
          type: string
        path_style:
          description: Usa endereçamento por caminho em vez de subdomínio (necessário em MinIO e afins).
          example: false
          type: boolean
        public_url:
          description: Base pública por onde a mídia guardada é servida.
          example: https://midia.exemplo.com.br
          type: string
        region:
          example: sa-east-1
          type: string
        retention_days:
          description: Dias de retenção dos objectos.
          example: 30
          type: integer
        secret_key:
          description: |
            Cifrada antes de tocar no banco, e **nunca devolvida** por nenhuma
            rota — nem sequer mascarada, porque a leitura não a consulta.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          type: string
      type: object
    PedidoCriarCanal:
      description: |
        Pedido de criação de canal. É a única operação de canal que não recebe
        `jid` — o identificador é justamente o que ela devolve.
      properties:
        description:
          description: Descrição do canal, mostrada a quem abre a página dele. Opcional.
          example: Novidades e horários de funcionamento.
          type: string
        name:
          description: Nome público do canal. Obrigatório; sem ele a resposta é `400 missing_name`.
          example: Avisos da Fila Rápida
          type: string
        picture:
          description: |
            Imagem de perfil do canal, em base64 (o campo é `[]byte` em Go, logo o
            JSON leva base64 sem prefixo `data:`). Opcional.
          format: byte
          type: string
      required:
        - name
      type: object
    PedidoCriarGrupo:
      description: |
        Criação de grupo, de comunidade ou de sub-grupo dentro de comunidade — as
        três saem desta mesma rota, e o que as distingue são `is_parent` e
        `linked_parent_jid`.
      properties:
        is_parent:
          description: |
            Cria uma COMUNIDADE em vez de um grupo. O WhatsApp cria sozinho o
            sub-grupo de avisos, que aparece depois em `POST /group/list` com
            `IsDefaultSubGroup: true`.

            Mutuamente exclusivo com `linked_parent_jid`: os dois juntos devolvem
            `400` sem chegar ao WhatsApp.
          example: false
          type: boolean
        linked_parent_jid:
          description: |
            Cria o grupo já dentro desta comunidade. Mutuamente exclusivo com
            `is_parent`.
          example: 120363430034334401@g.us
          type: string
        name:
          description: |
            Nome do grupo. Obrigatório; vazio ou ausente devolve `400`.
          example: Equipa de entregas
          type: string
        participants:
          description: |
            Participantes iniciais, além da própria conta. Aceita o número nu
            (`554192421234`) tanto quanto o JID completo — a resolução é feita por
            `ResolveJID`.

            **Pelo menos um é obrigatório**, EXCEPTO quando `is_parent` é
            verdadeiro (`handler_group_mgmt.go:125`). Uma entrada vazia na lista é
            recusada com o índice em que está.
          example:
            - 554192421234@s.whatsapp.net
          items:
            type: string
          type: array
      required:
        - name
      type: object
    PedidoCriarUtilizador:
      description: |
        Corpo de `POST /admin/users`. `s3Config` e `proxyConfig` são aceites também
        como `s3_config` e `proxy_config`; o camelCase vence quando ambos vierem.
      properties:
        events:
          description: |
            Eventos subscritos, separados por vírgulas. **Cada nome é validado**:
            um desconhecido dá `400 invalid_event_type`. `All` recebe todos.
          example: Message,Receipt,Connected
          type: string
        expiration:
          description: Expiração da sessão, em segundos desde a época Unix. Zero significa sem expiração.
          example: 0
          type: integer
        history:
          description: Quantas mensagens gravar por conversa. `0` desactiva a gravação.
          example: 100
          type: integer
        hmacKey:
          description: |
            Chave de assinatura dos webhooks. Mínimo de **32 caracteres**
            (`400 hmac_key_too_short`). Guardada cifrada; nunca é devolvida.
          example: chave-de-assinatura-com-32-carac
          type: string
        name:
          description: Nome da sessão. Obrigatório.
          example: filarapida
          type: string
        proxyConfig:
          $ref: '#/components/schemas/ConfiguracaoProxyUtilizador'
        s3Config:
          $ref: '#/components/schemas/ConfiguracaoS3Utilizador'
        token:
          description: |
            Token de sessão a atribuir. Obrigatório e **único na instalação** —
            repetido dá `409`. É devolvido uma única vez, nesta resposta.
          example: tok_fila
          type: string
        webhook:
          description: URL de webhook inicial. Pode ficar para depois, em `POST /webhook`.
          example: https://exemplo.com.br/wa-api/eventos
          type: string
      required:
        - name
        - token
      type: object
    PedidoDecidirSolicitacoes:
      description: Aprova ou rejeita pedidos de entrada pendentes.
      properties:
        Action:
          description: |
            O veredito. Qualquer outro valor devolve `400 invalid_action`
            (medido).
          enum:
            - approve
            - reject
          example: approve
          type: string
        Phone:
          description: |
            Os solicitantes a decidir. **Exige o JID COMPLETO.** Medido: o número
            nu `554192421234` devolve `400 invalid_phone`, porque este use case
            resolve com `ResolveQualifiedJID` e não com `ResolveJID`
            (`group_request.go:100`). É uma divergência face a
            `POST /group/updateparticipants`, que aceita o número nu.
          example:
            - 554192421234@s.whatsapp.net
          items:
            type: string
          type: array
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      required:
        - groupJID
        - Phone
        - Action
      type: object
    PedidoDefinicaoPrivacidade:
      description: |
        Uma definição de privacidade de cada vez. Nome e valor são validados
        contra a tabela do domínio ANTES de qualquer chamada ao WhatsApp, e cada
        definição tem o seu próprio conjunto de valores válidos — `contacts` vale
        para `status` e é recusado em `readreceipts`.
      properties:
        privacy_setting:
          description: |
            Qual definição alterar, em minúsculas. **Não são as mesmas chaves que
            a leitura devolve** — ver `DefinicoesPrivacidade`.
          enum:
            - groupadd
            - last
            - status
            - profile
            - readreceipts
            - online
            - calladd
          example: status
          type: string
        value:
          description: |
            O valor. O conjunto válido DEPENDE da definição:

            - `groupadd`, `last`, `status`, `profile`: `all`, `contacts`,
              `contact_blacklist`, `none`
            - `readreceipts`: `all`, `none`
            - `online`: `all`, `match_last_seen`
            - `calladd`: `all`, `known`

            A comparação é sensível a maiúsculas: `ALL` é recusado.
          example: contacts
          type: string
      required:
        - privacy_setting
        - value
      type: object
    PedidoDescargaDeMidia:
      description: |
        O DESCRITOR da mídia, e não um identificador de mensagem. Os sete campos
        saem do `data_json` da mensagem devolvida por `GET /chat/history`, dentro
        de `Message.imageMessage` / `videoMessage` / `audioMessage` /
        `documentMessage` / `stickerMessage`, com estes nomes de origem:

        | campo daqui | campo no `data_json` |
        |---|---|
        | `Url` | `URL` |
        | `DirectPath` | `directPath` |
        | `MediaKey` | `mediaKey` |
        | `Mimetype` | `mimetype` |
        | `FileEncSHA256` | `fileEncSha256` |
        | `FileSHA256` | `fileSha256` |
        | `FileLength` | `fileLength` |

        **Pelo menos um entre `Url` e `DirectPath`** tem de vir; faltarem os dois
        é `400 missing_url_or_direct_path`, medido. Só `DirectPath` é caminho
        válido, e é a forma em que os metadados chegam em vários eventos.
      properties:
        DirectPath:
          description: Caminho directo na CDN. Alternativa a `Url`.
          example: /o1/v/t24/f2/m234/exemplo
          type: string
        FileEncSHA256:
          description: SHA-256 do ficheiro CIFRADO, em base64.
          example: ZXhlbXBsb0ZpbGVFbmNTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDA=
          format: byte
          type: string
        FileLength:
          description: Tamanho do ficheiro em bytes.
          example: 74
          format: int64
          type: integer
        FileSHA256:
          description: SHA-256 do ficheiro decifrado, em base64.
          example: ZXhlbXBsb0ZpbGVTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDAwMDA=
          format: byte
          type: string
        MediaKey:
          description: Chave de decifragem, em base64.
          example: SlpkRE1hd3FWcDFaZXhlbXBsb01lZGlhS2V5MDAwMDA=
          format: byte
          type: string
        Mimetype:
          description: |
            Tipo da mídia. É devolvido TAL E QUAL na resposta e é também o
            prefixo da Data URL de `Data` — os dois não podem divergir, por
            construção.
          example: image/png
          type: string
        Url:
          description: URL da mídia na CDN do WhatsApp.
          example: https://mmg.whatsapp.net/o1/v/t24/f2/m234/exemplo
          type: string
      type: object
    PedidoEdicaoMensagem:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: O novo texto da mensagem. Vazio é `400 missing_body`.
              example: Bom dia! O seu pedido sai para entrega às 15h.
              type: string
            Id:
              description: |
                `message_id` da mensagem a editar. Vazio é `400 missing_id` — mas
                só DEPOIS de `Phone` e `Body` terem passado e de `Phone` ter sido
                parseado, o que faz um pedido com `Phone` inválido E `Id` ausente
                responder `invalid_phone`, e não `missing_id`.
              example: 3EB0A4B2AFD45E625C0917
              type: string
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Participant:
              description: JID de quem escreveu a mensagem citada. Opcional, e par de `StanzaId`.
              example: 554192421234@s.whatsapp.net
              type: string
            Phone:
              description: |
                A conversa onde está a mensagem a editar. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            StanzaId:
              description: |
                `message_id` da mensagem citada pela mensagem que está a ser editada,
                para preservar a citação. Opcional.
              example: 3EB0F1C9D2A74B380E1128
              type: string
          required:
            - Body
            - Id
          type: object
      description: Corpo de `POST /chat/send/edit`. Substitui o texto de uma mensagem já enviada, identificada por `Id`.
    PedidoEditarUtilizador:
      description: |
        Corpo de `PUT /admin/users/{id}`. **Só os campos enviados mudam.**

        Para os campos de texto e para `expiration`, o vazio significa *"não
        informado"*, e não *"limpe"*. A excepção é `history`: `0` é um valor
        legítimo e **desactiva** a gravação. Um corpo sem nenhum campo útil
        responde `400 no_fields_to_update`.

        `s3Config`/`proxyConfig` são aceites também em `snake_case`; o camelCase
        vence quando ambos vierem.
      properties:
        events:
          description: Validado como na criação — nome desconhecido dá `400 invalid_event_type`.
          example: Message,Receipt
          type: string
        expiration:
          example: 0
          type: integer
        history:
          description: |
            Limite de gravação de mensagens. **Ausente** significa não mexer;
            `0` **desactiva** — a distinção existe de propósito, e é o que permite
            voltar a desligar a gravação depois de a ter ligado.
          example: 0
          nullable: true
          type: integer
        name:
          example: filarapida
          type: string
        proxyConfig:
          $ref: '#/components/schemas/ConfiguracaoProxyUtilizador'
        s3Config:
          $ref: '#/components/schemas/ConfiguracaoS3Utilizador'
        token:
          description: Substitui o token de sessão. Tem de continuar único (`409` se colidir).
          example: tok_fila_novo
          type: string
        webhook:
          example: https://exemplo.com.br/wa-api/eventos
          type: string
      type: object
    PedidoEncaminhamento:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: |
                Texto a enviar marcado como encaminhado. Obrigatório na forma por
                conteúdo — vazio é `400 missing_body`. **Ignorado** quando
                `MessageID` vem preenchido.
              example: Bom dia! O seu pedido saiu para entrega.
              type: string
            Chat:
              description: |
                Conversa de ONDE a mensagem original veio. Só faz sentido na forma
                por chave, e hoje é **opcional e não usado na busca** — a mensagem é
                procurada só por sessão e `MessageID`. Está reservado para
                desambiguação futura.
              example: 554192421234@s.whatsapp.net
              type: string
            ForwardingScore:
              description: |
                Quantas vezes a mensagem já foi encaminhada. Na forma por conteúdo,
                vem do payload, com `1` por omissão — o valor que o Baileys produz
                num primeiro encaminhamento.

                **Na forma por chave é IGNORADO**: o valor é lido do contexto da
                mensagem original e incrementado em 1.
              example: 1
              format: int32
              type: integer
            Id:
              $ref: '#/components/schemas/IdCliente'
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            MessageID:
              description: |
                `message_id` da mensagem guardada a reenviar. **A presença deste
                campo é o que escolhe a forma POR CHAVE**; quando vem vazio, a rota
                cai na forma POR CONTEÚDO e passa a exigir `Body`.
              example: 3EB0A4B2AFD45E625C0917
              type: string
            Phone:
              description: |
                JID de destino do encaminhamento — para onde a mensagem VAI.
                Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          type: object
      description: Corpo de `POST /chat/send/forward`. Duas formas — por chave de mensagem (`MessageID` mais `Chat`) ou por conteúdo (`Phone` mais `Body`).
    PedidoEntrarGrupo:
      description: |
        **A struct de domínio mente aqui.** `GroupJoinRequest`
        (`pkg/domain/group.go:52-54`) declara `inviteLink`, e não é o que a rota
        lê: o manipulador declara a sua própria struct anónima com `code`
        (`handler_group_mgmt.go:148-150`). Um cliente escrito a partir do domínio
        recebe `400`.
      properties:
        code:
          description: |
            O código NU do convite, sem o `https://chat.whatsapp.com/` à frente —
            é a forma que a bateria de campo mediu.

            O URL completo também passa, porque a biblioteca corta o prefixo
            (`internal/wa-noise/capabilities/group/invite.go:105`), mas isso não
            foi medido nesta rota e o nome do campo continua a ser `code`.

            Repare que `POST /group/invitelink` devolve o **link inteiro**, e não
            o código: alimentar essa resposta directamente aqui depende do corte
            de prefixo, não do contrato.
          example: IVccRoDVSbpHKNkgNxyZx4
          type: string
      required:
        - code
      type: object
    PedidoEnvioAudio:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Audio:
              description: |
                O áudio, num de DOIS transportes:

                - **URI de dados** — tem de começar exactamente por `data:audio/`
                  (`send_audio.go`, `isDataURIAudio`). Uma imagem disfarçada de
                  áudio não passa.
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                Qualquer outra coisa é `400 unsupported_audio_source`. Teto de
                **16 MB**, e piso de **128 bytes**.
              example: data:audio/mp4;base64,AAAAIGZ0eXBNNEEgAAACAGlzb21pc28yYXZjMW1wNDE=
              type: string
            Caption:
              description: |
                Legenda. **Vai como mensagem de texto SEPARADA**, enviada DEPOIS do
                áudio — o protocolo não tem campo de legenda em áudio. Ver
                `ResultadoEnvioAudio` para o que a resposta diz sobre ela.
              example: O áudio que combinámos.
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Seconds:
              description: Duração declarada, em segundos. Só metadata — não é verificada contra os bytes.
              example: 12
              type: integer
            Waveform:
              description: Onda desenhada na bolha de voz, em base64. Opcional.
              format: byte
              type: string
            mimetype:
              description: |
                Força o MIME. Quando vazio, a precedência é: o rótulo declarado pela
                própria URI de dados, ou o `Content-Type` remoto quando começa por
                `audio/`; senão o tipo farejado dos bytes; senão um padrão conforme
                `ptt`.
              example: audio/ogg; codecs=opus
              type: string
            ptt:
              description: |
                `true` envia como mensagem de voz (a bolha com a onda), `false` como
                ficheiro de áudio. **Ausente significa `true`** — não `false`.
              example: true
              type: boolean
          required:
            - Audio
          type: object
      description: Corpo de `POST /chat/send/audio`. Áudio ou nota de voz; mínimo de 128 bytes. A legenda, se houver, vai como mensagem separada.
    PedidoEnvioAutocolante:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Emojis:
              description: Emojis associados ao autocolante, para busca no cliente.
              example:
                - "\U0001F389"
              items:
                type: string
              type: array
            Id:
              $ref: '#/components/schemas/IdCliente'
            MimeType:
              description: MIME declarado da entrada. A saída é sempre WebP.
              type: string
            PackId:
              description: Identificador do pacote de autocolantes a que este pertence.
              type: string
            PackName:
              description: Nome do pacote.
              type: string
            PackPublisher:
              description: Editor do pacote.
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            PngThumbnail:
              description: Miniatura PNG, em base64. Opcional.
              format: byte
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Sticker:
              description: |
                O autocolante, como URI de dados (prefixo `data`) ou URL http(s).
                Teto de **16 MB**.

                **A imagem é sempre CONVERTIDA para WebP pelo servidor** — o que sobe
                é o resultado da conversão, nunca os bytes de entrada. Uma entrada que
                não seja nenhum dos dois transportes chega à conversão tal e qual e é
                recusada lá, com `400 sticker_processing_failed`.
              example: data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==
              type: string
          required:
            - Sticker
          type: object
      description: Corpo de `POST /chat/send/sticker`. Autocolante em WebP.
    PedidoEnvioBotoes:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: |
                Corpo da mensagem, acima dos botões. Sinónimo `text`, usado quando
                `Body` vem vazio.
              example: Confirma a entrega para hoje às 15h?
              type: string
            Buttons:
              description: |
                Os botões. Lista vazia é `400 missing_buttons_fields`; lista onde
                todos os botões são descartados é `400 no_valid_buttons`.
              items:
                $ref: '#/components/schemas/BotaoInterativo'
              type: array
            Footer:
              description: Rodapé, abaixo dos botões.
              example: DisparaZap
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            Image:
              description: |
                Imagem de cabeçalho, como URI de dados ou URL http(s). Teto de
                **10 MB**. Uma imagem que falhe a obtenção **não** derruba o envio —
                a mensagem segue sem cabeçalho de imagem, e a falha fica no log.
              example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              type: string
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Title:
              description: |
                Cabeçalho da mensagem. Opcional. Quando há `Image`, é a imagem que
                ocupa o cabeçalho.
              example: Confirmação de entrega
              type: string
            text:
              description: Sinónimo de `Body`.
              type: string
          type: object
      description: Corpo de `POST /chat/send/buttons`. Mensagem interativa com botões. Cada botão exige `title` — `displayText` é ignorado e o botão cai em silêncio.
    PedidoEnvioCarrossel:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: Corpo da mensagem, acima dos cartões.
              example: As pizzas de hoje.
              type: string
            Cards:
              description: |
                Os cartões, que deslizam na horizontal. Lista vazia é
                `400 missing_carousel_fields`; lista onde todos os cartões são
                descartados é `400 no_valid_cards`.
              items:
                $ref: '#/components/schemas/CartaoCarrossel'
              type: array
            Footer:
              description: Rodapé do carrossel, abaixo de todos os cartões.
              example: Entregas até às 22h
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          type: object
      description: Corpo de `POST /chat/send/carousel`. Cartões deslizáveis na horizontal; cada cartão exige `Buttons`.
    PedidoEnvioContacto:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Id:
              $ref: '#/components/schemas/IdCliente'
            Name:
              description: Nome mostrado no cartão. Vazio é `400 missing_name`.
              example: Suporte DisparaZap
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Vcard:
              description: |
                O cartão em vCard, tal e qual — o servidor **não o valida nem o
                reescreve**, apenas o transporta. Um vCard malformado sai daqui com
                `200` e chega quebrado ao destinatário.

                Para que o cliente reconheça o contacto como utilizador de WhatsApp,
                a linha `TEL` precisa do parâmetro `waid`.
              example: |
                BEGIN:VCARD
                VERSION:3.0
                FN:Suporte DisparaZap
                TEL;type=CELL;waid=554192421234:+55 41 9242-1234
                END:VCARD
              type: string
          required:
            - Name
            - Vcard
          type: object
      description: Corpo de `POST /chat/send/contact`. Cartão de contacto em vCard, que o destinatário pode guardar.
    PedidoEnvioDocumento:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Caption:
              description: Legenda, desenhada com o documento.
              example: A nota fiscal do pedido.
              type: string
            Document:
              description: |
                O documento, num de DOIS transportes:

                - **URI de dados** — qualquer `data:`, sem restrição de MIME: um
                  documento legitimamente carrega `application/pdf`,
                  `application/zip`, `text/plain`…
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                Qualquer outra coisa é `400 unsupported_document_source`. Teto de
                **100 MB**.
              example: data:application/pdf;base64,JVBERi0xLjQKJcOkw7zDtsOfCg==
              type: string
            FileName:
              description: |
                Nome com que o documento aparece no cliente. **Obrigatório** — vazio
                é `400 missing_filename`. É metadata pura: nunca vira operação de
                ficheiro do lado do servidor.
              example: nota-fiscal-1234.pdf
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            MimeType:
              description: |
                Força o MIME. Quando vazio, o tipo é farejado dos bytes decodificados
                — o rótulo da própria URI de dados não é usado.
              example: application/pdf
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Document
            - FileName
          type: object
      description: Corpo de `POST /chat/send/document`. Ficheiro com nome próprio, mostrado como anexo descarregável.
    PedidoEnvioEnquete:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Group:
              description: |
                JID de destino. **O nome do campo é `Group`, e não `Phone`, mesmo
                para uma enquete enviada a um contacto individual** — medido em
                2026-08-26: com `Phone` a rota responde `400 missing_group`. O
                sinónimo universal `chat` também funciona.
              example: 120363411669320145@g.us
              type: string
            Header:
              description: A pergunta da enquete. Vazio é `400 missing_header`.
              example: Qual o melhor horário para a entrega?
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            Options:
              description: |
                As opções, em texto claro. **São precisas pelo menos duas** — menos
                é `400 insufficient_options`.
              example:
                - Manhã
                - Tarde
                - Noite
              items:
                type: string
              minItems: 2
              type: array
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Header
            - Options
          type: object
      description: Corpo de `POST /chat/send/poll`. Enquete com opções. O destino vai em `Group`, e não em `Phone`, mesmo para contacto individual.
    PedidoEnvioImagem:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Caption:
              description: Legenda, desenhada com a imagem.
              example: A etiqueta do seu pedido.
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            Image:
              description: |
                A imagem, num de DOIS transportes:

                - **URI de dados** — tem de começar exactamente por `data:image`
                  (`send_image.go:180`). Um `data:application/pdf;...` **não** bate
                  aqui.
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                Qualquer outra coisa é `400 unsupported_image_source`. Teto de
                **16 MB** nos dois transportes.
              example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              type: string
            JPEGThumbnail:
              description: Miniatura JPEG, em base64. Opcional.
              format: byte
              type: string
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            MimeType:
              description: |
                Força o MIME em vez de o deduzir dos bytes. Quando vazio, o tipo é
                farejado do conteúdo DECODIFICADO — o rótulo que a própria URI de
                dados declara **não** é usado, de propósito. Se o tipo resolvido não
                for de imagem, é `400 invalid_image_mime_type`.
              example: image/png
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Image
          type: object
      description: Corpo de `POST /chat/send/image`. Imagem com legenda opcional; aceita URI de dados ou base64.
    PedidoEnvioLista:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: Primeiro sinónimo de `Desc`.
              type: string
            ButtonText:
              description: |
                Rótulo do botão que abre a lista. Vazio significa `Select`
                (`send_list.go:17`).
              example: Ver cardápio
              type: string
            Desc:
              description: |
                Corpo principal da mensagem. Sinónimos, nesta ordem de precedência,
                `Body`, `body` e `text`. Nenhum preenchido é `400 missing_desc`.
              example: Escolha um item do cardápio.
              type: string
            FooterText:
              description: Rodapé, abaixo do botão.
              example: Entregas até às 22h
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            List:
              description: |
                Forma LEGADA: lista plana, embrulhada numa secção única cujo título
                vem de `TopText`, ou de `Menu` quando `TopText` vem vazio.
              items:
                $ref: '#/components/schemas/LinhaLista'
              type: array
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Sections:
              description: |
                Forma PREFERIDA: lista com várias secções. `Sections` e `List` ambas
                vazias é `400 missing_sections`; quando `Sections` vem preenchida,
                `List` é ignorada.
              items:
                $ref: '#/components/schemas/SecaoLista'
              type: array
            TopText:
              description: |
                Cabeçalho, acima do corpo. Também serve de título da secção única
                quando se usa a forma legada `List`.
              example: Cardápio de hoje
              type: string
            body:
              description: Segundo sinónimo de `Desc`.
              type: string
            text:
              description: Terceiro sinónimo de `Desc`.
              type: string
          type: object
      description: Corpo de `POST /chat/send/list`. Lista de seleção, agrupada em secções, aberta por um botão.
    PedidoEnvioLocalizacao:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Id:
              $ref: '#/components/schemas/IdCliente'
            Latitude:
              description: |
                Latitude. **Zero é valor VÁLIDO** e é distinguido de "campo ausente"
                (HOUSEKEEP F121) — omitir é `400 missing_latitude`, mandar `0` é
                aceite.
              example: -25.4284
              format: double
              type: number
            Longitude:
              description: |
                Longitude. Mesma regra da latitude: `0` é aceite, ausente é
                `400 missing_longitude`.
              example: -49.2733
              format: double
              type: number
            Name:
              description: Rótulo do lugar, mostrado sobre o mapa. Opcional.
              example: Curitiba
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Latitude
            - Longitude
          type: object
      description: Corpo de `POST /chat/send/location`. Ponto no mapa, com nome e morada opcionais.
    PedidoEnvioModelo:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Buttons:
              description: |
                Os botões do modelo, com vocabulário PRÓPRIO (`DisplayText`, e os
                tipos `quickreply`/`url`/`call`) — diferente do de
                `/chat/send/buttons`. Lista vazia é `400 missing_buttons`.
              items:
                $ref: '#/components/schemas/BotaoModelo'
              minItems: 1
              type: array
            Content:
              description: Corpo do modelo. Vazio é `400 missing_content`.
              example: O seu pedido 1234 está pronto para retirada.
              type: string
            Footer:
              description: |
                Rodapé. **Obrigatório nesta rota** — vazio é `400 missing_footer`.
                É a única rota de envio em que o rodapé não é opcional.
              example: DisparaZap
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Content
            - Footer
            - Buttons
          type: object
      description: Corpo de `POST /chat/send/template`. Mensagem de modelo com botões de URL, de chamada ou de resposta rápida.
    PedidoEnvioTexto:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Body:
              description: Texto da mensagem. Vazio é `400 missing_body`.
              example: Bom dia! O seu pedido saiu para entrega.
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            LinkPreview:
              description: |
                Quando `true`, o serviço procura a primeira URL do corpo e busca a
                metadata Open Graph dela, enviando a mensagem como texto estendido
                com pré-visualização. Falha na busca não é erro — a mensagem segue
                sem pré-visualização.
              example: true
              type: boolean
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            Phone:
              description: |
                JID de destino — contacto, grupo ou canal. Sinónimo universal `chat`;
                `Phone` ganha quando os dois vierem. Ausente nos dois nomes é
                `400 missing_phone`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - Body
          type: object
      description: Corpo de `POST /chat/send/text`. Mensagem de texto, com pré-visualização de link opcional.
    PedidoEnvioVideo:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Caption:
              description: Legenda, desenhada com o vídeo.
              example: O vídeo da montagem.
              type: string
            Id:
              $ref: '#/components/schemas/IdCliente'
            JPEGThumbnail:
              description: Miniatura JPEG, em base64. Opcional.
              format: byte
              type: string
            MentionedJid:
              $ref: '#/components/schemas/MencoesEnvio'
            MimeType:
              description: |
                Força o MIME em vez de o deduzir dos bytes. Se o tipo resolvido não
                for de vídeo, é `400 invalid_video_mime_type`.
              example: video/mp4
              type: string
            Phone:
              description: JID de destino. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            ReplyTo:
              $ref: '#/components/schemas/ContextoResposta'
            Video:
              description: |
                O vídeo, num de DOIS transportes:

                - **URI de dados** — a discriminação mais frouxa das cinco rotas de
                  mídia: bastam os quatro primeiros caracteres serem `data`, sem os
                  dois-pontos (`send_video.go`, `isDataVideo`). Qualquer MIME
                  declarado passa.
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                Qualquer outra coisa é `400 unsupported_video_source`. Teto de
                **100 MB**, e piso de **256 bytes**.
              example: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
              type: string
          required:
            - Video
          type: object
      description: Corpo de `POST /chat/send/video`. Vídeo com legenda; mínimo de 256 bytes, recusado antes do envio.
    PedidoFavoritarMensagem:
      description: |
        Favorita ou desfavorita uma mensagem. Os três identificadores são
        obrigatórios: a conversa, quem escreveu a mensagem e a própria mensagem.
      properties:
        chat:
          description: JID da conversa onde a mensagem está.
          example: 554192421234@s.whatsapp.net
          type: string
        from_me:
          description: '`true` quando a mensagem foi escrita pela própria sessão.'
          example: true
          type: boolean
        message_id:
          description: '`message_id` da mensagem a favoritar.'
          example: 3EB0A4B2AFD45E625C0917
          type: string
        sender:
          description: |
            JID de quem ESCREVEU a mensagem. Obrigatório — sem ele a resposta é
            `400 missing_sender`. Em conversa individual com uma mensagem
            própria, é o JID da própria conta.
          example: 554192421234@s.whatsapp.net
          type: string
        star:
          description: '`true` favorita, `false` desfavorita.'
          example: true
          type: boolean
      required:
        - chat
        - sender
        - message_id
      type: object
    PedidoFixarConversa:
      description: |
        Fixa ou desafixa a CONVERSA no topo da lista. Não fixa uma mensagem
        dentro dela — isso é outro mecanismo (`PinInChatMessage`), e não está
        exposto nesta API.
      properties:
        chat:
          description: Nome universal do destino; `jid` tem precedência.
          example: 554192421234@s.whatsapp.net
          type: string
        jid:
          description: JID da conversa a fixar.
          example: 554192421234@s.whatsapp.net
          type: string
        pin:
          description: '`true` fixa, `false` desafixa.'
          example: true
          type: boolean
      required:
        - pin
      type: object
    PedidoFotoGrupo:
      description: |
        Foto de grupo. **Duas armadilhas medidas, e as duas com uma variável de
        cada vez.**
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
        photo:
          description: |
            A imagem em base64 **CRU**, sem o prefixo `data:image/jpeg;base64,`.

            Medido: os mesmos nomes de campo e a mesma imagem, com o prefixo,
            devolvem `400` — o descodificador base64 do manipulador
            (`handler_group_mgmt.go:245`) rejeita os `:` e `;` do URI de dados
            antes de qualquer coisa chegar ao WhatsApp.

            **Isto diverge de `/chat/send/image`**, que ACEITA o URI de dados. As
            duas rotas recebem imagem e só uma aceita o prefixo.

            A imagem tem de ser **JPEG**. PNG é bem descodificado aqui e depois
            recusado pelo WhatsApp, com `422 upstream_rejected`.
          example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA==
          format: byte
          type: string
      required:
        - photo
      type: object
    PedidoInfoConvite:
      description: |
        Inspecção de um convite. O campo chama-se `Code` com maiúscula
        (`pkg/domain/group.go:42-44`) — a bateria de campo mediu `400` com
        `inviteLink`.
      properties:
        Code:
          description: |
            Código do convite. **Medido**: o URL completo
            `https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4` também devolve
            `200`, porque a biblioteca corta o prefixo
            (`internal/wa-noise/capabilities/group/invite.go:83`).
          example: IVccRoDVSbpHKNkgNxyZx4
          type: string
      required:
        - Code
      type: object
    PedidoInfoUtilizadores:
      description: |
        JIDs a consultar. O campo é o MESMO da rota de verificação (`phone`), mas
        aqui o manipulador acrescenta `@s.whatsapp.net` a todo valor sem `@`
        antes de chamar o caso de uso (F242/F225), pelo que tanto o número nu
        como o JID completo funcionam.
      properties:
        phone:
          description: |
            JIDs (ou números nus) a consultar. Um valor que não parseia é SALTADO
            em silêncio, não recusado — comportamento preservado do upstream.
          example:
            - 554192421234@s.whatsapp.net
          items:
            type: string
          type: array
      required:
        - phone
      type: object
    PedidoLigacaoComunidade:
      description: |
        Pedido de ligação ou desligação de um grupo a uma comunidade. Ao contrário
        das duas rotas de leitura, **não aceita o alias `chat`**: a struct não
        inclui `ChatTarget` (`pkg/domain/community.go:31-40`).
      properties:
        communityJID:
          description: JID da comunidade (grupo-pai). Ausente, `400 missing_community_jid`.
          example: 120363430034334401@g.us
          type: string
        groupJID:
          description: JID do grupo a ligar ou desligar. Ausente, `400 missing_group_jid`.
          example: 120363411669320145@g.us
          type: string
      required:
        - communityJID
        - groupJID
      type: object
    PedidoLimiteHistorico:
      description: Corpo de `POST /session/history`.
      properties:
        history:
          description: |
            Quantas mensagens gravar por conversa em `message_history`. `0`
            desliga a gravação, e é o valor de origem de uma instalação nova.
            Negativo é recusado com `400 invalid_history`.
          example: 100
          minimum: 0
          type: integer
      required:
        - history
      type: object
    PedidoMarcarLida:
      description: |
        Marca uma ou mais mensagens como lidas.

        **Use `ChatPhone`, não `Chat`.** Os dois nomes são aceites pelo
        desserializador, mas só `ChatPhone` é RESOLVIDO: o ramo de `Chat` está
        por implementar (`mark_read.go:41`, `jidChat = ""`) e faz a conversa
        seguir vazia para o WhatsApp. Sem nenhum dos dois é
        `400 missing_chatphone`, medido.
      properties:
        Chat:
          description: |
            Nome antigo de `ChatPhone`. Aceite, mas NÃO resolvido — ver a
            descrição do esquema.
          example: 554192421234@s.whatsapp.net
          type: string
        ChatPhone:
          description: JID ou número da conversa. É o campo que a implementação resolve.
          example: 554192421234@s.whatsapp.net
          type: string
        Id:
          description: Lista de `message_id` a marcar como lidos. Vazia é `400 missing_id`.
          example:
            - 3EB0A4B2AFD45E625C0917
          items:
            type: string
          type: array
        Sender:
          description: Nome antigo de `SenderPhone`. Aceite, mas não resolvido.
          example: 554192421234@s.whatsapp.net
          type: string
        SenderPhone:
          description: |
            JID de quem escreveu as mensagens, em conversa de grupo. Opcional.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - Id
      type: object
    PedidoMarcarVistoCanal:
      description: Pedido de marcação de mensagens do canal como vistas.
      properties:
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        serverIDs:
          description: |
            Os `server_id` a marcar. Lista vazia ou ausente é recusada com
            `400 missing_server_ids`.
          example:
            - 1
            - 2
            - 3
          items:
            type: integer
          type: array
      required:
        - jid
        - serverIDs
      type: object
    PedidoMensagemIndisponivel:
      description: |
        Pede ao par o REENVIO de uma mensagem que não se conseguiu decifrar.
      properties:
        chat:
          description: JID da conversa onde a mensagem indecifrável apareceu.
          example: 554192421234@s.whatsapp.net
          type: string
        id:
          description: '`message_id` da mensagem a pedir de volta.'
          example: 3EB0A4B2AFD45E625C0917
          type: string
        sender:
          description: JID de quem escreveu a mensagem indecifrável.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - chat
        - sender
        - id
      type: object
    PedidoMensagensCanal:
      description: Pedido de histórico do canal, paginado para trás.
      properties:
        before:
          description: |
            `server_id` da mensagem a partir da qual paginar para trás. É lido como
            número; texto não numérico não é recusado, é tratado como zero.
          example: "104"
          type: string
        count:
          description: |
            Quantas mensagens trazer. Zero ou ausente **não** é um limite nosso: o
            atributo é omitido do pedido e o servidor usa o padrão dele
            (`adapter.go:330`).
          example: 5
          type: integer
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
      required:
        - jid
      type: object
    PedidoModoAprovacao:
      description: |
        Exigir, ou deixar de exigir, aprovação para entrar. O campo do grupo é
        `groupjid`, todo em minúsculas (`pkg/domain/group_request.go:40`).
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupjid:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
        mode:
          description: |
            `true` passa a exigir aprovação. Ausente é `false`, e DESLIGA a
            exigência — um pedido só com `groupjid` abre o grupo.
          example: true
          type: boolean
      required:
        - groupjid
      type: object
    PedidoNomeGrupo:
      description: Novo nome de um grupo.
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
        name:
          description: |
            O novo nome. Obrigatório — e repare que é o ÚNICO campo validado pelo
            manipulador: um pedido sem `groupJID` passa a validação e só falha
            mais à frente, na resolução do JID, com `invalid_jid`.
          example: Equipa de entregas — turno da manhã
          type: string
      required:
        - name
      type: object
    PedidoPareamentoTelefone:
      description: Corpo de `POST /session/pairphone`.
      properties:
        Phone:
          description: |
            Número em formato internacional, só dígitos, com código de país e
            SEM `+`, espaços ou `@s.whatsapp.net`. Um número nacional ou curto
            demais é recusado pela validação do próprio wa-noise e chega ao
            cliente como `400 pair_phone_failed` com a mensagem do SDK.
          example: "554192421234"
          type: string
      required:
        - Phone
      type: object
    PedidoPresenca:
      description: Estado de presença global da sessão — é a conta inteira, não uma conversa.
      properties:
        type:
          description: |
            `available` marca a conta como online; `unavailable`, offline.
            Qualquer outro valor é recusado com `invalid_presence_type`.
          enum:
            - available
            - unavailable
          example: available
          type: string
      required:
        - type
      type: object
    PedidoPresencaNaConversa:
      description: |
        Anuncia "a escrever" ou "a gravar" numa conversa. É um sinal efémero: o
        WhatsApp deixa de o mostrar sozinho passado pouco tempo, e não há rota
        para o retirar — envie `paused` para isso.
      properties:
        Media:
          description: |
            Qualificador opcional do estado, passado tal e qual ao WhatsApp.
            Envie string vazia quando não se aplicar.
          example: ""
          type: string
        Phone:
          description: JID ou número da conversa onde o estado é anunciado.
          example: 554192421234@s.whatsapp.net
          type: string
        State:
          description: |
            O estado a anunciar. Os valores documentados na implementação são
            `composing` (a escrever), `recording` (a gravar) e `paused` (parou).
          example: composing
          type: string
        chat:
          description: Nome universal do destino; `Phone` tem precedência.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - State
      type: object
    PedidoProxy:
      description: |
        Corpo de `POST /proxy/set` **e** de `POST /session/proxy` — os dois
        caminhos são a MESMA operação, servida pelo mesmo manipulador. O segundo é
        a forma nova; o primeiro fica por compatibilidade.

        `enable` decide o ramo: ligar valida o URL, desligar limpa o proxy gravado
        sem sequer olhar para ele.
      properties:
        enable:
          description: |
            `true` grava o proxy; `false` remove-o. No ramo de remoção o
            `proxy_url` é IGNORADO de propósito — recusar a remoção porque a URL
            que vai ser deitada fora está malformada tornaria uma configuração
            estragada impossível de apagar.
          example: true
          type: boolean
        proxy_url:
          description: |
            URL do proxy. Só `http` e `socks5` são aceites — `https` é recusado
            com `400 unsupported_proxy_scheme`, porque exige um transporte que
            este processo não monta. Credenciais vão no userinfo
            (`socks5://utilizador:segredo@servidor:1080`) e nunca aparecem em log
            nem em mensagem de erro.
          example: socks5://proxy.interno:1080
          type: string
        webhook_use_proxy:
          description: |
            Se a entrega de WEBHOOK também sai por este proxy. Omitido, herda o
            valor gravado e, na falta dele, o padrão da instalação.

            **Muda a validação**: com este modo ligado, um endereço reservado ou
            de loopback é recusado com `400 reserved_proxy_address` — de outra
            forma, o proxy indicado pelo inquilino seria um caminho à volta do
            validador de saída. Com ele desligado, o proxy só carrega o tráfego
            do próprio WhatsApp e um endereço interno é permitido.
          example: false
          type: boolean
      required:
        - enable
      type: object
    PedidoReagir:
      description: |
        Reage a uma mensagem com um emoji, ou remove a reação existente.
      properties:
        Body:
          description: |
            O emoji da reação. Dois valores têm significado especial:
            `"remove"` retira a reação, e string vazia é RECUSADA com
            `400 missing_body` — para remover, envie `"remove"`.
          example: "\U0001F44D"
          type: string
        Id:
          description: |
            `message_id` da mensagem reagida. Um prefixo `me:` marca a mensagem
            como própria — `me:3EB0A4B2AFD45E625C0917` — e o prefixo é removido
            antes de chegar ao WhatsApp.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        Participant:
          description: |
            JID de quem escreveu a mensagem reagida, em conversa de grupo. Um
            `Participant` que não resolve é IGNORADO em silêncio, não recusado —
            comportamento preservado do código histórico.
          example: 554192421234@s.whatsapp.net
          type: string
        Phone:
          description: JID ou número da conversa onde a mensagem está.
          example: 554192421234@s.whatsapp.net
          type: string
        chat:
          description: Nome universal do destino; `Phone` tem precedência.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - Body
        - Id
      type: object
    PedidoReagirCanal:
      description: |
        Pedido de reação a uma mensagem do canal. Enviar `reaction` vazio REMOVE a
        reação — é por isso que o campo não é obrigatório.
      properties:
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        messageID:
          description: Identificador da mensagem, quando o cliente o tem. Opcional.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        reaction:
          description: |
            O emoji. **Vazio remove a reação**, e por isso a validação não o exige
            (`newsletter_ops.go:234`).
          example: "\U0001F44D"
          type: string
        serverID:
          description: |
            `server_id` da mensagem alvo. Zero é recusado com
            `400 missing_server_id` — logo não há como reagir à mensagem de
            `server_id` 0, se ela existir.
          example: 1
          type: integer
      required:
        - jid
        - serverID
      type: object
    PedidoRecado:
      description: |
        Corpo de `POST /user/status`. Define o **recado** do perfil (o "Sobre"),
        não uma story.
      properties:
        Body:
          description: Texto do recado. Vazio é recusado com `400 missing_body`.
          example: Atendimento das 9h às 18h
          type: string
        chat:
          description: |
            Aceite pelo decodificador como em toda rota, mas **ignorado**: esta
            operação é sobre a própria conta e não tem destinatário.
          example: ""
          type: string
      required:
        - Body
      type: object
    PedidoRecusarChamada:
      description: |
        Corpo de `POST /call/reject`. **Os dois campos vêm do evento `CallOffer`** —
        não são inventáveis, e sem esse evento a rota não tem alvo.
      properties:
        call_from:
          description: |
            Quem está a ligar, como veio no evento. Aceita telefone nu, JID de
            telefone ou LID — a resolução é feita pelo servidor. Em falta dá
            `400 missing_call_from`; irresolúvel dá `400 invalid_call_from`.
          example: 554192421234@s.whatsapp.net
          type: string
        call_id:
          description: |
            Identificador da chamada, **gerado pelo WhatsApp** e entregue no evento
            `CallOffer`. Em falta dá `400 missing_call_id`.
          example: 3EB0A4B2AFD45E625C0917
          type: string
      required:
        - call_from
        - call_id
      type: object
    PedidoRemoverFotoGrupo:
      description: |
        Remoção da foto. O campo do grupo é `groupjid`, todo em minúsculas
        (`handler_group_mgmt.go:262`), ao contrário do `groupJID` das rotas
        vizinhas.
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupjid:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      type: object
    PedidoSilenciarCanal:
      description: Pedido de silenciamento, que liga ou desliga conforme `mute`.
      properties:
        jid:
          description: JID do canal.
          example: 120363411025775186@newsletter
          type: string
        mute:
          description: |
            `true` silencia, `false` volta a notificar. O campo é booleano simples:
            ausente vale `false`, ou seja, dessilenciar.
          example: true
          type: boolean
      required:
        - jid
      type: object
    PedidoSilenciarConversa:
      description: |
        Silencia ou dessilencia uma conversa.

        **`mute_duration` é um número inteiro de NANOSSEGUNDOS**, e não uma
        string de duração — é um `*time.Duration` do Go
        (`pkg/domain/mute.go:17`). Enviar `"8h"` devolve
        `400 could_not_decode_payload`, medido.
      properties:
        chat:
          description: Nome universal do destino; `jid` tem precedência.
          example: 554192421234@s.whatsapp.net
          type: string
        jid:
          description: JID da conversa a silenciar.
          example: 554192421234@s.whatsapp.net
          type: string
        mute:
          description: '`true` silencia, `false` dessilencia (imediato).'
          example: true
          type: boolean
        mute_duration:
          description: |
            Por quanto tempo silenciar, em NANOSSEGUNDOS. O WhatsApp oferece
            exactamente três opções, e o servidor recusa qualquer outro valor
            com `400 invalid_mute_duration`:

            | opção | valor a enviar |
            |---|---|
            | 8 horas | `28800000000000` |
            | 1 semana | `604800000000000` |
            | para sempre | `0`, ou o campo ausente |

            Ignorado quando `mute` é `false`.
          enum:
            - 0
            - 28800000000000
            - 604800000000000
          example: 28800000000000
          format: int64
          nullable: true
          type: integer
      required:
        - mute
      type: object
    PedidoSincronizacaoContactos:
      description: Corpo de `POST /user/contacts/sync`.
      properties:
        mode:
          description: |
            Escolhe o custo do pull do patch de app-state que carrega a agenda:

            - `if_unsynced` — não faz nada se a agenda já estiver sincronizada;
            - `incremental` — busca barata, não apaga a versão local;
            - `full` — re-snapshot completo, caro.

            Qualquer outro valor é `400 invalid_sync_mode`. Em particular,
            `delta` **não** existe — foi a suposição que a bateria de campo
            desmentiu.
          enum:
            - if_unsynced
            - incremental
            - full
          example: if_unsynced
          type: string
      required:
        - mode
      type: object
    PedidoSincronizacaoHistorico:
      description: |
        Corpo de `POST /user/history/sync`. O pedido é sempre por mensagens
        ANTERIORES a uma âncora conhecida — daí os cinco campos descreverem uma
        mensagem que o chamador já tem.
      properties:
        chat_jid:
          description: Conversa cujo histórico se pede. Obrigatório — sem ele, `400 missing_chat_jid`.
          example: 554192421234@s.whatsapp.net
          type: string
        count:
          description: |
            Quantas mensagens pedir. Ausente, zero ou negativo assume **50**, o
            lote recomendado pela própria biblioteca
            (`session/request_history_sync.go:15`).
          example: 50
          type: integer
        oldest_msg_from_me:
          description: Se a mensagem-âncora foi enviada por esta conta.
          example: true
          type: boolean
        oldest_msg_id:
          description: |
            `message_id` da mensagem mais antiga que o chamador já tem: é a
            âncora a partir da qual se pede para trás. Obrigatório — sem ele,
            `400 missing_oldest_msg_id`.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        oldest_msg_timestamp:
          description: Instante da mensagem-âncora, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          type: integer
      required:
        - chat_jid
        - oldest_msg_id
      type: object
    PedidoSolicitacoesEntrada:
      description: |
        Corpo de `GET /group/requestparticipants`. Um `GET` com corpo é servido
        pelo `curl` mas quebra clientes que assumem que `GET` não o tem — use os
        parâmetros de query, que foram medidos a funcionar igualmente.
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      type: object
    PedidoStatusAudio:
      description: |
        Áudio a publicar como status. Não aceita legenda — o áudio de status não
        a tem.
      properties:
        Audio:
          description: |
            O áudio, como URI de dados começado por `data:audio/` **ou** como URL
            `http(s)://`. O limite é de 16 MiB depois de descodificado.
          example: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
          type: string
        Id:
          description: Identificador a atribuir à mensagem. Quando ausente, o servidor gera um.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        mimetype:
          description: |
            Tipo do áudio. Repare que, ao contrário das rotas de imagem e vídeo,
            o campo é declarado em minúsculas (`mimetype`, não `MimeType`) —
            divergência real da implementação (`pkg/domain/session.go:120`). Como
            o `encoding/json` do Go casa nomes ignorando maiúsculas, `MimeType`
            continua a ser aceite; `mimetype` é o nome declarado. Quando ausente,
            o tipo é detectado a partir dos bytes.
          example: audio/mp4
          type: string
      required:
        - Audio
      type: object
    PedidoStatusImagem:
      description: |
        Imagem a publicar como status. A origem é uma união de duas formas: URI
        de dados ou URL http(s). Qualquer outra coisa é recusada antes de sair
        da máquina.
      properties:
        Caption:
          description: Legenda a mostrar sob a imagem.
          example: Estamos abertos até às 20h.
          type: string
        Id:
          description: |
            Identificador a atribuir à mensagem. Quando ausente, o servidor gera
            um — é o que vem em `message_id` na resposta.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        Image:
          description: |
            A imagem, como URI de dados começado por `data:image` **ou** como URL
            `http(s)://`. O limite é de 16 MiB depois de descodificada, e é
            verificado ANTES da descodificação quando o URI declara `;base64`.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          type: string
        JPEGThumbnail:
          description: Miniatura JPEG, em base64, para o cliente desenhar antes de baixar a imagem.
          format: byte
          type: string
        MimeType:
          description: |
            Tipo da imagem. Quando ausente, é detectado a partir dos bytes. O
            tipo resolvido TEM de começar por `image/`, senão o pedido é recusado.
          example: image/png
          type: string
      required:
        - Image
      type: object
    PedidoStatusVideo:
      description: |
        Vídeo a publicar como status. Mesma união de origens da imagem, com um
        limite maior e uma verificação de tipo mais frouxa.
      properties:
        Caption:
          description: Legenda a mostrar sob o vídeo.
          example: Bastidores de hoje.
          type: string
        Id:
          description: Identificador a atribuir à mensagem. Quando ausente, o servidor gera um.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        JPEGThumbnail:
          description: Miniatura JPEG, em base64, para o cliente desenhar antes de baixar o vídeo.
          format: byte
          type: string
        MimeType:
          description: Tipo do vídeo. Quando ausente, é detectado a partir dos bytes.
          example: video/mp4
          type: string
        Video:
          description: |
            O vídeo, como URI de dados começado por `data:` **ou** como URL
            `http(s)://`. O limite é de 100 MiB depois de descodificado.

            Repare que, ao contrário da imagem, o prefixo aceite é `data:` e não
            `data:video` — e o tipo resolvido NÃO é verificado contra `video/`.
          example: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
          type: string
      required:
        - Video
      type: object
    PedidoSubscricaoPresenca:
      description: De quem se quer receber notificações de presença.
      properties:
        Phone:
          description: Contacto a subscrever. Aceita número nu, JID de telefone ou LID.
          example: 554192421234@s.whatsapp.net
          type: string
        chat:
          description: Nome universal do destino. `Phone` ganha quando os dois vierem.
          example: 554192421234@s.whatsapp.net
          type: string
      required:
        - Phone
      type: object
    PedidoTemporizadorDaConversa:
      description: |
        Define o temporizador de mensagens temporárias de UMA conversa.
        Ao contrário de `/chat/mute`, aqui a duração é TEXTO.
      properties:
        chat:
          description: |
            JID da conversa — contacto ou grupo. Obrigatório e sem alias:
            ausente é `400 missing_chat`.
          example: 554192421234@s.whatsapp.net
          type: string
        duration:
          description: |
            Uma das cinco palavras que o servidor aceita. Qualquer outra é
            `400 invalid_duration`, medido.
          enum:
            - "0"
            - "off"
            - 24h
            - 7d
            - 90d
          example: 24h
          type: string
      required:
        - chat
        - duration
      type: object
    PedidoTemporizadorGrupo:
      description: |
        Mensagens temporárias do grupo. O campo do grupo é `groupjid`, todo em
        minúsculas (`pkg/domain/group.go:186`).
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        duration:
          description: |
            Só três valores são reconhecidos: `24h`, `7d` e `90d`
            (`group_management.go:229-241`).

            **Qualquer outro valor DESLIGA o temporizador em silêncio**, com
            `200` — incluindo um erro de escrita como `"24H"` ou `"1d"`. O código
            chama-lhe regra preservada do upstream e regista um aviso no log; do
            lado do cliente não há nada que distinga "desliguei" de "escrevi mal".
            Para desligar de propósito, `off` serve tão bem como qualquer outro
            valor não reconhecido.
          example: 24h
          type: string
        groupjid:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
      type: object
    PedidoTemporizadorPadrao:
      description: |
        Define o temporizador padrão da CONTA, aplicado às conversas novas. Não
        altera conversa nenhuma que já exista.
      properties:
        duration:
          description: |
            Mesmo conjunto de `/chat/ephemeral`. Ausente é
            `400 missing_duration`; valor fora do conjunto é
            `400 invalid_duration`.
          enum:
            - "0"
            - "off"
            - 24h
            - 7d
            - 90d
          example: "0"
          type: string
      required:
        - duration
      type: object
    PedidoTopicoGrupo:
      description: Nova descrição de um grupo.
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
        topic:
          description: |
            A nova descrição. Obrigatória; vazia devolve `400`. Não há forma de
            APAGAR a descrição por esta rota — enviar vazio é recusado, não
            aceite como limpeza.
          example: Combinações de rota do turno da manhã
          type: string
      required:
        - topic
      type: object
    PedidoTrancarGrupo:
      description: Alterna o modo em que só administradores editam os metadados.
      properties:
        chat:
          description: Nome universal do destino.
          example: 120363411669320145@g.us
          type: string
        groupJID:
          description: JID do grupo.
          example: 120363411669320145@g.us
          type: string
        locked:
          description: |
            `true` impede não-administradores de mudar nome, descrição e foto.
            Ausente é `false`, e destranca.
          example: true
          type: boolean
      type: object
    PedidoVerificacaoNumero:
      description: |
        Números a verificar contra a base do WhatsApp. O campo é um ARRAY mesmo
        para um único número — a rota foi feita para verificação em lote.
      properties:
        phone:
          description: |
            Números a verificar. Aceita o número NU (`554192421234`), que é a
            forma medida em campo. O nome declarado na struct é `phone`; como o
            `encoding/json` do Go casa nomes ignorando maiúsculas, `Phone`
            também é aceite.
          example:
            - "554192421234"
          items:
            example: "554192421234"
            type: string
          type: array
      required:
        - phone
      type: object
    PedidoVotoEnquete:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            Id:
              $ref: '#/components/schemas/IdCliente'
            Options:
              description: |
                O texto EXACTO das opções votadas, tal como foram criadas. Lista
                vazia é `400 missing_options`.
              example:
                - Manhã
              items:
                type: string
              minItems: 1
              type: array
            Phone:
              description: |
                A conversa onde a enquete está. Sinónimo universal `chat`.
              example: 554192421234@s.whatsapp.net
              type: string
            PollMessageId:
              description: |
                `message_id` da mensagem de enquete original. Vazio é
                `400 missing_poll_message_id`.
              example: 3EB0A4B2AFD45E625C0917
              type: string
            PollMessageTimestamp:
              description: |
                Instante da enquete original, em segundos desde a época Unix. **Zero
                conta como ausente** e é `400 missing_poll_message_timestamp`.

                É pedido — em vez de procurado no histórico — porque o voto é cifrado
                com um segredo derivado da mensagem original, e depender do histórico
                faria a rota falhar em silêncio quando ele tivesse sido podado.
              example: 1787748016
              format: int64
              type: integer
            Sender:
              description: |
                JID de quem CRIOU a enquete. Vazio é `400 missing_sender`; um JID
                que não parseia é `400 invalid_sender`.

                Pode vir em qualquer das duas formas de identidade (PN ou LID): o
                servidor resolve-a antes de cifrar o voto, preferindo a forma que o
                histórico registou, com recurso ao mapeamento PN→LID quando o
                histórico não tem a mensagem (HOUSEKEEP F228).
              example: 554192421234@s.whatsapp.net
              type: string
          required:
            - Sender
            - PollMessageId
            - PollMessageTimestamp
            - Options
          type: object
      description: Corpo de `POST /chat/send/pollvote`. Voto numa enquete existente, identificada pelo par `PollMessageId` mais `PollMessageTimestamp`.
    PedidoWebhook:
      description: |
        Corpo de `POST /webhook` e de `PUT /webhook`. Os dois verbos aceitam os
        mesmos campos, mas **`active` só é lido pelo `PUT`**.
      properties:
        active:
          description: |
            **Lido apenas pelo `PUT`.** `false` limpa URL e eventos, seja qual for
            o resto do corpo. No `POST` este campo é ignorado.
          example: true
          type: boolean
        events:
          description: |
            Eventos a subscrever. **Nomes desconhecidos são descartados em
            silêncio**, com aviso apenas no log do servidor — a chamada devolve
            `200`. Lista ausente ou vazia deixa a subscrição gravada como está.
            `All` recebe todos os eventos.
          example:
            - Message
            - Receipt
            - ReadReceipt
          items:
            type: string
          type: array
        webhook:
          description: O outro nome do URL de destino. Perde para `webhookurl`.
          example: https://exemplo.com.br/wa-api/eventos
          type: string
        webhookurl:
          description: |
            URL de destino. **Vence sobre `webhook`** quando os dois vierem no
            mesmo corpo. Os dois nomes existem por herança de clientes antigos.
          example: https://exemplo.com.br/wa-api/eventos
          type: string
      type: object
    PerfilSessao:
      description: |
        Perfil da própria conta ligada, devolvido por `GET /session/profile`.
        MEDIDO no servidor vivo em 2026-08-26.

        Lê só o store LOCAL — não fala com o servidor do WhatsApp, e por isso
        responde em microssegundos e não está sujeito a rate limit. É a diferença
        para `/session/profile/full`.

        Os campos de identidade e os de aparelho vivem no mesmo nível: o
        resultado embute `SessionDeviceInfo` de forma anónima justamente para o
        objecto continuar plano (`profile/get_profile.go:40`).
      properties:
        avatar_id:
          description: Identificador da foto actual, útil para detectar troca de avatar sem rebaixar a imagem.
          example: "214830039"
          type: string
        avatar_url:
          description: |
            URL da foto de perfil. **Vazio tem duas causas** — não haver foto, ou
            a consulta ter falhado. As duas são indistinguíveis na resposta; a
            falha fica no log (`profile/get_profile.go:99`).
          example: https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg
          type: string
        business_name:
          description: |
            Nome comercial. Preenchido em contas Business, vazio em contas
            pessoais — é um dos dois sinais de que o tipo de conta se deduz (ver
            `platform`).
          example: FilaRápida
          type: string
        connected:
          description: Há transporte vivo. Mesmo significado do campo homónimo de `GET /session/status`.
          example: true
          type: boolean
        full_name:
          description: Nome completo do roster local. Costuma vir vazio para a própria conta.
          example: ""
          type: string
        initialized:
          description: O store completou o handshake inicial.
          example: true
          type: boolean
        jid:
          description: |
            JID próprio na forma PN, SEM sufixo de dispositivo. Vazio numa sessão
            ligada e ainda não autenticada — e nesse estado os campos de aparelho
            continuam preenchidos, o que é deliberado.
          example: 5516981818244@s.whatsapp.net
          type: string
        lid:
          description: Identidade da conta no espaço `@lid`, com sufixo de dispositivo.
          example: 29343770251463:25@lid
          type: string
        lid_migration_timestamp:
          description: Quando a conta migrou para o espaço `@lid`. Zero significa que não houve migração registada.
          example: 1766149842
          format: int64
          type: integer
        logged_in:
          description: |
            A sessão está autenticada. Repare no nome — aqui é `logged_in`, e em
            `GET /session/status` é `loggedIn`. As duas rotas divergem na grafia
            e ambas estão em uso.
          example: true
          type: boolean
        platform:
          description: |
            Plataforma que o WhatsApp reporta do aparelho emparelhado.

            **É por aqui que se deduz o tipo de conta, e a dedução é INFERÊNCIA,
            não declaração do protocolo** (achado F260 do `HOUSEKEEP.md`): não
            existe campo nenhum na API que diga se a conta é Business ou pessoal.
            Medido nas duas sessões vivas em 2026-08-26, `smbi` corresponde a uma
            conta WhatsApp Business e `iphone` a uma conta pessoal. Que `smbi`
            signifique "SMB iOS" é leitura do valor, não mapeamento medido no
            protocolo — trate-o como pista, e confirme com `business_name` se a
            decisão for importante.
          example: smbi
          type: string
        pushname:
          description: Nome que a conta anuncia nas mensagens que envia.
          example: FilaRápida
          type: string
        registration_id:
          description: Identificador desta instalação no protocolo Signal.
          example: 4190140233
          format: int64
          type: integer
      type: object
    PerfilSessaoCompleto:
      allOf:
        - $ref: '#/components/schemas/PerfilSessao'
        - description: |
            O que `/session/profile/full` acrescenta ao perfil local: dois blocos
            que só a REDE sabe. MEDIDO no servidor vivo em 2026-08-26.

            A base local nunca falha por causa da rede — se as duas consultas
            remotas caírem, a resposta ainda traz tudo o que `/session/profile`
            traria, e `unavailable` diz o que faltou e porquê.
          properties:
            privacy:
              additionalProperties: true
              description: |
                Definições de privacidade da conta, como o servidor as reporta.
                Chaves e valores vêm do SDK sem tradução.
              example:
                CallAdd: all
                Defense: "off"
                GroupAdd: all
                LastSeen: contacts
                Messages: all
                Online: all
                Profile: all
                ReadReceipts: all
                Status: contacts
                Stickers: contacts
              type: object
            unavailable:
              additionalProperties:
                type: string
              description: |
                Presente APENAS quando algum bloco remoto não pôde ser obtido, com
                o motivo por chave. Degradar em silêncio seria pior do que falhar:
                sem isto, um `user_info` ausente por falha de rede ficaria
                indistinguível de um ausente por não haver dado.
              example:
                user_info: sessao sem JID proprio; nada a consultar
              type: object
            user_info:
              additionalProperties: true
              description: |
                Bloco CRU do SDK para o próprio JID, indexado pelo JID. Carrega o
                recado (`Status`), a lista de dispositivos que o servidor conhece
                e o LID. As chaves são as do SDK, em maiúsculas iniciais — não
                passam por normalização nenhuma. Ausente quando a sessão não tem
                JID próprio ou quando a consulta falhou (ver `unavailable`).
              example:
                5516981818244@s.whatsapp.net:
                  Devices:
                    - 5516981818244@s.whatsapp.net
                    - 5516981818244:25@s.whatsapp.net
                  LID: 29343770251463@lid
                  PictureID: "214830039"
                  Status: conta de testes
                  VerifiedName: null
              type: object
          type: object
      description: Resposta de `GET /session/profile/full`. Perfil da conta ligada, incluindo `platform` — o único sinal de que a conta é Business (`smbi`) ou pessoal.
    PerfilUtilizador:
      description: |
        Tudo o que se sabe sobre um contacto, reunido num pedido só, a partir de
        QUALQUER uma das suas identidades. Cada peça é obtida separadamente e
        **degrada em vez de falhar**: o que não se conseguiu obter aparece em
        `unavailable`, com o motivo, em vez de sair como campo vazio mudo.
      properties:
        avatar_id:
          description: Identificador da foto. Vazio quando indisponível.
          example: ""
          type: string
        avatar_url:
          description: URL da foto de perfil em tamanho cheio. Vazio quando indisponível.
          example: ""
          type: string
        jid:
          description: Identidade de telefone. Vazio quando só se conhece o LID e não há mapeamento.
          example: 554192421234@s.whatsapp.net
          type: string
        lid:
          description: Identidade de privacidade. Vazio quando não há mapeamento conhecido.
          example: 90937376170214@lid
          type: string
        on_whatsapp:
          description: |
            Se o número tem conta. `false` é resposta, não erro — a rota devolve
            `200` na mesma. **`null` é diferente de `false`**: significa que a
            pergunta não pôde ser feita, e o motivo está em `unavailable`.
          example: true
          nullable: true
          type: boolean
        query:
          description: O que foi pedido no caminho, ecoado — diz por qual identidade se entrou.
          example: 554192421234@s.whatsapp.net
          type: string
        unavailable:
          additionalProperties:
            type: string
          description: |
            O que NÃO pôde ser obtido, com o motivo, por chave. Ausente quando
            tudo correu bem. As chaves observadas são `jid`, `lid`, `on_whatsapp`,
            `user_info` e `avatar`.
          example:
            avatar: avatar hidden by privacy settings
          type: object
        user_info:
          additionalProperties:
            $ref: '#/components/schemas/InfoUtilizador'
          description: |
            O bloco cru do módulo de protocolo, com a mesma forma de
            `POST /user/info` — indexado pelo JID consultado.
          type: object
        verified_name:
          description: Nome verificado, quando a conta é comercial verificada.
          example: ""
          type: string
      required:
        - jid
        - lid
        - query
        - on_whatsapp
      type: object
    ResolucaoLID:
      description: O par de identidades de um número, quando o mapeamento é conhecido.
      properties:
        jid:
          description: O número consultado, em forma canónica.
          example: 554192421234@s.whatsapp.net
          type: string
        lid:
          description: O identificador de privacidade correspondente.
          example: 90937376170214@lid
          type: string
      required:
        - jid
        - lid
      type: object
    RespostaWebhookAtualizado:
      description: Resposta de `PUT /webhook`.
      properties:
        active:
          description: Eco do `active` enviado. Ausente quando `false`.
          example: true
          type: boolean
        events:
          description: |
            **Apenas os eventos que passaram na validação** — é aqui que se confere
            o que sobreviveu. Ausente quando nenhum sobreviveu.
          example:
            - Message
            - Receipt
          items:
            type: string
          type: array
        webhook:
          description: URL que ficou em vigor. Vazio quando `active` era `false`.
          example: https://exemplo.com.br/wa-api/eventos
          type: string
      type: object
    ResultadoApagarMensagem:
      description: |
        `message_id` é o identificador da mensagem REVOGADA, e não o da mensagem
        de revogação que o envio criou — é o que responde à pergunta "qual
        mensagem foi apagada".
      properties:
        message_id:
          example: 3EB0A4B2AFD45E625C0917
          type: string
        status:
          description: Constante `deleted`.
          enum:
            - deleted
          example: deleted
          type: string
        timestamp:
          description: Instante da revogação, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoAtualizarParticipantes:
      description: |
        Resposta de `POST /group/updateparticipants`. É a única rota de escrita
        desta família que devolve mais do que `Details`.
      properties:
        Details:
          description: Confirmação textual, constante.
          example: Participants updated
          type: string
        confirmed:
          description: |
            A sessão que agiu LEU a mudança de volta. Neste transporte é sempre
            `true`, porque o protocolo devolve a lista resultante na própria
            resposta (`pkg/infra/wa-noise/adapters/group/participants.go:37`). O
            campo existe porque nem todo transporte consegue confirmar, e um
            sucesso que ninguém verificou não pode ser calado
            (`pkg/domain/group.go:236`).
          example: true
          type: boolean
        result:
          description: |
            A lista de participantes que o WhatsApp devolveu na MESMA resposta.
            `Error` diferente de zero numa entrada diz que aquele participante
            falhou enquanto os outros passaram.
          items:
            $ref: '#/components/schemas/ParticipanteGrupo'
          type: array
      type: object
    ResultadoBloqueio:
      description: |
        Resultado de bloquear ou desbloquear. **Nunca foi observado em campo**:
        as duas rotas que o produzem falham hoje (ver F264), logo a forma abaixo
        vem do código (`block_user.go:71-81`), não de medição.
      properties:
        Blocklist:
          description: A lista de bloqueados resultante da operação.
          example:
            - 554192421234@s.whatsapp.net
          items:
            type: string
          type: array
        DHash:
          description: Hash da lista resultante.
          example: "1787412261963655"
          type: string
        Details:
          description: Confirmação textual — `User blocked` ou `User unblocked`.
          example: User blocked
          type: string
        JID:
          description: O JID que a lista de bloqueio de facto usou, depois da normalização.
          example: 554192421234@s.whatsapp.net
          type: string
        RequestedJID:
          description: |
            O JID pedido, presente APENAS quando difere do usado — acontece
            quando o pedido veio em LID e precisou de ser traduzido.
          example: 90937376170214@lid
          type: string
      type: object
    ResultadoConfigHmac:
      description: |
        Resposta de `POST /session/hmac/config` e de `DELETE /session/hmac/config`.
        Como em S3, os dois campos são `omitempty` — a resposta do DELETE sai só
        com `Details`, porque `Enabled` fica `false`.
      properties:
        Details:
          example: HMAC configuration saved successfully
          type: string
        Enabled:
          description: Estado DEPOIS da operação — `true` quando a chave ficou gravada.
          example: true
          type: boolean
      type: object
    ResultadoConfigS3:
      description: |
        Resposta de `POST /session/s3/config` e de `DELETE /session/s3/config`.
        Ambos os campos são `omitempty`, logo a resposta do DELETE — e a de um
        POST com `enabled: false` — sai só com `Details`.
      properties:
        Details:
          example: S3 configuration saved successfully
          type: string
        Enabled:
          description: Estado DEPOIS da operação, não eco do pedido.
          example: true
          type: boolean
      type: object
    ResultadoConfiguracaoHmac:
      description: Resposta das escritas de HMAC — `POST /hmac/config`, `POST /hmac/configure` e `DELETE /hmac/config`.
      properties:
        Details:
          example: HMAC configuration saved successfully
          type: string
        Enabled:
          description: |
            Estado DEPOIS da operação: `true` quando a chave ficou gravada.
            **Ausente quando `false`**, portanto a revogação responde só com
            `Details`.
          example: true
          type: boolean
      type: object
    ResultadoConfiguracaoS3:
      description: Resposta das escritas de S3 — `POST /s3/config`, `POST /s3/configure` e `DELETE /s3/config`.
      properties:
        Details:
          description: Confirmação textual da operação.
          example: S3 configuration saved successfully
          type: string
        Enabled:
          description: |
            Estado DEPOIS da operação. **Ausente quando `false`** — logo, a remoção
            responde só com `Details`, e a ausência deste campo é a confirmação de
            que ficou desligado.
          example: true
          type: boolean
      type: object
    ResultadoDescargaDeMidia:
      description: |
        O conteúdo binário, já decifrado e codificado como Data URL.
      properties:
        Data:
          description: |
            Data URL completa — `data:<mimetype>;base64,<conteúdo>`. Não é
            base64 nu: o prefixo faz parte do valor.

            Um download que devolva ZERO bytes é `500 empty_media`, e não um
            `200` com Data URL vazia — decisão consciente registada como F126.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          type: string
        Mimetype:
          description: O mesmo `Mimetype` que veio no pedido.
          example: image/png
          type: string
      required:
        - Mimetype
        - Data
      type: object
    ResultadoDesconexao:
      description: |
        Resposta de `GET /session/disconnect` e de `POST /session/logout`.
        `details` vem SEMPRE, e SEMPRE vazio: os dois casos de uso devolvem o
        resultado zerado (`session/disconnect.go:42`, `session/logout.go:79`) e o
        campo não tem `omitempty`.
      properties:
        details:
          description: Sempre a string vazia. Campo herdado; nada o preenche hoje.
          example: ""
          type: string
      required:
        - details
      type: object
    ResultadoEnvio:
      description: |
        Resposta comum a todas as rotas de envio. `status: "sent"` significa
        que o WhatsApp aceitou a mensagem — não que ela já foi desenhada no
        cliente do destinatário.
      properties:
        message_id:
          description: Identificador da mensagem no servidor, para reagir, editar, apagar ou encaminhar depois.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        status:
          description: Estado do envio devolvido pelo servidor.
          example: sent
          type: string
        timestamp:
          description: Instante do envio, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoEnvioAudio:
      description: |
        Resposta de `/chat/send/audio`. É o `ResultadoEnvio` comum mais dois campos
        que descrevem a LEGENDA.

        A legenda vai como mensagem de texto SEPARADA, depois do áudio, porque o
        protocolo não tem campo de legenda em áudio (HOUSEKEEP F116). O envio
        **não é atómico**: o áudio pode sair e a legenda falhar. Nesse caso o
        pedido continua a ser `200` — devolver erro faria o cliente reenviar e
        duplicar um áudio que já está entregue — e `caption_status` diz o que
        aconteceu de facto.

        Ambos os campos estão AUSENTES quando não houve legenda a enviar.
      properties:
        caption_message_id:
          description: |
            Identificador da mensagem de legenda. Presente apenas quando
            `caption_status` é `sent`.
          example: 3EB0F1C9D2A74B380E1128
          type: string
        caption_status:
          description: |
            `sent` — a legenda saiu como mensagem própria.
            `failed` — o ÁUDIO saiu, a legenda não.
          enum:
            - sent
            - failed
          example: sent
          type: string
        message_id:
          description: Identificador do ÁUDIO no servidor.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        status:
          description: Estado do envio do áudio.
          example: sent
          type: string
        timestamp:
          description: Instante do envio do áudio, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoInfoConvite:
      description: Resposta de `POST /group/inviteinfo`.
      properties:
        invite_info:
          $ref: '#/components/schemas/InfoGrupo'
      type: object
    ResultadoInfoGrupo:
      description: Resposta de `POST /group/info`.
      properties:
        group_info:
          $ref: '#/components/schemas/InfoGrupo'
      type: object
    ResultadoLimiteHistorico:
      description: |
        Resposta de `POST /session/history`. As chaves são `Details` e `History`,
        com maiúscula inicial — é o corpo histórico da rota, e `History` NÃO tem
        `omitempty` de propósito: `0` é resposta legítima e omitir o campo
        esconderia "gravação desligada" (F165).
      properties:
        Details:
          example: History configured successfully
          type: string
        History:
          example: 100
          type: integer
      required:
        - History
      type: object
    ResultadoLinkConvite:
      description: Resposta de `POST /group/invitelink`.
      properties:
        invite_link:
          description: |
            O link INTEIRO, com o prefixo `https://chat.whatsapp.com/` — medido.
            `POST /group/join` documenta o código nu, logo os dois não encaixam
            por contrato, só por o corte de prefixo existir na biblioteca.
          example: https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4
          type: string
      type: object
    ResultadoListaGrupos:
      description: Resposta de `POST /group/list`.
      properties:
        groups:
          description: |
            Todos os grupos de que a sessão participa, incluindo comunidades
            (`IsParent: true`) e os sub-grupos de avisos que elas criam sozinhas
            (`IsDefaultSubGroup: true`). Não há filtro nem paginação: a rota não
            recebe campo nenhum.
          items:
            $ref: '#/components/schemas/InfoGrupo'
          type: array
      type: object
    ResultadoMensagemIndisponivel:
      description: |
        Confirmação de que o PEDIDO foi enviado ao par. Não diz que a mensagem
        voltou: o reenvio, se acontecer, chega depois como mensagem normal.
      properties:
        chat:
          description: Ecoa o `chat` enviado.
          example: 554192421234@s.whatsapp.net
          type: string
        message:
          example: Unavailable message request sent successfully
          type: string
        message_id:
          description: Ecoa o `id` enviado — a mensagem pedida de volta.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        request_id:
          description: Identificador da mensagem de pedido criada pelo envio.
          example: 3EB0C7D1F94A62B15D4488
          type: string
        sender:
          description: Ecoa o `sender` enviado.
          example: 554192421234@s.whatsapp.net
          type: string
        success:
          example: true
          type: boolean
        timestamp:
          description: Instante do pedido, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          type: integer
      required:
        - success
        - message
      type: object
    ResultadoPareamentoTelefone:
      description: Resposta de `POST /session/pairphone`.
      properties:
        LinkingCode:
          description: |
            Código de oito caracteres que a pessoa digita no telemóvel, em
            *Aparelhos conectados → Conectar com número de telefone*. Tem
            validade curta; se expirar, peça outro.
          example: ABCD-EFGH
          type: string
      required:
        - LinkingCode
      type: object
    ResultadoProxy:
      description: |
        Resposta de `POST /proxy/set`. **A forma difere entre os dois ramos**:
        ligar traz `Set`, `ProxyURL` e `webhook_use_proxy`; desligar responde só
        `Details`.
      properties:
        Details:
          description: '`Proxy configured successfully` ao ligar, `Proxy disabled successfully` ao desligar.'
          example: Proxy configured successfully
          type: string
        ProxyURL:
          description: Eco do URL gravado. Presente só no ramo de ligar.
          example: socks5://utilizador:senha@proxy.exemplo.com.br:1080
          type: string
        Set:
          description: Presente só no ramo de ligar.
          example: true
          type: boolean
        webhook_use_proxy:
          description: Valor efectivamente persistido. Presente só no ramo de ligar.
          example: false
          type: boolean
      type: object
    ResultadoRecado:
      description: |
        Resposta de `POST /user/status`. `details` vem sempre, e sempre vazio — o
        caso de uso devolve o resultado zerado (`session/set_status_message.go:47`).
      properties:
        details:
          example: ""
          type: string
      required:
        - details
      type: object
    ResultadoRecusarChamada:
      description: Resposta de `POST /call/reject`.
      properties:
        CallID:
          description: Eco do `call_id` recusado, para casar com o evento de origem.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        Details:
          example: Call rejected
          type: string
      type: object
    ResultadoSincronizacaoContactos:
      description: Resposta de `POST /user/contacts/sync`.
      properties:
        details:
          description: |
            Constante. Diz que o pedido foi FEITO, não que a agenda já chegou —
            os contactos entram depois, por eventos de app-state.
          enum:
            - contact roster sync requested
          example: contact roster sync requested
          type: string
        mode:
          description: Eco do modo pedido.
          example: if_unsynced
          type: string
      required:
        - details
        - mode
      type: object
    ResultadoSincronizacaoHistorico:
      description: |
        Resposta de `POST /user/history/sync`. Ecoa a âncora pedida e devolve o
        id do PEDIDO.

        **`count` é o que foi PEDIDO, nunca o que chegou.** As mensagens vêm
        depois, como um evento `HistorySync` do tipo ON_DEMAND — que sai pelo
        webhook e pelo `GET /session/ws`, se a sessão subscrever `HistorySync`.
      properties:
        chat_jid:
          example: 554192421234@s.whatsapp.net
          type: string
        count:
          example: 50
          type: integer
        details:
          description: Identificador da mensagem de par que carregou o pedido. Serve para casar o evento que chegar depois.
          example: 3EB0A4B2AFD45E625C0917
          type: string
        oldest_msg_from_me:
          example: true
          type: boolean
        oldest_msg_id:
          example: 3EB0A4B2AFD45E625C0917
          type: string
        oldest_msg_timestamp:
          example: 1787747900
          format: int64
          type: integer
        timestamp:
          description: Sempre `0`. O caso de uso não preenche este campo (`session/request_history_sync.go:78-85`).
          example: 0
          format: int64
          type: integer
      type: object
    ResultadoTesteS3:
      description: |
        Resposta de `POST /session/s3/test`. `Bucket` e `Region` ecoam a
        configuração que foi TESTADA — é o que distingue "testei o que gravou" de
        "respondi 200".
      properties:
        Bucket:
          example: wa-api-media
          type: string
        Details:
          example: S3 connection test successful
          type: string
        Region:
          example: eu-west-1
          type: string
        connected:
          description: |
            Só aparece `true`: qualquer falha do teste sai como erro, não como
            `connected: false`.
          example: true
          type: boolean
      required:
        - connected
      type: object
    ResultadoVerificacaoNumero:
      description: |
        Uma entrada por número consultado, na ordem em que o servidor respondeu.
        `is_in_whatsapp: false` NÃO é erro — é a resposta à pergunta.
      properties:
        is_in_whatsapp:
          description: Se o número tem conta de WhatsApp.
          example: true
          type: boolean
        jid:
          description: JID resolvido do número. Vazio quando `is_in_whatsapp` é falso.
          example: 554192421234@s.whatsapp.net
          type: string
        query:
          description: O que foi pedido, ecoado tal e qual — permite casar a resposta com a entrada.
          example: "554192421234"
          type: string
        verified_name:
          description: |
            Nome verificado, quando a conta é uma conta comercial verificada.
            Vem vazio para contas pessoais — medido.
          example: ""
          type: string
      required:
        - query
        - is_in_whatsapp
        - jid
        - verified_name
      type: object
    ResumoDeConversa:
      description: |
        Uma conversa da lista. Os campos de nome são todos opcionais e podem vir
        ausentes ao mesmo tempo: medido nas contas reais, a maioria das pessoas
        sem nome simplesmente não está no roster, e para elas não há nome a
        obter. `phone` é o que sobra de legível nesses casos.
      properties:
        business_name:
          description: Nome comercial verificado, cru.
          example: Loja Exemplo
          type: string
        full_name:
          description: Nome do roster, cru.
          example: Lucas Albuquerque
          type: string
        is_group:
          example: false
          type: boolean
        jid:
          description: |
            Identidade da conversa como ela vive no histórico local. Para
            contactos pode ser `@lid` ou `@s.whatsapp.net`; para grupos é sempre
            `@g.us`. O valor reservado `status@broadcast` aparece aqui e
            representa os status vistos, não uma conversa.
          example: 90937376170214@lid
          type: string
        last_activity:
          description: |
            Instante da mensagem mais recente já persistida nesta conversa. É a
            chave de ordenação da lista.
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          type: string
        name:
          description: Melhor nome disponível. String vazia quando não há nenhum.
          example: Lucas Albuqueque
          type: string
        phone:
          description: |
            Número resolvido a partir do `@lid`, quando o mapeamento local o
            conhece. Só é preenchido para as conversas DA PÁGINA devolvida, e
            degrada em silêncio se a sessão estiver offline.
          example: "554192421234"
          type: string
        push_name:
          description: Nome que a pessoa escolheu no telemóvel, cru.
          example: Lucas Albuqueque
          type: string
      required:
        - jid
        - name
        - is_group
        - last_activity
      type: object
    Roster:
      additionalProperties:
        $ref: '#/components/schemas/ContactoDoRoster'
      description: |
        O roster inteiro, indexado por JID. **Nas contas com endereçamento LID as
        chaves vêm em `@lid`**, não em número — medido: numa conta com 461
        contactos, a totalidade das chaves devolvidas era `@lid`.
      type: object
    SaudeDetalhada:
      description: Contagens do processo, devolvidas por `GET /health`.
      properties:
        active_connections:
          description: Ligações WebSocket ao WhatsApp actualmente abertas.
          example: 2
          type: integer
        connected_users:
          description: Sessões com ligação estabelecida ao WhatsApp.
          example: 2
          type: integer
        goroutines:
          description: Goroutines em execução. Crescimento contínuo aqui costuma indicar fuga.
          example: 285
          type: integer
        logged_in_users:
          description: Sessões ligadas E autenticadas — as que conseguem operar.
          example: 2
          type: integer
        memory_stats:
          description: |
            Contadores do coletor de lixo do Go, em megabytes salvo `num_gc`.
            Medido na resposta real — a struct de domínio declara-o como mapa
            aberto, logo as chaves abaixo vêm do código que o preenche
            (`get_health.go:55-60`) e não do tipo.
          properties:
            alloc_mb:
              description: Memória de heap em uso neste instante.
              example: 7
              type: integer
            num_gc:
              description: Ciclos completos do coletor de lixo desde o arranque.
              example: 5
              type: integer
            sys_mb:
              description: Memória obtida do sistema operativo.
              example: 26
              type: integer
            total_alloc_mb:
              description: Total já alocado desde o arranque, cumulativo — nunca desce.
              example: 11
              type: integer
          type: object
        status:
          description: Estado global do processo.
          example: ok
          type: string
        timestamp:
          description: Instante em que o retrato foi tirado, em UTC.
          example: "2026-08-26T12:41:38Z"
          format: date-time
          type: string
        total_users:
          description: Sessões existentes no banco, ligadas ou não.
          example: 2
          type: integer
        uptime:
          description: Há quanto tempo o processo está de pé, em notação de duração do Go.
          example: 3h12m45s
          type: string
        version:
          description: Versão do binário (`pkg/bootstrap/bootstrap_server.go`).
          example: 1.0.6
          type: string
      type: object
    SecaoLista:
      description: Uma secção de `/chat/send/list`, com o seu título e as suas linhas.
      properties:
        rows:
          description: Linhas da secção. Secção que fica sem linhas válidas é descartada.
          items:
            $ref: '#/components/schemas/LinhaLista'
          type: array
        title:
          description: Título da secção.
          example: Pizzas
          type: string
      type: object
    SolicitacaoEntrada:
      description: |
        Um pedido de entrada pendente, devolvido por
        `GET /group/requestparticipants`.

        **A forma não foi observada com dados**: os dois grupos disponíveis não
        tinham pedidos pendentes, e as três chamadas medidas devolveram `[]`. Os
        campos abaixo vêm do tipo do protocolo
        (`internal/wa-noise/protocol/types/group.go:159-162`), que é serializado
        sem etiquetas `json`.
      properties:
        JID:
          description: Quem pediu para entrar.
          example: 554192421234@s.whatsapp.net
          type: string
        RequestedAt:
          description: Quando o pedido foi feito.
          example: "2026-08-26T08:42:47-04:00"
          format: date-time
          type: string
      type: object
    SubGrupoComunidade:
      description: |
        Um grupo ligado à comunidade. Os nomes de campo vêm em maiúscula inicial
        porque a estrutura é serializada tal como o vendor a define — não há
        etiquetas JSON a renomeá-la. Medido a 2026-08-26.
      properties:
        IsDefaultSubGroup:
          description: |
            `true` no grupo de avisos, que a comunidade cria sozinha e não pode ser
            desligado.
          example: true
          type: boolean
        JID:
          description: JID do sub-grupo.
          example: 120363411669320145@g.us
          type: string
        Name:
          description: Nome do sub-grupo.
          example: Avisos
          type: string
        NameSetAt:
          description: |
            Quando o nome foi definido. Vem com o deslocamento do fuso do
            SERVIDOR, não em UTC — medido `2026-08-26T08:08:21-04:00`.
          example: "2026-08-26T08:08:21-04:00"
          format: date-time
          type: string
        NameSetBy:
          description: Quem definiu o nome, em LID. Vazio quando o servidor não o informa — foi o caso na medição.
          example: ""
          type: string
        NameSetByPN:
          description: O mesmo, em PN. Igualmente vazio na medição.
          example: ""
          type: string
      type: object
    SubGruposComunidade:
      description: Resposta de `POST /community/subgroups`.
      properties:
        sub_groups:
          description: |
            Os grupos ligados à comunidade. Nunca vem vazia numa comunidade real: o
            grupo de avisos é criado com a comunidade e aparece sempre, marcado com
            `IsDefaultSubGroup: true` (F237, medido com a transição 1 → 2 → 1).
          items:
            $ref: '#/components/schemas/SubGrupoComunidade'
          type: array
      required:
        - sub_groups
      type: object
    SucessoMensagem:
      description: Confirmação de uma operação de estado de conversa.
      properties:
        message:
          example: Chat pinned
          type: string
        success:
          example: true
          type: boolean
      type: object
    UltimaAtividadePorConversa:
      additionalProperties:
        format: date-time
        type: string
      description: |
        Instante da mensagem mais recente de cada conversa, indexado por JID.
        Derivado do histórico local (o `HistorySync` que chega depois do
        pareamento), **não** de uma consulta ao WhatsApp.

        As chaves são normalizadas para o espaço LID quando o mapeamento é
        conhecido, para casarem com as chaves de `GET /user/contacts`. Um número
        sem LID conhecido mantém a chave em `@s.whatsapp.net`, e grupos aparecem
        em `@g.us`.
      example:
        554192421234@s.whatsapp.net: "2026-08-24T18:56:53.796034-04:00"
        100429404864623@lid: "2026-08-24T18:56:53.836029-04:00"
      type: object
    UtilizadorAdmin:
      description: |
        Uma sessão do wa-api, como as rotas `/admin/users` a devolvem.

        **`token` só traz valor na resposta de `POST /admin/users`.** Na listagem
        e na consulta por identificador vem sempre `""`, deliberadamente: devolver
        o token de todas as sessões transformava uma leitura na fuga de todas as
        credenciais da instalação.
      properties:
        connected:
          description: Se o transporte para o WhatsApp está de pé neste instante.
          example: true
          type: boolean
        events:
          description: |
            Eventos subscritos, separados por vírgulas. `All` recebe todos.
            **Ausente quando a sessão não tem nenhum** — medido a 2026-08-26.
          example: Message,Receipt,Connected
          type: string
        expiration:
          description: Instante de expiração da sessão, em segundos desde a época Unix. Ausente quando não expira.
          format: int64
          type: integer
        hmac_configured:
          description: |
            Se a sessão nasceu com chave HMAC. Só aparece na resposta de criação, e
            só quando `true`.
          example: true
          type: boolean
        id:
          description: Identificador da sessão, hexadecimal de 32 caracteres. É o `{id}` das rotas `/admin/users/{id}`.
          example: 918e37366f27e1125ee0482a793267e1
          type: string
        jid:
          description: |
            JID da conta de WhatsApp emparelhada, com o sufixo do aparelho
            (`:25`). Ausente enquanto a sessão não estiver emparelhada.
          example: 5516981818244:25@s.whatsapp.net
          type: string
        loggedIn:
          description: |
            Se a sessão está autenticada. Distinto de `connected`: pode haver
            credencial válida com o transporte caído.
          example: true
          type: boolean
        name:
          description: Nome dado à sessão na criação. Não é o nome da conta de WhatsApp.
          example: filarapida
          type: string
        proxy_config:
          description: |
            Proxy de saída desta sessão. **Repare na assimetria de nomes**: aqui a
            chave é `proxy_config` em snake_case, mas o corpo de escrita usa
            `proxyConfig` em camelCase — os dois são aceites na escrita.
          properties:
            enabled:
              description: Derivado de haver ou não um `proxyUrl` gravado.
              example: false
              type: boolean
            proxyUrl:
              description: URL do proxy. Vazio quando não há.
              example: ""
              type: string
            webhookUseProxy:
              description: Se a entrega dos webhooks também sai por este proxy.
              example: true
              type: boolean
          type: object
        qrcode:
          description: QR code pendente de leitura, quando o emparelhamento está a decorrer. Ausente fora disso.
          type: string
        s3_config:
          description: |
            Armazenamento em S3 desta sessão. `access_key` vem **sempre** como
            `***`, mesmo quando não há chave, e `secret_key` não aparece de todo.
            Mesma assimetria de nomes do proxy: `s3_config` na resposta,
            `s3Config` no corpo de escrita.
          properties:
            access_key:
              description: Sempre `***`. Mascarada por presença revelaria a presença.
              example: '***'
              type: string
            bucket:
              example: ""
              type: string
            enabled:
              example: false
              type: boolean
            endpoint:
              example: ""
              type: string
            media_delivery:
              description: Como a mídia recebida é entregue.
              enum:
                - base64
                - s3
                - both
              example: base64
              type: string
            path_style:
              example: true
              type: boolean
            public_url:
              example: ""
              type: string
            region:
              example: ""
              type: string
            retention_days:
              example: 30
              type: integer
          type: object
        token:
          description: |
            Token de sessão. **Só vem preenchido na criação**; nas leituras é
            sempre `""`.
          example: ""
          type: string
        webhook:
          description: URL do webhook desta sessão. Vazio quando não há nenhum.
          example: ""
          type: string
      type: object
    VistaConfigHmac:
      description: |
        Resposta de `GET /session/hmac/config`. MEDIDA no servidor vivo em
        2026-08-26.

        O que sai é a PRESENÇA da chave, nunca a chave: devolvê-la, mesmo cifrada,
        entregaria o material que a assinatura existe para proteger.
      properties:
        hmac_key:
          description: '`""` quando não há chave gravada; `***` quando há.'
          enum:
            - ""
            - '***'
          example: ""
          type: string
      required:
        - hmac_key
      type: object
    VistaConfigS3:
      description: |
        Resposta de `GET /session/s3/config`. MEDIDA no servidor vivo em
        2026-08-26.

        **O segredo não tem por onde sair**: a leitura nem seleciona a coluna
        `s3_secret_key`. A access key vem mascarada INCONDICIONALMENTE, mesmo
        quando não há nenhuma configurada — mascarar só por presença revelaria a
        presença.

        Uma sessão sem configuração nenhuma responde `200` com a configuração
        limpa (`enabled: false`, `path_style: true`, `media_delivery: base64`), e
        não um erro: assim o chamador distingue "nada configurado" de "a leitura
        falhou".
      properties:
        access_key:
          description: Sempre a constante `***`. Nunca o valor.
          example: '***'
          type: string
        bucket:
          example: ""
          type: string
        enabled:
          example: false
          type: boolean
        endpoint:
          example: ""
          type: string
        media_delivery:
          enum:
            - base64
            - s3
            - both
          example: base64
          type: string
        path_style:
          example: true
          type: boolean
        public_url:
          example: ""
          type: string
        region:
          example: ""
          type: string
        retention_days:
          example: 30
          type: integer
      type: object
  securitySchemes:
    TokenAdmin:
      description: |
        Token de administração do wa-api, para as rotas `/admin`. É **regerado
        a cada arranque do processo** e fica em `<datadir>/admin_token`.
        Enviado tal e qual, sem o prefixo `Bearer`.
      in: header
      name: Authorization
      type: apiKey
    TokenSessao:
      description: |
        Token da sessão de WhatsApp. Identifica de que conta parte a operação.
        É criado em `POST /admin/users` e não é recuperável depois — se se
        perder, cria-se outra sessão.

        Por compatibilidade, também é aceite como `?token=` na query string,
        mas cada uso emite aviso no log e essa forma será removida.
      in: header
      name: token
      type: apiKey
info:
  description: |
    API HTTP que expõe uma conta de WhatsApp como serviço: enviar e receber
    mensagens, gerir grupos, comunidades e canais, consultar contactos e
    administrar sessões.

    ## Como se autentica

    Quase todas as rotas usam um **token de sessão**, enviado no cabeçalho
    `token`. Cada token identifica uma sessão de WhatsApp já emparelhada — é
    ele que diz *de que conta* a operação parte.

    As rotas sob `/admin` usam outro segredo: o **token de administração**, no
    cabeçalho `Authorization`. Ele governa as sessões (criar, listar, apagar) e
    não pertence a nenhuma conta de WhatsApp. É regerado a cada arranque e fica
    em `<datadir>/admin_token`.

    Três rotas de sonda não pedem credencial nenhuma: `/livez`,
    `/health/live` e `/health/ready`.

    Use o botão **Authorize** aqui em cima para preencher os dois.

    ## O envelope das respostas

    Sucesso e erro têm forma fixa:

    ```json
    { "code": 200, "data": { }, "success": true }
    ```

    ```json
    { "code": 400, "error": { "code": "missing_chat", "message": "missing chat in payload" }, "success": false }
    ```

    `error.code` é estável e legível por máquina; `error.message` é para
    mostrar a uma pessoa.

    **Ressalva medida**: catorze pontos do código ainda respondem com
    `"error"` em texto simples em vez do objecto — as recusas de campo
    obrigatório das rotas de grupo, sobretudo. Está registado como F266 no
    `HOUSEKEEP.md`, e a documentação de cada rota afectada diz.

    ## O campo `chat`

    Toda rota que recebe um destinatário aceita `"chat"` como nome universal do
    campo. O nome antigo e específico da rota (`Phone`, `groupJID`, `jid`…)
    continua a funcionar e **ganha** quando os dois vierem no mesmo pedido.

    ## Identificadores

    - **PN** — o número, em `554192421234@s.whatsapp.net`
    - **LID** — o identificador opaco, em `90937376170214@lid`
    - **grupo** — `120363411669320145@g.us`
    - **canal** — `120363411025775186@newsletter`

    Onde a distinção importa, a descrição da rota diz qual das formas é exigida.

    ## O que `200` significa, e o que não significa

    Um `200` diz que o WhatsApp aceitou o pedido. **Não** diz que a mensagem
    foi desenhada no ecrã do destinatário, nem que a operação teve efeito
    visível. As rotas em que essa diferença já foi medida trazem a ressalva na
    descrição.
  title: wa-api — API HTTP para WhatsApp
  version: 1.0.6
openapi: 3.0.3
paths:
  /admin/users:
    get:
      description: |
        Devolve **todas** as sessões do wa-api, com o estado de ligação de cada
        uma, a configuração de proxy e de S3, e a subscrição de eventos.

        **O `token` vem SEMPRE vazio**, e é de propósito: esta listagem devolvia
        o token em claro de todas as sessões da instalação, o que transformava
        uma leitura numa fuga de todas as credenciais. O token só existe uma vez,
        na resposta de `POST /admin/users`, e não é recuperável depois. Perdido o
        token, cria-se outra sessão.

        **Quando usar**: em painéis de operação, para saber que sessões existem e
        quais estão ligadas e autenticadas.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        enviado tal e qual, sem o prefixo `Bearer`. Ele é **regerado a cada
        arranque do processo** e fica em `<datadir>/admin_token` — um token
        guardado de uma execução anterior responde `401`.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - connected: true
                    id: 918e37366f27e1125ee0482a793267e1
                    jid: 5516981818244:25@s.whatsapp.net
                    loggedIn: true
                    name: filarapida
                    proxy_config:
                      enabled: false
                      proxyUrl: ""
                      webhookUseProxy: true
                    s3_config:
                      access_key: '***'
                      bucket: ""
                      enabled: false
                      endpoint: ""
                      media_delivery: base64
                      path_style: true
                      public_url: ""
                      region: ""
                      retention_days: 30
                    token: ""
                    webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/UtilizadorAdmin'
                        type: array
                    type: object
          description: Lista de sessões. Vazia se não houver nenhuma.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Listar as sessões existentes
      tags:
        - Administração
    post:
      description: |
        Cria uma sessão do wa-api e **é onde nasce o token de sessão**. Todas as
        outras rotas da API usam esse token no cabeçalho `token`.

        **Guarde o token no momento da resposta.** Ele é devolvido UMA vez e não
        é recuperável depois: `GET /admin/users` devolve `token: ""` para todas
        as sessões, deliberadamente. Se o token se perder, a única saída é apagar
        a sessão e criar outra.

        Criar a sessão **não** a emparelha com o WhatsApp: isso é
        `GET /session/connect` seguido da leitura do QR code.

        **Regras** (lidas em `add_user.go`):

        - `name` e `token` são **obrigatórios**; a falta de qualquer um deles dá
          `400 missing_name_or_token`.
        - `token` tem de ser único na instalação. Repetido, dá `409` — a resposta
          é o envelope antigo, com `error` em texto simples (`"conflict"`).
        - `events` é uma lista separada por vírgulas, e cada nome é validado:
          um nome desconhecido dá `400 invalid_event_type`, indicando qual.
          `All` recebe todos os eventos.
        - `hmacKey`, quando presente, tem de ter pelo menos **32 caracteres**
          (`400 hmac_key_too_short`). É guardada cifrada e nunca mais sai.
        - `s3Config`/`proxyConfig` são aceites também em `snake_case`
          (`s3_config`, `proxy_config`); o camelCase vence quando ambos vierem.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`. É regerado a cada arranque e fica em
        `<datadir>/admin_token`.
      requestBody:
        content:
          application/json:
            example:
              events: Message,Receipt,Connected
              history: 100
              name: filarapida
              proxyConfig:
                enabled: false
                proxyUrl: ""
              s3Config:
                enabled: false
                mediaDelivery: base64
                retentionDays: 30
              token: tok_fila
            schema:
              $ref: '#/components/schemas/PedidoCriarUtilizador'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  connected: false
                  events: Message,Receipt,Connected
                  id: 918e37366f27e1125ee0482a793267e1
                  name: filarapida
                  proxy_config:
                    enabled: false
                    proxyUrl: ""
                    webhookUseProxy: true
                  s3_config:
                    access_key: '***'
                    bucket: ""
                    enabled: false
                    endpoint: ""
                    media_delivery: base64
                    path_style: false
                    public_url: ""
                    region: ""
                    retention_days: 30
                  token: tok_fila
                  webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UtilizadorAdmin'
                    type: object
          description: |
            Sessão criada. **Esta é a única resposta em que `token` traz o valor
            real** — copie-o antes de fechar a chamada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_name_or_token
                  message: name and token are required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Campo obrigatório em falta, evento desconhecido, ou chave HMAC curta
            demais.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error: conflict
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            Já existe sessão com este `token`. **Devolve o envelope ANTIGO**, com
            `error` em texto simples e não o objecto `{code, message}` — este erro
            não passa pela taxonomia `apperr` (F266).
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Criar uma sessão
      tags:
        - Administração
  /admin/users/{id}:
    delete:
      description: |
        Apaga a **linha da sessão no banco** e nada mais.

        **A diferença face a `DELETE /admin/users/{id}/full`**, lida em
        `delete_user.go` e `delete_user_complete.go`:

        | | esta rota | `/full` |
        |---|---|---|
        | linha em `users` | apaga | apaga |
        | termina a ligação ao WhatsApp | **não** | faz `logout` e `disconnect` antes |
        | ficheiros em `<datadir>/files/<id>` | **deixa** | apaga a pasta inteira |
        | objectos no S3 | não apaga | **também não apaga** — ver abaixo |
        | corpo da resposta | `{"status": "deleted"}` | `{id, name, jid}` |

        Ou seja: esta rota deixa para trás a sessão viva na memória do processo e
        a mídia em disco. Use `/full` quando a intenção for remover o
        utilizador por completo.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  status: deleted
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          status:
                            enum:
                              - deleted
                            example: deleted
                            type: string
                        type: object
                    type: object
          description: Registo apagado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_id
                  message: user ID is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Identificador em falta no caminho.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Apagar o registo de uma sessão
      tags:
        - Administração
    get:
      description: |
        O mesmo manipulador da listagem, filtrado por `id`. Por isso **devolve um
        ARRAY**, e não um objecto — com um elemento quando a sessão existe.

        **Sessão inexistente responde `200` com `data: null`, e não `404`.**
        Medido a 2026-08-26 contra
        `/admin/users/00000000000000000000000000000000`. Um cliente que espere
        `404` para "não existe" não o vai receber aqui; teste `data`.

        Tal como na listagem, `token` vem sempre vazio.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - connected: true
                    id: 918e37366f27e1125ee0482a793267e1
                    jid: 5516981818244:25@s.whatsapp.net
                    loggedIn: true
                    name: filarapida
                    proxy_config:
                      enabled: false
                      proxyUrl: ""
                      webhookUseProxy: true
                    s3_config:
                      access_key: '***'
                      bucket: ""
                      enabled: false
                      endpoint: ""
                      media_delivery: base64
                      path_style: true
                      public_url: ""
                      region: ""
                      retention_days: 30
                    token: ""
                    webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/UtilizadorAdmin'
                        nullable: true
                        type: array
                    type: object
          description: |
            Array com a sessão pedida, ou `null` quando o identificador não
            corresponde a nenhuma.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Consultar uma sessão pelo identificador
      tags:
        - Administração
    put:
      description: |
        Altera **apenas os campos enviados**. O que não vier no corpo fica como
        está.

        **Como se apaga um valor, e por que nem sempre dá**: para os campos de
        texto e para `expiration`, o vazio significa *"não informado"*, não
        *"limpe"* — `{"token": ""}` não apaga o token, é um pedido sem campos.
        A excepção é `history`, que é ponteiro: `{"history": 0}` **desactiva** a
        gravação de mensagens, e é distinguível de não mencionar o campo.

        **Um pedido sem nenhum campo útil** (`{}` ou só campos vazios) responde
        `400 no_fields_to_update`, e não `500`.

        **`s3Config` e `proxyConfig` são aceites também em `snake_case`**
        (`s3_config`, `proxy_config`) porque a resposta de leitura usa
        snake_case, e o ciclo natural — ler, alterar um campo, reenviar — chegava
        com o nome da resposta e era **ignorado em silêncio com `200`**. O
        camelCase vence quando os dois nomes vierem no mesmo corpo.

        Uma alteração de `proxyConfig` com `enabled: false` limpa o `proxy_url`
        gravado.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        content:
          application/json:
            example:
              events: Message,Receipt
              history: 0
              name: filarapida
            schema:
              $ref: '#/components/schemas/PedidoEditarUtilizador'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  status: ok
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          status:
                            enum:
                              - ok
                            example: ok
                            type: string
                        type: object
                    type: object
          description: |
            Alteração gravada. O corpo é apenas uma confirmação — não devolve a
            sessão actualizada. Para a ver, chame `GET /admin/users/{id}`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: no_fields_to_update
                  message: request has no field to update
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Pedido sem campo nenhum a mudar (`no_fields_to_update`), evento
            desconhecido (`invalid_event_type`), ou corpo ilegível.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "409":
          content:
            application/json:
              example:
                code: 409
                error: conflict
                success: false
              schema:
                $ref: '#/components/schemas/ErroTextoSimples'
          description: |
            O `token` pedido já pertence a outra sessão. Envelope ANTIGO, com
            `error` em texto simples (F266).
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Alterar uma sessão
      tags:
        - Administração
  /admin/users/{id}/full:
    delete:
      description: |
        A remoção completa. Pela ordem em que acontece
        (`delete_user_complete.go`):

        1. confirma que a sessão existe — se não, `404 user_not_found`;
        2. se estiver ligada, faz **`logout` e `disconnect`** do WhatsApp,
           desemparelhando o aparelho;
        3. apaga a linha em `users`;
        4. apaga do disco a pasta `<datadir>/files/<id>`, com a mídia e o
           histórico gravados.

        **O que ela NÃO faz, apesar do nome**: os objectos guardados no S3
        **não são apagados**. O código regista *"S3 deletion needed - to be
        handled by handler"* e nenhuma camada seguinte o faz. Se a sessão usava
        S3, a limpeza do bucket é sua.

        As falhas dos passos 2 e 4 são **toleradas**: um erro a desligar ou a
        apagar ficheiros fica no log e a operação continua, porque a linha do
        banco já é a fonte de verdade. Um `200` aqui garante que a linha saiu,
        não que o disco ficou limpo.

        **Irreversível**, e mais destrutivo que `DELETE /admin/users/{id}`, que
        só apaga a linha.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  id: 918e37366f27e1125ee0482a793267e1
                  jid: 5516981818244:25@s.whatsapp.net
                  name: filarapida
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DadosUtilizadorApagado'
                    type: object
          description: |
            Sessão removida. O corpo traz a identificação de quem foi apagado,
            para o registo de auditoria de quem chamou.

            Repare que o use case constrói também um `details` e um `success`
            próprios que **não chegam ao fio**: o manipulador entrega apenas o
            `data` ao envelope comum.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_id
                  message: missing ID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Identificador em falta no caminho.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: Apagar uma sessão por completo, com ficheiros e ligação
      tags:
        - Administração
  /call/reject:
    post:
      description: |
        Recusa uma chamada de voz ou vídeo que está a tocar.

        **Depende de um evento, e sem ele a rota é inutilizável.** Os dois campos
        obrigatórios — `call_from` e `call_id` — **não são inventáveis**: o
        `call_id` é gerado pelo WhatsApp e só chega à sua aplicação no evento
        `CallOffer`, entregue pelo webhook ou pelo WebSocket da sessão. Portanto o
        uso real é: subscrever `CallOffer` (ou `All`) em `POST /webhook`, e
        chamar esta rota **de dentro do manipulador desse evento**, com os valores
        que ele traz. Fora dessa janela, a chamada já terminou e a recusa não tem
        alvo.

        `call_from` é o JID de quem liga, e aceita telefone nu, JID de telefone ou
        LID — a resolução é feita aqui.

        **Regras** (lidas em `reject_call.go`), pela ordem em que recusam:

        1. sem sessão de WhatsApp para este token: `400 no_session`;
        2. `call_from` em falta: `400 missing_call_from`;
        3. `call_id` em falta: `400 missing_call_id`;
        4. `call_from` que não resolve para um JID: `400 invalid_call_from`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              call_from: 554192421234@s.whatsapp.net
              call_id: 3EB0A4B2AFD45E625C0917
            schema:
              $ref: '#/components/schemas/PedidoRecusarChamada'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  CallID: 3EB0A4B2AFD45E625C0917
                  Details: Call rejected
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoRecusarChamada'
                    type: object
          description: |
            A recusa foi aceite pelo WhatsApp. O `CallID` ecoa o identificador
            recusado, para casar com o evento de origem.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_call_id
                  message: missing call_id in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Sem sessão (`no_session`), `call_from` ou `call_id` em falta
            (`missing_call_from`, `missing_call_id`), `call_from` que não resolve
            (`invalid_call_from`), ou corpo ilegível.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Recusar uma chamada a entrar
      tags:
        - Integrações e configuração
  /chat/archive:
    post:
      description: |
        Move a conversa para a lista de arquivadas, ou tira-a de lá.

        **Quando usar**: para tirar da lista principal uma conversa que não
        precisa de atenção, sem a apagar.

        **Efeito colateral herdado, e não controlado por nós**: arquivar
        também DESAFIXA a conversa. Quem fixa e depois arquiva fica com uma
        conversa desafixada, e nada nesta API o reporta.

        **Regras**: o destino vai em `jid`; `chat` é aceite como nome
        universal e só vale quando `jid` faltar. Ausentes os dois, é
        `400 missing_jid` (medido). A operação é uma escrita de app-state, logo
        pode devolver `409 app_state_conflict` quando o estado local está
        dessincronizado do servidor.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              archive: true
              jid: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoArquivarConversa'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message: Chat archived
                  success: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SucessoMensagem'
                    type: object
          description: O patch de app-state foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: missing jid in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `jid` e `chat`
            ausentes (`missing_jid`), JID mal formado (`invalid_chat_jid`) ou
            sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: app_state_conflict
                  message: 'app state conflict: the local state is out of sync with the server'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O WhatsApp recusou o patch de app-state por conflito: a nossa cópia
            do estado está dessincronizada da dele. Repetir depois de uma
            sincronização pode funcionar.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Arquivar ou desarquivar uma conversa
      tags:
        - Conversas
  /chat/delete/message:
    post:
      description: |
        Revoga uma mensagem própria: ela desaparece para todos os
        participantes, substituída pelo aviso do cliente.

        **Quando usar**: para retirar uma mensagem enviada por engano. Só faz
        sentido para mensagens próprias — revogar a mensagem de outra pessoa
        não é uma operação que o WhatsApp permita a um participante comum.

        **Regras**:

        - `Phone` (ou o alias `chat`) e `Id` são obrigatórios; faltar `Id` é
          `400 missing_id`, medido.
        - `message_id` na resposta é o da mensagem APAGADA, e não o da mensagem
          de revogação que o envio criou — é o que responde à pergunta do
          cliente.
        - Um `Id` inexistente NÃO é recusado: o WhatsApp aceita a revogação de
          um id que não conhece e nada acontece do outro lado.

        **Nota de nomes**: esta rota é a canónica. `POST /chat/delete` existiu
        como alias e foi REMOVIDA — apesar do nome, nunca apagou conversa
        nenhuma.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              Id: 3EB0A4B2AFD45E625C0917
              Phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoApagarMensagem'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: deleted
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoApagarMensagem'
                    type: object
          description: A revogação foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_id
                  message: missing Id in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `Phone` e `chat`
            ausentes (`missing_phone`), `Id` ausente (`missing_id`), destino
            mal formado (`invalid_phone`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Apagar para todos uma mensagem enviada
      tags:
        - Conversas
  /chat/downloadaudio:
    post:
      description: |
        Baixa da CDN do WhatsApp o conteúdo de uma `audioMessage`, decifra-o e
        devolve-o como Data URL. Serve tanto para áudio anexado como para
        mensagem de voz.

        O corpo é o DESCRITOR da mídia, tirado do `data_json` de
        `GET /chat/history` sob `Message.audioMessage`.

        **Quando usar**: para transcrever, arquivar ou reproduzir fora do
        WhatsApp um áudio recebido.

        **Regras**: pelo menos um entre `Url` e `DirectPath`; faltarem os dois
        é `400 missing_url_or_direct_path`. O `Mimetype` medido em campo para
        mensagem de voz é `audio/mp4`, e é devolvido tal e qual.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              DirectPath: /o1/v/t24/f2/m234/exemplo
              FileEncSHA256: ZXhlbXBsb0ZpbGVFbmNTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDA=
              FileLength: 14130
              FileSHA256: ZXhlbXBsb0ZpbGVTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDAwMDA=
              MediaKey: SlpkRE1hd3FWcDFaZXhlbXBsb01lZGlhS2V5MDAwMDA=
              Mimetype: audio/mp4
              Url: https://mmg.whatsapp.net/o1/v/t24/f2/m234/exemplo
            schema:
              $ref: '#/components/schemas/PedidoDescargaDeMidia'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  Data: data:audio/mp4;base64,AAAAIGZ0eXBNNEEgAAACAGlzb21pc28yTTRBIG1wNDE=
                  Mimetype: audio/mp4
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoDescargaDeMidia'
                    type: object
          description: O áudio, decifrado e em Data URL.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_url_or_direct_path
                  message: missing Url and DirectPath in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `Url` e `DirectPath`
            ausentes (`missing_url_or_direct_path`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: media_unavailable
                  message: media is no longer available; it may have expired on the WhatsApp CDN
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: A mídia já não está disponível na CDN do WhatsApp.
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: media_download_failed
                  message: failed to download media
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falha na descarga ou na decifragem (`media_download_failed`), ou
            conteúdo de zero bytes (`empty_media`).
      security:
        - TokenSessao: []
      summary: Descarregar o áudio de uma mensagem recebida
      tags:
        - Descarga de mídia
  /chat/downloaddocument:
    post:
      description: |
        Baixa da CDN do WhatsApp o conteúdo de uma `documentMessage`,
        decifra-o e devolve-o como Data URL.

        O corpo é o DESCRITOR da mídia, tirado do `data_json` de
        `GET /chat/history` sob `Message.documentMessage`.

        **Quando usar**: para guardar em disco ou processar um ficheiro que
        chegou por conversa.

        **Regras**: pelo menos um entre `Url` e `DirectPath`. O nome original
        do ficheiro NÃO vem nesta resposta — está no `data_json` da mensagem
