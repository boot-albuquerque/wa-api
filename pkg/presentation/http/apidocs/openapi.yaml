              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            Mensagem interativa aceite pelo WhatsApp. **Não garante que todos os
            botões enviados chegaram** — os inválidos foram descartados em
            silêncio, e a resposta não os enumera.
        "400":
          content:
            application/json:
              examples:
                invalid_phone:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_phone
                      message: could not parse Phone
                    success: false
                missing_buttons_fields:
                  summary: Falta `phone`, o corpo, ou a lista de botões — recusa única para os três
                  value:
                    code: 400
                    error:
                      code: missing_buttons_fields
                      message: missing Phone, Body or Buttons
                    success: false
                no_valid_buttons:
                  summary: Todos os botões descartados — medido em 2026-08-26 com `display_text` e com `quickreply`
                  value:
                    code: 400
                    error:
                      code: no_valid_buttons
                      message: 'no valid buttons parsed, accepted types: reply, cta_url, cta_call, copy'
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
