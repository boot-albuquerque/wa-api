                        - count: 3
                          emoji: "\U0001F44D"
                      server_id: 4379
                      text: Bom dia a todos
                      timestamp: "2026-08-25T23:22:23Z"
                      type: media
                      view_count: 0
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MensagensCanal'
                    type: object
          description: |
            Mensagens do canal, ou `messages: []` quando ele não tem nenhuma.
            Ordenadas por `server_id` crescente dentro da janela pedida.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: jid do canal é obrigatório
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Falta o `jid`, ou o corpo não é JSON válido.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
