  /users/privacy:
    get:
      description: |
        > **Substitui `GET /user/privacy`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Devolve as definições de privacidade em vigor na conta ligada.

        **Quando usar**: para saber quem vê o último acesso, a foto e os status
        antes de contar com uma dessas coisas. A privacidade de status, em
        particular, é o que decide para quem uma publicação em
        `POST /status/set/*` pode ir.

        **A ressalva que apanha quem escreve um cliente**: leitura e escrita
        usam **vocabulários diferentes, e continuam a usar**. Aqui as chaves são
        `snake_case` (`group_add`, `last_seen`, `read_receipts`…); o `POST` neste
        mesmo caminho recebe o nome em minúsculas SEM separador (`groupadd`,
        `last`, `readreceipts`…). A assimetria é do WhatsApp — os nomes de
        escrita são os do protocolo —, não uma escolha nossa, e a migração de DTO
        de 2026-08-27 não a resolveu: só alinhou a LEITURA com o resto do
        contrato, que até aí devolvia `PascalCase` (`GroupAdd`, `LastSeen`).

        E a leitura devolve TRÊS chaves que a escrita não conhece — `messages`,
        `defense` e `stickers` não constam da tabela de validação
        (`pkg/domain/privacy.go`), logo não são definíveis por esta API.

        **Autenticação**: token de sessão.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  call_add: all
                  defense: "off"
                  group_add: all
                  last_seen: contacts
                  messages: all
                  online: all
                  profile: all
                  read_receipts: all
                  status: contacts
                  stickers: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: As definições em vigor. O exemplo é uma resposta medida.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Ler as definições de privacidade da conta
      tags:
        - Contactos e utilizadores
    post:
      description: |
        > **Substitui `POST /user/privacy`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Altera UMA definição de privacidade da conta ligada. O caminho é o mesmo
        da leitura, e o manipulador despacha por método
        (`pkg/bootstrap/wiring_routes.go:209-215`).

        **Quando usar**: com cuidado — isto muda a conta real, e o efeito é
        visível para terceiros.

        **Regras**: `privacy_setting` vai em MINÚSCULAS e é uma das sete que a
        tabela do domínio conhece: `groupadd`, `last`, `status`, `profile`,
        `readreceipts`, `online`, `calladd`. Não são as chaves que o `GET`
        devolve.

        O conjunto de valores válidos **depende da definição**, e é por isso que
        um valor correto noutro sítio pode ser recusado aqui: `contacts` vale
        para `status` e é recusado em `readreceipts`, que só aceita `all` e
        `none`. A comparação é sensível a maiúsculas — `ALL` é recusado.

        **Quatro recusas distintas**, medidas a 2026-08-26 — quem chama precisa
        de saber qual das quatro errou, e cada uma tem correcção diferente:

        | o que enviou | código |
        |---|---|
        | sem `privacy_setting`, ou `null`, ou `""` | `400 missing_privacy_setting` |
        | sem `value`, ou `null`, ou `""` | `400 missing_privacy_value` |
        | nome fora das sete | `400 invalid_privacy_setting`, com o nome recebido |
        | valor fora do conjunto DAQUELA definição | `400 invalid_privacy_value`, com valor e definição |

        O nome é verificado antes do valor: `{"privacy_setting":"xpto","value":""}`
        revela o nome inválido, não o valor em falta.

        A validação corre antes de qualquer chamada ao WhatsApp, logo nenhuma
        destas quatro altera a conta.

        **Resposta**: devolve as definições resultantes, com a mesma forma do
        `GET`. **Não medida** — a rota altera a conta e não foi chamada com um
        pedido válido. As quatro recusas acima foram medidas, porque nenhuma
        chega a alterar coisa nenhuma.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              privacy_setting: status
              value: contacts
            schema:
              $ref: '#/components/schemas/PedidoDefinicaoPrivacidade'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  call_add: all
                  defense: "off"
                  group_add: all
                  last_seen: contacts
                  messages: all
                  online: all
                  profile: all
                  read_receipts: all
                  status: contacts
                  stickers: contacts
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DefinicoesPrivacidade'
                    type: object
          description: |
            Definição alterada; devolve as definições resultantes. A forma vem
            do caso de uso, que propaga o que o WhatsApp devolve — **não foi
            observada em campo**, porque a rota altera a conta.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_privacy_value
                  message: invalid value "contacts" for privacy setting "readreceipts"
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Nome desconhecido (`invalid_privacy_setting`), valor fora do
            conjunto daquele nome (`invalid_privacy_value`), corpo ilegível
            (`could_not_decode_payload`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ⬜ Alterar uma definição de privacidade
      tags:
        - Contactos e utilizadores
