                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: Imagem subida e mensagem aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              examples:
                empty_image_body:
                  summary: Zero bytes depois de obtidos
                  value:
                    code: 400
                    error:
                      code: empty_image_body
                      message: image body is empty
                    success: false
                image_fetch_failed:
                  summary: A URL não pôde ser buscada
                  value:
                    code: 400
                    error:
                      code: image_fetch_failed
                      message: failed to fetch image from url
                    success: false
                image_too_large:
                  summary: Acima de 16 MB
                  value:
                    code: 400
                    error:
                      code: image_too_large
                      message: image payload exceeds size limit
                    success: false
                invalid_data_uri:
                  summary: A URI de dados não decodifica
                  value:
                    code: 400
                    error:
                      code: invalid_data_uri
                      message: could not decode data URI
                    success: false
                invalid_image_mime_type:
                  summary: O tipo resolvido não é de imagem
                  value:
                    code: 400
                    error:
                      code: invalid_image_mime_type
                      message: resolved MIME type is not an image type
                    success: false
                missing_image:
                  summary: Campo `Image` vazio
                  value:
                    code: 400
                    error:
                      code: missing_image
                      message: missing Image in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                unsupported_image_source:
                  summary: Nem URI de dados `data:image`, nem URL http(s)
                  value:
