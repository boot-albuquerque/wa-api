  /chats/send/forward:
    post:
      description: |
        > **Substitui `POST /chat/send/forward`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Encaminha uma mensagem, marcada como encaminhada no cliente. A rota tem
        **duas formas**, e é a presença de `message_id` que escolhe qual delas
        corre.

        **Por chave** (`phone` + `message_id`): a mensagem guardada é procurada no
        histórico e reenviada tal e qual — **incluindo mídia, sem novo upload**. O
        `forwarding_score` do payload é IGNORADO: o valor é lido do contexto da
        mensagem original e incrementado em 1, como o Baileys faz. `chat_jid` é
        opcional e hoje não entra na busca; está reservado para desambiguação
        futura.

        **Por conteúdo** (`phone` + `body`): a API cria uma mensagem de texto NOVA
        marcada como encaminhada. O `forwarding_score` do payload é respeitado
        apenas quando é MAIOR que zero; ausente, `null` e `0` caem todos no
        padrão `1`, logo **não há maneira de pedir score `0`** por esta rota.

        **Regras**:
        - Sem `message_id`, `body` passa a ser obrigatório — vazio é
          `400 missing_body`.
        - Com `message_id`, `body` é ignorado.
        - A forma por chave depende do histórico de mensagens, que **não vem
          ligado por omissão**: com `history = 0` nada é gravado, e a busca
          devolve `404 message_not_found`. Ligue com
          `POST /session/history {"history": 100}` antes de contar com isto
          (HOUSEKEEP F227/F230).

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            examples:
              por_chave:
                summary: Por chave de mensagem — reenvia a mensagem guardada, mídia incluída
                value:
                  chat_jid: 120363411669320145@g.us
                  message_id: 3EB0A4B2AFD45E625C0917
                  phone: 554192421234@s.whatsapp.net
              por_conteudo:
                summary: Por conteúdo — cria texto novo marcado como encaminhado
                value:
                  body: Bom dia! O seu pedido saiu para entrega.
                  forwarding_score: 1
                  phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoEncaminhamento'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: sent
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoEnvio'
                    type: object
          description: |
            Encaminhamento aceite pelo WhatsApp. `message_id` é o da mensagem NOVA
            na conversa de destino, e não o da original.
        "400":
          content:
            application/json:
              examples:
                invalid_phone:
                  summary: Destino não parseia como JID
                  value:
                    code: 400
                    error:
                      code: invalid_phone
                      message: could not parse Phone
                    success: false
                missing_body:
                  summary: Forma por conteúdo sem `body`
                  value:
                    code: 400
                    error:
                      code: missing_body
                      message: missing Body in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              examples:
                message_no_data:
                  summary: A linha existe, mas sem o conteúdo guardado
                  value:
                    code: 404
                    error:
                      code: message_no_data
                      message: stored message has no data
                    success: false
                message_not_found:
                  summary: Nenhuma linha no histórico para esse `message_id`
                  value:
                    code: 404
                    error:
                      code: message_not_found
                      message: message not found in history
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Forma por chave: não há mensagem com esse `message_id` no histórico
            desta sessão, ou ela existe sem o conteúdo guardado. A causa mais
            comum é o histórico estar desligado (`history = 0`, o padrão).
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Encaminhar uma mensagem
      tags:
        - Envio de mensagens
