      description: "> **Substitui `POST /newsletter/react`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.\n\nPõe — ou tira — uma reação numa publicação do canal.\n\n**Como se REMOVE a reação**: enviando `reaction` vazio. É por isso que\nesse campo não é obrigatório: exigi-lo tornaria impossível desfazer\n(`newsletter_ops.go:234`).\n\n**Regras**: `jid` e `server_id` são obrigatórios. `server_id` a zero é\nrecusado com `400 missing_server_id`. `data` traz `{\"status\": \"sent\"}` em sucesso.\n\n**CORRECÇÃO a 2026-08-26**: esta descrição dizia que \"o efeito não é\nconfirmável por esta API\". **É.** `POST /newsletters/messages` devolve\n`reactions` por publicação, e ele traz valores reais — o exemplo\npublicado nesta mesma documentação é `{'\U0001F44D': 3, '\U0001F602': 58}`. O efeito\nconfirma-se lendo o mesmo `server_id` **antes e depois**, e\nfechando com a REMOÇÃO (`reaction` vazio) para ver o contador voltar ao\nvalor inicial: sem esse terceiro passo, um incremento pode ser de outra\npessoa.\n\nDuas armadilhas ao comparar: `count` é obrigatório de facto nas\nleituras, e **as chaves de emoji não são normalizadas** (`\"❤\"` e `\"❤️\"`\nsão entradas separadas). Ver `OBSERVADORES-AMBAR.md` §5.\n\n**Autenticação**: token de sessão.\n"
      requestBody:
        content:
