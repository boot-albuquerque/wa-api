                  summary: A URL não pôde ser buscada
                  value:
                    code: 400
                    error:
                      code: image_fetch_failed
                      message: failed to fetch image from url
                    success: false
                image_too_large:
                  summary: Acima de 16 MB
                  value:
                    code: 400
                    error:
                      code: image_too_large
                      message: image payload exceeds size limit
                    success: false
                invalid_data_uri:
                  summary: A URI de dados não decodifica
                  value:
                    code: 400
                    error:
                      code: invalid_data_uri
                      message: could not decode data URI
                    success: false
                invalid_image_mime_type:
                  summary: O tipo resolvido não é de imagem
                  value:
                    code: 400
                    error:
                      code: invalid_image_mime_type
                      message: resolved MIME type is not an image type
                    success: false
                missing_image:
                  summary: Campo `Image` vazio
                  value:
                    code: 400
                    error:
                      code: missing_image
                      message: missing Image in payload
                    success: false
                missing_phone:
                  summary: Destino ausente em `Phone` e em `chat`
                  value:
                    code: 400
                    error:
                      code: missing_phone
                      message: missing Phone in payload
                    success: false
                unsupported_image_source:
                  summary: Nem URI de dados `data:image`, nem URL http(s)
                  value:
                    code: 400
                    error:
                      code: unsupported_image_source
                      message: Image data should start with "data:image/png;base64," or be an http(s) URL
                    success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Payload recusado antes de qualquer envio.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "422":
          $ref: '#/components/responses/RecusadoPeloWhatsApp'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: Enviar uma imagem
      tags:
