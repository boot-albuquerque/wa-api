# GERADO por "go run ./cmd/openapidoc" — NÃO EDITE À MÃO.
#
# As fontes são api/openapi/base.yaml (info, tags, segurança, componentes
# partilhados), api/openapi/paths/<grupo>.yaml (um por família de rotas) e
# api/openapi/schemas/<grupo>.yaml (esquemas próprios de cada família).
#
# O teste TestOpenAPIGeradoEstaAtualizado recusa este ficheiro se ele
# divergir das fontes.
components:
  parameters:
    IdNoCaminho:
      description: Identificador do recurso, em hexadecimal de 32 caracteres.
      in: path
      name: id
      required: true
      schema:
        example: 918e37366f27e1125ee0482a793267e1
        pattern: ^[0-9a-f]{32}$
        type: string
    JidNoCaminho:
      description: JID do utilizador, em forma PN ou LID.
      in: path
      name: jid
      required: true
      schema:
        example: 554192421234@s.whatsapp.net
        pattern: ^[0-9]+(:[0-9]+)?@(s\.whatsapp\.net|lid)$
        type: string
  responses:
    CorpoInvalido:
      content:
        application/json:
          example:
            code: 400
            error:
              code: could_not_decode_payload
              message: could not decode payload
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        O corpo não é JSON válido, ou um campo veio com o tipo errado — por
        exemplo `{"Body": 123}` onde se espera texto.

        Note que um campo com o NOME errado não cai aqui: é ignorado (e
        registado). Ver "Campos que a API não conhece".
    ErroInterno:
      content:
        application/json:
          example:
            code: 500
            error:
              code: internal_error
              message: Ocorreu um erro interno.
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        Falha não classificada, ou tempo esgotado à espera do WhatsApp (o
        limite por pedido é de 30 segundos).

        **`error` vem em TEXTO, não em objecto.** Não há `error.code` num `500`
        genérico: um erro que não passou pela taxonomia `apperr` nunca tem o
        seu texto próprio serializado — `RespondJSON` devolve só o texto do
        estado HTTP. É isso que impede a fuga de caminho de ficheiro, consulta
        SQL ou valor de `panic`, e está travado por
        `TestRespondJSONNaoVazaDetalheDeErroInterno`.

        Um cliente que leia `error.code` aqui recebe `undefined`. Ramifique
        pelo estado HTTP.

        Algumas rotas DEVOLVEM um `500` classificado, com objecto — é o caso de
        `newsletter_failed`. Essas documentam-no na própria resposta, em vez de
        referenciarem esta.
    NaoAutorizado:
      content:
        application/json:
          example:
            code: 401
            error:
              code: unauthorized
              message: unauthorized
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        Token ausente, inválido ou revogado. Nas rotas `/admin`, significa que
        o cabeçalho `Authorization` não corresponde ao token de administração.
    RecusadoPeloWhatsApp:
      content:
        application/json:
          example:
            code: 422
            error:
              code: upstream_rejected
              message: WhatsApp refused this request; repeating it unchanged will not help
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        O pedido foi bem formado e chegou ao WhatsApp, que o recusou. Repetir
        o mesmo pedido não ajuda — algo no estado da conta, nas permissões ou
        no conteúdo tem de mudar primeiro.
    SemSessao:
      content:
        application/json:
          example:
            code: 400
            error:
              code: missing_session_id
              message: missing session id
            success: false
          schema:
            $ref: '#/components/schemas/Erro'
      description: |
        O token foi aceite mas não há sessão associada. Acontece quando a
        sessão foi criada e ainda não emparelhada.
  schemas:
    AlvoConversa:
      description: |
        Nome universal do destino. Toda rota que recebe um destinatário o
        aceita; o nome antigo e específico da rota tem precedência quando
        ambos vierem.
      properties:
        chat:
          description: JID de destino — contacto, grupo ou canal.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      type: object
    AlvoGrupo:
      description: |
        O grupo sobre o qual a operação age. Usado por `POST /group/info`,
        `POST /group/invitelink` e `POST /group/leave`. O nome específico da rota
        tem precedência sobre `chat` quando os dois vierem
        (`pkg/domain/chat_target.go:14-17`) — medido: `{"group_jid":"<grupo>",
        "chat":"nonsense"}` devolve `200`, porque `chat` nem é olhado.

        **Nenhum dos dois campos é ponteiro**, logo ausente, `null` e `""` são o
        mesmo pedido. O que muda entre eles é apenas o NOME.

        **O nome do campo é `group_jid` em toda a família**, uniformemente: a
        migração para DTO (`docs/HTTP-DTO-CONVENTIONS.md`) fechou a variação de
        grafia (`groupJID` vs `groupjid`) que esta secção documentava antes —
        cada rota lê agora o mesmo DTO de pedido tipado, com a mesma etiqueta
        `json:"group_jid"`.

        Campos desconhecidos são IGNORADOS em silêncio.
      properties:
        chat:
          description: |
            Nome universal do destino, aceite em toda a API. **Só é lido quando
            `group_jid` estiver vazio** (`ResolveChatField`); os dois juntos e
            diferentes fazem ganhar `group_jid` — medido.

            Ausente, `null` e `""` são indistinguíveis, e valem "não usar o
            alias". As mesmas regras de forma de `group_jid` valem para o valor.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo, na forma `<número>@g.us`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não — salvo se `chat` vier | `/group/info` e `/group/invitelink`: `400 missing_group_jid` (recusa tipada, do use case); `/group/leave`: `400 invalid_request` (objecto canónico, do manipulador — `rejectMissingField`) |
            | `null` | não | idêntico a ausente — **indistinguível** |
            | `""` | não | idêntico a ausente — **indistinguível** |
            | `"   "` | **passa a guarda** | `400 invalid_group_jid` — erro DIFERENTE, porque não há `trim` |
            | `120363411669320145` (número nu) | não | `400 invalid_group_jid` — medido; o sufixo `@g.us` é obrigatório |
            | `554192421234@s.whatsapp.net` | não | **medido em `/group/info`: `500` ao fim de ~75 s**, e não `400`. Um JID de contacto não é recusado por validação; vai ao WhatsApp e a chamada fica pendurada |
            | `120363411669320145@g.us` | sim | — |
            | tipo errado (`123`) | não | `400 could_not_decode_payload` |
          example: 120363411669320145@g.us
          nullable: false
          type: string
      type: object
    Avatar:
      description: |
        Ponteiro para a foto de perfil. A imagem NÃO vem no corpo — vem o URL, e é
        dele que se baixa. O URL é temporário e assinado pelo WhatsApp.

        **As duas chaves aparecem sempre.** Quando não há foto, não há corpo
        nenhum — a resposta é `404`, não um `Avatar` com campos vazios.

        O tipo do módulo de protocolo tem mais campos (`Type`, `DirectPath`,
        `Hash`), e esta rota **não** os expõe.
      properties:
        id:
          description: |
            Identificador da foto. Muda quando a pessoa troca a imagem, e é o mesmo
            valor que `InfoUtilizador.picture_id` — serve para detectar troca sem
            baixar. Sempre presente; nunca `null`.
          example: "1735689600"
          nullable: false
          type: string
        url:
          description: |
            URL da imagem, para ser baixado por quem chamou. Sempre presente; nunca
            `null`. É temporário: não o guarde como se fosse permanente.
          example: https://pps.whatsapp.net/v/t61.24694-24/000000_0000000000000000_0000000000000000000_n.jpg
          format: uri
          nullable: false
          type: string
      required:
        - id
        - url
      type: object
    BotaoInterativo:
      description: |
        Um botão de fluxo nativo, usado por `/chat/send/buttons` e por cada cartão
        de `/chat/send/carousel`.

        **O título é obrigatório na prática, e o nome do campo é `title`** — com
        `text` e `button_text` como sinónimos, nesta ordem de precedência. Um botão
        sem nenhum dos três é DESCARTADO EM SILÊNCIO, e o pedido continua com os
        restantes; se todos caírem, a rota responde `400 no_valid_buttons`. Medido
        em 2026-08-26: um botão com `display_text` (o nome que `/chat/send/template`
        usa) cai aqui.

        O título é truncado em **20 runas** (`buttonTitleMaxRunes`,
        `send_buttons.go:35`), e o corte acontece ANTES de o título servir de
        identificador — logo o `id` que volta no clique de quem recebeu já vem
        truncado.

        **Objecto vazio (`{}`) é aceite pelo desserializador e descartado na
        normalização**, como qualquer botão sem título. `null` dentro da lista dá
        um botão com todos os campos vazios — mesmo efeito. Nenhum destes casos
        produz erro por si só.
      properties:
        button_id:
          description: |
            Sinónimo de `id`, usado quando `id` está ausente, `null`, `""` ou só
            espaços.
          nullable: false
          type: string
        button_text:
          description: |
            Segundo sinónimo de `title`, usado quando `title` e `text` estão ambos
            ausentes, `null`, `""` ou só espaços. Mesmo `trim` e mesmo truncamento.
          nullable: false
          type: string
        copy_code:
          description: |
            Texto que um botão `copy` põe na área de transferência. Ignorado em
            silêncio nos outros tipos. Não é validado: vazio produz um botão que
            copia nada.
          example: PEDIDO-1234
          nullable: false
          type: string
        id:
          description: |
            Identificador devolvido no clique. Sinónimo `button_id`. Passa por
            `TrimSpace`; ausente, `null`, `""` e `"   "` são indistinguíveis.

            Quando `id` e `button_id` estão ambos vazios, **o próprio título JÁ
            TRUNCADO vira o identificador** — nunca fica vazio no fio.
          example: confirmar
          nullable: false
          type: string
        phone_number:
          description: |
            Número de um botão `cta_call`. Ignorado em silêncio nos outros tipos.
            Não é validado: vazio produz um botão de chamada sem número.
          example: "+554192421234"
          nullable: false
          type: string
        text:
          description: |
            Sinónimo de `title`, usado quando `title` está ausente, `null`, `""` ou
            só espaços. Mesmo `trim` e mesmo truncamento.
          nullable: false
          type: string
        title:
          description: |
            Rótulo do botão. Sinónimos, nesta ordem, `text` e `button_text`.

            Passa por `TrimSpace` antes de ser avaliado, logo `"   "` conta como
            vazio e faz o botão cair para o sinónimo seguinte. Ausente, `null` e
            `""` são indistinguíveis. Vazio nos três nomes = botão DESCARTADO em
            silêncio.

            `maxLength` é informativo: um título mais longo **não** é recusado, é
            TRUNCADO em 20 runas (não bytes).
          example: Confirmar
          maxLength: 20
          nullable: false
          type: string
        type:
          description: |
            Tipo do botão. Comparado depois de `TrimSpace` e `ToLower`, logo
            `"  Reply "` e `"REPLY"` funcionam.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente / `null` / `""` | sim | vale `reply` |
            | um dos quatro da lista | sim | — |
            | **qualquer outro valor** | **não** | o BOTÃO é DESCARTADO em silêncio |

            O descarte por valor desconhecido é comportamento preservado por
            decisão (HOUSEKEEP F148) e diverge de `/chat/send/template`, onde tipo
            desconhecido cai em `quickreply`. Em particular `quickreply` é válido
            lá e **descartado aqui**. Se todos os botões caírem, a rota responde
            `400 no_valid_buttons`, e a mensagem de erro lista os quatro aceites.
          enum:
            - reply
            - cta_url
            - cta_call
            - copy
          example: reply
          nullable: false
          type: string
        url:
          description: |
            Destino de um botão `cta_url`. Ignorado em silêncio nos outros tipos.

            **Não é validado.** Ausente, `null` e `""` são indistinguíveis, e um
            botão `cta_url` sem URL é enviado com destino vazio em vez de recusado.
          example: https://exemplo.com/pedido/1234
          nullable: false
          type: string
      type: object
    BotaoModelo:
      description: |
        Um botão de modelo hidratado, usado só por `/chat/send/template`. Vocabulário
        DIFERENTE do `BotaoInterativo`: aqui o rótulo é `display_text` e os tipos são
        outros três.

        **Nenhum campo deste objecto é validado, e nenhum botão é descartado.** Ao
        contrário de `/chat/send/buttons`, o use case entrega a lista ao adaptador
        tal e qual (`send_template.go`, `Execute` — só `len(Buttons) < 1` é
        verificado). Um `{}` vira um botão de resposta rápida com rótulo vazio, e
        um botão `url` sem `url` produz um botão com destino vazio. `null` dentro
        da lista tem o mesmo efeito de `{}`.
      properties:
        display_text:
          description: |
            Rótulo do botão. **Obrigatório na prática, e NÃO validado**: ausente,
            `null` e `""` são indistinguíveis e produzem um botão sem rótulo, com
            `200`. Não há `trim` e não há truncamento — ao contrário do `title` de
            `BotaoInterativo`.
          example: Abrir pedido
          nullable: false
          type: string
        id:
          description: |
            Identificador de um botão `quickreply`. Ausente, `null` e `""` são
            indistinguíveis e significam "numere automaticamente".

            A numeração decimal é montada no adaptador e conta **todos** os botões
            da lista, não só os de resposta rápida: num pedido `[url, quickreply]`
            o segundo botão recebe `"2"`, e não `"1"`.
          example: "1"
          nullable: false
          type: string
        phone_number:
          description: |
            Número de um botão `call`. Ignorado nos outros tipos. Não é validado:
            ausente, `null` e `""` dão um botão de chamada sem número.
          example: "+554192421234"
          nullable: false
          type: string
        type:
          description: |
            Tipo do botão. **Sensível a maiúsculas e a espaços**: a comparação é
            literal, sem `TrimSpace` e sem `ToLower`
            (`adapters/chat/messenger.go`, `templateButtons`).

            | estado | efeito |
            |---|---|
            | ausente / `null` / `""` | `quickreply` |
            | `url` | botão de URL |
            | `call` | botão de chamada |
            | `quickreply` | botão de resposta rápida |
            | `URL`, `url`, `" url"` | **`quickreply`** — a caixa não bate |
            | qualquer outro valor desconhecido | **`quickreply`**, sem erro |

            Valor fora da lista NÃO é recusado nem descartado: cai no ramo
            `default`, que é `quickreply` (`pkg/domain/message.go:786-789`). É o
            oposto de `/chat/send/buttons`, onde o botão sumiria.
          enum:
            - quickreply
            - url
            - call
          example: url
          nullable: false
          type: string
        url:
          description: |
            Destino de um botão `url`. Ignorado nos outros tipos. Não é validado:
            ausente, `null` e `""` são indistinguíveis e dão um botão sem destino.
          example: https://exemplo.com/pedido/1234
          nullable: false
          type: string
      type: object
    CanalUnico:
      description: |
        Resposta de `POST /newsletter/create`, `POST /newsletter/info` e
        `POST /newsletter/info-invite`.

        **O canal passou a vir EMBRULHADO** na chave `newsletter`; antes ocupava
        `data` directamente. O embrulho é o que dá a estas três rotas a mesma forma
        das outras da família — cada uma responde um objecto com a carga nomeada —
        e é onde um `meta` de paginação caberia sem mexer em campo nenhum.
      properties:
        newsletter:
          allOf:
            - $ref: '#/components/schemas/MetadadosCanal'
          description: |
            O canal. **`null` só quando o motor não devolveu nada**, o que não foi
            observado num `200`: um canal inexistente vem como objecto com `jid`
            vazio e `state: non_existing`, e não como `null`.
          nullable: true
      required:
        - newsletter
      type: object
    CartaoCarrossel:
      description: |
        Um cartão de `/chat/send/carousel`.

        **Cada cartão exige `body` e pelo menos um botão válido** — cartão sem um
        dos dois é descartado em silêncio, e se nenhum sobreviver a rota responde
        `400 no_valid_cards` (medido em 2026-08-26). `{}` e `null` dentro de
        `cards` são ambos cartões sem corpo, logo ambos descartados.
      properties:
        body:
          description: |
            Corpo do cartão. Passa por `TrimSpace` antes de ser avaliado.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | o CARTÃO é descartado em silêncio |
            | `null` | não | idem — indistinguível de ausente |
            | `""` | não | idem |
            | `"   "` | não | idem — aqui **há** `trim` |
            | preenchido | sim | vai no fio já sem espaços nas pontas |

            Se todos os cartões forem descartados, a rota responde
            `400 no_valid_cards`.
          example: Molho de tomate, mozzarella e manjericão. R$ 45,00.
          minLength: 1
          nullable: false
          type: string
        buttons:
          description: |
            Botões do cartão, com o mesmo vocabulário e as mesmas regras de
            descarte de `/chat/send/buttons`.

            Ausente, `null` e `[]` são indistinguíveis, e nos três casos o CARTÃO é
            descartado em silêncio — o mesmo destino de um cartão cujos botões
            foram todos descartados por tipo desconhecido ou falta de título.
          items:
            $ref: '#/components/schemas/BotaoInterativo'
          nullable: true
          type: array
        footer:
          description: |
            Rodapé do cartão. Sempre opcional: ausente, `null`, `""` e `"   "` são
            indistinguíveis e dão cartão sem rodapé (passa por `TrimSpace`).
          example: Entrega em 40 minutos
          nullable: false
          type: string
        image:
          description: |
            Imagem do cartão, como URI de dados (`data:image/...;base64,...`) ou
            URL http(s). Teto de 10 MB.

            Sempre opcional: ausente, `null` e `""` são indistinguíveis e dão
            cartão sem imagem.

            Ao contrário do corpo e dos botões, **nenhuma falha aqui derruba o
            cartão nem o pedido**: uma URI que não decodifica, uma busca que falha,
            um valor que não é nem URI de dados nem URL, ou bytes acima do teto —
            todos deixam o cartão seguir SEM imagem, com `200`, e a falha fica só
            no log.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          nullable: false
          type: string
        title:
          description: |
            Título do cartão. **É decorativo**: o iOS não o desenha, só o Android
            (HOUSEKEEP F217). Informação obrigatória vai em `body`, não aqui.

            Sempre opcional: ausente, `null`, `""` e `"   "` são indistinguíveis e
            dão cartão sem título (passa por `TrimSpace`).
          example: Pizza margherita
          nullable: false
          type: string
      required:
        - body
        - buttons
      type: object
    CodigoQR:
      description: |
        Resposta de `GET /session/qr`. Medida no servidor vivo em 2026-08-26,
        numa sessão já autenticada: `{"qr_code": ""}`.
      properties:
        qr_code:
          description: |
            Imagem do QR code em data URI (`data:image/png;base64,…`), lida da
            coluna `users.qrcode`.

            **Sempre presente, nunca ausente e nunca `null`.** Sem `omitempty` na
            struct (`domain/session.go:29`), e o valor zero de `string` é `""`.

            **Vazio é informação, não defeito.** A coluna só tem valor durante a
            janela de emparelhamento: o orquestrador grava a imagem a cada evento
            `QR` (`orchestrator.go:537`) e limpa-a no timeout
            (`orchestrator.go:552`).

            | estado | significa |
            |---|---|
            | `""` | a sessão já está emparelhada, ou nunca chamou `GET /session/connect`, ou o código expirou |
            | `data:image/png;base64,…` | há um código válido agora; desenhe-o |

            Medido em 2026-08-26 nas duas sessões autenticadas: `{"qr_code": ""}`
            com `200` nas duas.
          example: ""
          nullable: false
          type: string
      required:
        - qr_code
      type: object
    ConfiguracaoHmacLida:
      description: |
        Resposta de `GET /hmac/config`. Reporta **presença**, não valor: a chave
        nunca sai daqui, nem em claro nem cifrada.
      properties:
        hmac_key:
          description: |
            `""` quando não há chave configurada, `***` quando há.

            Um valor desconhecido é impossível: o servidor escolhe entre estas
            duas constantes e nunca devolve a chave. Sempre presente, nunca
            `null`.
          enum:
            - ""
            - '***'
          example: ""
          nullable: false
          readOnly: true
          type: string
      required:
        - hmac_key
      type: object
    ConfiguracaoProxyUtilizador:
      description: |
        Proxy de saída, no formato de ESCRITA das rotas `/admin/users`. Os nomes
        são os MESMOS da resposta desde a migração para DTO; antes eram camelCase
        aqui e snake_case lá.

        **Este bloco não valida nada**: ao contrário de `POST /proxy/set`, o
        `proxyUrl` daqui não passa por verificação de esquema nem de endereço
        reservado, e não é recusado por a sessão estar ligada.
      properties:
        enabled:
          default: false
          description: |
            Ausente, `null` e `false` são **indistinguíveis** (é `bool`, não
            `*bool`), e o efeito depende da rota:

            | rota | `enabled: true` | ausente / `null` / `false` |
            |---|---|---|
            | `POST /admin/users` | **ignorado** — o campo não é lido de todo | idem |
            | `PUT /admin/users/{id}` | grava `proxy_url` | **apaga** o `proxy_url` gravado |

            Na criação, o `enabled` da resposta é recalculado como
            `proxy_url != ""`, e não ecoa o que você enviou.
          example: false
          nullable: false
          type: boolean
        proxy_url:
          description: |
            URL do proxy. Ausente, `null` e `""` são indistinguíveis.

            Costuma trazer credenciais no userinfo
            (`socks5://utilizador:segredo@servidor:1080`) — **nunca é devolvido
            em claro nem registado em log** por esta API. Na edição, só é gravado
            quando `enabled` for `true`.
          example: socks5://utilizador:senha@proxy.exemplo.com.br:1080
          nullable: false
          type: string
          writeOnly: true
        webhook_use_proxy:
          description: |
            Se a entrega dos webhooks também sai por este proxy. **É `*bool`**,
            logo os três estados distinguem-se:

            | estado | efeito |
            |---|---|
            | ausente | na criação assume `true`; na edição **preserva** o gravado |
            | `null` | **indistinguível de ausente** |
            | `false` | grava `false` explicitamente |
            | `true` | grava `true` |
          example: true
          nullable: true
          type: boolean
      type: object
    ConfiguracaoS3Lida:
      description: |
        Resposta de `GET /s3/config`. **Não tem `secret_key`**, e a ausência é
        deliberada: a leitura nunca consulta essa coluna, portanto o segredo não
        tem por onde sair.

        Todos os campos abaixo **vêm sempre** — nenhum tem `omitempty` — e nenhum
        vem `null`. Uma sessão sem linha no banco recebe a configuração limpa, com
        `path_style: true` e `media_delivery: base64`, e não um erro: é o que
        distingue "nada configurado" de "leitura falhou".
      properties:
        access_key:
          description: |
            **Sempre a constante `***`**, mesmo sem chave configurada — mascarar
            só quando existe revelaria a existência. Não há valor desconhecido
            possível: o servidor escreve esta constante incondicionalmente, sem
            olhar para a coluna. Sempre presente, nunca `null`.
          enum:
            - '***'
          example: '***'
          nullable: false
          readOnly: true
          type: string
        bucket:
          description: Bucket de destino; `""` quando não configurado. Sempre presente, nunca `null`.
          example: ""
          nullable: false
          readOnly: true
          type: string
        enabled:
          description: Se o armazenamento em S3 está ligado. Sempre presente, nunca `null`.
          example: false
          nullable: false
          readOnly: true
          type: boolean
        endpoint:
          description: Endereço do serviço; `""` quando não configurado. Sempre presente, nunca `null`.
          example: ""
          nullable: false
          readOnly: true
          type: string
        media_delivery:
          description: |
            Como a mídia recebida é entregue.

            **`""` está na lista de propósito, e foi medido a 2026-08-26**: esta
            leitura devolve a coluna **tal e qual**, e só o caminho de escrita
            substitui o vazio por `base64`. Uma sessão configurada por
            `POST /admin/users` sem `mediaDelivery` devolve `""` aqui. Trate `""`
            como `base64`.

            Outro valor desconhecido não ocorre por esta via: `POST /s3/config`
            recusa-o com `400 invalid_media_delivery`. Mas `POST /admin/users` e
            `PUT /admin/users/{id}` **não validam**, e um valor arbitrário gravado
            por ali sai aqui tal e qual.

            Sempre presente, nunca `null`.
          enum:
            - ""
            - base64
            - s3
            - both
          example: base64
          nullable: false
          readOnly: true
          type: string
        path_style:
          description: |
            Endereçamento por caminho em vez de subdomínio. Sempre presente, nunca
            `null`. Numa sessão sem linha gravada vem `true`; numa que gravou
            configuração sem o campo, vem `false`.
          example: true
          nullable: false
          readOnly: true
          type: boolean
        public_url:
          description: Base pública da mídia; `""` quando não configurada. Sempre presente, nunca `null`.
          example: ""
          nullable: false
          readOnly: true
          type: string
        region:
          description: Região; `""` quando não configurada. Sempre presente, nunca `null`.
          example: ""
          nullable: false
          readOnly: true
          type: string
        retention_days:
          description: |
            Dias de retenção dos objectos. Sempre presente, nunca `null`. `0` é o
            valor de uma sessão que nunca gravou configuração de S3.
          example: 30
          minimum: 0
          nullable: false
          readOnly: true
          type: integer
      required:
        - enabled
        - endpoint
        - region
        - bucket
        - access_key
        - path_style
        - public_url
        - media_delivery
        - retention_days
      type: object
    ConfiguracaoS3Utilizador:
      description: |
        Armazenamento S3, no formato de ESCRITA das rotas `/admin/users`. Os
        nomes são os MESMOS da resposta desde a migração para DTO; antes eram
        camelCase aqui e snake_case lá.

        **Nada aqui é validado**: ao contrário de `POST /s3/config`, nem
        `media_delivery` nem `endpoint` passam por verificação — um
        `media_delivery` inválido é gravado tal e qual, e um `endpoint` que não é
        URL também. Em qualquer subcampo, ausente, `null` e o valor zero são
        indistinguíveis.
      properties:
        access_key:
          description: |
            Chave de acesso. Ausente, `null` e `""` são indistinguíveis.

            **Nunca é devolvida**: a resposta desta família já não traz sequer a
            chave `access_key`, mascarada ou não. Não use o valor de exemplo.
          example: AKIA_EXEMPLO_NAO_USE
          nullable: false
          type: string
          writeOnly: true
        bucket:
          description: Bucket de destino. Ausente, `null` e `""` são indistinguíveis e gravam a coluna vazia.
          example: wa-api-midia
          nullable: false
          type: string
        enabled:
          default: false
          description: |
            Liga o armazenamento em S3. Ausente, `null` e `false` são
            indistinguíveis. Quando `false`, o cliente S3 em memória desta sessão
            é **removido** — a configuração fica gravada, mas deixa de ser usada.
          example: true
          nullable: false
          type: boolean
        endpoint:
          description: |
            Endereço do serviço. Ausente, `null` e `""` são indistinguíveis e
            significam o endpoint padrão da AWS. **Não é validado por esta rota.**
          example: https://s3.sa-east-1.amazonaws.com
          nullable: false
          type: string
        media_delivery:
          description: |
            Como a mídia recebida é entregue. Ausente, `null` e `""` são
            indistinguíveis.

            Um valor desconhecido **NÃO é recusado por esta rota** — ao contrário
            de `POST /s3/config`, que devolve `400 invalid_media_delivery`. Aqui ele
            é gravado tal e qual e sai depois nas leituras, sem erro em momento
            nenhum. E o vazio **não** é substituído por `base64` aqui: a coluna
            fica `""`, que é o que `GET /s3/config` e `GET /admin/users` devolvem.
          enum:
            - base64
            - s3
            - both
          example: both
          nullable: false
          type: string
        path_style:
          default: false
          description: |
            Endereçamento por caminho em vez de subdomínio (necessário em MinIO e
            afins). Ausente, `null` e `false` são indistinguíveis.
          example: false
          nullable: false
          type: boolean
        public_url:
          description: |
            Base pública por onde a mídia guardada é servida. Ausente, `null` e
            `""` são indistinguíveis.
          example: https://midia.exemplo.com.br
          nullable: false
          type: string
        region:
          description: Região. Ausente, `null` e `""` são indistinguíveis e gravam a coluna vazia.
          example: sa-east-1
          nullable: false
          type: string
        retention_days:
          default: 0
          description: |
            Dias de retenção dos objectos. Ausente, `null` e `0` são
            indistinguíveis. Não há mínimo nem máximo aplicados pela API.
          example: 30
          minimum: 0
          nullable: false
          type: integer
        secret_key:
          description: |
            Segredo de acesso. Ausente, `null` e `""` são indistinguíveis.

            Cifrada antes de tocar no banco e **nunca devolvida por nenhuma
            rota** — nem sequer mascarada, porque a leitura não consulta a
            coluna. Não use o valor de exemplo.
          example: EXEMPLO_NAO_USE_gere_a_sua_secret_key
          nullable: false
          type: string
          writeOnly: true
      type: object
    ConfiguracaoWebhook:
      description: |
        Resposta de `GET /webhook` — o que está gravado no banco para esta sessão.

        O manipulador devolve um **mapa** com exactamente estas duas chaves, e não
        a struct de domínio: as duas estão **sempre presentes**, e nenhuma vem
        `null`. Não há aqui `events`, `active` nem `Details`.
      properties:
        subscribe:
          description: |
            Eventos subscritos.

            **Armadilha medida a 2026-08-26**: sem eventos subscritos, esta lista
            vem como `[""]` — uma lista com uma string vazia, e **não** uma lista
            vazia, porque é o resultado de partir por vírgula uma coluna vazia.
            Nunca vem `null` e nunca vem `[]`: tem sempre pelo menos um elemento.

            Quem contar `subscribe.length` para saber se há subscrição conta `1`
            onde não há nenhuma. A verificação correcta é
            `subscribe.filter(Boolean).length`.
          example:
            - Message
            - Receipt
          items:
            description: |
              Nome de um evento subscrito, ou `""` no caso da lista de um só
              elemento vazio descrito acima. Nunca `null`.
            example: Message
            nullable: false
            type: string
          minItems: 1
          nullable: false
          readOnly: true
          type: array
        webhook:
          description: |
            URL de destino. `""` quando não há webhook configurado — e `""`
            também quando a sessão não existe, porque a consulta não distingue os
            dois casos. Sempre presente, nunca `null`.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          readOnly: true
          type: string
      required:
        - webhook
        - subscribe
      type: object
    ContactoDoRoster:
      description: |
        Uma entrada da agenda. Era o tipo `types.ContactInfo` do módulo de
        protocolo serializado sem tratamento; hoje é `domain.Contact`, normalizado
        no adaptador de cada motor.

        **Todos os campos aparecem SEMPRE**: nenhum tem `omitempty`. Nenhum vem
        `null` — os de texto vêm `""` quando não há valor, e os booleanos `false`.

        Os nomes vêm de FONTES DIFERENTES, e é aí que está a armadilha:
        `full_name` e `first_name` vêm da sincronização da agenda de quem consulta,
        `push_name` do nome que a própria pessoa publica, e `business_name` do
        registo comercial. Medido a 2026-08-26 (as contagens descrevem o DADO e
        continuam válidas; só os nomes das chaves mudaram):

        | campo | Business (461) | pessoal (3456) |
        |---|---:|---:|
        | `found` verdadeiro | 461 | 3456 |
        | `push_name` preenchido | 460 | 1152 |
        | `full_name` preenchido | **1** | 164 |
        | `first_name` preenchido | 1 | 89 |
        | `business_name` preenchido | 2 | 43 |
        | **sem nome nenhum dos quatro** | 1 | **2175** |

        Um cliente que leia apenas `full_name` vê uma agenda praticamente sem
        nomes. A ordem de preferência que o próprio projecto usa está em
        `domain.ContactName.Melhor`: `full_name`, `push_name`, `business_name`,
        `first_name`, e cadeia vazia quando nenhum existe.

        A escassez de `full_name` tem consequência directa para a publicação de
        status — ver `POST /status/set/image` e a F256.

        **O campo `RedactedPhone` SAIU.** Era o número parcialmente ocultado
        (`+55∙∙∙∙∙∙∙∙45`), preenchido só para membros em espaço LID encontrados em
        grupos — 0 de 461 na conta Business, 2199 de 3456 na conta com muitos
        grupos. Não serve para enviar mensagem, e o `phone_number` que o substitui
        responde à mesma necessidade sem ocultar dígitos quando o mapeamento é
        conhecido. Quem dependia dele fica sem ele: é o corte a seco.
      properties:
        business_name:
          description: |
            Nome comercial, quando a conta é comercial. Sempre presente; `""`
            (nunca `null`) para contas pessoais — que é o caso quase sempre.
          example: ""
          nullable: false
          type: string
        first_name:
          description: |
            Primeiro nome, quando veio da sincronização da agenda. Sempre presente;
            `""` (nunca `null`) quando não veio — o caso da esmagadora maioria.
            Vazio SEMPRE no motor `wa-headless`, que não lê a agenda.
          example: ""
          nullable: false
          type: string
        found:
          description: |
            Se o motor tem mesmo um registo deste contacto, em vez de ter
            sintetizado a entrada a partir de uma identidade nua. Sempre presente;
            nunca `null`. Medido `true` em 461 de 461 e em 3456 de 3456 no motor
            `wa-noise` — só é devolvido o que foi encontrado.
          example: true
          nullable: false
          type: boolean
        full_name:
          description: |
            Nome completo, quando veio da sincronização da agenda. Sempre presente;
            `""` (nunca `null`) quando não veio.

            **É o campo que a lista de destinatários de status usa**, e o que faz a
            F256 doer: numa conta WhatsApp Business apenas 1 dos 461 contactos o
            tinha preenchido.
          example: ""
          nullable: false
          type: string
        is_business:
          description: |
            Se a página classifica a conta como comercial. **Só o motor
            `wa-headless` o responde**; no `wa-noise` vem sempre `false`, porque o
            armazenamento de contactos não carrega a bandeira. Sempre presente.
          example: false
          nullable: false
          type: boolean
        jid:
          description: |
            A identidade por onde endereçar este contacto. É o `lid` quando o motor
            conhece um — o caminho de envio mediu que é essa a que funciona neste
            build —, e a identidade de telefone caso contrário.
          example: 90937376170214@lid
          nullable: false
          type: string
        lid:
          description: |
            A identidade de privacidade do contacto. Sempre presente; `""` quando o
            motor só conhece um telefone.
          example: 90937376170214@lid
          nullable: false
          type: string
        phone_number:
          description: |
            A identidade de TELEFONE do contacto. Sempre presente; `""` quando o
            motor só conhece um `@lid`.

            Existe ao lado de `lid` porque uma pessoa é UMA entrada com DUAS
            identidades, e qual delas quem chama já tem depende de onde a leu: o
            histórico de mensagens fala telefone, a colecção de mensagens fala lid.
          example: ""
          nullable: false
          type: string
        push_name:
          description: |
            Nome que a própria pessoa publica. É o que costuma estar preenchido
            (460 de 461 na conta Business). Sempre presente; `""` quando a pessoa
            não publica nome. Nunca `null`.
          example: Janio Gonzalez
          nullable: false
          type: string
      required:
        - jid
        - phone_number
        - lid
        - found
        - first_name
        - full_name
        - push_name
        - business_name
        - is_business
      type: object
    ContextoResposta:
      description: Citação — faz a mensagem enviada aparecer como resposta a outra.
      properties:
        participant:
          description: JID de quem escreveu a mensagem citada.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        quoted_text:
          description: Texto da mensagem citada, para o cliente desenhar a pré-visualização.
          example: Bom dia, tudo certo com o pedido?
          nullable: false
          type: string
        stanza_id:
          description: '`message_id` da mensagem citada.'
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
      required:
        - stanza_id
        - participant
      type: object
    DadosUtilizadorApagado:
      description: |
        Identificação da sessão removida por `DELETE /admin/users/{id}/full`, para
        o registo de quem chamou.

        **As quatro propriedades vêm sempre**, sem `omitempty` e nunca `null`:
        `name` e `jid` são lidos ANTES da remoção e, se essa leitura falhar, a
        remoção prossegue e os dois chegam `""`.

        `details` é acréscimo da migração para DTO: o use case sempre o calculou
        e o manipulador sempre o deitou fora.
      properties:
        details:
          description: |
            Resumo do que a remoção fez, em texto fixo. Sempre presente e nunca
            `null`.

            É acréscimo da migração para DTO: o use case sempre o produziu, e o
            manipulador servia só o bloco de identificação, portanto quem chamava
            não conseguia distinguir esta rota da remoção simples pelo corpo da
            resposta.
          example: user instance removed completely
          nullable: false
          readOnly: true
          type: string
        id:
          description: |
            Identificador da sessão removida — é o `{id}` do caminho, ecoado.
            Sempre presente e sempre preenchido: é a única das três que não
            depende da leitura prévia. Nunca `null`.
          example: 918e37366f27e1125ee0482a793267e1
          nullable: false
          readOnly: true
          type: string
        jid:
          description: |
            JID da conta emparelhada. Sempre presente; vem `""` quando a sessão
            não estava emparelhada ou quando a leitura anterior falhou — os dois
            casos são indistinguíveis. Nunca `null`.
          example: 5516981818244:25@s.whatsapp.net
          nullable: false
          readOnly: true
          type: string
        name:
          description: |
            Nome da sessão removida. Sempre presente; vem `""` se a leitura
            anterior à remoção falhou, ou se a sessão não tinha nome. Nunca
            `null`.
          example: filarapida
          nullable: false
          readOnly: true
          type: string
      required:
        - id
        - name
        - jid
        - details
      type: object
    DefinicoesPrivacidade:
      description: |
        As definições de privacidade da conta. É a mesma forma na LEITURA
        (`GET /user/privacy`) e na resposta da ESCRITA (`POST /user/privacy`) — a
        escrita devolve o estado RESULTANTE de todas, não só o da que mudou.

        > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
        > CÓDIGO. Este objecto era repassado do módulo de protocolo SEM tratamento,
        > pelo que as chaves vinham em `PascalCase` (`GroupAdd`, `LastSeen`…) e
        > uma chave nova do WhatsApp apareceria na resposta pública sozinha, no
        > próximo rebase do vendor. Hoje o adaptador mapeia campo a campo para
        > `domain.PrivacySettings`: as chaves são as de baixo, **a lista é fechada**
        > e acrescentar uma passou a ser uma decisão nossa. Os valores medidos a
        > 2026-08-26 continuam válidos.

        **A assimetria de nomes entre leitura e escrita MANTÉM-SE**, e é do
        WhatsApp, não nossa: lê-se `read_receipts` e escreve-se `readreceipts`,
        lê-se `last_seen` e escreve-se `last`. A tabela de validação da escrita
        (`pkg/domain/privacy.go`) conhece só SETE das DEZ definições devolvidas
        aqui — cada campo abaixo diz qual é o seu nome de escrita, ou que não tem.

        **As dez chaves aparecem SEMPRE**, e nenhuma vem `null`: a que o motor não
        reportou vem `""`. Era o contrário — nenhuma chave era garantida.

        Os valores são cadeias e **não têm `enum` declarado nesta resposta de
        propósito**: só os sete campos escrevíveis têm conjunto conhecido, e mesmo
        esse é o conjunto que a NOSSA validação aceita na escrita, não uma garantia
        sobre o que a leitura pode devolver.
      properties:
        call_add:
          description: |
            Quem pode ligar para a conta. Escreve-se como `calladd`, e os valores que a escrita aceita
            são só `all` e `known`. Medido `all` (chave antiga `CallAdd`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: all
          nullable: false
          type: string
        defense:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita**. O significado exacto não foi determinado com segurança pela implementação actual — o campo é repassado do WhatsApp e não é interpretado em lado nenhum do nosso código. Medido `off` (chave antiga `Defense`).

            Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
          example: "off"
          nullable: false
          type: string
        group_add:
          description: |
            Quem pode adicionar a conta a grupos. Escreve-se como `groupadd`, e os valores que a escrita aceita
            são `all`, `contacts`, `contact_blacklist` e `none`. Medido `all` (chave antiga `GroupAdd`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: all
          nullable: false
          type: string
        last_seen:
          description: |
            Quem vê a hora do último acesso. Escreve-se como `last`, e os valores que a escrita aceita
            são `all`, `contacts`, `contact_blacklist` e `none`. Medido `contacts` (chave antiga `LastSeen`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: contacts
          nullable: false
          type: string
        messages:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita** — não consta da tabela de validação (`pkg/domain/privacy.go`), logo não é definível por esta API: `{"privacy_setting":"messages"}` é recusado com `400 invalid_privacy_setting`. Medido `all` (chave antiga `Messages`).

            Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
          example: all
          nullable: false
          type: string
        online:
          description: |
            Quem vê a conta como online. Escreve-se como `online`, e os valores que a escrita aceita
            são só `all` e `match_last_seen`. Medido `all` (chave antiga `Online`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: all
          nullable: false
          type: string
        profile:
          description: |
            Quem vê a foto de perfil. Escreve-se como `profile`, e os valores que a escrita aceita
            são `all`, `contacts`, `contact_blacklist` e `none`. Medido `all` (chave antiga `Profile`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: all
          nullable: false
          type: string
        read_receipts:
          description: |
            Se os confirmativos de leitura são enviados. É o caso em que a escrita aceita MENOS valores que as outras: `contacts` é recusado com `400 invalid_privacy_value`. Escreve-se como `readreceipts`, e os valores que a escrita aceita
            são só `all` e `none`. Medido `all` (chave antiga `ReadReceipts`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: all
          nullable: false
          type: string
        status:
          description: |
            Quem vê os status publicados — é esta definição que decide o alcance de `POST /status/set/*`. Escreve-se como `status`, e os valores que a escrita aceita
            são `all`, `contacts`, `contact_blacklist` e `none`. Medido `contacts` (chave antiga `Status`).

            Sempre presente; `""` (nunca `null`) quando o motor não reportou esta
            definição. `""` é distinguível de todo valor aceite, o que `all` não
            seria.
          example: contacts
          nullable: false
          type: string
        stickers:
          description: |
            Devolvido pela leitura e **sem contraparte na escrita** — não consta da tabela de validação. Medido `contacts` (chave antiga `Stickers`).

            Sempre presente; `""` (nunca `null`) quando o motor não a reportou.
          example: contacts
          nullable: false
          type: string
      required:
        - group_add
        - last_seen
        - status
        - profile
        - read_receipts
        - call_add
        - online
        - messages
        - defense
        - stickers
      type: object
    Detalhes:
      description: Confirmação textual de uma operação sem carga útil própria.
      properties:
        details:
          description: |
            Confirmação textual, em **inglês**, gerada pelo servidor.

            **Não é estável**: o texto muda entre operações e não deve ser
            comparado por um cliente. Quem precise de decidir a partir da
            resposta deve usar o estado HTTP.

            Pode vir ausente quando a operação não produz confirmação própria.
          example: Group name set successfully
          nullable: true
          type: string
      type: object
    EntradaDoIndiceDeConversas:
      description: |
        Uma conversa do índice, e quando teve a última mensagem gravada. Os dois
        campos não têm `omitempty` (`pkg/application/contracts/chat_history_port.go:45`), logo aparecem sempre e nenhum vem `null`.
      properties:
        chat_jid:
          description: |
            JID da conversa como está gravado no histórico — pode ser `@lid`,
            `@s.whatsapp.net`, `@g.us` ou `status@broadcast`. **Sempre presente,
            nunca `null`.** É o valor a passar de volta em
            `GET /chat/history?chat_jid=`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        last_updated:
          description: |
            Instante já formatado em RFC 3339, com nanossegundos, no fuso local
            do servidor. **Sempre presente, nunca `null`** — uma conversa cujo
            instante não se consegue interpretar é SALTADA do índice inteira,
            em vez de aparecer com o campo vazio.
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          nullable: false
          type: string
      required:
        - chat_jid
        - last_updated
      type: object
    Envelope:
      description: Forma comum a toda resposta de sucesso.
      properties:
        code:
          description: Estado HTTP, repetido no corpo.
          example: 200
          nullable: false
          type: integer
        data:
          description: A carga útil, com forma própria de cada rota.
          nullable: true
        success:
          description: Sempre `true` em sucesso. Campo legado, será removido.
          example: true
          nullable: false
          type: boolean
      required:
        - code
        - success
      type: object
    Erro:
      description: |
        Forma comum a toda resposta de erro que passa pela taxonomia `apperr`.
      properties:
        code:
          description: Estado HTTP, repetido no corpo.
          example: 400
          nullable: false
          type: integer
        error:
          description: |
            **Sempre presente, e sempre um objecto** — em TODO corpo de erro,
            em TODO estado HTTP, tenha o erro passado ou não pela taxonomia
            `apperr`. Nunca `null`, nunca `{}`, nunca uma string.

            Houve uma segunda forma, com `error` em texto simples, para os
            erros que não passavam pela taxonomia (F266). Ela FOI REMOVIDA: o
            que não tem código próprio recebe agora o código genérico do
            estado (`invalid_request`, `unauthorized`, `not_found`,
            `internal_error`, ...). Ramificar sobre `error.code` é seguro em
            qualquer resposta.
          nullable: false
          properties:
            code:
              description: |
                Código estável em `snake_case`. É por aqui que um cliente deve
                decidir o que fazer — a mensagem pode mudar, o código não.
              example: missing_chat
              nullable: false
              type: string
            message:
              description: |
                Descrição legível em pt-BR, segura para mostrar ao utilizador.
                Nunca traz detalhe interno — caminho de ficheiro, consulta SQL
                ou valor de `panic` são descartados por `RespondJSON` e ficam
                só no log. Travado por
                `TestRespondJSONNaoVazaDetalheDeErroInterno`.
              example: missing chat in payload
              nullable: false
              type: string
          required:
            - code
            - message
          type: object
        success:
          description: |
            **Sempre presente e sempre `false`** num corpo de erro. Campo
            legado — a forma correcta de detectar erro é o estado HTTP.

            Valor fora do enum não ocorre: é escrito pelo servidor, não lido
            do pedido.
          enum:
            - false
          example: false
          nullable: false
          type: boolean
      required:
        - code
        - error
        - success
      type: object
    EstadoConexao:
      description: |
        Resposta de `GET /session/connect`. O corpo NÃO é o `ConnectResult` do
        domínio: o manipulador responde um mapa literal
        (`handler_session.go:131`), e `status` é o único campo que sai.
      properties:
        status:
          description: |
            Constante `connecting`. A ligação ao WhatsApp arranca numa goroutine
            DEPOIS da resposta — este `200` significa "aceitei o pedido e a posse
            da sessão é minha", não "estou ligado". Quem confirma é
            `GET /session/status`.

            **Sempre presente e nunca `null`**: é escrito à mão no mapa literal do
            manipulador, não vem de struct. Valor fora desta lista de um só
            elemento não existe — não há caminho no código que escreva outra
            coisa; um valor desconhecido aqui seria defeito, não variação.
          enum:
            - connecting
          example: connecting
          nullable: false
          type: string
      required:
        - status
      type: object
    EstadoProntidao:
      description: Resposta da sonda de prontidão, com o resultado de cada dependência.
      properties:
        capabilities:
          additionalProperties:
            type: string
          description: Configuração em vigor que altera o comportamento do serviço.
          example:
            cluster: single
          nullable: false
          type: object
        checks:
          additionalProperties:
            type: string
          description: Uma entrada por dependência verificada, com o seu resultado.
          example:
            database: ok
          nullable: false
          type: object
        status:
          description: |
            `ready` quando todas as verificações passam. Qualquer outro valor
            significa que o serviço não deve receber tráfego.

            **Sempre presente**, nunca `null`, nunca vazia. Valor fora do enum não
            ocorre hoje — é escrito pelo código, não lido do pedido —, mas trate
            qualquer valor diferente de `ready` como "não pronto", para o caso de
            a lista crescer numa versão futura.
          enum:
            - ready
            - degraded
          example: ready
          nullable: false
          type: string
      required:
        - status
        - checks
      type: object
    EstadoSessao:
      description: |
        Retrato da sessão devolvido por `GET /session/status`. MEDIDO no servidor
        vivo em 2026-08-26 nas duas sessões reais — a forma abaixo é a resposta
        real, não a struct.

        Junta o estado AO VIVO (`connected`, `logged_in`, lidos do registo de
        clientes) com o registo PERSISTIDO da sessão (o resto).

        **Nenhum campo tem `omitempty`** (`domain/session.go:53-67`): os treze
        aparecem SEMPRE, em toda resposta `200`, e nenhum vem `null`. O que varia
        é o valor, nunca a presença.

        `token` (`domain.GetStatusResult.Token`) NÃO aparece: o apresentador
        (`dto/session/presenter.go: PresentGetStatus`) omite-o de propósito — a
        intenção é não ecoar o token de sessão numa sondagem de estado, e o campo
        nem chega a existir em `GetStatusResponse`. Ver F298.
      properties:
        connected:
          description: |
            Há transporte vivo para o WhatsApp. Distinto de `logged_in`: uma
            sessão pode estar autenticada com o transporte caído
            (`GET /session/disconnect` produz exactamente isso).

            Sempre presente e nunca `null`. `false` significa mesmo
            "desconectada" — não é ausência de informação: o leitor devolve
            `(false, false)` quando não há cliente
            (`runtime/session/guard.go:74`), e esta rota NÃO tem guarda de sessão
            de propósito (F196), justamente para conseguir responder o estado de
            uma sessão caída.
          example: true
          nullable: false
          type: boolean
        events:
          description: |
            Lista de tipos de evento subscritos, separados por vírgula. É esta
            lista que decide o que sai pelo webhook E pelo `GET /session/ws`.

            Sempre presente e nunca `null`. Dois valores medidos em 2026-08-26, e
            os dois extremos importam:

            | valor | efeito |
            |---|---|
            | `""` | **nenhum** evento é entregue — nem por webhook nem por WebSocket |
            | `All` | valor especial: TODOS os tipos passam (`lifecycle.go:36-46`) |
            | `Message,Connected` | só os tipos listados |

            Os nomes válidos são os de `pkg/domain/constants.go`; um nome fora
            dessa lista é descartado ao montar a subscrição
            (`lifecycle_webhook.go:92`) e some sem erro. `""` é o padrão, e é o
            que faz `GET /session/ws` ligar e nunca receber nada.
          example: Message,Connected,Disconnected
          nullable: false
          type: string
        history:
          description: |
            Limite de mensagens gravadas em `message_history`, **como texto** — o
            caso de uso converte o inteiro com `strconv.Itoa`
            (`session/get_status.go:88`).

            Sempre presente e nunca `null`. `"0"` significa gravação DESLIGADA, e
            é o valor de origem — não é "sem limite" nem "não configurado".
            Medido em 2026-08-26: `"100"` numa sessão e `"0"` na outra.

            Repare no tipo: aqui é texto; em `POST /session/history` o mesmo
            número entra e volta como INTEIRO.
          example: "100"
          nullable: false
          type: string
        hmac_configured:
          description: |
            **Sempre presente e sempre `false`.** O caso de uso não o preenche
            (`session/get_status.go:78-97`) e ele sai com o valor zero mesmo
            quando existe chave HMAC gravada. Medido `false` nas duas sessões em
            2026-08-26.

            Nunca vem `null` nem é omitido — o que o torna pior que ausente: um
            `false` que parece resposta. Para saber se há chave, use
            `GET /session/hmac/config`, que reporta a presença de forma honesta.
          example: false
          nullable: false
          type: boolean
        id:
          description: |
            Identificador da sessão no wa-api, hexadecimal de 32 caracteres.
            Sempre presente e nunca `null` numa resposta `200`; vem da linha da
            tabela `users`, e sem essa linha a rota responde `400 no_session` em
            vez de devolver o campo vazio.
          example: 918e37366f27e1125ee0482a793267e1
          nullable: false
          type: string
        jid:
          description: |
            JID da conta ligada, na forma PN e COM o sufixo de dispositivo
            (`:25`). Sempre presente e nunca `null`; vem `""` enquanto a sessão
            não estiver autenticada.
          example: 5516981818244:25@s.whatsapp.net
          nullable: false
          type: string
        logged_in:
          description: |
            A sessão está emparelhada e autenticada — é a que consegue operar.
            Sempre presente e nunca `null`; `false` é resposta legítima, não
            ausência.
          example: true
          nullable: false
          type: boolean
        name:
          description: |
            Nome dado à sessão em `POST /admin/users`. Sempre presente e nunca
            `null`; pode vir `""` se a sessão foi criada sem nome.
          example: filarapida
          nullable: false
          type: string
        proxy_config:
          description: |
            Estado do proxy, repetido em forma estruturada. É um mapa literal
            montado pelo caso de uso (`session/get_status.go:89-92`), logo tem
            sempre exactamente estas duas chaves, sempre presentes e nunca
            `null`. Redundante com `proxy_url`, e mantido por compatibilidade.
          nullable: false
          properties:
            enabled:
              description: |
                Há proxy configurado nesta sessão. Sempre presente e nunca `null`.
                É `entry.HasProxyURL`, ou seja, deriva de `proxy_url` não ser
                vazio — não é um interruptor independente.
              example: false
              nullable: false
              type: boolean
            proxy_url:
              description: |
                O mesmo valor de `proxy_url` do nível de cima, repetido dentro do
                resumo estruturado. Sempre presente e nunca `null`; `""` quando
                não há proxy.
              example: ""
              nullable: false
              type: string
          type: object
        proxy_url:
          description: |
            Proxy de saída desta sessão. Sempre presente e nunca `null`; `""`
            quando não há proxy.
          example: ""
          nullable: false
          type: string
        qr_code:
          description: |
            O mesmo valor que `GET /session/qr` devolve. Sempre presente e nunca
            `null`; `""` fora da janela de emparelhamento — ver `CodigoQR`.
          example: ""
          nullable: false
          type: string
        s3_config:
          description: |
            Resumo da configuração S3 desta sessão. Mapa literal
            (`session/get_status.go:93-102`): as oito chaves aparecem SEMPRE e
            nenhuma vem `null`.

            É um subconjunto do que `GET /session/s3/config` devolve — **não traz
            `access_key` nem sequer mascarada**, e essa é a diferença de propósito
            entre as duas leituras.
          nullable: false
          properties:
            bucket:
              description: Bucket gravado. Sempre presente, nunca `null`; `""` quando nada foi configurado.
              example: ""
              nullable: false
              type: string
            enabled:
              description: A entrega de mídia para o bucket está ligada. Sempre presente, nunca `null`.
              example: false
              nullable: false
              type: boolean
            endpoint:
              description: Endpoint gravado. Sempre presente, nunca `null`; `""` significa o endpoint padrão da AWS.
              example: ""
              nullable: false
              type: string
            media_delivery:
              description: |
                Modo de entrega de mídia GRAVADO. Sempre presente e nunca `null`.

                **Não tem `enum` de propósito.** O que sai aqui é o conteúdo cru da
                coluna, e uma sessão que nunca chamou `POST /session/s3/config`
                tem `""` — que não é nenhum dos três valores que a escrita aceita.
                Medido em 2026-08-26: `"base64"` numa sessão e `""` na outra.

                `""` deve ser lido como "nunca configurado"; o comportamento
                efectivo nesse estado é o padrão, `base64`
                (`domain/storage.go:57-58`).
              example: base64
              nullable: false
              type: string
            path_style:
              description: |
                Endereçamento por caminho. Sempre presente e nunca `null`.

                **`false` é o valor de origem da coluna**, não o `true` que
                `GET /session/s3/config` devolve numa sessão sem linha. Medido em
                2026-08-26: `true` numa sessão e `false` na outra, ambas sem S3
                configurado.
              example: true
              nullable: false
              type: boolean
            public_url:
              description: Prefixo público gravado. Sempre presente, nunca `null`; `""` quando não há.
              example: ""
              nullable: false
              type: string
            region:
              description: Região gravada. Sempre presente, nunca `null`; `""` quando nada foi configurado.
              example: ""
              nullable: false
              type: string
            retention_days:
              description: |
                Dias de retenção gravados. Sempre presente e nunca `null`. `0` é o
                valor de origem e significa "nunca configurado", não "reter zero
                dias". Medido em 2026-08-26: `30` numa sessão e `0` na outra.
              example: 30
              nullable: false
              type: integer
          type: object
        webhook:
          description: |
            URL do webhook desta sessão. Sempre presente e nunca `null`; `""`
            quando não há webhook configurado — medido `""` nas duas sessões em
            2026-08-26.
          example: ""
          nullable: false
          type: string
      type: object
    EstadoSonda:
      description: |
        Resposta das sondas de vivacidade. Repare que NÃO usa o envelope comum —
        é resposta de infraestrutura, lida por orquestradores que esperam a forma
        mais simples possível.
      properties:
        status:
          description: |
            Constante `ok`. **Sempre presente**, nunca `null`, nunca vazia.

            O que informa não é o valor — é a resposta ter chegado com `200`. Um
            cliente que compare o texto não ganha nada: a sonda falha por não
            responder ou por responder outro estado, não por mudar esta palavra.

            Valor fora do enum não ocorre: é escrito pelo código, não lido do
            pedido.
          enum:
            - ok
          example: ok
          nullable: false
          type: string
      required:
        - status
      type: object
    Etiqueta:
      description: |
        Uma etiqueta do WhatsApp Business, como `GET /labels` a devolve.

        As etiquetas são recolhidas dos eventos que os outros aparelhos anunciam.
        O wa-api **não as cria** — a biblioteca não sabe fazê-lo — e não há rota
        de escrita.

        As seis propriedades vêm **sempre**: são campos de uma linha do banco, sem
        `omitempty`, e nenhuma vem `null`.
      properties:
        color:
          description: |
            Índice da cor na paleta do WhatsApp Business. Sempre presente, nunca
            `null`. A API não valida nem interpreta o valor: é o que o aparelho
            anunciou, e `0` é um índice legítimo, não "sem cor".
          example: 0
          nullable: false
          readOnly: true
          type: integer
        deleted:
          description: |
            Se a etiqueta foi apagada no aparelho.

            **Nesta listagem vem sempre `false`**, e não há outro valor possível:
            a consulta filtra por `deleted = false`. As etiquetas apagadas
            **ficam** na tabela — o registo de que existiram tem valor para quem
            reconstrói histórico — mas **não saem por esta rota**. Não filtre por
            este campo à espera de reduzir a lista: ela já vem reduzida.

            Sempre presente, nunca `null`.
          enum:
            - false
          example: false
          nullable: false
          readOnly: true
          type: boolean
        label_id:
          description: |
            Identificador da etiqueta. É um número curto atribuído pelo WhatsApp
            Business, **transportado como string** — na instância medida a
            2026-08-26, `"3"`, e não `3`. É este valor que entra em
            `GET /labels/{id}/chats`. Sempre presente, nunca `null`.
          example: "3"
          nullable: false
          readOnly: true
          type: string
        name:
          description: |
            Nome da etiqueta. **Pode vir com caracteres invisíveis de marcação de
            direcção do texto** no início, postos pelo próprio WhatsApp — foi o
            caso na medição de 2026-08-26, em que `"Grupos"` chegou precedido de
            `U+200E`. Compare por igualdade só depois de os remover.

            Sempre presente; pode ser `""` se o aparelho anunciou uma etiqueta sem
            nome. Nunca `null`.
          example: Grupos
          nullable: false
          readOnly: true
          type: string
        predefined_id:
          description: |
            Índice da etiqueta predefinida de origem. `0` quando não vem de
            nenhuma. Sempre presente, nunca `null`.
          example: 0
          nullable: false
          readOnly: true
          type: integer
        updated_at:
          description: |
            Instante da última alteração anunciada. **Vem com o fuso do aparelho
            que a anunciou**, e não em UTC — na medição de 2026-08-26,
            `-04:00`. Normalize antes de comparar com outros instantes desta API,
            que usam UTC.

            Sempre presente, nunca `null`; uma linha sem instante conhecido traz o
            zero de Go (`0001-01-01T00:00:00Z`).
          example: "2026-07-20T05:28:22.008-04:00"
          format: date-time
          nullable: false
          readOnly: true
          type: string
      required:
        - label_id
        - name
        - color
        - predefined_id
        - deleted
        - updated_at
      type: object
    EtiquetaConversa:
      description: |
        Associação entre uma etiqueta e uma conversa, como `GET /labels/{id}/chats`
        a devolve.

        As quatro propriedades vêm **sempre**, e nenhuma vem `null`. A lista pode
        vir `[]` — nunca `null` —, e vem `[]` tanto para uma etiqueta sem
        conversas como para **um `{id}` que não existe**: a rota não devolve `404`,
        medido a 2026-08-26.
      properties:
        chat_jid:
          description: |
            JID da conversa — contacto (`@s.whatsapp.net` ou `@lid`), grupo
            (`@g.us`) ou canal (`@newsletter`). Sempre presente, nunca `null`.
          example: 120363411669320145@g.us
          nullable: false
          readOnly: true
          type: string
        label_id:
          description: |
            Identificador da etiqueta — o `{id}` do caminho, ecoado. Sempre
            presente, nunca `null`.
          example: "3"
          nullable: false
          readOnly: true
          type: string
        labeled:
          description: |
            Se a etiqueta está aplicada neste instante.

            **Nesta listagem vem sempre `true`**, e não há outro valor possível: a
            consulta filtra por `labeled = true`. Uma associação retirada
            continua na tabela com `false` — o instante em que foi retirada tem
            valor —, mas **não sai por esta rota**.

            Sempre presente, nunca `null`.
          enum:
            - true
          example: true
          nullable: false
          readOnly: true
          type: boolean
        updated_at:
          description: |
            Instante em que a associação foi anunciada, **com o fuso do aparelho
            que a anunciou**, e não em UTC. Sempre presente, nunca `null`.
          example: "2026-07-20T05:28:22.008-04:00"
          format: date-time
          nullable: false
          readOnly: true
          type: string
      required:
        - label_id
        - chat_jid
        - labeled
        - updated_at
      type: object
    EventoWebSocket:
      description: |
        Forma de cada quadro de texto que `GET /session/ws` empurra. NÃO usa o
        envelope `{code,data,success}` das rotas REST: é o MESMO objecto que sai
        para o webhook da sessão, serializado uma vez e difundido a todas as
        ligações vivas daquele token (`lifecycle_webhook.go:150-165`).

        O objecto é PLANO: `type` diz o evento, e os restantes campos são os do
        próprio evento, na raiz. **Não há esquema fechado**: cada tipo de evento
        traz o seu conjunto de campos, e os documentados abaixo são os do
        emparelhamento, que é o fluxo que esta rota existe para servir. Um cliente
        tem de tolerar campos que não conhece.

        **A subscrição decide o que chega.** O mesmo filtro do webhook corre antes
        do envio para o WebSocket: se `events` da sessão (ver `EstadoSessao`) não
        incluir o tipo — nem o valor especial `All` —, o evento **não é
        entregue**, e a ligação fica aberta sem receber nada. Uma sessão com
        `events: ""` recebe zero quadros. Medido em 2026-08-26: uma das duas
        sessões vivas está exactamente nesse estado.
      properties:
        code:
          description: |
            No evento `QR`, o texto cru do código — qualquer cliente consegue
            desenhá-lo sozinho.

            **Sempre presente nos eventos `QR`, ausente em todos os outros**, e
            nunca `null` (`orchestrator.go:753-756`). É o único campo do `QR`
            garantido: `qrCodeBase64` e `expiresAt` podem faltar.
          example: 2@abc123...,def456...,ghi789...
          nullable: false
          type: string
        event:
          description: |
            Subtipo, presente APENAS nos eventos de emparelhamento: `code` no
            `QR`, `timeout` no `QRTimeout`, `pair_success` no `PairSuccess`.

            **Ausente em todos os outros tipos**, e nunca `null` — o payload é um
            mapa, e uma chave que não é escrita simplesmente não existe no JSON.
            É redundante com `type` e existe por compatibilidade
            (`orchestrator.go:742`).
          example: code
          nullable: false
          type: string
        expiresAt:
          description: |
            No evento `QR`, a validade real daquele código, em RFC 3339.

            **Pode faltar**: só é escrito quando a validade conhecida é maior que
            zero (`orchestrator.go:786-788`). Ausente em todos os outros tipos, e
            nunca `null`.

            Use este valor em vez de assumir uma janela fixa: a constante já mudou
            no passado e o campo é a única fonte que acompanha
            (`orchestrator.go:770-785`).
          example: "2026-08-26T13:18:34Z"
          format: date-time
          nullable: false
          type: string
        jid:
          description: |
            No `PairSuccess`, o JID da conta que acabou de emparelhar, na forma PN
            e com sufixo de dispositivo. Ausente nos tipos que não o escrevem, e
            nunca `null`.
          example: 5516981818244:25@s.whatsapp.net
          nullable: false
          type: string
        qrCodeBase64:
          description: |
            No evento `QR`, a imagem já codificada em data URI.

            **Pode faltar mesmo num evento `QR`**: se a codificação da imagem
            falhar, o evento sai à mesma, só com `code`, e a falha vai para o log
            (`orchestrator.go:758-766`). Ausente em todos os outros tipos. Nunca
            `null` e nunca `""` — ou vem completo, ou não vem.

            Trate a ausência como "desenhe o QR a partir de `code`", não como
            erro.
          example: data:image/png;base64,iVBORw0KGgo...
          nullable: false
          type: string
        type:
          description: |
            Tipo do evento. **Sempre presente e nunca `null`**: o despachante
            recusa e regista erro se `postmap["type"]` não for texto
            (`lifecycle_webhook.go:118-122`), logo nenhum quadro sai sem ele.

            Vem da mesma lista que `users.events` filtra
            (`pkg/domain/constants.go`) — entre outros: `QR`, `QRTimeout`,
            `PairSuccess`, `Connected`, `Disconnected`, `ConnectFailure`,
            `LoggedOut`, `Message`, `Receipt`, `ReadReceipt`, `Presence`,
            `HistorySync`, `AppStateSyncComplete`, `GroupInfo`, `Picture`,
            `PushName`, `BusinessName`, `Blocklist`, `CallOffer`.

            **Sem `enum` de propósito**: a lista tem cerca de cinquenta entradas e
            cresce com a biblioteca; fixá-la aqui faria o documento envelhecer em
            silêncio. `All` NÃO aparece como `type` — é só um valor de
            subscrição.
          example: QR
          nullable: false
          type: string
      required:
        - type
      type: object
    IdCliente:
      description: |
        Identificador da mensagem escolhido pelo CLIENTE, e não pelo servidor.

        **Sempre opcional.** Ausente, `null` e `""` são indistinguíveis, e nos três
        casos o wa-noise gera um identificador. Não há formato imposto nem
        validação: o valor é passado ao wa-noise tal e qual.

        **NÃO é chave de idempotência.** Não foi medido que o servidor ou o
        WhatsApp deduplique por este campo; enviar o mesmo `id` duas vezes envia
        duas mensagens. Ver a secção 18 do contrato arquitectural.

        Não confundir com o `message_id` da resposta — em todas as rotas de envio
        salvo `/chat/send/edit`, os dois coincidem quando o cliente fornece `id`.
        Em `/chat/send/edit` o `message_id` devolvido é o da mensagem EDITADA, que
        é o próprio campo `id` do pedido, com outro significado.
      example: 3EB0A4B2AFD45E625C0917
      nullable: false
      type: string
    ImagemDeCanal:
      description: |
        Descritor de uma imagem de canal. **Não carrega bytes**: descarregar é
        outra chamada.
      properties:
        direct_path:
          description: |
            Caminho directo no CDN do WhatsApp. `""` nos canais próprios medidos e
            preenchido num canal de terceiro — nunca `null`, nunca ausente.
          example: ""
          nullable: false
          type: string
        id:
          description: |
            Identificador da imagem, como texto. `""` em canal apagado; nunca
            `null`. **Muda entre chamadas** para o mesmo canal — medido
            `1787750687544878` e `1787756516362051` com minutos de intervalo —,
            logo não serve como chave de cache.
          example: "1787750687544878"
          nullable: false
          type: string
        type:
          description: |
            Tipo do descritor. `IMAGE` em `picture`, `PREVIEW` em `preview`, `""`
            em canal apagado. Não é enumeração validada: é copiado do WhatsApp e um
            valor novo passa tal e qual.
          example: IMAGE
          nullable: false
          type: string
        url:
          description: |
            URL de descarga. **Veio `""` em todos os canais próprios medidos**;
            nunca `null`. Vazio significa que é preciso outra chamada para obter a
            imagem.
          example: ""
          nullable: false
          type: string
      required:
        - url
        - id
        - type
        - direct_path
      type: object
    IndiceDeConversas:
      additionalProperties:
        description: As conversas dessa sessão, da mais recente para a mais antiga. Nunca `null`.
        items:
          $ref: '#/components/schemas/EntradaDoIndiceDeConversas'
        type: array
      description: |
        Resposta de `chat_jid=index`: as conversas do chamador com o instante da
        última mensagem gravada em cada uma. É um MAPA cuja chave é o id da
        sessão — forma histórica preservada; hoje traz no máximo a chave do
        próprio chamador.

        **Nunca é `null`**: uma sessão sem histórico devolve `{}`. O parâmetro
        `limit` é IGNORADO neste ramo — o índice vem inteiro (medido: 386
        entradas com `limit=1`). O valor `index` é sensível a maiúsculas:
        `chat_jid=INDEX` é tratado como um JID normal e devolve `[]`.
      example:
        918e37366f27e1125ee0482a793267e1:
          - chat_jid: 554192421234@s.whatsapp.net
            last_updated: "2026-08-26T09:08:10.351982-04:00"
          - chat_jid: 120363411669320145@g.us
            last_updated: "2026-08-24T19:01:14.41138-04:00"
      type: object
    InfoGrupoCanonico:
      description: |
        Metadados de um grupo, na forma CANÓNICA — `snake_case` minúsculo,
        produzida pelo apresentador `PresentGroupInfo`
        (`pkg/presentation/http/dto/group/presenter.go`) a partir de
        `domain.GroupInfo`.

        **O que mudou face a `InfoGrupo`**, e porquê: `InfoGrupo` descrevia a
        struct de protocolo do wa-noise serializada DIRECTAMENTE, sem etiquetas
        `json` — daí `JID`, `OwnerJID`, `IsAdmin`. Pior: o motor `wa-headless`
        servia OUTRA struct na mesma chave, então a forma do corpo dependia de que
        motor tinha a sessão. Hoje os dois motores normalizam para
        `domain.GroupInfo`, e esta é a única forma servida.

        **Campos que desapareceram** e a razão: `OwnerPN`, `TopicID`,
        `TopicDeleted`, `AddressingMode`, `CreatorCountryCode`,
        `AnnounceVersionID`, `ParticipantVersionID` e `Error`/`AddRequest` dos
        participantes eram detalhe do protocolo, não do recurso. `Suspended` passou
        a `is_suspended`.

        **Presença**: nenhuma propriedade tem `omitempty`. Todas aparecem sempre.
        As três datas são `null` quando o motor não as conhece — e não
        `"0001-01-01T00:00:00Z"`, que seria uma data real no fio.

        **O que o motor headless não vê**: uma sessão servida por `wa-headless` só
        consegue `jid`, `name` e `is_announce`; o resto vem no zero, e
        `participants` vem `[]`. Isso é visível, e é de propósito — preencher com
        palpite tornaria "não vejo" indistinguível de "o grupo é assim".
      properties:
        created_at:
          description: Quando o grupo foi criado. `null` quando desconhecido.
          example: "2026-08-26T12:42:47Z"
          format: date-time
          nullable: true
          type: string
        disappearing_timer:
          description: |
            Duração das mensagens temporárias, em SEGUNDOS. `0` quando desligadas.
          example: 86400
          minimum: 0
          nullable: false
          type: integer
        is_announce:
          description: Só administradores podem enviar mensagens.
          example: false
          nullable: false
          type: boolean
        is_default_sub_group:
          description: É o grupo de avisos criado com a comunidade.
          example: false
          nullable: false
          type: boolean
        is_ephemeral:
          description: Mensagens temporárias ligadas.
          example: true
          nullable: false
          type: boolean
        is_incognito:
          description: Grupo em modo incógnito.
          example: false
          nullable: false
          type: boolean
        is_join_approval_required:
          description: Entrar exige aprovação de um administrador.
          example: false
          nullable: false
          type: boolean
        is_locked:
          description: Só administradores podem editar os dados do grupo.
          example: false
          nullable: false
          type: boolean
        is_parent:
          description: O "grupo" é na verdade uma COMUNIDADE.
          example: false
          nullable: false
          type: boolean
        is_suspended:
          description: Grupo suspenso pelo WhatsApp.
          example: false
          nullable: false
          type: boolean
        jid:
          description: JID do grupo, sempre terminado em `@g.us`.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        linked_parent_jid:
          description: |
            A comunidade a que este grupo pertence. `""` num grupo solto.
          example: ""
          nullable: false
          type: string
        member_add_mode:
          description: |
            Quem pode adicionar membros. Valores do WhatsApp: `admin_add`,
            `all_member_add`. `""` quando o servidor não o disse.
          example: admin_add
          nullable: false
          type: string
        name:
          description: O nome (assunto) do grupo.
          example: Equipa de entregas
          nullable: false
          type: string
        name_set_at:
          description: |
            Quando o nome foi definido, em RFC 3339 UTC. `null` quando desconhecido.
          example: "2026-08-26T12:42:49Z"
          format: date-time
          nullable: true
          type: string
        name_set_by:
          description: Quem definiu o nome. `""` quando desconhecido.
          example: 90937376170214@lid
          nullable: false
          type: string
        owner_jid:
          description: Quem criou o grupo. `""` quando o WhatsApp não o deu.
          example: 90937376170214@lid
          nullable: false
          type: string
        participant_count:
          description: |
            O que o servidor reportou, que NÃO é sempre o tamanho de
            `participants`: um não-administrador a ler um grupo em modo anúncio
            recebe a contagem sem a lista.
          example: 2
          minimum: 0
          nullable: false
          type: integer
        participants:
          description: |
            Os membros. **Sempre um array, nunca `null`** — só um dos dois se
            percorre sem verificação. Vem `[]` quando a sessão é servida pelo motor
            headless, que não vê a lista.
          items:
            $ref: '#/components/schemas/ParticipanteGrupoCanonico'
          nullable: false
          type: array
        topic:
          description: A descrição do grupo. `""` num grupo sem descrição.
          example: Combinações de rota do turno da manhã
          nullable: false
          type: string
        topic_set_at:
          description: Quando a descrição foi definida. `null` quando desconhecido.
          example: "2026-08-26T12:42:51Z"
          format: date-time
          nullable: true
          type: string
        topic_set_by:
          description: Quem definiu a descrição. `""` quando desconhecido.
          example: 90937376170214@lid
          nullable: false
          type: string
      required:
        - jid
        - owner_jid
        - name
        - name_set_at
        - name_set_by
        - topic
        - topic_set_at
        - topic_set_by
        - is_locked
        - is_announce
        - is_ephemeral
        - disappearing_timer
        - is_incognito
        - is_suspended
        - is_parent
        - linked_parent_jid
        - is_default_sub_group
        - is_join_approval_required
        - member_add_mode
        - created_at
        - participant_count
        - participants
      type: object
    InfoUtilizador:
      description: |
        O que se sabe sobre uma conta, do ponto de vista da sessão que pergunta.

        Era o tipo `types.UserInfo` do módulo de protocolo serializado SEM
        tratamento — daí os nomes em `PascalCase` e o bloco `VerifiedName` com o
        certificado protobuf cru lá dentro. Hoje é `domain.UserInfo`, normalizado
        no adaptador de cada motor, apresentado por
        `pkg/presentation/http/dto/user`.

        **Nenhum campo tem `omitempty`**: os oito aparecem sempre que a entrada
        existir. O que varia é o conteúdo, não a presença.

        **Os dois motores preenchem metades complementares**, e isso é propriedade
        do motor, não falta de dado. O `wa-noise` pergunta ao servidor e responde
        `status`, `picture_id`, `devices` e `verified_name`; o `wa-headless` lê a
        colecção de contactos da página e responde `push_name` e `business_name`.
        O que o motor não sabe vem no valor zero.
      properties:
        business_name:
          description: |
            Nome comercial do roster local. Sempre presente; `""` (nunca `null`).
            Como `push_name`, só o motor `wa-headless` o preenche nesta rota.
          example: ""
          nullable: false
          type: string
        devices:
          description: |
            Aparelhos ligados àquela conta, cada um com o seu sufixo de
            dispositivo. O primeiro, sem sufixo, é o aparelho principal.

            **Sempre presente e sempre um array** — `[]` e nunca `null`, ao
            contrário do campo antigo: o apresentador aloca antes do laço, e a
            ressalva "trate as duas formas" que estava aqui deixou de se aplicar.
          example:
            - 554192421234@s.whatsapp.net
            - 554192421234:41@s.whatsapp.net
          items:
            description: JID de um aparelho, com sufixo `:N` a partir do segundo.
            example: 554192421234:41@s.whatsapp.net
            nullable: false
            type: string
          nullable: false
          type: array
        jid:
          description: |
            O identificador consultado, ecoado tal como foi enviado — é o que
            permite casar a resposta com a pergunta sem depender da posição.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        lid:
          description: |
            Identificador de privacidade da conta, quando o servidor o reporta.
            Sempre presente; vem `""` (nunca `null`) quando não há mapeamento.

            Substitui o campo `LID` do tipo de protocolo, com a mesma ressalva:
            ele resolve o LID DE um número, e não ecoa o que se perguntou.
          example: 90937376170214@lid
          nullable: false
          type: string
        picture_id:
          description: |
            Identificador da foto de perfil actual, para detectar troca sem baixar
            a imagem. Sempre presente; vem `""` (nunca `null`) quando não há foto
            ou a privacidade a esconde.
          example: ""
          nullable: false
          type: string
        push_name:
          description: |
            Nome que a própria pessoa publica, quando o motor o conhece. Sempre
            presente; `""` (nunca `null`). Só o motor `wa-headless` o preenche
            nesta rota — o `wa-noise` pergunta ao servidor, que não o devolve aqui.
          example: ""
          nullable: false
          type: string
        status:
          description: |
            O "recado" do perfil. Sempre presente; vem `""` (nunca `null`) quando a
            privacidade o esconde, quando não há nenhum, quando o servidor não o
            devolveu, ou quando o motor é o `wa-headless` — os quatro casos são
            indistinguíveis.
          example: ""
          nullable: false
          type: string
        verified_name:
          description: |
            Nome verificado da conta comercial, JÁ EXTRAÍDO do certificado.

            **Isto é uma mudança de forma, não só de nome.** O campo antigo
            (`VerifiedName`) era um OBJECTO com o certificado protobuf cru —
            `Certificate` e `Details` — cuja estrutura interna nunca foi observada
            em campo porque vinha `null` nas duas contas de teste. O adaptador
            passou a chamar `Details.GetVerifiedName()` e a servir só a cadeia,
            que é o único pedaço daquele bloco que alguém conseguia usar.

            Sempre presente; `""` (nunca `null`) para contas pessoais.
          example: ""
          nullable: false
          type: string
      required:
        - jid
        - lid
        - status
        - picture_id
        - verified_name
        - devices
        - push_name
        - business_name
      type: object
    InfoUtilizadores:
      description: |
        Bloco `users` de `POST /user/info`.

        > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
        > CÓDIGO, não medida contra o servidor vivo: a rota passou a servir um DTO
        > (`pkg/presentation/http/dto/user`) e o corpo mudou de nomes — e nalguns
        > casos de FORMA — em relação ao que foi medido a 2026-08-26. As contagens
        > de população que aparecem abaixo continuam válidas (descrevem o DADO,
        > não as chaves); os nomes das chaves e a estrutura vêm do DTO.

        **Era um OBJECTO indexado pelo JID consultado; passou a ser um ARRAY.** A
        chave daquele objecto era um JID — que é DADO, não nome de campo — e a
        regra de nomes do contrato (`docs/HTTP-DTO-CONVENTIONS.md` §8) vale para
        toda chave de objecto JSON. Não havia renomear; o dado teve de sair da
        chave e passar a valor, no campo `jid` de cada entrada.

        A ordem do array é a ORDEM DO PEDIDO, não a de um mapa: o adaptador
        percorre os JIDs pedidos, e não o mapa que o servidor devolveu
        (`pkg/infra/wa-noise/adapters/user/adapter.go`). JIDs para os quais o
        servidor não respondeu ficam simplesmente FORA do array.
      properties:
        users:
          description: |
            Uma entrada por JID que o servidor conseguiu responder. **Sempre
            presente**, e `[]` (array vazio, nunca `null`) quando nada foi pedido
            ou nada foi resolvido — o apresentador aloca antes do laço.
          example:
            - business_name: ""
              devices:
                - 554192421234@s.whatsapp.net
              jid: 554192421234@s.whatsapp.net
              lid: 90937376170214@lid
              picture_id: ""
              push_name: ""
              status: ""
              verified_name: ""
          items:
            $ref: '#/components/schemas/InfoUtilizador'
          nullable: false
          type: array
      required:
        - users
      type: object
    LimiteHistorico:
      description: |
        Limite de gravação de MENSAGENS por conversa (coluna `users.history`) —
        apesar de as rotas se chamarem `/webhook/history`, isto não tem que ver com
        entregas de webhook (HOUSEKEEP F252).

        É a resposta de `GET /webhook/history` e das escritas. Nenhum campo vem
        `null`.
      properties:
        details:
          description: |
            Confirmação textual. **Só aparece na escrita** — na leitura a chave
            está ausente (`omitempty`), medido a 2026-08-26:
            `GET /webhook/history` devolve apenas `{"history": 100}`. Nunca
            `null`.
          example: History configured successfully
          nullable: false
          readOnly: true
          type: string
        history:
          description: |
            Quantas mensagens são gravadas por conversa. **`0` significa gravação
            desactivada.**

            **Sempre presente**, incluindo quando `0`: o campo perdeu o
            `omitempty` de propósito (F165), porque sem isso um limite desactivado
            era indistinguível de um campo que não veio. Nunca `null`.
          example: 100
          minimum: 0
          nullable: false
          readOnly: true
          type: integer
      required:
        - history
      type: object
    LinhaLista:
      description: |
        Uma linha de uma secção de `/chat/send/list`.

        **Linha sem `title` é descartada em silêncio.** Se todas as linhas de uma
        secção caírem, a secção cai também; se nenhuma secção sobreviver, a rota
        responde `400 no_valid_sections` (`send_list.go`, `normalizeRows` e
        `normalizeListSections`). `{}` e `null` dentro da lista são ambos linhas
        sem título, logo ambos descartados.
      properties:
        desc:
          description: |
            Descrição secundária, mostrada abaixo do título. Sempre opcional:
            ausente, `null`, `""` e `"   "` são indistinguíveis e dão linha sem
            descrição (também passa por `TrimSpace`).
          example: Molho de tomate, mozzarella e manjericão
          nullable: false
          type: string
        row_id:
          description: |
            Identificador devolvido na escolha.

            **Um único campo.** Antes da migração para DTO, `domain.ListRow`
            aceitava QUATRO grafias (`RowId`, `RowID`, `rowId`, `rowID`) como
            cadeia de fallback; sob a regra de nome canónico
            (`^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$`) as quatro colapsam na MESMA chave,
            `row_id` — só uma podia sobreviver (HOUSEKEEP F317). Passa por
            `TrimSpace`, logo `"   "` conta como vazio.

            Ausente, `null`, `""` ou só espaços: **o próprio título (já sem
            espaços nas pontas) vira o identificador** — nunca fica vazio no fio.
          example: margherita
          nullable: false
          type: string
        title:
          description: |
            Texto da linha. Passa por `TrimSpace` antes de ser avaliado.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | a LINHA é descartada em silêncio |
            | `null` | não | idem — indistinguível de ausente |
            | `""` | não | idem |
            | `"   "` | não | idem — aqui **há** `trim` |
            | preenchido | sim | vai no fio já sem espaços nas pontas |
          example: Pizza margherita
          nullable: false
          type: string
      type: object
    ListaBloqueados:
      description: |
        A lista de bloqueados da sessão, em `GET /user/blocklist`.

        > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
        > CÓDIGO. **Esta rota deixou de ser a excepção do envelope.** Escrevia o
        > JSON directamente para preservar o formato antigo, e por isso não trazia
        > `code`, `data` nem `success` — era a ÚNICA das 141 rotas assim, e um
        > cliente não a conseguia ler como lê as outras. Hoje passa por
        > `RespondJSON` como todas: o corpo abaixo é o conteúdo de `data`.
        > As duas chaves mudaram de nome junto (`Blocklist` → `blocklist`,
        > `DHash` → `dhash`).

        As duas chaves aparecem sempre.
      properties:
        blocklist:
          description: |
            JIDs bloqueados, em forma canónica. **Sempre presente e nunca `null`**:
            o apresentador aloca a fatia antes de a preencher, pelo que uma conta
            sem bloqueios devolve `[]` — medido. A ordem é a que o WhatsApp
            devolveu; não há garantia de ser estável entre chamadas.
          example: []
          items:
            description: JID de um contacto bloqueado, já normalizado pelo adaptador.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          nullable: false
          type: array
        dhash:
          description: |
            Hash com que o WhatsApp versiona a lista. Serve para detectar que a
            lista mudou sem a comparar entrada a entrada.

            Sempre presente; nunca `null`. Vem `""` quando o WhatsApp devolveu uma
            lista nula, e também no motor `wa-headless`, que não versiona a lista —
            não confunda `""` com "a lista não mudou".
          example: "1787412261963655"
          nullable: false
          type: string
      required:
        - blocklist
        - dhash
      type: object
    ListaCanais:
      description: |
        Resposta de `GET /newsletter/list`. Repare no envelope duplo: a carga útil é
        um objecto com a chave `newsletters`, e só dentro dela está a lista.

        **A chave era `newsletter`, no singular**, e mudou no corte a seco da
        migração para DTO: uma lista de canais nomeada no singular lê-se como um
        canal.
      properties:
        newsletters:
          description: |
            Os canais que a sessão segue.

            **Nunca é `null` nem ausente**: os dois adaptadores constroem a fatia
            com `make`, e o apresentador também, logo uma sessão sem canais devolve
            `[]`. Isto distingue-a de outras rotas desta API, onde uma lista vazia
            vem como `data: null` (F270).

            **Inclui canais com `state: deleted`** — medido a 2026-08-26 —, com os
            textos zerados e `viewer: null`. Um cliente que mostre "os meus canais"
            tem de filtrar por `state == "active"`, ou mostra entradas sem nome.

            Não há paginação, cursor nem tecto: a lista vem inteira.
          items:
            $ref: '#/components/schemas/MetadadosCanal'
          nullable: false
          type: array
      required:
        - newsletters
      type: object
    MencoesEnvio:
      description: |
        JIDs a mencionar no corpo da mensagem. O texto da menção (`@554192421234`)
        tem de estar no corpo — este campo só diz ao WhatsApp quem notificar.

        **Sempre opcional.** Ausente, `null` e `[]` são indistinguíveis entre si e
        significam "sem menções"; o use case só olha para `len()`. Os JIDs não são
        validados aqui: um JID que não exista é transportado e o cliente de quem
        recebe simplesmente não desenha a menção.

        Aceite pelas rotas com texto visível (CAP-47). As rotas sem texto próprio —
        `/chat/send/audio`, `/chat/send/sticker`, `/chat/send/location`,
        `/chat/send/contact`, `/chat/send/poll` e `/chat/send/pollvote` — não têm
        este campo no seu payload; enviá-lo lá é campo desconhecido, e é ignorado
        em silêncio.
      example:
        - 554192421234@s.whatsapp.net
      items:
        description: |
          Um JID a mencionar, em forma PN (`…@s.whatsapp.net`) ou LID (`…@lid`).
          `null` dentro da lista vira `""`, que é transportado tal e qual.
        nullable: false
        type: string
      nullable: true
      type: array
    MensagemCanal:
      description: |
        Uma publicação de canal. **Forma medida a 2026-08-26** sobre sessenta
        publicações reais de um canal público seguido, e depois REESCRITA na
        migração para DTO.

        O que mudou, e porquê:

        | antes | agora |
        |---|---|
        | `MessageServerID` | `server_id` |
        | `MessageID` | `message_id` |
        | `Type` | `type` |
        | `Timestamp`, no fuso do servidor | `timestamp`, RFC 3339 em UTC, ou `null` |
        | `ViewsCount` | `view_count` |
        | `ReactionCounts`, objecto de chaves emoji | `reactions`, **array** de `{emoji, count}` |
        | `Message`, a árvore protobuf | `text`, e mais nada |

        As duas últimas linhas são mudanças de FORMA e não renomeações, e as duas
        têm a mesma causa: a regra de nomes públicos
        (`^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$`) aplica-se a toda chave de objecto,
        recursivamente. Um emoji nunca poderá ser uma chave conforme, e as chaves de
        dentro da árvore protobuf são o camelCase do vendor (`extendedTextMessage`,
        `fileLength`, `directPath`), que não é nosso para renomear.

        **A ÁRVORE DA MENSAGEM DESAPARECEU do fio, e essa é a perda deliberada
        desta migração.** O que um cliente renderiza está em `text`; o que ele não
        podia usar era a árvore, cuja forma interna a própria medição encontrou a
        variar com o cliente que publicou.
      properties:
        message_id:
          description: |
            Identificador global da mensagem, hexadecimal maiúsculo.

            **Duas formas coexistem no mesmo canal**, medidas: 22 caracteres com
            prefixo `3EB0` (`3EB0DC0F29B6DA6AB033EE`) e 32 caracteres sem prefixo
            fixo (`ACDC1643FEA86B9C252011C9C8673FF0`). Um cliente que valide
            comprimento ou prefixo rejeita metade das publicações reais.

            Sempre presente, nunca `null`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        reactions:
          description: "As reações à publicação, uma entrada por emoji. **Nunca `null`**; `[]`\npara uma publicação sem reações.\n\n**Ordenada por contagem decrescente e, em empate, pelo emoji**, e a\nordenação não é estética: a ordem de iteração de mapa em Go é aleatória\npor desenho, então uma fatia não ordenada faria a mesma publicação\nserializar diferente a cada pedido.\n\n**Os emojis NÃO são normalizados**: o mesmo emoji aparece como entradas\nSEPARADAS conforme o selector de variação Unicode. Medido na mesma\npublicação: `\"❤\"` com 1 e `\"❤️\"` com 6, e `\"\U0001F3F3‍\U0001F308\"` com 1 ao lado de\n`\"\U0001F3F3️‍\U0001F308\"` com 1. Quem somar reações tem de normalizar antes, ou conta a\nmesma reação duas vezes.\n"
          items:
            $ref: '#/components/schemas/ReacaoDeCanal'
          nullable: false
          type: array
        server_id:
          description: |
            Identificador da publicação **dentro do canal**, atribuído pelo
            servidor. Sempre presente, nunca `null`. É o valor que
            `POST /newsletter/mark-viewed` (`server_ids`),
            `POST /newsletter/react` (`server_id`) e a paginação (`before`) pedem.

            Crescente e aparentemente contíguo dentro de um canal — medido de 4321
            a 4380 sem saltos.
          example: 4379
          nullable: false
          type: integer
        text:
          description: |
            O conteúdo legível da publicação, extraído da mensagem do protocolo.
            Nunca `null`; `""` quando não há nenhum.

            **A extracção é rasa de propósito**, e cobre as cinco formas que
            carregam texto: `conversation`, `extendedTextMessage.text` e a legenda
            de imagem, vídeo e documento. Uma publicação de outro tipo — uma
            enquete, uma localização — dá `""`, o que é honesto: a rota diz que a
            publicação existe, quando, e quantos reagiram, e não diz nada sobre
            conteúdo que não leu.

            **É o que resta da árvore protobuf**, que era servida inteira em
            `Message` e saiu do contrato. Ver a descrição do esquema.
          example: Bom dia
          nullable: false
          type: string
        timestamp:
          description: |
            Instante da publicação, em **RFC 3339 e em UTC**. Vinha com o
            deslocamento de fuso do SERVIDOR (`2026-08-25T19:22:23-04:00`), que
            fazia desta a terceira forma de data desta API; agora é a mesma de
            `created_at`.

            `null` quando o protocolo não reporta instante.
          example: "2026-08-25T23:22:23Z"
          format: date-time
          nullable: true
          type: string
        type:
          description: |
            Tipo declarado da publicação. Valores medidos: `media` (56 de 60) e
            `text` (4 de 60).

            **Não é de confiança, e a medição é explícita quanto a isso**: catorze
            publicações que só tinham texto vieram marcadas `media`. **Para saber se
            há conteúdo legível, olhe `text`, não este campo.**

            Não está declarado como enumeração porque é copiado do WhatsApp sem
            validação nossa.
          example: media
          nullable: false
          type: string
        view_count:
          description: |
            Contagem de visualizações. **Veio `0` nas sessenta publicações
            medidas**, incluindo as que tinham dezenas de reações — logo é `0` que
            se deve esperar, e o que um valor não-zero significaria **não foi
            determinado com segurança**. Sempre presente, nunca `null`.
          example: 0
          nullable: false
          type: integer
      required:
        - server_id
        - message_id
        - type
        - timestamp
        - view_count
        - reactions
        - text
      type: object
    MensagemDoHistorico:
      description: |
        Uma mensagem do histórico LOCAL. É leitura do nosso banco, não do
        WhatsApp — por isso responde com o telemóvel offline.

        Um único campo tem `omitempty` (`quoted_message_id`); todos os outros
        aparecem sempre, mesmo vazios
        (`pkg/application/contracts/chat_history_port.go:24`). Nenhum vem `null`:
        as colunas anuláveis do banco são lidas como `sql.NullString` e viram
        `""`.
      properties:
        chat_jid:
          description: |
            Conversa sob a qual a linha está arquivada. **Sempre presente, nunca
            `null`.**

            Pode DIFERIR do `chat_jid` que foi pedido: um pedido em `@lid` funde
            as linhas guardadas sob o telefone da mesma pessoa, e essas linhas
            saem com o `chat_jid` que têm gravado. Não use este campo para
            confirmar o que pediu.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        data_json:
          description: |
            O evento COMPLETO do WhatsApp, serializado como uma string de JSON —
            e não como objecto. Para o usar é preciso desserializar o valor uma
            segunda vez.

            **Sempre presente e nunca `null`**; vem `""` para linhas gravadas
            antes da migração que criou a coluna.

            É daqui que saem os sete campos do descritor de mídia que as rotas
            `/chat/download*` exigem, sob
            `Message.imageMessage` / `videoMessage` / `audioMessage` /
            `documentMessage` / `stickerMessage`. **Aviso medido**: nas 25
            mensagens de mídia de uma sessão real, `fileEncSha256` e
            `fileSha256` vinham `null` em todas — o descritor copiado daqui não
            basta para completar a descarga nesses casos.
          example: '{"Info":{"Chat":"554192421234@s.whatsapp.net","ID":"2A196F2C7F3F02A666F6"},"Message":{"imageMessage":{"URL":"https://mmg.whatsapp.net/o1/v/t24/exemplo","directPath":"/o1/v/t24/exemplo","mediaKey":"SlpkRE1hd3FWcDFa","mimetype":"image/png","fileEncSha256":"ZXhlbXBsbw==","fileSha256":"ZXhlbXBsbw==","fileLength":"74"}}}'
          nullable: false
          type: string
        id:
          description: |
            Chave da linha no banco local. Serve para ordenar e desduplicar, não
            é o id da mensagem no WhatsApp. **Sempre presente, nunca `null`.**
            Não é estável entre sessões diferentes.
          example: 22780
          nullable: false
          type: integer
        media_link:
          description: |
            Ligação para a mídia arquivada, quando o armazenamento externo (S3)
            está configurado. **Sempre presente e nunca `null`**; vem `""`
            sempre que o S3 não está ligado ou a mensagem não é de mídia — que é
            o caso normal.
          example: ""
          nullable: false
          type: string
        message_id:
          description: |
            `message_id` no WhatsApp — o valor a usar em reagir, apagar,
            favoritar e encaminhar. **Sempre presente, nunca `null`.** É a chave
            de desduplicação da fusão `@lid`/telefone, logo não se repete dentro
            de uma resposta.
          example: 2A196F2C7F3F02A666F6
          nullable: false
          type: string
        message_type:
          description: |
            Tipo da mensagem como foi classificado na gravação — `text`,
            `image`, `video`, `audio`, `document`, `sticker`. `unknown` aparece
            quando o tipo não foi reconhecido, e é um valor real e frequente.

            **Sempre presente, nunca `null`.** Não há enum fechado aqui de
            propósito: a classificação é nossa e um tipo novo do WhatsApp
            aparece como `unknown` em vez de quebrar a leitura. Trate um valor
            desconhecido como `unknown`.
          example: video
          nullable: false
          type: string
        quoted_message_id:
          description: |
            `message_id` da mensagem citada, quando esta é resposta a outra.

            **Pode não aparecer.** É o único campo desta resposta com
            `omitempty`, logo é OMITIDO quando vale `""` — o que acontece em
            toda mensagem que não cita nenhuma. Nunca vem `null`; ou vem
            preenchido, ou não vem.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        sender_jid:
          description: |
            Quem escreveu, na forma em que foi gravado. **Sempre presente, nunca
            `null`.** Pode trazer sufixo de dispositivo
            (`29343770251463:25@lid`, medido), que muda entre aparelhos da mesma
            pessoa — não o use como chave de identidade.
          example: 5516981818244@s.whatsapp.net
          nullable: false
          type: string
        text_content:
          description: |
            Texto ou legenda, quando existe. **Sempre presente e nunca `null`**
            — não tem `omitempty`, e a coluna anulável do banco é lida como
            `""`. Vem `""` para mídia sem legenda.

            Não há `trim`: uma mensagem de três espaços chega aqui como
            `"   "` (medido).
          example: bateria video real
          nullable: false
          type: string
        timestamp:
          description: |
            Instante da mensagem. **Sempre presente, nunca `null`.** É a chave
            de ordenação (mais recente primeiro). Vem no fuso local do servidor,
            e não em UTC — medido: `2026-08-26T09:08:10.351982-04:00`.
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          nullable: false
          type: string
        user_id:
          description: |
            Sessão a que a linha pertence — 32 caracteres hexadecimais. Sempre
            presente, nunca `null`. É sempre a sessão do token que chamou: a
            consulta filtra por ela.
          example: 918e37366f27e1125ee0482a793267e1
          nullable: false
          type: string
      required:
        - id
        - user_id
        - chat_jid
        - sender_jid
        - message_id
        - timestamp
        - message_type
      type: object
    MensagensCanal:
      description: |
        Resposta de `POST /newsletter/messages` e de `POST /newsletter/updates`.

        **As publicações passaram a vir EMBRULHADAS** na chave `messages`; antes a
        lista ocupava `data` directamente, o que fazia desta a única rota da família
        sem chave nomeada.

        Ordenada da mais antiga para a mais recente dentro da janela pedida
        (`server_id` crescente), e a janela é as últimas `count` publicações.
      properties:
        messages:
          description: |
            As publicações. Um canal sem publicações devolve `[]`, nunca `null`.
          items:
            $ref: '#/components/schemas/MensagemCanal'
          nullable: false
          type: array
      required:
        - messages
      type: object
    MetadadosCanal:
      description: |
        Metadados de um canal, dentro da chave `newsletter` de
        `POST /newsletter/create`, `POST /newsletter/info` e
        `POST /newsletter/info-invite`, e dentro de `newsletters[]` de
        `GET /newsletter/list`.

        **Esta forma foi REESCRITA na migração para DTO (2026-08-27).** Antes dela a
        resposta era a struct do vendor serializada directamente, o que tinha duas
        consequências: os números vinham como texto entre aspas (`"1787746245"`,
        `"0"`), e a forma dependia do MOTOR da sessão — o motor headless servia
        `{"JID":…,"Subscribers":…,"Membership":…}` na mesma rota. As duas
        desapareceram; ver `docs/HTTP-DTO-CONVENTIONS.md`.

        O que mudou, campo a campo:

        | antes | agora |
        |---|---|
        | `id` | `jid` |
        | `state: {type: "active"}` | `state: "active"` |
        | `thread_metadata.creation_time: "1787746245"` | `created_at: "2026-…Z"` ou `null` |
        | `thread_metadata.invite` | `invite_code` |
        | `thread_metadata.name.update_time: "0"` | `name.updated_at: null` |
        | `thread_metadata.subscribers_count: "0"` | `subscriber_count: 0` |
        | `thread_metadata.verification` | `verification_state` |
        | `thread_metadata.settings.reaction_codes.value` | `reactions_mode` |
        | `viewer_metadata: {mute, role}` | `viewer: {mute_state, role}` |
        | `thread_metadata.picture` / `preview` | `picture` / `preview`, no topo |

        **Todos os campos aparecem SEMPRE** — não há `omitempty` em campo nenhum
        desta resposta. Os que podem vir `null` são `created_at`, os dois
        `updated_at`, `picture`, `preview` e `viewer`, e cada um diz abaixo o que o
        `null` significa.
      properties:
        created_at:
          description: |
            Instante de criação, em **RFC 3339 e em UTC**. Era `creation_time`, um
            inteiro Unix embrulhado em aspas.

            **`null` quando o canal não reporta instante nenhum** — canal apagado
            ou inexistente, e todo canal visto pelo motor headless. Era `"0"` nesses
            casos, que é uma data válida em Unix: quem convertesse sem verificar
            `state` mostrava "1 de Janeiro de 1970". `null` não tem essa leitura.
          example: "2026-08-26T12:40:54Z"
          format: date-time
          nullable: true
          type: string
        description:
          $ref: '#/components/schemas/TextoDeCanal'
        invite_code:
          description: |
            Código do convite público, o mesmo que `POST /newsletter/info-invite`
            aceita. **Vem `""`** em canal apagado, inexistente, ou visto pelo motor
            headless; nunca `null`, nunca ausente.
          example: 0029Vb85MPpKLaHoEUxRt01E
          nullable: false
          type: string
        jid:
          description: |
            JID do canal, no servidor `@newsletter`. **Vem `""` — não `null`, não
            ausente — quando o canal pedido não existe**, e nesse caso `state` é
            `non_existing` e o estado HTTP continua a ser `200`. Medido a
            2026-08-26 com o JID de um canal apagado.

            Um cliente que ecoe `jid` sem verificar `state` mostra uma cadeia vazia
            ao utilizador.
          example: 120363411025775186@newsletter
          nullable: false
          type: string
        name:
          $ref: '#/components/schemas/TextoDeCanal'
        picture:
          allOf:
            - $ref: '#/components/schemas/ImagemDeCanal'
          description: |
            Descritor da imagem de perfil, **ou `null`**.

            | rota | o que foi medido |
            |---|---|
            | `GET /newsletter/list` | `null` em TODOS os canais, incluindo os que têm imagem |
            | `POST /newsletter/info` | objecto preenchido para o MESMO canal |
            | canal apagado | `null` nas duas |
            | motor headless | `null` sempre — a página não reporta imagem nesta capacidade |

            **`null` aqui não significa "canal sem imagem"** — significa "esta rota
            não a trouxe".
          nullable: true
        preview:
          allOf:
            - $ref: '#/components/schemas/ImagemDeCanal'
          description: |
            Descritor da pré-visualização, com a **mesma forma** de `picture`.

            Ao contrário de `picture`, veio como objecto (nunca `null`) em todas as
            medições do motor wa-noise, incluindo `GET /newsletter/list` e canal
            apagado — e a assimetria é PRESERVADA de propósito em vez de suavizada:
            colapsar as duas para "null quando vazio" afirmaria que o canal não tem
            pré-visualização, coisa que o protocolo nunca disse. `null` no motor
            headless.
          nullable: true
        reactions_mode:
          description: |
            Que reações o canal aceita. Era
            `thread_metadata.settings.reaction_codes.value`, três níveis de objecto
            para uma folha.

            `ALL` em todos os canais activos medidos, `""` em canal apagado e no
            motor headless. **Não é enumeração validada** — é copiado do WhatsApp,
            em MAIÚSCULAS como o protocolo o escreve, e um valor novo é devolvido
            tal e qual. Nós não verificamos o emoji de `POST /newsletter/react`
            contra este campo.
          example: ALL
          nullable: false
          type: string
        state:
          description: |
            Estado do canal do ponto de vista do servidor, **como texto** — era um
            objecto de uma chave (`state.type`), e o nível intermédio não carregava
            informação nenhuma.

            | valor | quando aparece |
            |---|---|
            | `active` | canal em funcionamento |
            | `deleted` | apagado, **mas ainda listado** em `GET /newsletter/list`, com os textos zerados e `viewer: null` |
            | `non_existing` | o que `POST /newsletter/info` devolve para um canal apagado ou que nunca existiu |
            | `""` | o motor **headless** não reporta estado nenhum, e um estado inventado seria pior que a ausência |

            Os três primeiros foram medidos a 2026-08-26. **A lista não está
            fechada por enumeração no código**: é um campo de resposta copiado do
            WhatsApp, sem validação nossa. Um valor desconhecido é devolvido tal e
            qual.

            **Ao filtrar "os meus canais", filtre por `active`**, e não por
            "diferente de `deleted`": um valor novo passaria pelo segundo teste.
          example: active
          nullable: false
          type: string
        subscriber_count:
          description: |
            Número de seguidores, **como inteiro**. Era `subscribers_count`, texto.
            Nunca `null`, nunca ausente.

            **Ressalva medida, e ela não mudou com a migração**: veio `0` em todos
            os canais observados pelo motor wa-noise, incluindo um canal público de
            terceiro com milhares de seguidores. O que este campo significa quando
            não é zero **não foi determinado com segurança** nesse motor. O motor
            headless reporta a contagem que a página mostra.
          example: 0
          nullable: false
          type: integer
        verification_state:
          description: |
            Estado de verificação do canal. Valores observados: `unverified` (canal
            comum), `verified` (verificado pelo WhatsApp) e `""` (canal apagado ou
            inexistente, no motor wa-noise).

            **O motor headless nunca responde `""` aqui**, e a diferença é uma
            decisão registada: a página responde um BOOLEANO, que não tem terceiro
            estado, e o falso dela é traduzido para `unverified`. Nesse motor,
            portanto, "não verificado" e "desconhecido" são a mesma resposta.

            Não está declarado como enumeração: é um campo de resposta copiado do
            WhatsApp, sem validação nossa, e `""` já mostra que o conjunto não é
            fechado.
          example: unverified
          nullable: false
          type: string
        viewer:
          allOf:
            - $ref: '#/components/schemas/RelacaoComCanal'
          description: |
            O que este canal é **para quem chamou**. Era `viewer_metadata`.

            **Vem `null`** quando o chamador não tem relação com o canal. Medido
            `null` em três situações distintas: `POST /newsletter/info-invite` sobre
            um canal próprio, entrada com `state: deleted` dentro de
            `GET /newsletter/list`, e `POST /newsletter/info` sobre canal apagado.
          nullable: true
      required:
        - jid
        - state
        - created_at
        - invite_code
        - name
        - description
        - subscriber_count
        - verification_state
        - reactions_mode
        - picture
        - preview
        - viewer
      type: object
    PaginaDeConversas:
      description: |
        Uma página da lista de conversas, ordenada da interação mais recente para
        a mais antiga. NÃO traz mensagens — a lista existe para ordenar
        conversas.

        Os quatro campos não têm `omitempty` (`pkg/domain/user.go:290`), logo
        aparecem **sempre** e nenhum vem `null`.
      properties:
        chats:
          description: |
            As conversas desta página, já ordenadas. **Sempre presente e nunca
            `null`**: uma página vazia é `[]`, medido com `offset` além do fim.
            Pode ter menos elementos que `limit` na última página.
          items:
            $ref: '#/components/schemas/ResumoDeConversa'
          nullable: false
          type: array
        limit:
          description: |
            Tamanho da página realmente aplicado, DEPOIS da correcção de faixa —
            não é o que foi pedido. Medido: `limit=0`, `limit=-5`, `limit=abc` e
            `limit` ausente devolvem todos `50`; `limit=9999` devolve `500`.
            Sempre presente, nunca `null`.
          example: 50
          maximum: 500
          minimum: 1
          nullable: false
          type: integer
        offset:
          description: |
            Deslocamento realmente aplicado. Um `offset` negativo é corrigido
            para `0` e é o `0` que volta aqui; um `offset` além do fim NÃO é
            corrigido — volta tal e qual, com `chats: []` (medido com
            `offset=999999`). Sempre presente, nunca `null`.
          example: 0
          minimum: 0
          nullable: false
          type: integer
        total:
          description: |
            Total de conversas conhecidas, independente da página pedida. Sempre
            presente, nunca `null`. `0` significa mesmo "nenhuma conversa".
          example: 384
          minimum: 0
          nullable: false
          type: integer
      required:
        - chats
        - total
        - limit
        - offset
      type: object
    ParticipanteGrupoCanonico:
      description: |
        Um membro do grupo, na forma CANÓNICA — chaves em `snake_case` minúsculo,
        produzidas por um apresentador escrito à mão
        (`pkg/presentation/http/dto/group/presenter.go`) e não pela serialização
        directa da struct de protocolo.

        É a forma que `POST /group/info` devolve. As outras rotas desta família
        ainda devolvem `ParticipanteGrupo`, com os nomes do Go — a migração é
        família a família, e esta é a primeira.

        **Todas as propriedades aparecem SEMPRE**: o DTO não usa `omitempty` em
        campo nenhum, de propósito. Ler este objecto nunca exige verificar
        ausência — exige verificar VAZIO.
      properties:
        display_name:
          description: |
            Só vem preenchido para participantes anónimos de grupos em modo
            anúncio; `""` é a forma normal de "não se aplica".
          example: ""
          nullable: false
          type: string
        is_admin:
          description: |
            Administrador do grupo. `false` significa "não é administrador", e não
            "não se sabe".
          example: false
          nullable: false
          type: boolean
        is_super_admin:
          description: Criador do grupo. Um super-administrador é também administrador.
          example: false
          nullable: false
          type: boolean
        jid:
          description: |
            Identificador a usar para falar com este participante. É sempre igual
            a `lid` ou a `phone_number` — nunca uma terceira forma. `""` quando o
            WhatsApp não o deu.
          example: 90937376170214@lid
          nullable: false
          type: string
        lid:
          description: |
            O identificador opaco do participante. `""` num grupo cujo modo de
            endereçamento não seja `lid`.
          example: 90937376170214@lid
          nullable: false
          type: string
        phone_number:
          description: O número, em forma PN. `""` num participante que só tenha LID.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - jid
        - phone_number
        - lid
        - display_name
        - is_admin
        - is_super_admin
      type: object
    ParticipantesComunidade:
      description: |
        Resposta de `POST /community/participants`. A lista está dentro da chave
        `participants`, um nível abaixo de `data`.
      properties:
        participants:
          description: |
            Os participantes de **todos** os grupos ligados, reunidos numa lista
            só, em **LID** — medido a 2026-08-26. Quem precisar do número tem de
            resolver o LID por outra rota; **esta não devolve PN**.

            **Não foi determinado com segurança** se a lista traz duplicados
            quando a mesma pessoa está em dois sub-grupos: a comunidade medida
            tinha um só sub-grupo. Trate a lista como podendo repetir.

            **Sempre `[]`, nunca `null`**: `PresentGetCommunityParticipants`
            (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
            antes do laço, mesmo vazia — fecha a incerteza sobre `null` que este
            ficheiro registava antes da migração para DTO, quando o campo ainda
            era `any` na struct de resultado.

            Sem paginação e sem tecto.
          example:
            - 90937376170214@lid
            - 29343770251463@lid
          items:
            description: |
              LID de um participante (`<opaco>@lid`). Nunca `null` dentro da lista
              nos casos medidos; nunca em PN.
            nullable: false
            type: string
          nullable: false
          type: array
      required:
        - participants
      type: object
    PedidoAdminCanal:
      description: |
        Pedido das operações que apontam para OUTRO utilizador: convidar para
        administrador (`/newsletter/admin-invite`), revogar esse convite
        (`/newsletter/admin-invite/revoke`), despromover (`/newsletter/demote`) e
        transferir a posse (`/newsletter/change-owner`).

        São as únicas quatro das dezoito que exigem `user_jid`.
      properties:
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid`, e é verificado **antes** de `user_jid`. Ver
            `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        user_jid:
          description: |
            JID do utilizador alvo. Aceita **PN ou LID**.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_user_jid` |
            | `null` | não | `400 missing_user_jid` — indistinguível de ausente |
            | `""` | não | `400 missing_user_jid` — indistinguível de ausente |
            | PN (`…@s.whatsapp.net`) | sim | convertido para LID antes do envio |
            | LID (`…@lid`) | sim | usado tal e qual |
            | texto não interpretável | passa a validação | `500 newsletter_failed` — a falha de `wajid.ToJID` não vira `400` |

            **A mensagem do `400` muda com a rota, embora o código não mude.**
            Todas as quatro devolvem `missing_user_jid`, com quatro textos
            diferentes — medidos:

            | rota | `message` |
            |---|---|
            | `/newsletter/admin-invite` | `invitee jid is required` |
            | `/newsletter/admin-invite/revoke` | `invitee jid is required for revoke` |
            | `/newsletter/demote` | `user jid is required for demote` |
            | `/newsletter/change-owner` | `new owner jid is required` |

            Quem discrimina pela mensagem em vez do código parte quando o texto
            mudar; o código é o contrato.

            **A conversão PN→LID é direccional** (`adapter.go:489`, F233c): um LID
            nunca é convertido de volta para PN. Se o armazenamento da sessão não
            conhecer o número, o JID segue como está, é registado um aviso no log,
            e é o WhatsApp que recusa — **não há erro nosso nesse caso**.
          example: 90937376170214@lid
          minLength: 1
          nullable: false
          type: string
      required:
        - jid
        - user_jid
      type: object
    PedidoAnuncioGrupo:
      description: |
        Alterna o modo em que só administradores enviam mensagens. O corpo é
        `dtogroup.SetGroupAnnounceRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
        `announce`.

        **O manipulador não valida campo nenhum.**
      properties:
        announce:
          default: false
          description: |
            `true` fecha o grupo à escrita de não-administradores.

            | estado | efeito |
            |---|---|
            | ausente | **ABRE o grupo** — o valor zero de um `bool` Go é `false`, e `false` aqui é uma ACÇÃO |
            | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
            | `false` | abre o grupo |
            | `true` | fecha o grupo |

            **Não é consulta.** Um pedido só com o grupo, escrito por quem
            esperava "não decidi", DESLIGA o modo anúncio. É o mecanismo da F268
            num booleano: o campo devia ser `*bool` para que ausente e `false` se
            distinguissem. Para LER o estado, use `IsAnnounce` de
            `POST /group/info`.
          example: true
          nullable: false
          type: boolean
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
            parser: **medido `400 invalid_jid`, `could not parse JID ""`** —
            envelope NOVO. `chat` cobre a ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
      type: object
    PedidoApagarCanal:
      description: |
        Pedido de eliminação de canal, em `DELETE /newsletter/delete` — **é a única
        rota deste grupo que não é `POST`**. Exige confirmação explícita:
        `confirm_jid` tem de ser idêntico a `jid`.
      properties:
        confirm_jid:
          description: |
            Repetição literal de `jid`. A validação tem **dois ramos**, e ambos
            devolvem o mesmo código (`newsletter_ops.go:266`):

            ```go
            r.ConfirmJID == "" || r.ConfirmJID != r.JID
            ```

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_confirm_jid` — ramo `== ""` |
            | `null` | não | `400 missing_confirm_jid` — indistinguível de ausente |
            | `""` | não | `400 missing_confirm_jid` — indistinguível de ausente |
            | diferente de `jid` | não | `400 missing_confirm_jid` — ramo `!= r.JID`, **e o código diz `missing` para um campo que foi enviado** |
            | igual a `jid` | sim | o canal é apagado, **irreversivelmente** |

            Os três primeiros ramos foram medidos, e o quarto também
            (`confirm_jid` de outro canal existente). Repare que a comparação é
            **literal**: dois JID que apontem para o mesmo canal com grafia
            diferente não passam, porque não há normalização antes da comparação.

            **Enquanto a confirmação falhar, o WhatsApp NEM É CONTACTADO.** A
            validação corre no use case, antes do despacho — logo um `400` daqui
            garante que nada foi apagado.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        jid:
          description: |
            JID do canal a apagar. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid`, e é verificado **antes** de `confirm_jid` — medido:
            `{"confirm_jid":"x"}` revela `missing_jid`, não `missing_confirm_jid`.
            Ver `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
      required:
        - jid
        - confirm_jid
      type: object
    PedidoApagarMensagem:
      description: |
        Revoga ("apagar para todos") uma mensagem própria. `phone` é o destino da
        conversa; `chat` é aceite como alias e só vale quando `phone` faltar.

        **Ordem das recusas, medida**: `missing_phone` → `missing_id` →
        `invalid_phone`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            Nome universal do destino. Só vale quando `phone` estiver ausente,
            `null` ou `""`; caso contrário é ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        id:
          description: |
            `message_id` da mensagem a revogar. Ausente, `null` e `""` dão todos
            `400 missing_id` (medido). Um id INEXISTENTE não é recusado: o
            WhatsApp aceita a revogação e nada acontece do outro lado.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        phone:
          description: |
            JID ou número da conversa onde a mensagem foi enviada. Ausente,
            `null` e `""` são o mesmo estado e fazem cair para `chat`; sem os
            dois é `400 missing_phone` (medido), e mal formado é
            `400 invalid_phone` (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - id
      type: object
    PedidoArquivarConversa:
      description: |
        Arquiva ou desarquiva uma conversa. O destino é `jid`; `chat` é aceite
        como nome universal e só vale quando `jid` vier ausente ou vazio.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        archive:
          description: |
            `true` arquiva, `false` desarquiva.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | vale `false` — **DESARQUIVA** |
            | `null` | sim | vale `false`, indistinguível de ausente |
            | `false` | sim | desarquiva |
            | `true` | sim | arquiva |

            É `bool` não-ponteiro, logo não existe "não decidi": omitir o campo
            é pedir o desarquivamento, com `200 "Chat unarchived"`.
          example: true
          nullable: false
          type: boolean
        chat:
          description: |
            Nome universal do destino. Só é usado quando `jid` estiver ausente,
            `null` ou `""` — os três são o mesmo estado. `jid` preenchido tem
            precedência e `chat` é então ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        jid:
          description: |
            JID da conversa — contacto, grupo ou canal.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | depende | cai para `chat`; sem os dois é `400 missing_jid` |
            | `null` | depende | idêntico a ausente — o campo é `string`, não ponteiro |
            | `""` | depende | idêntico a ausente |
            | `"   "` | sim (chega ao resolvedor) | `400 invalid_chat_jid`; não há `trim` |
            | preenchido mal formado | não | `400 invalid_chat_jid` |
            | JID válido | sim | — |
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - archive
      type: object
    PedidoAtualizacoesCanal:
      description: |
        Pedido de ATUALIZAÇÕES de mensagens já conhecidas — edições, contagens de
        reação, remoções. **Rota inoperante**: devolve `500` ao fim de 30 s em
        todos os casos medidos (F265). Ver a descrição da rota.
      properties:
        after:
          description: |
            `server_id` a partir do qual avançar, como texto. Tem exactamente a
            mesma semântica de `before` em `PedidoMensagensCanal`, incluindo o
            `TrimSpace` e o **descarte silencioso** de texto não numérico, que vira
            `0`. Ausente, `null` e `""` são indistinguíveis.
          example: "104"
          nullable: false
          type: string
        count:
          description: |
            Quantas atualizações trazer. Ausente, `null` e `0` são indistinguíveis
            entre si e fazem o adaptador omitir o atributo do pedido.

            **O efeito de `count` nesta rota não foi determinado com segurança**:
            a rota devolve `500` com qualquer valor, incluindo `2`, logo não há
            como distinguir a falha do campo da falha da rota. Em
            `/newsletter/messages`, que partilha o mesmo mecanismo, `count`
            ausente ou zero é o que causa o `500` — a hipótese razoável é que aqui
            seja igual, mas **é hipótese, não medição**.
          example: 5
          nullable: false
          type: integer
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid` e são indistinguíveis. Ver `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        since:
          description: |
            Instante mínimo, em RFC 3339.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | instante zero — sem limite inferior |
            | `null` | sim | idem — indistinguível de ausente |
            | `""` | sim | idem: só se tenta interpretar quando o valor é não-vazio (`dto/newsletter/request.go`) |
            | mal formatado | **não** | `400 invalid_since` |
            | tipo não-texto | não | `400 could_not_decode_payload` |

            **É o único campo das dezoito rotas validado no DTO DE PEDIDO, antes do
            use case.** Tudo o resto que estas rotas exigem depende de QUAL
            operação a rota carrega, e essa tabela vive no use case
            (`newsletterRequirements`); duplicar uma linha dela aqui daria dois
            sítios a decidir o mesmo código de erro. `since` é diferente porque é um
            FORMATO que o cliente pode errar, independente da operação.

            ```json
            {"code": 400, "error": {"code": "invalid_since", "message": "since must be an RFC 3339 instant"}, "success": false}
            ```

            **O código era `invalid_request`** — o genérico do estado, que só diz
            "algo estava mal" — até esta validação passar pela taxonomia `apperr`
            na migração para DTO de 2026-08-27. (E antes disso a recusa saía com
            `error` em TEXTO em vez de objecto: era a F266, e já não existe.)
          example: "2026-08-26T00:00:00Z"
          format: date-time
          nullable: false
          type: string
      required:
        - jid
      type: object
    PedidoAtualizarParticipantes:
      description: |
        Adiciona ou remove membros. O corpo é
        `dtogroup.UpdateGroupParticipantsRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `group_jid`, `phone` e
        `action`.

        **A ORDEM da validação importa e é surpreendente**
        (`handler_group_mgmt.go:289-304`): `phone` → entrada vazia de `phone` →
        `action` → `group_jid`. Um pedido a que falte TUDO queixa-se primeiro dos
        telefones, e o grupo é o ÚLTIMO a ser exigido.

        **As quatro recusas do manipulador saem no mesmo corpo**
        `{"code":400,"error":{"code":"invalid_request","message":"Requisição inválida."},"success":false}`
        — nenhuma delas tem código próprio. Só as recusas que atravessam o use
        case — `invalid_jid`, `invalid_action` — trazem um `error.code`
        específico.

        Veja a limitação de `Action`: promover e despromover NÃO estão nesta rota.
      properties:
        action:
          description: |
            O que fazer com os participantes indicados.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request`, e só depois de `phone` passar |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `add` / `remove` | sim | — |
            | `ADD` | **não** | `400 invalid_action` — medido; **é sensível a maiúsculas** |
            | `promote` / `demote` | **não** | `400 invalid_action` — medido |
            | qualquer outro valor | não | `400 invalid_action`, envelope NOVO, com o valor citado: `unknown participant action "promote" (must be "add" or "remove")` |

            **Valor fora da lista é sempre RECUSADO**, nunca ignorado nem tratado
            como padrão. Não há valor por omissão.

            A biblioteca por baixo sabe promover e despromover há anos
            (`internal/wa-noise/capabilities/group/participants.go:18-19`); a
            rota é que não o expõe. Está registado como F263 no `HOUSEKEEP.md`, e
            a consequência é concreta: **por esta API não há forma de dar nem de
            tirar administrador a ninguém.**
          enum:
            - add
            - remove
          example: add
          nullable: false
          type: string
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio —
            medido a funcionar nesta rota. Ausente, `null` e `""` são
            indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Obrigatório, mas validado **DEPOIS** de `Phone` e de
            `Action`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não — salvo se `chat` vier | `400 invalid_request`, e só depois de `phone` e `action` passarem |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `"   "` | passa a guarda | `400 invalid_jid` (envelope NOVO) — medido |
            | `120363411669320145@g.us` | sim | — |
          example: 120363411669320145@g.us
          nullable: false
          type: string
        phone:
          description: |
            Quem entra ou sai. **É o PRIMEIRO campo validado.**

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` |
            | `null` | não | **indistinguível de ausente** — medido |
            | `[]` | não | **indistinguível de ausente** — a guarda é `len(...) < 1` |
            | `[""]` | não | `400 invalid_request`; o log diz o ÍNDICE, a resposta não |
            | `["554192421234", ""]` | não | recusa a lista INTEIRA — **não há descarte silencioso de item** |
            | `["   "]` | passa a guarda | `400 invalid_jid`, `could not parse JID "   "` — medido |
            | `["554192421234"]` | **sim** | número nu é aceite — medido a passar da resolução |
            | `["554192421234@s.whatsapp.net"]` | sim | — |

            **Aceita o número nu**, o que é uma diferença face a
            `POST /group/updaterequestparticipants`, que exige o JID completo.

            Duplicados não são detectados por esta API. A ordem não é
            significativa.
          example:
            - 554192421234@s.whatsapp.net
          items:
            description: |
              Número nu ou JID completo do participante. Nunca `null` — um `null`
              dentro da lista vira `""` e é recusado como entrada vazia, com o
              índice no log.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          minItems: 1
          nullable: false
          type: array
      required:
        - group_jid
        - phone
        - action
      type: object
    PedidoAvatar:
      description: |
        De quem se quer a foto. **Esta rota LÊ** — não altera a foto da conta,
        apesar de ser `POST`. O `POST` existe só porque o alvo vai no corpo.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        chat:
          description: |
            Nome universal do destino (F225), aceite em toda rota com destinatário.
            É copiado para `phone` **apenas quando `phone` está vazio**
            (`domain.ResolveChatField`, chamado pelo DTO de pedido em
            `pkg/presentation/http/dto/user/request.go`), logo `phone` ganha
            quando os dois vierem.

            Ausente, `null` e `""` são indistinguíveis: os três deixam `phone` sem
            substituto, e o pedido morre em `400 missing_phone`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        phone:
          description: |
            Contacto de quem se quer a foto. Aceita número nu, JID de telefone ou
            LID — a resolução é leniente (`ResolveJID`) e aplica o servidor por
            omissão quando falta o `@`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_phone` |
            | `null` | não | `400 missing_phone` — indistinguível de ausente |
            | `""` | não | `400 missing_phone` — indistinguível de ausente |
            | `"   "` | **não, mas com outro código** | `400 invalid_phone`: a guarda é `phone == ""`, e três espaços não são a cadeia vazia — **não há `trim` aqui** |
            | `"lixo"` | não | `400 invalid_phone` |
            | `123` (número) | não | `400 could_not_decode_payload` |
            | preenchido | sim | — |

            A diferença entre `missing_phone` e `invalid_phone` para `""` e `"   "`
            é observável e não é decorativa: diz se o campo chegou vazio ou se
            chegou com lixo.
          example: 554192421234@s.whatsapp.net
          minLength: 1
          nullable: false
          type: string
        preview:
          default: false
          description: |
            `true` devolve a miniatura; `false` devolve a imagem em tamanho cheio.

            **Ausente, `null` e `false` são o mesmo pedido** — o campo é `bool` sem
            `*`, e isso é DELIBERADO: "não pedi" e "pedi false" significam a mesma
            coisa aqui, que é "dá-me a imagem inteira". As rotas em que a diferença
            importa usam ponteiro.
            Aqui isso é inofensivo, porque `false` é o padrão inerte e não uma
            acção; noutras rotas desta API o mesmo mecanismo é perigoso (ver a
            secção 4.2 do contrato arquitectural).

            Tipo errado (`"true"` em vez de `true`) dá `400
            could_not_decode_payload`.
          example: true
          nullable: false
          type: boolean
      required:
        - phone
      type: object
    PedidoBloqueio:
      description: |
        Quem bloquear ou desbloquear. Basta UM dos dois campos: `jid` tem
        precedência, e `phone` é usado quando `jid` vem vazio.

        > **Nota da migração de DTO (2026-08-27).** Os campos chamavam-se `Phone` e
        > `JID`. A chave canónica é a minúscula, e é a única documentada. A
        > maiúscula continua a funcionar por uma propriedade do `encoding/json` do
        > Go — que casa nomes de campo sem distinguir a caixa —, não por decisão
        > nossa; está medido em
        > `pkg/presentation/http/dto/user/request_test.go`. Não conte com ela.

        **Ao contrário do resto da API, aqui HÁ `trim`**: os dois campos passam por
        `strings.TrimSpace` no caso de uso antes da verificação de vazio, logo
        `"   "` conta como ausente para a RESOLUÇÃO. Repare que a validação de
        fronteira, essa, não faz `trim` — `{"phone":"   "}` passa por ela e é o
        caso de uso que o recusa, com o mesmo código.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        chat:
          description: |
            Nome universal do destino (F225). É copiado para `phone` **apenas
            quando `phone` está vazio** (`domain.ResolveChatField`, chamado pelo
            DTO de pedido), e nunca ganha de `jid`. Ausente, `null` e `""` são
            indistinguíveis — medido: `{"chat":""}` dá `400 missing_phone_or_jid`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        jid:
          description: |
            Contacto em forma de JID. **Tem precedência sobre `phone`**: quando os
            dois vierem preenchidos, `phone` é ignorado sem aviso.

            Tabela dos estados, medida com pedidos que a validação recusa (nenhum
            chegou a bloquear ninguém):

            | corpo | efeito |
            |---|---|
            | `{}` | `400 missing_phone_or_jid` |
            | `{"phone":null,"jid":null}` | `400 missing_phone_or_jid` — indistinguível de ausente |
            | `{"phone":"","jid":""}` | `400 missing_phone_or_jid` — idem |
            | `{"phone":"   "}` | `400 missing_phone_or_jid` — **há `trim` no caso de uso** |
            | `{"jid":"   "}` | `400 missing_phone_or_jid` — idem |
            | `{"phone":"lixo"}` | `400 invalid_phone_or_jid` |
            | `{"phone":123}` | `400 could_not_decode_payload` |

            Repare que a recusa é a MESMA para os dois campos: o código de erro não
            diz qual dos dois estava mal.
          example: 90937376170214@lid
          nullable: false
          type: string
        phone:
          description: |
            Contacto. A resolução é LENIENTE por decisão registada na F203: um
            número nu (`554192421234`) é aceite, porque um campo chamado `phone`
            que exigisse `@s.whatsapp.net` seria contrato surpreendente.

            Usado só quando `jid` vem vazio.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      type: object
    PedidoCanal:
      description: |
        Pedido mínimo de canal: só o identificador. É a forma de `info`, `follow`,
        `unfollow`, `mute` (sem o `mute`), `subscribe` e `admin-invite/accept`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        jid:
          description: |
            JID do canal, sempre no servidor `@newsletter`. **Obrigatório em
            catorze das dezoito operações** — todas menos `create` (que não tem
            canal ainda) e `info-invite` (que usa o código do convite).

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_jid` |
            | `null` | não | `400 missing_jid` — **indistinguível de ausente** |
            | `""` | não | `400 missing_jid` — **indistinguível de ausente** |
            | `"   "` | não | `400 invalid_newsletter_jid` — corrigido em 2026-08-26 (F271); até essa data dava `500` |
            | `"nao-e-jid"` | não | `400 invalid_newsletter_jid` |
            | `"…@s.whatsapp.net"` | não | `400 invalid_newsletter_jid` — o servidor tem de ser `@newsletter` |
            | tipo não-texto | não | `400 could_not_decode_payload` |
            | `@newsletter` bem formado mas inexistente | **sim** | `200`, com `state: non_existing` e `jid: ""` — **não é erro** |
            | `@newsletter` real | sim | — |

            **A penúltima linha é a armadilha desta rota**: pedir metadados de um
            canal que nunca existiu devolve `200`, não `404`. Quem consome tem de
            olhar `state`, não o código HTTP.

            **O alias `chat` não é aceite aqui.** `{"chat":"…"}` devolve
            `400 missing_jid`, medido.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          pattern: ^[0-9]+@newsletter$
          type: string
      required:
        - jid
      type: object
    PedidoCanalPorConvite:
      description: |
        Pedido de metadados a partir do CÓDIGO de convite, não do JID. O código é a
        parte final do link público (`https://whatsapp.com/channel/<código>`), e é
        enviado nu.
      properties:
        invite:
          description: |
            Código do convite, 24 caracteres alfanuméricos nos casos observados.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_invite` |
            | `null` | não | `400 missing_invite` — indistinguível de ausente |
            | `""` | não | `400 missing_invite` — indistinguível de ausente |
            | `"   "` | passa a validação | mas o WhatsApp não responde e sai `500 newsletter_failed`. Medido |
            | código inexistente | passa a validação | `500 newsletter_failed` — **não é `404`**. Medido com `"codigo-que-nao-existe"` |
            | código real | sim | — |

            Não passa pela conversão de JID de propósito (`adapter.go:269`):
            tratá-lo como JID falharia com uma mensagem sobre JID inválido, que
            manda quem investiga para o lado errado.
          example: 0029Vb85MPpKLaHoEUxRt01E
          minLength: 1
          nullable: false
          type: string
      required:
        - invite
      type: object
    PedidoComunidade:
      description: |
        Pedido de leitura sobre uma comunidade: `POST /community/subgroups` e
        `POST /community/participants`.

        **É o único par de rotas deste ficheiro que aceita o alias universal
        `chat`** — as quatro rotas de canal e as duas de ligação não o aceitam.
        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            Alias universal de destino (`ChatTarget`, `pkg/domain/chat_target.go`).

            **Só é usado quando `community_jid` estiver vazio** — ausente, `null`
            ou `""`, que são indistinguíveis entre si. Quando ambos vêm
            preenchidos, **`community_jid` ganha e `chat` é ignorado em
            silêncio**: medido a 2026-08-26 mandando `community_jid` real e
            `chat: "outro@g.us"`, e a resposta foi a da comunidade de
            `community_jid`. Não há erro de conflito.

            Ausente, `null` e `""` são indistinguíveis; se `community_jid` também
            faltar, a resposta é `400 missing_community_jid`.

            **Este alias NÃO existe em `/community/link` nem em
            `/community/unlink`** — medido: `{"chat":"…","group_jid":"…"}` devolve
            `400 missing_community_jid`.
          example: 120363430034334401@g.us
          nullable: false
          type: string
        community_jid:
          description: |
            JID da comunidade — que é um JID de **GRUPO** (`@g.us`), porque uma
            comunidade é um grupo-pai. Não existe servidor `@community`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | ver `chat` | `400 missing_community_jid` **se `chat` também faltar** |
            | `null` | ver `chat` | idem — indistinguível de ausente |
            | `""` | ver `chat` | idem — **e é este estado que faz o alias `chat` entrar** |
            | `"   "` | não | `400 invalid_community_jid`, `could not parse community JID "   "` |
            | `"lixo"` | não | `400 invalid_community_jid` |
            | `@g.us` real | sim | — |

            **Repare na diferença para as rotas de canal**: aqui um JID malformado
            dá `400` com código próprio, porque o use case embrulha a falha num
            `apperr` de validação (`community.go:37`). Nas rotas de canal o mesmo
            defeito dá `500 newsletter_failed`. As duas famílias tratam o mesmo
            erro de forma diferente.

            **Não há rota `/community/create`**: uma comunidade cria-se em
            `POST /group/create` com `is_parent: true`.
          example: 120363430034334401@g.us
          nullable: false
          type: string
      type: object
    PedidoConfigHmac:
      description: |
        Corpo de `POST /session/hmac/config`. `hmac_key` é o único campo do
        contrato — os campos `enabled`/`key`/`secret` que já apareceram em
        versões antigas nunca existiram no fio, e hoje seriam ignorados em
        silêncio como qualquer campo desconhecido.

        Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
      properties:
        hmac_key:
          description: |
            Chave com que os webhooks desta sessão são assinados.

            Medido em 2026-08-26:

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente (`{}`) | não | `400 hmac_key_too_short` |
            | `null` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
            | `""` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
            | `"curta"` | não | `400 hmac_key_too_short`, mensagem `HMAC key must be at least 32 characters long` |
            | 32 ou mais | sim | grava e devolve `Enabled: true` |

            Repare que **não há código próprio para "em falta"**: a chave ausente
            e a chave curta dão o MESMO erro, porque a única regra é o
            comprimento (`storage/configure_hmac.go:71-74`).

            A mensagem diz "characters", mas a verificação é `len(req.HmacKey)`,
            que em Go conta **bytes**: uma chave de 32 caracteres com acentos
            passa; uma de 31 caracteres com um acento também passa, por ter 32
            bytes. Use ASCII se o comprimento importar para si.

            **Só entra.** É cifrada antes de ser gravada e nunca volta em leitura
            nenhuma — `GET /session/hmac/config` devolve apenas a PRESENÇA.
          example: uma-chave-com-pelo-menos-32-caracteres
          minLength: 32
          nullable: false
          type: string
          writeOnly: true
      required:
        - hmac_key
      type: object
    PedidoConfigS3:
      description: |
        Corpo de `POST /session/s3/config`. Substitui a configuração inteira —
        não é uma actualização parcial, e não há `PATCH` nesta API.

        **Nenhum campo é obrigatório.** `{}` é aceite e GRAVA: todos os campos
        ficam com o valor zero, `media_delivery` assume `base64`, e o cliente S3
        é removido do registo porque `enabled` fica `false`
        (`storage/configure_s3.go:75-135`). Um pedido parcial não funde com o que
        estava — apaga o que não veio.

        Campos desconhecidos são IGNORADOS em silêncio. Um erro de digitação num
        nome de campo não dá erro: dá o valor zero, e aqui isso apaga a
        configuração daquele campo.

        Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
      properties:
        access_key:
          description: |
            Identificador da credencial. Ausente, `null` e `""` são
            indistinguíveis e todos gravam `""`. Não há validação.

            **Só entra.** `GET /session/s3/config` devolve a constante `***` no
            lugar deste campo, incondicionalmente — o valor real nunca volta.
          example: AKIAIOSFODNN7EXAMPLE
          nullable: false
          type: string
          writeOnly: true
        bucket:
          description: |
            Nome do bucket. Ausente, `null` e `""` são indistinguíveis e todos
            gravam `""`. **Não há validação nenhuma**, nem sequer quando
            `enabled: true` — uma configuração activa com bucket vazio é gravada e
            responde `200`.
          example: wa-api-media
          nullable: false
          type: string
        enabled:
          default: false
          description: |
            Liga ou desliga o envio de mídia para o bucket.

            | estado | efeito |
            |---|---|
            | ausente | `false` — **indistinguível de `false` explícito** |
            | `null` | `false` — idem |
            | `false` | **revoga**: o cliente S3 construído com a credencial anterior é removido do registo, senão continuaria a carregar mídia |
            | `true` | constrói o cliente com a credencial deste pedido |

            Este é o caso do §4.2 do contrato arquitectural: um `bool`
            não-ponteiro cujo `false` é uma ACÇÃO, não um padrão inerte. Omitir o
            campo revoga o cliente, em silêncio.
          example: true
          nullable: false
          type: boolean
        endpoint:
          description: |
            Endpoint do serviço.

            | estado | efeito |
            |---|---|
            | ausente / `null` / `""` | endpoint padrão da AWS — os três são indistinguíveis |
            | endereço reservado ou de loopback | `400 invalid_s3_endpoint` (medido com `http://127.0.0.1:9000`) |
            | preenchido e público | aceite |

            A validação só corre quando o valor não é vazio
            (`storage/configure_s3.go:83-90`).
          example: https://s3.eu-west-1.amazonaws.com
          nullable: false
          type: string
        media_delivery:
          default: base64
          description: |
            Como a mídia recebida é entregue. `base64` embute no corpo, `s3`
            devolve só o URL, `both` faz as duas coisas.

            Medido em 2026-08-26:

            | estado | efeito |
            |---|---|
            | ausente / `null` / `""` | assume `base64` — os três são indistinguíveis e nenhum é recusado |
            | `base64`, `s3`, `both` | aceite |
            | `BASE64` | **`400 invalid_media_delivery`** — a comparação é sensível a maiúsculas |
            | qualquer outro valor desconhecido (ex.: `ftp`) | `400 invalid_media_delivery`, mensagem `media_delivery must be 'base64', 's3', or 'both'` |

            O `""` está na lista porque é ACEITE, não porque seja um modo: a
            validação só corre para valor não-vazio
            (`storage/configure_s3.go:79-82`).
          enum:
            - ""
            - base64
            - s3
            - both
          example: s3
          nullable: false
          type: string
        path_style:
          default: false
          description: |
            Endereçamento por caminho em vez de por subdomínio. Necessário na
            maioria dos serviços compatíveis com S3 que não são a AWS.

            Ausente, `null` e `false` são **indistinguíveis** — o padrão efectivo
            de um pedido que omita o campo é `false`, e não o `true` que
            `GET /session/s3/config` mostra numa sessão sem linha gravada.
          example: true
          nullable: false
          type: boolean
        public_url:
          description: |
            Prefixo público usado para montar os URLs entregues ao cliente.
            Ausente, `null` e `""` são indistinguíveis. Sem validação de forma.
          example: https://media.exemplo.com
          nullable: false
          type: string
        region:
          description: |
            Região do bucket. Ausente, `null` e `""` são indistinguíveis e todos
            gravam `""`. **Não há validação nenhuma**: uma região inexistente é
            gravada tal e qual, e só falha depois, no `POST /session/s3/test` ou
            no primeiro envio de mídia.
          example: eu-west-1
          nullable: false
          type: string
        retention_days:
          description: |
            Dias de retenção aplicados aos objectos gravados. Ausente, `null` e
            `0` são **indistinguíveis**, e `0` é o que fica gravado.

            **Não há validação de mínimo**: um valor negativo é aceite e gravado
            — ao contrário de `POST /session/history`, que recusa negativo com
            `400 invalid_history`. Duas rotas vizinhas, duas regras.
          example: 30
          nullable: false
          type: integer
        secret_key:
          description: |
            Segredo da credencial. Ausente, `null` e `""` são indistinguíveis e
            todos gravam um segredo vazio cifrado — não há validação de presença.

            É cifrado antes de ser gravado (ADR-0009) e **nunca volta** em leitura
            nenhuma: `GET /session/s3/config` não seleciona sequer a coluna. Nunca
            aparece em log — o que se regista é se houve segredo, não qual
            (`storage/configure_s3.go:137-138`).
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          nullable: false
          type: string
          writeOnly: true
      type: object
    PedidoConfiguracaoHmac:
      description: |
        Corpo de `POST /hmac/config` e de `POST /hmac/configure` — a mesma
        operação. **`hmac_key` é o único campo lido**; qualquer outro é ignorado
        em silêncio.
      properties:
        hmac_key:
          description: |
            Chave que assina os webhooks desta sessão.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 hmac_key_too_short` |
            | `null` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
            | `""` | não | `400 hmac_key_too_short` — **indistinguível de ausente** |
            | `"   "` (< 32) | não | `400 hmac_key_too_short` |
            | 32 espaços | **sim** | aceite; **não há `trim`** nem exigência de entropia |
            | tipo errado | não | `400 could_not_decode_payload` |

            Todas medidas a 2026-08-26. Repare que **não há como revogar a chave
            por aqui** — mandar `""` dá `400`; a revogação é
            `DELETE /hmac/config`.

            O mínimo é de **32 bytes**: a verificação é `len()` em Go, que conta
            bytes e não caracteres, logo uma chave com acentos ou emoji atinge o
            mínimo com menos letras.

            Guardada cifrada e **nunca devolvida**.
          example: chave-de-assinatura-com-32-carac
          minLength: 32
          nullable: false
          type: string
          writeOnly: true
      required:
        - hmac_key
      type: object
    PedidoConfiguracaoS3:
      description: |
        Corpo de `POST /s3/config` e de `POST /s3/configure` — a mesma operação em
        dois caminhos. Nomes em snake_case, ao contrário do camelCase que as rotas
        `/admin/users` usam para a mesma configuração.

        **É uma SUBSTITUIÇÃO, não uma fusão.** Todo campo omitido é gravado no seu
        valor zero: um `POST /s3/config {"enabled": true}` apaga `endpoint`,
        `region`, `bucket`, as credenciais, `public_url` e zera `retention_days` e
        `path_style`. Medido a 2026-08-26. Envie sempre a configuração completa.

        A única excepção é `media_delivery`, que quando vazio assume `base64` em
        vez de ficar `""`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        access_key:
          description: |
            Chave de acesso. Ausente, `null` e `""` são indistinguíveis, e
            **apagam** a chave gravada (a escrita substitui o bloco inteiro).

            Nunca é devolvida: `GET /s3/config` responde sempre `***`. Não use o
            valor de exemplo.
          example: AKIA_EXEMPLO_NAO_USE
          nullable: false
          type: string
          writeOnly: true
        bucket:
          description: |
            Bucket de destino. Ausente, `null` e `""` são indistinguíveis e gravam
            a coluna vazia. **Não é validado**, nem sequer quando `enabled` é
            `true`: a verificação real acontece em `POST /s3/test`.
          example: wa-api-midia
          nullable: false
          type: string
        enabled:
          default: false
          description: |
            Liga o armazenamento em S3 para esta sessão. Ausente, `null` e `false`
            são **indistinguíveis**, e os três **desligam** — e, mais do que
            isso, **revogam** o cliente S3 em memória, para que a credencial
            anterior deixe de conseguir enviar mídia.

            Quando `true`, o cliente é construído no momento; uma falha aí
            responde `500` com a configuração **já gravada**.
          example: true
          nullable: false
          type: boolean
        endpoint:
          description: |
            Endereço do serviço. Ausente, `null` e `""` são indistinguíveis e
            significam o endpoint padrão da AWS.

            Quando presente, é validado contra o validador de saída: um valor que
            não seja URL utilizável, ou que aponte para endereço reservado ou de
            loopback, dá `400 invalid_s3_endpoint`.
          example: https://s3.sa-east-1.amazonaws.com
          nullable: false
          type: string
        media_delivery:
          default: base64
          description: |
            Como a mídia recebida é entregue.

            | estado | efeito |
            |---|---|
            | ausente | grava `base64` |
            | `null` | grava `base64` — **indistinguível de ausente** |
            | `""` | grava `base64` — **indistinguível de ausente** |
            | `base64` / `s3` / `both` | grava o valor |
            | qualquer outro | `400 invalid_media_delivery`, e **nada é gravado** |

            O valor desconhecido é recusado com a mensagem
            `media_delivery must be 'base64', 's3', or 'both'`. A comparação é
            exacta e sensível a maiúsculas: `Base64` é recusado.
          enum:
            - base64
            - s3
            - both
          example: both
          nullable: false
          type: string
        path_style:
          default: false
          description: |
            Usa endereçamento por caminho em vez de subdomínio (necessário em
            MinIO e afins). Ausente, `null` e `false` são indistinguíveis.
          example: false
          nullable: false
          type: boolean
        public_url:
          description: |
            Base pública por onde a mídia guardada é servida. Ausente, `null` e
            `""` são indistinguíveis. Não é validado.
          example: https://midia.exemplo.com.br
          nullable: false
          type: string
        region:
          description: |
            Região. Ausente, `null` e `""` são indistinguíveis e gravam a coluna
            vazia — não há validação nem valor por omissão.
          example: sa-east-1
          nullable: false
          type: string
        retention_days:
          default: 0
          description: |
            Dias de retenção dos objectos. Ausente, `null` e `0` são
            indistinguíveis. **Não há validação**: negativo é gravado como veio, e
            o valor não é usado por nenhuma limpeza automática desta API.
          example: 30
          minimum: 0
          nullable: false
          type: integer
        secret_key:
          description: |
            Segredo de acesso. Ausente, `null` e `""` são indistinguíveis, e
            **apagam** o segredo gravado.

            Cifrada antes de tocar no banco, e **nunca devolvida** por nenhuma
            rota — nem sequer mascarada, porque a leitura não a consulta. Não use
            o valor de exemplo.
          example: EXEMPLO_NAO_USE_gere_a_sua_secret_key
          nullable: false
          type: string
          writeOnly: true
      type: object
    PedidoCriarCanal:
      description: |
        Pedido de criação de canal. É a única operação de canal que não recebe
        `jid` — o identificador é justamente o que ela devolve. Também é a única
        sem nenhum campo obrigatório além de `name`.
      properties:
        description:
          description: |
            Descrição do canal, mostrada a quem abre a página dele. **Opcional** —
            ausente, `null` e `""` são os três a mesma coisa (canal sem descrição),
            e nenhum é recusado. Medido: `{"name":"…","description":null}` cria o
            canal.
          example: Novidades e horários de funcionamento.
          nullable: false
          type: string
        name:
          description: |
            Nome público do canal.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_name` |
            | `null` | não | `400 missing_name` — indistinguível de ausente |
            | `""` | não | `400 missing_name` — indistinguível de ausente |
            | `"   "` | **sim, pela validação** | cria um canal com nome de três espaços; **não há `trim`** (`newsletter_ops.go:210`). Não medido em campo de propósito: seria uma escrita real |
            | tipo não-texto | não | `400 could_not_decode_payload` |
            | preenchido | sim | — |

            **Comprimento máximo não determinado com segurança pela implementação
            atual**: não há limite nosso, e o do WhatsApp não foi medido.
          example: Avisos da Fila Rápida
          minLength: 1
          nullable: false
          type: string
        picture:
          description: |
            Imagem de perfil do canal, em **base64 cru** — o campo é `[]byte` em
            Go, logo o JSON leva base64 sem o prefixo `data:`. Isto diverge de
            `/chat/send/image`, que aceita o URI de dados.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | canal sem imagem |
            | `null` | **sim** | idem — indistinguível de ausente |
            | `""` | **sim** | idem |
            | base64 inválido | não | `400 could_not_decode_payload` |
            | número | não | `400 could_not_decode_payload` |

            **As duas linhas do meio são a armadilha deste campo, e custaram um
            canal criado por acidente.** É natural supor que um valor errado num
            `[]byte` morre na descodificação — e `"nao-e-base64!!"` e `123`
            morrem. `null` e `""` **não morrem**: descodificam para `nil` e vazio,
            e o pedido segue para o efeito real.

            Medido a 2026-08-26 com a técnica de sonda segura — omitindo `name`,
            que é o campo obrigatório, para que o pedido morra na validação em
            qualquer ramo e o código de erro revele onde `picture` parou:

            ```
            {"picture":"nao-e-base64!!"}  -> 400 could_not_decode_payload
            {"picture":123}               -> 400 could_not_decode_payload
            {"picture":null}              -> 400 missing_name    <- PASSOU a descodificação
            {"picture":""}                -> 400 missing_name    <- PASSOU
            {}                            -> 400 missing_name
            ```

            Cinco entradas, três resultados, e nenhum canal criado.
            `could_not_decode_payload` significa "o valor morreu na
            descodificação"; qualquer outro código significa "o valor passou".

            Não há validação de formato de imagem, de dimensão nem de tamanho do
            nosso lado; quem recusa é o WhatsApp.
          format: byte
          nullable: false
          type: string
      required:
        - name
      type: object
    PedidoCriarGrupo:
      description: |
        Criação de grupo, de comunidade ou de sub-grupo dentro de comunidade — as
        três saem desta mesma rota, e o que as distingue são `is_parent` e
        `linked_parent_jid`.

        **Todas as recusas desta rota saem no objecto canónico**
        `{"code":"invalid_request","message":"Requisição inválida."}`
        (`docs/HTTP-DTO-CONVENTIONS.md` §7) — o manipulador não usa códigos de erro
        próprios aqui. As SEIS causas distintas — `name` em falta, `participants`
        em falta, `participants` vazio, entrada vazia em `participants`,
        `is_parent` com `linked_parent_jid` — produzem corpos IDÊNTICOS. O cliente
        não consegue saber qual campo falhou; a causa fica só no log do servidor.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        is_parent:
          default: false
          description: |
            Cria uma COMUNIDADE em vez de um grupo. O WhatsApp cria sozinho o
            sub-grupo de avisos, que aparece depois em `POST /group/list` com
            `IsDefaultSubGroup: true`.

            | estado | efeito |
            |---|---|
            | ausente | `false` — grupo normal, e `participants` passa a ser obrigatório |
            | `null` | `false` — **indistinguível de ausente**; um `null` num booleano Go não-ponteiro é `false` em silêncio |
            | `false` | idêntico a ausente |
            | `true` | comunidade; `participants` deixa de ser exigido |
            | `"sim"` (texto) | `400 could_not_decode_payload` — medido |

            Mutuamente exclusivo com `linked_parent_jid`: `is_parent: true` com
            `linked_parent_jid` NÃO VAZIO devolve `400` sem chegar ao WhatsApp.
            Repare na assimetria — a guarda é `req.IsParent && req.LinkedParentJID
            != ""` (`handler_group_mgmt.go:120`), logo `is_parent: true` com
            `linked_parent_jid: ""` PASSA, porque `""` é indistinguível de
            ausente.
          example: false
          nullable: false
          type: boolean
        linked_parent_jid:
          description: |
            Cria o grupo já dentro desta comunidade.

            | estado | efeito |
            |---|---|
            | ausente | grupo solto |
            | `null` | idêntico a ausente — **indistinguível** |
            | `""` | idêntico a ausente — **indistinguível**, e é o que faz a exclusão mútua com `is_parent` não disparar |
            | preenchido, com `is_parent: true` | `400 invalid_request` |
            | preenchido, sem `is_parent` | sub-grupo da comunidade indicada |

            Um valor mal formado não é validado por esta API: segue para
            `ResolveJID` e a recusa chega como `400 invalid_jid`.
          example: 120363430034334401@g.us
          nullable: false
          type: string
        name:
          description: |
            Nome do grupo.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` |
            | `null` | não | idêntico a ausente — **indistinguível** |
            | `""` | não | idêntico a ausente — **indistinguível** |
            | `"   "` | **sim** | aceite tal e qual; **não há `trim`**, e o grupo fica com um nome de três espaços |
            | preenchido | sim | — |

            Não há limite de comprimento imposto por esta API; o do WhatsApp não
            foi determinado com segurança pela implementação atual.
          example: Equipa de entregas
          minLength: 1
          nullable: false
          type: string
        participants:
          description: |
            Participantes iniciais, além da própria conta. Aceita o número nu
            (`554192421234`) tanto quanto o JID completo — a resolução é feita por
            `ResolveJID`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | **depende** | com `is_parent: true`, sim; senão `400 invalid_request` |
            | `null` | igual a ausente | **indistinguível** — medido |
            | `[]` | igual a ausente | **indistinguível** — a guarda é `len(...) < 1` |
            | `[""]` | não | `400 invalid_request`; o log diz o ÍNDICE, a resposta não |
            | `["554192421234", ""]` | não | recusa a lista INTEIRA — não há descarte silencioso de item |
            | `["   "]` | passa a guarda | `400 invalid_jid` — `"   "` não é `""` |
            | `["nao-e-jid"]` | não | `400 invalid_jid`, com o valor citado na mensagem |
            | preenchido | sim | — |

            **Item inválido nunca é descartado em silêncio**: ou a lista toda
            passa, ou o pedido é recusado. Duplicados não são detectados por esta
            API. A ordem não é significativa.

            Participante que o WhatsApp recuse INDIVIDUALMENTE é o único caso
            parcial: o pedido devolve `200` e a entrada volta em `Participants`
            com `Error` diferente de zero.
          example:
            - 554192421234@s.whatsapp.net
          items:
            description: |
              Número nu ou JID completo do participante. Nunca `null` — um `null`
              dentro da lista vira `""` e é recusado como entrada vazia.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          minItems: 1
          nullable: false
          type: array
      required:
        - name
      type: object
    PedidoCriarUtilizador:
      description: |
        Corpo de `POST /admin/users`. **Todas as chaves em snake_case**, incluindo
        as dos blocos aninhados — `s3_config`, `proxy_config`, `hmac_key`.

        O camelCase de antes (`s3Config`, `proxyConfig`, `hmacKey`, e dentro
        deles `proxyUrl`, `accessKey`, `pathStyle`, `publicUrl`, `mediaDelivery`,
        `retentionDays`) **já não é lido**. Não há grafia dupla: a leitura dos
        dois nomes existia para compensar uma resposta em snake_case, e alinhar
        os dois lados removeu a razão de ela existir.

        Um corpo com os nomes antigos perde esses campos. Não passa despercebido:
        o servidor regista `unknown field "<nome>"`, e com
        `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-o com `400 unknown_field`.
      properties:
        events:
          description: |
            Eventos subscritos, **numa única string separada por vírgulas** — não
            é um array aqui, ao contrário de `POST /webhook`.

            Ausente, `null` e `""` são indistinguíveis e gravam a coluna vazia,
            sem erro. Quando vier preenchida, **cada nome é validado**: um
            desconhecido dá `400 invalid_event_type`, dizendo qual. `All` recebe
            todos.

            Cada nome sofre `trim` antes da validação, e um item **vazio é
            saltado** — `"Message,,Receipt"` e `"Message, Receipt"` passam os
            dois, e a string é gravada tal e qual, com os espaços.
          example: Message,Receipt,Connected
          nullable: false
          type: string
        expiration:
          default: 0
          description: |
            Expiração da sessão, em segundos desde a época Unix. Ausente, `null`
            e `0` são **indistinguíveis** e significam os três *sem expiração*.

            Negativo não é recusado: é gravado como veio.
          example: 0
          minimum: 0
          nullable: false
          type: integer
        history:
          default: 0
          description: |
            Quantas mensagens gravar por conversa. Ausente, `null` e `0` são
            **indistinguíveis** e desactivam a gravação — que é o valor de origem.

            **Não é validado na criação**: um negativo é gravado como veio. Só
            `POST /session/history` recusa negativo (`400 invalid_history`).
          example: 100
          minimum: 0
          nullable: false
          type: integer
        hmac_key:
          description: |
            Chave de assinatura dos webhooks. Ausente, `null` e `""` são
            indistinguíveis e criam a sessão **sem** chave, sem erro.

            Quando vier preenchida, tem de ter no mínimo **32 bytes** — a
            verificação é `len()` em Go, que conta bytes e não caracteres, logo
            uma chave com acentos ou emoji atinge o mínimo com menos letras.
            Abaixo disso, `400 hmac_key_too_short`.

            Guardada cifrada; **nunca é devolvida** por rota nenhuma. A criação
            confirma apenas a presença, em `hmac_configured: true`.
          example: chave-de-assinatura-com-32-carac
          minLength: 32
          nullable: false
          type: string
          writeOnly: true
        name:
          description: |
            Nome da sessão. Obrigatório.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_name_or_token` |
            | `null` | não | `400 missing_name_or_token` — **indistinguível de ausente** |
            | `""` | não | `400 missing_name_or_token` — **indistinguível de ausente** |
            | `"   "` | **sim** | gravado tal e qual; **não há `trim`** |
            | tipo errado (número, objecto) | não | `400 could_not_decode_payload` |
          example: filarapida
          minLength: 1
          nullable: false
          type: string
        proxy_config:
          allOf:
            - $ref: '#/components/schemas/ConfiguracaoProxyUtilizador'
          description: |
            Proxy de saída. **Ausente e `null` são o mesmo** (o campo é ponteiro
            em Go) e ambos significam *sem proxy*: o servidor substitui por uma
            configuração vazia.
          nullable: true
        s3_config:
          allOf:
            - $ref: '#/components/schemas/ConfiguracaoS3Utilizador'
          description: |
            Armazenamento em S3. **Ausente e `null` são o mesmo** e ambos
            significam *sem S3*: o servidor substitui por uma configuração vazia.
          nullable: true
        token:
          description: |
            Token de sessão a atribuir. Obrigatório e **único na instalação** —
            repetido dá `409`, no envelope ANTIGO (`"error": "conflict"`, uma
            string, e não um objecto com `code`). É devolvido uma única vez, na
            resposta desta chamada.

            Ausente, `null` e `""` são **indistinguíveis** e dão os três
            `400 missing_name_or_token`. `"   "` é aceite e gravado tal e qual —
            não há `trim`, e um token de espaços autentica.

            **É um segredo.** Trate-o como palavra-passe: quem o tiver opera a
            conta de WhatsApp inteira. Não o registe em log, não o ponha em URL, e
            não use o valor de exemplo — gere um aleatório de pelo menos 32
            caracteres.
          example: tk_EXEMPLO_NAO_USE_gere_o_seu
          minLength: 1
          nullable: false
          type: string
          writeOnly: true
        webhook:
          description: |
            URL de webhook inicial. **Opcional**: ausente, `null` e `""` são
            indistinguíveis e gravam a coluna vazia. Pode ficar para depois, em
            `POST /webhook`.

            **Não é validado aqui** — nem como URL, nem contra endereços
            reservados. A validação de saída só acontece na entrega.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          type: string
      required:
        - name
        - token
      type: object
    PedidoDecidirSolicitacoes:
      description: |
        Aprova ou rejeita pedidos de entrada pendentes. Usa a struct de DOMÍNIO
        (`pkg/domain/group_request.go:23-27`).

        **Todas as recusas saem no envelope NOVO**, com `error.code` — esta rota
        não passa por `rejectMissingField`. A ordem medida é `group_jid` → `Phone`
        → `Action` → resolução do grupo → resolução dos telefones → validação de
        `Action` contra a lista; ou seja, o inverso da ordem de
        `POST /group/updateparticipants`.
      properties:
        action:
          description: |
            O veredito.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_action` — medido |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `approve` / `reject` | sim | — |
            | qualquer outro valor | não | `400 invalid_action`, `invalid Action in payload (must be approve or reject)` — medido com `xyz` |

            **Valor fora da lista é sempre RECUSADO**, nunca ignorado. É sensível
            a maiúsculas: a comparação é literal (`group_request.go:107-114`).
            Não há valor por omissão.
          enum:
            - approve
            - reject
          example: approve
          nullable: false
          type: string
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio —
            medido a funcionar nesta rota. Ausente, `null` e `""` são
            indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. **É o PRIMEIRO campo validado.**

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não — salvo se `chat` vier | `400 missing_group_jid` — medido |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `"   "` | passa a guarda | `400 invalid_group_jid` |
            | `120363411669320145@g.us` | sim | — |
          example: 120363411669320145@g.us
          nullable: false
          type: string
        phone:
          description: |
            Os solicitantes a decidir.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_phone` — medido |
            | `null` | não | **indistinguível de ausente** |
            | `[]` | não | **indistinguível de ausente** — medido, mesmo corpo |
            | `[""]` | não | `400 invalid_phone` — passa a guarda de comprimento e morre na resolução; **não há verificação de entrada vazia nesta rota**, ao contrário de `/group/updateparticipants` |
            | `["554192421234"]` (número nu) | **não** | `400 invalid_phone` — medido |
            | `["554192421234@s.whatsapp.net"]` | sim | — |

            **Exige o JID COMPLETO**, porque este use case resolve com
            `ResolveQualifiedJID` e não com `ResolveJID`
            (`group_request.go:100`). É uma divergência face a
            `POST /group/updateparticipants`, que aceita o número nu.

            Item inválido recusa o pedido INTEIRO — não há descarte silencioso.
            Duplicados não são detectados. A ordem não é significativa.
          example:
            - 554192421234@s.whatsapp.net
          items:
            description: |
              JID completo do solicitante. Nunca `null`; um `null` dentro da lista
              vira `""` e é recusado com `invalid_phone`.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          minItems: 1
          nullable: false
          type: array
      required:
        - group_jid
        - phone
        - action
      type: object
    PedidoDefinicaoPrivacidade:
      description: |
        Uma definição de privacidade de cada vez. Nome e valor são validados contra
        a tabela do domínio (`pkg/domain/privacy.go:54-62`) ANTES de qualquer
        chamada ao WhatsApp, e cada definição tem o seu próprio conjunto de valores
        válidos — `contacts` vale para `status` e é recusado em `readreceipts`.

        Os dois campos são `string` sem `*`, logo ausente, `null` e `""` são o
        mesmo pedido: caem no `400` de nome inválido ou de valor inválido, nunca
        num código próprio de "campo em falta".

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        privacy_setting:
          description: |
            Qual definição alterar, em MINÚSCULAS. **Não são as mesmas chaves que a
            leitura devolve** — ver `DefinicoesPrivacidade`.

            **Nome desconhecido, isto é, fora do conjunto acima, é RECUSADO** com
            `400 invalid_privacy_setting` e a mensagem
            `invalid privacy setting name "…"`, antes de qualquer chamada
            ao WhatsApp. Não é ignorado. A comparação é por igualdade exacta e
            sensível a maiúsculas: `GroupAdd` — a grafia que a LEITURA devolve — é
            recusada aqui.

            Ausente, `null` e `""` caem todos no mesmo `400
            invalid_privacy_setting`: o campo vazio não tem código próprio.

            As três chaves que a leitura devolve e não constam desta lista
            (`Messages`, `Defense`, `Stickers`) **não são definíveis** por esta API.
          enum:
            - groupadd
            - last
            - status
            - profile
            - readreceipts
            - online
            - calladd
          example: status
          minLength: 1
          nullable: false
          type: string
        value:
          description: |
            O valor. O conjunto válido **DEPENDE da definição**, e por isso não há
            um `enum` único aqui — declarar a união dos conjuntos seria mentir
            sobre pares que a validação recusa:

            | `privacy_setting` | valores aceites |
            |---|---|
            | `groupadd`, `last`, `status`, `profile` | `all`, `contacts`, `contact_blacklist`, `none` |
            | `readreceipts` | `all`, `none` |
            | `online` | `all`, `match_last_seen` |
            | `calladd` | `all`, `known` |

            **Valor fora do conjunto daquela definição é RECUSADO** com
            `400 invalid_privacy_value` e a mensagem
            `invalid value "…" for privacy setting "…"`. A comparação é sensível a
            maiúsculas: `ALL` é recusado.

            Nome desconhecido e valor fora do conjunto produzem erros DIFERENTES de
            propósito (`invalid_privacy_setting` e `invalid_privacy_value`): quem
            chama precisa de saber qual dos dois errou. Só um erro sai por pedido —
            esta API não tem `error.details[]`.

            Ausente, `null` e `""` caem em `400 invalid_privacy_value`.
          example: contacts
          minLength: 1
          nullable: false
          type: string
      required:
        - privacy_setting
        - value
      type: object
    PedidoDescargaDeMidia:
      description: |
        O DESCRITOR da mídia, e não um identificador de mensagem. Os sete campos
        saem do `data_json` da mensagem devolvida por `GET /chat/history`, dentro
        de `Message.imageMessage` / `videoMessage` / `audioMessage` /
        `documentMessage` / `stickerMessage`, com estes nomes de origem:

        **Este esquema descrevia as etiquetas PascalCase do domínio até
        2026-08-27**: esta rota (`POST /chats/download/{kind}`) decodifica
        `domain.DownloadRequest` directamente — `pkg/domain/download.go` — sem
        passar por uma camada de DTO como as outras famílias
        (`docs/HTTP-DTO-CONVENTIONS.md`). A divergência entre este esquema e o
        contrato canónico foi achada na auditoria final da normalização (worker
        de mensagens, F337) e corrigida directamente nas etiquetas do struct de
        domínio (F338) — o `encoding/json` do Go casa nomes sem distinguir
        maiúsculas na DESCODIFICAÇÃO, então a mudança de etiqueta não altera
        comportamento de pedido nenhum; só corrige o que este esquema, uma
        reflexão sobre o struct, e o gate de nomenclatura relatam. Ver
        `ResultadoDescargaDeMidia` para o lado que já migrou (a resposta), e
        `HOUSEKEEP.md` F338 para o registo.

        | campo daqui | campo no `data_json` | obrigatório de verdade? |
        |---|---|---|
        | `url` | `URL` | um dos dois |
        | `direct_path` | `directPath` | um dos dois |
        | `media_key` | `mediaKey` | sim, para mídia cifrada |
        | `mimetype` | `mimetype` | **sim** — vazio ou mal formado derruba a resposta |
        | `file_enc_sha256` | `fileEncSha256` | sim, para mídia cifrada |
        | `file_sha256` | `fileSha256` | não |
        | `file_length` | `fileLength` | **sim** — tem de ser EXACTO |

        **Só uma coisa é validada na fronteira HTTP**: pelo menos um entre `url`
        e `direct_path`. Faltarem os dois — ausentes, `null` ou `""`, que são o
        mesmo estado — é `400 missing_url_or_direct_path`, medido nas cinco
        rotas. Todos os outros campos passam sem verificação e falham depois com
        `500 media_download_failed`, que não distingue a causa.

        **Aviso medido em campo**: nas 25 mensagens de mídia gravadas de uma
        sessão real (40 conversas), **zero** traziam `fileEncSha256` ou
        `fileSha256` no `data_json` — vinham `null`. O descritor montado a
        partir do histórico, tal e qual, não completa o download nessas
        mensagens.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        direct_path:
          description: |
            Caminho directo na CDN, resolvido contra os hosts de mídia da
            sessão. Ausente, `null` e `""` são o mesmo estado.

            **Tem de começar por `/`.** Um valor sem barra inicial não é
            recusado na fronteira: devolve `500 media_download_failed` (medido
            com `"sem-barra"`). É a forma em que os metadados chegam em vários
            eventos, e é a única alternativa a `url`.
          example: /o1/v/t24/f2/m234/exemplo
          nullable: false
          type: string
        file_enc_sha256:
          description: |
            SHA-256 do ficheiro CIFRADO, em base64 (`[]byte` em Go). Ausente,
            `null` e `""` são o mesmo estado (`nil`); base64 inválido é
            `400 could_not_decode_payload`.

            Não é opcional na prática: é o que faz a biblioteca separar o MAC do
            fim do corpo descarregado. Sem ele, e com `media_key` presente, a
            verificação de HMAC falha e a resposta é `500 media_download_failed`.
            Sem ele E sem `media_key`, ver o aviso em `media_key`.
          example: ZXhlbXBsb0ZpbGVFbmNTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDA=
          format: byte
          nullable: true
          type: string
        file_length:
          description: |
            Tamanho do ficheiro decifrado, em bytes.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim na fronteira | vale `0`, e `0` faz a verificação FALHAR |
            | `null` | sim na fronteira | idêntico a ausente |
            | `0` | sim na fronteira | idem — ver abaixo |
            | negativo | não | `400 could_not_decode_payload` (medido) — é `uint64` |
            | `"74"` (texto) | não | `400 could_not_decode_payload` (medido) |
            | valor exacto | sim | — |

            **É obrigatório de facto, e tem de ser EXACTO.** A biblioteca compara
            o tamanho do conteúdo decifrado com este número e devolve erro se
            divergirem (`ReturnDownloadWarnings` está ligado). Como o campo é
            `uint64` não-ponteiro, ausente vale `0`, e `0` nunca bate com um
            ficheiro real: o resultado é `500 media_download_failed`. Copie o
            `fileLength` do `data_json` sem o alterar.
          example: 74
          format: int64
          minimum: 0
          nullable: false
          type: integer
        file_sha256:
          description: |
            SHA-256 do ficheiro decifrado, em base64 (`[]byte` em Go). Ausente,
            `null` e `""` são o mesmo estado (`nil`); base64 inválido é
            `400 could_not_decode_payload`.

            **É o único campo verdadeiramente opcional do descritor.** Só é
            conferido quando tem exactamente 32 bytes; com qualquer outro
            tamanho a verificação é saltada sem aviso. Quando confere e não
            bate, a resposta é `500 media_download_failed`.
          example: ZXhlbXBsb0ZpbGVTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDAwMDA=
          format: byte
          nullable: true
          type: string
        media_key:
          description: |
            Chave de decifragem, em **base64** — o campo é `[]byte` em Go, logo
            o JSON tem de trazer uma string base64 válida.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim na fronteira | ver o aviso abaixo |
            | `null` | sim na fronteira | igual a ausente (`nil`) |
            | `""` | sim na fronteira | base64 vazio, também `nil` |
            | base64 inválido | não | `400 could_not_decode_payload` (medido) |
            | número | não | `400 could_not_decode_payload` (medido) |
            | base64 válido | sim | — |

            **Perigo medido no código**: se `media_key` E `file_enc_sha256` vierem
            ambos ausentes, a biblioteca toma a mídia por NÃO CIFRADA e devolve
            `200` com os bytes tal e qual vieram da CDN — que, para mídia real
            do WhatsApp, é conteúdo cifrado inútil disfarçado de sucesso
            (`internal/wa-noise/capabilities/media/download_transport.go:37`).
            Com apenas um dos dois em falta, o HMAC falha e a resposta é
            `500 media_download_failed`.
          example: SlpkRE1hd3FWcDFaZXhlbXBsb01lZGlhS2V5MDAwMDA=
          format: byte
          nullable: true
          type: string
        mimetype:
          description: |
            Tipo da mídia. É devolvido TAL E QUAL na resposta e é também o
            prefixo da Data URL de `Data` — os dois não podem divergir, por
            construção.

            **Tem de ter a forma `tipo/subtipo`.** Não é validado em lado
            nenhum, mas o construtor da Data URL entra em pânico com qualquer
            outra forma (`dataurl.New` panica com *"dataurl: invalid
            mediatype"*), e o pânico é apanhado pelo router: a resposta é `500`
            com o corpo genérico do status, sem código de taxonomia. Ausente,
            `null` e `""` levam todos a esse mesmo `500` — mas só DEPOIS de os
            bytes terem sido descarregados.
          example: image/png
          nullable: false
          type: string
        url:
          description: |
            URL da mídia na CDN do WhatsApp. Ausente, `null` e `""` são o mesmo
            estado.

            Quando preenchida, é usada em vez de `direct_path` — **excepto** se
            começar por `https://web.whatsapp.net/`, caso em que é descartada e
            a descarga cai para `direct_path`. Com os dois vazios é
            `400 missing_url_or_direct_path`.
          example: https://mmg.whatsapp.net/o1/v/t24/f2/m234/exemplo
          nullable: false
          type: string
      type: object
    PedidoEdicaoMensagem:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                O novo texto da mensagem. Ausente, `null` e `""` são
                indistinguíveis e dão `400 missing_body`; `"   "` **passa** — não há
                `trim`, e a mensagem fica editada para três espaços.
              example: Bom dia! O seu pedido sai para entrega às 15h.
              minLength: 1
              nullable: false
              type: string
            id:
              description: |
                `message_id` da mensagem a editar. Ausente, `null` e `""` são
                indistinguíveis e dão `400 missing_id`.

                **A ordem de validação é observável**: `phone` e `body` são
                verificados primeiro, e o `phone` chega a ser PARSEADO antes de este
                campo ser olhado. Logo um pedido com `phone` inválido E `id` ausente
                responde `invalid_phone`, e não `missing_id`.

                Não é confrontado com o histórico: um id que não existe é aceite
                aqui e a edição simplesmente não aparece em lado nenhum.
              example: 3EB0A4B2AFD45E625C0917
              minLength: 1
              nullable: false
              type: string
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            participant:
              description: |
                JID de quem escreveu a mensagem citada. Par de `stanza_id`, e com a
                mesma semântica de ponteiro: ausente e `null` não contribuem;
                **`""` cria o bloco de contexto** com participante vazio. Não é
                validado como JID.
              example: 554192421234@s.whatsapp.net
              nullable: true
              type: string
            phone:
              description: |
                A conversa onde está a mensagem a editar. Sinónimo universal `chat`.
                Ausente, `null` e `""` são indistinguíveis e dão
                `400 missing_phone`; preenchido mas impossível de parsear dá
                `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            stanza_id:
              description: |
                `message_id` da mensagem citada pela mensagem que está a ser
                editada, para preservar a citação.

                É `*string`, e aqui a diferença **é observável**:

                | estado | efeito |
                |---|---|
                | ausente | não contribui para o bloco de contexto |
                | `null` | idem — indistinguível de ausente |
                | **`""`** | **cria** o bloco de contexto, com `StanzaID` vazio |
                | preenchido | cria o bloco de contexto com o valor |

                A condição na implementação é `req.StanzaID != nil`, e não
                `*req.StanzaID != ""` (`send_edit_message.go`). Mandar `""` não é o
                mesmo que omitir.
              example: 3EB0F1C9D2A74B380E1128
              nullable: true
              type: string
          required:
            - body
            - id
          type: object
      description: |
        Corpo de `POST /chat/send/edit`. Substitui o texto de uma mensagem já
        enviada, identificada por `id`. Campos desconhecidos são ignorados em
        silêncio.
    PedidoEditarUtilizador:
      description: |
        Corpo de `PUT /admin/users/{id}`. **Só os campos enviados mudam.**

        A regra, medida em `edit_user.go`: para os campos de texto e para
        `expiration`, a condição de "foi informado" é `!= ""` / `!= 0`. Logo
        **ausente, `null` e `""` são indistinguíveis**, e os três significam *não
        informado* — nunca *limpe*. Consequências que surpreendem:

        - **não há como esvaziar `webhook`, `name`, `token` ou `events` por aqui**;
          para o webhook, use `DELETE /webhook` ou `PUT /webhook {"active": false}`;
        - **não há como voltar `expiration` a `0`** depois de a ter definido: `0`
          é lido como "não informado".

        As duas excepções:

        - `history` é `*int`: ausente/`null` é *não mexer*, e `0` **desactiva** a
          gravação (F218);
        - `s3_config`/`proxy_config` são ponteiros: ausente/`null` é *não mexer*,
          mas quando presentes **substituem o bloco inteiro**, e cada subcampo
          omitido dentro deles é gravado no valor zero.

        Um corpo sem nenhum campo útil responde `400 no_fields_to_update` — e
        `{}` e `{"token": ""}` dão o mesmo, medido a 2026-08-26.

        **Todas as chaves em snake_case.** O camelCase de antes (`s3Config`,
        `proxyConfig`, e dentro deles `proxyUrl`, `accessKey`, `pathStyle`, …)
        já não é lido: o corte foi a seco, e a resposta desta família passou a
        usar exactamente os mesmos nomes. Campos desconhecidos são ignorados, mas
        **não em silêncio**: o servidor regista `unknown field "<nome>"`, e
        `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com `400 unknown_field`.

        O identificador da sessão vem do CAMINHO e nunca do corpo.
      properties:
        events:
          description: |
            Nova lista de eventos, separada por vírgulas. Ausente, `null` e `""`
            são indistinguíveis e significam *não informado* — **não há como
            cancelar todas as subscrições por aqui**.

            Validado como na criação: nome desconhecido dá
            `400 invalid_event_type`, e a validação corre **depois** de a sessão
            ser encontrada (uma sessão inexistente dá `404 user_not_found`
            primeiro).
          example: Message,Receipt
          nullable: false
          type: string
        expiration:
          description: |
            Nova expiração, em segundos desde a época Unix. Ausente, `null` e `0`
            são indistinguíveis e significam *não informado*.

            **Logo, `0` não volta a ser gravável por esta rota** depois de a
            expiração ter sido definida — ao contrário de `history`, que ganhou
            ponteiro precisamente para resolver esta assimetria (F218).
          example: 1790000000
          minimum: 0
          nullable: false
          type: integer
        history:
          description: |
            Limite de gravação de mensagens por conversa. **É o único campo desta
            rota que distingue ausência de zero**, porque é `*int` em Go (F218):

            | estado | efeito |
            |---|---|
            | ausente | não mexe no valor gravado |
            | `null` | não mexe — **indistinguível de ausente** |
            | `0` | **desactiva** a gravação |
            | `> 0` | passa a gravar esse número de mensagens |

            É o que permite voltar a desligar a gravação depois de a ter ligado.
            Negativo não é recusado aqui.
          example: 0
          minimum: 0
          nullable: true
          type: integer
        name:
          description: |
            Novo nome da sessão. Ausente, `null` e `""` são indistinguíveis e
            significam *não informado*. `"   "` é informado, e é gravado — não há
            `trim`.
          example: filarapida
          nullable: false
          type: string
        proxy_config:
          allOf:
            - $ref: '#/components/schemas/ConfiguracaoProxyUtilizador'
          description: |
            Proxy de saída. Ausente e `null` são indistinguíveis e significam
            *não mexer*. Quando presente, **substitui**: com `enabled: false` (ou
            `enabled` omitido, que dá o mesmo) o `proxy_url` gravado é apagado.
          nullable: true
        s3_config:
          allOf:
            - $ref: '#/components/schemas/ConfiguracaoS3Utilizador'
          description: |
            Armazenamento em S3. Ausente e `null` são indistinguíveis e significam
            *não mexer*. Quando presente, **substitui o bloco inteiro**: todo
            subcampo omitido é gravado no seu valor zero (`""`, `false`, `0`).
            Não há fusão com o que já estava gravado.
          nullable: true
        token:
          description: |
            Substitui o token de sessão. Tem de continuar único: colidir dá `409`
            no envelope antigo (`"error": "conflict"`).

            Ausente, `null` e `""` são indistinguíveis e significam *não
            informado* — não há como apagar o token, e um corpo que só traga
            `{"token": ""}` responde `400 no_fields_to_update`.

            **É um segredo**: nunca em log nem em URL, e o valor de exemplo não
            deve ser usado.
          example: tk_EXEMPLO_NAO_USE_gere_o_seu_2
          nullable: false
          type: string
          writeOnly: true
        webhook:
          description: |
            Novo URL de webhook. Ausente, `null` e `""` são indistinguíveis e
            significam *não informado* — **`""` NÃO apaga o webhook**. Para o
            apagar, `DELETE /webhook`.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          type: string
      type: object
    PedidoEncaminhamento:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                Texto a enviar marcado como encaminhado.

                | estado | forma POR CONTEÚDO | forma POR CHAVE |
                |---|---|---|
                | ausente / `null` / `""` | `400 missing_body` — os três são indistinguíveis | ignorado, e registado no log |
                | `"   "` | **enviado** tal e qual; não há `trim` | ignorado, e registado no log |
                | preenchido | enviado | ignorado, e registado no log |
              example: Bom dia! O seu pedido saiu para entrega.
              nullable: false
              type: string
            chat_jid:
              description: |
                Conversa de ONDE a mensagem original veio.

                **Não é o mesmo campo que o sinónimo universal `chat`** — os dois
                eram a MESMA chave Go (`Chat`) antes da migração para DTO, e sob a
                regra de nome canónico colidiriam se ficassem com o mesmo nome; o
                alias universal manteve `chat` (é o que as outras dezasseis rotas
                de envio usam) e este campo, que identifica a conversa de ORIGEM
                na forma POR CHAVE, ganhou o nome novo `chat_jid`
                (HOUSEKEEP F319). Quem mandava `{"MessageID":"…","Chat":"…"}` passa
                a mandar `{"message_id":"…","chat_jid":"…"}` — é mudança de
                contrato, não rename de caixa.

                **Não é usado por caminho nenhum da implementação actual**
                (`send_forward.go`, `forwardByKey`): a mensagem é procurada só por
                sessão e `message_id`. Ausente, `null`, `""` e preenchido com
                qualquer valor produzem exactamente o mesmo resultado. Está
                reservado para desambiguação futura.
              example: 554192421234@s.whatsapp.net
              nullable: false
              type: string
            forwarding_score:
              default: 1
              description: |
                Quantas vezes a mensagem já foi encaminhada. É `*uint32`, logo
                ausente e `null` distinguem-se de `0` no desserializador — **mas a
                implementação volta a colapsá-los**:

                | estado | forma POR CONTEÚDO | forma POR CHAVE |
                |---|---|---|
                | ausente | vale `1` | ignorado |
                | `null` | vale `1` — indistinguível de ausente | ignorado |
                | **`0`** | **vale `1`** — a condição é `!= nil && > 0`, logo o zero explícito cai no padrão | ignorado |
                | maior que `0` | é usado tal e qual | ignorado |
                | negativo | `400 could_not_decode_payload` — o tipo é `uint32` | idem |

                Ou seja: **não há maneira de pedir score `0`** por esta rota. Na
                forma POR CHAVE o valor é lido do contexto da mensagem original e
                incrementado em 1, e o que o cliente mandar é ignorado.

                `1` é o valor que o Baileys produz num primeiro encaminhamento.
              example: 1
              format: int32
              minimum: 0
              nullable: true
              type: integer
            id:
              $ref: '#/components/schemas/IdCliente'
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            message_id:
              description: |
                `message_id` da mensagem guardada a reenviar.

                | estado | forma escolhida |
                |---|---|
                | ausente / `null` / `""` | **POR CONTEÚDO** — os três são indistinguíveis, e `body` passa a ser obrigatório |
                | preenchido | **POR CHAVE** — a mensagem é procurada no histórico |

                Na forma por chave, um id que o histórico não tem faz a busca
                falhar e a rota devolve o erro da busca, não `200`.
              example: 3EB0A4B2AFD45E625C0917
              nullable: false
              type: string
            phone:
              description: |
                JID de destino do encaminhamento — para onde a mensagem VAI.
                Sinónimo universal `chat`. Obrigatório nas DUAS formas: ausente,
                `null` e `""` são indistinguíveis e dão `400 missing_phone`
                (validado antes da escolha de forma); preenchido mas impossível de
                parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          type: object
      description: |
        Corpo de `POST /chat/send/forward`. Duas formas — POR CHAVE (`message_id`) ou
        POR CONTEÚDO (`body`). **A presença de `message_id` é o que escolhe a
        forma**, e os campos que não pertencem à forma escolhida são ignorados em
        silêncio. Campos desconhecidos também.
    PedidoEntrarGrupo:
      description: |
        **A struct de domínio mente aqui.** `GroupJoinRequest`
        (`pkg/domain/group.go:52-54`) declara `inviteLink`, e não é o que a rota
        lê: o corpo é `dtogroup.JoinGroupRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `code`. Um cliente
        escrito a partir do domínio recebe `400`, porque `inviteLink` é um campo
        DESCONHECIDO nesta rota, é ignorado (e registado no log como
        `unknown field "inviteLink"`), e `code` fica `""`.

        Este é o custo concreto de campo desconhecido não dar erro: o nome errado
        não se queixa de si próprio — queixa-se do campo certo estar em falta.
      properties:
        code:
          description: |
            O código NU do convite, sem o `https://chat.whatsapp.com/` à frente —
            é a forma que a bateria de campo mediu.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` — objecto canónico `error.code`/`error.message` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `"   "` | **passa a guarda** | não há `trim`; segue para o WhatsApp. Por analogia com `/group/inviteinfo`, onde foi MEDIDO, o desfecho é `500`, não `400` |
            | `inviteLink` em vez de `code` | não | `400 invalid_request` — campo desconhecido; ignorado, mas o log nomeia-o |
            | código válido | sim | — |

            O URL completo também passa, porque a biblioteca corta o prefixo
            (`internal/wa-noise/capabilities/group/invite.go:105`), mas isso não
            foi medido nesta rota e o nome do campo continua a ser `code`.

            Repare que `POST /group/invitelink` devolve o **link inteiro**, e não
            o código: alimentar essa resposta directamente aqui depende do corte
            de prefixo, não do contrato.
          example: IVccRoDVSbpHKNkgNxyZx4
          minLength: 1
          nullable: false
          type: string
      required:
        - code
      type: object
    PedidoEnvioAudio:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            audio:
              description: |
                O áudio, num de DOIS transportes:

                - **URI de dados** — tem de começar exactamente por `data:audio/`
                  (`send_audio.go`, `isDataURIAudio`). Uma imagem disfarçada de
                  áudio não passa: medido, `data:image/png;...` dá
                  `400 unsupported_audio_source`.
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_audio` — os três são indistinguíveis |
                | outra coisa qualquer | não | `400 unsupported_audio_source` |
                | URI de dados que não decodifica | não | `400 invalid_data_uri` |
                | zero bytes | não | `400 empty_audio_body` |
                | menos de **128 bytes** | não | `400 audio_too_small` |
                | acima de 16 MB | não | `400 audio_too_large` |

                Teto de **16 MB**, e piso de **128 bytes** (`minAudioBytes`,
                `send_audio.go:34`).
              example: data:audio/mp4;base64,AAAAIGZ0eXBNNEEgAAACAGlzb21pc28yYXZjMW1wNDE=
              minLength: 1
              nullable: false
              type: string
            caption:
              description: |
                Legenda. **Vai como mensagem de texto SEPARADA**, enviada DEPOIS do
                áudio — o protocolo não tem campo de legenda em áudio (F116).

                Sempre opcional: ausente, `null` e `""` são indistinguíveis e
                significam "não mandes segunda mensagem". Não há `trim`: `"   "` é
                legenda preenchida e faz sair uma segunda mensagem com três
                espaços.

                Ver `ResultadoEnvioAudio` para o que a resposta diz sobre ela — o
                envio não é atómico.
              example: O áudio que combinámos.
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            mimetype:
              description: |
                Força o MIME. Ausente, `null` e `""` são indistinguíveis e
                significam "resolve tu", com esta precedência de quatro níveis
                (`resolveAudioMimeType`):

                1. este campo, quando não vazio;
                2. o rótulo declarado pela própria URI de dados, ou o `Content-Type`
                   remoto quando começa por `audio/`;
                3. o tipo farejado dos bytes, salvo quando dá
                   `application/octet-stream` — que é tratado como "não consegui";
                4. o padrão conforme `ptt`.

                O valor dado não é validado: ao contrário de imagem e vídeo, esta
                rota não tem `invalid_audio_mime_type`.
              example: audio/ogg; codecs=opus
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            ptt:
              description: |
                `true` envia como mensagem de voz (a bolha com a onda), `false` como
                ficheiro de áudio.

                É `*bool` na struct, logo os três estados distinguem-se:

                | estado | efeito |
                |---|---|
                | **ausente** | `true` — nota de voz. **Não `false`** |
                | **`null`** | `true` — indistinguível de ausente |
                | `false` | ficheiro de áudio |
                | `true` | nota de voz |

                O padrão também decide o MIME de último recurso: `audio/ogg;
                codecs=opus` quando `ptt`, `audio/mpeg` quando não.
              example: true
              nullable: true
              type: boolean
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            seconds:
              description: |
                Duração declarada, em segundos. É `uint32`, logo negativo é
                `400 could_not_decode_payload`.

                **Só metadata — não é verificada contra os bytes.** Ausente, `null`
                e `0` são indistinguíveis e significam "duração não declarada": o
                cliente de quem recebe mostra o que conseguir deduzir.
              example: 12
              format: int32
              minimum: 0
              nullable: false
              type: integer
            waveform:
              description: |
                Onda desenhada na bolha de voz, em base64 cru. Sempre opcional:
                ausente, `null` e `""` são indistinguíveis e significam "sem onda".
                Não é validada nem gerada pelo servidor.
              format: byte
              nullable: true
              type: string
          required:
            - audio
          type: object
      description: |
        Corpo de `POST /chat/send/audio`. Áudio ou nota de voz; mínimo de 128 bytes.
        A legenda, se houver, vai como mensagem separada. Campos desconhecidos são
        ignorados, e **registados no log** desde 2026-08-26.
    PedidoEnvioAutocolante:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            emojis:
              description: |
                Emojis associados ao autocolante, para busca no cliente. Gravados no
                EXIF. Ausente, `null` e `[]` são indistinguíveis e significam "sem
                emojis". O conteúdo não é validado: qualquer texto é aceite.
              example:
                - "\U0001F389"
              items:
                description: Um emoji. `null` dentro da lista vira `""`.
                nullable: false
                type: string
              nullable: true
              type: array
            id:
              $ref: '#/components/schemas/IdCliente'
            mime_type:
              description: |
                MIME declarado da entrada. **Não é só declaração: é o que ESCOLHE o
                caminho de conversão** (`sticker/exif.go`, `ConvertToWebPSticker`).
                `video/*` e `image/gif` vão pela conversão de vídeo; `image/jpeg`,
                `image/png` e `image/jpg` pela de imagem.

                Ausente, `null` e `""` são indistinguíveis e significam "fareja dos
                bytes". Um valor errado aqui manda os bytes pelo conversor errado e
                termina em `sticker_conversion_failed`. A saída é sempre WebP.
              nullable: false
              type: string
            pack_id:
              description: |
                Identificador do pacote de autocolantes a que este pertence.
                Gravado no EXIF do WebP resultante. Ausente, `null` e `""` são
                indistinguíveis e gravam campo vazio — não é validado nem
                verificado contra pacote nenhum.
              nullable: false
              type: string
            pack_name:
              description: |
                Nome do pacote, gravado no EXIF. Ausente, `null` e `""` são
                indistinguíveis e gravam campo vazio.
              nullable: false
              type: string
            pack_publisher:
              description: |
                Editor do pacote, gravado no EXIF. Ausente, `null` e `""` são
                indistinguíveis e gravam campo vazio.
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            png_thumbnail:
              description: |
                Miniatura PNG, em base64 cru. Sempre opcional: ausente, `null` e
                `""` são indistinguíveis e significam "sem miniatura". Não é
                validada nem gerada pelo servidor.
              format: byte
              nullable: true
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            sticker:
              description: |
                O autocolante, como URI de dados (prefixo `data`, a discriminação
                frouxa do vídeo) ou URL http(s). Teto de **16 MB**.

                **A imagem é sempre CONVERTIDA para WebP pelo servidor** — o que
                sobe é o resultado da conversão, nunca os bytes de entrada.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_sticker` — os três são indistinguíveis |
                | nem URI de dados nem URL | não | `400 sticker_processing_failed` — **e não `unsupported_*_source`**, ao contrário das outras rotas de mídia (medido) |
                | acima de 16 MB | não | `400 sticker_too_large` |
                | conversão falha | não | `500 sticker_conversion_failed` |
              example: data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==
              minLength: 1
              nullable: false
              type: string
          required:
            - sticker
          type: object
      description: |
        Corpo de `POST /chat/send/sticker`. Autocolante em WebP. Campos
        desconhecidos são ignorados, e **registados no log**.
    PedidoEnvioBotoes:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                Corpo da mensagem, acima dos botões. Sinónimo `text`, usado quando
                `body` fica vazio depois do `trim`.

                | estado (nos DOIS nomes) | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_buttons_fields` |
                | `null` | não | idem — indistinguível de ausente |
                | `""` | não | idem |
                | **`"   "`** | **não** | idem — **esta rota FAZ `trim`**, ao contrário de `/chat/send/text` (medido) |
                | preenchido | sim | vai no fio já sem espaços nas pontas |
              example: Confirma a entrega para hoje às 15h?
              minLength: 1
              nullable: false
              type: string
            buttons:
              description: |
                Os botões.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `[]` | não | `400 missing_buttons_fields` — os três são indistinguíveis (medido) |
                | todos descartados na normalização | não | `400 no_valid_buttons`, com a lista dos tipos aceites |
                | alguns descartados | **sim** | `200`, e **quem manda três pode receber dois sem ser avisado** |

                Não há teto de número de botões imposto pela API. Ver
                `BotaoInterativo` para o que faz um botão ser descartado.
              items:
                $ref: '#/components/schemas/BotaoInterativo'
              minItems: 1
              nullable: true
              type: array
            footer:
              description: |
                Rodapé, abaixo dos botões. Sempre opcional: ausente, `null` e `""`
                são indistinguíveis e dão mensagem sem rodapé. Sem `trim`.
              example: DisparaZap
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            image:
              description: |
                Imagem de cabeçalho, como URI de dados (`data:image…`) ou URL
                http(s). Teto de **10 MB**.

                Sempre opcional: ausente, `null` e `""` são indistinguíveis e dão
                mensagem sem cabeçalho de imagem.

                **Nenhuma falha aqui derruba o envio**: URI que não decodifica,
                busca que falha, valor que não é nem URI nem URL, ou bytes acima do
                teto — todos deixam a mensagem seguir SEM imagem, com `200`, e a
                falha fica só no log.
              example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              nullable: false
              type: string
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`.

                **Esta rota não tem `missing_phone`**: destino, corpo e botões são
                validados JUNTOS, numa recusa só. Ausente, `null` e `""` são
                indistinguíveis e dão `400 missing_buttons_fields`, com a mensagem
                `missing Phone, Body or Buttons` — que não diz qual dos três
                faltou. Preenchido mas impossível de parsear dá
                `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            text:
              description: |
                Sinónimo de `body`, usado quando `body` está ausente, `null`, `""`
                ou só espaços. Mesmo `trim`.
              nullable: false
              type: string
            title:
              description: |
                Cabeçalho da mensagem. Sempre opcional: ausente, `null` e `""` são
                indistinguíveis e dão mensagem sem cabeçalho de texto. Não passa
                por `trim`, ao contrário do corpo.

                Quando há `image`, é a imagem que ocupa o cabeçalho e este campo
                deixa de ser desenhado.
              example: Confirmação de entrega
              nullable: false
              type: string
          type: object
      description: |
        Corpo de `POST /chat/send/buttons`. Mensagem interativa com botões. Cada
        botão exige `title` — `displayText` é ignorado e o botão cai em silêncio.
        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioCarrossel:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                Corpo da mensagem, acima dos cartões.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_carousel_fields` |
                | **`"   "`** | **não** | idem — **esta rota FAZ `trim`** |
                | preenchido | sim | vai no fio já sem espaços nas pontas |

                Ao contrário de `/chat/send/buttons` e `/chat/send/list`, aqui
                **não há sinónimo**: `text` é campo desconhecido e é ignorado.
              example: As pizzas de hoje.
              minLength: 1
              nullable: false
              type: string
            cards:
              description: |
                Os cartões, que deslizam na horizontal.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `[]` | não | `400 missing_carousel_fields` — os três são indistinguíveis |
                | todos descartados | não | `400 no_valid_cards` (medido) |
                | alguns descartados | **sim** | `200`, sem aviso do que sumiu |

                A apresentação é sempre `hscroll_cards`; o modo de álbum existe no
                protocolo e **não** é exposto (HOUSEKEEP F211).
              items:
                $ref: '#/components/schemas/CartaoCarrossel'
              minItems: 1
              nullable: true
              type: array
            footer:
              description: |
                Rodapé do carrossel, abaixo de todos os cartões. Sempre opcional:
                ausente, `null`, `""` e `"   "` são indistinguíveis e dão carrossel
                sem rodapé (passa por `TrimSpace`).
              example: Entregas até às 22h
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`.

                **Esta rota não tem `missing_phone`**: destino, corpo e cartões são
                validados JUNTOS. Ausente, `null` e `""` são indistinguíveis e dão
                `400 missing_carousel_fields`, que não diz qual dos três faltou.
                Preenchido mas impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          type: object
      description: |
        Corpo de `POST /chat/send/carousel`. Cartões deslizáveis na horizontal;
        cada cartão exige `buttons`. Campos desconhecidos são ignorados em
        silêncio.
    PedidoEnvioContacto:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            id:
              $ref: '#/components/schemas/IdCliente'
            name:
              description: |
                Nome mostrado no cartão. Ausente, `null` e `""` são indistinguíveis
                e dão `400 missing_name`; `"   "` **passa** — não há `trim`. Não é
                confrontado com o `FN` do vCard.
              example: Suporte DisparaZap
              minLength: 1
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            vcard:
              description: |
                O cartão em vCard, tal e qual — o servidor **não o valida nem o
                reescreve**, apenas o transporta.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_vcard` — os três são indistinguíveis |
                | `"   "` | **sim** | enviado; não há `trim` |
                | vCard malformado | **sim** | `200`, e chega quebrado ao destinatário |

                Para que o cliente reconheça o contacto como utilizador de WhatsApp,
                a linha `TEL` precisa do parâmetro `waid`.
              example: |
                BEGIN:VCARD
                VERSION:3.0
                FN:Suporte DisparaZap
                TEL;type=CELL;waid=554192421234:+55 41 9242-1234
                END:VCARD
              minLength: 1
              nullable: false
              type: string
          required:
            - name
            - vcard
          type: object
      description: |
        Corpo de `POST /chat/send/contact`. Cartão de contacto em vCard, que o
        destinatário pode guardar. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioDocumento:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            caption:
              description: |
                Legenda, desenhada com o documento. Sempre opcional: ausente,
                `null` e `""` são indistinguíveis e dão documento sem legenda. Não
                há `trim`.
              example: A nota fiscal do pedido.
              nullable: false
              type: string
            document:
              description: |
                O documento, num de DOIS transportes:

                - **URI de dados** — qualquer `data:`, sem restrição de MIME: um
                  documento legitimamente carrega `application/pdf`,
                  `application/zip`, `text/plain`…
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_document` — os três são indistinguíveis |
                | outra coisa qualquer | não | `400 unsupported_document_source` |
                | URI de dados que não decodifica | não | `400 invalid_data_uri` |
                | zero bytes | não | `400 empty_document_body` |
                | acima de 100 MB | não | `400 document_too_large` |

                Teto de **100 MB**. Não há verificação de MIME: esta é a única rota
                de mídia sem `invalid_*_mime_type`.
              example: data:application/pdf;base64,JVBERi0xLjQKJcOkw7zDtsOfCg==
              minLength: 1
              nullable: false
              type: string
            file_name:
              description: |
                Nome com que o documento aparece no cliente.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_filename` |
                | `null` | não | `400 missing_filename` — indistinguível de ausente |
                | `""` | não | `400 missing_filename` — indistinguível de ausente |
                | `"   "` | **sim** | vai tal e qual; não há `trim` |

                É metadata pura: nunca vira operação de ficheiro do lado do
                servidor, e não é higienizado nem validado contra o MIME.
              example: nota-fiscal-1234.pdf
              minLength: 1
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            mime_type:
              description: |
                Força o MIME. Ausente, `null` e `""` são indistinguíveis e
                significam "deduz tu": o tipo é farejado dos bytes decodificados —
                o rótulo da própria URI de dados não é usado. O valor dado não é
                validado.
              example: application/pdf
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - document
            - file_name
          type: object
      description: |
        Corpo de `POST /chat/send/document`. Ficheiro com nome próprio, mostrado
        como anexo descarregável. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioEnquete:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            group:
              description: |
                JID de destino. **O nome do campo é `group`, e não `phone`, mesmo
                para uma enquete enviada a um contacto individual.**

                Medido em 2026-08-26: um pedido completo com `phone` responde
                `400 missing_group` — `phone` não existe nesta struct, logo cai na
                regra do campo desconhecido: é ignorado, e registado no log. O sinónimo
                universal `chat` funciona e é a saída recomendada.

                Ausente, `null` e `""` são indistinguíveis e dão
                `400 missing_group`; preenchido mas impossível de parsear dá
                `400 invalid_group`.
              example: 120363411669320145@g.us
              minLength: 1
              nullable: false
              type: string
            header:
              description: |
                A pergunta da enquete. Ausente, `null` e `""` são indistinguíveis e
                dão `400 missing_header`; `"   "` **passa** — não há `trim`.
              example: Qual o melhor horário para a entrega?
              minLength: 1
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            options:
              description: |
                As opções, em texto claro.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `[]` | não | `400 insufficient_options` — os três são indistinguíveis (medido) |
                | um só elemento | não | `400 insufficient_options` |
                | dois ou mais | sim | — |

                Não há teto de número de opções imposto pela API, e **duplicados e
                strings vazias não são recusados**: `["", ""]` é aceite e produz uma
                enquete com duas opções em branco. A escolha é sempre ÚNICA — o
                número de opções seleccionáveis não é exposto no payload.
              example:
                - Manhã
                - Tarde
                - Noite
              items:
                description: |
                  O texto de uma opção. `null` dentro da lista vira `""`, que conta
                  como opção válida para o mínimo de duas.
                nullable: false
                type: string
              minItems: 2
              nullable: true
              type: array
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - header
            - options
          type: object
      description: |
        Corpo de `POST /chat/send/poll`. Enquete com opções. O destino vai em
        `group`, e não em `phone`, mesmo para contacto individual. Campos
        desconhecidos são ignorados, e **registados no log** — e `phone` é um deles.
    PedidoEnvioImagem:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            caption:
              description: |
                Legenda, desenhada com a imagem. Sempre opcional: ausente, `null` e
                `""` são indistinguíveis e dão imagem sem legenda. Não há `trim` —
                `"   "` vai no fio como legenda de três espaços.
              example: A etiqueta do seu pedido.
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            image:
              description: |
                A imagem, num de DOIS transportes:

                - **URI de dados** — tem de começar exactamente por `data:image`
                  (`send_image.go`, `dataImagePrefix`). Um
                  `data:application/pdf;...` **não** bate aqui (medido).
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_image` — os três são indistinguíveis |
                | outra coisa qualquer | não | `400 unsupported_image_source` |
                | URI de dados que não decodifica | não | `400 invalid_data_uri` |
                | decodifica para zero bytes | não | `400 empty_image_body` |
                | acima de 16 MB | não | `400 image_too_large` |
                | URL que falha a busca | não | `400 image_fetch_failed` |

                Teto de **16 MB** nos dois transportes.
              example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              minLength: 1
              nullable: false
              type: string
            jpeg_thumbnail:
              description: |
                Miniatura JPEG, em base64 cru (sem prefixo `data:`). Sempre
                opcional: ausente, `null` e `""` são indistinguíveis e significam
                "sem miniatura". Não é validada nem convertida — os bytes vão tal e
                qual para o protocolo.
              format: byte
              nullable: true
              type: string
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            mime_type:
              description: |
                Força o MIME em vez de o deduzir dos bytes. Ausente, `null` e `""`
                são indistinguíveis e significam "deduz tu".

                Quando vazio, o tipo é farejado do conteúdo DECODIFICADO — o rótulo
                que a própria URI de dados declara **não** é usado, de propósito. Se
                o tipo resolvido não for de imagem, é
                `400 invalid_image_mime_type`. O valor dado não é validado contra os
                bytes: declarar `image/png` sobre bytes de JPEG é aceite.
              example: image/png
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - image
          type: object
      description: |
        Corpo de `POST /chat/send/image`. Imagem com legenda opcional; aceita URI de
        dados ou URL http(s). Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioLista:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                Sinónimo de `desc`, usado quando `desc` está ausente, `null`, `""`
                ou só espaços.
              nullable: false
              type: string
            button_text:
              default: Select
              description: |
                Rótulo do botão que abre a lista. Passa por `TrimSpace`: ausente,
                `null`, `""` e `"   "` são indistinguíveis e todos significam
                `Select` (`defaultListButtonText`, `send_list.go:17`).
              example: Ver cardápio
              nullable: false
              type: string
            desc:
              description: |
                Corpo principal da mensagem. Sinónimos, nesta ordem de precedência,
                `body` e `text`.

                **Três níveis, não quatro.** Antes da migração para DTO,
                `domain.SendListRequest` tinha `Desc`/`Body`/`Body2`/`Text` com
                etiquetas `"Desc"`, `"Body"`, `"body"`, `"text"` — e `Body`/`body`
                já eram a MESMA chave para o `encoding/json` do Go, que casa nomes
                ignorando maiúsculas, logo mandar as duas no mesmo pedido já era
                ambíguo antes desta secção existir. A cadeia colapsou para
                `desc <- body <- text`, e `Body2` saiu do domínio (HOUSEKEEP F318).

                | estado (nos TRÊS nomes) | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_desc` |
                | `null` | não | idem — indistinguível de ausente |
                | `""` | não | idem |
                | **`"   "`** | **não** | idem — **esta rota FAZ `trim`** |
                | preenchido | sim | vai no fio já sem espaços nas pontas |
              example: Escolha um item do cardápio.
              minLength: 1
              nullable: false
              type: string
            footer_text:
              description: |
                Rodapé, abaixo do botão. Sempre opcional: ausente, `null`, `""` e
                `"   "` são indistinguíveis e dão mensagem sem rodapé (passa por
                `TrimSpace`).
              example: Entregas até às 22h
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            list:
              description: |
                Forma LEGADA: lista plana, embrulhada numa secção única cujo título
                vem de `top_text`, ou de `Menu` quando `top_text` está vazio.

                Só é lida quando `sections` está ausente, `null` ou `[]`. Ausente,
                `null` e `[]` são indistinguíveis. As linhas passam pelo mesmo
                descarte silencioso de `sections`.
              items:
                $ref: '#/components/schemas/LinhaLista'
              nullable: true
              type: array
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone` — e essa verificação
                acontece **depois** das de corpo e de secções, logo um pedido com
                destino inválido E sem secções responde `missing_sections`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            sections:
              description: |
                Forma PREFERIDA: lista com várias secções.

                | estado de `sections` e `list` | aceite? | efeito |
                |---|---|---|
                | ambas ausentes / `null` / `[]` | não | `400 missing_sections` — os três estados são indistinguíveis |
                | `sections` preenchida | sim | **`list` é ignorada em silêncio** |
                | todas as secções descartadas | não | `400 no_valid_sections` |
                | algumas descartadas | **sim** | `200`, sem aviso do que sumiu |
              items:
                $ref: '#/components/schemas/SecaoLista'
              nullable: true
              type: array
            text:
              description: |
                Segundo sinónimo de `desc`, usado quando `desc` e `body` estão
                ambos ausentes, `null`, `""` ou só espaços — o último da cadeia.
              nullable: false
              type: string
            top_text:
              description: |
                Cabeçalho, acima do corpo. Sempre opcional: ausente, `null`, `""` e
                `"   "` são indistinguíveis e dão mensagem sem cabeçalho (passa por
                `TrimSpace`).

                **Tem um segundo papel**: na forma legada `list`, é o título da
                secção única, e quando está vazio esse título passa a ser `Menu`
                (`defaultLegacySectionTitle`). Não afecta os títulos de `sections`.
              example: Cardápio de hoje
              nullable: false
              type: string
          type: object
      description: |
        Corpo de `POST /chat/send/list`. Lista de seleção, agrupada em secções,
        aberta por um botão. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioLocalizacao:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            id:
              $ref: '#/components/schemas/IdCliente'
            latitude:
              description: |
                Latitude. É `*float64` de propósito (HOUSEKEEP F121), logo **zero é
                valor VÁLIDO e distingue-se de ausente**:

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_latitude` |
                | **`null`** | **não** | `400 missing_latitude` — medido; `null` dá `nil`, igual a ausente |
                | `0` | **sim** | coordenada válida — o Golfo da Guiné |
                | preenchido | sim | — |

                Não há verificação de intervalo: `-999` é aceite pela API e vai
                para o WhatsApp.
              example: -25.4284
              format: double
              nullable: true
              type: number
            longitude:
              description: |
                Longitude. Mesma regra da latitude: `*float64`, `0` é aceite,
                ausente e `null` dão `400 missing_longitude` (medido, e a latitude é
                validada PRIMEIRO — um pedido sem as duas responde
                `missing_latitude`). Sem verificação de intervalo.
              example: -49.2733
              format: double
              nullable: true
              type: number
            name:
              description: |
                Rótulo do lugar, mostrado sobre o mapa. Sempre opcional: ausente,
                `null` e `""` são indistinguíveis e dão ponto sem rótulo. Não há
                `trim`.
              example: Curitiba
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - latitude
            - longitude
          type: object
      description: |
        Corpo de `POST /chat/send/location`. Ponto no mapa, com nome opcional. Não
        há campo de morada — só `latitude`, `longitude` e `name` chegam ao
        protocolo. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioModelo:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            buttons:
              description: |
                Os botões do modelo, com vocabulário PRÓPRIO (`display_text`, e os
                tipos `quickreply`/`url`/`call`) — diferente do de
                `/chat/send/buttons`.

                Ausente, `null` e `[]` são indistinguíveis e dão
                `400 missing_buttons`. **Nenhum botão é descartado e nenhum campo
                de botão é validado**: `[{}]` é um pedido válido e produz um botão
                de resposta rápida sem rótulo. Não há teto de número de botões
                imposto pela API.
              items:
                $ref: '#/components/schemas/BotaoModelo'
              minItems: 1
              nullable: true
              type: array
            content:
              description: |
                Corpo do modelo. Ausente, `null` e `""` são indistinguíveis e dão
                `400 missing_content`; `"   "` **passa** — esta rota não faz `trim`,
                ao contrário de `/chat/send/buttons`.
              example: O seu pedido 1234 está pronto para retirada.
              minLength: 1
              nullable: false
              type: string
            footer:
              description: |
                Rodapé. **Obrigatório nesta rota** — é a única rota de envio em que
                o rodapé não é opcional.

                Ausente, `null` e `""` são indistinguíveis e dão
                `400 missing_footer` (medido); `"   "` **passa** — não há `trim`.
              example: DisparaZap
              minLength: 1
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - content
            - footer
            - buttons
          type: object
      description: |
        Corpo de `POST /chat/send/template`. Mensagem de modelo com botões de URL,
        de chamada ou de resposta rápida. Campos desconhecidos são ignorados em
        silêncio.
    PedidoEnvioTexto:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            body:
              description: |
                Texto da mensagem.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_body` |
                | `null` | não | `400 missing_body` — indistinguível de ausente |
                | `""` | não | `400 missing_body` — indistinguível de ausente |
                | `"   "` | **sim** | ENVIADA tal e qual; **não há `trim` nesta rota** |
                | tipo errado (`123`) | não | `400 could_not_decode_payload` |

                Medido em 2026-08-26 contra `localhost:8080`. Não há limite de
                comprimento imposto pela API — o corpo do pedido tem um teto de
                bytes no middleware, não neste campo.
              example: Bom dia! O seu pedido saiu para entrega.
              minLength: 1
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            link_preview:
              default: false
              description: |
                Quando `true`, o serviço procura a primeira URL do corpo e busca a
                metadata Open Graph dela, enviando a mensagem como texto estendido
                com pré-visualização.

                **Ausente, `null` e `false` são indistinguíveis** — o campo é
                `bool` e não `*bool`, logo `null` vira `false` em silêncio. Não há
                forma de dizer "decide tu".

                Falha na busca não é erro: a mensagem segue sem pré-visualização,
                com `200`.
              example: true
              nullable: false
              type: boolean
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            phone:
              description: |
                JID de destino — contacto, grupo ou canal. Sinónimo universal
                `chat`; `phone` ganha quando os dois vierem preenchidos.

                | estado (nos DOIS nomes) | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_phone` |
                | `null` | não | `400 missing_phone` — indistinguível de ausente |
                | `""` | não | `400 missing_phone` — indistinguível de ausente |
                | `"   "` | **sim** aqui | passa a validação e falha depois em `400 invalid_phone` |
                | preenchido, mas não parseia | não | `400 invalid_phone` |
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
          required:
            - body
          type: object
      description: |
        Corpo de `POST /chat/send/text`. Mensagem de texto, com pré-visualização de
        link opcional. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoEnvioVideo:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            caption:
              description: |
                Legenda, desenhada com o vídeo. Sempre opcional: ausente, `null` e
                `""` são indistinguíveis e dão vídeo sem legenda. Não há `trim`.
              example: O vídeo da montagem.
              nullable: false
              type: string
            id:
              $ref: '#/components/schemas/IdCliente'
            jpeg_thumbnail:
              description: |
                Miniatura JPEG, em base64 cru. Sempre opcional: ausente, `null` e
                `""` são indistinguíveis e significam "sem miniatura". Não é
                validada nem convertida.
              format: byte
              nullable: true
              type: string
            mentioned_jid:
              $ref: '#/components/schemas/MencoesEnvio'
            mime_type:
              description: |
                Força o MIME em vez de o deduzir dos bytes. Ausente, `null` e `""`
                são indistinguíveis e significam "deduz tu". Se o tipo resolvido não
                for de vídeo, é `400 invalid_video_mime_type`. O valor dado não é
                validado contra os bytes.
              example: video/mp4
              nullable: false
              type: string
            phone:
              description: |
                JID de destino. Sinónimo universal `chat`. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_phone`; preenchido mas
                impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            reply_to:
              $ref: '#/components/schemas/ContextoResposta'
            video:
              description: |
                O vídeo, num de DOIS transportes:

                - **URI de dados** — a discriminação mais frouxa das cinco rotas de
                  mídia: bastam os quatro primeiros caracteres serem `data`, sem os
                  dois-pontos (`send_video.go`, `isDataVideo`). Qualquer MIME
                  declarado passa — medido em 2026-08-26,
                  `data:application/pdf;base64,...` **passa** esta porta e só morre
                  depois, em `video_too_small`.
                - **URL http(s)** — buscada pelo servidor, com protecção contra SSRF.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente / `null` / `""` | não | `400 missing_video` — os três são indistinguíveis |
                | `"dat"` ou outra coisa | não | `400 unsupported_video_source` |
                | URI de dados que não decodifica | não | `400 invalid_data_uri` |
                | zero bytes | não | `400 empty_video_body` |
                | menos de **256 bytes** | não | `400 video_too_small` |
                | acima de 100 MB | não | `400 video_too_large` |

                Teto de **100 MB**, e piso de **256 bytes** (`minVideoBytes`,
                `send_video.go:36`).
              example: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
              minLength: 1
              nullable: false
              type: string
          required:
            - video
          type: object
      description: |
        Corpo de `POST /chat/send/video`. Vídeo com legenda; mínimo de 256 bytes,
        recusado antes do envio. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
    PedidoFavoritarMensagem:
      description: |
        Favorita ou desfavorita uma mensagem. Os três identificadores são
        obrigatórios: a conversa, quem escreveu a mensagem e a própria mensagem.

        **Esta rota NÃO tem alias.** `chat` aqui é o campo real, e não o nome
        universal de `AlvoConversa`: `jid` não é aceite, e um pedido com `jid`
        devolve `400 missing_chat` (medido).

        **Ordem das recusas, medida**: `missing_chat` → `missing_message_id` →
        `missing_sender` → `invalid_chat_jid` → `invalid_sender_jid`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            JID da conversa onde a mensagem está.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_chat` |
            | `null` | não | `400 missing_chat` — indistinguível de ausente (medido) |
            | `""` | não | `400 missing_chat` — indistinguível de ausente |
            | mal formado | não | `400 invalid_chat_jid` |
            | JID válido | sim | — |
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        from_me:
          description: |
            `true` quando a mensagem foi escrita pela própria sessão.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | vale `false` — a mensagem é tratada como de OUTRA pessoa |
            | `null` | sim | vale `false`, indistinguível de ausente |
            | `false` | sim | mensagem de outra pessoa |
            | `true` | sim | mensagem própria |
            | `"true"` | não | `400 could_not_decode_payload` |

            **É `bool` não-ponteiro** (`pkg/domain/star.go:9`), e aqui `false`
            tem significado próprio: identifica a mensagem no lado errado da
            conversa. Ausente e `false` são o mesmo pedido, logo esquecer o
            campo numa mensagem própria endereça a chave errada em silêncio.
            Pelo critério da secção 4 do contrato arquitectural este campo
            DEVIA ser `*bool`; não é.
          example: true
          nullable: false
          type: boolean
        message_id:
          description: |
            `message_id` da mensagem a favoritar. Ausente, `null` e `""` dão
            todos `400 missing_message_id`. Não há verificação de que o id
            exista.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        sender:
          description: |
            JID de quem ESCREVEU a mensagem. Obrigatório — ausente, `null` e
            `""` dão todos `400 missing_sender`, e mal formado dá
            `400 invalid_sender_jid` (medido). Em conversa individual com uma
            mensagem própria, é o JID da própria conta.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        star:
          description: |
            `true` favorita, `false` desfavorita.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | vale `false` — **DESFAVORITA**, `200 "Message unstarred"` |
            | `null` | sim | vale `false`, indistinguível de ausente |
            | `false` | sim | desfavorita |
            | `true` | sim | favorita |

            É `bool` não-ponteiro; omitir não é "não decidi".
          example: true
          nullable: false
          type: boolean
      required:
        - chat
        - sender
        - message_id
      type: object
    PedidoFixarConversa:
      description: |
        Fixa ou desafixa a CONVERSA no topo da lista. Não fixa uma mensagem
        dentro dela — isso é outro mecanismo (`PinInChatMessage`), e não está
        exposto nesta API.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            Nome universal do destino. Só vale quando `jid` estiver ausente,
            `null` ou `""`; caso contrário é ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        jid:
          description: |
            JID da conversa a fixar. Ausente, `null` e `""` são o mesmo estado e
            fazem cair para `chat`; sem os dois é `400 missing_jid`, e mal
            formado é `400 invalid_chat_jid` (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        pin:
          description: |
            `true` fixa, `false` desafixa.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | vale `false` — **DESAFIXA** |
            | `null` | sim | vale `false`, indistinguível de ausente |
            | `false` | sim | desafixa |
            | `true` | sim | fixa |

            É `bool` não-ponteiro; omitir não é "não decidi".
          example: true
          nullable: false
          type: boolean
      required:
        - pin
      type: object
    PedidoFotoGrupo:
      description: |
        Foto de grupo. **Duas armadilhas medidas, e as duas com uma variável de
        cada vez.** O corpo é `dtogroup.SetGroupPhotoRequest`
        (`pkg/presentation/http/dto/group/request.go`); só `photo` é validado.
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Não é validado pelo manipulador: ausente, `null` e `""`
            são indistinguíveis e chegam ao parser de JID, que devolve
            `400 invalid_jid` — envelope NOVO. `chat` cobre a ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        photo:
          description: |
            A imagem em base64 **CRU**, sem o prefixo `data:image/jpeg;base64,`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente**. Para REMOVER a foto a rota é `POST /group/photo/remove`, não o envio de vazio |
            | `"   "` | não | passa a guarda `== ""` e morre no descodificador base64: `400` — **mas com o MESMO corpo `invalid_request`** |
            | `data:image/jpeg;base64,…` | **não** | `400` — medido; o descodificador recusa os `:` e `;` do URI de dados |
            | base64 inválido | não | `400`, **corpo idêntico ao de campo em falta** |
            | JPEG em base64 cru | sim | — |
            | PNG em base64 cru | não | bem descodificado aqui e recusado pelo WhatsApp: `422 upstream_rejected` |

            **As quatro causas de `400` desta rota produzem o mesmo corpo**
            — `{"code":400,"error":{"code":"invalid_request","message":"Requisição inválida."},"success":false}` — porque a
            falha de base64 também sai por `RespondJSON` com erro não-tipado
            (`handler_group_mgmt.go:249`). Nem sequer se distingue "não mandei
            foto" de "mandei com prefixo `data:`".

            **Isto diverge de `/chat/send/image`**, que ACEITA o URI de dados. As
            duas rotas recebem imagem e só uma aceita o prefixo.
          example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA==
          format: byte
          minLength: 1
          nullable: false
          type: string
      required:
        - photo
      type: object
    PedidoInfoConvite:
      description: |
        Inspecção de um convite. O corpo é `dtogroup.GetGroupInviteInfoRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `json:"code"`
        minúsculo — não mais a struct de domínio com `Code` maiúsculo que este
        ficheiro descrevia antes da migração para DTO
        (`docs/HTTP-DTO-CONVENTIONS.md`). `inviteLink` continua a ser campo
        desconhecido e é ignorado.
      properties:
        code:
          description: |
            Código do convite.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_code` — envelope NOVO, com `error.code` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `"   "` | **passa a guarda** | **medido: `500 internal server error`**, não `400`. Não há `trim`, e o valor segue para o WhatsApp |
            | código inexistente | não | **medido: `500`** — o use case embrulha o erro com `fmt.Errorf` e a recusa perde a taxonomia (`get_group_invite_info.go:44`) |
            | `IVccRoDVSbpHKNkgNxyZx4` | sim | — |
            | `https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4` | **sim** | medido `200`; a biblioteca corta o prefixo (`internal/wa-noise/capabilities/group/invite.go:83`) |
          example: IVccRoDVSbpHKNkgNxyZx4
          minLength: 1
          nullable: false
          type: string
      required:
        - code
      type: object
    PedidoInfoUtilizadores:
      description: |
        JIDs a consultar. A struct é a MESMA da rota de verificação
        (`domain.CheckUserRequest`, campo `phone`), mas o manipulador acrescenta
        `@s.whatsapp.net` a todo valor sem `@` antes de chamar o caso de uso
        (`handler_user.go:normalizePhones`, F242/F225).

        **A diferença face a `POST /user/check` é real e confunde**: em
        `/user/check` o valor viaja como NÚMERO NU e é o WhatsApp que resolve; aqui
        o valor é convertido num JID COMPLETO antes de qualquer consulta. Por isso
        uma cadeia que `/user/check` descarta em silêncio, aqui vira
        `lixo@s.whatsapp.net` e faz a chamada inteira falhar — ver `phone`.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        phone:
          description: |
            JIDs (ou números nus, que o manipulador qualifica) a consultar.

            | estado | aceite? | efeito medido |
            |---|---|---|
            | ausente (`{}`) | **sim** | `200 {"data":{"users":{}}}` |
            | `null` | **sim** | `200 {"data":{"users":{}}}` — indistinguível de ausente |
            | `[]` | **sim** | `200 {"data":{"users":{}}}` |
            | `[""]` | **sim** | `200 {"data":{"users":{}}}` |
            | `["554192421234"]` | sim | qualificado para `…@s.whatsapp.net` |
            | `["554192421234@s.whatsapp.net"]` | sim | usado tal e qual |
            | `["90937376170214@lid"]` | sim | usado tal e qual; ver a ressalva de `LID` |
            | `["nao-e-numero"]` | **sim, e é o caso perigoso** | ver abaixo |
            | `"554192421234"` (não-array) | não | `400 could_not_decode_payload` |

            **Repare na assimetria de vazio face a `/user/check`**: a mesma
            condição — "não pediste nada" — devolve `data: null` numa rota e
            `data: {"users":{}}` na outra. Um cliente que trate as duas com o mesmo
            código tem de cobrir as duas formas.

            **O caso perigoso, MEDIDO em 2026-08-26, contradiz o que a
            documentação anterior desta rota dizia.** Um valor que não é número
            NÃO é "saltado em silêncio": depois de `normalizePhones` ele contém
            `@`, logo passa o parser, e a consulta ao WhatsApp não resolve. O que
            se observou:

            - `{"phone":["nao-e-numero"]}` → `500 internal server error` na
              primeira chamada e, nas repetições seguintes, **nenhuma resposta em
              45 s** (o cliente desiste, não o servidor).
            - `{"phone":["   "]}` → **nenhuma resposta em 25 s**.
            - `{"phone":["554192421234","nao-e-numero"]}` → **nenhuma resposta em
              25 s**: uma entrada má leva consigo as boas do mesmo lote.

            Sanitize os valores ANTES de chamar, e prefira lotes pequenos: não há
            forma de saber, pela resposta, qual entrada envenenou o pedido.
          example:
            - 554192421234@s.whatsapp.net
          items:
            description: |
              Um JID completo, ou um número nu que o manipulador qualifica com
              `@s.whatsapp.net`. `null` num item vira `""` (o item é `string`, não
              `*string`) e é ignorado; qualquer outra cadeia sem `@` que não seja um
              número faz o pedido inteiro falhar ou pendurar — ver a descrição do
              array.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          nullable: true
          type: array
      required:
        - phone
      type: object
    PedidoLigacaoComunidade:
      description: |
        Pedido de ligação ou desligação de um grupo a uma comunidade
        (`POST /community/link` e `POST /community/unlink`).

        **Não aceita o alias `chat`**: a struct não embute `ChatTarget`
        (`pkg/domain/community.go:31-40`). Mandá-lo não dá erro — é ignorado como
        qualquer campo desconhecido, e o pedido falha com
        `400 missing_community_jid`. Medido.
      properties:
        community_jid:
          description: |
            JID da comunidade (grupo-pai), no servidor `@g.us`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_community_jid` |
            | `null` | não | idem — indistinguível de ausente |
            | `""` | não | idem — indistinguível de ausente |
            | não interpretável | não | `400 invalid_jid`, `could not parse community JID "…"` |
            | `@g.us` real | sim | — |

            **É verificado antes de `group_jid`**: um pedido sem os dois revela
            primeiro este. Medido.

            **O código do JID malformado é `invalid_jid` aqui**, e não
            `invalid_community_jid` como nas duas rotas de leitura — são funções
            de parse diferentes (`community.go:106` contra `community.go:37`).
          example: 120363430034334401@g.us
          minLength: 1
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo a ligar ou desligar, no servidor `@g.us`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_group_jid` |
            | `null` | não | idem — indistinguível de ausente |
            | `""` | não | idem — indistinguível de ausente |
            | não interpretável | não | `400 invalid_jid`, `could not parse group JID "…"` |
            | `@g.us` real | sim | — |

            **O grupo de avisos da comunidade não pode ser desligado**: nasce com
            ela e vem marcado `is_default_sub_group: true` (F237).
          example: 120363411669320145@g.us
          minLength: 1
          nullable: false
          type: string
      required:
        - community_jid
        - group_jid
      type: object
    PedidoLimiteHistorico:
      description: |
        Corpo de `POST /webhook/history` e de `POST /session/history` — a mesma
        operação. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        history:
          default: 0
          description: |
            Quantas mensagens gravar por conversa em `message_history`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | **sim** | grava `0` — **desliga a gravação** |
            | `null` | **sim** | grava `0` — **indistinguível de ausente** |
            | `0` | sim | desliga a gravação |
            | `-1` | não | `400 invalid_history` |
            | `> 0` | sim | passa a gravar esse número |

            As duas primeiras linhas são a armadilha, e foram medidas a
            2026-08-26: `POST /session/history {}` responde
            `200 {"History": 0}` e **apaga o limite que estava gravado**. Não há
            aqui a distinção entre ausência e zero que
            `PUT /admin/users/{id}` ganhou (F218).

            `0` é também o valor de origem de uma instalação nova.
          example: 100
          minimum: 0
          nullable: false
          type: integer
      required:
        - history
      type: object
    PedidoMarcarLida:
      description: |
        Marca uma ou mais mensagens como lidas.

        **`chat_phone` e `sender_phone` são as ÚNICAS grafias aceites.** Antes da
        migração para DTO, o manipulador decodificava `domain.MarkReadRequest`
        directamente, que também aceitava os nomes antigos `Chat`/`Sender` — mas
        nenhum dos dois alguma vez foi RESOLVIDO (`mark_read.go:41`,
        `jidChat = ""`; comportamento herdado do upstream, travado por
        `TestMarkRead_LegacyFieldsResolveToEmptyJID`). A migração para
        `dto/message.MarkReadRequest` (HOUSEKEEP F322) tirou os dois campos do
        DTO de pedido: continuam a existir no domínio, mas **sem forma de lá
        chegar pelo fio** — mandar `"Chat"` ou `"Sender"` hoje é campo
        desconhecido, ignorado como qualquer outro. Sem `chat_phone` nem `chat`
        (nome antigo, já não aceite) é `400 missing_chatphone`, medido.

        **Ordem das recusas, medida**: `missing_chatphone` →
        `invalid_chatphone` → `invalid_senderphone` → `missing_id`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat_phone:
          description: |
            JID ou número da conversa. Ausente, `null` e `""` são o mesmo estado
            e dão `400 missing_chatphone` (medido); mal formado é
            `400 invalid_chatphone` (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        id:
          description: |
            Lista de `message_id` a marcar como lidos.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_id` |
            | `null` | não | `400 missing_id` (medido) — indistinguível de ausente |
            | `[]` | não | `400 missing_id` (medido) |
            | `[""]` | sim | um id vazio conta como item; segue para o WhatsApp |
            | preenchida | sim | — |

            Sem tecto de tamanho. Itens duplicados não são removidos. A ordem
            não é significativa. Nenhum item é validado, logo nenhum é
            descartado — a lista chega inteira ao protocolo.
          example:
            - 3EB0A4B2AFD45E625C0917
          items:
            description: '`message_id` de uma mensagem. Não é verificado que exista.'
            nullable: false
            type: string
          minItems: 1
          nullable: false
          type: array
        sender_phone:
          description: |
            JID de quem escreveu as mensagens, em conversa de grupo. Opcional:
            ausente, `null` e `""` são o mesmo estado e a marcação segue sem
            remetente. Preenchido mal formado é `400 invalid_senderphone`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - id
      type: object
    PedidoMarcarVistoCanal:
      description: Pedido de marcação de mensagens do canal como vistas.
      properties:
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid`. **É verificado antes de `server_ids`**: um pedido sem
            nenhum dos dois revela primeiro o `jid`. Ver `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        server_ids:
          description: |
            Os `server_id` a marcar como vistos.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_server_ids` |
            | `null` | não | `400 missing_server_ids` — indistinguível de ausente |
            | `[]` | não | `400 missing_server_ids` — **indistinguível de ausente** |
            | `["a"]` | não | `400 could_not_decode_payload` — o pedido INTEIRO é recusado |
            | `[1,2,3]` | sim | — |

            **Item inválido NÃO é descartado em silêncio**, ao contrário do que
            acontece nos botões de `/chat/send/buttons`: como o tipo é `[]int`, um
            item não inteiro rebenta a descodificação e nada é marcado. Medido.

            Duplicados e ordem não são validados por nós; `0` é um item aceite pela
            descodificação, e o que o WhatsApp faz com ele não foi medido.
          example:
            - 1
            - 2
            - 3
          items:
            description: Um `server_id` de mensagem do canal, tal como vem em `MensagemCanal.server_id`.
            nullable: false
            type: integer
          minItems: 1
          nullable: false
          type: array
      required:
        - jid
        - server_ids
      type: object
    PedidoMensagemIndisponivel:
      description: |
        Pede ao par o REENVIO de uma mensagem que não se conseguiu decifrar.

        **Ordem das recusas, medida**: `missing_chat` → `missing_sender` →
        `missing_id` → `invalid_chat_jid` → `invalid_sender_jid`.

        Não há alias `jid` nem `Phone` nesta rota. Campos desconhecidos são
        ignorados, e **registados no log** desde 2026-08-26.
      properties:
        chat:
          description: |
            JID da conversa onde a mensagem indecifrável apareceu. Ausente,
            `null` e `""` dão todos `400 missing_chat` (medido); mal formado dá
            `400 invalid_chat_jid` (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        id:
          description: |
            `message_id` da mensagem a pedir de volta. Ausente, `null` e `""`
            dão todos `400 missing_id` (medido). Não é verificado que o id
            exista.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        sender:
          description: |
            JID de quem escreveu a mensagem indecifrável. Ausente, `null` e `""`
            dão todos `400 missing_sender` (medido); mal formado dá
            `400 invalid_sender_jid`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - chat
        - sender
        - id
      type: object
    PedidoMensagensCanal:
      description: |
        Pedido de histórico do canal, paginado para trás.

        **`count` é obrigatório na prática, embora não esteja na tabela de
        validação** — ver o campo.
      properties:
        before:
          description: |
            `server_id` da mensagem a partir da qual paginar para trás, **como
            texto**.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | sem cursor — começa da mais recente |
            | `null` | sim | idem — indistinguível de ausente |
            | `""` | sim | idem |
            | `"104"` | sim | pagina a partir do `server_id` 104 |
            | `" 104 "` | sim | igual a `"104"` — há `TrimSpace` **neste campo**, ao contrário do resto da API (`adapter.go:546`) |
            | `"nao-numero"` | **sim, em silêncio** | `strconv.Atoi` falha e o valor vira `0`, que é o mesmo que "sem cursor". **Não há erro**: medido `200` com `{"before":"nao-numero"}` |
            | tipo não-texto | não | `400 could_not_decode_payload` |

            **A penúltima linha é um descarte silencioso**: um cursor mal formado
            não é recusado, é convertido em "começar do princípio". Quem paginar
            com um cursor corrompido recebe a primeira página outra vez, sem
            sinal nenhum de que o cursor foi ignorado.
          example: "104"
          nullable: false
          type: string
        count:
          description: |
            Quantas mensagens trazer, da mais recente para trás.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | **não** | `500 newsletter_failed` ao fim do tempo limite |
            | `null` | **não** | `500` — indistinguível de ausente |
            | `0` | **não** | `500` — indistinguível de ausente |
            | negativo | **não** | `500`. Medido com `-1` e `-5` |
            | `>= 1` | sim | `200`. Medido com `1`, `2`, `8`, `60` e `100` |

            **Esta tabela contradiz o que esta documentação afirmava até
            2026-08-26.** Estava escrito que zero ou ausente deixava o servidor
            aplicar o padrão dele, porque o adaptador omite o atributo nesse caso
            (`adapter.go:326-343`). **Medido, não é o que acontece**: o WhatsApp
            não responde ao pedido sem `count`, e o resultado é `500` com
            `error.code: newsletter_failed` — o mesmo sintoma da F265. Confirmado
            em dois canais distintos, um vazio e um com sessenta publicações, e o
            mesmo canal responde `200` no segundo seguinte quando `count` vai a 1.

            Ou seja: **`count` é obrigatório de facto e opcional de direito**. A
            tabela `newsletterRequirements` não o exige, logo a recusa não é um
            `400` legível, é um `500` ao fim da espera.

            Máximo não determinado com segurança: `100` foi aceite, e não foi
            procurado o tecto.
          example: 5
          minimum: 1
          nullable: false
          type: integer
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid` e são indistinguíveis. Ver `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
      required:
        - jid
      type: object
    PedidoModoAprovacao:
      description: |
        Exigir, ou deixar de exigir, aprovação para entrar. Usa a struct de
        DOMÍNIO (`pkg/domain/group_request.go:38-42`) — não há struct anónima
        aqui. O campo do grupo é `group_jid`, todo em minúsculas.

        As recusas saem no envelope NOVO, com `error.code`.
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não — salvo se `chat` vier | `400 missing_group_jid` (envelope NOVO) — medido |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** — medido, mesmo corpo |
            | `"   "` | passa a guarda | `400 invalid_group_jid` |
            | `nao-e-jid` | não | `400 invalid_group_jid` — medido |
            | `120363411669320145@g.us` | sim | — |
          example: 120363411669320145@g.us
          nullable: false
          type: string
        mode:
          default: false
          description: |
            `true` passa a exigir aprovação para entrar.

            | estado | efeito |
            |---|---|
            | ausente | **DESLIGA** a exigência — um pedido só com `group_jid` ABRE o grupo |
            | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
            | `false` | desliga a exigência |
            | `true` | passa a exigir |

            **Não é consulta.** É o mesmo mecanismo de `announce` e de `locked`:
            `false` aqui é uma ACÇÃO, e o campo devia ser `*bool` para que
            ausente e `false` se distinguissem. Para LER o estado, use
            `IsJoinApprovalRequired` de `POST /group/info`.
          example: true
          nullable: false
          type: boolean
      required:
        - group_jid
      type: object
    PedidoNomeGrupo:
      description: |
        Novo nome de um grupo. O corpo é `dtogroup.SetGroupNameRequest`
        (`pkg/presentation/http/dto/group/request.go`).

        **Só `name` é validado no manipulador.** Um pedido sem grupo passa a
        validação e falha mais à frente, na resolução do JID: `name` em falta dá
        `error.code = invalid_request` (objecto canónico, sem taxonomia própria),
        grupo em falta ou inválido dá `error.code = invalid_jid`.
      properties:
        chat:
          description: |
            Nome universal do destino. Só é lido quando `group_jid` estiver vazio.
            Ausente, `null` e `""` são indistinguíveis e valem "não usar o alias".
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não — salvo se `chat` vier | **medido**: `400 invalid_jid`, `could not parse JID ""` — envelope NOVO, e NÃO `missing_group_jid` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** |
            | `"   "` | não | `400 invalid_jid` com o valor citado |
            | número nu | não | `400 invalid_jid` |
            | `120363411669320145@g.us` | sim | — |
          example: 120363411669320145@g.us
          nullable: false
          type: string
        name:
          description: |
            O novo nome — e o ÚNICO campo que este manipulador valida.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente**. Não há forma de LIMPAR o nome por esta rota |
            | `"   "` | **sim** | aceite tal e qual; **não há `trim`** |
            | preenchido | sim | — |
          example: Equipa de entregas — turno da manhã
          minLength: 1
          nullable: false
          type: string
      required:
        - name
      type: object
    PedidoPareamentoTelefone:
      description: |
        Corpo de `POST /session/pairphone`. Campos desconhecidos são IGNORADOS em
        silêncio — o decodificador não usa `DisallowUnknownFields`.
      properties:
        phone:
          description: |
            Número em formato internacional, só dígitos, com código de país e
            SEM `+`, espaços ou `@s.whatsapp.net`.

            Medido em 2026-08-26:

            | estado | aceite? | efeito |
            |---|---|---|
            | corpo ausente | não | `400 could_not_decode_payload` — o decodificador não tolera `EOF` nesta rota |
            | `{}` (campo omitido) | não | `400 missing_phone`, mensagem `missing Phone in payload` (a mensagem cita o nome de domínio, não a chave do fio) |
            | `null` | não | `400 missing_phone` — **indistinguível de ausente** |
            | `""` | não | `400 missing_phone` — **indistinguível de ausente** |
            | `5541` (número JSON) | não | `400 could_not_decode_payload` — o tipo tem de ser texto |
            | `"   "` | passa a validação do wa-api | não é vazio, logo segue para o SDK; **a recusa do SDK não foi medida** (exigiria um pedido de pareamento real) |
            | preenchido | sim | devolve `linking_code` |

            Não há `trim`, `pattern` nem verificação de comprimento no wa-api: a
            única regra local é *não ser vazio*. A validação de forma do número
            acontece no wa-noise, e a recusa chega ao cliente como
            `400 pair_phone_failed` com a mensagem do SDK
            (`adapters/pairing/adapter.go:65-85`).
          example: "554192421234"
          minLength: 1
          nullable: false
          type: string
      required:
        - phone
      type: object
    PedidoPresenca:
      description: |
        Estado de presença global da sessão — é a conta inteira, não uma conversa.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        type:
          description: |
            `available` marca a conta como online; `unavailable`, offline.

            **Valor fora da lista é RECUSADO** antes de qualquer chamada ao
            WhatsApp (`send_presence.go`). Não é ignorado nem tratado como padrão.
            A comparação é sensível a maiúsculas: `Available` é recusado.

            | estado | aceite? | efeito medido |
            |---|---|---|
            | ausente (`{}`) | não | `400 missing_presence_type` |
            | `null` | não | `400 missing_presence_type` — indistinguível de ausente |
            | `""` | não | `400 missing_presence_type` — idem |
            | `"XPTO"` | não | `400 invalid_presence_type`, com o valor recebido na mensagem |
            | `123` | não | `400 could_not_decode_payload` |
            | `available` / `unavailable` | sim | — |

            **Campo em falta e valor errado têm códigos DIFERENTES** desde
            2026-08-26. Até essa data os cinco primeiros estados caíam todos em
            `invalid_presence_type`, e quem esquecia o campo era informado de que o
            seu valor era inválido — sem ter mandado valor nenhum.
          enum:
            - available
            - unavailable
          example: available
          nullable: false
          type: string
      required:
        - type
      type: object
    PedidoPresencaNaConversa:
      description: |
        Anuncia "a escrever" numa conversa. É um sinal efémero: o WhatsApp deixa
        de o mostrar sozinho passado pouco tempo, e não há rota para o retirar —
        envie `paused` para isso.

        **Ordem das recusas, medida**: `missing_phone` → `missing_state` →
        `invalid_phone`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            Nome universal do destino. Só vale quando `phone` estiver ausente,
            `null` ou `""`; caso contrário é ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        media:
          description: |
            Qualificador do estado.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | igual a `""` — mensagem de texto |
            | `null` | sim | igual a `""` |
            | `""` | sim | mensagem de texto |
            | `audio` | sim | com `state: composing`, anuncia "a gravar" |
            | qualquer outro texto | sim | não é validado; segue para o protocolo |

            **Só tem efeito quando `state` é `composing`**: em qualquer outro
            estado o valor é descartado sem aviso
            (`internal/wa-noise/core/presence.go:142`). As duas constantes
            conhecidas são `""` (texto) e `audio`.
          example: ""
          nullable: false
          type: string
        phone:
          description: |
            JID ou número da conversa onde o estado é anunciado. Ausente, `null`
            e `""` são o mesmo estado e fazem cair para `chat`; sem os dois é
            `400 missing_phone` (medido), e mal formado é `400 invalid_phone`
            (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        state:
          description: |
            O estado a anunciar.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_state` |
            | `null` | não | `400 missing_state` — indistinguível de ausente |
            | `""` | não | `400 missing_state` (medido) |
            | `composing` | sim | "a escrever" |
            | `paused` | sim | parou de escrever |
            | qualquer outro texto | **sim** | NÃO é validado: vai como está para o protocolo |

            **Não há enum no servidor.** A cadeia é usada directamente como
            nome da etiqueta enviada ao WhatsApp
            (`internal/wa-noise/core/presence.go:141`), logo um valor
            desconhecido não devolve `400` — é o WhatsApp que decide o que fazer
            com ele, e o resultado não foi medido aqui.

            As duas constantes que a biblioteca define são `composing` e
            `paused` (`internal/wa-noise/protocol/types/presence.go:17-18`).
            **Não existe um estado `recording`**: "a gravar" exprime-se como
            `state: composing` com `media: audio`.
          example: composing
          nullable: false
          type: string
      required:
        - state
      type: object
    PedidoProxy:
      description: |
        Corpo de `POST /proxy/set` **e** de `POST /session/proxy` — os dois
        caminhos são a MESMA operação, servida pelo mesmo manipulador. O segundo é
        a forma nova; o primeiro fica por compatibilidade.

        **A primeira coisa que esta rota faz é recusar uma sessão LIGADA**, antes
        de olhar para o corpo: com a sessão ligada, qualquer pedido responde
        `400 proxy_while_connected`, e nenhuma das validações abaixo chega a
        correr. Medido a 2026-08-26 nas duas sessões. Desligue primeiro
        (`GET /session/disconnect`).

        Depois disso, `enable` decide o ramo: ligar valida o URL, desligar limpa o
        proxy gravado sem sequer olhar para ele.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        enable:
          default: false
          description: |
            Escolhe o ramo. É `bool` e não `*bool`, logo **ausente, `null` e
            `false` são indistinguíveis** — e os três **removem** o proxy gravado.

            | estado | efeito (com a sessão desligada) |
            |---|---|
            | ausente | remove o proxy — **indistinguível de `false`** |
            | `null` | remove o proxy — **indistinguível de ausente** |
            | `false` | remove o proxy |
            | `true` | valida e grava |
            | tipo errado | `400 could_not_decode_payload` |

            No ramo de remoção o `proxy_url` é IGNORADO de propósito — recusar a
            remoção porque a URL que vai ser deitada fora está malformada tornaria
            uma configuração estragada impossível de apagar.

            É o mesmo mecanismo da F268: um `false` que é uma acção destrutiva, e
            não um padrão inerte, devia ser ponteiro.
          example: true
          nullable: false
          type: boolean
        proxy_url:
          description: |
            URL do proxy. Só é lido quando `enable` for `true`; ausente, `null` e
            `""` são indistinguíveis.

            Com `enable: true`, as recusas, **nesta ordem**:

            | condição | erro |
            |---|---|
            | ausente / `null` / `""` | `400 missing_proxy_url` |
            | não analisável como URL | `400 invalid_proxy_url` |
            | esquema diferente de `http` ou `socks5` | `400 unsupported_proxy_scheme` |
            | endereço reservado ou de loopback, com a entrega de webhook pelo proxy | `400 reserved_proxy_address` |

            `https` **é recusado**, apesar de parecer óbvio que devia passar: um
            proxy HTTPS exige um transporte que este processo não monta. A
            comparação de esquema é exacta e sensível a maiúsculas.

            Credenciais vão no userinfo
            (`socks5://utilizador:segredo@servidor:1080`) e **nunca aparecem em
            log nem em mensagem de erro** — só o esquema é registado, e só depois
            de a análise ter tido sucesso. Não use o valor de exemplo.
          example: socks5://proxy.interno:1080
          nullable: false
          type: string
          writeOnly: true
        webhook_use_proxy:
          description: |
            Se a entrega de WEBHOOK também sai por este proxy. **É `*bool`**, logo
            os três estados distinguem-se:

            | estado | efeito |
            |---|---|
            | ausente | **preserva** o valor gravado; na falta dele, o padrão da instalação |
            | `null` | **indistinguível de ausente** |
            | `false` | grava `false` |
            | `true` | grava `true` |

            **Muda a validação**: com este modo ligado, um endereço reservado ou
            de loopback é recusado com `400 reserved_proxy_address` — de outra
            forma, o proxy indicado pelo inquilino seria um caminho à volta do
            validador de saída. Com ele desligado, o proxy só carrega o tráfego
            do próprio WhatsApp e um endereço interno é permitido.

            Detalhe deliberado: se o valor gravado **não puder ser lido**, a
            guarda de segurança assume o modo mais estrito e recusa o endereço
            reservado, mas o valor persistido continua a ser o padrão da
            instalação. Os dois divergirem nesse caminho é de propósito — uma
            falha de banco não deve abrir o caminho de loopback.
          example: false
          nullable: true
          type: boolean
      required:
        - enable
      type: object
    PedidoReagir:
      description: |
        Reage a uma mensagem com um emoji, ou remove a reação existente.

        **Ordem das recusas, medida**: `missing_phone` → `missing_body` →
        `invalid_phone` → `missing_id`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        body:
          description: |
            O emoji da reação.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_body` |
            | `null` | não | `400 missing_body` — indistinguível de ausente |
            | `""` | não | `400 missing_body` (medido) — para REMOVER, envie `"remove"` |
            | `"remove"` | sim | traduzido internamente para texto vazio: retira a reação |
            | `"   "` | sim | enviado tal e qual; não há `trim` nem validação de emoji |
            | qualquer texto | sim | enviado tal e qual — não é verificado que seja um emoji |

            Não há lista fechada: o servidor não valida o conteúdo.
          example: "\U0001F44D"
          nullable: false
          type: string
        chat:
          description: |
            Nome universal do destino. Só vale quando `phone` estiver ausente,
            `null` ou `""`; caso contrário é ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        id:
          description: |
            `message_id` da mensagem reagida. Ausente, `null` e `""` dão todos
            `400 missing_id` (medido).

            Um prefixo `me:` marca a mensagem como própria —
            `me:3EB0A4B2AFD45E625C0917` — e o prefixo é removido antes de chegar
            ao WhatsApp. É a única forma de dizer "a mensagem é minha" nesta
            rota; não há campo booleano para isso.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        participant:
          description: |
            JID de quem escreveu a mensagem reagida, em conversa de grupo.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | reage sem participante |
            | `null` | sim | idêntico a ausente |
            | `""` | sim | idêntico a ausente |
            | mal formado | sim | **DESCARTADO EM SILÊNCIO** — não é `400` |
            | válido | sim | usado, salvo se o `id` trouxer o prefixo `me:` |

            Duas formas de ser ignorado sem aviso: um JID que não resolve é
            descartado (comportamento preservado do upstream), e o campo inteiro
            é ignorado quando `id` começa por `me:`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        phone:
          description: |
            JID ou número da conversa onde a mensagem está. Ausente, `null` e
            `""` são o mesmo estado e fazem cair para `chat`; sem os dois é
            `400 missing_phone` (medido), e mal formado é `400 invalid_phone`
            (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
      required:
        - body
        - id
      type: object
    PedidoReagirCanal:
      description: |
        Pedido de reação a uma mensagem do canal. Enviar `reaction` vazio REMOVE a
        reação — é por isso que o campo não é obrigatório.
      properties:
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` e `""` dão
            `400 missing_jid`, e é verificado antes de `server_id`. Ver
            `PedidoCanal`.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        message_id:
          description: |
            Identificador da mensagem, quando o cliente o tem. **Opcional** —
            ausente, `null` e `""` são indistinguíveis e resultam num
            `types.MessageID` vazio, que segue assim para o WhatsApp. Não há
            validação de formato do nosso lado. Os valores reais têm 22 ou 32
            caracteres hexadecimais (ver `MensagemCanal.message_id`).
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        reaction:
          description: |
            O emoji da reação.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | **REMOVE** a reação existente |
            | `null` | sim | remove — indistinguível de ausente |
            | `""` | sim | remove — indistinguível de ausente |
            | emoji | sim | põe a reação |

            **Vazio remove**, e é por isso que a validação não o exige
            (`newsletter_ops.go:234`): exigi-lo tornaria impossível desfazer uma
            reação. A consequência é que um cliente com um bug que perca o campo
            `reaction` **apaga** a reação em vez de dar erro.

            O canal declara em `settings.reaction_codes.value` que reações aceita
            (`ALL` nos casos medidos). Não validamos o emoji contra isso.
          example: "\U0001F44D"
          nullable: false
          type: string
        server_id:
          description: |
            `server_id` da mensagem alvo.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_server_id` |
            | `null` | não | `400 missing_server_id` — indistinguível de ausente |
            | `0` | não | `400 missing_server_id` — **indistinguível de ausente** |
            | `"1"` (texto) | não | `400 could_not_decode_payload` |
            | `>= 1` | sim | — |

            **Consequência de `0` ser lido como ausência**: não há maneira de
            reagir à mensagem de `server_id` 0, se ela existir. A validação é
            `r.ServerID == 0` (`newsletter_ops.go:230`), e o campo é `int` e não
            `*int`, logo o valor zero não se distingue de não ter vindo.
          example: 1
          minimum: 1
          nullable: false
          type: integer
      required:
        - jid
        - server_id
      type: object
    PedidoRecado:
      description: |
        Corpo de `POST /user/status`. Define o **recado** do perfil (o "Sobre"),
        não uma story.

        Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        body:
          description: |
            Texto do recado.

            Medido em 2026-08-26:

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente (`{}`) | não | `400 missing_body`, mensagem `missing Body in payload` |
            | `null` | não | `400 missing_body` — **indistinguível de ausente** |
            | `""` | não | `400 missing_body` — **indistinguível de ausente** |
            | `123` (número) | não | `400 could_not_decode_payload` |
            | `"   "` | passa a validação | a única regra é `req.Body == ""` (`session/set_status_message.go:28`); **não há `trim`**, logo três espaços seguem para o WhatsApp. O efeito no par não foi medido, por ser escrita real |
            | preenchido | sim | — |
          example: Atendimento das 9h às 18h
          minLength: 1
          nullable: false
          type: string
        chat:
          description: |
            **Não faz nada, e não faz parte da struct.**

            `SetStatusMessageRequest` tem um único campo, `Body`
            (`domain/session.go:70-72`). `chat` é aceite pelo decodificador apenas
            porque campos desconhecidos são ignorados em TODA a API (desde 2026-08-26
            com registo no log, e recusáveis com `WA_API_STRICT_UNKNOWN_FIELDS`) —
            não porque esta rota o leia. Está aqui documentado, e não removido,
            porque `chat` é o destino universal do §2 do contrato arquitectural e
            um integrador pode mandá-lo por hábito: mandar não dá erro, e também
            não tem efeito nenhum.

            Ausente, `null`, `""` e preenchido são todos equivalentes: esta
            operação é sobre a própria conta e não tem destinatário.
          example: ""
          nullable: false
          type: string
      required:
        - body
      type: object
    PedidoRecusarChamada:
      description: |
        Corpo de `POST /call/reject`. **Os dois campos vêm do evento `CallOffer`** —
        não são inventáveis, e sem esse evento a rota não tem alvo. Subscreva
        `CallOffer` (ou `All`) e leia-os de lá.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        call_from:
          description: |
            Quem está a ligar, como veio no evento. Aceita telefone nu, JID de
            telefone (`@s.whatsapp.net`) ou LID (`@lid`) — a resolução é feita
            pelo servidor.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_call_from` |
            | `null` | não | `400 missing_call_from` — **indistinguível de ausente** |
            | `""` | não | `400 missing_call_from` — **indistinguível de ausente** |
            | irresolúvel (ex.: `lixo!!!`) | não | `400 invalid_call_from` |
            | tipo errado | não | `400 could_not_decode_payload` |

            Todas medidas a 2026-08-26.
          example: 554192421234@s.whatsapp.net
          minLength: 1
          nullable: false
          type: string
        call_id:
          description: |
            Identificador da chamada, **gerado pelo WhatsApp** e entregue no evento
            `CallOffer`. Ausente, `null` e `""` são indistinguíveis e dão os três
            `400 missing_call_id` — medido a 2026-08-26.

            A validação de `call_from` corre **antes** desta: um corpo vazio
            responde `missing_call_from`, não `missing_call_id`.
          example: 3EB0A4B2AFD45E625C0917
          minLength: 1
          nullable: false
          type: string
      required:
        - call_from
        - call_id
      type: object
    PedidoRemoverFotoGrupo:
      description: |
        Remoção da foto. O corpo é `dtogroup.GroupTargetRequest`
        (`pkg/presentation/http/dto/group/request.go`) — o mesmo tipo partilhado
        por `/group/invitelink`, `/group/leave` e `/group/requestparticipants`.

        **O manipulador não valida campo nenhum**, e o corpo INTEIRO é opcional no
        sentido em que `{}` é aceite pelo descodificador — a falha vem depois, na
        resolução do JID.
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
            parser: **medido `400 invalid_jid`, `could not parse JID ""`** —
            envelope NOVO, e não um erro de campo obrigatório. `chat` cobre a
            ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
      type: object
    PedidoSilenciarCanal:
      description: |
        Pedido de silenciamento, que liga ou desliga conforme `mute`. Note que
        `mute` **não** é obrigatório, e que a sua ausência não significa "não
        decidi" — significa `false`.
      properties:
        jid:
          description: |
            JID do canal. Obrigatório; ausente, `null` ou `""` dão
            `400 missing_jid`, os três indistinguíveis entre si. Ver `PedidoCanal`
            para a tabela completa, incluindo o `500` do JID malformado.
          example: 120363411025775186@newsletter
          minLength: 1
          nullable: false
          type: string
        mute:
          default: false
          description: |
            `true` silencia, `false` volta a notificar.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | **dessilencia** — o valor zero de um `bool` é `false` |
            | `null` | sim | **dessilencia** — indistinguível de ausente |
            | `false` | sim | dessilencia |
            | `true` | sim | silencia |
            | tipo não-booleano | não | `400 could_not_decode_payload` |

            **Isto é a armadilha da família F268, neste campo**: o campo é `bool` e
            não `*bool`, logo "não mandei nada" e "mandei `false`" são o mesmo
            pedido, e ambos EXECUTAM uma acção (dessilenciar) em vez de nenhuma.
            Um corpo só com `jid` **altera** o estado do canal. Para silenciar é
            obrigatório mandar `true` explicitamente.

            O efeito é visível em `viewer.mute_state` de `POST /newsletter/info`.
          example: true
          nullable: false
          type: boolean
      required:
        - jid
      type: object
    PedidoSilenciarConversa:
      description: |
        Silencia ou dessilencia uma conversa.

        **`mute_duration` é um número inteiro de NANOSSEGUNDOS**, e não uma
        string de duração — é um `*time.Duration` do Go
        (`pkg/domain/mute.go:17`). Enviar `"8h"` devolve
        `400 could_not_decode_payload`, medido.

        **Ordem das recusas, medida**: `missing_jid` → `invalid_chat_jid` →
        `invalid_mute_duration`. Um pedido com destino mal formado E duração
        inválida revela só o primeiro.

        Campos desconhecidos são ignorados (e registados no log) — ver o aviso em
        `mute_duration`, que é onde isso faz estrago.
      properties:
        chat:
          description: |
            Nome universal do destino. Só vale quando `jid` estiver ausente,
            `null` ou `""`; caso contrário é ignorado sem aviso.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        jid:
          description: |
            JID da conversa a silenciar. Ausente, `null` e `""` são o mesmo
            estado e fazem cair para `chat`; sem os dois é `400 missing_jid`
            (medido), e mal formado é `400 invalid_chat_jid` (medido).
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        mute:
          description: |
            `true` silencia, `false` dessilencia (imediato).

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | sim | vale `false` — **DESSILENCIA**, `200 "Chat unmuted"` |
            | `null` | sim | vale `false`; medido: `{"jid":"…","mute":null}` → `200 "Chat unmuted"` |
            | `false` | sim | dessilencia; `mute_duration` nem é validado |
            | `true` | sim | silencia pela duração dada |
            | `"sim"` | não | `400 could_not_decode_payload` — tipo errado é o ÚNICO estado distinguido |

            É `bool` não-ponteiro. `null` não significa "não decidi": significa
            `false`, e `false` aqui é uma AÇÃO.
          example: true
          nullable: false
          type: boolean
        mute_duration:
          description: |
            Por quanto tempo silenciar, em NANOSSEGUNDOS. O WhatsApp oferece
            exactamente três opções, e o servidor recusa qualquer outro valor
            com `400 invalid_mute_duration`, cuja mensagem ecoa o recebido
            (medido: `mute_duration: 1` → *"mute_duration must be 8h, 168h
            (1 week), or omitted (forever); got 1ns"*).

            | opção | valor a enviar |
            |---|---|
            | 8 horas | `28800000000000` |
            | 1 semana | `604800000000000` |
            | para sempre | `0`, ou `null`, ou o campo ausente |

            É `*time.Duration` (ponteiro) porque `0` tem significado próprio —
            mas os três estados acima COLAPSAM mesmo assim: ausente, `null` e
            `0` produzem todos "para sempre". O ponteiro não é aproveitado para
            os separar.

            **Armadilha (F268), e é a mais cara deste grupo.** Um nome de campo
            errado — `duration` em vez de `mute_duration` — é ignorado em
            silêncio, o ponteiro fica `nil`, `nil` vira `0`, e `0` é **para
            sempre**. Quem pediu 8 horas recebe `200 "Chat muted"` e cala a
            conversa indefinidamente, sem nenhum sinal de que o campo não foi
            lido. Confirme sempre o nome exacto.

            Ignorado — e nem sequer validado — quando `mute` é `false`.
          enum:
            - 0
            - 28800000000000
            - 604800000000000
          example: 28800000000000
          format: int64
          nullable: true
          type: integer
      required:
        - mute
      type: object
    PedidoSincronizacaoContactos:
      description: |
        Corpo de `POST /user/contacts/sync`.

        Corpo ausente dá `400 could_not_decode_payload` — medido em 2026-08-26.
        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        mode:
          description: |
            Escolhe o custo do pull do patch de app-state que carrega a agenda:

            - `if_unsynced` — não faz nada se a agenda já estiver sincronizada;
            - `incremental` — busca barata, não apaga a versão local;
            - `full` — re-snapshot completo, caro.

            **Corrigido em 2026-08-26**: até essa data, ausência e valor errado
            davam o MESMO código, e quem esquecia o campo era informado de que o
            seu valor era inválido — sem ter mandado valor nenhum. Agora
            distinguem-se, e a mensagem do ramo inválido ecoa o valor recebido.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente (`{}`) | não | `400 **missing_sync_mode**` |
            | `null` | não | `400 **missing_sync_mode**` — **indistinguível de ausente** |
            | `""` | não | `400 **missing_sync_mode**` — **indistinguível de ausente** |
            | `"   "` | não | `400 invalid_sync_mode`; **não há `trim`**, logo três espaços contam como valor DADO e errado |
            | `"FULL"` | não | `400 invalid_sync_mode` — a comparação é **sensível a maiúsculas** |
            | `"delta"` | não | `400 invalid_sync_mode`; `delta` **não** existe — foi a suposição que a bateria de campo desmentiu |
            | `123` (número) | não | `400 could_not_decode_payload` |
            | um dos três válidos | sim | dispara o pull |

            A mensagem de qualquer valor desconhecido é sempre a mesma e lista os
            válidos: `mode must be one of: if_unsynced, incremental, full`.
          enum:
            - if_unsynced
            - incremental
            - full
          example: if_unsynced
          nullable: false
          type: string
      required:
        - mode
      type: object
    PedidoSincronizacaoHistorico:
      description: |
        Corpo de `POST /user/history/sync`. O pedido é sempre por mensagens
        ANTERIORES a uma âncora conhecida — daí os cinco campos descreverem uma
        mensagem que o chamador já tem.

        **Corpo ausente é tolerado** nesta rota, ao contrário de todas as outras
        deste grupo: o manipulador ignora o `io.EOF` do decodificador
        (`handler_session.go:305`) e segue com o pedido vazio, que então falha em
        `400 missing_chat_jid`. Medido em 2026-08-26.

        **Corpo mal formado sai no envelope ANTIGO**, com `error` em texto simples
        (`{"code":400,"error":"bad request","success":false}`) — este manipulador
        passa o erro cru a `RespondJSON` em vez do `errDecodePayload` tipado que
        as outras rotas usam. Medido com `{"count":"50"}`.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat_jid:
          description: |
            Conversa cujo histórico se pede.

            Medido em 2026-08-26:

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente / corpo vazio | não | `400 missing_chat_jid` |
            | `null` | não | `400 missing_chat_jid` — **indistinguível de ausente** |
            | `""` | não | `400 missing_chat_jid` — **indistinguível de ausente** |
            | preenchido | sim | segue para a validação de `oldest_msg_id` |

            É validado ANTES de `oldest_msg_id`: um pedido sem os dois revela só
            este. A API não tem `error.details[]`, logo os campos em falta saem um
            de cada vez.

            Não há validação de FORMA do JID no wa-api — um texto que não seja JID
            é aceite aqui e falha mais à frente.
          example: 554192421234@s.whatsapp.net
          minLength: 1
          nullable: false
          type: string
        count:
          default: 50
          description: |
            Quantas mensagens pedir.

            | estado | efeito |
            |---|---|
            | ausente / `null` / `0` | assume **50** — os três são indistinguíveis |
            | negativo | assume **50** também; não é recusado |
            | positivo | usado tal e qual, sem tecto |

            O `50` é o lote recomendado pela própria biblioteca
            (`session/request_history_sync.go:15`). Não há máximo validado.
          example: 50
          nullable: false
          type: integer
        oldest_msg_from_me:
          default: false
          description: |
            Se a mensagem-âncora foi enviada por esta conta.

            **`false` e ausente são INDISTINGUÍVEIS**, e aqui isso importa: o
            campo é `bool` não-ponteiro (`domain/session.go:129`), e o valor segue
            directo para a âncora do protocolo
            (`session/request_history_sync.go:68`). Omitir o campo não é "deixa o
            servidor decidir" — é afirmar que a mensagem NÃO é sua.

            Se a âncora for uma mensagem enviada por si, mande `true`
            explicitamente. Um `false` errado descreve outra mensagem, e o que
            volta é outro trecho de histórico — sem erro nenhum a assinalar.
          example: true
          nullable: false
          type: boolean
        oldest_msg_id:
          description: |
            `message_id` da mensagem mais antiga que o chamador já tem: é a
            âncora a partir da qual se pede para trás.

            Medido em 2026-08-26:

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_oldest_msg_id` |
            | `null` | não | `400 missing_oldest_msg_id` — **indistinguível de ausente** |
            | `""` | não | `400 missing_oldest_msg_id` — **indistinguível de ausente** |
            | preenchido | sim | — |
          example: 3EB0A4B2AFD45E625C0917
          minLength: 1
          nullable: false
          type: string
        oldest_msg_timestamp:
          default: 0
          description: |
            Instante da mensagem-âncora, em segundos desde a época Unix.

            Ausente, `null` e `0` são **indistinguíveis**, e `0` é enviado ao
            protocolo como a época Unix, não como "não sei". Não há validação nem
            recusa: um pedido sem este campo é aceite com `0`.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
      required:
        - chat_jid
        - oldest_msg_id
      type: object
    PedidoSolicitacoesEntrada:
      description: |
        Corpo de `GET /group/requestparticipants`. Um `GET` com corpo é servido
        pelo `curl` mas quebra clientes que assumem que `GET` não o tem — use os
        parâmetros de query `?group_jid=` ou `?chat=`, que foram medidos a
        funcionar igualmente.

        **Este é o único pedido da família em que a AUSÊNCIA DE CORPO se
        distingue de um corpo vazio**, e a distinção é enganadora:

        | pedido | resposta medida |
        |---|---|
        | sem corpo e sem query | `400 could_not_decode_payload` — a causa REAL é o grupo em falta, não o corpo |
        | `{"group_jid":null}` | `400 missing_group_jid` — a mensagem certa |
        | `{}` sem query | `400 missing_group_jid` |
        | `?group_jid=<grupo>` sem corpo | `200` |
        | corpo que NÃO é JSON, com `?group_jid=` | `200` — o erro de descodificação é PERDOADO quando a query traz o grupo (`handler_group.go:47-63`) |
      properties:
        chat:
          description: |
            Nome universal do destino, no corpo. Só lido quando `group_jid`
            estiver vazio; ausente, `null` e `""` são indistinguíveis. Medido a
            funcionar sozinho: `{"chat":"<grupo>"}` devolve `200`.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo, no CORPO. Ausente, `null` e `""` são indistinguíveis e
            fazem o manipulador cair para `?group_jid=` e depois para `?chat=`.
            Se nenhuma das três vias trouxer o grupo, a resposta é
            `400 missing_group_jid` — ou `400 could_not_decode_payload` quando o
            corpo também não for JSON válido, incluindo o corpo VAZIO.
          example: 120363411669320145@g.us
          nullable: false
          type: string
      type: object
    PedidoStatusAudio:
      description: |
        Áudio a publicar como status. **Não aceita legenda nem miniatura** — a
        struct não tem `caption` nem `jpeg_thumbnail`
        (`pkg/presentation/http/dto/session/request.go`), e enviá-los é ignorado,
        como qualquer campo desconhecido (o servidor regista
        `unknown field "<nome>"`; ver "Campos que a API não conhece").

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      example:
        audio: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
      properties:
        audio:
          description: |
            O áudio, como URI de dados começado por `data:audio/` **ou** como URL
            `http(s)://`. O limite é de 16 MiB depois de descodificado.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_audio` |
            | `null` | não | `400 missing_audio` — indistinguível de ausente |
            | `""` | não | `400 missing_audio` — indistinguível de ausente |
            | `"   "` | não | `400 unsupported_audio_source` |
            | `123` | não | `400 could_not_decode_payload` |
            | URI de dados mal formado | não | `400 invalid_data_uri` |
            | acima de 16 MiB | não | `400 audio_too_large` |
            | corpo descodificado vazio | não | `400 empty_audio_body` |
            | URL http(s) que não baixa | não | `400 audio_fetch_failed` |
            | preenchido e válido | sim | — |

            O prefixo é `data:audio/` **completo** — mais estrito que o da imagem
            (`data:image`) e muito mais que o do vídeo (`data`). As três rotas
            vizinhas usam três regras diferentes para a mesma ideia
            (`publish_audio.go:19`, `publish_image.go:17`, `publish_video.go:17`).
          example: data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAAAAE00QSBtcDQyaXNvbQ==
          minLength: 1
          nullable: false
          type: string
        id:
          description: |
            Identificador a atribuir à mensagem. Ausente, `null` e `""` são
            indistinguíveis e significam "gera tu". **Não é chave de
            idempotência.**
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        mime_type:
          description: |
            Tipo do áudio. **Antes da migração de DTO esta rota chamava o campo
            `mimetype`, minúsculo**, enquanto imagem e vídeo usavam `MimeType`
            (`pkg/domain/session.go:120`) — três rotas, duas grafias, para a
            mesma ideia. `pkg/presentation/http/dto/session/request.go` unificou
            as três em `mime_type`.

            Ausente, `null` e `""` são indistinguíveis e significam "detecta tu".
            A cascata de detecção tem quatro degraus, nesta ordem
            (`publish_audio.go:89-99`):

            1. o que veio neste campo, se não estiver vazio — usado tal e qual, sem
               confronto com os bytes;
            2. o tipo declarado no próprio URI de dados, ou o `Content-Type` da
               resposta HTTP **quando começa por `audio/`**;
            3. `http.DetectContentType` sobre os bytes, se não devolver
               `application/octet-stream`;
            4. `audio/mpeg`, como último recurso.

            **O degrau 4 é um palpite silencioso**: um ficheiro que não se
            consegue identificar é publicado como MP3 sem qualquer aviso. E, tal
            como no vídeo, o resultado **não é verificado** contra `audio/`.
          example: audio/mp4
          nullable: false
          type: string
      required:
        - audio
      type: object
    PedidoStatusImagem:
      description: |
        Imagem a publicar como status. A origem é uma união de duas formas: URI de
        dados ou URL http(s). Qualquer outra coisa é recusada antes de sair da
        máquina.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      example:
        caption: Estamos abertos até às 20h.
        image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
      properties:
        caption:
          description: |
            Legenda a mostrar sob a imagem.

            Opcional: ausente, `null` e `""` são indistinguíveis (é `string` sem
            `*`, com `omitempty` só na SERIALIZAÇÃO) e os três significam "sem
            legenda". **Não há `trim` nem limite de comprimento** na
            implementação — `"   "` é aceite e publicado tal e qual.
          example: Estamos abertos até às 20h.
          nullable: false
          type: string
        id:
          description: |
            Identificador a atribuir à mensagem. Ausente, `null` e `""` são
            indistinguíveis e significam "gera tu" — o servidor gera um, e é esse
            que volta em `message_id` na resposta.

            **Não é chave de idempotência.** Publicar duas vezes com o mesmo `id`
            publica duas vezes; não foi medido que o servidor o use para
            deduplicar (ver secção 18 do contrato arquitectural). O formato não é
            validado por nós.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        image:
          description: |
            A imagem, como URI de dados começado por `data:image` **ou** como URL
            `http(s)://`. O limite é de 16 MiB depois de descodificada, e é
            verificado ANTES da descodificação quando o URI declara `;base64`
            (`publish_image.go:96-105`).

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_image` |
            | `null` | não | `400 missing_image` — indistinguível de ausente |
            | `""` | não | `400 missing_image` — indistinguível de ausente |
            | `"   "` | não | `400 unsupported_image_source` — não é `data:image` nem URL |
            | `123` | não | `400 could_not_decode_payload` |
            | `data:image…` mal formado | não | `400 invalid_data_uri` |
            | acima de 16 MiB | não | `400 image_too_large` |
            | corpo descodificado vazio | não | `400 empty_image_body` |
            | URL http(s) que não baixa | não | `400 image_fetch_failed` |
            | preenchido e válido | sim | — |

            Repare no prefixo: é `data:image` **literal**, não `data:` genérico
            (`publish_image.go:88-90`). Um `data:application/octet-stream;base64,…`
            cai em `unsupported_image_source`, e não em erro de tipo.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          minLength: 1
          nullable: false
          type: string
        jpeg_thumbnail:
          description: |
            Miniatura JPEG, em base64, para o cliente desenhar antes de baixar a
            imagem.

            O campo é `[]byte` em Go (`pkg/domain/session.go:88`), pelo que o JSON
            tem de trazer uma CADEIA base64 — `null` dá `nil`, `""` dá uma fatia
            vazia, e as duas significam "sem miniatura". Um número ou um objecto
            dão `400 could_not_decode_payload`, e uma cadeia que não é base64
            válido também.

            O conteúdo não é validado como sendo de facto um JPEG.
          format: byte
          nullable: true
          type: string
        mime_type:
          description: |
            Tipo da imagem.

            Ausente, `null` e `""` são indistinguíveis e significam "detecta tu":
            o tipo é então inferido dos bytes com `http.DetectContentType`
            (`media_helpers.go:9-14`).

            **Quando é dado, é usado TAL E QUAL, sem confronto com os bytes** — a
            detecção é saltada por completo. A única verificação é que o tipo
            resolvido comece por `image/`, senão o pedido é recusado com
            `400 invalid_image_mime_type`. Ou seja: declarar `image/png` para um
            JPEG passa, e declarar `text/plain` para um PNG legítimo é recusado.
          example: image/png
          nullable: false
          type: string
      required:
        - image
      type: object
    PedidoStatusVideo:
      description: |
        Vídeo a publicar como status. Mesma união de origens da imagem, com um
        limite maior e uma verificação de tipo mais frouxa.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      example:
        caption: Bastidores de hoje.
        video: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
      properties:
        caption:
          description: |
            Legenda a mostrar sob o vídeo. Opcional: ausente, `null` e `""` são
            indistinguíveis e significam "sem legenda". Não há `trim` nem limite de
            comprimento.
          example: Bastidores de hoje.
          nullable: false
          type: string
        id:
          description: |
            Identificador a atribuir à mensagem. Ausente, `null` e `""` são
            indistinguíveis e significam "gera tu". **Não é chave de
            idempotência** — publicar duas vezes publica duas vezes.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        jpeg_thumbnail:
          description: |
            Miniatura JPEG, em base64, para o cliente desenhar antes de baixar o
            vídeo. É `[]byte` em Go: `null` dá `nil`, `""` dá fatia vazia, e as
            duas significam "sem miniatura". Cadeia que não é base64 válido dá
            `400 could_not_decode_payload`. O conteúdo não é validado como JPEG.
          format: byte
          nullable: true
          type: string
        mime_type:
          description: |
            Tipo do vídeo. Ausente, `null` e `""` são indistinguíveis e significam
            "detecta tu" (`http.DetectContentType` sobre os bytes).

            Quando é dado, é usado tal e qual, sem confronto com os bytes — e, ao
            contrário da rota de imagem, **o resultado não é verificado contra
            `video/`**: qualquer valor passa.
          example: video/mp4
          nullable: false
          type: string
        video:
          description: |
            O vídeo, como URI de dados **ou** como URL `http(s)://`. O limite é de
            100 MiB depois de descodificado.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_video` |
            | `null` | não | `400 missing_video` — indistinguível de ausente |
            | `""` | não | `400 missing_video` — indistinguível de ausente |
            | `"   "` | não | `400 unsupported_video_source` |
            | `123` | não | `400 could_not_decode_payload` |
            | URI de dados mal formado | não | `400 invalid_data_uri` |
            | acima de 100 MiB | não | `400 video_too_large` |
            | corpo descodificado vazio | não | `400 empty_video_body` |
            | URL http(s) que não baixa | não | `400 video_fetch_failed` |
            | preenchido e válido | sim | — |

            **Duas diferenças reais face à rota de imagem**, ambas lidas no código
            (`publish_video.go:17, 83-85`):

            1. O prefixo aceite é `"data"` — quatro letras, **sem os dois pontos**
               e sem o tipo. Uma cadeia começada por `datax` entra por este ramo e
               morre depois em `invalid_data_uri`. Não é `data:video`.
            2. O tipo resolvido **não é verificado** contra `video/`. Um URI de
               dados de outro tipo, ou um URL que sirva outra coisa, passa por
               aqui sem recusa.
          example: data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE=
          minLength: 1
          nullable: false
          type: string
      required:
        - video
      type: object
    PedidoSubscricaoPresenca:
      description: |
        De quem se quer receber notificações de presença.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        chat:
          description: |
            Nome universal do destino (F225). Copiado para `phone` apenas quando
            `phone` está vazio, logo `phone` ganha quando os dois vierem. Ausente,
            `null` e `""` são indistinguíveis — medido: `{"chat":""}` dá
            `400 missing_phone`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        phone:
          description: |
            Contacto a subscrever. Aceita número nu, JID de telefone ou LID — a
            resolução é leniente e aplica o servidor por omissão quando falta o
            `@`.

            | estado | aceite? | efeito medido |
            |---|---|---|
            | ausente | não | `400 missing_phone` |
            | `null` | não | `400 missing_phone` — indistinguível de ausente |
            | `""` | não | `400 missing_phone` — indistinguível de ausente |
            | `"   "` | **não, e com OUTRO código** | `400 invalid_phone`: a guarda é `len(phone) < 1` e três espaços têm comprimento 3 — **não há `trim`** (`subscribe_presence.go:31-33`) |
            | `"lixo"` | não | `400 invalid_phone` |
            | `123` | não | `400 could_not_decode_payload` |
            | preenchido | sim | — |
          example: 554192421234@s.whatsapp.net
          minLength: 1
          nullable: false
          type: string
      required:
        - phone
      type: object
    PedidoTemporizadorDaConversa:
      description: |
        Define o temporizador de mensagens temporárias de UMA conversa.
        Ao contrário de `/chat/mute`, aqui a duração é TEXTO.

        **Ordem das recusas, medida**: `missing_chat` → `missing_duration` →
        `invalid_jid` → `invalid_duration`. O destino é validado ANTES da
        duração, logo um pedido com os dois errados revela só o JID.

        O manipulador declara struct própria (`handler_disappearing.go:29-32`),
        e é ela que manda. Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        chat:
          description: |
            JID da conversa — contacto ou grupo. Obrigatório e **sem alias**:
            `jid` não é aceite aqui.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_chat` (medido) |
            | `null` | não | `400 missing_chat` — indistinguível de ausente |
            | `""` | não | `400 missing_chat` — indistinguível de ausente |
            | mal formado | não | `400 invalid_jid` (medido) |
            | JID válido | sim | — |
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        duration:
          description: |
            Uma das cinco palavras que o servidor aceita.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_duration` |
            | `null` | não | `400 missing_duration` (medido) — **igual a ausente** |
            | `""` | não | `400 invalid_duration` (medido) — **DIFERENTE de `null`** |
            | `"0"` / `"off"` | sim | desliga as mensagens temporárias |
            | `"24h"` / `"7d"` / `"90d"` | sim | — |
            | qualquer outro valor | não | `400 invalid_duration` — não há valor desconhecido aceite |

            É `*string` (ponteiro) no manipulador, e é por isso que `null` e
            `""` DIVERGEM aqui — o único campo deste grupo em que os cinco
            estados de presença não colapsam. `0` é a palavra `"0"`, entre
            aspas: um `0` numérico dá `400 could_not_decode_payload`.

            Sensível a maiúsculas: `"OFF"` é recusado.
          enum:
            - "0"
            - "off"
            - 24h
            - 7d
            - 90d
          example: 24h
          nullable: true
          type: string
      required:
        - chat
        - duration
      type: object
    PedidoTemporizadorGrupo:
      description: |
        Mensagens temporárias do grupo. O corpo é
        `dtogroup.SetDisappearingTimerRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
        `duration`.

        **O manipulador não valida campo nenhum.**
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        duration:
          description: |
            Duração das mensagens temporárias. Só TRÊS valores são reconhecidos:
            `24h`, `7d` e `90d` (`group_management.go:229-241`).

            | estado | efeito |
            |---|---|
            | ausente | **DESLIGA** o temporizador, com `200` |
            | `null` | idêntico a ausente — **indistinguível** |
            | `""` | idêntico a ausente — **indistinguível** |
            | `24h` / `7d` / `90d` | liga com a duração pedida |
            | `off` | desliga — mas por cair no ramo por omissão, não por ser reconhecido |
            | `24H`, `1d`, `"   "`, qualquer outro | **DESLIGA em silêncio**, com `200` |

            **Não é `enum` por isto**: um valor fora da lista não é recusado, é
            ACEITE e muda o estado. Declarar `enum` prometeria uma validação que
            não existe. O código chama-lhe regra preservada do upstream e regista
            um aviso no log; **do lado do cliente não há nada que distinga
            "desliguei" de "escrevi mal"** — as duas respostas são
            `200 {Details: Disappearing timer set}`.

            Para desligar de propósito, `off` serve tão bem como qualquer outro
            valor não reconhecido. Para LER o estado, use `DisappearingTimer` de
            `POST /group/info`, que vem em SEGUNDOS.
          example: 24h
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
            parser: **medido `400 invalid_jid`, `could not parse JID ""`**. `chat`
            cobre a ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
      type: object
    PedidoTemporizadorPadrao:
      description: |
        Define o temporizador padrão da CONTA, aplicado às conversas novas. Não
        altera conversa nenhuma que já exista.

        O manipulador declara struct própria com um único campo
        (`handler_disappearing.go:76-78`). Campos desconhecidos — incluindo
        `chat` — são ignorados, e **registados no log** desde 2026-08-26.
      properties:
        duration:
          description: |
            Mesmo conjunto de `/chat/ephemeral`.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 missing_duration` (medido) |
            | `null` | não | `400 missing_duration` — **igual a ausente** |
            | `""` | não | `400 invalid_duration` (medido) — **DIFERENTE de `null`** |
            | `"0"` / `"off"` | sim | desliga o padrão da conta |
            | `"24h"` / `"7d"` / `"90d"` | sim | — |
            | qualquer outro valor | não | `400 invalid_duration` — não há valor desconhecido aceite |

            É `*string` (ponteiro), daí a divergência entre `null` e `""`.
            Sensível a maiúsculas.
          enum:
            - "0"
            - "off"
            - 24h
            - 7d
            - 90d
          example: "0"
          nullable: true
          type: string
      required:
        - duration
      type: object
    PedidoTopicoGrupo:
      description: |
        Nova descrição de um grupo. O corpo é `dtogroup.SetGroupTopicRequest`
        (`pkg/presentation/http/dto/group/request.go`). Tal como em
        `/group/name`, só o campo de conteúdo é validado.
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Ausente, `null` e `""` são indistinguíveis e levam a
            `400 invalid_jid` (`could not parse JID ""`) — envelope NOVO — e não a
            um erro de campo obrigatório. `chat` cobre a ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        topic:
          description: |
            A nova descrição.

            | estado | aceite? | efeito |
            |---|---|---|
            | ausente | não | `400 invalid_request` |
            | `null` | não | **indistinguível de ausente** |
            | `""` | não | **indistinguível de ausente** — **não há forma de APAGAR a descrição por esta rota**: o vazio é recusado, não interpretado como limpeza |
            | `"   "` | **sim** | aceite tal e qual; **não há `trim`**. É o mais perto de "apagar" que a rota permite |
            | preenchido | sim | — |
          example: Combinações de rota do turno da manhã
          minLength: 1
          nullable: false
          type: string
      required:
        - topic
      type: object
    PedidoTrancarGrupo:
      description: |
        Alterna o modo em que só administradores editam os metadados. O corpo é
        `dtogroup.SetGroupLockedRequest`
        (`pkg/presentation/http/dto/group/request.go`), com `group_jid` e
        `locked`.

        **O manipulador não valida campo nenhum.**
      properties:
        chat:
          description: |
            Nome universal do destino. Só lido quando `group_jid` estiver vazio;
            ausente, `null` e `""` são indistinguíveis.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        group_jid:
          description: |
            JID do grupo. Ausente, `null` e `""` são indistinguíveis e chegam ao
            parser: **medido `400 invalid_jid`** — envelope NOVO. `chat` cobre a
            ausência.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        locked:
          default: false
          description: |
            `true` impede não-administradores de mudar nome, descrição e foto.

            | estado | efeito |
            |---|---|
            | ausente | **DESTRANCA** o grupo |
            | `null` | idêntico a ausente: `false`, em silêncio. **Indistinguível** |
            | `false` | destranca |
            | `true` | tranca |

            **Não é consulta**, pela mesma razão de `announce`. Para LER, use
            `IsLocked` de `POST /group/info`.
          example: true
          nullable: false
          type: boolean
      type: object
    PedidoVerificacaoNumero:
      description: |
        Números a verificar contra a base do WhatsApp. O campo é um ARRAY mesmo
        para um único número — a rota foi feita para verificação em lote.

        Campos desconhecidos no corpo são ignorados, mas **já não em silêncio**:
        desde 2026-08-26 o servidor regista `unknown field "<nome>"` no log, e o
        modo `WA_API_STRICT_UNKNOWN_FIELDS=true` recusa-os com
        `400 unknown_field`. Ver a secção "Campos que a API não conhece".
      properties:
        phone:
          description: |
            Números a verificar. Aceita o número NU (`554192421234`), que é a forma
            medida em campo, e também o JID completo — nesse caso `query` volta com
            o JID, tal e qual foi pedido.

            O nome declarado na struct (`pkg/domain/user.go`, `CheckUserRequest`) é
            `phone`; como o `encoding/json` do Go casa nomes ignorando maiúsculas,
            `Phone` também é aceite (medido).

            **Está declarado `required`, e mesmo assim as quatro formas de "não
            pedi nada" passam com `200`.** Não há `minItems` na implementação:

            | estado | aceite? | efeito medido |
            |---|---|---|
            | ausente (`{}`) | **sim** | `200 {"data":null}` |
            | `null` | **sim** | `200 {"data":null}` — indistinguível de ausente |
            | `[]` | **sim** | `200 {"data":null}` |
            | `[""]` | **sim** | `200 {"data":null}` |
            | `["   "]` | **sim** | `200 {"data":null}` |
            | `["nao-e-numero"]` | **sim** | `200 {"data":null}` |
            | `"554192421234"` (não-array) | não | `400 could_not_decode_payload` |
            | `[null]` | **sim** | vira `[""]`; `200 {"data":null}` |
            | preenchido | sim | uma entrada por número que o servidor reconheceu |

            Repare em `data: null`, que **não é** `data: []`: quem iterar sobre a
            resposta sem verificar nulidade parte. A causa está no caso de uso, que
            acumula em `var results []CheckUserResult` e devolve a fatia nil
            (`check_user.go:44-54`).

            **Item inválido é DESCARTADO EM SILÊNCIO, e duplicados são
            colapsados.** Medido: `["554192421234",""]` devolve UMA entrada, e
            `["554192421234","554192421234"]` também devolve UMA. A resposta
            **não** é posicional em relação ao pedido — case sempre pelo campo
            `query`, nunca pelo índice.
          example:
            - "554192421234"
          items:
            description: |
              Um número, nu (`554192421234`) ou como JID completo. `""` e cadeias
              que não são número são aceites na descodificação e desaparecem da
              resposta sem erro. `null` num item vira `""` (o item é `string`, não
              `*string`).
            example: "554192421234"
            nullable: false
            type: string
          nullable: true
          type: array
      required:
        - phone
      type: object
    PedidoVotoEnquete:
      allOf:
        - $ref: '#/components/schemas/AlvoConversa'
        - properties:
            id:
              $ref: '#/components/schemas/IdCliente'
            options:
              description: |
                O texto EXACTO das opções votadas, tal como foram criadas — a
                correspondência é por texto, não por índice.

                Ausente, `null` e `[]` são indistinguíveis e dão
                `400 missing_options`. O conteúdo não é confrontado com a enquete
                original: um texto que não corresponda a opção nenhuma é aceite e
                produz um voto que não conta para nada.
              example:
                - Manhã
              items:
                description: |
                  O texto de uma opção votada. `null` dentro da lista vira `""`, que
                  conta para o mínimo de um.
                nullable: false
                type: string
              minItems: 1
              nullable: true
              type: array
            phone:
              description: |
                A conversa onde a enquete está. Sinónimo universal `chat`. Ausente,
                `null` e `""` são indistinguíveis e dão `400 missing_phone`;
                preenchido mas impossível de parsear dá `400 invalid_phone`.
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
            poll_message_id:
              description: |
                `message_id` da mensagem de enquete original. Ausente, `null` e `""`
                são indistinguíveis e dão `400 missing_poll_message_id`. Não é
                confrontado com o histórico antes do envio: um id inexistente é
                aceite aqui e o voto simplesmente não aparece na enquete de ninguém.
              example: 3EB0A4B2AFD45E625C0917
              minLength: 1
              nullable: false
              type: string
            poll_message_timestamp:
              description: |
                Instante da enquete original, em segundos desde a época Unix.

                | estado | aceite? | efeito |
                |---|---|---|
                | ausente | não | `400 missing_poll_message_timestamp` |
                | `null` | não | idem — `null` num `int64` vira `0` |
                | **`0`** | **não** | idem — **`0` conta como ausente** (medido) |
                | preenchido | sim | — |

                É pedido — em vez de procurado no histórico — porque o voto é
                cifrado com um segredo derivado da mensagem original, e depender do
                histórico faria a rota falhar em silêncio quando ele tivesse sido
                podado.
              example: 1787748016
              format: int64
              minimum: 1
              nullable: false
              type: integer
            sender:
              description: |
                JID de quem CRIOU a enquete. Ausente, `null` e `""` são
                indistinguíveis e dão `400 missing_sender`; um JID que não parseia
                dá `400 invalid_sender`.

                Pode vir em qualquer das duas formas de identidade (PN ou LID): o
                servidor resolve-a antes de cifrar o voto, preferindo a forma que o
                histórico registou, com recurso ao mapeamento PN→LID quando o
                histórico não tem a mensagem (HOUSEKEEP F228).
              example: 554192421234@s.whatsapp.net
              minLength: 1
              nullable: false
              type: string
          required:
            - sender
            - poll_message_id
            - poll_message_timestamp
            - options
          type: object
      description: |
        Corpo de `POST /chat/send/pollvote`. Voto numa enquete existente,
        identificada pelo par `poll_message_id` mais `poll_message_timestamp`. Campos
        desconhecidos são ignorados, e **registados no log**.
    PedidoWebhook:
      description: |
        Corpo de `POST /webhook` e de `PUT /webhook`. Os dois verbos aceitam os
        mesmos campos, mas **`active` só é lido pelo `PUT`**, e as respostas têm
        formas diferentes.

        Um corpo que não seja JSON válido, ou com um campo de tipo errado, é
        recusado com `400` **no envelope ANTIGO** (`"error": "bad request"`, uma
        string) — medido a 2026-08-26, e divergente do
        `400 could_not_decode_payload` do resto da API.

        Campos desconhecidos são ignorados, mas **já não em silêncio**: o servidor
        regista `unknown field "<nome>"`, e `WA_API_STRICT_UNKNOWN_FIELDS=true`
        recusa-os com `400 unknown_field`.
      properties:
        active:
          default: false
          description: |
            **Lido apenas pelo `PUT`.** No `POST` é ignorado por completo.

            É `bool` e não `*bool`, logo **ausente, `null` e `false` são
            indistinguíveis** — e os três, num `PUT`, **limpam URL e eventos**,
            seja qual for o resto do corpo. Um `PUT /webhook {"webhook": "..."}`
            sem `active` apaga o webhook em vez de o definir.

            É o mesmo mecanismo da F268 noutro campo: um `false` que é uma acção,
            e não um padrão inerte, devia ser ponteiro.
          example: true
          nullable: false
          type: boolean
        events:
          description: |
            Eventos a subscrever, **como array** — ao contrário de
            `POST /admin/users`, onde o mesmo conceito é uma string com vírgulas.

            | estado | efeito |
            |---|---|
            | ausente | a subscrição gravada **não é tocada** |
            | `null` | **indistinguível de ausente** |
            | `[]` | **indistinguível de ausente** — a condição é `len(...) > 0` |
            | só nomes desconhecidos | **APAGA a subscrição gravada**, e responde `200` |
            | nomes válidos e inválidos misturados | grava só os válidos; os outros somem sem aviso |

            A quarta linha é a que surpreende: `["Mesage"]`, com um erro de
            digitação, não dá erro nenhum — **cancela todas as subscrições**.
            Confira em `GET /webhook` o que ficou.

            `All` recebe todos os eventos. A validação é sensível a maiúsculas.

            Repare no contraste deliberado com `POST /admin/users`, onde o mesmo
            nome desconhecido é **recusado** com `400 invalid_event_type`.
          example:
            - Message
            - Receipt
            - ReadReceipt
          items:
            description: |
              Nome de um evento. Um nome desconhecido — ou `""` — é **descartado
              em silêncio**, com aviso apenas no log do servidor.
            example: Message
            nullable: false
            type: string
          nullable: true
          type: array
        webhook:
          description: |
            O outro nome do URL de destino. Perde para `webhookurl` sempre que
            este vier não-vazio. Ausente, `null` e `""` são indistinguíveis, e
            valem as mesmas consequências descritas em `webhookurl`.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          type: string
        webhookurl:
          description: |
            URL de destino. **Vence sobre `webhook`** quando os dois vierem no
            mesmo corpo, e a comparação é `!= ""` — logo `webhookurl: ""` cede a
            vez a `webhook`. Os dois nomes existem por herança de clientes
            antigos.

            Ausente, `null` e `""` são indistinguíveis.

            **Atenção**: o URL resolvido é gravado SEMPRE, mesmo vazio. Um
            `POST /webhook {"events": [...]}` sem nenhum dos dois nomes **apaga o
            webhook gravado**, respondendo `200 {"webhook": ""}`.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          type: string
      type: object
    PerfilSessao:
      description: |
        Perfil da própria conta ligada, devolvido por `GET /session/profile`.
        MEDIDO no servidor vivo em 2026-08-26 nas duas sessões reais.

        Lê só o store LOCAL — não fala com o servidor do WhatsApp, e por isso
        responde em microssegundos e não está sujeito a rate limit. É a diferença
        para `/session/profile/full`.

        Os campos de identidade e os de aparelho vivem no mesmo nível: o
        resultado embute `SessionDeviceInfo` de forma anónima justamente para o
        objecto continuar plano (`profile/get_profile.go:40`).

        **Nenhum campo tem `omitempty`** (`profile/get_profile.go:29-40`,
        `domain/user.go:189-208`): os treze aparecem SEMPRE e nenhum vem `null`.
        Vazio ou zero é o que substitui a ausência.
      properties:
        avatar_id:
          description: |
            Identificador da foto actual, útil para detectar troca de avatar sem
            rebaixar a imagem. Sempre presente e nunca `null`; `""` pelas mesmas
            duas causas de `avatar_url`, e sempre em conjunto com ele — os dois
            são preenchidos pela mesma chamada.
          example: "214830039"
          nullable: false
          type: string
        avatar_url:
          description: |
            URL da foto de perfil. Sempre presente e nunca `null`.

            **Vazio tem duas causas, e a resposta não as separa** — não haver
            foto, ou a consulta ter falhado. A falha fica no log
            (`profile/get_profile.go:99`), não no corpo. Um cliente que precise
            distinguir as duas não consegue por esta rota.

            O URL é assinado e EXPIRA: trate-o como temporário, não o guarde.
          example: https://pps.whatsapp.net/v/t61.24694-24/520223213_1330652325295225_4382315407885093369_n.jpg
          nullable: false
          type: string
        business_name:
          description: |
            Nome comercial. Sempre presente e nunca `null`.

            Preenchido em contas Business, `""` em contas pessoais — é um dos dois
            sinais de que o tipo de conta se deduz (ver `platform`). Medido em
            2026-08-26: `FilaRápida` na conta com `platform: smbi`, `""` na conta
            com `platform: iphone`.
          example: FilaRápida
          nullable: false
          type: string
        connected:
          description: |
            Há transporte vivo. Mesmo significado do campo homónimo de
            `GET /session/status`. Sempre presente e nunca `null`.
          example: true
          nullable: false
          type: boolean
        full_name:
          description: |
            Nome completo do roster local. Sempre presente e nunca `null`; costuma
            vir `""` para a própria conta — medido `""` nas duas sessões em
            2026-08-26. Vazio aqui é o caso normal, não defeito.
          example: ""
          nullable: false
          type: string
        initialized:
          description: |
            O store completou o handshake inicial. Sempre presente e nunca `null`;
            `false` é resposta legítima, não ausência.
          example: true
          nullable: false
          type: boolean
        jid:
          description: |
            JID próprio na forma PN, SEM sufixo de dispositivo. Sempre presente e
            nunca `null`.

            `""` numa sessão ligada e ainda não autenticada — e nesse estado os
            campos de aparelho continuam preenchidos, o que é deliberado
            (`profile/get_profile.go:88-91`): o painel mostra estado de ligação
            mesmo sem identidade.
          example: 5516981818244@s.whatsapp.net
          nullable: false
          type: string
        lid:
          description: |
            Identidade da conta no espaço `@lid`, COM sufixo de dispositivo.
            Sempre presente e nunca `null`; `""` antes da autenticação.

            Não é intermutável com `jid`: PN e LID são espaços diferentes, e a
            conversão que a API faz é direccional (F228/F233c).
          example: 29343770251463:25@lid
          nullable: false
          type: string
        lid_migration_timestamp:
          description: |
            Quando a conta migrou para o espaço `@lid`, em segundos desde a época
            Unix. Sempre presente e nunca `null`.

            **`0` significa que não houve migração registada**, não a época Unix.
            É o valor zero do `int64` e não se distingue de "campo não preenchido"
            — o tipo não é ponteiro.
          example: 1766149842
          format: int64
          nullable: false
          type: integer
        logged_in:
          description: |
            A sessão está autenticada. Sempre presente e nunca `null`. Mesmo nome
            do campo homónimo de `GET /session/status` — as duas rotas usam
            `logged_in`.
          example: true
          nullable: false
          type: boolean
        platform:
          description: |
            Plataforma que o WhatsApp reporta do aparelho emparelhado. Sempre
            presente e nunca `null`; `""` antes do emparelhamento.

            **É por aqui que se deduz o tipo de conta, e a dedução é INFERÊNCIA,
            não declaração do protocolo** (achado F260 do `HOUSEKEEP.md`): não
            existe campo nenhum nesta API que diga se a conta é Business ou
            pessoal.

            Medido nas duas sessões vivas em 2026-08-26:

            | `platform` | `business_name` | conta observada |
            |---|---|---|
            | `smbi` | `FilaRápida` | WhatsApp Business |
            | `iphone` | `""` | pessoal |

            **Não há `enum` de propósito**: o valor vem do par, a lista de
            plataformas possíveis não é nossa, e fixá-la aqui recusaria valores
            legítimos que ainda não vimos. Que `smbi` signifique "SMB iOS" é
            leitura do valor, não mapeamento medido no protocolo — trate-o como
            pista, e confirme com `business_name` se a decisão for importante.
          example: smbi
          nullable: false
          type: string
        pushname:
          description: |
            Nome que a conta anuncia nas mensagens que envia. Sempre presente e
            nunca `null`; `""` numa sessão ainda não autenticada.
          example: FilaRápida
          nullable: false
          type: string
        registration_id:
          description: |
            Identificador desta instalação no protocolo Signal. Sempre presente e
            nunca `null`.

            É `uint32` na origem (`domain/user.go:195`) — daí o intervalo `0` a
            `4294967295`, que NÃO cabe num inteiro de 32 bits com sinal. `0`
            significa "não há instalação registada", não um identificador válido.
          example: 4190140233
          format: int64
          maximum: 4294967295
          minimum: 0
          nullable: false
          type: integer
      type: object
    PerfilSessaoCompleto:
      allOf:
        - $ref: '#/components/schemas/PerfilSessao'
        - description: |
            O que `/session/profile/full` acrescenta ao perfil local: dois blocos
            que só a REDE sabe. MEDIDO no servidor vivo em 2026-08-26 nas duas
            sessões reais.

            A base local nunca falha por causa da rede — se as duas consultas
            remotas caírem, a resposta ainda traz tudo o que `/session/profile`
            traria, e `unavailable` diz o que faltou e porquê.

            **Os três campos abaixo têm `omitempty`**
            (`profile/get_profile_full.go:44-58`): ao contrário de todo o resto
            deste grupo, eles PODEM não aparecer. Nenhum deles vem `null`.
          properties:
            privacy:
              additionalProperties: true
              description: |
                Definições de privacidade da conta, como o servidor as reporta.
                Chaves e valores vêm do SDK sem tradução.

                **Ausente quando a consulta falhou** — e então `unavailable.privacy`
                traz o motivo. **Nunca vem `null`**: a origem
                (`core/privacysettings.go:14-37`) devolve ou um ponteiro válido ou
                um erro, nunca `(nil, nil)`.

                Os valores são do SDK e não têm `enum` aqui de propósito: medido
                em 2026-08-26, `all`, `contacts`, `none`, `off` e
                `match_last_seen` — e a lista é do par, não nossa.
              example:
                CallAdd: all
                Defense: "off"
                GroupAdd: all
                LastSeen: contacts
                Messages: all
                Online: all
                Profile: all
                ReadReceipts: all
                Status: contacts
                Stickers: contacts
              nullable: false
              type: object
            unavailable:
              additionalProperties:
                description: Motivo, em texto, de o bloco correspondente não ter vindo.
                type: string
              description: |
                Presente APENAS quando algum bloco remoto não pôde ser obtido, com
                o motivo por chave. As chaves possíveis são `user_info` e
                `privacy`.

                **Ausente é a resposta normal** — o caso de uso põe o mapa a `nil`
                quando fica vazio (`profile/get_profile_full.go:82-84`), e o
                `omitempty` remove-o. Nunca vem `null` nem `{}`.

                Degradar em silêncio seria pior do que falhar: sem isto, um
                `user_info` ausente por falha de rede ficaria indistinguível de um
                ausente por não haver dado.
              example:
                user_info: sessao sem JID proprio; nada a consultar
              nullable: false
              type: object
            user_info:
              additionalProperties: true
              description: |
                Bloco CRU do SDK para o próprio JID, indexado pelo JID. Carrega o
                recado (`Status`), a lista de dispositivos que o servidor conhece
                e o LID. As chaves são as do SDK, em maiúsculas iniciais — não
                passam por normalização nenhuma.

                | estado | quando |
                |---|---|
                | ausente | a sessão não tem JID próprio, ou a consulta falhou — e então `unavailable.user_info` diz qual dos dois |
                | `{}` | o servidor respondeu sem nenhum nó de utilizador; a chamada foi bem sucedida e não trouxe dado |
                | preenchido | o caso normal |

                **Nunca vem `null`**: o construtor devolve sempre um mapa não-nulo
                (`capabilities/user/usync.go`, `GetInfo`), e o `omitempty` do
                campo faz a ausência ser ausência de verdade, não `null`.

                Os valores DENTRO do bloco são do SDK e podem ser `null` — medido
                `"VerifiedName": null` nas duas sessões. Isso é conteúdo do par,
                não contrato nosso.
              example:
                5516981818244@s.whatsapp.net:
                  Devices:
                    - 5516981818244@s.whatsapp.net
                    - 5516981818244:25@s.whatsapp.net
                  LID: 29343770251463@lid
                  PictureID: "214830039"
                  Status: conta de testes
                  VerifiedName: null
              nullable: false
              type: object
          type: object
      description: Resposta de `GET /session/profile/full`. Perfil da conta ligada, incluindo `platform` — o único sinal de que a conta é Business (`smbi`) ou pessoal.
    PerfilUtilizador:
      description: |
        Tudo o que se sabe sobre um contacto, reunido num pedido só, a partir de
        QUALQUER uma das suas identidades. Cada peça é obtida separadamente e
        **degrada em vez de falhar**: o que não se conseguiu obter aparece em
        `unavailable`, com o motivo, em vez de sair como campo vazio mudo.

        > **Nota da migração de DTO (2026-08-27).** `user_info` e `unavailable`
        > mudaram de forma; os outros sete campos ficaram iguais. As medições de
        > 2026-08-26 citadas abaixo continuam a descrever o comportamento.

        **TODOS os campos aparecem sempre.** `user_info` e `unavailable` tinham
        `omitempty` e podiam desaparecer; deixaram de ter. Emitir sempre é mais
        barato do que documentar a ausência, e um cliente já não precisa de
        distinguir "esta chave não vem nesta versão" de "não há nada a reportar".
      properties:
        avatar_id:
          description: |
            Identificador da foto. Sempre presente; `""` (nunca `null`) quando
            indisponível, pelo mesmo motivo que `avatar_url`.
          example: ""
          nullable: false
          type: string
        avatar_url:
          description: |
            URL da foto de perfil em tamanho cheio (`preview=false`, fixo). Sempre
            presente; `""` (nunca `null`) quando indisponível — e nesse caso
            `unavailable.avatar` diz porquê. Medidos dois motivos distintos:
            `avatar hidden by privacy settings` e `no avatar found`.
          example: ""
          nullable: false
          type: string
        jid:
          description: |
            Identidade de telefone. Sempre presente; `""` (nunca `null`) quando só
            se conhece o LID e não há mapeamento — nesse caso o motivo está em
            `unavailable.jid`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        lid:
          description: |
            Identidade de privacidade. Sempre presente; `""` (nunca `null`) quando
            não há mapeamento conhecido — nesse caso `unavailable.lid` traz
            `sem mapeamento conhecido para este telefone`. Medido.
          example: 90937376170214@lid
          nullable: false
          type: string
        on_whatsapp:
          description: |
            Se o número tem conta. **Sempre presente** — é `*bool` sem `omitempty`
            (`get_user_profile.go:53`), logo não desaparece; o que muda é o valor.

            | valor | significa |
            |---|---|
            | `true` | o número tem conta |
            | `false` | o número **não** tem conta — é resposta, e a rota devolve `200` na mesma |
            | `null` | a pergunta **não pôde ser feita**; o motivo está em `unavailable.on_whatsapp` |

            **`null` e `false` significam coisas diferentes**, e esta é uma das
            poucas rotas da API onde a distinção existe de facto: o campo é
            ponteiro precisamente para a criar. Um cliente que trate `null` como
            `false` diz "este número não existe" quando a verdade é "não consegui
            perguntar".
          example: true
          nullable: true
          type: boolean
        query:
          description: |
            O que foi pedido no caminho, ecoado tal e qual — diz por qual
            identidade se entrou. Sempre presente; nunca `null`. Medido a devolver
            `554192421234`, `554192421234@s.whatsapp.net` e `90937376170214@lid`
            conforme o que se pediu, sem normalizar.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        unavailable:
          additionalProperties:
            description: Motivo, em texto livre, de a peça não ter sido obtida.
            nullable: false
            type: string
          default: {}
          description: |
            O que NÃO pôde ser obtido, com o motivo, por chave.

            **Sempre presente, e `{}` quando tudo correu bem.** O caso de uso põe o
            mapa a `nil` quando está vazio, mas o apresentador aloca-o: um cliente
            que percorra os motivos não deve ter de verificar `null` num mapa cuja
            ausência de entradas já diz "nada falhou".

            As cinco chaves possíveis são `jid`, `lid`, `on_whatsapp`, `user_info`
            e `avatar`. Os valores são texto livre destinado a leitura humana —
            **não são códigos estáveis** e não devem ser comparados por igualdade.
            Medidos: `avatar hidden by privacy settings`, `no avatar found`,
            `sem mapeamento conhecido para este telefone`,
            `sem mapeamento conhecido para este LID`,
            `consulta exige telefone; so' ha LID`,
            `servidor nao respondeu sobre este numero`.
          example:
            avatar: avatar hidden by privacy settings
          nullable: false
          type: object
        user_info:
          description: |
            Os metadados da conta, com a mesma forma de `POST /user/info`.

            **Era um objecto indexado pelo JID consultado; é um ARRAY**, pela mesma
            razão que ali: a chave era dado, e chave que é dado não pode satisfazer
            a regra de nomes do contrato.

            **Sempre presente.** `[]` quando a consulta de informação de conta
            falhou — e nesse caso o motivo está em `unavailable.user_info`. Nunca
            `null`.
          items:
            $ref: '#/components/schemas/InfoUtilizador'
          nullable: false
          type: array
        verified_name:
          description: |
            Nome verificado, quando a conta é comercial verificada. Sempre
            presente; `""` (nunca `null`) quando não há ou quando a consulta de
            presença na rede falhou.

            **Vem de fonte diferente de `user_info[].verified_name`**, e as duas
            podem discordar: este é copiado do resultado de `IsOnWhatsApp`,
            enquanto o outro vem da consulta de informação de conta. Medido um caso
            com este preenchido e o outro vazio no mesmo corpo.
          example: ""
          nullable: false
          type: string
      required:
        - jid
        - lid
        - query
        - on_whatsapp
        - verified_name
        - avatar_url
        - avatar_id
        - user_info
        - unavailable
      type: object
    ReacaoDeCanal:
      description: Um emoji e quantas pessoas reagiram com ele.
      properties:
        count:
          description: Quantas pessoas reagiram com esse emoji exacto. Nunca `null`.
          example: 3
          nullable: false
          type: integer
        emoji:
          description: |
            O emoji, **exactamente como o protocolo o escreveu**, sem normalização
            Unicode. Nunca `null`.
          example: "\U0001F44D"
          nullable: false
          type: string
      required:
        - emoji
        - count
      type: object
    ReconhecimentoCanal:
      description: |
        Resposta das rotas de canal que mudam alguma coisa e não devolvem carga:
        `follow`, `unfollow`, `mute`, `mark-viewed`, `react`, `demote`,
        `change-owner`, `delete` e as três de `admin-invite`.

        **Estas rotas respondiam `data: null`**, pela mesma causa da subscrição.
        `null` não se distingue de uma rota que falhou a encher a carga, e um
        chamador que procurasse em `data` um sinal de sucesso não encontrava nenhum.
      properties:
        status:
          description: '`sent` quando a operação chegou ao WhatsApp. Nunca `null`.'
          example: sent
          nullable: false
          type: string
      required:
        - status
      type: object
    RelacaoComCanal:
      description: |
        A relação de quem chamou com o canal. Quando o objecto não é `null`, traz
        sempre as duas propriedades.
      properties:
        mute_state:
          description: |
            Silenciamento **como texto, não como booleano**: `on` quando
            silenciado, `off` quando não. Era `viewer_metadata.mute`.

            **Só `on` foi medido.** `off` é o valor esperado do outro lado (é o que
            `POST /newsletter/mute` com `mute:false` deveria produzir), mas não foi
            observado porque exigiria uma escrita. `""` no motor headless, que não
            reporta silenciamento.
          example: "on"
          nullable: false
          type: string
        role:
          description: |
            Papel do chamador no canal. Os três valores do motor wa-noise foram
            medidos ponta a ponta na cadeia de administração de 2026-08-26 (F233):

            | valor | significa |
            |---|---|
            | `owner` | dono; pode apagar, transferir posse e convidar administradores |
            | `admin` | administrador; **não pode deixar de seguir o canal** (`403 newsletter_admin_cannot_unfollow`) |
            | `subscriber` | seguidor comum |

            **O motor headless escreve aqui a palavra da PÁGINA**, verbatim e sem
            tradução — `guest` foi o valor medido, e não pertence à lista acima.
            Traduzi-lo reivindicaria um mapeamento que ninguém mediu.

            **É um campo de RESPOSTA**: não passa por validação nossa, e um valor
            desconhecido é devolvido tal e qual. Um cliente que faça `switch` sobre
            ele tem de ter ramo de omissão — e o ramo seguro é tratar desconhecido
            como `subscriber`, porque é o menos permissivo.
          example: owner
          nullable: false
          type: string
      required:
        - mute_state
        - role
      type: object
    ResolucaoLID:
      description: |
        O par de identidades de um número, quando o mapeamento é conhecido. As duas
        chaves aparecem sempre; quando não há mapeamento a rota devolve
        `404 lid_not_found` em vez de um par com campo vazio.
      properties:
        jid:
          description: |
            O número consultado, em forma canónica. Sempre presente; nunca `null`.

            **Esta rota exige o JID completo no caminho**, ao contrário de
            `GET /user/profile/{jid}`: medido, `GET /user/lid/554192421234` (número
            nu) devolve `400 invalid_jid`, e só
            `GET /user/lid/554192421234@s.whatsapp.net` funciona.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        lid:
          description: |
            O identificador de privacidade correspondente. Sempre presente e
            preenchido; nunca `null` e nunca `""` — a ausência de mapeamento é
            `404`, não um campo vazio.
          example: 90937376170214@lid
          nullable: false
          type: string
      required:
        - jid
        - lid
      type: object
    RespostaWebhookAtualizado:
      description: |
        Resposta de `PUT /webhook`.

        O manipulador devolve um **mapa** com exactamente estas três chaves, e não
        a struct de domínio (`WebhookConfigResult`), que tem `omitempty`. Num mapa
        não há `omitempty`: **as três chaves aparecem sempre**, e `events` vem
        `null` — não ausente, não `[]` — quando nenhum evento sobreviveu à
        validação.

        A resposta de `POST /webhook` é **outra**: só `{"webhook": "..."}`.
      properties:
        active:
          description: |
            Eco exacto do `active` enviado. **Sempre presente**, incluindo quando
            `false` — a chave não é omitida. Nunca `null`.
          example: true
          nullable: false
          readOnly: true
          type: boolean
        events:
          description: |
            **Apenas os eventos que passaram na validação** — é aqui que se confere
            o que sobreviveu ao descarte silencioso de `events` no pedido.

            **Vem `null`, e não `[]` nem ausente**, quando nenhum sobreviveu: é
            uma fatia `nil` de Go dentro de um mapa. Quem iterar sem verificar
            parte. A chave está sempre presente.
          example:
            - Message
            - Receipt
          items:
            description: Nome de um evento que passou na validação. Nunca `null`.
            example: Message
            nullable: false
            type: string
          nullable: true
          readOnly: true
          type: array
        webhook:
          description: |
            URL que ficou em vigor. `""` quando `active` era `false`, ausente ou
            `null` — os três casos limpam. Sempre presente, nunca `null`.
          example: https://exemplo.com.br/wa-api/eventos
          nullable: false
          readOnly: true
          type: string
      required:
        - webhook
        - events
        - active
      type: object
    ResultadoApagarMensagem:
      description: |
        `message_id` é o identificador da mensagem REVOGADA, e não o da mensagem
        de revogação que o envio criou — é o que responde à pergunta "qual
        mensagem foi apagada".
      properties:
        message_id:
          description: |
            `message_id` da mensagem revogada — o mesmo `id` que entrou, ecoado.
            **Sempre presente**: não tem `omitempty`
            (`pkg/domain/message.go:723`). Nunca `null`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        status:
          description: |
            Constante `deleted`. É literal no código, não vem do WhatsApp, logo
            nenhum outro valor é possível — um valor desconhecido aqui seria
            defeito nosso, não um estado novo do protocolo. Sempre presente,
            nunca `null`.
          enum:
            - deleted
          example: deleted
          nullable: false
          type: string
        timestamp:
          description: |
            Instante da revogação, em segundos desde a época Unix.

            **Pode não aparecer.** Tem `omitempty` na struct, logo é OMITIDO
            quando vale `0` — o que acontece se o WhatsApp devolver um instante
            zero. Nunca vem `null`; ou vem preenchido, ou não vem.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoAtualizarParticipantes:
      description: |
        Resposta de `POST /group/updateparticipants`. É a única rota de escrita
        desta família que devolve mais do que `details`.

        O corpo é `dtogroup.UpdateGroupParticipantsResponse`
        (`pkg/presentation/http/dto/group/group.go`), produzido por
        `PresentParticipantsUpdate` — não mais um mapa montado à mão no
        manipulador. As quatro chaves aparecem SEMPRE, sem `omitempty`.
      properties:
        confirmed:
          description: |
            A sessão que agiu LEU a mudança de volta.

            **Sempre presente**, nunca `null`. Neste transporte é sempre `true`,
            porque o protocolo devolve a lista resultante na própria resposta
            (`pkg/infra/wa-noise/adapters/group/participants.go:37`). O campo
            existe porque nem todo transporte consegue confirmar, e um sucesso que
            ninguém verificou não pode ser calado (`pkg/domain/group.go:236`).

            **`false` NÃO significa falha**: significa que a mudança foi enviada e
            não foi observada. O motivo fica no log, não na resposta.
          example: true
          nullable: false
          type: boolean
        details:
          description: |
            Confirmação textual, constante: `Participants updated`. **Sempre
            presente**, nunca `null`. Não distingue adição de remoção nem diz
            quantos passaram — para isso é `participants`.
          example: Participants updated
          nullable: false
          type: string
        participants:
          description: |
            A lista de participantes que o WhatsApp devolveu na MESMA resposta, na
            forma canónica. Um `is_admin`/`is_super_admin` inesperado numa entrada
            diz que aquele participante falhou enquanto os outros passaram — o
            `Error` numérico do protocolo não é mais exposto (ver
            `InfoGrupoCanonico`).

            **Sempre um array, nunca `null`**: `make([]GroupParticipantResponse,
            0, ...)` antes do laço (`presenter_group.go`).
          items:
            $ref: '#/components/schemas/ParticipanteGrupoCanonico'
          nullable: false
          type: array
      required:
        - details
        - participants
        - confirmed
        - reason
      type: object
    ResultadoBloqueio:
      description: |
        Resultado de bloquear ou desbloquear. **Nunca foi observado em campo**: as
        duas rotas que o produzem falham hoje com `422 upstream_rejected` (ver
        F264), logo a forma abaixo vem do código, não de medição — incluindo as
        afirmações de presença de cada campo.

        > **Nota da migração de DTO (2026-08-27).** As cinco chaves mudaram de
        > nome, e `requested_jid` mudou de SEMÂNTICA — ver o campo.
      properties:
        blocklist:
          description: |
            A lista de bloqueados resultante da operação. Sempre presente e nunca
            `null`, pelo mesmo motivo de `ListaBloqueados.blocklist`: o
            apresentador aloca antes de preencher. Vem `[]` quando a lista fica
            vazia.
          example:
            - 554192421234@s.whatsapp.net
          items:
            description: JID de um contacto bloqueado.
            example: 554192421234@s.whatsapp.net
            nullable: false
            type: string
          nullable: false
          type: array
        details:
          description: |
            Confirmação textual, constante por rota — `User blocked` em
            `POST /user/block`, `User unblocked` em `POST /user/unblock`. Sempre
            presente.

            O enum é o conjunto que o código escreve hoje, literal e sem variação
            (`block_user.go`, `unblock_user.go`). **Como é campo de RESPOSTA, a
            pergunta "e um valor desconhecido?" não se aplica à entrada**: um valor
            fora desta lista não é recusado por validador nenhum — apenas
            significaria que o texto mudou no nosso código. É texto para leitura
            humana: não o compare por igualdade.
          enum:
            - User blocked
            - User unblocked
          example: User blocked
          nullable: false
          type: string
        dhash:
          description: |
            Hash da lista resultante. Sempre presente; `""` quando o WhatsApp
            devolveu lista nula. Nunca `null`.
          example: "1787412261963655"
          nullable: false
          type: string
        jid:
          description: |
            O JID que a lista de bloqueio de facto usou, depois da normalização
            (descarte de agente/dispositivo e troca do servidor legado pelo
            padrão). Sempre presente.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        requested_jid:
          description: |
            O JID pedido, já normalizado.

            **Mudou de semântica na migração.** O campo antigo (`RequestedJID`)
            tinha `omitempty` e só era preenchido quando DIFERIA do usado — a sua
            ausência significava "pedido e usado são o mesmo". Hoje está sempre
            presente e, quando não houve tradução, ecoa o mesmo valor de `jid`.

            A troca é deliberada: o campo passa a responder sempre à mesma
            pergunta — *que identidade pedi?* — em vez de significar duas coisas
            conforme estivesse vazio. Quem quer saber se houve tradução compara os
            dois valores, que é a comparação que a pergunta pede.
          example: 90937376170214@lid
          nullable: false
          type: string
      required:
        - details
        - jid
        - requested_jid
        - blocklist
        - dhash
      type: object
    ResultadoConfigHmac:
      description: |
        Resposta de `POST /session/hmac/config` e de `DELETE /session/hmac/config`.

        Como em S3, os dois campos têm `omitempty` — a resposta do DELETE sai só
        com `details`, porque `enabled` fica `false` e `false` é o valor zero.
      properties:
        details:
          description: |
            Confirmação em texto: `HMAC configuration saved successfully` no POST,
            `HMAC configuration deleted successfully` no DELETE. Tem `omitempty`,
            mas os dois casos de uso preenchem-no sempre, logo aparece em toda
            resposta `200`. Nunca `null`.
          example: HMAC configuration saved successfully
          nullable: false
          type: string
        enabled:
          description: |
            Estado DEPOIS da operação — `true` quando a chave ficou gravada.

            **Ausente significa `false`**, por causa do `omitempty`: a resposta do
            DELETE não traz o campo, e isso é a revogação bem sucedida, não uma
            resposta incompleta. Nunca vem `null`.
          example: true
          nullable: false
          type: boolean
      type: object
    ResultadoConfigS3:
      description: |
        Resposta de `POST /session/s3/config` e de `DELETE /session/s3/config`.

        **Ambos os campos têm `omitempty`** (`domain/storage.go`), e isso muda a
        forma da resposta conforme o resultado: a do DELETE — e a de um POST com
        `enabled: false` — sai só com `details`, porque `enabled` fica `false` e
        `false` é o valor zero de um booleano.
      properties:
        details:
          description: |
            Confirmação em texto: `S3 configuration saved successfully` no POST,
            `S3 configuration deleted successfully` no DELETE. Tem `omitempty`,
            mas os dois casos de uso preenchem-no sempre, logo aparece em toda
            resposta `200`. Nunca `null`.
          example: S3 configuration saved successfully
          nullable: false
          type: string
        enabled:
          description: |
            Estado DEPOIS da operação, não eco do pedido.

            **Ausente significa `false`.** Com `omitempty`, o valor `false` faz o
            campo desaparecer do corpo — logo `{"details":"…"}` sem `enabled` é a
            resposta de uma revogação bem sucedida, não uma resposta incompleta.
            Nunca vem `null`.
          example: true
          nullable: false
          type: boolean
      type: object
    ResultadoConfiguracaoHmac:
      description: |
        Resposta das escritas de HMAC — `POST /hmac/config`, `POST /hmac/configure`
        e `DELETE /hmac/config`. Nenhum campo vem `null`.
      properties:
        details:
          description: |
            Confirmação textual: `HMAC configuration saved successfully` na
            gravação, `HMAC configuration deleted successfully` na revogação.
            **Sempre presente** nestas rotas — o texto nunca é vazio. Nunca
            `null`.
          example: HMAC configuration saved successfully
          nullable: false
          readOnly: true
          type: string
        enabled:
          description: |
            Estado DEPOIS da operação: `true` quando a chave ficou gravada.
            **Sempre presente**, mesmo quando `false` — a resposta perdeu o
            `omitempty` na migração DTO exactamente para que a revogação continue
            a trazer a chave em vez de a esconder. Nunca `null`.
          example: true
          nullable: false
          readOnly: true
          type: boolean
      type: object
    ResultadoConfiguracaoS3:
      description: |
        Resposta das escritas de S3 — `POST /s3/config`, `POST /s3/configure` e
        `DELETE /s3/config`. Nenhum campo vem `null`.
      properties:
        details:
          description: |
            Confirmação textual da operação: `S3 configuration saved successfully`
            na escrita, `S3 configuration deleted successfully` na remoção.
            **Sempre presente** nestas três rotas — o texto nunca é vazio. Nunca
            `null`.
          example: S3 configuration saved successfully
          nullable: false
          readOnly: true
          type: string
        enabled:
          description: |
            Estado DEPOIS da operação. **Sempre presente**, mesmo quando `false`
            — a resposta perdeu o `omitempty` na migração DTO exactamente para que
            a remoção, e a gravação com `enabled: false`, continuem a trazer a
            chave em vez de a esconder. Medido a 2026-08-26. Nunca `null`.
          example: true
          nullable: false
          readOnly: true
          type: boolean
      type: object
    ResultadoCriarGrupo:
      description: |
        Resposta de `POST /group/create`, produzida por `PresentCreatedGroup`
        (`pkg/presentation/http/dto/group/presenter_group.go`) a partir de
        `dtogroup.CreateGroupResponse`.
      properties:
        created:
          description: |
            `false` quando o grupo já existia e foi ENCONTRADO em vez de CRIADO —
            só o motor headless consegue responder `false`, porque a sua
            capacidade é "garantir que este grupo existe". Um cliente que não
            distinga os dois não sabe se acabou de alterar a conta de alguém.
          example: true
          nullable: false
          type: boolean
        group_info:
          $ref: '#/components/schemas/InfoGrupoCanonico'
      required:
        - group_info
        - created
      type: object
    ResultadoDescargaDeMidia:
      description: |
        O conteúdo binário, já decifrado e codificado como Data URL. Os dois
        campos não têm `omitempty` (`pkg/presentation/http/dto/message/chat.go`,
        `DownloadResponse`), logo aparecem **sempre**, e nenhum vem `null`.

        **Só a RESPOSTA passou pela migração para DTO** — `dtomessage.
        PresentDownload` serve `mimetype`/`data` em minúsculas. O PEDIDO
        (`PedidoDescargaDeMidia`) continua a decodificar `domain.DownloadRequest`
        directamente, com as etiquetas antigas — os dois lados desta rota estão
        em estados diferentes de propósito, não por descuido; ver a nota nesse
        esquema.
      properties:
        data:
          description: |
            Data URL completa — `data:<mimetype>;base64,<conteúdo>`. **Não é
            base64 nu**: o prefixo faz parte do valor e tem de ser removido
            antes de descodificar.

            **Nunca vem vazia e nunca vem `null`.** Um download que devolva ZERO
            bytes é `500 empty_media`, e não um `200` com Data URL vazia —
            decisão consciente registada como F126.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          nullable: false
          type: string
        mimetype:
          description: |
            O mesmo `Mimetype` que veio no pedido, ecoado sem alteração — não é
            o tipo que a CDN declarou. Sempre presente, nunca `null`; não pode
            vir `""` porque um `Mimetype` vazio derruba a resposta antes de
            chegar aqui (ver o pedido).
          example: image/png
          nullable: false
          type: string
      required:
        - mimetype
        - data
      type: object
    ResultadoDesconexao:
      description: |
        Resposta de `GET /session/disconnect` e de `POST /session/logout`.
        `details` vem SEMPRE, e SEMPRE vazio: os dois casos de uso devolvem o
        resultado zerado (`session/disconnect.go:42`, `session/logout.go:79`) e o
        campo não tem `omitempty`.
      properties:
        details:
          description: |
            Sempre a string vazia. Campo herdado; nada o preenche hoje.

            **Sempre presente, nunca ausente e nunca `null`** — sem `omitempty` na
            struct, e o valor zero de `string` é `""`. Não interprete o vazio como
            falha: a falha viria como `4xx`/`5xx`, não como `200` com `details`
            vazio.
          example: ""
          nullable: false
          type: string
      required:
        - details
      type: object
    ResultadoEnvio:
      description: |
        Resposta comum a todas as rotas de envio. `status: "sent"` significa
        que o WhatsApp aceitou a mensagem — não que ela já foi desenhada no
        cliente do destinatário.
      properties:
        message_id:
          description: Identificador da mensagem no servidor, para reagir, editar, apagar ou encaminhar depois.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        status:
          description: Estado do envio devolvido pelo servidor.
          example: sent
          nullable: false
          type: string
        timestamp:
          description: Instante do envio, em segundos desde a época Unix.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoEnvioAudio:
      description: |
        Resposta de `/chat/send/audio`. É o `ResultadoEnvio` comum mais dois campos
        que descrevem a LEGENDA.

        A legenda vai como mensagem de texto SEPARADA, depois do áudio, porque o
        protocolo não tem campo de legenda em áudio (HOUSEKEEP F116). O envio
        **não é atómico**: o áudio pode sair e a legenda falhar. Nesse caso o
        pedido continua a ser `200` — devolver erro faria o cliente reenviar e
        duplicar um áudio que já está entregue — e `caption_status` diz o que
        aconteceu de facto.

        Nenhum campo desta resposta vem `null` em circunstância nenhuma: os que têm
        `omitempty` na struct ou vêm preenchidos, ou não aparecem.
      properties:
        caption_message_id:
          description: |
            Identificador da mensagem de legenda.

            **AUSENTE** quando não houve legenda a enviar, e também quando a
            legenda falhou — só aparece com `caption_status: sent`. Tem `omitempty`
            e nunca vem `null` nem `""`.
          example: 3EB0F1C9D2A74B380E1128
          nullable: false
          type: string
        caption_status:
          description: |
            O que aconteceu à legenda.

            | estado | significado |
            |---|---|
            | **ausente** | não havia legenda a enviar (`caption` vazio no pedido) |
            | `sent` | a legenda saiu como mensagem própria; o id dela vem em `caption_message_id` |
            | `failed` | o ÁUDIO saiu, a legenda não — e não há como desfazer o áudio |

            Tem `omitempty`, logo nunca vem `""` nem `null`. Um valor fora dos dois
            da lista não é produzido pela implementação: os dois são constantes de
            domínio (`domain.CaptionSent` / `domain.CaptionFailed`) e não há
            terceiro caminho.
          enum:
            - sent
            - failed
          example: sent
          nullable: false
          type: string
        message_id:
          description: |
            Identificador do ÁUDIO no servidor. **Sempre presente** — sem
            `omitempty` na struct (`pkg/domain/message.go`, `SendAudioResult`),
            logo aparece mesmo que viesse vazio. Nunca `null`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        status:
          description: |
            Estado do envio do áudio. **Sempre presente** e sempre `sent` — o use
            case só o preenche depois de o envio ter tido sucesso, e qualquer falha
            vira erro em vez de resposta. Nunca `null`.
          example: sent
          nullable: false
          type: string
        timestamp:
          description: |
            Instante do envio do áudio, em segundos desde a época Unix.

            **Pode não aparecer**: tem `omitempty`, logo é omitido quando vale `0`.
            Nunca `null`.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
      required:
        - message_id
        - status
      type: object
    ResultadoInfoConvite:
      description: |
        Resposta de `POST /group/inviteinfo`. `invite_info` está **sempre
        presente** e nunca vem `null` (`pkg/domain/group.go:47`); um convite
        inválido não chega aqui — devolve `500`.

        **Medido, antes da migração para DTO**: os metadados vinham com
        `member_add_mode` a `""`, ao contrário de `POST /group/info` sobre o mesmo
        grupo no mesmo minuto. `participant_count` vinha CORRECTO aqui — é
        `POST /group/list` que o traz a zero. O corpo é hoje a mesma forma
        canónica de `POST /group/info`, via `GetGroupInviteInfoResponse`
        (`pkg/presentation/http/dto/group/group.go`); a divergência de campos
        observada acima não foi re-verificada contra o novo apresentador.
      properties:
        invite_info:
          $ref: '#/components/schemas/InfoGrupoCanonico'
      type: object
    ResultadoInfoGrupo:
      description: |
        Resposta de `POST /group/info`. `group_info` está **sempre presente** e
        nunca vem `null`: o apresentador emite a chave sempre, e o manipulador só
        chega a responder `200` depois de o WhatsApp ter devolvido os metadados.

        Foi a PRIMEIRA rota migrada para a forma canónica em `snake_case` — ver
        `InfoGrupoCanonico` e `docs/HTTP-DTO-CONVENTIONS.md`. Toda a família de
        grupo e comunidade migrou desde então; `InfoGrupo` (sem sufixo) fica
        documentado só como registo do formato ANTERIOR.
      properties:
        group_info:
          $ref: '#/components/schemas/InfoGrupoCanonico'
      required:
        - group_info
      type: object
    ResultadoLimiteHistorico:
      description: |
        Resposta de `POST /session/history` (e de `POST /webhook/history`, mesmo
        manipulador). As chaves são `details` e `history`, minúsculas — DTO
        `dtowebhook.HistoryResponse`.
      properties:
        details:
          description: |
            Confirmação em texto. Tem `omitempty` na struct
            (`dto/webhook/webhook.go: HistoryResponse`), logo **poderia** ser
            omitido — mas o caso de uso preenche-o sempre com a constante
            `History configured successfully` (`storage/set_history.go:83`), então
            na prática aparece em toda resposta `200`. Nunca vem `null`.
          example: History configured successfully
          nullable: false
          type: string
        history:
          description: |
            Limite gravado, ecoado. **Sempre presente e nunca `null`**: `history`
            NÃO tem `omitempty` de propósito — `0` é resposta legítima e omitir o
            campo esconderia "gravação desligada" (F165).

            `0` significa gravação DESLIGADA, não "sem limite". Negativo é
            recusado antes de gravar, com `400 invalid_history`
            (`storage/set_history.go:75-78`) — medido em 2026-08-26.

            Repare no tipo: aqui é INTEIRO; o mesmo número volta como TEXTO no
            campo `history` de `GET /session/status`.
          example: 100
          minimum: 0
          nullable: false
          type: integer
      required:
        - history
      type: object
    ResultadoLinkConvite:
      description: Resposta de `POST /group/invitelink`.
      properties:
        invite_link:
          description: |
            O link INTEIRO, com o prefixo `https://chat.whatsapp.com/` — medido.

            **Sempre presente** e nunca `null`: o campo não tem `omitempty`
            (`pkg/domain/group.go:38`). Viria `""` se o WhatsApp devolvesse um
            link vazio sem erro, o que não foi observado.

            `POST /group/join` documenta o código NU, logo os dois não encaixam
            por contrato, só por o corte de prefixo existir na biblioteca.
          example: https://chat.whatsapp.com/IVccRoDVSbpHKNkgNxyZx4
          nullable: false
          type: string
      type: object
    ResultadoListaGrupos:
      description: Resposta de `POST /group/list`.
      properties:
        groups:
          description: |
            Todos os grupos de que a sessão participa, incluindo comunidades
            (`is_parent: true`) e os sub-grupos de avisos que elas criam sozinhas
            (`is_default_sub_group: true`). Não há filtro nem paginação: **a rota
            ignora o corpo por completo** — medido `200` com `{"group_jid":"lixo"}`
            e mesmo com um corpo que não é JSON.

            **Sempre `[]`, nunca `null`**: `PresentListGroups`
            (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
            antes do laço, mesmo vazia — o gap de `interface{}` que este ficheiro
            documentava antes da migração para DTO fechou com o apresentador.

            A ordem não é significativa e não é estável entre chamadas.
          items:
            $ref: '#/components/schemas/InfoGrupoCanonico'
          nullable: false
          type: array
      type: object
    ResultadoMensagemIndisponivel:
      description: |
        Confirmação de que o PEDIDO foi enviado ao par. Não diz que a mensagem
        voltou: o reenvio, se acontecer, chega depois como mensagem normal.

        Nenhum campo desta resposta tem `omitempty`
        (`pkg/domain/unavailable_message.go:14-22`), logo **todos aparecem
        sempre**, mesmo vazios, e nenhum vem `null`.
      properties:
        chat:
          description: |
            Ecoa o `chat` enviado, tal e qual entrou — **antes** da resolução de
            JID, logo pode não coincidir com a forma que o protocolo usou.
            Sempre presente, nunca `null`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        message:
          description: |
            Texto fixo `Unavailable message request sent successfully`, literal
            no código. Sempre presente, nunca `null`. Não parseie este texto.
          example: Unavailable message request sent successfully
          nullable: false
          type: string
        message_id:
          description: |
            Ecoa o `id` enviado — a mensagem pedida de volta. Sempre presente,
            nunca `null`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        request_id:
          description: |
            Identificador da mensagem de PEDIDO criada pelo envio — não é o id
            da mensagem pedida de volta. Sempre presente; pode vir `""` se o
            protocolo não devolver id. Nunca `null`.
          example: 3EB0C7D1F94A62B15D4488
          nullable: false
          type: string
        sender:
          description: |
            Ecoa o `sender` enviado, tal e qual entrou, antes da resolução de
            JID. Sempre presente, nunca `null`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        success:
          description: |
            Constante `true` — este corpo só é construído no caminho de sucesso.
            Sempre presente, nunca `null`. Não é o sinal de erro: para isso use
            o `success` do envelope e o código HTTP.
          example: true
          nullable: false
          type: boolean
        timestamp:
          description: |
            Instante do pedido, em segundos desde a época Unix. Sempre presente
            (não tem `omitempty`), nunca `null`. Pode vir `0` se o protocolo não
            devolver instante — `0` aqui significa "não informado", não 1970.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
      required:
        - success
        - message
        - request_id
        - chat
        - sender
        - message_id
        - timestamp
      type: object
    ResultadoPareamentoTelefone:
      description: Resposta de `POST /session/pairphone`.
      properties:
        linking_code:
          description: |
            Código de oito caracteres que a pessoa digita no telemóvel, em
            *Aparelhos conectados → Conectar com número de telefone*. Tem
            validade curta; se expirar, peça outro.

            **Sempre presente quando a resposta é `200`, e nunca `null`** — sem
            `omitempty` na struct. Não vem vazio num `200`: o caminho que o
            preenche é o mesmo que produz o `200`, e qualquer falha antes disso
            sai como `400`.
          example: ABCD-EFGH
          nullable: false
          type: string
      required:
        - linking_code
      type: object
    ResultadoProxy:
      description: |
        Resposta de `POST /proxy/set` e de `POST /session/proxy`. **As quatro
        chaves aparecem sempre** — a resposta perdeu o `omitempty` na migração
        DTO — e é o VALOR que difere entre os dois ramos: desligar responde
        `set: false`, `proxy_url: ""` e `webhook_use_proxy: null`.
      properties:
        details:
          description: |
            `Proxy configured successfully` ao ligar, `Proxy disabled successfully`
            ao desligar. **Sempre presente** nos dois ramos, porque o texto nunca
            é vazio. Nunca `null`.
          example: Proxy configured successfully
          nullable: false
          readOnly: true
          type: string
        proxy_url:
          description: |
            Eco do URL gravado, **tal e qual foi enviado, incluindo as credenciais
            do userinfo**. **Sempre presente**; vem `""` no ramo de desligar.

            É o único ponto da API em que um `proxy_url` volta em claro. Trate
            esta resposta como contendo segredo: não a registe em log nem a
            mostre em interface. Nunca `null`.
          example: socks5://utilizador:senha@proxy.exemplo.com.br:1080
          nullable: false
          readOnly: true
          type: string
        set:
          description: |
            `true` no ramo de ligar. **Sempre presente**, incluindo `false` no
            ramo de desligar — a chave já não é omitida. Nunca `null`.
          example: true
          nullable: false
          readOnly: true
          type: boolean
        webhook_use_proxy:
          description: |
            Valor efectivamente persistido pela resolução do servidor — o pedido,
            ou o gravado, ou o padrão da instalação, nessa ordem.

            Presente nos dois ramos. **`null` no ramo de desligar**, porque o
            campo é `*bool` e ali a resolução não corre — é um terceiro estado
            real, não "campo ausente". Quando não-nulo, vem `true` ou `false`.
          example: false
          nullable: true
          readOnly: true
          type: boolean
      type: object
    ResultadoRecado:
      description: |
        Resposta de `POST /user/status`. `details` vem sempre, e sempre vazio — o
        caso de uso devolve o resultado zerado (`session/set_status_message.go:47`).
      properties:
        details:
          description: |
            Sempre a string vazia. **Sempre presente, nunca ausente e nunca
            `null`** — sem `omitempty` na struct. O vazio não indica falha: o
            recado foi gravado, e a confirmação é o `200`.
          example: ""
          nullable: false
          type: string
      required:
        - details
      type: object
    ResultadoRecusarChamada:
      description: |
        Resposta de `POST /call/reject`. **As duas propriedades vêm sempre** — não
        há `omitempty` em nenhuma — e nenhuma vem `null`.
      properties:
        call_id:
          description: |
            Eco do `call_id` recusado, para casar com o evento de origem. Sempre
            presente, nunca `null`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          readOnly: true
          type: string
        details:
          description: |
            Confirmação textual da recusa. Sempre presente, nunca `null`.
          example: Call rejected
          nullable: false
          readOnly: true
          type: string
      required:
        - details
        - call_id
      type: object
    ResultadoSincronizacaoContactos:
      description: Resposta de `POST /user/contacts/sync`.
      properties:
        details:
          description: |
            Constante. Diz que o pedido foi FEITO, não que a agenda já chegou —
            os contactos entram depois, por eventos de app-state.

            **Sempre presente e nunca `null`**; sem `omitempty` na struct. Valor
            desconhecido não sai: é literal no caso de uso
            (`session/sync_contact_roster.go:55`).
          enum:
            - contact roster sync requested
          example: contact roster sync requested
          nullable: false
          type: string
        mode:
          description: |
            Eco do modo pedido. **Sempre presente e nunca `null`**, e nunca vazio:
            só chega aqui um pedido cujo `mode` já passou pela validação, logo é
            sempre um dos três válidos.
          example: if_unsynced
          nullable: false
          type: string
      required:
        - details
        - mode
      type: object
    ResultadoSincronizacaoHistorico:
      description: |
        Resposta de `POST /user/history/sync`. Ecoa a âncora pedida e devolve o
        id do PEDIDO.

        **`count` é o que foi PEDIDO, nunca o que chegou.** As mensagens vêm
        depois, como um evento `HistorySync` do tipo ON_DEMAND — que sai pelo
        webhook e pelo `GET /session/ws`, se a sessão subscrever `HistorySync`
        (ou `All`).

        **Nenhum campo tem `omitempty`** (`domain/session.go:136-144`): os sete
        aparecem SEMPRE numa resposta `200` e nenhum vem `null`.
      properties:
        chat_jid:
          description: |
            Eco do `chat_jid` pedido. Sempre presente e nunca `null`, e nunca
            vazio: um pedido com este campo vazio não chega a produzir `200`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        count:
          description: |
            Quantas mensagens foram PEDIDAS — já com o padrão `50` aplicado quando
            o pedido omitiu `count` ou mandou zero/negativo. Sempre presente e
            nunca `null`. Não diz nada sobre quantas vão chegar.
          example: 50
          nullable: false
          type: integer
        details:
          description: |
            Identificador da mensagem de par que carregou o pedido. Serve para
            casar o evento que chegar depois. Sempre presente e nunca `null`.

            Repare no nome: `details` aqui é um identificador, e não a
            confirmação em texto que o mesmo nome carrega em `ResultadoRecado` e
            `ResultadoDesconexao`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        oldest_msg_from_me:
          description: |
            Eco do `oldest_msg_from_me` pedido. Sempre presente e nunca `null`.

            `false` aqui não distingue "mandou `false`" de "não mandou o campo" —
            o eco carrega a mesma ambiguidade do pedido.
          example: true
          nullable: false
          type: boolean
        oldest_msg_id:
          description: |
            Eco do `oldest_msg_id` pedido. Sempre presente e nunca `null`, e nunca
            vazio, pela mesma razão de `chat_jid`.
          example: 3EB0A4B2AFD45E625C0917
          nullable: false
          type: string
        oldest_msg_timestamp:
          description: |
            Eco do `oldest_msg_timestamp` pedido. Sempre presente e nunca `null`;
            `0` quando o pedido o omitiu, sem distinção de um `0` explícito.
          example: 1787747900
          format: int64
          nullable: false
          type: integer
        timestamp:
          description: |
            **Sempre `0`, e sempre presente.** O caso de uso não preenche este
            campo (`session/request_history_sync.go:78-85`), e como não tem
            `omitempty` ele sai com o valor zero em toda resposta. Nunca `null`.

            Não é o instante do pedido nem o da âncora — é campo morto. Para o
            instante da âncora, leia `oldest_msg_timestamp`.
          example: 0
          format: int64
          nullable: false
          type: integer
      type: object
    ResultadoTesteS3:
      description: |
        Resposta de `POST /session/s3/test` e de `POST /s3/test`.

        **A rota testa o que está GRAVADO**, não o que o corpo do pedido traz — o
        corpo é ignorado. `bucket` e `region` ecoam a configuração que foi
        testada, e é o que distingue "testei o que gravou" de "respondi 200".
        Nenhuma credencial aparece aqui, e nenhum campo vem `null`.
      properties:
        bucket:
          description: |
            Bucket que foi testado, lido da configuração gravada. **Sempre
            presente**, mesmo vazio. Nunca `null`.
          example: wa-api-midia
          nullable: false
          readOnly: true
          type: string
        connected:
          description: |
            **Sempre presente e sempre `true`**: qualquer falha do teste sai como
            erro HTTP, e não como `connected: false`. Não existe outro valor —
            um `400 s3_not_enabled` é o que se recebe quando o S3 está desligado.
            Nunca `null`.
          enum:
            - true
          example: true
          nullable: false
          readOnly: true
          type: boolean
        details:
          description: |
            Confirmação textual. **Sempre presente** neste corpo, porque só existe
            no caminho de sucesso, onde o texto nunca é vazio. Nunca `null`.
          example: S3 connection test successful
          nullable: false
          readOnly: true
          type: string
        region:
          description: |
            Região que foi testada, lida da configuração gravada. **Sempre
            presente**, mesmo vazia. Nunca `null`.
          example: sa-east-1
          nullable: false
          readOnly: true
          type: string
      required:
        - connected
      type: object
    ResultadoVerificacaoNumero:
      description: |
        Uma entrada por número que o servidor do WhatsApp reconheceu.
        `is_in_whatsapp: false` NÃO é erro — é a resposta à pergunta.

        **Nenhum dos quatro campos tem `omitempty`**, logo os quatro aparecem
        SEMPRE que a entrada exista. O que varia é o conteúdo, não a presença.

        Os nomes não mudaram na migração de DTO de 2026-08-27 — já eram
        canónicos. O que mudou foi o embrulho: `data` deixou de ser o array e
        passou a ser `{"users": [...]}`.

        Números que não produziram entrada não aparecem de forma nenhuma — ver
        o descarte silencioso descrito em `PedidoVerificacaoNumero.phone`.
      properties:
        is_in_whatsapp:
          description: |
            Se o número tem conta de WhatsApp. Sempre presente; nunca `null`.
            `false` é resposta, não erro.
          example: true
          nullable: false
          type: boolean
        jid:
          description: |
            JID resolvido do número, em forma canónica. Sempre presente; vem `""`
            (cadeia vazia, nunca `null`) quando `is_in_whatsapp` é `false`.
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        query:
          description: |
            O que foi pedido, ecoado tal e qual — é a ÚNICA forma fiável de casar a
            resposta com a entrada, porque a lista devolvida não é posicional.
            Sempre presente; nunca `null`.
          example: "554192421234"
          nullable: false
          type: string
        verified_name:
          description: |
            Nome verificado, quando a conta é uma conta comercial verificada.
            Sempre presente; vem `""` para contas pessoais — medido nas duas contas
            de teste. Nunca `null`.
          example: ""
          nullable: false
          type: string
      required:
        - query
        - is_in_whatsapp
        - jid
        - verified_name
      type: object
    ResumoDeConversa:
      description: |
        Uma conversa da lista. Os campos de nome são todos opcionais e podem vir
        ausentes ao mesmo tempo: medido nas contas reais, a maioria das pessoas
        sem nome simplesmente não está no roster, e para elas não há nome a
        obter. `phone` é o que sobra de legível nesses casos.

        Quatro campos vêm sempre (`jid`, `name`, `is_group`, `last_activity`) e
        quatro têm `omitempty` e podem faltar (`push_name`, `full_name`,
        `business_name`, `phone`) — `pkg/domain/user.go:246`.
      properties:
        business_name:
          description: |
            Nome comercial verificado, cru.

            **Pode não aparecer** (`omitempty`): omitido quando vale `""`, que é
            o caso de qualquer conta não comercial. Nunca vem `null`.
          example: Loja Exemplo
          nullable: false
          type: string
        full_name:
          description: |
            Nome do roster, cru — o que quem consulta gravou na agenda.

            **Pode não aparecer** (`omitempty`): é omitido quando vale `""`, que
            é o caso da maioria dos `@lid`. Nunca vem `null`. Ausente para
            grupos, sempre.
          example: Lucas Albuquerque
          nullable: false
          type: string
        is_group:
          description: |
            `true` quando o `jid` termina em `@g.us`. **Sempre presente e nunca
            `null`** — não tem `omitempty`, logo `false` aparece explicitamente
            e é o valor normal para contactos. É derivado do sufixo do `jid`, e
            não de uma consulta: um `status@broadcast` sai com `false`.
          example: false
          nullable: false
          type: boolean
        jid:
          description: |
            Identidade da conversa como ela vive no histórico local. Para
            contactos pode ser `@lid` ou `@s.whatsapp.net`; para grupos é sempre
            `@g.us`. O valor reservado `status@broadcast` aparece aqui e
            representa os status vistos, não uma conversa.

            **Sempre presente e nunca `null`** — não tem `omitempty`. É o valor
            a usar como `chat_jid` em `GET /chat/history` e como destino nas
            rotas de escrita.
          example: 90937376170214@lid
          nullable: false
          type: string
        last_activity:
          description: |
            Instante da mensagem mais recente já persistida nesta conversa. É a
            chave de ordenação da lista. **Sempre presente e nunca `null`.**

            Vem no fuso local do servidor, e não em UTC — medido:
            `2026-08-26T09:08:10.351982-04:00`. Divergente do `timestamp` de
            `GET /health`, que é UTC.
          example: "2026-08-26T09:08:10.351982-04:00"
          format: date-time
          nullable: false
          type: string
        name:
          description: |
            Melhor nome disponível: roster primeiro, `pushName` do histórico
            depois, nome do grupo para `@g.us`.

            **Sempre presente e nunca `null`**, mas **frequentemente `""`** —
            não tem `omitempty`, e uma cadeia vazia é a resposta normal para
            quem não está no roster nem tem `pushName` gravado. `""` significa
            "não há nome a obter", não "erro".
          example: Lucas Albuqueque
          nullable: false
          type: string
        phone:
          description: |
            Número resolvido a partir do `@lid`, sem sufixo e sem dispositivo
            (`554192421234`, não `554192421234:37@s.whatsapp.net`).

            **Pode não aparecer** (`omitempty`), e falta em quatro casos:
            conversa de grupo, conversa que já vem em `@s.whatsapp.net`,
            mapeamento local desconhecido, e sessão offline — a resolução
            degrada em silêncio e a lista sai sem telefone em vez de falhar.
            Nunca vem `null`. Só é tentado para as conversas DA PÁGINA
            devolvida.
          example: "554192421234"
          nullable: false
          type: string
        push_name:
          description: |
            Nome que a pessoa escolheu no telemóvel, cru.

            **Pode não aparecer**: tem `omitempty`, logo é OMITIDO quando vale
            `""`. Nunca vem `null`; ou vem preenchido, ou não vem. Ausente para
            grupos, sempre.
          example: Lucas Albuqueque
          nullable: false
          type: string
      required:
        - jid
        - name
        - is_group
        - last_activity
      type: object
    Roster:
      description: |
        A agenda da sessão, em `GET /user/contacts`.

        > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
        > CÓDIGO, não medida contra o servidor vivo: a rota passou a servir um DTO
        > (`pkg/presentation/http/dto/user`) e o corpo mudou de nomes — e nalguns
        > casos de FORMA — em relação ao que foi medido a 2026-08-26. As contagens
        > de população que aparecem abaixo continuam válidas (descrevem o DADO,
        > não as chaves); os nomes das chaves e a estrutura vêm do DTO.

        **Era um OBJECTO indexado por JID; passou a ser `{contacts, count}`.** A
        chave daquele objecto era um JID — dado, não nome de campo —, e por isso
        não podia satisfazer a regra de nomes do contrato. O JID passou a viver no
        campo `jid` de cada entrada, e o `count` que o log já calculava passou a
        ser servido em vez de o cliente ter de contar o mapa.

        **A ORDEM é determinística.** O motor `wa-noise` lê de um mapa e ORDENA por
        JID antes de devolver; o `wa-headless` preserva a ordem que a colecção da
        página já tem. Sem isso, a mesma agenda saía numa ordem diferente a cada
        chamada e nenhum cliente conseguia diffar duas respostas.

        **Os JIDs misturam espaços de identidade, e a proporção varia por conta.**
        Medido a 2026-08-26, e continua a descrever o dado:

        | conta | total | `@lid` | `@s.whatsapp.net` | `@bot` |
        |---|---:|---:|---:|---:|
        | Business (`filarapida`) | 461 | 232 | 229 | 0 |
        | pessoal (`lucas`) | 3456 | 2524 | 931 | 1 |

        Ou seja: **não se pode assumir nem um espaço nem o outro**. O DTO ajuda
        aqui — cada entrada traz `phone_number` e `lid` além de `jid`, e o campo
        vazio diz que aquele motor não conhece aquela identidade.

        O `@bot` é um terceiro espaço, com uma entrada medida
        (`867051314767696@bot`, nome "Meta AI"). Não é contacto humano.

        **Não há paginação.** A resposta medida foi de 61 459 bytes para 461
        contactos e 498 688 bytes para 3456 — cresce com a agenda, sem tecto.
      example:
        contacts:
          - business_name: ""
            first_name: ""
            found: true
            full_name: ""
            is_business: false
            jid: 90937376170214@lid
            lid: 90937376170214@lid
            phone_number: ""
            push_name: Janio Gonzalez
        count: 1
      properties:
        contacts:
          description: |
            As entradas da agenda. Sempre presente; `[]` (nunca `null`) quando a
            agenda está vazia.
          items:
            $ref: '#/components/schemas/ContactoDoRoster'
          nullable: false
          type: array
        count:
          description: |
            Quantas entradas vêm em `contacts`. É a mesma contagem que o servidor
            já registava no log e que o cliente tinha de derivar contando o mapa.

            **Para o motor `wa-headless` é a contagem de PESSOAS, não de linhas**:
            a colecção da página traz uma linha por identidade, e a mesma pessoa
            aparece duas vezes — 944 linhas dobradas em 390 pessoas no perfil
            medido. Devolver o número de linhas reportaria o dobro dos contactos
            que alguém tem.
          example: 461
          nullable: false
          type: integer
      required:
        - contacts
        - count
      type: object
    SaudeDetalhada:
      description: Contagens do processo, devolvidas por `GET /health`.
      properties:
        active_connections:
          description: Ligações WebSocket ao WhatsApp actualmente abertas.
          example: 2
          nullable: false
          type: integer
        connected_users:
          description: Sessões com ligação estabelecida ao WhatsApp.
          example: 2
          nullable: false
          type: integer
        goroutines:
          description: Goroutines em execução. Crescimento contínuo aqui costuma indicar fuga.
          example: 285
          nullable: false
          type: integer
        logged_in_users:
          description: Sessões ligadas E autenticadas — as que conseguem operar.
          example: 2
          nullable: false
          type: integer
        memory_stats:
          description: |
            Contadores do coletor de lixo do Go, em megabytes salvo `num_gc`.
            Medido na resposta real — a struct de domínio declara-o como mapa
            aberto, logo as chaves abaixo vêm do código que o preenche
            (`get_health.go:55-60`) e não do tipo.
          nullable: false
          properties:
            alloc_mb:
              description: Memória de heap em uso neste instante.
              example: 7
              nullable: false
              type: integer
            num_gc:
              description: Ciclos completos do coletor de lixo desde o arranque.
              example: 5
              nullable: false
              type: integer
            sys_mb:
              description: Memória obtida do sistema operativo.
              example: 26
              nullable: false
              type: integer
            total_alloc_mb:
              description: Total já alocado desde o arranque, cumulativo — nunca desce.
              example: 11
              nullable: false
              type: integer
          type: object
        status:
          description: |
            Estado global do processo. **Sempre presente** — sem `omitempty` na
            struct, logo aparece mesmo quando vazio. Nunca `null`.
          example: ok
          nullable: false
          type: string
        timestamp:
          description: Instante em que o retrato foi tirado, em UTC.
          example: "2026-08-26T12:41:38Z"
          format: date-time
          nullable: false
          type: string
        total_users:
          description: Sessões existentes no banco, ligadas ou não.
          example: 2
          nullable: false
          type: integer
        uptime:
          description: Há quanto tempo o processo está de pé, em notação de duração do Go.
          example: 3h12m45s
          nullable: false
          type: string
        version:
          description: |
            Versão do binário (`pkg/bootstrap/bootstrap_server.go`).

            **Pode não aparecer.** É o único campo desta resposta com `omitempty`
            na struct (`pkg/domain/health.go:14`), logo é omitido quando a versão
            está vazia. Nunca vem `null`; ou vem preenchido, ou não vem.
          example: 1.0.6
          nullable: false
          type: string
      type: object
    SecaoLista:
      description: |
        Uma secção de `/chat/send/list`, com o seu título e as suas linhas.

        Secção que fique sem nenhuma linha válida é descartada em silêncio —
        incluindo a secção que já chegou com `rows` ausente, `null` ou `[]`.
        `{}` e `null` dentro de `sections` são ambos secções sem linhas, logo
        ambos descartados.
      properties:
        rows:
          description: |
            Linhas da secção. Ausente, `null` e `[]` são indistinguíveis, e nos
            três casos a SECÇÃO é descartada em silêncio — o mesmo destino de uma
            secção cujas linhas foram todas descartadas por falta de título.
          items:
            $ref: '#/components/schemas/LinhaLista'
          nullable: true
          type: array
        title:
          description: |
            Título da secção. Sempre opcional: ausente, `null`, `""` e `"   "` são
            indistinguíveis e dão secção sem título (passa por `TrimSpace`).

            **Não** herda `top_text`: esse padrão só vale para a forma legada
            `list`.
          example: Pizzas
          nullable: false
          type: string
      type: object
    SolicitacaoEntrada:
      description: |
        Um pedido de entrada pendente, devolvido por
        `GET /group/requestparticipants`. O corpo é
        `dtogroup.GroupJoinRequestResponse`
        (`pkg/presentation/http/dto/group/group.go`), produzido por
        `PresentGroupJoinRequest` — não mais a struct de protocolo serializada
        directamente.

        **A forma não foi observada com dados**: os dois grupos disponíveis não
        tinham pedidos pendentes, e todas as chamadas medidas devolveram `[]`. As
        descrições de campo abaixo ainda reflectem o que era conhecido do tipo de
        protocolo antes da migração, não uma nova medição.
      properties:
        added_by_jid:
          description: |
            Quem adicionou o solicitante. `""` quando ninguém o fez — um pedido
            feito ao seguir um link de convite não tem quem o adicionou. **Não
            observado com dados.**
          example: ""
          nullable: false
          type: string
        jid:
          description: |
            Quem pediu para entrar. **Sempre presente** quando houver uma entrada,
            nunca `null` nem omitido — o DTO não usa `omitempty`. **Não observado
            com dados.**
          example: 554192421234@s.whatsapp.net
          nullable: false
          type: string
        method:
          description: |
            Como o pedido chegou (`InviteLink` para um convite). `""` quando o
            motor não o relata. **Não observado com dados.**
          example: InviteLink
          nullable: false
          type: string
        requested_at:
          description: |
            Quando o pedido foi feito. `null`, e nunca
            `"0001-01-01T00:00:00Z"`, quando o motor não relata o momento — ver
            `presentTime` em `docs/HTTP-DTO-CONVENTIONS.md` §5. **Não observado
            com dados.**
          example: "2026-08-26T08:42:47-04:00"
          format: date-time
          nullable: true
          type: string
      required:
        - jid
        - requested_at
        - added_by_jid
        - method
      type: object
    SubGrupoComunidade:
      description: |
        Um grupo ligado à comunidade. O corpo é
        `dtogroup.CommunitySubGroupResponse`
        (`pkg/presentation/http/dto/group/group.go`), produzido por
        `PresentCommunitySubGroup` — três campos, `snake_case`, e não mais os seis
        da struct de protocolo serializada directamente que este ficheiro
        documentava antes da migração para DTO. `name_set_at`/`name_set_by`/
        `name_set_by_pn` desapareceram: eram detalhe do protocolo, não do recurso
        — a mesma decisão de `InfoGrupoCanonico` (`docs/HTTP-DTO-CONVENTIONS.md`).
      properties:
        is_default_sub_group:
          description: |
            `true` no **grupo de avisos**, que a comunidade cria sozinha e que não
            pode ser desligado. `false` nos grupos ligados por
            `POST /community/link`.

            Sempre presente; nunca `null`. É o campo que distingue "o grupo que
            sobra sempre" de "os grupos que eu liguei" — medido na transição
            1 → 2 → 1 da F237, em que foi este que ficou.
          example: true
          nullable: false
          type: boolean
        jid:
          description: JID do sub-grupo, no servidor `@g.us`. Sempre presente; nunca `null`, nunca ausente.
          example: 120363411669320145@g.us
          nullable: false
          type: string
        name:
          description: |
            Nome do sub-grupo. Sempre presente; nunca `null`. **`""` é possível**
            — um grupo pode não ter nome definido —, e nesse caso é
            indistinguível de "o servidor não informou".
          example: Avisos
          nullable: false
          type: string
      required:
        - jid
        - name
        - is_default_sub_group
      type: object
    SubGruposComunidade:
      description: |
        Resposta de `POST /community/subgroups`. A lista está dentro da chave
        `sub_groups`, um nível abaixo de `data`.
      properties:
        sub_groups:
          description: |
            Os grupos ligados à comunidade.

            **Nunca vem vazia numa comunidade real**: o grupo de avisos é criado
            com a comunidade e aparece sempre, marcado com `is_default_sub_group:
            true` (F237, medido com a transição 1 → 2 → 1 provocada por
            `POST /community/link` e `POST /community/unlink`).

            **Sempre `[]`, nunca `null`**: `PresentGetCommunitySubGroups`
            (`pkg/presentation/http/dto/group/presenter_group.go`) aloca a lista
            antes do laço, mesmo vazia — fecha a incerteza sobre `null` que este
            ficheiro registava antes da migração para DTO, quando o campo ainda
            era `any` na struct de resultado.

            Sem paginação e sem tecto.
          items:
            $ref: '#/components/schemas/SubGrupoComunidade'
          nullable: false
          type: array
      required:
        - sub_groups
      type: object
    SubscricaoCanal:
      description: |
        Resposta de `POST /newsletter/subscribe`.

        **Esta rota respondia `data: null`.** O use case calculava a duração do
        arrendamento e o manipulador servia só a carga da operação, que a subscrição
        deixa vazia — logo o único facto que esta rota existe para dizer nunca
        chegava ao cliente. Corrigido na migração para DTO.
      properties:
        duration_seconds:
          description: |
            Por quantos **segundos** as actualizações ao vivo valem. É o
            arrendamento do SERVIDOR, não escolha nossa, e é o que diz ao chamador
            quando repetir a chamada.

            Truncado para segundos inteiros: o protocolo mede em segundos e um resto
            de sub-segundo seria ruído sobre o qual ninguém age. `0` quando o
            servidor não reportou arrendamento.
          example: 90
          nullable: false
          type: integer
        status:
          description: '`sent` quando a operação chegou ao WhatsApp. Nunca `null`.'
          example: sent
          nullable: false
          type: string
      required:
        - status
        - duration_seconds
      type: object
    SucessoMensagem:
      description: Confirmação de uma operação de estado de conversa.
      properties:
        message:
          description: |
            Confirmação textual, em **inglês** (`Chat pinned`, `Chat unmuted`,
            `Message starred`…).

            **Sempre presente, e não é estável**: o texto varia com a operação
            e com o ramo tomado — silenciar e reactivar devolvem palavras
            diferentes. Não o compare num cliente; use o estado HTTP.
          example: Chat pinned
          nullable: false
          type: string
        success:
          description: |
            **Sempre presente.** `true` quando a operação foi aceite.

            Não confundir com o `success` do envelope: este vive dentro de
            `data` e é do resultado da operação; aquele é do envelope HTTP.
            Nas rotas que usam este esquema os dois aparecem, e valem `true`.
          example: true
          nullable: false
          type: boolean
      type: object
    TextoDeCanal:
      description: |
        O nome ou a descrição de um canal, com o instante da última alteração.
        **Sempre presente e nunca `null`**; num canal apagado vem
        `{text: "", id: "", updated_at: null}`.
      properties:
        id:
          description: |
            Identificador **desta versão do texto**, e não do canal, como cadeia de
            dígitos. `""` em canal apagado e em todo canal visto pelo motor
            headless, que não reporta versões.
          example: "1787745654587070"
          nullable: false
          type: string
        text:
          description: O texto. `""` em canal apagado, inexistente, ou sem descrição; nunca `null`.
          example: Avisos da Fila Rápida
          nullable: false
          type: string
        updated_at:
          description: |
            Instante da última alteração, em **RFC 3339 e em UTC**. Era
            `update_time`, um inteiro de dezasseis dígitos entre aspas — repare que
            a granularidade era MICROSSEGUNDOS, contra segundos em `creation_time`,
            e que a diferença não estava assinalada em lado nenhum.

            **`null` quando não há instante**, o que era `"0"` — a mesma armadilha
            de 1970 de `created_at`.
          example: "2026-08-26T12:40:54Z"
          format: date-time
          nullable: true
          type: string
      required:
        - text
        - id
        - updated_at
      type: object
    UltimaAtividadePorConversa:
      description: |
        Instante da mensagem mais recente de cada conversa, em
        `GET /user/contacts/last-activity`. Derivado do histórico LOCAL (o
        `HistorySync` que chega depois do pareamento, mais as mensagens correntes),
        **não** de uma consulta ao WhatsApp.

        > **Nota da migração de DTO (2026-08-27).** A forma abaixo é DERIVADA DO
        > CÓDIGO. **Era um OBJECTO indexado por JID; passou a ser `{chats: […]}`.**
        > Aquelas chaves eram JIDs, e um JID nunca casa com a regra de nomes do
        > contrato (`^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$`) — `@` e `.` não estão no
        > alfabeto. Não havia renomear: o dado teve de sair da chave.

        **A ordem é por JID**, imposta pelo apresentador. O mapa de origem tem
        ordem de iteração aleatória por desenho do Go, e sem ordenar duas respostas
        para o mesmo estado não se conseguiam diffar.

        Os JIDs são normalizados para o espaço LID quando o mapeamento é conhecido,
        para casarem com os de `GET /user/contacts`. Um número sem LID conhecido
        mantém o `@s.whatsapp.net`, e grupos aparecem em `@g.us`. Quando a sessão
        está em espera, a normalização é saltada e o dado sai cru — degrada, não
        falha.

        **A lista não traz só contactos.** Medido, 384 entradas numa conta: 379
        `@lid`, 3 `@g.us`, 1 `@s.whatsapp.net` e 1 `status@broadcast` — mais
        `0@s.whatsapp.net`, que é a conta oficial do WhatsApp. A filtragem é de
        quem chama; a consulta inclui grupos e difusões de propósito.

        **Descarte silencioso, do lado da resposta**: uma linha cujo carimbo de
        tempo não parseia é SALTADA, com aviso no log e sem sinal nenhum na
        resposta. Uma conversa pode faltar aqui sem que isso signifique ausência
        de mensagens.
      properties:
        chats:
          description: |
            Uma entrada por conversa, ordenada por `jid`. Sempre presente; `[]`
            (nunca `null`) quando não há histórico.
          example:
            - jid: 100429404864623@lid
              last_activity: "2026-08-24T22:56:53Z"
            - jid: status@broadcast
              last_activity: "2026-08-24T22:56:53Z"
          items:
            properties:
              jid:
                description: Identidade da conversa, como ela vive no histórico local.
                example: 100429404864623@lid
                nullable: false
                type: string
              last_activity:
                description: |
                  Instante da mensagem mais recente daquela conversa, em RFC 3339
                  **UTC**.

                  **Duas mudanças em relação ao que foi medido a 2026-08-26.** O
                  valor vinha no fuso LOCAL do servidor com resolução de
                  microssegundos (`2026-08-24T18:56:53.836029-04:00`); o
                  apresentador passou a normalizar para UTC com resolução de
                  segundos (`2026-08-24T22:56:53Z`), que é a mesma regra do resto
                  do contrato.

                  E é **`null`, e não `"0001-01-01T00:00:00Z"`, para tempo
                  desconhecido**: essa cadeia é uma data real no fio, e um cliente
                  que a parseasse recebia uma conversa activa antes do calendário
                  gregoriano em vez de um campo sem valor. A chave existe sempre.
                example: "2026-08-24T22:56:53Z"
                format: date-time
                nullable: true
                type: string
            required:
              - jid
              - last_activity
            type: object
          nullable: false
          type: array
      required:
        - chats
      type: object
    UtilizadorAdmin:
      description: |
        Uma sessão do wa-api, como as rotas `/admin/users` a devolvem.

        **`token` só traz valor na resposta de `POST /admin/users`.** Na listagem
        e na consulta por identificador vem sempre `""`, deliberadamente: devolver
        o token de todas as sessões transformava uma leitura na fuga de todas as
        credenciais da instalação.

        Campo nenhum desta resposta vem `null` e campo nenhum é omitido: o
        `omitempty` saiu de todos na migração para DTO, porque um cliente tem de
        conseguir distinguir "esta sessão não tem JID" de "esta versão deixou de
        mandar a chave". O que não tem valor vem `""`, `false` ou `0`.
      properties:
        connected:
          description: |
            Se o transporte para o WhatsApp está de pé neste instante.

            **Sempre presente**, incluindo quando `false`. Nunca `null`. Na
            resposta de criação vem `false`, porque criar não liga.
          example: true
          nullable: false
          readOnly: true
          type: boolean
        events:
          description: |
            Eventos subscritos, separados por vírgulas. `All` recebe todos.

            **Sempre presente**; vem `""` quando a sessão não subscreve nenhum.
            Nunca `null`. Antes da migração a chave desaparecia nesse caso.
          example: Message,Receipt,Connected
          nullable: false
          readOnly: true
          type: string
        expiration:
          description: |
            Instante de expiração da sessão, em segundos desde a época Unix.

            **Sempre presente**, e `0` significa *não expira* — logo `0` é a
            resposta normal. Nunca `null`.
          example: 1790000000
          format: int64
          minimum: 0
          nullable: false
          readOnly: true
          type: integer
        hmac_configured:
          description: |
            Se a sessão nasceu com chave HMAC. **Sempre presente**; só vem `true`
            na resposta de `POST /admin/users`, e só quando uma `hmac_key` foi
            enviada. Nunca `null`.

            Nas leituras vem sempre `false`: elas não consultam a coluna.
          example: true
          nullable: false
          readOnly: true
          type: boolean
        id:
          description: |
            Identificador da sessão, hexadecimal de 32 caracteres. É o `{id}` das
            rotas `/admin/users/{id}`.

            **Sempre presente**, e nunca `null`: é gerado pelo servidor.
          example: 918e37366f27e1125ee0482a793267e1
          maxLength: 32
          minLength: 32
          nullable: false
          pattern: ^[0-9a-f]{32}$
          readOnly: true
          type: string
        jid:
          description: |
            JID da conta de WhatsApp emparelhada, com o sufixo do aparelho
            (`:25`). **Sempre presente**; vem `""` enquanto a sessão não estiver
            emparelhada. Nunca `null`.

            Até à migração para DTO a chave DESAPARECIA nesse caso (`omitempty`),
            e a ausência era indistinguível de a versão do servidor não a mandar.
          example: 5516981818244:25@s.whatsapp.net
          nullable: false
          readOnly: true
          type: string
        logged_in:
          description: |
            Se a sessão está autenticada. Distinto de `connected`: pode haver
            credencial válida com o transporte caído.

            **Sempre presente**, incluindo quando `false`. Nunca `null`.

            Chamava-se `loggedIn`, em camelCase — o único nome desta resposta que
            a regra de nomes canónicos recusava de todo.
          nullable: false
          readOnly: true
          type: boolean
        name:
          description: |
            Nome dado à sessão na criação. Não é o nome da conta de WhatsApp.

            **Sempre presente**; vem `""` se a linha do banco estiver com o nome
            vazio. Nunca `null`.
          example: filarapida
          nullable: false
          readOnly: true
          type: string
        proxy_config:
          description: |
            Proxy de saída desta sessão. **Sempre presente**, com as três chaves.
            Nunca `null`.

            O corpo de escrita usa exactamente os mesmos nomes: a assimetria
            `proxy_config` na leitura contra `proxyConfig` na escrita acabou com
            a migração para DTO.
          nullable: false
          properties:
            enabled:
              description: |
                **Derivado**, não gravado: é `proxy_url != ""`. Na resposta de
                `POST /admin/users` isto significa que o `enabled` que você
                enviou em `proxyConfig` **não é ecoado** — o que decide é ter ou
                não URL. Sempre presente, nunca `null`.
              example: false
              nullable: false
              readOnly: true
              type: boolean
            proxy_url:
              description: |
                URL do proxy gravado. `""` quando não há nenhum. Sempre presente,
                nunca `null`. Chamava-se `proxyUrl`.
              example: ""
              nullable: false
              readOnly: true
              type: string
            webhook_use_proxy:
              description: |
                Se a entrega dos webhooks também sai por este proxy. Sempre
                presente, nunca `null` — a resolução acontece no servidor, que
                escolhe entre o valor pedido, o gravado e o padrão da instalação.
                Chamava-se `webhookUseProxy`.
              example: true
              nullable: false
              readOnly: true
              type: boolean
          readOnly: true
          type: object
        qrcode:
          description: |
            QR code pendente de leitura, quando o emparelhamento está a decorrer.
            **Sempre presente**; vem `""` fora disso. Nunca `null`.

            Na resposta de `POST /admin/users` vem sempre `""`: criar a sessão não
            inicia o emparelhamento.
          example: 2@Wt3F0k...
          nullable: false
          readOnly: true
          type: string
        s3_config:
          description: |
            Armazenamento em S3 desta sessão. **Sempre presente**. Nunca `null`.

            **`access_key` já não existe nesta resposta.** Vinha sempre como
            `***`, com chave configurada ou sem ela — a listagem nem sequer lê a
            coluna —, portanto não dizia nada; e depois de os nomes de pedido e
            de resposta passarem a coincidir, reenviar esta resposta num
            `PUT /admin/users/{id}` gravaria `***` por cima da credencial real.
            `secret_key` continua a não aparecer.
          nullable: false
          properties:
            bucket:
              description: Bucket de destino. `""` quando não configurado. Sempre presente, nunca `null`.
              example: ""
              nullable: false
              readOnly: true
              type: string
            enabled:
              description: Se o armazenamento em S3 está ligado. Sempre presente, nunca `null`.
              example: false
              nullable: false
              readOnly: true
              type: boolean
            endpoint:
              description: Endereço do serviço. `""` quando não configurado. Sempre presente, nunca `null`.
              example: ""
              nullable: false
              readOnly: true
              type: string
            media_delivery:
              description: |
                Como a mídia recebida é entregue.

                **`""` está na lista de propósito, e foi medido**: esta resposta
                devolve a coluna **tal e qual**, sem aplicar o padrão. Uma sessão
                criada por `POST /admin/users` sem `mediaDelivery`, ou uma linha
                antiga, devolve `""` aqui — enquanto `GET /s3/config` da mesma
                sessão devolve `""` também, e só o caminho de ESCRITA
                (`POST /s3/config`) substitui o vazio por `base64`. Trate `""`
                como `base64`.

                Um valor desconhecido não chega aqui por esta via: `POST /s3/config`
                recusa-o com `400 invalid_media_delivery` antes de gravar. Mas
                `POST /admin/users` e `PUT /admin/users/{id}` **não validam**, e um
                valor arbitrário gravado por ali sai aqui tal e qual.

                Sempre presente, nunca `null`.
              enum:
                - ""
                - base64
                - s3
                - both
              example: base64
              nullable: false
              readOnly: true
              type: string
            path_style:
              description: |
                Endereçamento por caminho em vez de subdomínio. Sempre presente,
                nunca `null`. `false` é o valor de uma linha que nunca gravou
                configuração de S3.
              example: true
              nullable: false
              readOnly: true
              type: boolean
            public_url:
              description: Base pública da mídia. `""` quando não configurada. Sempre presente, nunca `null`.
              example: ""
              nullable: false
              readOnly: true
              type: string
            region:
              description: Região. `""` quando não configurada. Sempre presente, nunca `null`.
              example: ""
              nullable: false
              readOnly: true
              type: string
            retention_days:
              description: |
                Dias de retenção dos objectos. Sempre presente, nunca `null`.
                `0` é o valor de uma linha que nunca gravou configuração de S3 e
                não é validado em lado nenhum.
              example: 30
              minimum: 0
              nullable: false
              readOnly: true
              type: integer
          readOnly: true
          type: object
        token:
          description: |
            Token de sessão. **Sempre presente**, mas o valor depende da rota:

            | rota | valor |
            |---|---|
            | `POST /admin/users` | o token em claro, **uma única vez** |
            | `GET /admin/users` | `""` — sempre |
            | `GET /admin/users/{id}` | `""` — sempre |

            Nunca `null`. Perdido o token da criação, não há como o recuperar:
            cria-se outra sessão.
          example: ""
          nullable: false
          readOnly: true
          type: string
        webhook:
          description: |
            URL do webhook desta sessão. **Sempre presente**; vem `""` quando não
            há nenhum configurado. Nunca `null`.
          example: ""
          nullable: false
          readOnly: true
          type: string
      type: object
    VistaConfigHmac:
      description: |
        Resposta de `GET /session/hmac/config`. MEDIDA no servidor vivo em
        2026-08-26 nas duas sessões reais: `{"hmac_key": ""}` nas duas.

        O que sai é a PRESENÇA da chave, nunca a chave: devolvê-la, mesmo cifrada,
        entregaria o material que a assinatura existe para proteger.
      properties:
        hmac_key:
          description: |
            `""` quando não há chave gravada; `***` quando há.

            **Sempre presente e nunca `null`** — sem `omitempty` na struct
            (`domain/storage.go`, `HmacConfigView`).

            Um terceiro valor, desconhecido, não pode sair: o caso de uso escolhe
            entre a constante e o vazio conforme o comprimento do que veio do
            banco (`storage/get_hmac_config.go:47-50`). Se aparecer outra coisa,
            é defeito, não variação de contrato.

            Ao contrário de `hmac_configured` em `GET /session/status` — que é
            sempre `false` mesmo havendo chave —, este campo reporta a presença de
            forma honesta. É por aqui que se pergunta.
          enum:
            - ""
            - '***'
          example: ""
          nullable: false
          type: string
      required:
        - hmac_key
      type: object
    VistaConfigS3:
      description: |
        Resposta de `GET /session/s3/config`. MEDIDA no servidor vivo em
        2026-08-26 nas duas sessões reais.

        **O segredo não tem por onde sair**: a leitura nem seleciona a coluna
        `s3_secret_key`. A access key vem mascarada INCONDICIONALMENTE, mesmo
        quando não há nenhuma configurada — mascarar só por presença revelaria a
        presença.

        Uma sessão sem configuração responde `200` com a configuração como está na
        linha, e não um erro: assim o chamador distingue "nada configurado" de "a
        leitura falhou".

        **Nenhum campo tem `omitempty`** (`domain/storage.go`, `S3ConfigView`): os
        nove aparecem SEMPRE e nenhum vem `null`.
      properties:
        access_key:
          description: |
            **Sempre a constante `***`, e sempre presente.** Nunca o valor, nunca
            `""`, nunca `null` — a máscara é aplicada incondicionalmente
            (`storage/get_s3_config.go:60`), inclusive quando não há credencial
            nenhuma gravada. Medido `"***"` nas duas sessões, ambas sem S3
            configurado.

            Consequência: **este campo não serve para saber se há credencial**.
            Use `enabled` ou `bucket` para isso.
          example: '***'
          nullable: false
          type: string
        bucket:
          description: Bucket gravado. Sempre presente, nunca `null`; `""` quando nada foi configurado.
          example: ""
          nullable: false
          type: string
        enabled:
          description: A entrega de mídia para o bucket está ligada. Sempre presente, nunca `null`.
          example: false
          nullable: false
          type: boolean
        endpoint:
          description: Endpoint gravado. Sempre presente, nunca `null`; `""` significa o endpoint padrão da AWS.
          example: ""
          nullable: false
          type: string
        media_delivery:
          description: |
            Modo de entrega gravado. Sempre presente e nunca `null`.

            **Não tem `enum` de propósito, e a razão foi medida.** A escrita só
            aceita `base64`, `s3` ou `both`, mas a LEITURA devolve o conteúdo cru
            da coluna: uma sessão que nunca chamou `POST /session/s3/config` tem
            `""`. Medido em 2026-08-26: `"base64"` numa sessão e `""` na outra.
            Declarar aqui o enum da escrita tornaria o documento falso.

            `""` deve ser lido como "nunca configurado"; o comportamento efectivo
            nesse estado é o padrão, `base64`.
          example: base64
          nullable: false
          type: string
        path_style:
          description: |
            Endereçamento por caminho. Sempre presente e nunca `null`.

            Medido `true` numa sessão e `false` na outra em 2026-08-26, ambas sem
            S3 configurado: o valor é o da coluna, e o `true` do padrão só
            aparece quando NÃO existe linha de utilizador — situação impossível
            numa sessão autenticada, porque é a linha que autentica.
          example: true
          nullable: false
          type: boolean
        public_url:
          description: Prefixo público gravado. Sempre presente, nunca `null`; `""` quando não há.
          example: ""
          nullable: false
          type: string
        region:
          description: Região gravada. Sempre presente, nunca `null`; `""` quando nada foi configurado.
          example: ""
          nullable: false
          type: string
        retention_days:
          description: |
            Dias de retenção gravados. Sempre presente e nunca `null`. `0` é o
            valor de origem e significa "nunca configurado". Medido `30` numa
            sessão e `0` na outra em 2026-08-26.
          example: 30
          nullable: false
          type: integer
      type: object
  securitySchemes:
    TokenAdmin:
      description: |
        Token de administração do wa-api, para as rotas `/admin`. É **regerado
        a cada arranque do processo** e fica em `<datadir>/admin_token`.
        Enviado tal e qual, sem o prefixo `Bearer`.
      in: header
      name: Authorization
      type: apiKey
    TokenSessao:
      description: |
        Token da sessão de WhatsApp. Identifica de que conta parte a operação.
        É criado em `POST /admin/users` e não é recuperável depois — se se
        perder, cria-se outra sessão.

        Por compatibilidade, também é aceite como `?token=` na query string,
        mas cada uso emite aviso no log e essa forma será removida.
      in: header
      name: token
      type: apiKey
info:
  description: "API HTTP que expõe uma conta de WhatsApp como serviço: enviar e receber\nmensagens, gerir grupos, comunidades e canais, consultar contactos e\nadministrar sessões.\n\n## Como se autentica\n\nQuase todas as rotas usam um **token de sessão**, enviado no cabeçalho\n`token`. Cada token identifica uma sessão de WhatsApp já emparelhada — é\nele que diz *de que conta* a operação parte.\n\nAs rotas sob `/admin` usam outro segredo: o **token de administração**, no\ncabeçalho `Authorization`. Ele governa as sessões (criar, listar, apagar) e\nnão pertence a nenhuma conta de WhatsApp. É regerado a cada arranque e fica\nem `<datadir>/admin_token`.\n\nTrês rotas de sonda não pedem credencial nenhuma: `/livez`,\n`/health/live` e `/health/ready`.\n\nUse o botão **Authorize** aqui em cima para preencher os dois.\n\n## O envelope das respostas\n\nSucesso e erro têm forma fixa:\n\n```json\n{ \"code\": 200, \"data\": { }, \"success\": true }\n```\n\n```json\n{ \"code\": 400, \"error\": { \"code\": \"missing_chat\", \"message\": \"missing chat in payload\" }, \"success\": false }\n```\n\n`error.code` é estável e legível por máquina; `error.message` é para\nmostrar a uma pessoa.\n\n**Ressalva medida**: catorze pontos do código ainda respondem com\n`\"error\"` em texto simples em vez do objecto — as recusas de campo\nobrigatório das rotas de grupo, sobretudo. Está registado como F266 no\n`HOUSEKEEP.md`, e a documentação de cada rota afectada diz.\n\n## Campos que a API não conhece\n\nUm campo que o servidor não reconhece é **ignorado**, e o pedido segue sem\nele. Isto é herança do decodificador de JSON do Go e vale para toda a API.\n\n**É mais perigoso do que parece**, e foi medido: um nome mal escrito não\nproduz erro — produz o valor zero. Quando o valor zero significa alguma\ncoisa, o erro de digitação vira uma escolha silenciosa. O caso real:\n`{\"mute\": true, \"duration\": \"8h\"}` em `/chat/mute` devolve `200` e cala a\nconversa **para sempre**, porque o campo é `mute_duration` e a ausência\ndele significa \"para sempre\".\n\nDesde 2026-08-26 o servidor **regista** cada campo desconhecido:\n\n```\nWRN unknown field \"duration\" route=/chat/mute unknown_fields=[\"duration\"] req_id=…\n```\n\nE há um modo **estrito**, desligado por omissão, que os recusa:\n\n```\nWA_API_STRICT_UNKNOWN_FIELDS=true\nPOST /chat/mute {\"jid\":\"…\",\"mute\":true,\"duration\":\"8h\"}\n  -> 400 {\"error\":{\"code\":\"unknown_field\",\"message\":\"unknown field \\\"duration\\\"\"}}\n```\n\nEstá desligado porque ligá-lo recusaria pedidos que hoje funcionam. Se\nintegra com esta API, **ligue-o em desenvolvimento**: é a forma mais barata\nde apanhar um nome errado antes de ele chegar a produção.\n\n## O campo `chat`\n\nToda rota que recebe um destinatário aceita `\"chat\"` como nome universal do\ncampo. O nome antigo e específico da rota (`Phone`, `groupJID`, `jid`…)\ncontinua a funcionar e **ganha** quando os dois vierem no mesmo pedido.\n\n## Identificadores\n\n- **PN** — o número, em `554192421234@s.whatsapp.net`\n- **LID** — o identificador opaco, em `90937376170214@lid`\n- **grupo** — `120363411669320145@g.us`\n- **canal** — `120363411025775186@newsletter`\n\nOnde a distinção importa, a descrição da rota diz qual das formas é exigida.\n\n## O marcador no título de cada endpoint\n\nCada título começa com um símbolo que diz **quanta prova existe de que\naquela rota funciona** — não o quão bem está documentada. As 137 estão\ndocumentadas; o que varia é o que foi medido.\n\n| | significa |\n|---|---|\n| ✅ | chamada real **e** efeito confirmado por observador independente — segunda leitura, transição de estado medida, ou a mensagem vista no cliente |\n| \U0001F7E1 | chamada real com resposta de sucesso, **sem** forma de confirmar o efeito |\n| ❌ | chamada real que **falhou**; o erro medido está na descrição da rota |\n| ⬜ | **não executada**, e a descrição diz porquê |\n\nMedição de 2026-08-26, com duas sessões reais mais um lote de sessões\ndescartáveis: **117 ✅, 8 \U0001F7E1, 4 ❌, 8 ⬜**.\n\nAs 8 por testar não são todas esquecimento. Sete não o são por \"mexeria na\nsessão em uso\" — esse motivo caiu com as sessões descartáveis, e valeu 25\nrotas — e exigem um bucket S3 descartável, uma chamada a entrar, ou uma\nconta emparelhada cujo perfil seria alterado. A oitava,\n`POST /chats/download/{kind}`, é nova (CAP-10, consolidação das cinco\nrotas de descarga com o kind na relação do caminho) e ainda não foi\nmedida contra um servidor real. O detalhe rota a rota está em\n`docs/OPENAPI-EVIDENCIAS.md`.\n\n**Um \U0001F7E1 não é um ✅ mais fraco por descuido** — é a recusa deliberada de\nchamar confirmado aquilo que só devolveu `2xx`.\n\n## O que `200` significa, e o que não significa\n\nUm `200` diz que o WhatsApp aceitou o pedido. **Não** diz que a mensagem\nfoi desenhada no ecrã do destinatário, nem que a operação teve efeito\nvisível. As rotas em que essa diferença já foi medida trazem a ressalva na\ndescrição.\n"
  title: wa-api — API HTTP para WhatsApp
  version: 1.0.6
openapi: 3.0.3
paths:
  /admin/users:
    get:
      description: |
        Devolve **todas** as sessões do wa-api, com o estado de ligação de cada
        uma, a configuração de proxy e de S3, e a subscrição de eventos.

        **O `token` vem SEMPRE vazio**, e é de propósito: esta listagem devolvia
        o token em claro de todas as sessões da instalação, o que transformava
        uma leitura numa fuga de todas as credenciais. O token só existe uma vez,
        na resposta de `POST /admin/users`, e não é recuperável depois. Perdido o
        token, cria-se outra sessão.

        **Instalação sem sessões devolve `data: []`**, e nunca `null`: só uma
        das duas formas se percorre sem verificação.

        **Nomes**: esta família migrou para a camada de DTO. `loggedIn` passou a
        `logged_in`, `proxyUrl` a `proxy_url`, `webhookUseProxy` a
        `webhook_use_proxy`, e nenhum campo é omitido quando está vazio.
        `s3_config.access_key`, que vinha sempre como `***`, **desapareceu**.

        **Quando usar**: em painéis de operação, para saber que sessões existem e
        quais estão ligadas e autenticadas.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        enviado tal e qual, sem o prefixo `Bearer`. Ele é **regerado a cada
        arranque do processo** e fica em `<datadir>/admin_token` — um token
        guardado de uma execução anterior responde `401`.
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - connected: true
                    events: All
                    expiration: 0
                    hmac_configured: false
                    id: 918e37366f27e1125ee0482a793267e1
                    jid: 5516981818244:25@s.whatsapp.net
                    logged_in: true
                    name: filarapida
                    proxy_config:
                      enabled: false
                      proxy_url: ""
                      webhook_use_proxy: true
                    qrcode: ""
                    s3_config:
                      bucket: ""
                      enabled: false
                      endpoint: ""
                      media_delivery: base64
                      path_style: true
                      public_url: ""
                      region: ""
                      retention_days: 30
                    token: ""
                    webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/UtilizadorAdmin'
                        type: array
                    type: object
          description: |
            Lista de sessões. `[]` se não houver nenhuma — nunca `null`.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Listar as sessões existentes
      tags:
        - Administração
    post:
      description: |
        Cria uma sessão do wa-api e **é onde nasce o token de sessão**. Todas as
        outras rotas da API usam esse token no cabeçalho `token`.

        **Guarde o token no momento da resposta.** Ele é devolvido UMA vez e não
        é recuperável depois: `GET /admin/users` devolve `token: ""` para todas
        as sessões, deliberadamente. Se o token se perder, a única saída é apagar
        a sessão e criar outra.

        Criar a sessão **não** a emparelha com o WhatsApp: isso é
        `GET /session/connect` seguido da leitura do QR code.

        **Regras** (lidas em `add_user.go`):

        - `name` e `token` são **obrigatórios**; a falta de qualquer um deles dá
          `400 missing_name_or_token`.
        - `token` tem de ser único na instalação. Repetido, dá `409` — a resposta
          é o envelope antigo, com `error` em texto simples (`"conflict"`).
        - `events` é uma lista separada por vírgulas, e cada nome é validado:
          um nome desconhecido dá `400 invalid_event_type`, indicando qual.
          `All` recebe todos os eventos.
        - `hmac_key`, quando presente, tem de ter pelo menos **32 caracteres**
          (`400 hmac_key_too_short`). É guardada cifrada e nunca mais sai.

        **Nomes**: o corpo é todo em `snake_case` — `hmac_key`, `proxy_config`,
        `s3_config`, e dentro deles `proxy_url`, `access_key`, `path_style`,
        `public_url`, `media_delivery`, `retention_days`, `webhook_use_proxy`.
        O camelCase de antes deixou de ser lido na migração para DTO: ele
        existia porque a RESPOSTA era snake_case, e alinhar os dois lados
        dispensou a grafia dupla. Um corpo com os nomes antigos perde esses
        campos, e o servidor regista `unknown field`.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`. É regerado a cada arranque e fica em
        `<datadir>/admin_token`.
      requestBody:
        content:
          application/json:
            example:
              events: Message,Receipt,Connected
              history: 100
              name: filarapida
              proxy_config:
                enabled: false
                proxy_url: ""
              s3_config:
                enabled: false
                media_delivery: base64
                retention_days: 30
              token: tk_EXEMPLO_NAO_USE_gere_o_seu
            schema:
              $ref: '#/components/schemas/PedidoCriarUtilizador'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  connected: false
                  events: Message,Receipt,Connected
                  expiration: 0
                  hmac_configured: false
                  id: 918e37366f27e1125ee0482a793267e1
                  jid: ""
                  logged_in: false
                  name: filarapida
                  proxy_config:
                    enabled: false
                    proxy_url: ""
                    webhook_use_proxy: true
                  qrcode: ""
                  s3_config:
                    bucket: ""
                    enabled: false
                    endpoint: ""
                    media_delivery: base64
                    path_style: false
                    public_url: ""
                    region: ""
                    retention_days: 30
                  token: tk_EXEMPLO_NAO_USE_gere_o_seu
                  webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UtilizadorAdmin'
                    type: object
          description: |
            Sessão criada. **Esta é a única resposta em que `token` traz o valor
            real** — copie-o antes de fechar a chamada.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_name_or_token
                  message: name and token are required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Campo obrigatório em falta, evento desconhecido, ou chave HMAC curta
            demais.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: conflict
                  message: A requisição não pode ser atendida no estado atual.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Já existe sessão com este `token`. **Devolve o envelope ANTIGO**, com
            `error` em texto simples e não o objecto `{code, message}` — este erro
            não passa pela taxonomia `apperr` (F266).
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Criar uma sessão
      tags:
        - Administração
  /admin/users/{id}:
    delete:
      description: |
        Apaga a **linha da sessão no banco** e nada mais.

        **A diferença face a `DELETE /admin/users/{id}/full`**, lida em
        `delete_user.go` e `delete_user_complete.go`:

        | | esta rota | `/full` |
        |---|---|---|
        | linha em `users` | apaga | apaga |
        | termina a ligação ao WhatsApp | **não** | faz `logout` e `disconnect` antes |
        | ficheiros em `<datadir>/files/<id>` | **deixa** | apaga a pasta inteira |
        | objectos no S3 | não apaga | **também não apaga** — ver abaixo |
        | corpo da resposta | `{"status": "deleted"}` | `{id, name, jid, details}` |

        Ou seja: esta rota deixa para trás a sessão viva na memória do processo e
        a mídia em disco. Use `/full` quando a intenção for remover o
        utilizador por completo.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  status: deleted
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          status:
                            enum:
                              - deleted
                            example: deleted
                            type: string
                        type: object
                    type: object
          description: Registo apagado.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_user_id
                  message: user ID is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Identificador em falta no caminho.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Apagar o registo de uma sessão
      tags:
        - Administração
    get:
      description: |
        O mesmo manipulador da listagem, filtrado por `id`. Por isso **devolve um
        ARRAY**, e não um objecto — com um elemento quando a sessão existe.

        **Sessão inexistente responde `200` com `data: []`, e não `404`.** Um
        cliente que espere `404` para "não existe" não o vai receber aqui; teste
        o comprimento de `data`.

        Até à migração para DTO este caso devolvia `data: null`, porque o use
        case fazia `append` sobre uma fatia nil; hoje a colecção vazia é sempre
        `[]`.

        Tal como na listagem, `token` vem sempre vazio.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - connected: true
                    events: All
                    expiration: 0
                    hmac_configured: false
                    id: 918e37366f27e1125ee0482a793267e1
                    jid: 5516981818244:25@s.whatsapp.net
                    logged_in: true
                    name: filarapida
                    proxy_config:
                      enabled: false
                      proxy_url: ""
                      webhook_use_proxy: true
                    qrcode: ""
                    s3_config:
                      bucket: ""
                      enabled: false
                      endpoint: ""
                      media_delivery: base64
                      path_style: true
                      public_url: ""
                      region: ""
                      retention_days: 30
                    token: ""
                    webhook: ""
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/UtilizadorAdmin'
                        nullable: false
                        type: array
                    type: object
          description: |
            Array com a sessão pedida, ou `[]` quando o identificador não
            corresponde a nenhuma.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Consultar uma sessão pelo identificador
      tags:
        - Administração
    put:
      description: |
        Altera **apenas os campos enviados**. O que não vier no corpo fica como
        está.

        **Como se apaga um valor, e por que nem sempre dá**: para os campos de
        texto e para `expiration`, o vazio significa *"não informado"*, não
        *"limpe"* — `{"token": ""}` não apaga o token, é um pedido sem campos.
        A excepção é `history`, que é ponteiro: `{"history": 0}` **desactiva** a
        gravação de mensagens, e é distinguível de não mencionar o campo.

        **Um pedido sem nenhum campo útil** (`{}` ou só campos vazios) responde
        `400 no_fields_to_update`, e não `500`.

        **O corpo é todo em `snake_case`** — `s3_config`, `proxy_config`, e
        dentro deles `proxy_url`, `access_key`, `path_style`, `public_url`,
        `media_delivery`, `retention_days`, `webhook_use_proxy`. É o mesmo nome
        que a leitura devolve, o que torna o ciclo natural — ler, alterar um
        campo, reenviar — simétrico por construção. O camelCase de antes deixou
        de ser lido.

        **Não reenvie a resposta inteira como corpo**: ela não traz `access_key`
        nem `secret_key`, e um bloco `s3_config` presente **substitui o bloco
        todo**, gravando no valor zero o que não vier nele.

        Uma alteração de `proxy_config` com `enabled: false` limpa o `proxy_url`
        gravado.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        content:
          application/json:
            example:
              events: Message,Receipt
              history: 0
              name: filarapida
            schema:
              $ref: '#/components/schemas/PedidoEditarUtilizador'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  status: ok
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        properties:
                          status:
                            enum:
                              - ok
                            example: ok
                            type: string
                        type: object
                    type: object
          description: |
            Alteração gravada. O corpo é apenas uma confirmação — não devolve a
            sessão actualizada. Para a ver, chame `GET /admin/users/{id}`.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: no_fields_to_update
                  message: request has no field to update
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Pedido sem campo nenhum a mudar (`no_fields_to_update`), evento
            desconhecido (`invalid_event_type`), ou corpo ilegível.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: conflict
                  message: A requisição não pode ser atendida no estado atual.
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O `token` pedido já pertence a outra sessão. Envelope ANTIGO, com
            `error` em texto simples (F266).
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Alterar uma sessão
      tags:
        - Administração
  /admin/users/{id}/full:
    delete:
      description: |
        A remoção completa. Pela ordem em que acontece
        (`delete_user_complete.go`):

        1. confirma que a sessão existe — se não, `404 user_not_found`;
        2. se estiver ligada, faz **`logout` e `disconnect`** do WhatsApp,
           desemparelhando o aparelho;
        3. apaga a linha em `users`;
        4. apaga do disco a pasta `<datadir>/files/<id>`, com a mídia e o
           histórico gravados.

        **O que ela NÃO faz, apesar do nome**: os objectos guardados no S3
        **não são apagados**. O código regista *"S3 deletion needed - to be
        handled by handler"* e nenhuma camada seguinte o faz. Se a sessão usava
        S3, a limpeza do bucket é sua.

        As falhas dos passos 2 e 4 são **toleradas**: um erro a desligar ou a
        apagar ficheiros fica no log e a operação continua, porque a linha do
        banco já é a fonte de verdade. Um `200` aqui garante que a linha saiu,
        não que o disco ficou limpo.

        **Irreversível**, e mais destrutivo que `DELETE /admin/users/{id}`, que
        só apaga a linha.

        **Autenticação**: token de administração, no cabeçalho `Authorization`,
        sem prefixo `Bearer`, regerado a cada arranque em `<datadir>/admin_token`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: user instance removed completely
                  id: 918e37366f27e1125ee0482a793267e1
                  jid: 5516981818244:25@s.whatsapp.net
                  name: filarapida
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DadosUtilizadorApagado'
                    type: object
          description: |
            Sessão removida. O corpo traz a identificação de quem foi apagado,
            para o registo de auditoria de quem chamou, mais o `details`.

            O `details` é acréscimo da migração para DTO: o use case sempre o
            calculou e o manipulador deitava-o fora. O `code` e o `success` que
            o mesmo resultado carregava eram uma segunda cópia do envelope
            dentro do domínio, e saíram — o estado HTTP passou a ser escrito na
            fronteira.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_id
                  message: missing ID
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Identificador em falta no caminho.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: user_not_found
                  message: user not found
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: Não existe sessão com este identificador.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenAdmin: []
      summary: ✅ Apagar uma sessão por completo, com ficheiros e ligação
      tags:
        - Administração
  /call/reject:
    post:
      description: |
        Recusa uma chamada de voz ou vídeo que está a tocar.

        **Depende de um evento, e sem ele a rota é inutilizável.** Os dois campos
        obrigatórios — `call_from` e `call_id` — **não são inventáveis**: o
        `call_id` é gerado pelo WhatsApp e só chega à sua aplicação no evento
        `CallOffer`, entregue pelo webhook ou pelo WebSocket da sessão. Portanto o
        uso real é: subscrever `CallOffer` (ou `All`) em `POST /webhook`, e
        chamar esta rota **de dentro do manipulador desse evento**, com os valores
        que ele traz. Fora dessa janela, a chamada já terminou e a recusa não tem
        alvo.

        `call_from` é o JID de quem liga, e aceita telefone nu, JID de telefone ou
        LID — a resolução é feita aqui.

        **Regras** (lidas em `reject_call.go`), pela ordem em que recusam:

        1. sem sessão de WhatsApp para este token: `400 no_session`;
        2. `call_from` em falta: `400 missing_call_from`;
        3. `call_id` em falta: `400 missing_call_id`;
        4. `call_from` que não resolve para um JID: `400 invalid_call_from`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              call_from: 554192421234@s.whatsapp.net
              call_id: 3EB0A4B2AFD45E625C0917
            schema:
              $ref: '#/components/schemas/PedidoRecusarChamada'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  call_id: 3EB0A4B2AFD45E625C0917
                  details: Call rejected
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoRecusarChamada'
                    type: object
          description: |
            A recusa foi aceite pelo WhatsApp. O `call_id` ecoa o identificador
            recusado, para casar com o evento de origem.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_call_id
                  message: missing call_id in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Sem sessão (`no_session`), `call_from` ou `call_id` em falta
            (`missing_call_from`, `missing_call_id`), `call_from` que não resolve
            (`invalid_call_from`), ou corpo ilegível.
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ⬜ Recusar uma chamada a entrar
      tags:
        - Integrações e configuração
  /chats/{chat_jid}/read:
    post:
      description: |
        Envia o recibo de leitura de uma ou mais mensagens — os dois traços
        azuis do lado de quem escreveu.

        **Quando usar**: depois de o seu sistema processar as mensagens
        recebidas, para que o remetente veja que chegaram a quem as lê.

        **Regras, e uma ressalva medida**:

        - O campo do corpo é `chat_phone`. Antes da migração para DTO
          (HOUSEKEEP F322), o manipulador aceitava também o nome antigo `Chat`
          — mas o ramo que o converteria em JID nunca foi implementado
          (`mark_read.go:41`), e a conversa seguia VAZIA para o WhatsApp. O
          campo antigo saiu do DTO de pedido: hoje é apenas `chat_phone`, ou o
          `chat_jid` do caminho.
        - Sem nenhum dos dois, é `400 missing_chatphone`, medido.
        - `id` é uma LISTA. Vazia é `400 missing_id`.
        - `sender_phone` só faz sentido em grupo, e é opcional.
        - Esta rota NÃO aceita o alias universal `chat` — o tipo de pedido não
          o declara.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            JID da conversa. Substitui o campo `chat_phone` do corpo — se ambos
            vierem, o **corpo ganha**.
          in: path
          name: chat_jid
          required: true
          schema:
            example: 554192421234@s.whatsapp.net
            type: string
      requestBody:
        content:
          application/json:
            example:
              chat_phone: 554192421234@s.whatsapp.net
              id:
                - 3EB0A4B2AFD45E625C0917
            schema:
              $ref: '#/components/schemas/PedidoMarcarLida'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: Message marked as read
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: Os recibos foram enviados ao WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_chatphone
                  message: missing ChatPhone in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `chat_phone` ausente
            (`missing_chatphone`), destino mal formado (`invalid_chatphone`,
            `invalid_senderphone`), lista `id` vazia (`missing_id`) ou sessão
            inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Marcar mensagens como lidas
      tags:
        - Conversas
  /chats/archive:
    post:
      description: |
        > **Substitui `POST /chat/archive`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Move a conversa para a lista de arquivadas, ou tira-a de lá.

        **Quando usar**: para tirar da lista principal uma conversa que não
        precisa de atenção, sem a apagar.

        **Efeito colateral herdado, e não controlado por nós**: arquivar
        também DESAFIXA a conversa. Quem fixa e depois arquiva fica com uma
        conversa desafixada, e nada nesta API o reporta.

        **Regras**: o destino vai em `jid`; `chat` é aceite como nome
        universal e só vale quando `jid` faltar. Ausentes os dois, é
        `400 missing_jid` (medido). A operação é uma escrita de app-state, logo
        pode devolver `409 app_state_conflict` quando o estado local está
        dessincronizado do servidor.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              archive: true
              jid: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoArquivarConversa'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message: Chat archived
                  success: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SucessoMensagem'
                    type: object
          description: O patch de app-state foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_jid
                  message: missing jid in Payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `jid` e `chat`
            ausentes (`missing_jid`), JID mal formado (`invalid_chat_jid`) ou
            sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: app_state_conflict
                  message: 'app state conflict: the local state is out of sync with the server'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            O WhatsApp recusou o patch de app-state por conflito: a nossa cópia
            do estado está dessincronizada da dele. Repetir depois de uma
            sincronização pode funcionar.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Arquivar ou desarquivar uma conversa
      tags:
        - Conversas
  /chats/delete/message:
    post:
      description: |
        > **Substitui `POST /chat/delete/message`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Revoga uma mensagem própria: ela desaparece para todos os
        participantes, substituída pelo aviso do cliente.

        **Quando usar**: para retirar uma mensagem enviada por engano. Só faz
        sentido para mensagens próprias — revogar a mensagem de outra pessoa
        não é uma operação que o WhatsApp permita a um participante comum.

        **Regras**:

        - `phone` (ou o alias `chat`) e `id` são obrigatórios; faltar `id` é
          `400 missing_id`, medido.
        - `message_id` na resposta é o da mensagem APAGADA, e não o da mensagem
          de revogação que o envio criou — é o que responde à pergunta do
          cliente.
        - Um `id` inexistente NÃO é recusado: o WhatsApp aceita a revogação de
          um id que não conhece e nada acontece do outro lado.

        **Nota de nomes**: esta rota é a canónica. `POST /chat/delete` existiu
        como alias e foi REMOVIDA — apesar do nome, nunca apagou conversa
        nenhuma.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              id: 3EB0A4B2AFD45E625C0917
              phone: 554192421234@s.whatsapp.net
            schema:
              $ref: '#/components/schemas/PedidoApagarMensagem'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message_id: 3EB0A4B2AFD45E625C0917
                  status: deleted
                  timestamp: 1787747900
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoApagarMensagem'
                    type: object
          description: A revogação foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_id
                  message: missing Id in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `phone` e `chat`
            ausentes (`missing_phone`), `id` ausente (`missing_id`), destino
            mal formado (`invalid_phone`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Apagar para todos uma mensagem enviada
      tags:
        - Conversas
  /chats/download/{kind}:
    post:
      description: |
        A forma consolidada das cinco rotas de descarga que existiam antes do
        CAP-10 (`downloadimage`, `downloadvideo`, `downloadaudio`,
        `downloaddocument`, `downloadsticker`): baixa da CDN do WhatsApp o
        conteúdo indicado por `{kind}`, decifra-o e devolve-o como Data URL,
        com o kind na RELAÇÃO do caminho em vez de colado ao NOME da rota.

        **Por que consolidar**: as cinco rotas eram idênticas em lógica,
        diferindo só no kind — que o cliente já sabe antes de chamar, porque
        veio de `Message.imageMessage` / `videoMessage` / `audioMessage` /
        `documentMessage` / `stickerMessage` no `data_json` de
        `GET /chats/history`. Cinco nomes de rota duplicavam no NOME uma
        informação que agora vive na posição que a padronização de caminhos
        (F269, regra 2) reserva para relação: `/chats/download/{kind}`, não
        `/chats/download{kind}`.

        **As cinco formas anteriores foram REMOVIDAS em 2026-08-27**
        (HOUSEKEEP.md F297): a política de coexistência permanente do CAP-10
        foi revertida por decisão explícita de corte-limpo, já que nenhum
        cliente real dependia delas antes do lançamento. `/chat/downloadimage`
        e as quatro irmãs devolvem `404` agora — não redirecionam nem
        respondem mais.

        **Corpo**: os sete campos de `PedidoDescargaDeMidia`, sem `Kind` — o
        kind vem do caminho. Um corpo que ainda traga `Kind` não é rejeitado,
        mas o caminho tem prioridade (mesma convenção de
        `pkg/presentation/http/canonico.go`: o novo lugar não sobrescreve
        quem já dizia a mesma coisa).

        O pedido ainda decodifica `domain.DownloadRequest` directamente sem
        camada de DTO (`pkg/domain/download.go`) — mas as etiquetas já são
        `snake_case` desde 2026-08-27 (F338); ver `PedidoDescargaDeMidia` para
        o mapeamento contra os nomes de origem do `data_json`. A RESPOSTA já
        migrou e serve `mimetype`/`data` em minúsculas.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            Qual das cinco capabilities de download executar. Fora do enum é
            `400 unknown_media_kind`, e a porta de download não é alcançada.
          in: path
          name: kind
          required: true
          schema:
            enum:
              - image
              - video
              - audio
              - document
              - sticker
            example: image
            type: string
      requestBody:
        content:
          application/json:
            example:
              direct_path: /o1/v/t24/f2/m234/exemplo
              file_enc_sha256: ZXhlbXBsb0ZpbGVFbmNTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDA=
              file_length: 74
              file_sha256: ZXhlbXBsb0ZpbGVTSEEyNTZiYXNlNjQwMDAwMDAwMDAwMDAwMDA=
              media_key: SlpkRE1hd3FWcDFaZXhlbXBsb01lZGlhS2V5MDAwMDA=
              mimetype: image/png
              url: https://mmg.whatsapp.net/o1/v/t24/f2/m234/exemplo
            schema:
              $ref: '#/components/schemas/PedidoDescargaDeMidia'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  data: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
                  mimetype: image/png
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResultadoDescargaDeMidia'
                    type: object
          description: A mídia, decifrada e em Data URL.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: unknown_media_kind
                  message: Kind must be one of image, video, audio, document, sticker
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `{kind}` fora do enum
            (`unknown_media_kind`), `url` e `direct_path` ambos ausentes
            (`missing_url_or_direct_path`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "404":
          content:
            application/json:
              example:
                code: 404
                error:
                  code: media_unavailable
                  message: media is no longer available; it may have expired on the WhatsApp CDN
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            A CDN do WhatsApp respondeu 403, 404 ou 410: a mídia já não está
            disponível. Mídia antiga expira, e nesse caso repetir não ajuda.
        "500":
          content:
            application/json:
              example:
                code: 500
                error:
                  code: media_download_failed
                  message: failed to download media
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falha na descarga ou na decifragem (`media_download_failed`), ou
            conteúdo de zero bytes (`empty_media`) — que é tratado como erro de
            servidor, e não como um `200` com corpo vazio.
      security:
        - TokenSessao: []
      summary: ⬜ Descarregar a mídia de uma mensagem recebida, pelo kind no caminho
      tags:
        - Descarga de mídia
  /chats/ephemeral:
    post:
      description: |
        > **Substitui `POST /chat/ephemeral`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Liga, desliga ou muda o prazo ao fim do qual as mensagens desta
        conversa desaparecem sozinhas.

        **Quando usar**: quando a conversa não deve deixar rasto permanente do
        lado dos participantes.

        **Regras**:

        - `duration` é TEXTO, ao contrário do `mute_duration` de
          `/chat/mute` — aqui `"24h"` é o valor certo. O conjunto aceite é
          `"0"` ou `"off"` (desligar), `"24h"`, `"7d"` e `"90d"`. Qualquer
          outro é `400 invalid_duration`, medido com `"12h"`.
        - `chat` é obrigatório e NÃO tem alias: ausente é `400 missing_chat`.
        - `duration` ausente é `400 missing_duration` — distinto de
          `"0"`, que é um pedido explícito para desligar.
        - Vale para conversa individual e para grupo.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              chat: 554192421234@s.whatsapp.net
              duration: 24h
            schema:
              $ref: '#/components/schemas/PedidoTemporizadorDaConversa'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: Disappearing timer set
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: O temporizador foi definido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_duration
                  message: 'duration must be one of: 0, 24h, 7d, 90d'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `chat` ausente
            (`missing_chat`), `duration` ausente (`missing_duration`),
            `duration` fora do conjunto (`invalid_duration`), JID mal formado
            (`invalid_jid`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Definir o temporizador de mensagens temporárias da conversa
      tags:
        - Conversas
  /chats/ephemeral/default:
    post:
      description: |
        > **Substitui `POST /chat/ephemeral/default`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Define o prazo de desaparecimento que passa a valer para as conversas
        NOVAS desta conta.

        **Quando usar**: para que toda conversa iniciada a partir de agora
        nasça com mensagens temporárias, sem ter de as ligar uma a uma.

        **Regras**:

        - **Não altera conversa nenhuma que já exista.** Para essas, use
          `POST /chat/ephemeral`, conversa a conversa.
        - `duration` é texto e usa o mesmo conjunto: `"0"` ou `"off"`,
          `"24h"`, `"7d"`, `"90d"`. Fora dele é `400 invalid_duration`.
        - `duration` ausente é `400 missing_duration`, medido — não é o mesmo
          que enviar `"0"`.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              duration: "0"
            schema:
              $ref: '#/components/schemas/PedidoTemporizadorPadrao'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  details: Default disappearing timer set
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Detalhes'
                    type: object
          description: O temporizador padrão foi definido.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_duration
                  message: missing duration in payload
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Corpo ilegível (`could_not_decode_payload`), `duration` ausente
            (`missing_duration`), `duration` fora do conjunto
            (`invalid_duration`) ou sessão inexistente (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Definir o temporizador padrão da conta
      tags:
        - Conversas
  /chats/history:
    get:
      description: |
        > **Substitui `GET /chat/history`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Devolve as mensagens já gravadas de uma conversa, da mais recente para
        a mais antiga. É leitura do banco LOCAL, não do WhatsApp: responde com
        o telemóvel offline, e só contém o que a gravação de histórico
        capturou.

        **O parâmetro chama-se `chat_jid`, não `chat`.** É a única rota deste
        grupo com esse nome, e é medido: `?chat=` devolve
        `400 missing_chat_jid`.

        **Quando usar**: para reconstruir uma conversa, e para obter o
        `data_json` de onde saem os sete campos do descritor que as rotas
        `POST /chats/download/{kind}` exige.

        **Regras**:

        - `chat_jid=index` troca a resposta por um ÍNDICE: um mapa de id de
          sessão para a lista de conversas com a data da última mensagem. As
          duas formas de resposta são diferentes e sempre foram. O valor é
          SENSÍVEL A MAIÚSCULAS — `chat_jid=INDEX` é tratado como um JID
          normal e devolve `[]` (medido) — e `limit` é ignorado neste ramo:
          o índice volta inteiro (medido, 386 entradas com `limit=1`).
        - Uma conversa inexistente NÃO é erro: devolve `200` com `[]`.
        - Pedir com um `@lid` também traz as linhas guardadas sob o telefone da
          mesma pessoa, fundidas e desduplicadas por `message_id`. Medido em 30
          conversas reais: 27 vinham vazias sem essa fusão, porque estavam
          arquivadas sob o outro nome.
        - `limit` ausente, ou presente e vazio (`limit=`), é 50. Um `limit`
          que não seja INTEIRO — `abc`, `3.5` — é `400 invalid_limit`, ao
          contrário de `/chat/list` — aqui a recusa é no limite do fio, como o
          manipulador histórico fazia.
        - **Não há mínimo nem máximo.** O número vai directo para o `LIMIT` do
          SQL. Medido: `limit=0` devolve `[]` com `200`; `limit=-1` devolve
          TUDO (é o `LIMIT -1` do SQLite, "sem limite"), e `limit=99999`
          devolve o mesmo. Não existe tecto do lado do servidor.
        - O `limit` é aplicado DEPOIS da fusão `@lid`/telefone, logo corta o
          conjunto já fundido e não cada chave por si.
        - Não existe `offset`, `before`, `after` nem filtro por tipo: nenhum
          deles alguma vez existiu nesta rota.
        - Com a gravação de histórico desligada para a sessão, a resposta é
          `501 history_disabled`. A configuração é revalidada contra o banco
          antes de recusar, para que um cache velho não feche a rota.

        **Autenticação**: token de sessão.
      parameters:
        - description: |
            JID da conversa — contacto (`@lid` ou `@s.whatsapp.net`), grupo
            (`@g.us`) ou o valor reservado `index`.
          in: query
          name: chat_jid
          required: true
          schema:
            example: 554192421234@s.whatsapp.net
            type: string
        - description: |
            Quantas mensagens devolver. Padrão 50 quando ausente ou vazio.

            Sem mínimo e sem máximo: o valor vai directo para o `LIMIT` do
            SQL. `0` devolve `[]`; um valor negativo devolve TUDO (medido —
            `LIMIT -1` no SQLite é "sem limite"). Não inteiro é
            `400 invalid_limit`.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            example: 40
            type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  - chat_jid: 554192421234@s.whatsapp.net
                    data_json: '{"Info":{"Chat":"554192421234@s.whatsapp.net","ID":"3EB0A4B2AFD45E625C0917"},"Message":{"videoMessage":{"URL":"https://mmg.whatsapp.net/o1/v/t24/exemplo","directPath":"/o1/v/t24/exemplo","mediaKey":"SlpkRE1hd3FWcDFa","mimetype":"video/mp4","fileEncSha256":"ZXhlbXBsbw==","fileSha256":"ZXhlbXBsbw==","fileLength":"2010098"}}}'
                    id: 22777
                    media_link: ""
                    message_id: 3EB0A4B2AFD45E625C0917
                    message_type: video
                    sender_jid: 5516981818244@s.whatsapp.net
                    text_content: bateria video real
                    timestamp: "2026-08-26T08:40:23.498488-04:00"
                    user_id: 918e37366f27e1125ee0482a793267e1
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - items:
                              $ref: '#/components/schemas/MensagemDoHistorico'
                            type: array
                          - $ref: '#/components/schemas/IndiceDeConversas'
                    type: object
          description: |
            As mensagens da conversa, da mais recente para a mais antiga. Com
            `chat_jid=index`, `data` traz o índice em vez do array.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: missing_chat_jid
                  message: chat_jid is required
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Falta `chat_jid` (`missing_chat_jid`), `limit` não é número
            (`invalid_limit`), ou o token não tem sessão associada
            (`missing_session_id`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
        "501":
          content:
            application/json:
              example:
                code: 501
                error:
                  code: history_disabled
                  message: message history is disabled for this user
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            A gravação de histórico está desligada para esta sessão. Ligue-a em
            `POST /session/history` antes de voltar a chamar.
      security:
        - TokenSessao: []
      summary: ✅ Ler o histórico de mensagens de uma conversa
      tags:
        - Conversas
  /chats/list:
    get:
      description: |
        > **Substitui `GET /chat/list`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Devolve uma página da lista de conversas, ordenada da mais recente para
        a mais antiga. Junta três fontes que sozinhas não respondem "com quem
        falei por último": o histórico local, o roster de contactos e os nomes
        de grupo.

        **Quando usar**: para montar a lista lateral de um cliente, ou para
        descobrir o `jid` de uma conversa antes de chamar `GET /chat/history`.

        **Não traz mensagens.** A lista existe para ORDENAR conversas; trazer
        conteúdo tornaria-a cara sem a tornar mais útil.

        **Regras**:

        - `limit` fora de faixa é CORRIGIDO, não recusado: ausente ou `<= 0`
          vira 50, acima de 500 é cortado em 500.
        - Um valor não numérico em `limit` ou `offset` conta como AUSENTE, e a
          rota responde com o padrão em vez de `400` — é rota de leitura, e
          recusar tudo por um parâmetro decorativo seria desproporcional.
        - Nem toda conversa tem nome: medido nas contas reais, a maioria das
          pessoas sem nome não está no roster e para elas não há nome a obter.
          O campo `phone` é o identificador legível que sobra nesses casos, e
          só é resolvido para as conversas DA PÁGINA devolvida.
        - `status@broadcast` aparece na lista como se fosse uma conversa. São
          os status vistos, não um contacto.

        **Autenticação**: token de sessão.
      parameters:
        - description: Quantas conversas devolver. Padrão 50, tecto 500.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            example: 50
            maximum: 500
            type: integer
        - description: Quantas conversas saltar. Negativo vira zero.
          in: query
          name: offset
          required: false
          schema:
            default: 0
            example: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  chats:
                    - is_group: false
                      jid: 90937376170214@lid
                      last_activity: "2026-08-26T09:08:10.351982-04:00"
                      name: Lucas Albuqueque
                      phone: "554192421234"
                      push_name: Lucas Albuqueque
                    - is_group: true
                      jid: 120363411669320145@g.us
                      last_activity: "2026-08-24T19:01:14.41138-04:00"
                      name: wa-headless-lab — teste automatizado, pode apagar
                  limit: 3
                  offset: 0
                  total: 384
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PaginaDeConversas'
                    type: object
          description: Uma página da lista, com o total para paginar.
        "400":
          $ref: '#/components/responses/SemSessao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Listar as conversas por interação mais recente
      tags:
        - Conversas
  /chats/mute:
    post:
      description: |
        > **Substitui `POST /chat/mute`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Silencia as notificações de uma conversa por 8 horas, por 1 semana ou
        para sempre.

        > **Atenção ao formato de `mute_duration`.** É a ÚNICA rota do
        > inventário em que a duração é um NÚMERO INTEIRO DE NANOSSEGUNDOS, e
        > não texto — é um `*time.Duration` do Go. Enviar `"8h"` devolve
        > `400 could_not_decode_payload`, medido; o valor correcto é
        > `28800000000000`. A rota vizinha `/chat/ephemeral` faz o CONTRÁRIO e
        > aceita `"24h"` como texto.

        **Quando usar**: para calar uma conversa ruidosa sem a arquivar nem
        sair dela.

        **Regras**:

        - Só três valores são aceites: `28800000000000` (8 horas),
          `604800000000000` (1 semana) e `0` ou campo ausente (para sempre).
          Qualquer outro é `400 invalid_mute_duration`, com a mensagem a dizer
          o valor recebido — medido com `3600000000000` (1 hora).
        - Com `mute: false`, `mute_duration` é ignorado.
        - **Cuidado com o nome do campo.** Um campo desconhecido — `duration`,
          por exemplo — é ignorado pelo servidor (que desde 2026-08-26 o REGISTA no
          log, e o recusa com `400 unknown_field` se
          `WA_API_STRICT_UNKNOWN_FIELDS=true`), e a ausência de
          `mute_duration` significa **para sempre**. Enviar
          `{"mute": true, "duration": "8h"}` devolve `200` e cala a conversa
          **indefinidamente**, e não por oito horas. Medido; ver F268.
        - Destino em `jid`, com `chat` como alias.

        **Estado medido em campo (2026-08-26)**: a rota **funciona** — silenciar
        e reactivar devolvem `200` com as duas durações válidas, medido nesta
        data contra as sessões reais.

        Historicamente (F223) esta rota usava um patch de app-state do tipo
        `regular_high` e era recusada com `409 app_state_conflict`, ao contrário
        de `/chat/pin`, que usa `regular_low`. Esse defeito foi corrigido; o
        `409` continua documentado abaixo porque a classificação de conflito
        existe no código (`errmap/appstate.go`) e pode voltar a ocorrer se o
        estado local dessincronizar.

        **Autenticação**: token de sessão.
      requestBody:
        content:
          application/json:
            example:
              jid: 554192421234@s.whatsapp.net
              mute: true
              mute_duration: 28800000000000
            schema:
              $ref: '#/components/schemas/PedidoSilenciarConversa'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  message: Chat muted
                  success: true
                success: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SucessoMensagem'
                    type: object
          description: O patch de app-state foi aceite pelo WhatsApp.
        "400":
          content:
            application/json:
              example:
                code: 400
                error:
                  code: invalid_mute_duration
                  message: mute_duration must be 8h, 168h (1 week), or omitted (forever); got 1h0m0s
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            `mute_duration` como texto ou corpo ilegível
            (`could_not_decode_payload`), duração fora das três permitidas
            (`invalid_mute_duration`), `jid` e `chat` ausentes (`missing_jid`),
            JID mal formado (`invalid_chat_jid`) ou sessão inexistente
            (`no_session`).
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "409":
          content:
            application/json:
              example:
                code: 409
                error:
                  code: app_state_conflict
                  message: 'app state conflict: the local state is out of sync with the server'
                success: false
              schema:
                $ref: '#/components/schemas/Erro'
          description: |
            Conflito de app-state. **É a resposta que esta rota devolve hoje em
            campo** — ver a ressalva F223 na descrição.
        "500":
          $ref: '#/components/responses/ErroInterno'
      security:
        - TokenSessao: []
      summary: ✅ Silenciar ou dessilenciar uma conversa
      tags:
        - Conversas
