                  url: https://exemplo.com/pedido/1234
                - display_text: Ligar para a loja
                  phone_number: "+554192421234"
                  type: call
                - display_text: Já retirei
                  id: "1"
                  type: quickreply
              content: O seu pedido 1234 está pronto para retirada.
              footer: DisparaZap
              phone: 554192421234@s.whatsapp.net
