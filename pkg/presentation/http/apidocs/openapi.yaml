    post:
      description: |
        > **Substitui `POST /newsletter/info`.** O caminho antigo **continua a ser servido** e não tem data de remoção, mas deixou de ser documentado: uma operação, um nome. A tabela de equivalência completa está em `docs/ENDPOINTS.md`.

        Devolve o retrato de um canal: nome, descrição, código de convite,
        contagem de seguidores, estado e — o mais útil — **o papel de quem
        chama**, em `viewer.role`.

        **Quando usar**: para descobrir se a sessão é `owner`, `admin` ou
        `subscriber` antes de tentar uma operação de administração. Também é a
        forma de confirmar que um `delete` teve efeito: o canal apagado passa a
        `state: non_existing` com `viewer: null`.

        **Regras**: `jid` é obrigatório e tem de ser um JID `@newsletter`.
        `viewer` vem `null` quando não há relação com o canal.

        **Duas ressalvas medidas a 2026-08-26, ambas contra-intuitivas**:

        - **Um canal que não existe devolve `200`, não `404`.** A resposta traz
          `state: non_existing`, `jid: ""` (cadeia vazia, não o JID pedido),
          `viewer: null` e os textos todos zerados. Quem consome
          tem de olhar `state`, não o código HTTP.
        - **Um `jid` malformado devolve `400 invalid_newsletter_jid`** — medido
          com `"   "`, `"nao-e-jid"` e um JID `@s.whatsapp.net`. Até 2026-08-26
          os três davam `500` (F271), o que dizia ao cliente "o problema é meu,
          tenta outra vez" para um pedido que falharia sempre. A ausência
          continua a dar `missing_jid`, e a distinção é deliberada.
        - **`user_jid` ainda NÃO tem essa regra.** Medido:
          `{"jid":"<válido>","user_jid":"nao-e-jid"}` devolve `500`. Vale para as
          quatro operações que o exigem (`admin-invite`, `revoke`,
          `change-owner`, `demote`). Registado em F271, por corrigir.

        **Autenticação**: token de sessão.
