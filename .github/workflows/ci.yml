name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Version pinned deliberately: .golangci-baseline is an absolute issue
      # count, tied to this exact golangci-lint release. A floating version
      # would make the count drift with no code change — either a false-red
      # gate, or a real regression masked by a linter that stopped firing.
      # Bump this version and .golangci-baseline together, in the same PR.
      # A versao vive no Makefile (GOLANGCI_VERSION), num lugar so'.
      #
      # COMPILADO da versao fixada, nao baixado pronto. O golangci-lint carrega
      # o go/types da versao de Go com que o BINARIO foi compilado, e recusa
      # qualquer pacote que declare um Go mais novo. Nenhuma release publicada
      # e' compilada com 1.26 — nem a v2.12.2, cujo proprio go.mod declara
      # `go 1.25.0` — e este modulo esta em 1.26 por exigencia do chromedp
      # v0.16.0. O binario pronto nao consegue nem carregar os pacotes.
      #
      # `make lint-tool` compila com `go env GOVERSION`, que e' o Go que o
      # setup-go acima ja' escolheu a partir do go.mod. Local e CI usam o mesmo
      # alvo, entao rodam o mesmo linter compilado do mesmo jeito.
      #
      # Nao usamos a golangci-lint-action: ela roda `golangci-lint run` com o
      # exit code dela mesma assim que instala (o antigo `install-only` nao
      # existe mais em v6/v7), o que faz TODO achado falhar o job — inclusive
      # os que `make lint` trata como informativos. `make check` e' quem decide
      # o que trava, via .golangci-baseline.
      - name: build golangci-lint from the pinned version
        run: |
          make lint-tool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint config verify
        run: golangci-lint config verify

      - name: make check
        run: make check

      - name: baseline nunca sobe
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          prev=$(git show origin/${{ github.base_ref }}:.golangci-baseline 2>/dev/null | grep -oE '^max_complexity=[0-9]+' | cut -d= -f2)
          curr=$(grep -oE '^max_complexity=[0-9]+' .golangci-baseline | cut -d= -f2)
          prev=${prev:-999999}
          echo "max_complexity baseline: $prev -> $curr"
          [ "$curr" -le "$prev" ] || { echo "FALHA: o baseline subiu de $prev para $curr."; exit 1; }

      - name: docker build
        run: docker build -t wa-api:ci .
